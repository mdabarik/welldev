<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBMS Basics</title>
<meta name="description" content="DBMS basics: join-এর সব ধরন, index, SQL বনাম NoSQL (Cassandra সহ), data model বনাম ER, trigger ও cascading, view; ধাপে ধাপে D3 animation-এ।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* One card per interview question: short answer, 2-3 bullets, and a step-by-step D3 scene.
   Scenes are plain data (see TOPICS at the bottom): each step adds / modifies / deletes nodes by id
   and the tiny engine animates the difference. */
:root{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#f1f4fa; --fg:#0f172a; --muted:#5b6478; --faint:#94a0b8; --line:#e4e8f1;
  --accent:#6366f1;
  --a:#4f46e5; --b:#db2777; --g:#059669; --o:#d97706; --r:#e11d48; --s:#0284c7;
  --hero:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.14);
  --sans:"Inter","Hind Siliguri",system-ui,sans-serif; --bn:"Hind Siliguri","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a; --surface:#121827; --surface-2:#182033; --fg:#e7ecf6; --muted:#9aa6bf; --faint:#66728c; --line:#232c42;
  --accent:#818cf8; --a:#818cf8; --b:#f472b6; --g:#34d399; --o:#fbbf24; --r:#fb7185; --s:#38bdf8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0b0f1a; --surface:#121827; --surface-2:#182033; --fg:#e7ecf6; --muted:#9aa6bf; --faint:#66728c; --line:#232c42;
  --accent:#818cf8; --a:#818cf8; --b:#f472b6; --g:#34d399; --o:#fbbf24; --r:#fb7185; --s:#38bdf8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 var(--bn);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.86em;font-weight:500;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:color-mix(in srgb,var(--accent) 72%,var(--fg));padding:.1em .4em;border-radius:6px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 18px 70px}

.topnav{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font:800 16px var(--sans);letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 13px var(--mono);background:var(--hero)}
.topnav .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font:600 13px var(--sans);cursor:pointer;text-decoration:none}
.pill:hover{color:var(--fg)}

.hero{margin-top:20px;border-radius:22px;padding:26px 30px;color:#fff;background:var(--hero)}
.hero .eyebrow{font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h1{margin:6px 0 8px;font:800 clamp(26px,4.2vw,38px)/1.15 var(--sans);letter-spacing:-.03em}
.hero p{margin:0;max-width:680px;opacity:.94}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.jump a{min-width:32px;padding:0 6px;height:32px;display:grid;place-items:center;border-radius:9px;text-decoration:none;font:700 13px var(--sans);color:#fff;background:rgba(255,255,255,.18)}
.jump a:hover{background:rgba(255,255,255,.34)}

.parts{position:sticky;top:0;z-index:5;margin:14px -18px 0;padding:10px 18px;display:flex;gap:8px;overflow-x:auto;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none}
.parts a{flex:none;text-decoration:none;font:600 13px var(--sans);color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px}
.parts a:hover{color:var(--fg)}
.parts a b{color:var(--accent);margin-right:4px}

.part{margin-top:44px;scroll-margin-top:60px}
.part>h2{margin:0;font:800 clamp(20px,2.6vw,25px)/1.25 var(--sans);letter-spacing:-.02em}
.part>h2 span{color:var(--accent);margin-right:8px}

.q{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);scroll-margin-top:64px}
.q h3{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px;font:700 18px/1.4 var(--sans);letter-spacing:-.01em}
.skip{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:999px;font:600 12px var(--sans);font-style:normal;white-space:nowrap;color:var(--muted);background:var(--surface-2);border:1px dashed var(--faint);vertical-align:middle}
.num{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 14px var(--sans);background:var(--hero)}
.ans{margin:0 0 10px;padding:10px 14px;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.q ul{margin:0 0 12px;padding-left:20px;color:var(--muted)}
.q li{margin:2px 0}
.q li b,.ans b{color:var(--fg)}
.extra{margin:0 0 12px;overflow-x:auto}
.extra table{border-collapse:collapse;font:500 13px var(--mono)}
.extra th,.extra td{border:1px solid var(--line);padding:3px 10px;text-align:center}
.extra th{background:var(--surface-2)}
.extra .cmp td,.extra .cmp th{text-align:left;vertical-align:top;font:500 13.5px/1.55 var(--bn);min-width:150px}
.extra .cmp td:first-child{font-weight:700;white-space:nowrap;min-width:0}

.viz{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);overflow:hidden}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font:600 12.5px var(--sans);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{overflow-x:auto;padding-top:8px}
.stage svg{display:block;width:100%;min-width:680px;height:auto;cursor:pointer;user-select:none}
.cap{padding:10px 16px;min-height:3.4em;border-top:1px dashed var(--line);font-size:15px}
.ctl{display:flex;align-items:center;gap:8px;padding:0 12px 12px}
.b{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 14px;font:600 13px var(--sans);cursor:pointer}
.b:hover:not(:disabled){border-color:var(--accent)}
.b:disabled{opacity:.4;cursor:default}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.cnt{margin-left:auto;font:500 12px var(--mono);color:var(--faint)}

/* svg scene */
svg text,svg tspan{white-space:pre}
svg text{font-family:var(--sans);font-size:13px;fill:var(--fg);dominant-baseline:central}
.c-n{--cc:var(--muted)} .c-a{--cc:var(--a)} .c-b{--cc:var(--b)} .c-g{--cc:var(--g)}
.c-o{--cc:var(--o)} .c-r{--cc:var(--r)} .c-s{--cc:var(--s)} .c-f{--cc:var(--fg)}
.box rect,.circ circle{fill:color-mix(in srgb,var(--cc) 14%,var(--surface));stroke:var(--cc);stroke-width:1.6;transition:fill .45s,stroke .45s}
.dash rect,.dash circle{stroke-dasharray:6 4;fill:color-mix(in srgb,var(--cc) 4%,transparent)}
.hl rect,.hl circle{stroke-width:3.4;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--cc) 65%,transparent))}
.text text{fill:var(--cc);transition:fill .45s}
.text.b text,.text.lg text{font-weight:700}
.text.lg text{font-size:15px}
.sm text{font-size:11.5px}
.m text{font-family:var(--mono);font-size:12px}
.path path{fill:none;stroke:var(--cc);stroke-width:3.4;stroke-linecap:round}
.arrow line{stroke:var(--cc);stroke-width:2.2;transition:stroke .4s}
.arrow.dash line{stroke-dasharray:6 4}
.arrow.hl line{stroke-width:3.4}
footer{margin-top:50px;text-align:center;color:var(--faint);font:500 13px var(--sans)}

.q .ans code,.q li code{white-space:nowrap}
.hero{background:linear-gradient(135deg,#0ea5e9 0%,#6366f1 50%,#a855f7 100%)}
.extra .cmp td code,.extra .cmp td{font-size:13px}
.extra pre{margin:10px 0 0;padding:10px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font:500 12.5px/1.6 var(--mono);overflow-x:auto;white-space:pre-wrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div class="wrap">
  <nav class="topnav">
    <a class="brand" href="../../index.html"><span class="logo">W</span>WellDev</a>
    <span class="sp"></span>
    <button class="pill" id="theme" type="button">Theme</button>
  </nav>
  <header class="hero">
    <div class="eyebrow">DBMS · Basics</div>
    <h1>DBMS Basics: ৬টি প্রশ্ন</h1>
    <p>Join-এর সব ধরন, index, SQL বনাম NoSQL, data model বনাম ER diagram, trigger ও cascading, আর view। প্রতিটা ধাপে animation, scene-এ ক্লিক করো বা <b>Next</b> চাপো।</p>
  </header>
  <nav class="parts" id="parts"></nav>
  <main id="app"></main>
  <footer>DBMS · Basics</footer>
</div>
<script>
/* ---------- theme ---------- */
(function(){
  const root=document.documentElement,btn=document.getElementById('theme');
  try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t;}catch(e){}
  const dark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const label=()=>btn.textContent=dark()?'Light':'Dark';
  btn.onclick=()=>{root.dataset.theme=dark()?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme);}catch(e){}label();};
  label();
})();

/* ---------- scene engine ---------- */
const COLORS=['n','a','b','g','o','r','s','f'];
document.getElementById('defs').innerHTML=COLORS.map(c=>
  `<marker id="ah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--${c==='n'?'muted':c==='f'?'fg':c})"/></marker>`).join('');

const B=(id,x,y,w,h,label,c='n',o={})=>({id,k:'box',x,y,w,h,label,c,...o});
const T=(id,x,y,label,o={})=>({id,k:'text',x,y,label,c:'n',...o});
const A=(id,x1,y1,x2,y2,c='n',o={})=>({id,k:'arrow',x:0,y:0,x1,y1,x2,y2,c,...o});
const C=(id,x,y,r,label,c='n',o={})=>({id,k:'circ',x,y,r,label,c,...o});
const S=(cap,o={})=>({cap,...o});
const P=(id,d,c='n',o={})=>({id,k:'path',x:0,y:0,d,c,...o});

function stateAt(steps,i){
  const m=new Map();
  for(let k=0;k<=i;k++){
    const s=steps[k];
    (s.del||[]).forEach(id=>m.delete(id));
    (s.add||[]).forEach(n=>m.set(n.id,{...n}));
    Object.entries(s.mod||{}).forEach(([id,p])=>{if(m.has(id))Object.assign(m.get(id),p);});
  }
  return [...m.values()];
}

function setText(g,cls,str,x,y,anchor,lh=15.5){
  let tx=g.select('text.'+cls);
  if(tx.empty())tx=g.append('text').attr('class',cls);
  const ls=String(str??'').split('\n');
  tx.attr('text-anchor',anchor);
  tx.selectAll('tspan').data(ls).join('tspan').attr('x',x).attr('y',(d,i)=>y-(ls.length-1)*lh/2+i*lh).text(d=>d);
}

function upd(g,d,t){
  g.attr('class',`n ${d.k} c-${d.c||'n'}${d.dash?' dash':''}${d.hl?' hl':''}${d.s?' '+d.s:''}${d.m?' m':''}`);
  if(d.k==='box'){
    let r=g.select('rect');
    if(r.empty())r=g.insert('rect',':first-child').attr('rx',9).attr('width',d.w).attr('height',d.h);
    r.transition(t).attr('width',d.w).attr('height',d.h);
    setText(g,'lb',d.label,d.w/2,d.h/2,'middle');
  }else if(d.k==='circ'){
    let r=g.select('circle');
    if(r.empty())r=g.insert('circle',':first-child').attr('r',d.r);
    r.transition(t).attr('r',d.r);
    setText(g,'lb',d.label,0,0,'middle');
  }else if(d.k==='text'){
    setText(g,'lb',d.label,0,0,d.a||'start');
  }else if(d.k==='path'){
    let p=g.select('path');
    if(p.empty()){p=g.append('path').attr('d',d.d);const L=p.node().getTotalLength();p.attr('stroke-dasharray',L).attr('stroke-dashoffset',L).transition(t).attr('stroke-dashoffset',0);}
  }else if(d.k==='arrow'){
    let l=g.select('line');
    if(l.empty())l=g.append('line').attr('x1',d.x1).attr('y1',d.y1).attr('x2',d.x2).attr('y2',d.y2);
    l.attr('marker-end',`url(#ah-${d.c||'n'})`).transition(t).attr('x1',d.x1).attr('y1',d.y1).attr('x2',d.x2).attr('y2',d.y2);
  }
}

function draw(svg,nodes,dur){
  const t=d3.transition().duration(dur).ease(d3.easeCubicInOut);
  svg.select('.layer').selectAll('g.n').data(nodes,d=>d.id).join(
    en=>en.append('g').attr('opacity',0).attr('transform',d=>`translate(${d.x},${d.y})`),
    up=>up,
    ex=>ex.transition(t).attr('opacity',0).remove()
  ).each(function(d){upd(d3.select(this),d,t);})
   .transition(t).attr('transform',d=>`translate(${d.x},${d.y})`).attr('opacity',d=>d.o??1);
}

function mount(host,topic){
  const tabs=topic.tabs||[{n:'',steps:topic.steps}];
  host.innerHTML='<div class="tabs"></div><div class="stage"><svg viewBox="0 0 760 240" role="img"><g class="layer"></g></svg></div><div class="cap"></div><div class="ctl"><button class="b prev" type="button">◀</button><button class="b pri next" type="button">Next ▶</button><span class="cnt"></span></div>';
  const svg=d3.select(host).select('svg'),cap=host.querySelector('.cap'),cnt=host.querySelector('.cnt');
  const prev=host.querySelector('.prev'),next=host.querySelector('.next'),tabBox=host.querySelector('.tabs');
  let ti=0,si=0,steps;
  function show(dur){
    draw(svg,stateAt(steps,si),dur);
    cap.innerHTML=steps[si].cap;
    cnt.textContent=`${si+1} / ${steps.length}`;
    prev.disabled=si===0;
    next.textContent=si===steps.length-1?'↻ আবার':'Next ▶';
  }
  function load(i){
    ti=i;si=0;
    const tb=tabs[ti];steps=typeof tb.steps==='function'?tb.steps():tb.steps;
    tabBox.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===ti));
    show(0);
  }
  if(tabs.length>1){
    tabs.forEach((tb,i)=>{const b=document.createElement('button');b.type='button';b.textContent=tb.n;b.onclick=()=>load(i);tabBox.appendChild(b);});
  }else tabBox.remove();
  const go=()=>{si=si===steps.length-1?0:si+1;show(600);};
  next.onclick=go;svg.on('click',go);
  prev.onclick=()=>{if(si>0){si--;show(600);}};
  load(0);
}


/* ---------- content ---------- */
const PARTS=[['1','Joins'],['2','Clustered বনাম Non-clustered'],['3','SQL বনাম NoSQL'],['4','Data Model বনাম ER'],['5','Trigger ও Cascading'],['6','Views']];

/* ===== 1. Joins ===== */
const JEMP={lt:'employees',rt:'departments',header:'name  |  dept',
  L:[{label:'1  Rahim   dept=10',key:10,n:'Rahim'},{label:'2  Karim   dept=20',key:20,n:'Karim'},{label:'3  Sumon   dept=NULL',key:null,n:'Sumon'},{label:'4  Anika   dept=30',key:30,n:'Anika'}],
  R:[{label:'10  Sales',id:10,n:'Sales'},{label:'20  HR',id:20,n:'HR'},{label:'40  IT',id:40,n:'IT'}],
  sql:{INNER:'SELECT e.name, d.name FROM employees e INNER JOIN departments d ON e.dept = d.id;',LEFT:'SELECT e.name, d.name FROM employees e LEFT JOIN departments d ON e.dept = d.id;',RIGHT:'SELECT e.name, d.name FROM employees e RIGHT JOIN departments d ON e.dept = d.id;',FULL:'SELECT e.name, d.name FROM employees e FULL OUTER JOIN departments d ON e.dept = d.id;',CROSS:'SELECT e.name, d.name FROM employees e CROSS JOIN departments d;'},
  intro:{
    INNER:'<b>INNER JOIN:</b> শুধু যাদের <b>দুই table-এই match আছে</b> তারা ফলে আসে। Employee-র dept আর department-এর id মিললে row ঢোকে।',
    LEFT:'<b>LEFT JOIN:</b> <b>বাঁ table (employees)-এর সব row</b> আসে। ডানে match না থাকলে ডানের অংশ <b>NULL</b>।',
    RIGHT:'<b>RIGHT JOIN:</b> <b>ডান table (departments)-এর সব row</b> আসে। বাঁয়ে match না থাকলে বাঁয়ের অংশ <b>NULL</b>।',
    FULL:'<b>FULL OUTER JOIN:</b> <b>দুই table-এর সব row</b> আসে। যেখানে match নেই সেখানে অন্য পাশ NULL।',
    CROSS:'<b>CROSS JOIN:</b> কোনো শর্ত নেই। <b>প্রতিটা employee × প্রতিটা department</b> (Cartesian product): 4 × 3 = 12 row।'}};
function joinScene(cfg,type){
  const {L,R}=cfg,RH=type==='CROSS'?15:21;let k=0,prev=[];
  const base=[T('lt',20,12,cfg.lt,{c:'a',s:'sm b'}),...L.map((r,i)=>B('l'+i,20,26+i*38,230,32,r.label,'a',{m:1,s:'sm'})),T('rt',270,12,cfg.rt,{c:'b',s:'sm b'}),...R.map((r,i)=>B('r'+i,270,26+i*38,170,32,r.label,'b',{m:1,s:'sm'})),
    B('of',470,8,270,214,'','g',{dash:1}),T('oh',482,22,cfg.header,{c:'n',s:'m b'}),T('sql',20,232,cfg.sql[type],{c:'f',s:'m'})];
  const steps=[S(cfg.intro[type],{add:base})];
  const row=(txt,c)=>{const n=T('o'+k,482,44+k*RH,txt,{c,s:'m'});k++;return n;};
  const clr=()=>Object.fromEntries(prev.map(id=>[id,{hl:0,c:id[0]==='l'?'a':'b'}]));
  const norm=(arr)=>arr;
  if(type==='INNER'||type==='LEFT'){
    L.forEach((l,i)=>{const m=R.findIndex(r=>r.id===l.key);const mod={...clr()};prev=['l'+i];mod['l'+i]={hl:1,c:m>=0?'g':'r'};const add=[];
      if(m>=0){mod['r'+m]={hl:1,c:'g'};prev.push('r'+m);add.push(row(`${l.n}  |  ${R[m].n}`,'g'));}
      else if(type==='LEFT')add.push(row(`${l.n}  |  NULL`,'o'));
      const cap=m>=0?`<b>${l.n}</b> (dept ${l.key}): departments-এ <b>${R[m].n}</b> পাওয়া গেল, তাই ফলে ঢুকল।`:(type==='LEFT'?`<b>${l.n}</b>: ${l.key==null?'dept NULL':'dept '+l.key+' departments-এ নেই'}। Match নেই, কিন্তু LEFT JOIN বাঁয়ের সব row রাখে, তাই <b>NULL সহ</b> ঢুকল।`:`<b>${l.n}</b>: ${l.key==null?'dept NULL':'dept '+l.key+' departments-এ নেই'}। Match নেই, INNER JOIN-এ তাই <b>বাদ</b>।`);
      steps.push(S(cap,{add,mod}));});
  }else if(type==='RIGHT'){
    R.forEach((r,j)=>{const ms=L.map((l,i)=>l.key===r.id?i:-1).filter(i=>i>=0);const mod={...clr()};mod['r'+j]={hl:1,c:ms.length?'g':'r'};prev=['r'+j];const add=[];
      ms.forEach(i=>{mod['l'+i]={hl:1,c:'g'};prev.push('l'+i);add.push(row(`${L[i].n}  |  ${r.n}`,'g'));});
      if(!ms.length)add.push(row(`NULL  |  ${r.n}`,'o'));

/* ===== Cassandra ===== */
const CASS=[
  S('<b>Cassandra:</b> wide-column NoSQL, অনেক node নিয়ে একটা <b>ring</b>। <b>কোনো master নেই</b>, সব node সমান। বিশাল write আর সবসময় চালু থাকার জন্য বানানো।',{add:[B('cl',20,10,130,50,'Client\n(app)','a'),B('n1',330,8,120,50,'Node A','g'),B('n2',560,95,120,50,'Node B','g'),B('n3',330,182,120,50,'Node C','g'),B('n4',100,95,120,50,'Node D','g'),A('r1',452,34,560,100,'n',{dash:1}),A('r2',590,147,452,196,'n',{dash:1}),A('r3',328,206,222,146,'n',{dash:1}),A('r4',150,93,330,40,'n',{dash:1})]}),
  S('<b>Write:</b> <code>INSERT user_id = 42</code>। Cassandra <b>partition key</b> (user_id) <b>hash</b> করে বের করে কোন node-এর দায়িত্ব। এখানে <b>Node B</b>।',{add:[A('w1',152,40,556,112,'a'),T('w1l',330,98,'hash(42) → Node B',{a:'middle',c:'a',s:'sm b'})],mod:{n2:{c:'a',hl:1}}}),
  S('<b>Replication:</b> data আরও দুটো node-এ কপি হয় (replication factor = 3): Node C আর Node D। একটা node মরলেও data অন্যত্র আছে।',{del:['w1','w1l'],mod:{n3:{c:'o',hl:1,label:'Node C\nকপি'},n4:{c:'o',hl:1,label:'Node D\nকপি'},n2:{label:'Node B\nমূল (primary)'}}}),
  S('<b>একটা node বন্ধ</b> (Node B crash)। তবু read/write চলে, কারণ কপি আছে Node C ও D-তে। কোনো single point of failure নেই।',{mod:{n2:{c:'r',hl:0,dash:1,label:'Node B\nবন্ধ ✗'},n3:{hl:0},n4:{hl:0}}}),
  S('<b>Query:</b> partition key দিয়েই দ্রুত। <b>JOIN নেই</b>। তাই schema বানাতে হয় <b>query-র কথা ভেবে</b>। বদলে লক্ষ লক্ষ write/sec আর সহজ scale। Consistency সাধারণত eventual।',{add:[T('qq',380,120,'SELECT * FROM users WHERE user_id = 42;\nJOIN নেই, query অনুযায়ী table',{a:'middle',c:'f',s:'m'})]})
];

    A('f1',302,46,222,46,'n',{dash:1}),A('f2',302,90,222,90,'n',{dash:1}),A('f3',302,134,222,46,'n',{dash:1}),

  const sql={CASCADE:'DELETE FROM departments WHERE id = 10;   -- FK: ON DELETE CASCADE',SETNULL:'DELETE FROM departments WHERE id = 10;   -- FK: ON DELETE SET NULL',RESTRICT:'DELETE FROM departments WHERE id = 10;   -- FK: ON DELETE RESTRICT'}[action];
  const steps=[S(intro,{add:base}),S('<b>Department 10 (Sales)</b> মুছতে চাই। Employees-এ Rahim আর Sumon এই department-এ আছে।',{mod:{qq:{label:sql},d0:{c:'r',hl:1},e0:{c:'o',hl:1},e2:{c:'o',hl:1}}})];

  if(action==='RESTRICT')steps.push(S('Restrict: Database <b>প্রত্যাখ্যান</b> করে: "Sales-এ এখনো employee আছে।" কিছুই মোছা হয় না। আগে employee সরাও, তারপর department।',{mod:{d0:{c:'r',hl:1},rs:{label:'ERROR: foreign key violation, row এখনো referenced',c:'r'}}}));
  steps.push(S({CASCADE:'<b>কখন:</b> child যার parent ছাড়া অর্থ নেই (order → order_items)। <b>ON UPDATE CASCADE</b>-ও আছে: parent-এর key বদলালে child-এ নিজে বদলায়।',SETNULL:'<b>কখন:</b> child parent ছাড়াও টিকে থাকতে পারে (যেমন employee department ছাড়াও থাকে)।',RESTRICT:'<b>কখন:</b> গুরুত্বপূর্ণ data, যেখানে ভুলে মোছা চলবে না (টাকা-পয়সা, record)। সবচেয়ে নিরাপদ।'}[action],{}));
  return steps;
}

{p:0,q:'Different types of joins (all joins with example)',

 pts:['উদাহরণের table: <b>employees</b> (Sumon-এর dept NULL, Anika-র dept 30 যা departments-এ নেই) আর <b>departments</b> (IT-তে কোনো employee নেই)।','<b>INNER:</b> দু-পাশে match থাকলেই। <b>LEFT:</b> বাঁয়ের সব। <b>RIGHT:</b> ডানের সব। <b>FULL:</b> দুই পাশের সব। <b>CROSS:</b> সব জোড়া।','<b>NULL</b> মানে "ওই পাশে match নেই"।'],

{p:1,q:'Clustered vs non-clustered indexing (types and examples)',
 ans:'<b>Clustered index:</b> table-এর <b>row গুলোই</b> index-এর key অনুযায়ী সাজানো, leaf-ই data। তাই <b>একটা table-এ একটাই</b>। <b>Non-clustered index:</b> table থেকে <b>আলাদা</b> structure, ভেতরে key + row-এর <b>pointer</b>। <b>অনেকগুলো</b> থাকতে পারে।',
 pts:['<b>Clustered:</b> range query দ্রুত (পাশাপাশি row)। সাধারণত primary key-তে।','<b>Non-clustered:</b> আলাদা column-এ (email) দ্রুত খোঁজা, কিন্তু pointer ধরে table-এ যেতে বাড়তি ধাপ।','নিচের table-এ তুলনা আর SQL উদাহরণ।'],
 extra:'<table class="cmp"><tr><th></th><th>Clustered</th><th>Non-clustered</th></tr>'
  +'<tr><td>Data কোথায়</td><td>index-এর leaf-ই আসল row</td><td>leaf-এ শুধু key + pointer, row আলাদা table-এ</td></tr>'
  +'<tr><td>কয়টা</td><td>table-এ একটাই</td><td>অনেকগুলো</td></tr>'
  +'<tr><td>Lookup</td><td>সরাসরি row পায়</td><td>index → pointer → row (বাড়তি ধাপ)</td></tr>'
  +'<tr><td>Range query</td><td>খুব দ্রুত</td><td>তুলনায় ধীর (row ছড়ানো)</td></tr>'
  +'<tr><td>লেখার খরচ</td><td>row সাজানো রাখার খরচ</td><td>প্রতিটা index আপডেটের খরচ</td></tr></table>'
  +'<pre>-- SQL Server\nCREATE CLUSTERED INDEX ix_users_id ON users(id);\nCREATE NONCLUSTERED INDEX ix_users_email ON users(email);\n\n-- MySQL (InnoDB): PRIMARY KEY নিজেই clustered; অন্য index-এর leaf-এ PK মান থাকে\nCREATE INDEX ix_email ON users(email);\n\n-- PostgreSQL: সব index non-clustered (heap table); CLUSTER শুধু একবার সাজিয়ে দেয়\nCREATE INDEX ix_email ON users(email);</pre>',
 tabs:[{n:'Clustered index',steps:CLUSTERED},{n:'Non-clustered index',steps:NONCLUST}]},

{p:2,q:'SQL vs NoSQL (when to use what and why)',
 ans:'<b>SQL (relational):</b> fixed schema-র table, <b>JOIN</b>, <b>ACID</b> transaction। <b>NoSQL:</b> flexible schema, সহজে <b>horizontal scale</b>, চার ধরন (document, key-value, column, graph)। কোনটা ভালো না, <b>কাজ অনুযায়ী</b> বাছাই।',
 pts:['<b>SQL বেছে নাও</b> যখন: স্পষ্ট সম্পর্ক, transaction (ব্যাংক, order), জটিল রিপোর্ট।','<b>NoSQL বেছে নাও</b> যখন: বিশাল scale, schema বারবার বদলায়, শুধু key দিয়ে দ্রুত read, বা সম্পর্কই মূল (graph)।','বাস্তবে দুটোই একসাথে ব্যবহার হয়।'],
 extra:'<table class="cmp"><tr><th></th><th>SQL</th><th>NoSQL</th></tr>'
  +'<tr><td>Schema</td><td>আগে থেকে ঠিক করা, সবার একই</td><td>flexible, document অনুযায়ী আলাদা</td></tr>'
  +'<tr><td>Scale</td><td>সাধারণত vertical (বড় server)</td><td>সহজে horizontal (অনেক server)</td></tr>'
  +'<tr><td>Transaction</td><td>পূর্ণ ACID</td><td>অনেক ক্ষেত্রে eventual consistency (কিছু ACID-ও দেয়)</td></tr>'
  +'<tr><td>Query</td><td>SQL, JOIN</td><td>নিজস্ব API/query, JOIN কম</td></tr>'
  +'<tr><td>উদাহরণ</td><td>PostgreSQL, MySQL</td><td>MongoDB, Redis, Cassandra, Neo4j</td></tr></table>',
 tabs:[{n:'SQL',steps:SQLTAB},{n:'NoSQL (document)',steps:DOCTAB},{n:'NoSQL-এর ৪ ধরন',steps:NOSQLTYPES},{n:'Cassandra',steps:CASS},{n:'কখন কোনটা',steps:WHEN}]},

{p:3,q:'Data model vs ER diagram (with example)',
 ans:'<b>Data model</b> = data কীভাবে সাজানো হবে তার নকশা (conceptual, logical, physical তিন স্তরে)। <b>ER diagram</b> = সেই নকশার <b>conceptual স্তর আঁকার diagram</b>: entity, attribute, relationship। অর্থাৎ ER diagram হল data model প্রকাশ করার একটা উপায়।',
 pts:['<b>Data model:</b> ধারণা। উদাহরণ: relational, document, graph model।','<b>ER diagram:</b> ছবি/টুল। conceptual model আঁকতে ব্যবহার হয়।','উদাহরণ: Student ─ Enrolls ─ Course (M : N), যা শেষে তিনটা table হয়।'],
 extra:'<table class="cmp"><tr><th></th><th>Data model</th><th>ER diagram</th></tr>'
  +'<tr><td>কী</td><td>data সাজানোর ধারণা/নকশা</td><td>তার conceptual রূপ আঁকার diagram</td></tr>'
  +'<tr><td>স্তর</td><td>conceptual, logical, physical</td><td>মূলত conceptual</td></tr>'
  +'<tr><td>উপাদান</td><td>table/document/graph, key, constraint</td><td>entity, attribute, relationship, cardinality</td></tr>'
  +'<tr><td>উদাহরণ</td><td>students, courses, enrollments table</td><td>Student ─ M:N ─ Course আঁকা</td></tr></table>',
 tabs:[{n:'Data model-এর ৩ স্তর',steps:LEVELS},{n:'ER diagram আঁকা',steps:ERBUILD},{n:'ER থেকে Table',steps:ERTABLES}]},

{p:4,q:'Triggers and cascading',
 ans:'<b>Trigger:</b> event (INSERT/UPDATE/DELETE) হলে database-এর ভেতরের কোড <b>নিজে থেকে চলে</b>। <b>Cascading:</b> foreign key-র নিয়ম, <b>parent row মুছলে বা বদলালে child row-এর কী হবে</b> (CASCADE, SET NULL, RESTRICT)। দুটোই database নিজে data ঠিক রাখে।',
 pts:['<b>Trigger-এর ধরন:</b> BEFORE / AFTER, row-level / statement-level। উদাহরণ: audit log।','<b>ON DELETE CASCADE:</b> child-ও মুছে যায়। <b>SET NULL:</b> child থাকে, FK NULL। <b>RESTRICT:</b> মুছতে দেয় না।'],
 tabs:[{n:'Trigger',steps:TRIG},{n:'ON DELETE CASCADE',steps:()=>casScene('CASCADE')},{n:'SET NULL',steps:()=>casScene('SETNULL')},{n:'RESTRICT',steps:()=>casScene('RESTRICT')}]},

{p:5,q:'Views (and materialized views)',
 ans:'<b>View</b> = একটা সংরক্ষিত query, যাকে virtual table-এর মতো ব্যবহার করা যায়। নিজের data নেই, প্রতিবার আসল table থেকে পড়ে, তাই সবসময় তাজা। <b>Materialized view</b> = ফল সত্যিই সংরক্ষিত, দ্রুত, কিন্তু refresh না করলে পুরনো।',
 pts:['<b>কেন:</b> জটিল query সহজ করা, column লুকিয়ে security, application-কে স্থির interface।','<b>View:</b> তাজা। <b>Materialized view:</b> দ্রুত কিন্তু stale হতে পারে।'],
 tabs:[{n:'View',steps:VIEWS},{n:'Materialized view',steps:MATVIEW}]}
];
