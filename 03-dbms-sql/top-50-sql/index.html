-unit line and Office Chair only its 30-unit line; Monitor has no lines left at all."},{"kind":"having","title":"Step 3 — GROUP BY product, SUM units, HAVING >= 100","diagram":"Desk Lamp     ├─ 60  └─ 40   → SUM = 100  ✓ (>= 100)\nUSB Cable     └─ 50          → SUM =  50  ✗\nOffice Chair  └─ 30          → SUM =  30  ✗\nNotebook      ├─ 70  └─ 80   → SUM = 150  ✓","sql":"SELECT p.product_id,\n       p.product_name,\n       COUNT(*)            AS feb_orders,\n       SUM(o.unit)         AS feb_units,\n       SUM(o.unit) >= 100  AS kept\nFROM Orders AS o\nINNER JOIN Products AS p\n        ON p.product_id = o.product_id\nWHERE o.order_date >= DATE '2020-02-01'\n  AND o.order_date <  DATE '2020-03-01'\nGROUP BY p.product_id, p.product_name\nORDER BY p.product_id;","text":"All four groups with their February totals. HAVING removes USB Cable (50) and Office Chair (30). Desk Lamp is exactly 100 and survives because the test is `>=`, not `>`."}],"flow":[{"label":"Input tables","detail":"Products (5) · Orders (9)","ref":"input"},{"label":"WHERE February 2020","detail":">= Feb 1 AND < Mar 1 → 6 order lines","ref":0},{"label":"JOIN Products","detail":"attach product names","ref":1},{"label":"GROUP BY + HAVING","detail":"SUM(unit) per product, keep >= 100","ref":2},{"label":"Final output","detail":"Desk Lamp 100 · Notebook 150","ref":"output"}],"takeaway":{"pattern":"\"Total per X in period P, only if ≥ N\" → WHERE date in [start, next_start) → GROUP BY X → HAVING SUM(…) >= N.","asks":["Why not `BETWEEN '2020-02-01' AND '2020-02-29'`? (It works for DATE, but you must know the last day of the month, and with a TIMESTAMP column it would miss everything after midnight on Feb 29.)","Why HAVING and not WHERE for the 100 rule? (WHERE filters single rows before grouping; the total only exists after GROUP BY.)","What if a product name appears twice with different ids? (Grouping by product_id keeps them separate; grouping only by name would merge them.)"],"alternatives":["`WHERE TO_CHAR(o.order_date, 'YYYY-MM') = '2020-02'` — very readable, but the function on the column prevents using an index on order_date.","`WHERE EXTRACT(YEAR FROM o.order_date) = 2020 AND EXTRACT(MONTH FROM o.order_date) = 2` — same idea with EXTRACT.","`WHERE DATE_TRUNC('month', o.order_date) = DATE '2020-02-01'` — PostgreSQL-specific, also not index-friendly.","Aggregate first in a CTE (SUM per product_id for February, HAVING >= 100), then join to Products for the names."],"realworld":"Monthly reports: products above a sales threshold, customers who spent at least X last quarter, sensors with more than N alerts this week. The half-open range `>= start AND < next_start` is the standard, index-friendly way to filter a period."},"mistakes":["`order_date <= '2020-02-28'` — forgets that 2020 is a leap year and drops Feb 29.","`LIKE '2020-02%'` on a DATE — PostgreSQL has no LIKE for dates; you would need a cast to text, which is fragile and not index-friendly.","Filtering by month only (`EXTRACT(MONTH …) = 2`) — also counts February of other years (Monitor, 2021).","Putting `SUM(unit) >= 100` in WHERE — aggregates are not allowed in WHERE.","Using `> 100` instead of `>= 100` — drops products with exactly 100 units (Desk Lamp)."],"built":{"id":49,"inputs":[{"name":"Products","columns":["product_id","product_name","product_category"],"types":["integer","character varying(40)","character varying(40)"],"rows":[[1,"Desk Lamp","Home"],[2,"USB Cable","Electronics"],[3,"Office Chair","Furniture"],[4,"Notebook","Stationery"],[5,"Monitor","Electronics"]]},{"name":"Orders","columns":["product_id","order_date","unit"],"types":["integer","date","integer"],"rows":[[1,"2020-02-01",60],[1,"2020-02-29",40],[2,"2020-01-31",200],[2,"2020-02-14",50],[3,"2020-02-10",30],[3,"2020-03-01",90],[4,"2020-02-05",70],[4,"2020-02-20",80],[5,"2021-02-10",300]]}],"visuals":[{"columns":["product_id","order_date","unit","on_or_after_feb_1","before_mar_1","in_feb_2020"],"types":["integer","date","integer","boolean","boolean","boolean"],"rows":[[1,"2020-02-01",60,true,true,true],[1,"2020-02-29",40,true,true,true],[2,"2020-01-31",200,false,true,false],[2,"2020-02-14",50,true,true,true],[3,"2020-02-10",30,true,true,true],[3,"2020-03-01",90,true,false,false],[4,"2020-02-05",70,true,true,true],[4,"2020-02-20",80,true,true,true],[5,"2021-02-10",300,true,false,false]]},{"columns":["product_id","product_name","order_date","unit"],"types":["integer","character varying(40)","date","integer"],"rows":[[1,"Desk Lamp","2020-02-01",60],[1,"Desk Lamp","2020-02-29",40],[2,"USB Cable","2020-02-14",50],[3,"Office Chair","2020-02-10",30],[4,"Notebook","2020-02-05",70],[4,"Notebook","2020-02-20",80]]},{"columns":["product_id","product_name","feb_orders","feb_units","kept"],"types":["integer","character varying(40)","bigint","bigint","boolean"],"rows":[[1,"Desk Lamp",2,100,true],[2,"USB Cable",1,50,false],[3,"Office Chair",1,30,false],[4,"Notebook",2,150,true]]}],"output":{"columns":["product_name","unit"],"types":["character varying(40)","bigint"],"rows":[["Desk Lamp",100],["Notebook",150]]}}},{"id":50,"lc":1517,"slug":"find-users-with-valid-e-mails","title":"Find Users With Valid E-Mails","section":"Advanced String Functions / Regex / Clause","difficulty":"Easy","concepts":["regex ~","anchors ^ $","character classes","escaping \\.","case sensitivity"],"pattern":"Validate a whole string with an anchored regular expression: ^ start, one piece per rule, $ end — and escape every literal dot.","statement":["The `Users` table stores each user's `mail`. Some addresses are invalid.","An address is **valid** when it has a **prefix** followed by exactly **`@leetcode.com`** (all lower case). The prefix must **start with a letter** and may then contain only letters (upper or lower case), digits, underscore `_`, period `.` and dash `-`."],"returns":"`user_id`, `name` and `mail` of every user whose mail is valid, in any order.","setup":"CREATE TABLE Users (\n  user_id INT PRIMARY KEY,\n  name    VARCHAR(30),\n  mail    VARCHAR(50)\n);\n\nINSERT INTO Users VALUES\n  (1,  'Nadia', 'nadia@leetcode.com'),\n  (2,  'Ravi',  'Ravi.K_99@leetcode.com'),\n  (3,  'Elsa',  'elsa-@leetcode.com'),\n  (4,  'Sam',   '7sam@leetcode.com'),\n  (5,  'Lucy',  'lucy#1@leetcode.com'),\n  (6,  'Hugo',  'hugo@gmail.com'),\n  (7,  'Ana',   'ana@LEETCODE.COM'),\n  (8,  'Ben',   'ben@leetcodeXcom'),\n  (9,  'Ivy',   'ivy@leetcode.com.org'),\n  (10, 'Joe',   '_joe@leetcode.com');","tables":["Users"],"table_notes":{"Users":"Only users 1–3 are valid. Each of users 4–10 breaks exactly one rule — including two traps for sloppy regexes: `ben@leetcodeXcom` (unescaped dot) and `ivy@leetcode.com.org` (missing `$`)."},"solution":"SELECT user_id,\n       name,\n       mail\nFROM Users\nWHERE mail ~ '^[A-Za-z][A-Za-z0-9_.-]*@leetcode\\.com$';","output_notes":["**Nadia** — simple lower-case prefix and the exact domain.","**Ravi** — `Ravi.K_99` mixes upper case, a period, an underscore and digits; all are allowed in the prefix, and it starts with a letter.","**Elsa** — `elsa-` ends with a dash; that is allowed, only the **first** character is restricted.","Missing: Sam (starts with a digit), Lucy (`#`), Hugo (gmail), Ana (upper-case domain), Ben (`X` instead of `.`), Ivy (extra `.org`), Joe (starts with `_`)."],"breakdown":[{"code":"WHERE mail ~ '…'","text":"`~` is PostgreSQL's **case-sensitive** regex match operator (TRUE if the pattern is found). `~*` would be case-insensitive and wrongly accept `@LEETCODE.COM`."},{"code":"^","text":"Anchor: the match must begin at the **first** character of the mail. Without it, `_joe@…` would match starting at `j` and `7sam@…` starting at `s`."},{"code":"[A-Za-z]","text":"Exactly one letter — the prefix must start with a letter (rejects `7sam` and `_joe`)."},{"code":"[A-Za-z0-9_.-]*","text":"Then zero or more allowed characters. Inside `[ ]` a `.` is a literal period, and `-` placed last is a literal dash. `#` is not in the list, so `lucy#1` fails."},{"code":"@leetcode\\.com","text":"The domain, written out literally. `\\.` escapes the dot: an unescaped `.` means \"any character\" and would accept `@leetcodeXcom`."},{"code":"$","text":"Anchor: the string must **end** right after `com`, so `@leetcode.com.org` is rejected."}],"exec_order":[{"stage":"FROM","code":"Users","text":"Read all 10 users."},{"stage":"WHERE","code":"mail ~ '^[A-Za-z][A-Za-z0-9_.-]*@leetcode\\.com$'","text":"Keep only the mails that match the whole pattern → 3 rows."},{"stage":"SELECT","code":"user_id, name, mail","text":"Return the three columns."}],"visuals":[{"kind":"string","title":"Step 1 — Check every mail piece by piece","diagram":"   ^ [A-Za-z]  [A-Za-z0-9_.-]*   @leetcode\\.com  $\n   │    │             │                 │        │\n   │    │             │                 │        └─ nothing after .com\n   │    │             │                 └─ exact, lower-case domain\n   │    │             └─ rest of prefix: letters, digits, _ . -\n   │    └─ first character is a letter\n   └─ start of the string\n\n  'Ravi.K_99@leetcode.com'\n   R ✓ | avi.K_99 ✓ | @leetcode.com ✓ | end ✓   → valid","sql":"SELECT user_id,\n       mail,\n       mail ~ '^[A-Za-z]'                                    AS starts_with_letter,\n       SPLIT_PART(mail, '@', 1) ~ '^[A-Za-z0-9_.-]+$'        AS prefix_chars_ok,\n       SUBSTRING(mail FROM POSITION('@' IN mail)) = '@leetcode.com' AS domain_exact,\n       mail ~ '^[A-Za-z][A-Za-z0-9_.-]*@leetcode\\.com$' AS is_valid,\n       CASE\n           WHEN mail !~ '^[A-Za-z]'\n               THEN 'prefix must start with a letter'\n           WHEN SPLIT_PART(mail, '@', 1) !~ '^[A-Za-z0-9_.-]+$'\n               THEN 'prefix has a forbidden character'\n           WHEN SUBSTRING(mail FROM POSITION('@' IN mail)) <> '@leetcode.com'\n               THEN 'domain is not exactly @leetcode.com'\n           ELSE 'valid'\n       END AS reason\nFROM Users\nORDER BY user_id;","text":"The helper columns test each rule separately; `is_valid` is the one regex from the solution. **Sam** and **Joe** fail the first-character rule (`7`, `_`). **Lucy** has a `#`. **Hugo**, **Ana**, **Ben** and **Ivy** have a correct prefix but the wrong domain — upper case, `X` instead of a dot, or extra `.org`."},{"kind":"filter","title":"Step 2 — Why every detail of the pattern matters","diagram":"correct          ~  '^[A-Za-z][A-Za-z0-9_.-]*@leetcode\\.com$'\ncase_insensitive ~* (same pattern)        → also accepts ana@LEETCODE.COM   ✗\nunescaped_dot    ~  '…@leetcode.com$'      → '.' = any char → ben@leetcodeXcom ✗\nno_end_anchor    ~  '…@leetcode\\.com'      → ivy@leetcode.com.org            ✗\nno_start_anchor  ~  '[A-Za-z][…]*@…$'      → 7sam@…, _joe@… match from 's'/'j' ✗","sql":"SELECT user_id,\n       mail,\n       mail ~  '^[A-Za-z][A-Za-z0-9_.-]*@leetcode\\.com$' AS correct,\n       mail ~* '^[A-Za-z][A-Za-z0-9_.-]*@leetcode\\.com$' AS case_insensitive_wrong,\n       mail ~  '^[A-Za-z][A-Za-z0-9_.-]*@leetcode.com$'  AS unescaped_dot_wrong,\n       mail ~  '^[A-Za-z][A-Za-z0-9_.-]*@leetcode\\.com'  AS no_end_anchor_wrong,\n       mail ~  '[A-Za-z][A-Za-z0-9_.-]*@leetcode\\.com$'  AS no_start_anchor_wrong\nFROM Users\nORDER BY user_id;","text":"Each \"wrong\" column drops one detail and lets bad mails through: `~*` accepts **Ana**, the unescaped dot accepts **Ben**, the missing `$` accepts **Ivy**, and the missing `^` accepts **Sam** and **Joe** (the regex simply starts matching later, at `s` or `j`). Only the `correct` column keeps users 1–3."}],"flow":[{"label":"Input table","detail":"Users (10 mails)","ref":"input"},{"label":"Rule by rule","detail":"first letter · allowed chars · exact domain","ref":0},{"label":"Pattern details","detail":"~ vs ~*, \\. , ^ and $","ref":1},{"label":"Final output","detail":"Nadia, Ravi, Elsa","ref":"output"}],"takeaway":{"pattern":"\"Validate a string format\" → `col ~ '^…$'`: anchor both ends, one character class per rule, escape literal dots, and use case-sensitive `~` unless told otherwise.","asks":["What is the difference between `~`, `~*`, `!~` and `!~*`? (Match case-sensitive, match case-insensitive, and their negations.)","Why escape the dot outside brackets but not inside? (Outside, `.` means any character; inside `[ ]` it is already a literal period.)","Why put `-` at the end of the bracket? (In the middle, like `[a-z]`, it defines a range; at the end it is a literal dash.)","How is this different from MySQL's REGEXP? (MySQL's REGEXP is case-insensitive with the default collation, so the upper-case domain would sneak through there; PostgreSQL's `~` is case-sensitive.)"],"alternatives":["`SIMILAR TO '[A-Za-z][A-Za-z0-9_.-]*@leetcode[.]com'` — SQL-standard; it is implicitly anchored, but `_` and `%` are wildcards there and `.` is a literal, which makes it confusing.","Combine LIKE with a regex: `mail LIKE '%@leetcode.com'` for the domain plus a regex for the prefix — more pieces, more chances for mistakes (in LIKE, `_` is a wildcard too)."],"realworld":"Input validation and data-quality checks: email formats, product codes like `ABC-1234`, postal codes, phone numbers. In real systems you would also add a CHECK constraint with the same regex so bad data cannot be inserted."},"mistakes":["Not escaping the dot — `@leetcode.com` also matches `@leetcodeXcom` or `@leetcode-com`.","Forgetting `$` — `@leetcode.com.org` or `@leetcode.com.evil.net` slip through.","Forgetting `^` — a prefix starting with `_`, `.` or a digit can still match from a later letter.","Using `~*` (case-insensitive) — `@LEETCODE.COM` would be accepted, but the domain must be lower case.","Writing the prefix class as `[A-Za-z0-9_.-]+` right after the first letter — `+` forces at least two characters, so a one-letter prefix like `a@leetcode.com` would be rejected; use `*`.","Using `\\w` for the prefix — it also allows non-ASCII letters, and it does not include `.` or `-`."],"built":{"id":50,"inputs":[{"name":"Users","columns":["user_id","name","mail"],"types":["integer","character varying(30)","character varying(50)"],"rows":[[1,"Nadia","nadia@leetcode.com"],[2,"Ravi","Ravi.K_99@leetcode.com"],[3,"Elsa","elsa-@leetcode.com"],[4,"Sam","7sam@leetcode.com"],[5,"Lucy","lucy#1@leetcode.com"],[6,"Hugo","hugo@gmail.com"],[7,"Ana","ana@LEETCODE.COM"],[8,"Ben","ben@leetcodeXcom"],[9,"Ivy","ivy@leetcode.com.org"],[10,"Joe","_joe@leetcode.com"]]}],"visuals":[{"columns":["user_id","mail","starts_with_letter","prefix_chars_ok","domain_exact","is_valid","reason"],"types":["integer","character varying(50)","boolean","boolean","boolean","boolean","text"],"rows":[[1,"nadia@leetcode.com",true,true,true,true,"valid"],[2,"Ravi.K_99@leetcode.com",true,true,true,true,"valid"],[3,"elsa-@leetcode.com",true,true,true,true,"valid"],[4,"7sam@leetcode.com",false,true,true,false,"prefix must start with a letter"],[5,"lucy#1@leetcode.com",true,false,true,false,"prefix has a forbidden character"],[6,"hugo@gmail.com",true,true,false,false,"domain is not exactly @leetcode.com"],[7,"ana@LEETCODE.COM",true,true,false,false,"domain is not exactly @leetcode.com"],[8,"ben@leetcodeXcom",true,true,false,false,"domain is not exactly @leetcode.com"],[9,"ivy@leetcode.com.org",true,true,false,false,"domain is not exactly @leetcode.com"],[10,"_joe@leetcode.com",false,true,true,false,"prefix must start with a letter"]]},{"columns":["user_id","mail","correct","case_insensitive_wrong","unescaped_dot_wrong","no_end_anchor_wrong","no_start_anchor_wrong"],"types":["integer","character varying(50)","boolean","boolean","boolean","boolean","boolean"],"rows":[[1,"nadia@leetcode.com",true,true,true,true,true],[2,"Ravi.K_99@leetcode.com",true,true,true,true,true],[3,"elsa-@leetcode.com",true,true,true,true,true],[4,"7sam@leetcode.com",false,false,false,false,true],[5,"lucy#1@leetcode.com",false,false,false,false,false],[6,"hugo@gmail.com",false,false,false,false,false],[7,"ana@LEETCODE.COM",false,true,false,false,false],[8,"ben@leetcodeXcom",false,false,true,false,false],[9,"ivy@leetcode.com.org",false,false,false,true,false],[10,"_joe@leetcode.com",false,false,false,false,true]]}],"output":{"columns":["user_id","name","mail"],"types":["integer","character varying(30)","character varying(50)"],"rows":[[1,"Nadia","nadia@leetcode.com"],[2,"Ravi","Ravi.K_99@leetcode.com"],[3,"Elsa","elsa-@leetcode.com"]]}}}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("sql50-data").textContent);
const PROBLEMS = DATA.problems;
const BY_ID = new Map(PROBLEMS.map(p => [p.id, p]));
const SECTIONS = DATA.sections.map(s => ({ ...s, problems: PROBLEMS.filter(p => p.section === s.name) }));
const COLORS = { "select": "#6366f1", "basic-joins": "#0ea5e9", "aggregate": "#10b981", "sorting-grouping": "#f59e0b",
  "advanced-joins": "#ec4899", "subqueries": "#8b5cf6", "string-regex": "#14b8a6" };
SECTIONS.forEach(s => { s.color = COLORS[s.slug] || "#6366f1"; });
const sectionOf = p => SECTIONS.find(s => s.name === p.section);
const $ = s => document.querySelector(s);

/* storage (progress, theme, sidebar) — safe when storage is unavailable */
const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
};
const done = new Set(Store.get("sql50.done", []));

/* text: escape first, then allow `code`, **bold** and line breaks */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => s == null ? "" : String(s).split(/(`[^`]*`)/g).map(x =>
  x.length > 1 && x[0] === "`" && x.endsWith("`") ? `<code>${esc(x.slice(1, -1))}</code>`
    : esc(x).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>")).join("");

/* small PostgreSQL highlighter */
const highlight = (() => {
  const KW = new Set(("select from where and or not in is null as on join left right inner outer full cross group by having order asc desc " +
    "limit offset distinct union all case when then else end with insert into values update set delete using create table primary key " +
    "int integer varchar date timestamp interval numeric bigint true false between like ilike exists over partition rows preceding " +
    "following current row unbounded float real").split(" "));
  const FN = new Set(("count sum avg min max round cast coalesce length char_length octet_length upper lower substring left right concat " +
    "trim extract to_char string_agg row_number rank dense_rank lag lead abs string_to_array unnest").split(" "));
  const RE = /(--[^\n]*)|('(?:[^']|'')*')|("(?:[^"]|"")*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  return sql => {
    let out = "", m; RE.lastIndex = 0;
    while ((m = RE.exec(sql))) {
      const [tok, com, str, qid, num, word] = m;
      if (com) out += `<span class="c">${esc(com)}</span>`;
      else if (str || qid) out += `<span class="s">${esc(tok)}</span>`;
      else if (num) out += `<span class="nm">${num}</span>`;
      else if (word) {
        const w = word.toLowerCase();
        if (FN.has(w) && /^\s*\(/.test(sql.slice(RE.lastIndex))) out += `<span class="fn">${esc(word)}</span>`;
        else if (KW.has(w)) out += `<span class="k">${esc(word)}</span>`;
        else out += esc(word);
      } else out += /[=<>!+\-*\/%|(),;]/.test(tok) ? `<span class="op">${esc(tok)}</span>` : esc(tok);
    }
    return out;
  };
})();
const code = (sql, file = "solution.sql") => {
  const lines = highlight(sql.replace(/\s+$/, "")).split("\n").map(l => `<span class="line">${l || " "}</span>`).join("");
  return `<div class="code"><div class="code-bar"><span class="dots"><i></i><i></i><i></i></span><span>${esc(file)}</span>` +
    `<span class="lang">PostgreSQL</span><button class="copy" type="button" data-copy>Copy</button></div>` +
    `<pre><code data-sql data-raw="${esc(sql)}">${lines}</code></pre></div>`;
};

/* tables */
const NUMERIC = /^(integer|bigint|smallint|numeric|double precision|real)/;
function table(t, name, note, key, cls = "") {
  const num = t.columns.map((_, i) => NUMERIC.test((t.types || [])[i] || ""));
  const cell = v => v === null ? `<span class="null">NULL</span>` : v === true ? `<span class="v-true">TRUE</span>` : v === false ? `<span class="v-false">FALSE</span>` : esc(v);
  const body = t.rows.length
    ? t.rows.map((r, ri) => `<tr data-r="${ri}">${r.map((v, ci) => `<td data-c="${ci}"${num[ci] ? ' class="num"' : ""}>${cell(v)}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${t.columns.length}" class="null">no rows</td></tr>`;
  return `<div class="tbl ${cls}">${name ? `<div class="tbl-name">${esc(name)} <span>${t.rows.length} row${t.rows.length === 1 ? "" : "s"}</span></div>` : ""}` +
    `<div class="scroll"><table data-table="${esc(key || "")}"><thead><tr>${t.columns.map((c, i) => `<th${num[i] ? ' class="num"' : ""}>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>` +
    `${note ? `<div class="tbl-note">${md(note)}</div>` : ""}</div>`;
}

/* sidebar: categories like the study plan */
function renderSide(current) {
  const closed = new Set([...document.querySelectorAll("#cats .cat.closed")].map(c => c.dataset.cat));
  $("#cats").innerHTML = SECTIONS.map(s => {
    const d = s.problems.filter(p => done.has(p.id)).length;
    return `<div class="cat${closed.has(s.slug) ? " closed" : ""}" data-cat="${s.slug}" style="--c:${s.color}"><button class="cat-head" data-toggle><span class="dot"></span>${esc(s.name)}<span class="cnt">${d}/${s.problems.length}</span><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg></button>` +
      s.problems.map(p => `<a class="row${p.id === current ? " current" : ""}${done.has(p.id) ? " done" : ""}" href="#/problem/${p.id}" data-id="${p.id}"
        data-search="${esc([p.id, p.lc, p.title, ...p.concepts].join(" ").toLowerCase())}">
        <span class="n">${p.id}</span><span class="t">${esc(p.title)}</span><span class="d ${p.difficulty.toLowerCase()}">${p.difficulty === "Medium" ? "Med." : p.difficulty}</span></a>`).join("") +
      `</div>`;
  }).join("");
  filterSide();
  const cur = $("#cats .row.current");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function filterSide() {
  const q = $("#search").value.trim().toLowerCase();
  document.querySelectorAll("#cats .cat").forEach(cat => {
    let any = false;
    cat.querySelectorAll(".row").forEach(r => {
      const hit = !q || r.dataset.id === q || q.split(/\s+/).every(w => r.dataset.search.includes(w));
      r.style.display = hit ? "" : "none"; any = any || hit;
    });
    cat.style.display = any ? "" : "none";
    if (q) cat.classList.remove("closed");
  });
}
function renderProgress() {
  $("#progText").textContent = `${done.size} / ${PROBLEMS.length}`;
  $("#progBar").style.width = (done.size / PROBLEMS.length * 100) + "%";
}

/* pages */
const rowHtml = p => `<a class="row${done.has(p.id) ? " done" : ""}" href="#/problem/${p.id}"><span class="n">${p.id}</span><span class="t">${esc(p.title)}</span><span class="d ${p.difficulty.toLowerCase()}">${p.difficulty === "Medium" ? "Med." : p.difficulty}</span></a>`;
function homePage() {
  const cnt = d => PROBLEMS.filter(p => p.difficulty === d).length;
  return `<div class="page">
    <section class="hero">
      <div class="eyebrow">LeetCode Top SQL 50 · PostgreSQL</div>
      <h1>See every query run,<br>one table at a time.</h1>
      <p>All ${PROBLEMS.length} problems of LeetCode's <a href="https://leetcode.com/studyplan/top-sql-50/" target="_blank" rel="noopener">SQL 50 study plan</a>, in the plan's order — small example tables, a readable PostgreSQL solution, and the intermediate table after every JOIN, CTE, subquery, GROUP BY and window function. Every table was produced by running the SQL in PostgreSQL ${esc(DATA.pgVersion)}.</p>
      <div class="stats">
        <div class="stat"><b>${PROBLEMS.length}</b><span>Problems</span></div>
        <div class="stat"><b>${SECTIONS.length}</b><span>Sections</span></div>
        <div class="stat"><b>${cnt("Easy")}</b><span>Easy</span></div>
        <div class="stat"><b>${cnt("Medium")}</b><span>Medium</span></div>
        <div class="stat"><b>${cnt("Hard")}</b><span>Hard</span></div>
        <div class="stat"><b>${done.size}</b><span>Solved</span></div>
      </div>
    </section>
    <div class="sec-grid">${SECTIONS.map((s, i) => {
      const d = s.problems.filter(p => done.has(p.id)).length;
      return `<section class="sec-card" style="--c:${s.color}"><header><div class="k">Section ${i + 1} · ${d}/${s.problems.length} solved</div><h2>${esc(s.name)}</h2>
        <div class="bar"><i style="width:${d / s.problems.length * 100}%"></i></div></header>
        <div class="list">${s.problems.map(rowHtml).join("")}</div></section>`;
    }).join("")}</div>
  </div>`;
}

const STAGES = ["FROM", "JOIN / ON", "WHERE", "GROUP BY", "HAVING", "WINDOW", "SELECT", "DISTINCT", "ORDER BY", "LIMIT"];
function problemPage(p) {
  const s = sectionOf(p), si = SECTIONS.indexOf(s), pos = s.problems.indexOf(p) + 1;
  const prev = BY_ID.get(p.id - 1), next = BY_ID.get(p.id + 1);
  const ps = SECTIONS[si - 1], ns = SECTIONS[si + 1];
  const b = p.built, tk = p.takeaway;
  const used = new Set(p.exec_order.map(e => e.stage));

  const steps = p.visuals.map((v, i) => `<div class="step" data-kind="${esc(v.kind)}" data-step="${i}">
      <h3><span class="kind">${esc(v.kind)}</span>${esc(v.title)}</h3>
      <p>${md(v.text)}</p>
      ${v.diagram ? `<pre class="diagram">${esc(v.diagram)}</pre>` : ""}
      ${b.visuals[i] ? `<div class="tables">${table(b.visuals[i], "Result", "", "step:" + i)}</div>` : ""}
      ${v.sql ? `<details><summary>SQL for this step</summary>${code(v.sql, `step-${i + 1}.sql`)}</details>` : ""}
    </div>`).join("");

  return `<article class="page" data-pid="${p.id}" style="--c:${s.color}">
    <header class="p-hero" data-num="${p.id}">
      <div class="crumb">${esc(s.name)} · ${pos} of ${s.problems.length}</div>
      <h1>${esc(p.title)}</h1>
      <div class="p-meta">
        <span class="chip">#${p.id} · LeetCode ${p.lc}</span>
        <span class="chip diff ${p.difficulty.toLowerCase()}">${esc(p.difficulty)}</span>
        <label class="chip"><input type="checkbox" data-done="${p.id}"${done.has(p.id) ? " checked" : ""}> Solved</label>
        <a class="chip" href="https://leetcode.com/problems/${esc(p.slug)}/" target="_blank" rel="noopener">Open on LeetCode ↗</a>
      </div>
      <div class="concepts">${p.concepts.map(c => `<span>${esc(c)}</span>`).join("")}</div>
    </header>

    <section class="sec"><h2>Problem</h2><div class="card">
      ${p.statement.map(x => `<p>${md(x)}</p>`).join("")}
      <div class="return"><b>Return:</b> ${md(p.returns)}</div></div></section>

    <section class="sec"><h2>Input tables</h2>
      <div class="tables">${b.inputs.map(t => table(t, t.name, (p.table_notes || {})[t.name], "input:" + t.name)).join("")}</div></section>

    <section class="sec"><h2>${p.mutates ? "Expected result" : "Expected output"}</h2>
      <div class="tables">${table(b.output, p.mutates ? "Table after the statement" : "Output", "", "output", "out")}</div>
      <div class="card"><ul style="margin:0">${p.output_notes.map(n => `<li>${md(n)}</li>`).join("")}</ul></div></section>

    <section class="sec"><h2>PostgreSQL solution</h2>${code(p.solution)}</section>

    <section class="sec"><h2>How the query works</h2><div class="clauses">
      ${p.breakdown.map(c => `<div class="clause"><pre class="mini"><code>${highlight(c.code)}</code></pre><p>${md(c.text)}</p></div>`).join("")}</div></section>

    <section class="sec"><h2>Step by step</h2>
      <p class="note">Each table below is the real result at that point of the query, using the input above.</p>${steps}</section>

    <section class="sec"><h2>Query flow</h2>
      <details data-flow="${p.id}"><summary class="flow-btn">Show query flow</summary><div class="flow"></div></details></section>

    <section class="sec"><h2>Execution order</h2><div class="card">
      <div class="pipeline">${STAGES.map(x => `<span class="${used.has(x) ? "on" : ""}">${x}</span>`).join("<i>→</i>")}</div>
      <ol class="exec">${p.exec_order.map(e => `<li><b>${esc(e.stage)}</b><div class="what">${e.code ? `<code>${esc(e.code)}</code><br>` : ""}${md(e.text)}</div></li>`).join("")}</ol></div></section>

    <section class="sec"><h2>Interview notes</h2>
      <div class="pattern"><b>Pattern:</b> ${md(tk.pattern)}</div>
      <div class="notes-grid">
        ${tk.asks && tk.asks.length ? `<div class="card"><h4>Likely follow-up questions</h4><ul style="margin:0">${tk.asks.map(a => `<li>${md(a)}</li>`).join("")}</ul></div>` : ""}
        ${tk.alternatives && tk.alternatives.length ? `<div class="card"><h4>Other ways to solve it</h4><ul style="margin:0">${tk.alternatives.map(a => `<li>${md(a)}</li>`).join("")}</ul></div>` : ""}
      </div>
      ${tk.realworld ? `<div class="card" style="margin-top:14px"><h4 style="margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">In real applications</h4>${md(tk.realworld)}</div>` : ""}
    </section>

    <section class="sec"><h2>Common mistakes</h2><ul class="mistakes">${p.mistakes.map(m => `<li>${md(m)}</li>`).join("")}</ul></section>

    <div class="pager">
      ${prev ? `<a href="#/problem/${prev.id}"><small>← Previous</small>${prev.id}. ${esc(prev.title)}</a>` : `<a href="#/"><small>←</small>All problems</a>`}
      ${next ? `<a class="next" href="#/problem/${next.id}"><small>Next →</small>${next.id}. ${esc(next.title)}</a>` : `<a class="next" href="#/"><small>→</small>All problems</a>`}
    </div>
    <div class="sec-links">
      <span>${ps ? `<a href="#/problem/${ps.problems[0].id}" style="color:${ps.color}">← ${esc(ps.name)}</a>` : ""}</span>
      <span>${ns ? `<a href="#/problem/${ns.problems[0].id}" style="color:${ns.color}">${esc(ns.name)} →</a>` : ""}</span>
    </div>
  </article>`;
}

function flowHtml(p) {
  const b = p.built;
  const tablesFor = ref => ref === "input" ? b.inputs.map(t => table(t, t.name, "", "flow-input:" + t.name)).join("")
    : ref === "output" ? table(b.output, "Output", "", "flow-output", "out")
    : (typeof ref === "number" && b.visuals[ref]) ? table(b.visuals[ref], "Result", "", "flow-step:" + ref) : "";
  return p.flow.map(f => `<div class="flow-item"><b>${esc(f.label)}</b> <span class="note">${md(f.detail || "")}</span>
    <div class="tables">${tablesFor(f.ref)}</div></div>`).join("");
}

/* routing: own state, so it also works where the URL hash cannot change */
let route = location.hash || "#/";
function render() {
  const m = route.match(/^#\/problem\/(\d+)/);
  const p = m && BY_ID.get(+m[1]);
  $("#app").innerHTML = p ? problemPage(p) : homePage();
  document.title = p ? `${p.id}. ${p.title} · SQL 50` : "SQL 50 Guide";
  renderSide(p ? p.id : null);
  window.scrollTo(0, 0);
  document.body.classList.remove("side-open");
}
function go(hash) {
  route = hash;
  try { if (location.hash !== hash) history.pushState(null, "", hash); } catch (e) { /* not writable */ }
  render();
}
const currentId = () => { const m = route.match(/^#\/problem\/(\d+)/); return m ? +m[1] : 0; };
const syncFromUrl = () => { route = location.hash || "#/"; render(); };
window.addEventListener("popstate", syncFromUrl);
window.addEventListener("hashchange", syncFromUrl);

/* events */
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#/"]');
  if (a) { e.preventDefault(); go(a.getAttribute("href")); return; }
  const t = e.target.closest("[data-toggle]");
  if (t) { t.parentElement.classList.toggle("closed"); return; }
  const c = e.target.closest("[data-copy]");
  if (c && navigator.clipboard) {
    const text = c.closest(".code").querySelector("[data-sql]").dataset.raw;
    navigator.clipboard.writeText(text).then(() => { c.textContent = "Copied"; setTimeout(() => (c.textContent = "Copy"), 1200); }, () => {});
  }
});
document.addEventListener("change", e => {
  const box = e.target.closest("[data-done]");
  if (!box) return;
  const id = +box.dataset.done;
  box.checked ? done.add(id) : done.delete(id);
  Store.set("sql50.done", [...done]);
  renderProgress(); renderSide(id);
});
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.dataset && d.dataset.flow && d.open && !d.dataset.ready) {
    d.querySelector(".flow").innerHTML = flowHtml(BY_ID.get(+d.dataset.flow)); d.dataset.ready = "1";
  }
  if (d.dataset && d.dataset.flow) d.querySelector("summary").textContent = d.open ? "Hide query flow" : "Show query flow";
}, true);
$("#search").addEventListener("input", filterSide);
$("#search").addEventListener("keydown", e => {
  if (e.key === "Enter") { const r = [...document.querySelectorAll("#cats .row")].find(x => x.style.display !== "none"); if (r) go(r.getAttribute("href")); }
  if (e.key === "Escape") { e.target.value = ""; filterSide(); e.target.blur(); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "/") { e.preventDefault(); setHidden(false); document.body.classList.add("side-open"); $("#search").focus(); }
  if (e.key === "]" && BY_ID.has(currentId() + 1)) go("#/problem/" + (currentId() + 1));
  if (e.key === "[" && BY_ID.has(currentId() - 1)) go("#/problem/" + (currentId() - 1));
});

/* sidebar show / hide (remembered) */
function setHidden(h) { document.body.classList.toggle("side-hidden", h); Store.set("sql50.sideHidden", h); }
if (Store.get("sql50.sideHidden", false)) document.body.classList.add("side-hidden");
$("#hideSide").addEventListener("click", () => setHidden(true));
$("#openSide").addEventListener("click", () => {
  if (matchMedia("(max-width: 1000px)").matches) document.body.classList.toggle("side-open");
  else setHidden(false);
});
$("#scrim").addEventListener("click", () => document.body.classList.remove("side-open"));

/* theme */
const savedTheme = Store.get("sql50.theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#themeBtn").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; Store.set("sql50.theme", r.dataset.theme);
});

renderProgress();
render();
</script>
</body>
</html>
