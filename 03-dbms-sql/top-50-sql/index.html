w.","**2019-07-28 is missing** — it is after the end date, so user 2's row is excluded."],"breakdown":[{"code":"FROM Activity","text":"Start with all 11 activity rows."},{"code":"WHERE activity_date BETWEEN DATE '2019-07-27' - 29\n                        AND DATE '2019-07-27'","text":"Keep only the 30 days **06-28 … 07-27**. In PostgreSQL `date - integer` gives a date, so `DATE '2019-07-27' - 29` is `2019-06-28`. It is 29, not 30: the end day itself is day 1 of the 30. `BETWEEN` includes both ends. The upper bound also removes rows after 07-27."},{"code":"GROUP BY activity_date","text":"One group per remaining day."},{"code":"COUNT(DISTINCT user_id) AS active_users","text":"A user with 3 actions on a day is still **one** active user, so count distinct users, not rows."},{"code":"SELECT activity_date AS day","text":"Rename the column to `day` as the expected output requires. Any order is accepted."}],"exec_order":[{"stage":"FROM","code":"Activity","text":"11 rows."},{"stage":"WHERE","code":"activity_date BETWEEN 2019-06-28 AND 2019-07-27","text":"Drop the 06-27 and 07-28 rows → 8 rows."},{"stage":"GROUP BY","code":"activity_date","text":"3 days remain: 06-28, 07-15, 07-27."},{"stage":"SELECT","code":"activity_date AS day, COUNT(DISTINCT user_id)","text":"Distinct users per day."}],"visuals":[{"kind":"filter","title":"Step 1 — WHERE: which rows fall inside the 30-day window?","diagram":"window = 30 days ending 2019-07-27 (inclusive)\n\n 06-27   06-28  . . . . . . . . . . . .  07-27   07-28\n   ✗     [ day 30  ←── 30 days ──→  day 1 ]    ✗\n too early  ▲ = 07-27 - 29                ▲ end   too late\n\n 07-27 - 30 = 06-27 → would make 31 days","sql":"SELECT user_id,\n       activity_date,\n       activity_type,\n       DATE '2019-07-27' - activity_date AS days_before_end,\n       activity_date BETWEEN DATE '2019-07-27' - 29 AND DATE '2019-07-27' AS in_window,\n       activity_date BETWEEN DATE '2019-07-27' - 30 AND DATE '2019-07-27' AS minus_30_WRONG,\n       activity_date >= DATE '2019-07-27' - 29                            AS no_upper_bound_WRONG\nFROM Activity\nORDER BY activity_date, user_id, activity_type;","text":"`days_before_end` goes from 0 (07-27) to 29 (06-28) for the 30 days we want. The **06-27** row has 30 days before the end, so it is day 31 — the `- 30` version wrongly keeps it. The **07-28** row has -1 — the version without an upper bound wrongly keeps it. Only `in_window` gets both edges right: 8 rows are kept."},{"kind":"group","title":"Step 2 — GROUP BY day and count DISTINCT users","diagram":"2019-06-28\n ├─ user 2 (open_session)\n └─ user 2 (send_message)      → rows 2, users {2}   = 1\n2019-07-15\n ├─ user 3 (open_session)\n ├─ user 3 (end_session)\n ├─ user 4 (scroll_down)\n └─ user 4 (scroll_down)       → rows 4, users {3,4} = 2\n2019-07-27\n ├─ user 1 (open_session)\n └─ user 4 (send_message)      → rows 2, users {1,4} = 2","sql":"SELECT activity_date AS day,\n       STRING_AGG(CAST(user_id AS VARCHAR), ', ' ORDER BY user_id) AS users_in_group,\n       COUNT(*)                AS count_rows_WRONG,\n       COUNT(DISTINCT user_id) AS active_users\nFROM Activity\nWHERE activity_date BETWEEN DATE '2019-07-27' - 29 AND DATE '2019-07-27'\nGROUP BY activity_date\nORDER BY day;","text":"On **07-15** there are 4 rows but only 2 users (3 and 4). `COUNT(*)` would report 4 activities, not active users. `COUNT(DISTINCT user_id)` gives 1, 2, 2."}],"flow":[{"label":"Input table","detail":"Activity (11 rows, boundary dates on both sides)","ref":"input"},{"label":"WHERE 30-day window","detail":"06-28 … 07-27 inclusive → 8 rows","ref":0},{"label":"GROUP BY day + COUNT(DISTINCT)","detail":"distinct users per day","ref":1},{"label":"Final output","detail":"day, active_users","ref":"output"}],"takeaway":{"pattern":"\"Last N days ending D (inclusive)\" → `date BETWEEN D - (N - 1) AND D`. Then GROUP BY the day and COUNT(DISTINCT user) for \"active users\".","asks":["Why 29 and not 30? (The end day is included, so 30 days span D-29 … D. D-30 would give 31 days.)","Why is the upper bound needed? (Rows after 2019-07-27 exist in the table and must not be counted.)","What if `activity_date` were a TIMESTAMP? (Use `activity_date >= DATE '2019-06-28' AND activity_date < DATE '2019-07-28'`; BETWEEN with a date upper bound would drop everything after midnight on the last day. Group by `CAST(activity_date AS DATE)`.)","How would you show days with 0 active users too? (Generate the 30 days with `generate_series` and LEFT JOIN the counts.)"],"alternatives":["Half-open range: `WHERE activity_date > DATE '2019-07-27' - 30 AND activity_date <= DATE '2019-07-27'` — same 30 days.","Literal dates: `WHERE activity_date BETWEEN '2019-06-28' AND '2019-07-27'` — fine, as long as you compute the start date correctly."],"realworld":"DAU (daily active users) charts over a rolling window, \"last 7 days\" dashboards, retention reports — all hinge on getting the window edges right."},"mistakes":["Using `DATE '2019-07-27' - 30` as the start with `>=` / BETWEEN — that is 31 days and includes 06-27.","Forgetting the upper bound (`activity_date >= '2019-06-28'` only) — rows after 07-27, like 07-28 here, are counted.","`COUNT(user_id)` or `COUNT(*)` instead of `COUNT(DISTINCT user_id)` — counts actions, not users (07-15 would be 4).","Subtracting an INTERVAL and comparing with BETWEEN: `DATE '2019-07-27' - INTERVAL '29 days'` returns a TIMESTAMP. It works for DATE columns, but `date - integer` keeps the type a DATE and is simpler."],"built":{"id":24,"inputs":[{"name":"Activity","columns":["user_id","session_id","activity_date","activity_type"],"types":["integer","integer","date","character varying(20)"],"rows":[[1,1,"2019-06-27","open_session"],[1,1,"2019-06-27","end_session"],[2,2,"2019-06-28","open_session"],[2,2,"2019-06-28","send_message"],[3,3,"2019-07-15","open_session"],[3,3,"2019-07-15","end_session"],[4,4,"2019-07-15","scroll_down"],[4,4,"2019-07-15","scroll_down"],[1,5,"2019-07-27","open_session"],[4,6,"2019-07-27","send_message"],[2,7,"2019-07-28","open_session"]]}],"visuals":[{"columns":["user_id","activity_date","activity_type","days_before_end","in_window","minus_30_wrong","no_upper_bound_wrong"],"types":["integer","date","character varying(20)","integer","boolean","boolean","boolean"],"rows":[[1,"2019-06-27","end_session",30,false,true,false],[1,"2019-06-27","open_session",30,false,true,false],[2,"2019-06-28","open_session",29,true,true,true],[2,"2019-06-28","send_message",29,true,true,true],[3,"2019-07-15","end_session",12,true,true,true],[3,"2019-07-15","open_session",12,true,true,true],[4,"2019-07-15","scroll_down",12,true,true,true],[4,"2019-07-15","scroll_down",12,true,true,true],[1,"2019-07-27","open_session",0,true,true,true],[4,"2019-07-27","send_message",0,true,true,true],[2,"2019-07-28","open_session",-1,false,false,true]]},{"columns":["day","users_in_group","count_rows_wrong","active_users"],"types":["date","text","bigint","bigint"],"rows":[["2019-06-28","2, 2",2,1],["2019-07-15","3, 3, 4, 4",4,2],["2019-07-27","1, 4",2,2]]}],"output":{"columns":["day","active_users"],"types":["date","bigint"],"rows":[["2019-06-28",1],["2019-07-15",2],["2019-07-27",2]]}}},{"id":25,"lc":1070,"slug":"product-sales-analysis-iii","title":"Product Sales Analysis III","section":"Sorting and Grouping","difficulty":"Medium","concepts":["CTE","GROUP BY + MIN","INNER JOIN on two columns","join back to detail rows"],"pattern":"Compute a per-group value (first year) in a CTE, then JOIN it back to the detail rows to keep every row that matches it.","statement":["The `Sales` table has one row per sale: which product was sold, in which year, how many units, and at what unit price. A product can have **several sales in the same year**.","For each product, find the **first year** it was ever sold, and return **every** sale of that product from that year — not just one of them."],"returns":"Columns `product_id`, `first_year`, `quantity`, `price` — one row per sale that happened in its product's first year (several rows per product are possible). Any order.","setup":"CREATE TABLE Sales (\n  sale_id    INT,\n  product_id INT,\n  year       INT,\n  quantity   INT,\n  price      INT,\n  PRIMARY KEY (sale_id, year)\n);\n\nINSERT INTO Sales VALUES\n  (1, 100, 2019, 10,  50),\n  (2, 100, 2019,  5,  55),\n  (3, 100, 2020,  8,  50),\n  (4, 200, 2020,  3, 300),\n  (5, 200, 2021,  4, 280),\n  (6, 300, 2021, 20,  15),\n  (7, 300, 2021, 20,  15),\n  (8, 300, 2022,  6,  15);","tables":["Sales"],"table_notes":{"Sales":"Product 100 has **two** sales in its first year (2019). Product 300 has two sales in 2021 with identical quantity and price — they are different sales (`sale_id` 6 and 7) and both must be returned."},"solution":"WITH first_year AS (\n    SELECT product_id,\n           MIN(year) AS first_year\n    FROM Sales\n    GROUP BY product_id\n)\nSELECT s.product_id,\n       f.first_year,\n       s.quantity,\n       s.price\nFROM Sales AS s\nINNER JOIN first_year AS f\n        ON f.product_id = s.product_id\n       AND f.first_year = s.year;","display_sql":"WITH first_year AS (\n    SELECT product_id,\n           MIN(year) AS first_year\n    FROM Sales\n    GROUP BY product_id\n)\nSELECT s.product_id,\n       f.first_year,\n       s.quantity,\n       s.price\nFROM Sales AS s\nINNER JOIN first_year AS f\n        ON f.product_id = s.product_id\n       AND f.first_year = s.year\nORDER BY s.product_id, s.sale_id;","output_notes":["**Product 100, 2019 → two rows** (10 × 50 and 5 × 55) — both sales happened in its first year. The 2020 sale is dropped.","**Product 200, 2020 → one row** (3 × 300) — the only sale in its first year; the 2021 sale is dropped.","**Product 300, 2021 → two identical-looking rows** (20 × 15 twice) — they come from sales 6 and 7, two real sales. We must not remove them with DISTINCT. The 2022 sale is dropped."],"breakdown":[{"code":"WITH first_year AS (\n    SELECT product_id, MIN(year) AS first_year\n    FROM Sales\n    GROUP BY product_id\n)","text":"Step one: one row per product with the earliest year it appears. This is a small lookup table: 100 → 2019, 200 → 2020, 300 → 2021."},{"code":"FROM Sales AS s","text":"Go back to the **detail** rows — we need each sale's quantity and price, which the grouped CTE no longer has."},{"code":"INNER JOIN first_year AS f\n        ON f.product_id = s.product_id\n       AND f.first_year = s.year","text":"Match each sale with its product's first year, and keep it only if the sale's year **is** that first year. Both conditions matter: product alone would keep every sale; year alone would mix products."},{"code":"SELECT s.product_id, f.first_year, s.quantity, s.price","text":"Return the four required columns. `first_year` comes from the CTE (it equals `s.year` for every kept row). No DISTINCT — duplicate-looking rows are separate sales."}],"exec_order":[{"stage":"FROM","code":"first_year: FROM Sales","text":"CTE reads all 8 sales."},{"stage":"GROUP BY","code":"first_year: GROUP BY product_id","text":"3 groups."},{"stage":"SELECT","code":"first_year: product_id, MIN(year)","text":"100 → 2019, 200 → 2020, 300 → 2021."},{"stage":"FROM","code":"Sales AS s","text":"Main query starts again from all 8 sales."},{"stage":"JOIN / ON","code":"INNER JOIN first_year f ON product AND year","text":"Only sales in their product's first year survive → 5 rows."},{"stage":"SELECT","code":"s.product_id, f.first_year, s.quantity, s.price","text":"Pick the output columns."}],"visuals":[{"kind":"cte","title":"Step 1 — CTE first_year: the earliest year per product","diagram":"Sales ──▶ first_year ──▶ JOIN back to Sales ──▶ output\n\nproduct 100\n ├─ 2019 (sale 1)\n ├─ 2019 (sale 2)\n └─ 2020 (sale 3)      → MIN(year) = 2019\nproduct 200\n ├─ 2020 (sale 4)\n └─ 2021 (sale 5)      → MIN(year) = 2020\nproduct 300\n ├─ 2021 (sale 6)\n ├─ 2021 (sale 7)\n └─ 2022 (sale 8)      → MIN(year) = 2021","sql":"SELECT product_id,\n       MIN(year) AS first_year\nFROM Sales\nGROUP BY product_id\nORDER BY product_id;","text":"Grouping by product and taking `MIN(year)` gives one first year per product. But grouping also squeezed each product down to a single row — the quantity and price of the individual sales are gone. That is why the next step joins this lookup **back** to `Sales`."},{"kind":"join","title":"Step 2 — JOIN Sales to first_year and compare the years","diagram":"Sales s                         first_year f\n  s.product_id ──── = ────▶  f.product_id\n  s.year       ──── = ────▶  f.first_year\n\n  both equal → sale is in its first year  ✓ keep\n  year differs → later year               ✗ dropped by ON","sql":"WITH first_year AS (\n    SELECT product_id,\n           MIN(year) AS first_year\n    FROM Sales\n    GROUP BY product_id\n)\nSELECT s.sale_id,\n       s.product_id,\n       s.year,\n       f.first_year,\n       s.quantity,\n       s.price,\n       s.year = f.first_year AS in_first_year\nFROM Sales AS s\nINNER JOIN first_year AS f\n        ON f.product_id = s.product_id\nORDER BY s.product_id, s.sale_id;","text":"To make the decision visible, this table joins on `product_id` only and shows `in_first_year`. Sales 1, 2, 4, 6 and 7 are TRUE; sales 3, 5 and 8 happened in a later year. In the real solution the second condition `f.first_year = s.year` sits in the ON clause, so the FALSE rows never make it into the result — leaving 5 rows."},{"kind":"note","title":"Step 3 — Why not just GROUP BY product_id?","diagram":"SELECT product_id, MIN(year), quantity, price\nFROM Sales\nGROUP BY product_id;\n\nERROR: column \"sales.quantity\" must appear in the GROUP BY clause\n       or be used in an aggregate function","text":"After grouping, product 100 is one row — but it had three different quantities (10, 5, 8). PostgreSQL refuses to guess which one you mean. And even if it picked one, the problem wants **all** first-year sales (two rows for product 100). Grouping answers \"which year?\"; the join answers \"which rows?\"."}],"flow":[{"label":"Input table","detail":"Sales (8 rows, several sales per product-year)","ref":"input"},{"label":"CTE first_year","detail":"GROUP BY product_id, MIN(year) → 3 rows","ref":0},{"label":"JOIN back to Sales","detail":"match product AND year = first_year","ref":1},{"label":"Final output","detail":"all 5 first-year sales","ref":"output"}],"takeaway":{"pattern":"\"Return all rows that have the min/max value of their group\" → aggregate in a CTE, then INNER JOIN the CTE back on (group key AND value). It naturally keeps ties.","asks":["Why can't you SELECT quantity in the GROUP BY query? (A group has many quantities; PostgreSQL requires every selected column to be grouped or aggregated.)","What if a product had three sales in its first year? (All three are returned — the join keeps every matching row.)","Why not ROW_NUMBER() = 1? (It keeps exactly one row per product and would drop the second first-year sale. Use RANK() or DENSE_RANK() if you go the window-function route.)","Should you add DISTINCT? (No — sales 6 and 7 look identical in the output but are two different sales.)"],"alternatives":["Tuple IN subquery: `SELECT product_id, year AS first_year, quantity, price FROM Sales WHERE (product_id, year) IN (SELECT product_id, MIN(year) FROM Sales GROUP BY product_id);`","Window function: in a CTE compute `RANK() OVER (PARTITION BY product_id ORDER BY year) AS rnk`, then keep `rnk = 1`. RANK gives ties the same rank, so all first-year sales survive."],"realworld":"\"First orders of each customer\", \"all transactions on the latest snapshot date per account\", \"every reading taken on a device's first day\" — find the group's boundary value, then pull every detail row at that value."},"mistakes":["Returning one row per product (`GROUP BY product_id` with MIN(year)) — the current problem asks for **all** sales in the first year, so product 100 needs two rows.","Selecting `quantity` / `price` next to `MIN(year)` without grouping them — PostgreSQL raises \"must appear in the GROUP BY clause\".","Joining only on `product_id` — every sale of the product is returned, not just first-year ones.","Using `ROW_NUMBER()` — breaks ties arbitrarily and keeps only one of the first-year sales.","Adding `DISTINCT` — merges sales 6 and 7 into one row although they are two separate sales."],"built":{"id":25,"inputs":[{"name":"Sales","columns":["sale_id","product_id","year","quantity","price"],"types":["integer","integer","integer","integer","integer"],"rows":[[1,100,2019,10,50],[2,100,2019,5,55],[3,100,2020,8,50],[4,200,2020,3,300],[5,200,2021,4,280],[6,300,2021,20,15],[7,300,2021,20,15],[8,300,2022,6,15]]}],"visuals":[{"columns":["product_id","first_year"],"types":["integer","integer"],"rows":[[100,2019],[200,2020],[300,2021]]},{"columns":["sale_id","product_id","year","first_year","quantity","price","in_first_year"],"types":["integer","integer","integer","integer","integer","integer","boolean"],"rows":[[1,100,2019,2019,10,50,true],[2,100,2019,2019,5,55,true],[3,100,2020,2019,8,50,false],[4,200,2020,2020,3,300,true],[5,200,2021,2020,4,280,false],[6,300,2021,2021,20,15,true],[7,300,2021,2021,20,15,true],[8,300,2022,2021,6,15,false]]},null],"output":{"columns":["product_id","first_year","quantity","price"],"types":["integer","integer","integer","integer"],"rows":[[100,2019,10,50],[100,2019,5,55],[200,2020,3,300],[300,2021,20,15],[300,2021,20,15]]}}},{"id":26,"lc":596,"slug":"classes-with-at-least-5-students","title":"Classes With at Least 5 Students","section":"Sorting and Grouping","difficulty":"Easy","concepts":["GROUP BY","HAVING","COUNT",">= vs >"],"pattern":"Filter groups by an aggregate → GROUP BY, then HAVING COUNT(...) >= N.","statement":["The `Courses` table lists enrollments: each row says that a student is enrolled in a class. A student can take several classes, and each (student, class) pair appears only once.","Find every class that has **at least five** students enrolled."],"returns":"A single column `class` with each class that has 5 or more students. Any order.","setup":"CREATE TABLE Courses (\n  student VARCHAR(255),\n  class   VARCHAR(255),\n  PRIMARY KEY (student, class)\n);\n\nINSERT INTO Courses VALUES\n  ('Ana', 'Math'),\n  ('Ben', 'Physics'),\n  ('Cara', 'Math'),\n  ('Dan', 'Art'),\n  ('Ana', 'Drama'),\n  ('Ben', 'Math'),\n  ('Gus', 'Drama'),\n  ('Cara', 'Physics'),\n  ('Dan', 'Math'),\n  ('Hana', 'Drama'),\n  ('Eva', 'Math'),\n  ('Gus', 'Physics'),\n  ('Ivan', 'Drama'),\n  ('Finn', 'Math'),\n  ('Hana', 'Physics'),\n  ('Jade', 'Drama');","tables":["Courses"],"table_notes":{"Courses":"Math has 6 students, Drama **exactly 5** (the boundary), Physics 4 (one short), Art 1. Several students appear in more than one class."},"solution":"SELECT class\nFROM Courses\nGROUP BY class\nHAVING COUNT(student) >= 5;","display_sql":"SELECT class\nFROM Courses\nGROUP BY class\nHAVING COUNT(student) >= 5\nORDER BY class;","output_notes":["**Drama** — exactly 5 students (Ana, Gus, Hana, Ivan, Jade). \"At least five\" includes 5, so `>= 5` keeps it.","**Math** — 6 students, comfortably above the limit.","**Physics is missing** — only 4 students.","**Art is missing** — only 1 student (Dan)."],"breakdown":[{"code":"FROM Courses","text":"All 16 enrollment rows."},{"code":"GROUP BY class","text":"One group per class: Art, Drama, Math, Physics."},{"code":"HAVING COUNT(student) >= 5","text":"Keep only groups with 5 or more students. HAVING runs **after** grouping, so it can use aggregates; WHERE runs before grouping and cannot. `>=` because \"at least five\" includes five."},{"code":"SELECT class","text":"Return just the class name. The count is used for filtering only, so it does not need to be in SELECT."}],"exec_order":[{"stage":"FROM","code":"Courses","text":"16 rows."},{"stage":"GROUP BY","code":"class","text":"4 groups."},{"stage":"HAVING","code":"COUNT(student) >= 5","text":"Art (1) and Physics (4) are removed → 2 groups."},{"stage":"SELECT","code":"class","text":"Drama, Math."}],"visuals":[{"kind":"group","title":"Step 1 — GROUP BY class and COUNT the students","diagram":"Art\n └─ Dan               → COUNT = 1\nDrama\n ├─ Ana\n ├─ Gus\n ├─ Hana\n ├─ Ivan\n └─ Jade              → COUNT = 5\nMath\n ├─ Ana\n ├─ Ben\n ├─ Cara\n ├─ Dan\n ├─ Eva\n └─ Finn              → COUNT = 6\nPhysics\n ├─ Ben\n ├─ Cara\n ├─ Gus\n └─ Hana              → COUNT = 4","sql":"SELECT class,\n       STRING_AGG(student, ', ' ORDER BY student) AS students_in_group,\n       COUNT(student) AS student_count\nFROM Courses\nGROUP BY class\nORDER BY class;","text":"Grouping by `class` collapses the 16 rows into 4 groups, and `COUNT(student)` tells us how many students each has: Art 1, Drama 5, Math 6, Physics 4."},{"kind":"having","title":"Step 2 — HAVING COUNT(student) >= 5: which groups survive?","diagram":"Art      1  >= 5 ?  ✗ removed\nDrama    5  >= 5 ?  ✓ kept      (5 > 5 would be ✗!)\nMath     6  >= 5 ?  ✓ kept\nPhysics  4  >= 5 ?  ✗ removed","sql":"SELECT class,\n       COUNT(student)      AS student_count,\n       COUNT(student) >= 5 AS kept,\n       COUNT(student) > 5  AS kept_if_gt_5_WRONG\nFROM Courses\nGROUP BY class\nORDER BY class;","text":"HAVING tests each **group**, not each row. Art and Physics fail and are removed. Drama is the boundary case: with `>= 5` it is kept, but the common slip `> 5` would wrongly drop it (see the last column)."}],"flow":[{"label":"Input table","detail":"Courses (16 enrollments)","ref":"input"},{"label":"GROUP BY class","detail":"4 classes with their student counts","ref":0},{"label":"HAVING COUNT >= 5","detail":"keep Drama (5) and Math (6)","ref":1},{"label":"Final output","detail":"class","ref":"output"}],"takeaway":{"pattern":"\"Groups where the count / sum / average meets a threshold\" → GROUP BY + HAVING. WHERE filters rows before grouping; HAVING filters groups after.","asks":["Why not `WHERE COUNT(student) >= 5`? (WHERE runs before grouping, so aggregates are not allowed there — PostgreSQL raises an error.)","What if the same student could be listed twice in a class? (Use `COUNT(DISTINCT student)` so a duplicate enrollment is not counted twice.)","Can you avoid HAVING? (Yes: count in a subquery/CTE, then filter with WHERE in the outer query.)"],"alternatives":["Subquery version: `SELECT class FROM (SELECT class, COUNT(student) AS cnt FROM Courses GROUP BY class) AS c WHERE cnt >= 5;`"],"realworld":"Courses that reached minimum enrollment, products with at least N reviews, customers with 3+ orders — threshold filters on groups are everywhere."},"mistakes":["Using `> 5` instead of `>= 5` — \"at least five\" includes exactly five (Drama here).","Putting the aggregate in WHERE — `aggregate functions are not allowed in WHERE`.","Selecting `student` next to `class` — it is not grouped, so PostgreSQL rejects it (and a group has many students anyway).","On older versions of this problem the table could contain duplicate rows; `COUNT(DISTINCT student)` is the safe choice when duplicates are possible."],"built":{"id":26,"inputs":[{"name":"Courses","columns":["student","class"],"types":["character varying(255)","character varying(255)"],"rows":[["Ana","Math"],["Ben","Physics"],["Cara","Math"],["Dan","Art"],["Ana","Drama"],["Ben","Math"],["Gus","Drama"],["Cara","Physics"],["Dan","Math"],["Hana","Drama"],["Eva","Math"],["Gus","Physics"],["Ivan","Drama"],["Finn","Math"],["Hana","Physics"],["Jade","Drama"]]}],"visuals":[{"columns":["class","students_in_group","student_count"],"types":["character varying(255)","text","bigint"],"rows":[["Art","Dan",1],["Drama","Ana, Gus, Hana, Ivan, Jade",5],["Math","Ana, Ben, Cara, Dan, Eva, Finn",6],["Physics","Ben, Cara, Gus, Hana",4]]},{"columns":["class","student_count","kept","kept_if_gt_5_wrong"],"types":["character varying(255)","bigint","boolean","boolean"],"rows":[["Art",1,false,false],["Drama",5,true,false],["Math",6,true,true],["Physics",4,false,false]]}],"output":{"columns":["class"],"types":["character varying(255)"],"rows":[["Drama"],["Math"]]}}},{"id":27,"lc":1729,"slug":"find-followers-count","title":"Find Followers Count","section":"Sorting and Grouping","difficulty":"Easy","concepts":["GROUP BY","COUNT","ORDER BY","relationship direction"],"pattern":"Count related rows per key → GROUP BY the key, COUNT the other column, ORDER BY as requested.","statement":["The `Followers` table stores \"who follows whom\" in a social app. A row `(user_id, follower_id)` means **follower_id follows user_id** — so `user_id` is the account being followed. Each pair appears once.","For each user that appears in `user_id`, report how many followers they have."],"returns":"Columns `user_id` and `followers_count`, one row per followed user, **sorted by `user_id` ascending**.","setup":"CREATE TABLE Followers (\n  user_id     INT,\n  follower_id INT,\n  PRIMARY KEY (user_id, follower_id)\n);\n\nINSERT INTO Followers VALUES\n  (3, 1),\n  (1, 2),\n  (2, 1),\n  (1, 3),\n  (3, 2),\n  (1, 4);","tables":["Followers"],"table_notes":{"Followers":"Rows are stored out of order on purpose. User 4 follows someone but is never followed, so user 4 never appears in the `user_id` column."},"solution":"SELECT user_id,\n       COUNT(follower_id) AS followers_count\nFROM Followers\nGROUP BY user_id\nORDER BY user_id;","official_ordered":true,"output_notes":["**User 1 → 3** — followed by users 2, 3 and 4.","**User 2 → 1** — followed by user 1 only.","**User 3 → 2** — followed by users 1 and 2.","**User 4 is missing** — nobody follows user 4, so there is no row with `user_id = 4` to group. The problem only asks about users in this table, so this is expected."],"breakdown":[{"code":"FROM Followers","text":"All 6 follow relationships."},{"code":"GROUP BY user_id","text":"One group per **followed** user — `user_id` is the person being followed, so all of their followers land in the same group."},{"code":"COUNT(follower_id) AS followers_count","text":"Count the followers in each group. Since (user_id, follower_id) is the primary key, there are no duplicates, so a plain COUNT is correct."},{"code":"ORDER BY user_id","text":"The problem explicitly requires ascending `user_id`. GROUP BY does **not** guarantee any order, so this line is required."}],"exec_order":[{"stage":"FROM","code":"Followers","text":"6 rows."},{"stage":"GROUP BY","code":"user_id","text":"3 groups: users 1, 2, 3."},{"stage":"SELECT","code":"user_id, COUNT(follower_id)","text":"3, 1, 2 followers."},{"stage":"ORDER BY","code":"user_id","text":"Sort 1, 2, 3."}],"visuals":[{"kind":"string","title":"Step 1 — Read the direction of each row","diagram":"row (user_id, follower_id) = (3, 1)\n\n   follower_id 1 ──follows──▶ user_id 3\n\nuser_id     = the account being followed  ← we group by this\nfollower_id = the fan                     ← we count this","sql":"SELECT user_id,\n       follower_id,\n       'user ' || follower_id || ' follows user ' || user_id AS meaning\nFROM Followers\nORDER BY user_id, follower_id;","text":"Translating each row into a sentence removes the most common confusion: the row `(3, 1)` means user **1** follows user **3**. To count *followers of a user*, we must group by `user_id`."},{"kind":"group","title":"Step 2 — GROUP BY user_id and COUNT the followers","diagram":"user 1\n ├─ follower 2\n ├─ follower 3\n └─ follower 4      → COUNT = 3\nuser 2\n └─ follower 1      → COUNT = 1\nuser 3\n ├─ follower 1\n └─ follower 2      → COUNT = 2","sql":"SELECT user_id,\n       STRING_AGG(CAST(follower_id AS VARCHAR), ', ' ORDER BY follower_id) AS followers_in_group,\n       COUNT(follower_id) AS followers_count\nFROM Followers\nGROUP BY user_id\nORDER BY user_id;","text":"The 6 rows collapse into 3 groups. User 1 has three followers (2, 3, 4), user 2 has one (1), user 3 has two (1, 2). The final `ORDER BY user_id` then fixes the row order required by the problem."},{"kind":"group","title":"Step 3 — The wrong direction: GROUP BY follower_id","diagram":"follower 1\n ├─ follows user 2\n └─ follows user 3   → 2\nfollower 2\n ├─ follows user 1\n └─ follows user 3   → 2\nfollower 3\n └─ follows user 1   → 1\nfollower 4\n └─ follows user 1   → 1\n\nThis counts how many accounts each user FOLLOWS.","sql":"SELECT follower_id,\n       COUNT(user_id) AS following_count_WRONG\nFROM Followers\nGROUP BY follower_id\nORDER BY follower_id;","text":"Grouping by `follower_id` answers a different question — \"how many people does each user follow?\" It even produces a row for user 4, who has no followers at all. Same table, same COUNT, completely different meaning."}],"flow":[{"label":"Input table","detail":"Followers (6 rows)","ref":"input"},{"label":"Read the direction","detail":"follower_id follows user_id","ref":0},{"label":"GROUP BY user_id + COUNT","detail":"followers per user","ref":1},{"label":"Final output","detail":"ORDER BY user_id","ref":"output"}],"takeaway":{"pattern":"Count per key → `GROUP BY key` + `COUNT(other column)`; if an order is required, always add ORDER BY — grouping never sorts for you.","asks":["How would you return \"following\" counts instead? (GROUP BY follower_id.)","How do you include users with zero followers? (You would need a Users table and a LEFT JOIN with COUNT(f.follower_id), like counting with a skeleton.)","Does GROUP BY sort the output? (No. It may look sorted, but only ORDER BY guarantees order.)","When would you need COUNT(DISTINCT follower_id)? (Only if the same pair could be stored twice; the primary key prevents that here.)"],"alternatives":["`COUNT(*)` gives the same result here because every row in a group is one follower and there are no NULLs."],"realworld":"Follower counts, number of orders per customer, tickets per agent — the most basic \"count per key\" report, often the first query in a dashboard."},"mistakes":["Grouping by `follower_id` — that counts how many accounts a user follows, not their followers.","Leaving out `ORDER BY user_id` — the result order is then undefined, and the problem requires ascending order.","Selecting `follower_id` without aggregating it — PostgreSQL rejects non-grouped columns."],"built":{"id":27,"inputs":[{"name":"Followers","columns":["user_id","follower_id"],"types":["integer","integer"],"rows":[[3,1],[1,2],[2,1],[1,3],[3,2],[1,4]]}],"visuals":[{"columns":["user_id","follower_id","meaning"],"types":["integer","integer","text"],"rows":[[1,2,"user 2 follows user 1"],[1,3,"user 3 follows user 1"],[1,4,"user 4 follows user 1"],[2,1,"user 1 follows user 2"],[3,1,"user 1 follows user 3"],[3,2,"user 2 follows user 3"]]},{"columns":["user_id","followers_in_group","followers_count"],"types":["integer","text","bigint"],"rows":[[1,"2, 3, 4",3],[2,"1",1],[3,"1, 2",2]]},{"columns":["follower_id","following_count_wrong"],"types":["integer","bigint"],"rows":[[1,2],[2,2],[3,1],[4,1]]}],"output":{"columns":["user_id","followers_count"],"types":["integer","bigint"],"rows":[[1,3],[2,1],[3,2]]}}},{"id":28,"lc":619,"slug":"biggest-single-number","title":"Biggest Single Number","section":"Sorting and Grouping","difficulty":"Easy","concepts":["GROUP BY","HAVING COUNT(*) = 1","subquery in FROM","MAX","NULL on empty input"],"pattern":"Find values that occur once (GROUP BY + HAVING COUNT(*) = 1) in a subquery, then take MAX over it — the aggregate returns NULL when nothing qualifies.","statement":["The `MyNumbers` table holds a list of integers, and the same integer may appear many times. A **single number** is one that appears **exactly once** in the table.","Return the largest single number. If no number appears exactly once, return `null` instead (one row containing NULL)."],"returns":"Exactly one row with one column `num`: the biggest single number, or NULL if there is none.","setup":"CREATE TABLE MyNumbers (\n  num INT\n);\n\nINSERT INTO MyNumbers VALUES\n  (12), (12), (10), (7), (7), (7), (3), (5);","tables":["MyNumbers"],"table_notes":{"MyNumbers":"The biggest value overall, 12, appears **twice**, so it is not a single number. 7 appears three times. Only 10, 5 and 3 appear once."},"solution":"SELECT MAX(num) AS num\nFROM (\n    SELECT num\n    FROM MyNumbers\n    GROUP BY num\n    HAVING COUNT(*) = 1\n) AS singles;","output_notes":["**10** — the single numbers are 3, 5 and 10; the largest is 10.","**12 is not the answer** even though it is the largest value: it appears twice, so the HAVING step removed it before MAX ran.","If the table had no single number at all, this same query would return **one row with NULL** (see Step 4)."],"breakdown":[{"code":"SELECT num\nFROM MyNumbers\nGROUP BY num","text":"Inner query: one group per distinct value — 3, 5, 7, 10, 12."},{"code":"HAVING COUNT(*) = 1","text":"Keep only values whose group has exactly one row. `COUNT(*)` counts rows, so 12 (2 rows) and 7 (3 rows) are removed."},{"code":") AS singles","text":"A subquery in FROM must have an alias in PostgreSQL. `singles` now holds 3, 5, 10."},{"code":"SELECT MAX(num) AS num","text":"Take the largest value from `singles`. Because MAX is an aggregate with no GROUP BY, the outer query **always returns exactly one row** — the maximum, or NULL if `singles` is empty."}],"exec_order":[{"stage":"FROM","code":"singles: FROM MyNumbers","text":"8 rows."},{"stage":"GROUP BY","code":"singles: GROUP BY num","text":"5 groups: 3, 5, 7, 10, 12."},{"stage":"HAVING","code":"singles: COUNT(*) = 1","text":"Drop 7 and 12 → 3, 5, 10."},{"stage":"SELECT","code":"singles: num","text":"The subquery returns 3 rows."},{"stage":"FROM","code":"(…) AS singles","text":"Outer query reads the 3 single numbers."},{"stage":"SELECT","code":"MAX(num)","text":"One row: 10."}],"visuals":[{"kind":"having","title":"Step 1 — GROUP BY num, HAVING COUNT(*) = 1","diagram":"3\n └─ 3                → 1 row   ✓ single\n5\n └─ 5                → 1 row   ✓ single\n7\n ├─ 7\n ├─ 7\n └─ 7                → 3 rows  ✗ removed\n10\n └─ 10               → 1 row   ✓ single\n12\n ├─ 12\n └─ 12               → 2 rows  ✗ removed","sql":"SELECT num,\n       COUNT(*)     AS times_seen,\n       COUNT(*) = 1 AS kept\nFROM MyNumbers\nGROUP BY num\nORDER BY num;","text":"Grouping by the value itself shows how often each number occurs. HAVING keeps the groups with exactly one row: **3, 5 and 10**. 7 and 12 are removed — notice 12, the largest value, is gone already."},{"kind":"subquery","title":"Step 2 — What the subquery returns on its own","diagram":"MyNumbers (8 rows)\n     │  GROUP BY num\n     │  HAVING COUNT(*) = 1\n     ▼\nsingles = { 3, 5, 10 }","sql":"SELECT num\nFROM MyNumbers\nGROUP BY num\nHAVING COUNT(*) = 1\nORDER BY num;","text":"Run alone, the inner query is just the list of single numbers. The outer query will treat this result like a table named `singles`."},{"kind":"subquery","title":"Step 3 — Outer query: MAX over the single numbers","diagram":"singles = { 3, 5, 10 }\n        │\n        ▼  MAX(num)\n       10","sql":"SELECT COUNT(*) AS singles_found,\n       MAX(num) AS num\nFROM (\n    SELECT num\n    FROM MyNumbers\n    GROUP BY num\n    HAVING COUNT(*) = 1\n) AS singles;","text":"MAX reads the 3 rows of `singles` and returns **10**. The helper column `singles_found` shows how many single numbers MAX had to work with."},{"kind":"subquery","title":"Step 4 — Edge case: no single number → one NULL row","diagram":"numbers = 8, 8, 3, 3, 3\n   GROUP BY + HAVING COUNT(*) = 1\n   ▼\nsingles = { }            (0 rows)\n   ▼  MAX(num)\nnum = NULL               (still 1 row!)\n\nORDER BY num DESC LIMIT 1 on { } → 0 rows ✗","sql":"WITH no_singles (num) AS (\n    VALUES (8), (8), (3), (3), (3)\n)\nSELECT COUNT(*) AS singles_found,\n       MAX(num) AS num_with_max,\n       (SELECT COUNT(*)\n        FROM (SELECT num\n              FROM no_singles\n              GROUP BY num\n              HAVING COUNT(*) = 1\n              ORDER BY num DESC\n              LIMIT 1) AS t) AS rows_from_limit_version\nFROM (\n    SELECT num\n    FROM no_singles\n    GROUP BY num\n    HAVING COUNT(*) = 1\n) AS singles;","text":"With data where every number repeats, the subquery returns **0 rows**. An aggregate without GROUP BY still produces **exactly one row**, and MAX of an empty set is **NULL** — exactly what the problem wants. The tempting alternative `ORDER BY num DESC LIMIT 1` returns **0 rows** instead, which LeetCode marks wrong."}],"flow":[{"label":"Input table","detail":"MyNumbers (8 rows, duplicates)","ref":"input"},{"label":"GROUP BY + HAVING","detail":"keep values seen exactly once","ref":0},{"label":"Subquery result","detail":"singles = 3, 5, 10","ref":1},{"label":"MAX over singles","detail":"10 (NULL if empty)","ref":2},{"label":"Final output","detail":"one row, column num","ref":"output"}],"takeaway":{"pattern":"\"Return a value, or NULL if none exists\" → wrap the candidate rows in a subquery and apply an aggregate (MAX/MIN). An aggregate without GROUP BY always returns one row, NULL on empty input.","asks":["Why does the outer MAX return NULL instead of no rows? (An aggregate query with no GROUP BY always produces exactly one row; MAX over zero rows is NULL.)","Why not `SELECT num … ORDER BY num DESC LIMIT 1`? (On an empty result it returns zero rows, not a NULL row.)","Can you write it without the subquery in FROM? (Yes: `SELECT (SELECT num FROM MyNumbers GROUP BY num HAVING COUNT(*) = 1 ORDER BY num DESC LIMIT 1) AS num;` — a scalar subquery also yields NULL when empty.)","Why not `WHERE COUNT(*) = 1`? (Aggregates are not allowed in WHERE; the per-value count only exists after GROUP BY, so it belongs in HAVING.)"],"alternatives":["Scalar subquery: `SELECT (SELECT num FROM MyNumbers GROUP BY num HAVING COUNT(*) = 1 ORDER BY num DESC LIMIT 1) AS num;`","CTE version: `WITH singles AS (SELECT num FROM MyNumbers GROUP BY num HAVING COUNT(*) = 1) SELECT MAX(num) AS num FROM singles;`"],"realworld":"Finding unique values (e.g. the highest bid that no one else matched, coupon codes used only once), and any report that must return a single \"no result\" row instead of an empty set."},"mistakes":["`SELECT MAX(num) FROM MyNumbers` — returns 12, which is duplicated, not a single number.","`SELECT DISTINCT num …` — DISTINCT removes repeats but keeps the value (12 would stay); we must drop values that repeat.","`ORDER BY num DESC LIMIT 1` on the singles — returns no row when there is no single number, but the problem requires a NULL row.","Forgetting the alias on the derived table — PostgreSQL versions before 16 require `AS singles`; it is good style either way."],"built":{"id":28,"inputs":[{"name":"MyNumbers","columns":["num"],"types":["integer"],"rows":[[12],[12],[10],[7],[7],[7],[3],[5]]}],"visuals":[{"columns":["num","times_seen","kept"],"types":["integer","bigint","boolean"],"rows":[[3,1,true],[5,1,true],[7,3,false],[10,1,true],[12,2,false]]},{"columns":["num"],"types":["integer"],"rows":[[3],[5],[10]]},{"columns":["singles_found","num"],"types":["bigint","integer"],"rows":[[3,10]]},{"columns":["singles_found","num_with_max","rows_from_limit_version"],"types":["bigint","integer","bigint"],"rows":[[0,null,0]]}],"output":{"columns":["num"],"types":["integer"],"rows":[[10]]}}},{"id":29,"lc":1045,"slug":"customers-who-bought-all-products","title":"Customers Who Bought All Products","section":"Sorting and Grouping","difficulty":"Medium","concepts":["GROUP BY","HAVING","COUNT(DISTINCT)","scalar subquery","relational division"],"pattern":"\"Has all of the items\" → per group, COUNT(DISTINCT item) must equal the total number of items (a scalar subquery).","statement":["The `Customer` table logs purchases: each row says a customer bought a product (identified by `product_key`). The same customer can buy the same product many times, so rows can repeat. The `Product` table lists every product that exists.","Find the customers who have bought **every** product in the `Product` table at least once."],"returns":"A single column `customer_id` with each customer who bought all products. Any order.","setup":"CREATE TABLE Product (\n  product_key INT PRIMARY KEY\n);\nCREATE TABLE Customer (\n  customer_id INT NOT NULL,\n  product_key INT REFERENCES Product (product_key)\n);\n\nINSERT INTO Product VALUES (10), (20), (30);\nINSERT INTO Customer VALUES\n  (1, 10), (1, 20), (1, 30),\n  (2, 10), (2, 10), (2, 20),\n  (3, 30), (3, 20), (3, 10), (3, 10),\n  (4, 20);","tables":["Customer","Product"],"table_notes":{"Customer":"Customer 2 bought product 10 twice and never bought 30 — 3 rows but only 2 products. Customer 3 has 4 rows because product 10 was bought twice.","Product":"3 products exist, so \"bought all\" means 3 different product keys."},"solution":"SELECT customer_id\nFROM Customer\nGROUP BY customer_id\nHAVING COUNT(DISTINCT product_key) = (\n    SELECT COUNT(*)\n    FROM Product\n);","display_sql":"SELECT customer_id\nFROM Customer\nGROUP BY customer_id\nHAVING COUNT(DISTINCT product_key) = (\n    SELECT COUNT(*)\n    FROM Product\n)\nORDER BY customer_id;","output_notes":["**Customer 1** — bought 10, 20 and 30: 3 distinct products = 3 products in the catalog.","**Customer 3** — bought 10 twice, 20 and 30: still 3 distinct products, so the repeat does not matter.","**Customer 2 is missing** — 3 rows, but only 2 distinct products (10, 20). Product 30 was never bought.","**Customer 4 is missing** — bought only product 20."],"breakdown":[{"code":"FROM Customer","text":"All 11 purchase rows."},{"code":"GROUP BY customer_id","text":"One group per customer (1, 2, 3, 4)."},{"code":"HAVING COUNT(DISTINCT product_key)","text":"How many **different** products did this customer buy? DISTINCT is essential because purchases repeat: customer 2's rows 10, 10, 20 are only 2 products."},{"code":"= (\n    SELECT COUNT(*)\n    FROM Product\n)","text":"A scalar subquery: it returns a single value — the number of products that exist (3). Each group is kept only if its distinct count equals it. Since `product_key` references `Product`, a customer can't have more distinct products than the catalog, so equality means \"all of them\"."},{"code":"SELECT customer_id","text":"Return the surviving customers. Any order is fine."}],"exec_order":[{"stage":"FROM","code":"Customer","text":"11 rows."},{"stage":"GROUP BY","code":"customer_id","text":"4 groups."},{"stage":"HAVING","code":"COUNT(DISTINCT product_key) = (SELECT COUNT(*) FROM Product)","text":"The subquery gives 3; only customers 1 and 3 have 3 distinct products."},{"stage":"SELECT","code":"customer_id","text":"1, 3."}],"visuals":[{"kind":"subquery","title":"Step 1 — The subquery: how many products exist?","diagram":"Product\n ├─ 10\n ├─ 20\n └─ 30\n     │  SELECT COUNT(*)\n     ▼\n total_products = 3   (one value → a scalar subquery)","sql":"SELECT COUNT(*) AS total_products\nFROM Product;","text":"Run on its own, the subquery returns a single number: **3**. That is the target — a customer must have bought 3 different products to have bought them all. Because it is computed from the table, the query still works if products are added later."},{"kind":"group","title":"Step 2 — GROUP BY customer_id: rows vs distinct products","diagram":"customer 1\n ├─ 10\n ├─ 20\n └─ 30          → rows 3, distinct {10,20,30} = 3\ncustomer 2\n ├─ 10\n ├─ 10  ← repeat\n └─ 20          → rows 3, distinct {10,20}    = 2\ncustomer 3\n ├─ 10\n ├─ 10  ← repeat\n ├─ 20\n └─ 30          → rows 4, distinct {10,20,30} = 3\ncustomer 4\n └─ 20          → rows 1, distinct {20}       = 1","sql":"SELECT customer_id,\n       STRING_AGG(CAST(product_key AS VARCHAR), ', ' ORDER BY product_key) AS products_in_group,\n       COUNT(*)                    AS purchase_rows,\n       COUNT(DISTINCT product_key) AS distinct_products\nFROM Customer\nGROUP BY customer_id\nORDER BY customer_id;","text":"Repeated purchases inflate the row count: customer 2 has 3 rows but only 2 different products, and customer 3 has 4 rows for 3 products. `COUNT(DISTINCT product_key)` gives the number we actually need: 3, 2, 3, 1."},{"kind":"having","title":"Step 3 — HAVING distinct products = 3: which customers are kept?","diagram":"total_products = 3 (from Step 1)\n\ncustomer 1   distinct 3 = 3 ?  ✓ kept\ncustomer 2   distinct 2 = 3 ?  ✗ removed (never bought 30)\ncustomer 3   distinct 3 = 3 ?  ✓ kept\ncustomer 4   distinct 1 = 3 ?  ✗ removed","sql":"SELECT customer_id,\n       COUNT(DISTINCT product_key) AS distinct_products,\n       (SELECT COUNT(*) FROM Product) AS total_products,\n       COUNT(DISTINCT product_key) = (SELECT COUNT(*) FROM Product) AS kept,\n       COUNT(*) = (SELECT COUNT(*) FROM Product) AS kept_if_count_star_WRONG\nFROM Customer\nGROUP BY customer_id\nORDER BY customer_id;","text":"Customers 1 and 3 match the total of 3 and are kept; 2 and 4 are removed. The last column shows what plain `COUNT(*)` would do: customer **2** (3 rows, only 2 products) would be wrongly **kept**, and customer **3** (4 rows) would be wrongly **removed**."}],"flow":[{"label":"Input tables","detail":"Customer (11 rows, repeats) · Product (3)","ref":"input"},{"label":"Subquery","detail":"SELECT COUNT(*) FROM Product → 3","ref":0},{"label":"GROUP BY customer","detail":"COUNT(DISTINCT product_key) per customer","ref":1},{"label":"HAVING = 3","detail":"keep customers 1 and 3","ref":2},{"label":"Final output","detail":"customer_id","ref":"output"}],"takeaway":{"pattern":"Relational division (\"X that has every Y\") → `GROUP BY X HAVING COUNT(DISTINCT y) = (SELECT COUNT(*) FROM Y)`.","asks":["Why COUNT(DISTINCT) and not COUNT(*)? (Repeat purchases would let a customer reach the total with duplicates — customer 2 here.)","What if Customer could contain product keys that are not in Product? (Then count only valid ones: join Customer to Product first, or filter `WHERE product_key IN (SELECT product_key FROM Product)`, before counting.)","What if the Product table were empty? (The subquery returns 0, and no customer group has 0 distinct products — so nobody is returned. Worth mentioning as an edge case.)","Can you do it with NOT EXISTS? (Yes — the classic double NOT EXISTS: customers for whom no product exists that they did not buy. Correct but harder to read.)"],"alternatives":["CTE version: `WITH per_customer AS (SELECT customer_id, COUNT(DISTINCT product_key) AS cnt FROM Customer GROUP BY customer_id) SELECT customer_id FROM per_customer WHERE cnt = (SELECT COUNT(*) FROM Product);`","Double NOT EXISTS: `SELECT DISTINCT c.customer_id FROM Customer AS c WHERE NOT EXISTS (SELECT 1 FROM Product AS p WHERE NOT EXISTS (SELECT 1 FROM Customer AS c2 WHERE c2.customer_id = c.customer_id AND c2.product_key = p.product_key));`"],"realworld":"Students who completed every required course, users who tried every feature, stores that stock every product of a promotion — all \"has all of\" questions."},"mistakes":["Using `COUNT(*)` or `COUNT(product_key)` — repeated purchases are counted, so customer 2 (10, 10, 20) would wrongly pass.","Hard-coding the total (`= 3`) — the query breaks as soon as the Product table changes. Use the subquery.","Putting the condition in WHERE — aggregates are not allowed there; it must be HAVING.","Forgetting the parentheses around the subquery — a subquery used as a value must be wrapped in `( … )`."],"built":{"id":29,"inputs":[{"name":"Customer","columns":["customer_id","product_key"],"types":["integer","integer"],"rows":[[1,10],[1,20],[1,30],[2,10],[2,10],[2,20],[3,30],[3,20],[3,10],[3,10],[4,20]]},{"name":"Product","columns":["product_key"],"types":["integer"],"rows":[[10],[20],[30]]}],"visuals":[{"columns":["total_products"],"types":["bigint"],"rows":[[3]]},{"columns":["customer_id","products_in_group","purchase_rows","distinct_products"],"types":["integer","text","bigint","bigint"],"rows":[[1,"10, 20, 30",3,3],[2,"10, 10, 20",3,2],[3,"10, 10, 20, 30",4,3],[4,"20",1,1]]},{"columns":["customer_id","distinct_products","total_products","kept","kept_if_count_star_wrong"],"types":["integer","bigint","bigint","boolean","boolean"],"rows":[[1,3,3,true,true],[2,2,3,false,true],[3,3,3,true,false],[4,1,3,false,false]]}],"output":{"columns":["customer_id"],"types":["integer"],"rows":[[1],[3]]}}},{"id":30,"lc":1731,"slug":"the-number-of-employees-which-report-to-each-employee","title":"The Number of Employees Which Report to Each Employee","section":"Advanced Select and Joins","difficulty":"Easy","concepts":["SELF JOIN","INNER JOIN","GROUP BY","COUNT","AVG","ROUND(NUMERIC)"],"pattern":"Join a table to itself (one copy plays the manager, the other the report), then GROUP BY the manager and aggregate the reports.","statement":["The **Employees** table stores each employee's id, name, age and `reports_to` — the id of the person they report to. People at the top have `reports_to = NULL`.","Call someone a **manager** if at least one other employee reports directly to them. For every manager, report how many people report to them and the average age of those people, rounded to the nearest whole number."],"returns":"One row per manager: `employee_id`, `name`, `reports_count` and `average_age` (rounded to an integer, .5 goes up). Sort by `employee_id`.","setup":"CREATE TABLE Employees (\n  employee_id INT PRIMARY KEY,\n  name        VARCHAR(20),\n  reports_to  INT,\n  age         INT\n);\n\nINSERT INTO Employees VALUES\n  (1, 'Maria', NULL, 52),\n  (2, 'Omar',  1,    40),\n  (3, 'Lena',  1,    35),\n  (4, 'Ken',   2,    28),\n  (5, 'Priya', 2,    29),\n  (6, 'Tom',   NULL, 45),\n  (7, 'Sara',  1,    36);","tables":["Employees"],"table_notes":{"Employees":"Omar is both a report (of Maria) and a manager (of Ken and Priya). Tom reports to nobody and nobody reports to him."},"solution":"SELECT manager.employee_id,\n       manager.name,\n       COUNT(report.employee_id)          AS reports_count,\n       ROUND(AVG(report.age)::NUMERIC, 0) AS average_age\nFROM Employees AS manager\nINNER JOIN Employees AS report\n        ON report.reports_to = manager.employee_id\nGROUP BY manager.employee_id, manager.name\nORDER BY manager.employee_id;","output_notes":["**Maria (1)** — Omar, Lena and Sara report to her: 3 reports, ages 40 + 35 + 36 = 111, 111 / 3 = 37.","**Omar (2)** — Ken and Priya report to him: 2 reports, (28 + 29) / 2 = **28.5**, which rounds **up** to 29.","**Tom, Lena, Ken, Priya, Sara are missing** — nobody has them in `reports_to`, so they never find a match as a manager and the INNER JOIN drops them."],"breakdown":[{"code":"FROM Employees AS manager","text":"First copy of the table. Every row here is a **candidate** manager."},{"code":"INNER JOIN Employees AS report\n        ON report.reports_to = manager.employee_id","text":"Second copy of the **same** table: the people who report. A row is produced for each (manager, report) pair. The aliases are essential — without them PostgreSQL cannot tell which copy `employee_id` belongs to. INNER JOIN removes employees nobody reports to, which is exactly the \"at least 1 report\" rule."},{"code":"GROUP BY manager.employee_id, manager.name","text":"One group per manager. Its rows are that manager's direct reports."},{"code":"COUNT(report.employee_id) AS reports_count","text":"Number of reports in the group."},{"code":"ROUND(AVG(report.age)::NUMERIC, 0) AS average_age","text":"Average age, rounded to a whole number. In PostgreSQL `AVG(INT)` already returns NUMERIC; the `::NUMERIC` cast makes that explicit and guarantees the NUMERIC version of ROUND, which rounds **half away from zero** (28.5 → 29). The double-precision version rounds half to even (28.5 → 28)."},{"code":"ORDER BY manager.employee_id","text":"The problem asks for this order."}],"exec_order":[{"stage":"FROM","code":"Employees AS manager","text":"7 candidate managers."},{"stage":"JOIN / ON","code":"INNER JOIN Employees AS report ON report.reports_to = manager.employee_id","text":"Keep only (manager, report) pairs → 5 rows."},{"stage":"GROUP BY","code":"manager.employee_id, manager.name","text":"2 groups: Maria and Omar."},{"stage":"SELECT","code":"COUNT(...), ROUND(AVG(...)::NUMERIC, 0)","text":"Count reports and round their average age."},{"stage":"ORDER BY","code":"manager.employee_id","text":"Sort the managers."}],"visuals":[{"kind":"join","title":"Step 1 — Self join: pair each manager with their reports","diagram":"Employees AS manager          Employees AS report\n  manager.employee_id ◀── = ── report.reports_to\n\nMaria (1) ──┬── Omar  (reports_to 1)\n            ├── Lena  (reports_to 1)\n            └── Sara  (reports_to 1)\nOmar  (2) ──┬── Ken   (reports_to 2)\n            └── Priya (reports_to 2)\nLena, Ken, Priya, Tom, Sara ── no match ✗ (dropped by INNER JOIN)","sql":"SELECT manager.employee_id AS manager_id,\n       manager.name        AS manager_name,\n       report.employee_id  AS report_id,\n       report.name         AS report_name,\n       report.age          AS report_age,\n       report.employee_id IS NOT NULL AS kept_by_inner_join\nFROM Employees AS manager\nLEFT JOIN Employees AS report\n       ON report.reports_to = manager.employee_id\nORDER BY kept_by_inner_join DESC, manager.employee_id, report.employee_id;","text":"To make the dropped rows visible, this view uses a LEFT JOIN and marks what the INNER JOIN keeps. Maria matches 3 reports and Omar 2. Lena, Ken, Priya, Tom and Sara have nobody pointing at them, so their `report_*` columns are NULL and the INNER JOIN removes them — they are not managers."},{"kind":"group","title":"Step 2 — GROUP BY manager: count and average","diagram":"Maria (1)\n ├─ Omar  40\n ├─ Lena  35\n └─ Sara  36      → COUNT = 3, SUM = 111, AVG = 37\nOmar (2)\n ├─ Ken   28\n └─ Priya 29      → COUNT = 2, SUM = 57,  AVG = 28.5","sql":"SELECT manager.employee_id,\n       manager.name,\n       COUNT(report.employee_id) AS reports_count,\n       SUM(report.age)           AS sum_age,\n       ROUND(AVG(report.age), 2) AS avg_age\nFROM Employees AS manager\nINNER JOIN Employees AS report\n        ON report.reports_to = manager.employee_id\nGROUP BY manager.employee_id, manager.name\nORDER BY manager.employee_id;","text":"The 5 joined rows collapse into 2 groups. Maria's reports average exactly 37.00; Omar's average **28.50** — a halfway value, so the rounding rule matters."},{"kind":"case","title":"Step 3 — Rounding: NUMERIC vs double precision","diagram":"avg_age     ROUND(::NUMERIC, 0)   ROUND(::DOUBLE PRECISION)\n  37.00  →        37                    37\n  28.50  →        29  ✓ half up         28  ✗ half to even","sql":"SELECT manager.name,\n       ROUND(AVG(report.age), 2)                 AS avg_age,\n       ROUND(AVG(report.age)::NUMERIC, 0)         AS round_numeric,\n       ROUND(AVG(report.age)::DOUBLE PRECISION)   AS round_double_WRONG\nFROM Employees AS manager\nINNER JOIN Employees AS report\n        ON report.reports_to = manager.employee_id\nGROUP BY manager.employee_id, manager.name\nORDER BY manager.employee_id;","text":"LeetCode expects 28.5 → **29** (the usual school rule). PostgreSQL's NUMERIC ROUND does that. If the average were a double precision value, ROUND would use \"round half to even\" and give 28. Also note `ROUND(double, 0)` with a second argument does not exist at all — another reason to cast to NUMERIC."}],"flow":[{"label":"Input table","detail":"Employees (7 rows)","ref":"input"},{"label":"Self join","detail":"manager.employee_id = report.reports_to → 5 pairs","ref":0},{"label":"GROUP BY manager","detail":"COUNT and AVG per manager → 2 groups","ref":1},{"label":"ROUND as NUMERIC","detail":"28.5 → 29 (half away from zero)","ref":2},{"label":"Final output","detail":"ORDER BY employee_id","ref":"output"}],"takeaway":{"pattern":"Hierarchy stored in one table (`reports_to`, `parent_id`, `manager_id`) → self join with two clearly named aliases, then GROUP BY the parent side.","asks":["Why INNER JOIN and not LEFT JOIN? (LEFT JOIN would also return employees with 0 reports; they are not managers.)","Why COUNT(report.employee_id) and not COUNT(*)? (Same here because of the INNER JOIN, but counting the report column stays correct if someone switches to LEFT JOIN.)","What if the result should include indirect reports too? (You need a recursive CTE: WITH RECURSIVE that walks down the tree.)","How does ROUND treat 28.5 in PostgreSQL? (NUMERIC: 29. Double precision: 28, half to even.)"],"alternatives":["Aggregate first: `SELECT reports_to, COUNT(*), ROUND(AVG(age)) FROM Employees WHERE reports_to IS NOT NULL GROUP BY reports_to`, then INNER JOIN that result to Employees to get the manager's name. Same answer."],"realworld":"Org charts, category trees, comment threads, referral programs — any parent/child table where you want per-parent statistics (team size, average tenure, number of replies)."},"mistakes":["Joining on the wrong direction (`manager.reports_to = report.employee_id`) — that pairs each employee with **their own** manager and counts the wrong people.","Grouping by `report.reports_to` but selecting `manager.name` without grouping by it — PostgreSQL rejects non-grouped columns.","Rounding a double precision average: `ROUND(x::FLOAT)` gives 28 for 28.5, and `ROUND(x::FLOAT, 0)` raises \"function round(double precision, integer) does not exist\". Keep the value NUMERIC.","Using LEFT JOIN — employees with no reports would appear with `reports_count = 0`.","Forgetting the aliases in a self join — `employee_id` becomes ambiguous."],"built":{"id":30,"inputs":[{"name":"Employees","columns":["employee_id","name","reports_to","age"],"types":["integer","character varying(20)","integer","integer"],"rows":[[1,"Maria",null,52],[2,"Omar",1,40],[3,"Lena",1,35],[4,"Ken",2,28],[5,"Priya",2,29],[6,"Tom",null,45],[7,"Sara",1,36]]}],"visuals":[{"columns":["manager_id","manager_name","report_id","report_name","report_age","kept_by_inner_join"],"types":["integer","character varying(20)","integer","character varying(20)","integer","boolean"],"rows":[[1,"Maria",2,"Omar",40,true],[1,"Maria",3,"Lena",35,true],[1,"Maria",7,"Sara",36,true],[2,"Omar",4,"Ken",28,true],[2,"Omar",5,"Priya",29,true],[3,"Lena",null,null,null,false],[4,"Ken",null,null,null,false],[5,"Priya",null,null,null,false],[6,"Tom",null,null,null,false],[7,"Sara",null,null,null,false]]},{"columns":["employee_id","name","reports_count","sum_age","avg_age"],"types":["integer","character varying(20)","bigint","bigint","numeric"],"rows":[[1,"Maria",3,111,"37.00"],[2,"Omar",2,57,"28.50"]]},{"columns":["name","avg_age","round_numeric","round_double_wrong"],"types":["character varying(20)","numeric","numeric","double precision"],"rows":[["Maria","37.00",37,37],["Omar","28.50",29,28]]}],"output":{"columns":["employee_id","name","reports_count","average_age"],"types":["integer","character varying(20)","bigint","numeric"],"rows":[[1,"Maria",3,37],[2,"Omar",2,29]]}}},{"id":31,"lc":1789,"slug":"primary-department-for-each-employee","title":"Primary Department for Each Employee","section":"Advanced Select and Joins","difficulty":"Easy","concepts":["WHERE … OR …","IN (subquery)","GROUP BY","HAVING COUNT(*) = 1","UNION"],"pattern":"A row qualifies for one of two independent reasons → combine the two conditions with OR (or two SELECTs with UNION), using a GROUP BY … HAVING subquery for the per-employee reason.","statement":["The **Employee** table links employees to departments. An employee can belong to several departments; in that case exactly one of their rows has `primary_flag = 'Y'` and the others have `'N'`.","An employee who belongs to **only one** department never picks a primary one, so that single row has `primary_flag = 'N'`. Report every employee together with their primary department — or their only department if they have just one."],"returns":"One row per employee: `employee_id` and `department_id`. Any order.","setup":"CREATE TABLE Employee (\n  employee_id   INT,\n  department_id INT,\n  primary_flag  VARCHAR(1),\n  PRIMARY KEY (employee_id, department_id)\n);\n\nINSERT INTO Employee VALUES\n  (101, 10, 'N'),\n  (102, 10, 'Y'),\n  (102, 20, 'N'),\n  (103, 30, 'N'),\n  (104, 10, 'N'),\n  (104, 20, 'N'),\n  (104, 30, 'Y'),\n  (105, 40, 'N');","tables":["Employee"],"table_notes":{"Employee":"101, 103 and 105 have a single department with flag 'N'. 102 and 104 have several departments and exactly one 'Y'."},"solution":"SELECT employee_id,\n       department_id\nFROM Employee\nWHERE primary_flag = 'Y'\n   OR employee_id IN (\n          SELECT employee_id\n          FROM Employee\n          GROUP BY employee_id\n          HAVING COUNT(*) = 1\n      );","display_sql":"SELECT employee_id,\n       department_id\nFROM Employee\nWHERE primary_flag = 'Y'\n   OR employee_id IN (\n          SELECT employee_id\n          FROM Employee\n          GROUP BY employee_id\n          HAVING COUNT(*) = 1\n      )\nORDER BY employee_id;","output_notes":["**101 → 10**, **103 → 30**, **105 → 40** — each has exactly one department, so the subquery lists them even though their flag is 'N'.","**102 → 10** and **104 → 30** — these rows have `primary_flag = 'Y'`.","Rows like (102, 20, 'N') or (104, 10, 'N') are missing: the flag is 'N' **and** the employee has more than one department, so neither condition is TRUE."],"breakdown":[{"code":"SELECT employee_id,\n       department_id\nFROM Employee","text":"Read the rows directly — the answer is a subset of the table's rows."},{"code":"WHERE primary_flag = 'Y'","text":"Reason 1: the row is the chosen primary department (employees with several departments)."},{"code":"OR employee_id IN (\n    SELECT employee_id\n    FROM Employee\n    GROUP BY employee_id\n    HAVING COUNT(*) = 1\n)","text":"Reason 2: the employee has **exactly one** row in the table. The subquery groups by employee and keeps groups of size 1, returning a list of ids. For those employees the single row is the answer, whatever its flag."},{"code":"OR","text":"A row is kept if **either** reason is TRUE. Both can never be TRUE together for a valid table, so no employee is returned twice."}],"exec_order":[{"stage":"FROM","code":"subquery: Employee","text":"The subquery reads all 8 rows."},{"stage":"GROUP BY","code":"subquery: employee_id","text":"5 groups, one per employee."},{"stage":"HAVING","code":"subquery: COUNT(*) = 1","text":"Keep 101, 103, 105."},{"stage":"FROM","code":"Employee","text":"The outer query reads all 8 rows."},{"stage":"WHERE","code":"primary_flag = 'Y' OR employee_id IN (…)","text":"Keep 5 rows: two 'Y' rows + three single-department rows."},{"stage":"SELECT","code":"employee_id, department_id","text":"Return the two columns."}],"visuals":[{"kind":"having","title":"Step 1 — GROUP BY employee: how many departments?","diagram":"101 └─ 10              → COUNT = 1  ✓ kept\n102 ├─ 10 └─ 20        → COUNT = 2  ✗\n103 └─ 30              → COUNT = 1  ✓ kept\n104 ├─ 10 ├─ 20 └─ 30  → COUNT = 3  ✗\n105 └─ 40              → COUNT = 1  ✓ kept","sql":"SELECT employee_id,\n       COUNT(*)     AS dept_count,\n       COUNT(*) = 1 AS kept\nFROM Employee\nGROUP BY employee_id\nORDER BY employee_id;","text":"Every employee gets a group. `HAVING COUNT(*) = 1` keeps only the groups with a single department: 101, 103 and 105. 102 and 104 are removed — they must be answered by their 'Y' row instead."},{"kind":"subquery","title":"Step 2 — What the subquery returns","diagram":"( SELECT employee_id … HAVING COUNT(*) = 1 )\n                 │\n                 ▼\n           { 101, 103, 105 }\n                 │\nouter WHERE … OR employee_id IN { 101, 103, 105 }","sql":"SELECT employee_id\nFROM Employee\nGROUP BY employee_id\nHAVING COUNT(*) = 1\nORDER BY employee_id;","text":"On its own the subquery is just a list of ids. The outer query uses it as a membership test: a row of employee 101, 103 or 105 passes the second condition."},{"kind":"filter","title":"Step 3 — Evaluate both conditions on every row","diagram":"row              flag='Y'   id IN {101,103,105}   OR → kept?\n(101, 10, N)      FALSE          TRUE                ✓\n(102, 10, Y)      TRUE           FALSE               ✓\n(102, 20, N)      FALSE          FALSE               ✗\n(104, 30, Y)      TRUE           FALSE               ✓\n…","sql":"SELECT employee_id,\n       department_id,\n       primary_flag,\n       primary_flag = 'Y' AS is_primary,\n       employee_id IN (\n           SELECT employee_id\n           FROM Employee\n           GROUP BY employee_id\n           HAVING COUNT(*) = 1\n       ) AS only_one_dept,\n       primary_flag = 'Y'\n       OR employee_id IN (\n           SELECT employee_id\n           FROM Employee\n           GROUP BY employee_id\n           HAVING COUNT(*) = 1\n       ) AS kept\nFROM Employee\nORDER BY employee_id, department_id;","text":"Part 1 (`is_primary`) picks (102, 10) and (104, 30). Part 2 (`only_one_dept`) picks (101, 10), (103, 30) and (105, 40). The 'N' rows of 102 and 104 fail both tests and are dropped. 8 rows → 5 rows, one per employee."},{"kind":"union","title":"Step 4 — The same answer as two parts (UNION view)","diagram":"Part 1: WHERE primary_flag = 'Y'            → (102, 10), (104, 30)\nPart 2: WHERE employee_id IN {101,103,105}  → (101, 10), (103, 30), (105, 40)\n                     │\n                     └── UNION ──▶ 5 rows, one per employee","sql":"SELECT 'Part 1: flag = Y' AS found_by,\n       employee_id,\n       department_id\nFROM Employee\nWHERE primary_flag = 'Y'\nUNION ALL\nSELECT 'Part 2: only one department',\n       employee_id,\n       department_id\nFROM Employee\nWHERE employee_id IN (\n          SELECT employee_id\n          FROM Employee\n          GROUP BY employee_id\n          HAVING COUNT(*) = 1\n      )\nORDER BY employee_id;","text":"The OR condition is equivalent to stacking two separate queries. The `found_by` label shows which part supplied each row: 102 and 104 come from Part 1, 101, 103 and 105 from Part 2. The parts never overlap, because an employee with one department never has a 'Y' row."}],"flow":[{"label":"Input table","detail":"Employee (8 rows, 5 employees)","ref":"input"},{"label":"GROUP BY + HAVING","detail":"department count per employee","ref":0},{"label":"Subquery result","detail":"{101, 103, 105} have one department","ref":1},{"label":"WHERE … OR …","detail":"flag = 'Y' OR single-department employee","ref":2},{"label":"Two parts","detail":"Part 1 ('Y' rows) + Part 2 (only department)","ref":3},{"label":"Final output","detail":"one row per employee","ref":"output"}],"takeaway":{"pattern":"\"Take this row if A, or if B\" where B is a per-group fact → compute B with GROUP BY … HAVING in a subquery and combine with OR (or UNION two SELECTs).","asks":["Could you write it with UNION? (Yes: SELECT … WHERE primary_flag = 'Y' UNION SELECT … WHERE employee_id IN (single-department subquery).)","UNION or UNION ALL here? (The two parts never overlap, so both give the same rows; UNION ALL skips the duplicate check and is slightly cheaper.)","Why not just WHERE primary_flag = 'Y'? (Single-department employees have 'N' and would disappear.)","Can you solve it with a window function? (Yes: COUNT(*) OVER (PARTITION BY employee_id) AS cnt in a CTE, then WHERE primary_flag = 'Y' OR cnt = 1.)"],"alternatives":["UNION version:\nSELECT employee_id, department_id FROM Employee WHERE primary_flag = 'Y'\nUNION\nSELECT employee_id, department_id FROM Employee WHERE employee_id IN (SELECT employee_id FROM Employee GROUP BY employee_id HAVING COUNT(*) = 1);","Window version: WITH t AS (SELECT *, COUNT(*) OVER (PARTITION BY employee_id) AS cnt FROM Employee) SELECT employee_id, department_id FROM t WHERE primary_flag = 'Y' OR cnt = 1;"],"realworld":"Picking a default per entity: a customer's default address (or their only address), a user's primary email, a product's main image when several exist."},"mistakes":["Filtering only on `primary_flag = 'Y'` — single-department employees are lost.","Writing `HAVING COUNT(*) = 1` in the outer query without a subquery — the outer query would then return only single-department employees and lose the 'Y' rows.","Using AND instead of OR — no row can satisfy both conditions, so the result is empty.","Comparing with lowercase `'y'` — string comparison in PostgreSQL is case-sensitive."],"built":{"id":31,"inputs":[{"name":"Employee","columns":["employee_id","department_id","primary_flag"],"types":["integer","integer","character varying(1)"],"rows":[[101,10,"N"],[102,10,"Y"],[102,20,"N"],[103,30,"N"],[104,10,"N"],[104,20,"N"],[104,30,"Y"],[105,40,"N"]]}],"visuals":[{"columns":["employee_id","dept_count","kept"],"types":["integer","bigint","boolean"],"rows":[[101,1,true],[102,2,false],[103,1,true],[104,3,false],[105,1,true]]},{"columns":["employee_id"],"types":["integer"],"rows":[[101],[103],[105]]},{"columns":["employee_id","department_id","primary_flag","is_primary","only_one_dept","kept"],"types":["integer","integer","character varying(1)","boolean","boolean","boolean"],"rows":[[101,10,"N",false,true,true],[102,10,"Y",true,false,true],[102,20,"N",false,false,false],[103,30,"N",false,true,true],[104,10,"N",false,false,false],[104,20,"N",false,false,false],[104,30,"Y",true,false,true],[105,40,"N",false,true,true]]},{"columns":["found_by","employee_id","department_id"],"types":["text","integer","integer"],"rows":[["Part 2: only one department",101,10],["Part 1: flag = Y",102,10],["Part 2: only one department",103,30],["Part 1: flag = Y",104,30],["Part 2: only one department",105,40]]}],"output":{"columns":["employee_id","department_id"],"types":["integer","integer"],"rows":[[101,10],[102,10],[103,30],[104,30],[105,40]]}}},{"id":32,"lc":610,"slug":"triangle-judgement","title":"Triangle Judgement","section":"Advanced Select and Joins","difficulty":"Easy","concepts":["CASE WHEN","AND","Computed column","Triangle inequality"],"pattern":"Turn a row-level rule into a label with CASE WHEN <all conditions> THEN 'Yes' ELSE 'No' END.","statement":["Each row of the **Triangle** table holds three segment lengths `x`, `y` and `z`.","For every row, decide whether the three segments can be joined into a triangle. That works only when **every** pair of sides is together strictly longer than the remaining side (the triangle inequality)."],"returns":"Every input row with its `x`, `y`, `z` plus a column `triangle` containing `'Yes'` or `'No'`. Any order.","setup":"CREATE TABLE Triangle (\n  x INT,\n  y INT,\n  z INT,\n  PRIMARY KEY (x, y, z)\n);\n\nINSERT INTO Triangle VALUES\n  (3, 4, 5),\n  (1, 2, 3),\n  (10, 3, 4),\n  (6, 6, 6),\n  (2, 9, 8);","tables":["Triangle"],"table_notes":{"Triangle":"(1, 2, 3) is the boundary case: 1 + 2 equals 3 exactly, which gives a flat line, not a triangle. In (10, 3, 4) the longest side is listed first."},"solution":"SELECT x,\n       y,\n       z,\n       CASE\n           WHEN x + y > z\n            AND x + z > y\n            AND y + z > x THEN 'Yes'\n           ELSE 'No'\n       END AS triangle\nFROM Triangle;","display_sql":"SELECT x,\n       y,\n       z,\n       CASE\n           WHEN x + y > z\n            AND x + z > y\n            AND y + z > x THEN 'Yes'\n           ELSE 'No'\n       END AS triangle\nFROM Triangle\nORDER BY x, y, z;","output_notes":["**(3, 4, 5) Yes**, **(6, 6, 6) Yes**, **(2, 9, 8) Yes** — all three sums are strictly larger than the opposite side.","**(1, 2, 3) No** — 1 + 2 = 3 is not *strictly* greater, so the segments lie flat.","**(10, 3, 4) No** — 3 + 4 = 7 is shorter than 10. Only the check against the longest side fails, which is why we must test all three combinations."],"breakdown":[{"code":"SELECT x,\n       y,\n       z,","text":"Keep the original three lengths — every row is returned."},{"code":"CASE\n    WHEN x + y > z\n     AND x + z > y\n     AND y + z > x THEN 'Yes'","text":"The triangle inequality, checked for all three sides. We do not know which column holds the longest side, so all three checks are needed. `>` (not `>=`) rejects flat cases like 1 + 2 = 3."},{"code":"ELSE 'No'\nEND AS triangle","text":"Any failing check gives 'No'. Name the column `triangle` as required."},{"code":"FROM Triangle","text":"No join, no filter — one output row per input row."}],"exec_order":[{"stage":"FROM","code":"Triangle","text":"Read all 5 rows."},{"stage":"SELECT","code":"CASE WHEN … THEN 'Yes' ELSE 'No' END","text":"Evaluate the three checks per row and attach the label."}],"visuals":[{"kind":"case","title":"Step 1 — Compute each pair sum next to the opposite side","diagram":"for each row (x, y, z):\n  x + y  vs  z\n  x + z  vs  y\n  y + z  vs  x\n(10, 3, 4):  13 > 4 ✓   14 > 3 ✓   7 > 10 ✗","sql":"SELECT x, y, z,\n       x + y AS x_plus_y,\n       x + z AS x_plus_z,\n       y + z AS y_plus_z\nFROM Triangle\nORDER BY x, y, z;","text":"Seeing the sums makes the rule concrete. For (10, 3, 4) the sum `y_plus_z = 7` is smaller than `x = 10`. For (1, 2, 3) `x_plus_y = 3` only equals `z = 3`."},{"kind":"case","title":"Step 2 — Three TRUE/FALSE checks → CASE label","diagram":"check_1 AND check_2 AND check_3\n     all TRUE      → 'Yes'\n     any FALSE     → 'No'","sql":"SELECT x, y, z,\n       x + y > z AS check_xy_gt_z,\n       x + z > y AS check_xz_gt_y,\n       y + z > x AS check_yz_gt_x,\n       CASE\n           WHEN x + y > z\n            AND x + z > y\n            AND y + z > x THEN 'Yes'\n           ELSE 'No'\n       END AS triangle\nFROM Triangle\nORDER BY x, y, z;","text":"Each check becomes its own column. (1, 2, 3) fails `x + y > z`; (10, 3, 4) fails `y + z > x`. The other three rows pass all checks, so the CASE returns 'Yes'."}],"flow":[{"label":"Input table","detail":"Triangle (5 rows)","ref":"input"},{"label":"Pair sums","detail":"x+y, x+z, y+z per row","ref":0},{"label":"Three checks + CASE","detail":"all TRUE → 'Yes', otherwise 'No'","ref":1},{"label":"Final output","detail":"x, y, z, triangle","ref":"output"}],"takeaway":{"pattern":"Row-by-row yes/no decision with several conditions → one CASE WHEN with the conditions joined by AND; no filtering, every row stays.","asks":["Why `>` and not `>=`? (Equal sum gives a degenerate, flat triangle.)","Can you do it with fewer comparisons? (Yes: `x + y + z > 2 * GREATEST(x, y, z)` — only the longest side matters. Same result, but less obvious to read.)","What if a length can be NULL? (The comparison is NULL, the WHEN is not TRUE, so the CASE falls to ELSE 'No'.)"],"alternatives":["`CASE WHEN x + y + z > 2 * GREATEST(x, y, z) THEN 'Yes' ELSE 'No' END` — uses the fact that only the longest side can break the rule."],"realworld":"Validation flags on rows: is an order complete, does a record satisfy every business rule, is a shipment within all size limits — compute a Yes/No column instead of filtering rows out."},"mistakes":["Checking only `x + y > z` — that assumes `z` is the longest side; (10, 3, 4) would wrongly be 'Yes'.","Using `>=` — (1, 2, 3) would wrongly be 'Yes'.","Putting the condition in WHERE — that removes the 'No' rows, but they must be returned too.","Returning booleans (`true/false`) instead of the strings 'Yes' / 'No'."],"built":{"id":32,"inputs":[{"name":"Triangle","columns":["x","y","z"],"types":["integer","integer","integer"],"rows":[[3,4,5],[1,2,3],[10,3,4],[6,6,6],[2,9,8]]}],"visuals":[{"columns":["x","y","z","x_plus_y","x_plus_z","y_plus_z"],"types":["integer","integer","integer","integer","integer","integer"],"rows":[[1,2,3,3,4,5],[2,9,8,11,10,17],[3,4,5,7,8,9],[6,6,6,12,12,12],[10,3,4,13,14,7]]},{"columns":["x","y","z","check_xy_gt_z","check_xz_gt_y","check_yz_gt_x","triangle"],"types":["integer","integer","integer","boolean","boolean","boolean","text"],"rows":[[1,2,3,false,true,true,"No"],[2,9,8,true,true,true,"Yes"],[3,4,5,true,true,true,"Yes"],[6,6,6,true,true,true,"Yes"],[10,3,4,true,true,false,"No"]]}],"output":{"columns":["x","y","z","triangle"],"types":["integer","integer","integer","text"],"rows":[[1,2,3,"No"],[2,9,8,"Yes"],[3,4,5,"Yes"],[6,6,6,"Yes"],[10,3,4,"No"]]}}},{"id":33,"lc":180,"slug":"consecutive-numbers","title":"Consecutive Numbers","section":"Advanced Select and Joins","difficulty":"Medium","concepts":["LAG / LEAD","Window ORDER BY","CTE","DISTINCT","Quoted alias"],"pattern":"Compare each row with its neighbours using LAG/LEAD over the row order, keep rows equal to both neighbours, then DISTINCT the values.","statement":["The **Logs** table records numbers one after another; `id` gives the order (1, 2, 3, …).","Find every number that appears **at least three times in a row** — three consecutive ids carrying the same value. Each such number must be listed only once, even if its run is longer than three or it has several runs."],"returns":"A single column named `ConsecutiveNums` with each qualifying number once. Any order.","setup":"CREATE TABLE Logs (\n  id  INT PRIMARY KEY,\n  num INT\n);\n\nINSERT INTO Logs VALUES\n  (1, 5),\n  (2, 5),\n  (3, 5),\n  (4, 5),\n  (5, 7),\n  (6, 7),\n  (7, 3),\n  (8, 7),\n  (9, 9),\n  (10, 9),\n  (11, 9),\n  (12, 7);","tables":["Logs"],"table_notes":{"Logs":"5 runs **four** times (ids 1–4). 7 appears four times in total but never three in a row. 9 runs exactly three times (ids 9–11)."},"solution":"WITH neighbours AS (\n    SELECT id,\n           num,\n           LAG(num)  OVER (ORDER BY id) AS prev_num,\n           LEAD(num) OVER (ORDER BY id) AS next_num\n    FROM Logs\n)\nSELECT DISTINCT num AS \"ConsecutiveNums\"\nFROM neighbours\nWHERE num = prev_num\n  AND num = next_num;","display_sql":"WITH neighbours AS (\n    SELECT id,\n           num,\n           LAG(num)  OVER (ORDER BY id) AS prev_num,\n           LEAD(num) OVER (ORDER BY id) AS next_num\n    FROM Logs\n)\nSELECT DISTINCT num AS \"ConsecutiveNums\"\nFROM neighbours\nWHERE num = prev_num\n  AND num = next_num\nORDER BY \"ConsecutiveNums\";","output_notes":["**5** — ids 2 and 3 both sit in the middle of a run of three 5s. Without DISTINCT, 5 would be listed twice.","**9** — id 10 has a 9 before it (id 9) and after it (id 11).","**7 is missing** — it occurs four times, but the longest run is two (ids 5–6). Counting occurrences with GROUP BY would wrongly include it."],"breakdown":[{"code":"WITH neighbours AS (","text":"A CTE that adds, to every row, the value just before it and just after it."},{"code":"LAG(num)  OVER (ORDER BY id) AS prev_num","text":"`LAG` looks **one row back** in the order given by `ORDER BY id`. Rows have no natural order in SQL, so the window's ORDER BY is what defines \"consecutive\". The first row has no previous row → NULL."},{"code":"LEAD(num) OVER (ORDER BY id) AS next_num","text":"`LEAD` looks **one row forward**. The last row gets NULL."},{"code":"WHERE num = prev_num\n  AND num = next_num","text":"A row equal to both neighbours is the middle of three equal values in a row. NULL comparisons are not TRUE, so the first and last rows can never match by accident."},{"code":"SELECT DISTINCT num AS \"ConsecutiveNums\"","text":"A run of 4 or more has several middle rows, so the same number can pass the filter more than once — DISTINCT lists it once. The double quotes keep the capital letters; unquoted, PostgreSQL would name the column `consecutivenums`."}],"exec_order":[{"stage":"FROM","code":"neighbours: FROM Logs","text":"Read the 12 log rows."},{"stage":"WINDOW","code":"neighbours: LAG / LEAD OVER (ORDER BY id)","text":"Attach prev_num and next_num to each row."},{"stage":"SELECT","code":"neighbours: id, num, prev_num, next_num","text":"The CTE now has 12 rows with 4 columns."},{"stage":"FROM","code":"neighbours","text":"The main query reads the CTE."},{"stage":"WHERE","code":"num = prev_num AND num = next_num","text":"Keep middle-of-run rows: ids 2, 3, 10."},{"stage":"SELECT","code":"num AS \"ConsecutiveNums\"","text":"Project the number: 5, 5, 9."},{"stage":"DISTINCT","code":"DISTINCT","text":"Remove the duplicate 5 → 5, 9."}],"visuals":[{"kind":"window","title":"Step 1 — CTE neighbours: LAG and LEAD over ORDER BY id","diagram":"Logs → neighbours (CTE) → WHERE → DISTINCT\n\none window over all rows, ordered by id (no PARTITION BY)\n  id 2 │ num 5   ◀── LAG(num)  for id 3 → prev_num = 5\n  id 3 │ num 5   ◀── current row\n  id 4 │ num 5   ◀── LEAD(num) for id 3 → next_num = 5","sql":"SELECT id,\n       num,\n       LAG(num)  OVER (ORDER BY id) AS prev_num,\n       LEAD(num) OVER (ORDER BY id) AS next_num\nFROM Logs\nORDER BY id;","text":"One window over the whole table, ordered by `id`. Row 1 has `prev_num = NULL` and row 12 has `next_num = NULL`. We use LAG/LEAD rather than a ranking func
