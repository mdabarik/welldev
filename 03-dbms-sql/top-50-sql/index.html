y friends they have. The test data guarantees a single winner, but a good answer should also return everyone tied for first (the follow-up)."],"returns":"Columns `id` and `num` (number of friends) for the person(s) with the most friends. Any order.","setup":"CREATE TABLE RequestAccepted (\n  requester_id INT NOT NULL,\n  accepter_id  INT,\n  accept_date  DATE,\n  PRIMARY KEY (requester_id, accepter_id)\n);\n\nINSERT INTO RequestAccepted VALUES\n  (1, 2, '2024-01-03'),\n  (1, 3, '2024-01-05'),\n  (2, 3, '2024-01-08'),\n  (4, 3, '2024-01-09'),\n  (3, 5, '2024-01-12'),\n  (4, 1, '2024-01-15'),\n  (5, 6, '2024-01-20');","tables":["RequestAccepted"],"table_notes":{"RequestAccepted":"Person 3 accepted three requests (from 1, 2, 4) **and** sent one (to 5). Counting only one column would miss part of their friends."},"solution":"WITH all_ids AS (\n    SELECT requester_id AS id\n    FROM RequestAccepted\n    UNION ALL\n    SELECT accepter_id AS id\n    FROM RequestAccepted\n),\nfriend_counts AS (\n    SELECT id,\n           COUNT(*) AS num\n    FROM all_ids\n    GROUP BY id\n)\nSELECT id,\n       num\nFROM friend_counts\nWHERE num = (SELECT MAX(num) FROM friend_counts);","output_notes":["**id 3, num 4** — person 3 appears as accepter in (1,3), (2,3), (4,3) and as requester in (3,5): friends with 1, 2, 4 and 5.","Person 1 is second with 3 friends (2, 3, 4); everyone else has 1 or 2, so they are filtered out by `num = MAX(num)`."],"breakdown":[{"code":"WITH all_ids AS (\n    SELECT requester_id AS id\n    FROM RequestAccepted\n    UNION ALL\n    SELECT accepter_id AS id\n    FROM RequestAccepted\n)","text":"Every accepted request gives **one friend to each side**. Listing the requester column and then the accepter column turns 7 requests into 14 ids. It must be `UNION ALL`: plain `UNION` removes duplicates, so person 3 would appear only once."},{"code":"friend_counts AS (\n    SELECT id,\n           COUNT(*) AS num\n    FROM all_ids\n    GROUP BY id\n)","text":"How many times each person appears in the list = how many friends they have."},{"code":"WHERE num = (SELECT MAX(num) FROM friend_counts)","text":"The scalar subquery returns the highest count (4). Comparing with it keeps **every** person who reaches it, which also solves the follow-up about ties. `ORDER BY num DESC LIMIT 1` would pass the official tests but return only one of several tied people."}],"exec_order":[{"stage":"FROM","code":"all_ids: requester_id UNION ALL accepter_id","text":"7 + 7 = 14 ids."},{"stage":"FROM","code":"friend_counts: FROM all_ids","text":"Read the 14 ids."},{"stage":"GROUP BY","code":"friend_counts: GROUP BY id","text":"6 people, COUNT(*) each."},{"stage":"FROM","code":"FROM friend_counts","text":"6 rows."},{"stage":"WHERE","code":"num = (SELECT MAX(num) FROM friend_counts)","text":"Subquery gives 4 → only person 3 remains."},{"stage":"SELECT","code":"id, num","text":"Return the winner(s)."}],"visuals":[{"kind":"union","title":"Step 1 — CTE all_ids: both columns stacked into one list","diagram":"RequestAccepted (7 rows)\n  ├─ requester_id ──▶ 1, 1, 2, 4, 3, 4, 5      (7 ids)\n  └─ accepter_id  ──▶ 2, 3, 3, 3, 5, 1, 6      (7 ids)\n              │\n          UNION ALL   (keep duplicates!)\n              ▼\n        all_ids: 14 ids","sql":"SELECT requester_id AS id, 'requester' AS role, accepter_id AS friend\nFROM RequestAccepted\nUNION ALL\nSELECT accepter_id, 'accepter', requester_id\nFROM RequestAccepted\nORDER BY id, friend;","text":"Each request appears twice: once from the sender's side and once from the receiver's side. The `role` and `friend` columns are added only to show where each id came from — the real CTE keeps just `id`. Person **3** shows up 4 times: three times as accepter and once as requester."},{"kind":"group","title":"Step 2 — CTE friend_counts: count each id","diagram":"3 ├─ (from 1) ├─ (from 2) ├─ (from 4) └─ (to 5)   → 4\n1 ├─ (to 2)   ├─ (to 3)   └─ (from 4)             → 3\n2 ├─ (from 1) └─ (to 3)                           → 2\n4 ├─ (to 3)   └─ (to 1)                           → 2\n5 ├─ (from 3) └─ (to 6)                           → 2\n6 └─ (from 5)                                     → 1","sql":"WITH all_ids AS (\n    SELECT requester_id AS id\n    FROM RequestAccepted\n    UNION ALL\n    SELECT accepter_id AS id\n    FROM RequestAccepted\n)\nSELECT id,\n       COUNT(*) AS num\nFROM all_ids\nGROUP BY id\nORDER BY num DESC, id;","text":"Six people, one row each. Person 3 has **4** friends, person 1 has 3, and so on. The counts add up to 14 — twice the number of requests, because every friendship is counted once for each side."},{"kind":"subquery","title":"Step 3 — What the subquery returns: the top count","diagram":"SELECT MAX(num) FROM friend_counts\n        │\n        ▼\n     max_num = 4","sql":"WITH all_ids AS (\n    SELECT requester_id AS id\n    FROM RequestAccepted\n    UNION ALL\n    SELECT accepter_id AS id\n    FROM RequestAccepted\n),\nfriend_counts AS (\n    SELECT id,\n           COUNT(*) AS num\n    FROM all_ids\n    GROUP BY id\n)\nSELECT MAX(num) AS max_num\nFROM friend_counts\nORDER BY max_num;","text":"The subquery reads the same `friend_counts` CTE and returns a single value: **4**. A CTE can be referenced more than once, so we do not have to repeat the counting logic."},{"kind":"filter","title":"Step 4 — Keep everyone whose count equals the maximum","diagram":"num = 4 ?\n\n3 │ 4 ✓\n1 │ 3 ✗\n2 │ 2 ✗   4 │ 2 ✗   5 │ 2 ✗\n6 │ 1 ✗","sql":"WITH all_ids AS (\n    SELECT requester_id AS id\n    FROM RequestAccepted\n    UNION ALL\n    SELECT accepter_id AS id\n    FROM RequestAccepted\n),\nfriend_counts AS (\n    SELECT id,\n           COUNT(*) AS num\n    FROM all_ids\n    GROUP BY id\n)\nSELECT id,\n       num,\n       num = (SELECT MAX(num) FROM friend_counts) AS kept\nFROM friend_counts\nORDER BY num DESC, id;","text":"Only person **3** matches. If person 1 also had 4 friends, both rows would have `kept = TRUE` and both would be returned — that is the follow-up answered for free."}],"flow":[{"label":"Input table","detail":"RequestAccepted (7 friendships)","ref":"input"},{"label":"UNION ALL","detail":"requester ids + accepter ids → 14 ids","ref":0},{"label":"GROUP BY id","detail":"COUNT(*) = number of friends","ref":1},{"label":"Subquery MAX","detail":"top count = 4","ref":2},{"label":"Filter","detail":"num = 4 → person 3","ref":3},{"label":"Final output","detail":"id 3, num 4","ref":"output"}],"takeaway":{"pattern":"Undirected relationships stored as (a, b) pairs → `SELECT a UNION ALL SELECT b`, then GROUP BY to get each node's degree; compare with `MAX()` in a subquery to keep all winners.","asks":["Why UNION ALL instead of UNION? (UNION de-duplicates; each person would appear once and every count would be 1.)","How do you return all people tied for first? (`WHERE num = (SELECT MAX(num) …)` or `RANK() OVER (ORDER BY num DESC) = 1` instead of LIMIT 1.)","What if both (1, 2) and (2, 1) could be stored? (The same friendship would be counted twice. De-duplicate pairs first with `LEAST(a, b), GREATEST(a, b)` and DISTINCT, then unpivot.)"],"alternatives":["Simplest form when exactly one winner is guaranteed: count in a subquery and finish with `ORDER BY num DESC LIMIT 1`.","Window function: `RANK() OVER (ORDER BY COUNT(*) DESC)` on the grouped result, keep rank 1 — also tie-safe."],"realworld":"Degree of a node in any undirected graph: friends per user, connections per LinkedIn member, flights per airport when routes are stored as (origin, destination)."},"mistakes":["Counting only `requester_id` (or only `accepter_id`) — person 3 would get 1 (or 3) instead of 4.","Using `UNION` instead of `UNION ALL` — duplicates vanish and every count becomes 1.","Adding the two counts with a JOIN between per-column counts — people who appear in only one column are lost unless you use a FULL JOIN and COALESCE.","Relying on `LIMIT 1` for the follow-up — it silently drops tied people."],"built":{"id":41,"inputs":[{"name":"RequestAccepted","columns":["requester_id","accepter_id","accept_date"],"types":["integer","integer","date"],"rows":[[1,2,"2024-01-03"],[1,3,"2024-01-05"],[2,3,"2024-01-08"],[4,3,"2024-01-09"],[3,5,"2024-01-12"],[4,1,"2024-01-15"],[5,6,"2024-01-20"]]}],"visuals":[{"columns":["id","role","friend"],"types":["integer","text","integer"],"rows":[[1,"requester",2],[1,"requester",3],[1,"accepter",4],[2,"accepter",1],[2,"requester",3],[3,"accepter",1],[3,"accepter",2],[3,"accepter",4],[3,"requester",5],[4,"requester",1],[4,"requester",3],[5,"accepter",3],[5,"requester",6],[6,"accepter",5]]},{"columns":["id","num"],"types":["integer","bigint"],"rows":[[3,4],[1,3],[2,2],[4,2],[5,2],[6,1]]},{"columns":["max_num"],"types":["bigint"],"rows":[[4]]},{"columns":["id","num","kept"],"types":["integer","bigint","boolean"],"rows":[[3,4,true],[1,3,false],[2,2,false],[4,2,false],[5,2,false],[6,1,false]]}],"output":{"columns":["id","num"],"types":["integer","bigint"],"rows":[[3,4]]}}},{"id":42,"lc":585,"slug":"investments-in-2016","title":"Investments in 2016","section":"Subqueries","difficulty":"Medium","concepts":["IN (subquery)","GROUP BY … HAVING","Row-value IN (lat, lon)","SUM","ROUND(numeric)"],"pattern":"Two \"compared with the other rows\" conditions → build each qualifying set with GROUP BY … HAVING in a subquery, then filter rows with IN.","statement":["An insurer keeps one row per policy in `Insurance`: the policy id (`pid`), the total investment value in 2015 and 2016 (`tiv_2015`, `tiv_2016`), and the city location as latitude/longitude (`lat`, `lon`).","Add up `tiv_2016` for the policies that satisfy **both** rules: (1) their `tiv_2015` value is **shared** with at least one other policy, and (2) no other policy is in the **same city** — their `(lat, lon)` pair is unique."],"returns":"One row, one column `tiv_2016`: the sum, rounded to 2 decimals.","setup":"CREATE TABLE Insurance (\n  pid      INT PRIMARY KEY,\n  tiv_2015 FLOAT,\n  tiv_2016 FLOAT,\n  lat      FLOAT,\n  lon      FLOAT\n);\n\nINSERT INTO Insurance VALUES\n  (1, 10, 5.5,   10, 10),\n  (2, 20, 20,    20, 20),\n  (3, 10, 30,    20, 20),\n  (4, 15, 12.25, 30, 30),\n  (5, 10, 40,    40, 40),\n  (6, 15, 8,     40, 50),\n  (7, 25, 60,    60, 60);","tables":["Insurance"],"table_notes":{"Insurance":"Policies 2 and 3 share the city (20, 20). Policies 5 and 6 share a latitude (40) but not the longitude — different cities. Policy 7 is in a unique city but its tiv_2015 (25) is not shared."},"solution":"SELECT ROUND(SUM(tiv_2016)::NUMERIC, 2) AS tiv_2016\nFROM Insurance\nWHERE tiv_2015 IN (\n          SELECT tiv_2015\n          FROM Insurance\n          GROUP BY tiv_2015\n          HAVING COUNT(*) > 1\n      )\n  AND (lat, lon) IN (\n          SELECT lat, lon\n          FROM Insurance\n          GROUP BY lat, lon\n          HAVING COUNT(*) = 1\n      );","output_notes":["**65.75** = 5.5 (pid 1) + 12.25 (pid 4) + 40 (pid 5) + 8 (pid 6). Each of these has a shared `tiv_2015` (10 or 15) and a city of its own.","**pid 2** fails both rules (tiv_2015 = 20 is unique; its city is shared with pid 3). **pid 3** has a shared tiv_2015 but shares the city (20, 20). **pid 7** has its own city but tiv_2015 = 25 appears only once."],"breakdown":[{"code":"WHERE tiv_2015 IN (\n    SELECT tiv_2015\n    FROM Insurance\n    GROUP BY tiv_2015\n    HAVING COUNT(*) > 1\n)","text":"Subquery 1 lists the `tiv_2015` values used by **more than one** policy (10 and 15). A row passes rule 1 if its own value is in that list."},{"code":"AND (lat, lon) IN (\n    SELECT lat, lon\n    FROM Insurance\n    GROUP BY lat, lon\n    HAVING COUNT(*) = 1\n)","text":"Subquery 2 lists the locations used by **exactly one** policy. `(lat, lon) IN (…)` compares both columns as a pair, so (40, 40) and (40, 50) are different cities."},{"code":"SELECT ROUND(SUM(tiv_2016)::NUMERIC, 2) AS tiv_2016","text":"Sum the 2016 values of the surviving rows. The columns are FLOAT (double precision), and PostgreSQL has no `ROUND(double precision, int)`, so cast the sum to NUMERIC first."}],"exec_order":[{"stage":"FROM","code":"(subquery 1) GROUP BY tiv_2015 HAVING COUNT(*) > 1","text":"Shared 2015 values → {10, 15}."},{"stage":"FROM","code":"(subquery 2) GROUP BY lat, lon HAVING COUNT(*) = 1","text":"Unique cities → 5 locations."},{"stage":"FROM","code":"Insurance","text":"Read all 7 policies."},{"stage":"WHERE","code":"tiv_2015 IN (…) AND (lat, lon) IN (…)","text":"Both must be TRUE → pids 1, 4, 5, 6."},{"stage":"SELECT","code":"ROUND(SUM(tiv_2016)::NUMERIC, 2)","text":"One aggregate row: 65.75."}],"visuals":[{"kind":"subquery","title":"Step 1 — Subquery 1: which tiv_2015 values are shared?","diagram":"GROUP BY tiv_2015\n10 ├─ pid 1 ├─ pid 3 └─ pid 5   → 3  ✓ (> 1)\n15 ├─ pid 4 └─ pid 6            → 2  ✓\n20 └─ pid 2                     → 1  ✗\n25 └─ pid 7                     → 1  ✗\n        ▼\nsubquery returns { 10, 15 }","sql":"SELECT tiv_2015,\n       COUNT(*) AS policies,\n       COUNT(*) > 1 AS kept_by_having\nFROM Insurance\nGROUP BY tiv_2015\nORDER BY tiv_2015;","text":"This shows **all** groups with a `kept_by_having` column; the real subquery returns only the TRUE ones: **10** and **15**. Values 20 and 25 belong to a single policy each, so pids 2 and 7 will fail rule 1."},{"kind":"subquery","title":"Step 2 — Subquery 2: which locations are unique?","diagram":"GROUP BY (lat, lon)\n(10, 10) └─ pid 1            → 1  ✓ (= 1)\n(20, 20) ├─ pid 2 └─ pid 3   → 2  ✗\n(30, 30) └─ pid 4            → 1  ✓\n(40, 40) └─ pid 5            → 1  ✓\n(40, 50) └─ pid 6            → 1  ✓\n(60, 60) └─ pid 7            → 1  ✓","sql":"SELECT lat, lon,\n       COUNT(*) AS policies,\n       COUNT(*) = 1 AS kept_by_having\nFROM Insurance\nGROUP BY lat, lon\nORDER BY lat, lon;","text":"Only **(20, 20)** is shared (pids 2 and 3), so both of them fail rule 2. The group key is the **pair**: pid 5 at (40, 40) and pid 6 at (40, 50) share a latitude but are different cities, so both stay unique."},{"kind":"filter","title":"Step 3 — Check both rules on every policy","diagram":"pid ─▶ same_tiv_2015 > 1 ?   (tiv_2015 IN {10, 15})\n    ─▶ same_location = 1 ?   ((lat, lon) IN unique set)\n               │\n              AND ──▶ kept\n\npid 1: 3 ✓  1 ✓ → ✓      pid 3: 3 ✓  2 ✗ → ✗\npid 2: 1 ✗  2 ✗ → ✗      pid 7: 1 ✗  1 ✓ → ✗","sql":"SELECT pid, tiv_2015, lat, lon, tiv_2016,\n       COUNT(*) OVER (PARTITION BY tiv_2015) AS same_tiv_2015,\n       COUNT(*) OVER (PARTITION BY lat, lon) AS same_location,\n       tiv_2015 IN (SELECT tiv_2015 FROM Insurance\n                    GROUP BY tiv_2015 HAVING COUNT(*) > 1)\n         AND (lat, lon) IN (SELECT lat, lon FROM Insurance\n                            GROUP BY lat, lon HAVING COUNT(*) = 1) AS kept\nFROM Insurance\nORDER BY pid;","text":"`same_tiv_2015` and `same_location` count how many policies (including this one) share the value — computed with `COUNT(*) OVER (PARTITION BY …)` just to make the rules visible. `kept` is the solution's actual WHERE condition. Policies **1, 4, 5, 6** pass both rules."},{"kind":"group","title":"Step 4 — Sum tiv_2016 of the kept policies","diagram":"pid 1 │  5.50\npid 4 │ 12.25\npid 5 │ 40.00\npid 6 │  8.00\n──────┼──────\nSUM   │ 65.75   → ROUND(…::NUMERIC, 2)","sql":"SELECT pid, tiv_2016\nFROM Insurance\nWHERE tiv_2015 IN (SELECT tiv_2015 FROM Insurance\n                   GROUP BY tiv_2015 HAVING COUNT(*) > 1)\n  AND (lat, lon) IN (SELECT lat, lon FROM Insurance\n                     GROUP BY lat, lon HAVING COUNT(*) = 1)\nORDER BY pid;","text":"These four rows remain after WHERE. Without GROUP BY, `SUM` folds them into a single row: 5.5 + 12.25 + 40 + 8 = **65.75**. The cast to NUMERIC lets `ROUND(…, 2)` work and fixes the value to two decimals."}],"flow":[{"label":"Input table","detail":"Insurance (7 policies)","ref":"input"},{"label":"Subquery 1","detail":"shared tiv_2015 values → {10, 15}","ref":0},{"label":"Subquery 2","detail":"unique (lat, lon) pairs","ref":1},{"label":"WHERE both rules","detail":"pids 1, 4, 5, 6 kept","ref":2},{"label":"SUM + ROUND","detail":"5.5 + 12.25 + 40 + 8","ref":3},{"label":"Final output","detail":"tiv_2016 = 65.75","ref":"output"}],"takeaway":{"pattern":"\"Value appears more than once\" / \"value appears exactly once\" → `GROUP BY col HAVING COUNT(*) > 1` (or `= 1`) in a subquery, used with IN. For multi-column keys use a row value `(a, b) IN (SELECT a, b …)`.","asks":["Why `(lat, lon) IN` instead of `lat IN … AND lon IN …`? (Two separate tests would accept a lat from one city and a lon from another. The pair must match together.)","Why the cast to NUMERIC? (The columns are FLOAT; `ROUND(double precision, integer)` does not exist in PostgreSQL.)","Can you do it in one pass? (Yes: `COUNT(*) OVER (PARTITION BY tiv_2015)` and `COUNT(*) OVER (PARTITION BY lat, lon)` in a CTE, then filter `> 1` and `= 1` — see alternatives.)","Is comparing FLOATs with = safe here? (Values are stored and compared exactly as written, so equal inputs group together; with computed floats you would compare with a tolerance or use NUMERIC.)"],"alternatives":["Window counts in a CTE: `WITH c AS (SELECT tiv_2016, COUNT(*) OVER (PARTITION BY tiv_2015) AS same_tiv, COUNT(*) OVER (PARTITION BY lat, lon) AS same_loc FROM Insurance) SELECT ROUND(SUM(tiv_2016)::NUMERIC, 2) AS tiv_2016 FROM c WHERE same_tiv > 1 AND same_loc = 1;` — one scan of the table.","Correlated EXISTS: `EXISTS (SELECT 1 FROM Insurance i2 WHERE i2.pid <> i.pid AND i2.tiv_2015 = i.tiv_2015) AND NOT EXISTS (SELECT 1 FROM Insurance i2 WHERE i2.pid <> i.pid AND i2.lat = i.lat AND i2.lon = i.lon)`."],"realworld":"Fraud and data-quality rules that compare a row with its peers: \"amount repeated by other accounts\" plus \"address used by nobody else\", duplicate detection, uniqueness audits."},"mistakes":["Checking `lat` and `lon` separately — pid 6 (40, 50) would wrongly look like it shares a city with pid 5 (40, 40), or two different cities could combine into a false match.","Using `HAVING COUNT(*) >= 1` for rule 1 — every value appears at least once (its own row), so nothing is filtered.","Using `ROUND(SUM(tiv_2016), 2)` on FLOAT columns — PostgreSQL raises \"function round(double precision, integer) does not exist\".","Using `NOT IN` on the shared locations instead of `IN` on the unique ones — works here, but becomes fragile if a NULL ever appears in the subquery."],"built":{"id":42,"inputs":[{"name":"Insurance","columns":["pid","tiv_2015","tiv_2016","lat","lon"],"types":["integer","double precision","double precision","double precision","double precision"],"rows":[[1,10,"5.5",10,10],[2,20,20,20,20],[3,10,30,20,20],[4,15,"12.25",30,30],[5,10,40,40,40],[6,15,8,40,50],[7,25,60,60,60]]}],"visuals":[{"columns":["tiv_2015","policies","kept_by_having"],"types":["double precision","bigint","boolean"],"rows":[[10,3,true],[15,2,true],[20,1,false],[25,1,false]]},{"columns":["lat","lon","policies","kept_by_having"],"types":["double precision","double precision","bigint","boolean"],"rows":[[10,10,1,true],[20,20,2,false],[30,30,1,true],[40,40,1,true],[40,50,1,true],[60,60,1,true]]},{"columns":["pid","tiv_2015","lat","lon","tiv_2016","same_tiv_2015","same_location","kept"],"types":["integer","double precision","double precision","double precision","double precision","bigint","bigint","boolean"],"rows":[[1,10,10,10,"5.5",3,1,true],[2,20,20,20,20,1,2,false],[3,10,20,20,30,3,2,false],[4,15,30,30,"12.25",2,1,true],[5,10,40,40,40,3,1,true],[6,15,40,50,8,2,1,true],[7,25,60,60,60,1,1,false]]},{"columns":["pid","tiv_2016"],"types":["integer","double precision"],"rows":[[1,"5.5"],[4,"12.25"],[5,40],[6,8]]}],"output":{"columns":["tiv_2016"],"types":["numeric"],"rows":[["65.75"]]}}},{"id":43,"lc":185,"slug":"department-top-three-salaries","title":"Department Top Three Salaries","section":"Subqueries","difficulty":"Hard","concepts":["DENSE_RANK()","PARTITION BY","CTE","INNER JOIN","Top-N per group"],"pattern":"Top-N per group with ties → DENSE_RANK() OVER (PARTITION BY group ORDER BY value DESC) in a CTE, then keep rank ≤ N.","statement":["A company has an `Employee` table (id, name, salary, `departmentId`) and a `Department` table (id, name).","In each department, a **high earner** is someone whose salary is among the department's **three highest distinct salary values**. If two people earn the same amount they share that place, and both count. Find all high earners in every department."],"returns":"Columns `Department` (department name), `Employee` (employee name) and `Salary`, in any order.","setup":"CREATE TABLE Employee (\n  id           INT PRIMARY KEY,\n  name         VARCHAR(255),\n  salary       INT,\n  departmentId INT\n);\nCREATE TABLE Department (\n  id   INT PRIMARY KEY,\n  name VARCHAR(255)\n);\n\nINSERT INTO Employee VALUES\n  (1,  'Ana',  120000, 1),\n  (2,  'Raj',  110000, 1),\n  (3,  'Lea',  110000, 1),\n  (4,  'Tom',   95000, 1),\n  (5,  'Kim',   95000, 1),\n  (6,  'Joe',   90000, 1),\n  (7,  'Mia',   80000, 2),\n  (8,  'Sam',   80000, 2),\n  (9,  'Zoe',   72000, 2),\n  (10, 'Ian',   60000, 2),\n  (11, 'Lou',   52000, 3),\n  (12, 'Eva',   48000, 3);\nINSERT INTO Department VALUES (1, 'Engineering'), (2, 'Marketing'), (3, 'Support');","tables":["Employee","Department"],"table_notes":{"Employee":"Ties on purpose: Raj = Lea and Tom = Kim in Engineering, Mia = Sam at the top of Marketing. Support has only two people."},"solution":"WITH ranked AS (\n    SELECT d.name   AS department,\n           e.name   AS employee,\n           e.salary AS salary,\n           DENSE_RANK() OVER (\n               PARTITION BY e.departmentId\n               ORDER BY e.salary DESC\n           ) AS salary_rank\n    FROM Employee AS e\n    INNER JOIN Department AS d\n            ON d.id = e.departmentId\n)\nSELECT department AS \"Department\",\n       employee   AS \"Employee\",\n       salary     AS \"Salary\"\nFROM ranked\nWHERE salary_rank <= 3;","display_sql":"WITH ranked AS (\n    SELECT d.name   AS department,\n           e.name   AS employee,\n           e.salary AS salary,\n           DENSE_RANK() OVER (\n               PARTITION BY e.departmentId\n               ORDER BY e.salary DESC\n           ) AS salary_rank\n    FROM Employee AS e\n    INNER JOIN Department AS d\n            ON d.id = e.departmentId\n)\nSELECT department AS \"Department\",\n       employee   AS \"Employee\",\n       salary     AS \"Salary\"\nFROM ranked\nWHERE salary_rank <= 3\nORDER BY \"Department\", \"Salary\" DESC, \"Employee\";","output_notes":["**Engineering** — 5 people: Ana (120000, 1st value), Raj and Lea (110000, 2nd value), Tom and Kim (95000, 3rd value). Joe's 90000 is the 4th distinct value, so he is out.","**Marketing** — all 4 people: Mia and Sam share the top value (80000), Zoe has the 2nd (72000), Ian the 3rd (60000).","**Support** — both people: with only two salaries, there is no third value, and that is fine."],"breakdown":[{"code":"FROM Employee AS e\nINNER JOIN Department AS d\n        ON d.id = e.departmentId","text":"Attach the department name to each employee."},{"code":"DENSE_RANK() OVER (\n    PARTITION BY e.departmentId\n    ORDER BY e.salary DESC\n) AS salary_rank","text":"`PARTITION BY` restarts the ranking in each department; `ORDER BY salary DESC` puts the highest salary at rank 1. **DENSE_RANK** gives equal salaries the same rank and does **not skip** numbers afterwards, so rank 3 always means \"third distinct salary value\"."},{"code":"WITH ranked AS ( … )","text":"A window function cannot be used in WHERE of the same query (windows are computed after WHERE). Putting it in a CTE turns `salary_rank` into an ordinary column we can filter on."},{"code":"WHERE salary_rank <= 3","text":"Keep the top three distinct salary values per department — possibly more than three people."},{"code":"SELECT department AS \"Department\",\n       employee   AS \"Employee\",\n       salary     AS \"Salary\"","text":"PostgreSQL folds unquoted names to lower case (`department`). Double quotes keep the exact capitalised column names the problem expects."}],"exec_order":[{"stage":"FROM","code":"ranked: FROM Employee e","text":"12 employees."},{"stage":"JOIN / ON","code":"ranked: JOIN Department d ON d.id = e.departmentId","text":"Add department names → 12 rows."},{"stage":"WINDOW","code":"ranked: DENSE_RANK() OVER (PARTITION BY departmentId ORDER BY salary DESC)","text":"Rank salaries inside each department."},{"stage":"FROM","code":"FROM ranked","text":"12 ranked rows."},{"stage":"WHERE","code":"salary_rank <= 3","text":"Only Joe (rank 4) is removed → 11 rows."},{"stage":"SELECT","code":"department AS \"Department\", …","text":"Rename to the required column names."}],"visuals":[{"kind":"join","title":"Step 1 — JOIN Employee with Department","diagram":"Employee (12 rows)            Department (3 rows)\n  e.departmentId ──── = ────▶  d.id\n\nevery employee has a valid department → 12 rows\n(INNER JOIN drops employees whose department does not exist)","sql":"SELECT e.id, e.name, e.salary, e.departmentId,\n       d.id   AS dept_id,\n       d.name AS department\nFROM Employee AS e\nINNER JOIN Department AS d\n        ON d.id = e.departmentId\nORDER BY department, e.salary DESC, e.name;","text":"Every employee finds their department, so all 12 rows remain, now carrying the department name. Rows are shown grouped by department with the highest salary first — exactly the order the ranking will use."},{"kind":"window","title":"Step 2 — ROW_NUMBER vs RANK vs DENSE_RANK inside each department","diagram":"PARTITION BY department   ORDER BY salary DESC\n\nEngineering     salary   ROW_NUMBER  RANK  DENSE_RANK\n  Ana           120000       1         1        1\n  Lea / Raj     110000      2, 3       2        2\n  Kim / Tom      95000      4, 5       4  ✗     3  ✓\n  Joe            90000       6         6        4\nMarketing\n  Mia / Sam      80000      1, 2       1        1\n  Zoe            72000       3         3        2\n  Ian            60000       4         4  ✗     3  ✓","sql":"SELECT d.name   AS department,\n       e.name   AS employee,\n       e.salary,\n       ROW_NUMBER() OVER (PARTITION BY e.departmentId\n                          ORDER BY e.salary DESC, e.name) AS row_number,\n       RANK()       OVER (PARTITION BY e.departmentId\n                          ORDER BY e.salary DESC) AS rank,\n       DENSE_RANK() OVER (PARTITION BY e.departmentId\n                          ORDER BY e.salary DESC) AS dense_rank\nFROM Employee AS e\nINNER JOIN Department AS d\n        ON d.id = e.departmentId\nORDER BY department, e.salary DESC, employee;","text":"**ROW_NUMBER** gives every row a different number, so tied people get different places (ties broken by name here) and `<= 3` would cut Tom and Kim. **RANK** gives ties the same number but then **skips** (1, 2, 2, 4), so the third-highest salary 95000 gets rank 4 and is lost; in Marketing Ian gets 4 for the same reason. **DENSE_RANK** never skips (1, 2, 2, 3), so `<= 3` means exactly \"top three distinct salaries\"."},{"kind":"filter","title":"Step 3 — Keep dense_rank ≤ 3","diagram":"salary_rank <= 3 ?\n\nEngineering: 1 ✓  2 ✓  2 ✓  3 ✓  3 ✓  4 ✗ (Joe)\nMarketing:   1 ✓  1 ✓  2 ✓  3 ✓\nSupport:     1 ✓  2 ✓","sql":"WITH ranked AS (\n    SELECT d.name   AS department,\n           e.name   AS employee,\n           e.salary AS salary,\n           DENSE_RANK() OVER (\n               PARTITION BY e.departmentId\n               ORDER BY e.salary DESC\n           ) AS salary_rank\n    FROM Employee AS e\n    INNER JOIN Department AS d\n            ON d.id = e.departmentId\n)\nSELECT department, employee, salary, salary_rank,\n       salary_rank <= 3 AS kept\nFROM ranked\nORDER BY department, salary DESC, employee;","text":"This is the `ranked` CTE plus a `kept` column. Only **Joe** (Engineering, rank 4) is removed. Engineering keeps 5 people and Marketing keeps 4 — \"top three salaries\" can mean more than three employees when there are ties."}],"flow":[{"label":"Input tables","detail":"Employee (12) · Department (3)","ref":"input"},{"label":"INNER JOIN","detail":"add department names → 12 rows","ref":0},{"label":"DENSE_RANK per department","detail":"compare ROW_NUMBER / RANK / DENSE_RANK","ref":1},{"label":"Filter rank ≤ 3","detail":"Joe removed → 11 rows","ref":2},{"label":"Final output","detail":"Department, Employee, Salary","ref":"output"}],"takeaway":{"pattern":"\"Top N per group\" → window rank in a CTE/subquery, filter rank ≤ N outside. Pick the function by how ties should behave: ROW_NUMBER (exactly N rows), RANK (Olympic ranking with gaps), DENSE_RANK (top N distinct values).","asks":["Why not RANK()? (After a tie it skips numbers, so the 3rd distinct salary can get rank 4 and be dropped.)","Why not filter on the window function directly in WHERE? (Window functions are computed after WHERE; wrap them in a CTE or subquery.)","How would you solve it without window functions? (Correlated subquery: keep e where `(SELECT COUNT(DISTINCT e2.salary) FROM Employee e2 WHERE e2.departmentId = e.departmentId AND e2.salary > e.salary) < 3`.)","What if a department has fewer than three distinct salaries? (Everyone in it is returned — Support here.)"],"alternatives":["Correlated subquery counting distinct higher salaries (see the asks) — works on any SQL engine, but runs one subquery per row.","Use a derived table instead of a CTE: `SELECT … FROM (SELECT …, DENSE_RANK() OVER (…) AS rnk FROM …) AS ranked WHERE rnk <= 3`."],"realworld":"Top 3 products per category, best 5 sales reps per region, leaderboards per level — anywhere you need the best N within each group and ties must be treated fairly."},"mistakes":["Using ROW_NUMBER — tied employees are cut arbitrarily (Tom or Kim would disappear).","Using RANK — gaps after ties push the third distinct salary to rank 4 or 5 (Tom, Kim and Ian disappear).","Forgetting `PARTITION BY` — salaries are ranked across the whole company, not per department.","Ranking with `ORDER BY salary` ascending — you get the three **lowest** salaries.","Writing `WHERE DENSE_RANK() OVER (…) <= 3` in the same query — PostgreSQL rejects window functions in WHERE.","Leaving the aliases unquoted — PostgreSQL returns `department`, `employee`, `salary` in lower case instead of the expected `Department`, `Employee`, `Salary`."],"built":{"id":43,"inputs":[{"name":"Employee","columns":["id","name","salary","departmentid"],"types":["integer","character varying(255)","integer","integer"],"rows":[[1,"Ana",120000,1],[2,"Raj",110000,1],[3,"Lea",110000,1],[4,"Tom",95000,1],[5,"Kim",95000,1],[6,"Joe",90000,1],[7,"Mia",80000,2],[8,"Sam",80000,2],[9,"Zoe",72000,2],[10,"Ian",60000,2],[11,"Lou",52000,3],[12,"Eva",48000,3]]},{"name":"Department","columns":["id","name"],"types":["integer","character varying(255)"],"rows":[[1,"Engineering"],[2,"Marketing"],[3,"Support"]]}],"visuals":[{"columns":["id","name","salary","departmentid","dept_id","department"],"types":["integer","character varying(255)","integer","integer","integer","character varying(255)"],"rows":[[1,"Ana",120000,1,1,"Engineering"],[3,"Lea",110000,1,1,"Engineering"],[2,"Raj",110000,1,1,"Engineering"],[5,"Kim",95000,1,1,"Engineering"],[4,"Tom",95000,1,1,"Engineering"],[6,"Joe",90000,1,1,"Engineering"],[7,"Mia",80000,2,2,"Marketing"],[8,"Sam",80000,2,2,"Marketing"],[9,"Zoe",72000,2,2,"Marketing"],[10,"Ian",60000,2,2,"Marketing"],[11,"Lou",52000,3,3,"Support"],[12,"Eva",48000,3,3,"Support"]]},{"columns":["department","employee","salary","row_number","rank","dense_rank"],"types":["character varying(255)","character varying(255)","integer","bigint","bigint","bigint"],"rows":[["Engineering","Ana",120000,1,1,1],["Engineering","Lea",110000,2,2,2],["Engineering","Raj",110000,3,2,2],["Engineering","Kim",95000,4,4,3],["Engineering","Tom",95000,5,4,3],["Engineering","Joe",90000,6,6,4],["Marketing","Mia",80000,1,1,1],["Marketing","Sam",80000,2,1,1],["Marketing","Zoe",72000,3,3,2],["Marketing","Ian",60000,4,4,3],["Support","Lou",52000,1,1,1],["Support","Eva",48000,2,2,2]]},{"columns":["department","employee","salary","salary_rank","kept"],"types":["character varying(255)","character varying(255)","integer","bigint","boolean"],"rows":[["Engineering","Ana",120000,1,true],["Engineering","Lea",110000,2,true],["Engineering","Raj",110000,2,true],["Engineering","Kim",95000,3,true],["Engineering","Tom",95000,3,true],["Engineering","Joe",90000,4,false],["Marketing","Mia",80000,1,true],["Marketing","Sam",80000,1,true],["Marketing","Zoe",72000,2,true],["Marketing","Ian",60000,3,true],["Support","Lou",52000,1,true],["Support","Eva",48000,2,true]]}],"output":{"columns":["Department","Employee","Salary"],"types":["character varying(255)","character varying(255)","integer"],"rows":[["Engineering","Ana",120000],["Engineering","Lea",110000],["Engineering","Raj",110000],["Engineering","Kim",95000],["Engineering","Tom",95000],["Marketing","Mia",80000],["Marketing","Sam",80000],["Marketing","Zoe",72000],["Marketing","Ian",60000],["Support","Lou",52000],["Support","Eva",48000]]}}},{"id":44,"lc":1667,"slug":"fix-names-in-a-table","title":"Fix Names in a Table","section":"Advanced String Functions / Regex / Clause","difficulty":"Easy","concepts":["UPPER / LOWER","LEFT","SUBSTRING","|| concatenation","ORDER BY"],"pattern":"Split a string into the piece you want to change and the rest, transform each piece, then glue them back together with ||.","statement":["A `Users` table stores each user's name, but the capitalisation is a mess: some names are all lower case, some are all upper case and some are mixed like `mARIA`. Names contain only letters.","Clean every name so that the **first letter is upper case** and **all other letters are lower case**."],"returns":"Every user with `user_id` and the fixed `name`, ordered by `user_id`.","setup":"CREATE TABLE Users (\n  user_id INT PRIMARY KEY,\n  name    VARCHAR(40)\n);\n\nINSERT INTO Users VALUES\n  (1, 'mARIA'),\n  (2, 'JOHN'),\n  (3, 'lee'),\n  (4, 'b'),\n  (5, 'Zoe'),\n  (6, 'oLIVER');","tables":["Users"],"table_notes":{"Users":"Every kind of mess appears: mixed case (mARIA, oLIVER), all upper (JOHN), all lower (lee), a one-letter name (b) and one name that is already correct (Zoe)."},"solution":"SELECT user_id,\n       UPPER(LEFT(name, 1)) || LOWER(SUBSTRING(name, 2)) AS name\nFROM Users\nORDER BY user_id;","output_notes":["**1 → Maria** — `m` becomes `M`, and `ARIA` becomes `aria`.","**2 → John** — the first letter `J` is already upper case; `OHN` is lowered to `ohn`.","**3 → Lee** — only the first letter changes.","**4 → B** — a one-letter name: the \"rest\" is the empty string `''`, so the result is just `B`.","**5 → Zoe** — already correct; the transformation leaves it unchanged.","**6 → Oliver** — same idea as Maria."],"breakdown":[{"code":"LEFT(name, 1)","text":"Take the first character of the name, e.g. `m` from `mARIA`."},{"code":"UPPER(LEFT(name, 1))","text":"Turn that first character into upper case → `M`."},{"code":"SUBSTRING(name, 2)","text":"Everything from position 2 to the end (`ARIA`). PostgreSQL strings start at position **1**, not 0. For the one-letter name `b` this returns `''`, not NULL."},{"code":"LOWER(SUBSTRING(name, 2))","text":"Lower-case the rest → `aria`."},{"code":"… || … AS name","text":"`||` is PostgreSQL's string concatenation operator: `M` || `aria` = `Maria`. The alias keeps the column name `name` that LeetCode expects."},{"code":"ORDER BY user_id","text":"The problem asks for this order."}],"exec_order":[{"stage":"FROM","code":"Users","text":"Read all 6 users."},{"stage":"SELECT","code":"UPPER(LEFT(name, 1)) || LOWER(SUBSTRING(name, 2))","text":"Build the fixed name row by row."},{"stage":"ORDER BY","code":"user_id","text":"Sort by user id."}],"visuals":[{"kind":"string","title":"Step 1 — Split each name into the first letter and the rest","diagram":"  'mARIA'\n   │└──┬─┘\n   │   └─ SUBSTRING(name, 2) = 'ARIA'  ─▶ LOWER ─▶ 'aria'\n   └───── LEFT(name, 1)      = 'm'     ─▶ UPPER ─▶ 'M'\n\n   'M' || 'aria'  ─▶  'Maria'","sql":"SELECT user_id,\n       name,\n       LEFT(name, 1)                AS first_letter,\n       SUBSTRING(name, 2)           AS rest,\n       UPPER(LEFT(name, 1))         AS upper_first,\n       LOWER(SUBSTRING(name, 2))    AS lower_rest\nFROM Users\nORDER BY user_id;","text":"Each name is cut into two pieces and each piece gets its own function. Look at **b** (user 4): `first_letter = 'b'` and `rest` is the empty string, so nothing breaks for one-letter names."},{"kind":"string","title":"Step 2 — Glue the pieces back together with ||","diagram":"upper_first  ||  lower_rest   =  fixed_name\n    'M'      ||   'aria'      =  'Maria'\n    'J'      ||   'ohn'       =  'John'\n    'B'      ||   ''          =  'B'","sql":"SELECT user_id,\n       name                                              AS original,\n       UPPER(LEFT(name, 1)) || LOWER(SUBSTRING(name, 2)) AS fixed_name,\n       UPPER(LEFT(name, 1)) || SUBSTRING(name, 2)        AS forgot_lower_WRONG\nFROM Users\nORDER BY user_id;","text":"`fixed_name` is the answer. The comparison column shows the most common bug: if you only upper-case the first letter and forget `LOWER(...)` on the rest, `mARIA` becomes `MARIA` and `JOHN` stays `JOHN`."}],"flow":[{"label":"Input table","detail":"Users (6 rows, messy capitalisation)","ref":"input"},{"label":"Split","detail":"LEFT(name, 1) and SUBSTRING(name, 2)","ref":0},{"label":"Transform + glue","detail":"UPPER(first) || LOWER(rest)","ref":1},{"label":"Final output","detail":"ORDER BY user_id","ref":"output"}],"takeaway":{"pattern":"\"Change one part of a string\" → cut it with LEFT / SUBSTRING / RIGHT, transform each piece, concatenate with ||.","asks":["Why not just INITCAP(name)? (It works here because names are letters only, but INITCAP capitalises after every non-letter, e.g. `mary-jane` → `Mary-Jane`, `o'neil` → `O'Neil`. The explicit version does exactly what the problem says.)","What does SUBSTRING return for a one-letter name? (An empty string, so the result is just the upper-cased letter.)","What if name were NULL? (Every function returns NULL and `||` with NULL gives NULL, so the fixed name stays NULL.)"],"alternatives":["`INITCAP(name)` — shortest, and correct for this problem's letter-only names.","`UPPER(SUBSTRING(name, 1, 1)) || LOWER(SUBSTRING(name FROM 2))` — the same idea written only with SUBSTRING.","`CONCAT(UPPER(LEFT(name, 1)), LOWER(SUBSTRING(name, 2)))` — CONCAT treats NULL as an empty string instead of returning NULL."],"realworld":"Cleaning imported data before showing it: customer names typed in caps lock, product titles, city names. The same split-transform-glue pattern is used for masking (`'****' || RIGHT(card, 4)`)."},"mistakes":["Forgetting `LOWER` on the rest — `JOHN` would stay `JOHN`.","Using `SUBSTRING(name, 1)` for the rest — positions start at 1, so that repeats the first letter (`MMaria`).","Using `+` to join strings (SQL Server style). In PostgreSQL `+` is arithmetic; use `||` or `CONCAT`.","Forgetting the alias `AS name` — the column would be called `?column?`.","Forgetting `ORDER BY user_id` — the problem asks for a specific order."],"official_ordered":true,"built":{"id":44,"inputs":[{"name":"Users","columns":["user_id","name"],"types":["integer","character varying(40)"],"rows":[[1,"mARIA"],[2,"JOHN"],[3,"lee"],[4,"b"],[5,"Zoe"],[6,"oLIVER"]]}],"visuals":[{"columns":["user_id","name","first_letter","rest","upper_first","lower_rest"],"types":["integer","character varying(40)","text","text","text","text"],"rows":[[1,"mARIA","m","ARIA","M","aria"],[2,"JOHN","J","OHN","J","ohn"],[3,"lee","l","ee","L","ee"],[4,"b","b","","B",""],[5,"Zoe","Z","oe","Z","oe"],[6,"oLIVER","o","LIVER","O","liver"]]},{"columns":["user_id","original","fixed_name","forgot_lower_wrong"],"types":["integer","character varying(40)","text","text"],"rows":[[1,"mARIA","Maria","MARIA"],[2,"JOHN","John","JOHN"],[3,"lee","Lee","Lee"],[4,"b","B","B"],[5,"Zoe","Zoe","Zoe"],[6,"oLIVER","Oliver","OLIVER"]]}],"output":{"columns":["user_id","name"],"types":["integer","text"],"rows":[[1,"Maria"],[2,"John"],[3,"Lee"],[4,"B"],[5,"Zoe"],[6,"Oliver"]]}}},{"id":45,"lc":1527,"slug":"patients-with-a-condition","title":"Patients With a Condition","section":"Advanced String Functions / Regex / Clause","difficulty":"Easy","concepts":["LIKE","% wildcard","word boundary","OR","WHERE"],"pattern":"To find a word that starts with a prefix inside a space-separated list, match it either at the very start of the string or right after a space.","statement":["A hospital stores each patient's diagnoses in one text column, `conditions`: zero or more condition codes separated by single spaces, e.g. `'ACNE DIAB100'`. The column can also be empty.","Find the patients who have **Type I Diabetes**. Its codes always **start with `DIAB1`** (`DIAB100`, `DIAB102`, …). The code can be anywhere in the list, but `DIAB1` must be the **beginning of a code** — `XDIAB1` or `+DIAB100` are different codes."],"returns":"`patient_id`, `patient_name` and `conditions` of every patient who has at least one code starting with `DIAB1`, in any order.","setup":"CREATE TABLE Patients (\n  patient_id   INT PRIMARY KEY,\n  patient_name VARCHAR(30),\n  conditions   VARCHAR(100)\n);\n\nINSERT INTO Patients VALUES\n  (1, 'Daniel', 'DIAB100 MYOP'),\n  (2, 'Priya',  'ACNE DIAB102'),\n  (3, 'Omar',   'ACNE +DIAB100'),\n  (4, 'Lena',   'XDIAB1'),\n  (5, 'Tom',    'DIAB201'),\n  (6, 'Sara',   ''),\n  (7, 'Ken',    'COUGH DIAB1 FLU');","tables":["Patients"],"table_notes":{"Patients":"Omar (`+DIAB100`) and Lena (`XDIAB1`) contain the letters DIAB1 but NOT at the start of a code — they are the traps. Sara has no conditions at all (empty string)."},"solution":"SELECT patient_id,\n       patient_name,\n       conditions\nFROM Patients\nWHERE conditions LIKE 'DIAB1%'\n   OR conditions LIKE '% DIAB1%';","output_notes":["**Daniel** — `DIAB100` is the first code, so `LIKE 'DIAB1%'` matches.","**Priya** — `DIAB102` is the second code; the text contains `' DIAB1'` (space + DIAB1), so `LIKE '% DIAB1%'` matches.","**Ken** — `DIAB1` sits in the middle of the list, after a space.","**Omar is missing** — his code is `+DIAB100`: the character before DIAB1 is `+`, not a space, and it is not at the start either.","**Lena is missing** — `XDIAB1` starts with `X`; DIAB1 is inside the code, not at its beginning.","**Tom** (`DIAB201` is Type II) and **Sara** (no conditions) are also missing."],"breakdown":[{"code":"SELECT patient_id, patient_name, conditions","text":"Return the three columns the problem asks for."},{"code":"FROM Patients","text":"One row per patient (7 rows)."},{"code":"WHERE conditions LIKE 'DIAB1%'","text":"Case 1: the **first** code starts with DIAB1. `%` means \"any characters (or none)\", so `'DIAB1%'` = the string begins with DIAB1."},{"code":"   OR conditions LIKE '% DIAB1%'","text":"Case 2: a **later** code starts with DIAB1. Every later code is preceded by a space, so we look for `' DIAB1'` anywhere. The space is what rejects `+DIAB100` and `XDIAB1`."}],"exec_order":[{"stage":"FROM","code":"Patients","text":"Read all 7 patients."},{"stage":"WHERE","code":"LIKE 'DIAB1%' OR LIKE '% DIAB1%'","text":"Keep rows where some code starts with DIAB1 → 3 rows."},{"stage":"SELECT","code":"patient_id, patient_name, conditions","text":"Return the three columns."}],"visuals":[{"kind":"string","title":"Step 1 — Look at each code on its own","diagram":"'ACNE +DIAB100'  ──split on spaces──▶  'ACNE'  |  '+DIAB100'\n                                           ✗          ✗  (starts with '+')\n\n'ACNE DIAB102'   ──split on spaces──▶  'ACNE'  |  'DIAB102'\n                                           ✗          ✓  (starts with DIAB1)\n\nA code \"starts with DIAB1\" ⇔ in the full string it is either\n  • at the very beginning          → LIKE 'DIAB1%'\n  • right after a space            → LIKE '% DIAB1%'","sql":"SELECT p.patient_id,\n       p.patient_name,\n       code.word                AS code,\n       code.word LIKE 'DIAB1%'  AS code_starts_with_diab1\nFROM Patients AS p\nCROSS JOIN UNNEST(STRING_TO_ARRAY(p.conditions, ' ')) AS code(word)\nORDER BY p.patient_id, code.word;","text":"This helper view splits every list into single codes, just to see the rule clearly (it is **not** part of the solution). Only `DIAB100` (Daniel), `DIAB102` (Priya) and `DIAB1` (Ken) start with DIAB1. `+DIAB100` and `XDIAB1` do not. Sara disappears here because her list is empty."},{"kind":"filter","title":"Step 2 — Evaluate both LIKE patterns on the full string","diagram":"conditions\n   │\n   ├─ LIKE 'DIAB1%'     first code starts with DIAB1?\n   │        OR\n   └─ LIKE '% DIAB1%'   a code after a space starts with DIAB1?\n            │\n            ▼\n   TRUE → keep      FALSE → drop\n\n   naive LIKE '%DIAB1%' → also TRUE for '+DIAB100' and 'XDIAB1'  ✗","sql":"SELECT patient_id,\n       patient_name,\n       conditions,\n       conditions LIKE 'DIAB1%'    AS at_start,\n       conditions LIKE '% DIAB1%'  AS after_space,\n       (conditions LIKE 'DIAB1%'\n        OR conditions LIKE '% DIAB1%') AS kept,\n       conditions LIKE '%DIAB1%'   AS naive_contains_WRONG\nFROM Patients\nORDER BY patient_id;","text":"Daniel is kept by `at_start`; Priya and Ken by `after_space`. Omar and Lena are FALSE in both columns — the characters before DIAB1 are `+` and `X`, not a space. The last column shows the classic bug: plain `'%DIAB1%'` wrongly says TRUE for both of them."}],"flow":[{"label":"Input table","detail":"Patients (7 rows)","ref":"input"},{"label":"Codes one by one","detail":"which codes start with DIAB1?","ref":0},{"label":"WHERE two LIKE patterns","detail":"at start OR after a space","ref":1},{"label":"Final output","detail":"Daniel, Priya, Ken","ref":"output"}],"takeaway":{"pattern":"\"A word in a space-separated list starts with X\" → `col LIKE 'X%' OR col LIKE '% X%'` (or the regex `col ~ '(^| )X'`).","asks":["Why not `LIKE '%DIAB1%'`? (It also matches DIAB1 inside another code, like `XDIAB1` or `+DIAB100`.)","Can you do it with one condition? (Yes, with a regex: `conditions ~ '(^| )DIAB1'`, or with a word boundary `conditions ~ '\\mDIAB1'` — but `\\m` treats `+` as a boundary, so it would wrongly accept `+DIAB100`.)","Is LIKE case-sensitive in PostgreSQL? (Yes. `ILIKE` is the case-insensitive version; codes here are upper case, so LIKE is right.)"],"alternatives":["Regex: `WHERE conditions ~ '(^| )DIAB1'` — `^` is the start of the string, `( |^)` means \"start or a space\".","Prepend a space: `WHERE ' ' || conditions LIKE '% DIAB1%'` — every code is now preceded by a space, so one pattern covers both cases.","Split into codes: `WHERE EXISTS (SELECT 1 FROM UNNEST(STRING_TO_ARRAY(conditions, ' ')) AS c WHERE c LIKE 'DIAB1%')`."],"realworld":"Searching tags or keyword lists stored in one text column (`'urgent billing vip'`). The better long-term fix is to normalise the data into one row per tag, but in interviews and legacy tables you match word boundaries like this."},"mistakes":["Using only `LIKE '%DIAB1%'` — matches `XDIAB1` and `+DIAB100`.","Using only `LIKE '% DIAB1%'` — misses patients whose **first** code is DIAB1 (Daniel).","Using only `LIKE 'DIAB1%'` — misses codes later in the list (Priya, Ken).","Writing `LIKE '%DIAB1'` (no trailing %) — requires the string to END with DIAB1, so `DIAB100` fails.","Using the regex word boundary `\\m` / `\\y` — a `+` counts as a boundary, so `+DIAB100` would wrongly match."],"built":{"id":45,"inputs":[{"name":"Patients","columns":["patient_id","patient_name","conditions"],"types":["integer","character varying(30)","character varying(100)"],"rows":[[1,"Daniel","DIAB100 MYOP"],[2,"Priya","ACNE DIAB102"],[3,"Omar","ACNE +DIAB100"],[4,"Lena","XDIAB1"],[5,"Tom","DIAB201"],[6,"Sara",""],[7,"Ken","COUGH DIAB1 FLU"]]}],"visuals":[{"columns":["patient_id","patient_name","code","code_starts_with_diab1"],"types":["integer","character varying(30)","text","boolean"],"rows":[[1,"Daniel","DIAB100",true],[1,"Daniel","MYOP",false],[2,"Priya","ACNE",false],[2,"Priya","DIAB102",true],[3,"Omar","+DIAB100",false],[3,"Omar","ACNE",false],[4,"Lena","XDIAB1",false],[5,"Tom","DIAB201",false],[7,"Ken","COUGH",false],[7,"Ken","DIAB1",true],[7,"Ken","FLU",false]]},{"columns":["patient_id","patient_name","conditions","at_start","after_space","kept","naive_contains_wrong"],"types":["integer","character varying(30)","character varying(100)","boolean","boolean","boolean","boolean"],"rows":[[1,"Daniel","DIAB100 MYOP",true,false,true,true],[2,"Priya","ACNE DIAB102",false,true,true,true],[3,"Omar","ACNE +DIAB100",false,false,false,true],[4,"Lena","XDIAB1",false,false,false,true],[5,"Tom","DIAB201",false,false,false,false],[6,"Sara","",false,false,false,false],[7,"Ken","COUGH DIAB1 FLU",false,true,true,true]]}],"output":{"columns":["patient_id","patient_name","conditions"],"types":["integer","character varying(30)","character varying(100)"],"rows":[[1,"Daniel","DIAB100 MYOP"],[2,"Priya","ACNE DIAB102"],[7,"Ken","COUGH DIAB1 FLU"]]}}},{"id":46,"lc":196,"slug":"delete-duplicate-emails","title":"Delete Duplicate Emails","section":"Advanced String Functions / Regex / Clause","difficulty":"Easy","concepts":["DELETE","GROUP BY","MIN()","NOT IN subquery","deduplication"],"pattern":"To deduplicate in place: find the one row to keep per group (MIN(id) … GROUP BY), then DELETE every row whose id is not in that keep-list.","statement":["The `Person` table stores an `id` and an `email`. Some emails appear on several rows.","Remove the duplicates **from the table itself**: for each email keep only the row with the **smallest id** and delete the others. This is a `DELETE` statement, not a `SELECT` — LeetCode checks what is left in `Person` afterwards."],"returns":"Nothing is returned by the statement itself. Afterwards `Person` must contain exactly one row per email — the one with the smallest `id`. Row order does not matter.","setup":"CREATE TABLE Person (\n  id    INT PRIMARY KEY,\n  email VARCHAR(255)\n);\n\nINSERT INTO Person VALUES\n  (1, 'alice@mail.com'),\n  (2, 'bob@mail.com'),\n  (3, 'alice@mail.com'),\n  (4, 'carol@mail.com'),\n  (5, 'bob@mail.com'),\n  (6, 'alice@mail.com'),\n  (7, 'dan@mail.com');","tables":["Person"],"table_notes":{"Person":"alice appears 3 times (ids 1, 3, 6), bob twice (ids 2, 5); carol and dan appear once."},"solution":"DELETE FROM Person\nWHERE id NOT IN (\n    SELECT MIN(id)\n    FROM Person\n    GROUP BY email\n);","mutates":true,"after_query":"SELECT * FROM Person ORDER BY id","output_notes":["This is the `Person` table **after** the DELETE ran.","**id 1 alice** stays — it is the smallest id of the three alice rows. Ids **3** and **6** were deleted.","**id 2 bob** stays — id **5** was deleted.","**id 4 carol** and **id 7 dan** stay — a unique email is its own minimum, so it is always kept."],"breakdown":[{"code":"SELECT MIN(id)\nFROM Person\nGROUP BY email","text":"The subquery builds the **keep-list**: one row per email with its smallest id → `{1, 2, 4, 7}`."},{"code":"DELETE FROM Person","text":"We remove rows from `Person` itself. Without a WHERE this would delete everything, so the WHERE is the important part."},{"code":"WHERE id NOT IN ( … )","text":"Delete every row whose id is **not** in the keep-list → ids 3, 5, 6. `NOT IN` is safe here because `id` is the primary key, so the subquery can never return NULL."}],"exec_order":[{"stage":"FROM","code":"subquery: FROM Person","text":"The subquery reads all 7 rows."},{"stage":"GROUP BY","code":"subquery: GROUP BY email","text":"4 groups: alice, bob, carol, dan."},{"stage":"SELECT","code":"subquery: MIN(id)","text":"Keep-list = {1, 2, 4, 7}."},{"stage":"FROM","code":"DELETE FROM Person","text":"The outer statement scans every row of Person."},{"stage":"WHERE","code":"id NOT IN (1, 2, 4, 7)","text":"Rows 3, 5, 6 match and are deleted; 4 rows remain."}],"visuals":[{"kind":"subquery","title":"Step 1 — Subquery: the smallest id per email (the keep-list)","diagram":"alice@mail.com\n ├─ id 1\n ├─ id 3\n └─ id 6        → MIN(id) = 1\nbob@mail.com\n ├─ id 2\n └─ id 5        → MIN(id) = 2\ncarol@mail.com\n └─ id 4        → MIN(id) = 4\ndan@mail.com\n └─ id 7        → MIN(id) = 7\n\nkeep-list = { 1, 2, 4, 7 }","sql":"SELECT email,\n       STRING_AGG(CAST(id AS VARCHAR), ', ' ORDER BY id) AS all_ids,\n       COUNT(*)                                       AS copies,\n       MIN(id)                                        AS keep_id\nFROM Person\nGROUP BY email\nORDER BY keep_id;","text":"Grouping by email collects all copies of the same address. `MIN(id)` picks the row we must keep. The real subquery returns only the `keep_id` column; `all_ids` and `copies` are shown to make the groups visible."},{"kind":"delete","title":"Step 2 — Which rows will be deleted (before the DELETE runs)","diagram":"Person row ──▶ is id in keep-list {1, 2, 4, 7}?\n                 │\n          yes ◀──┴──▶ no\n           │          │\n         keep       DELETE\n\n id 3 alice  ✗ (alice keeps 1)\n id 5 bob    ✗ (bob keeps 2)\n id 6 alice  ✗ (alice keeps 1)","sql":"SELECT id,\n       email,\n       id IN (SELECT MIN(id) FROM Person GROUP BY email) AS in_keep_list,\n       CASE\n           WHEN id IN (SELECT MIN(id) FROM Person GROUP BY email) THEN 'keep'\n           ELSE 'DELETE'\n       END AS action\nFROM Person\nORDER BY id;","text":"Every row is tested against the keep-list. Ids **3**, **5** and **6** are not in it, so `WHERE id NOT IN (…)` is TRUE for them and the DELETE removes them. The final table (shown as the output) keeps ids 1, 2, 4 and 7."}],"flow":[{"label":"Input table","detail":"Person (7 rows, 3 duplicates)","ref":"input"},{"label":"Keep-list subquery","detail":"MIN(id) per email → {1, 2, 4, 7}","ref":0},{"label":"Mark rows","detail":"id NOT IN keep-list → DELETE 3, 5, 6","ref":1},{"label":"Person after DELETE","detail":"4 rows, one per email","ref":"output"}],"takeaway":{"pattern":"\"Remove duplicates, keep one\" → choose the survivor per group with MIN/MAX(id) GROUP BY key, then DELETE WHERE id NOT IN (survivors).","asks":["How would you keep the **largest** id instead? (Use `MAX(id)` in the subquery.)","Why is NOT IN safe here but risky in general? (If the subquery returned a NULL, `id NOT IN (…, NULL)` is never TRUE and nothing would be deleted. `MIN(id)` of a primary key is never NULL.)","How can you check before deleting? (Run the same WHERE as a SELECT first — exactly what Step 2 does — or run the DELETE inside a transaction and ROLLBACK.)","Does this work in MySQL? (MySQL refuses to read from the table it is deleting from in a subquery; you would wrap it in a derived table or use the self-join form. PostgreSQL allows it.)"],"alternatives":["Self-join: `DELETE FROM Person AS p1 USING Person AS p2 WHERE p1.email = p2.email AND p1.id > p2.id;` — a row is deleted if another row has the same email and a smaller id. Shorter, but harder to read the first time.","Window function: `DELETE FROM Person WHERE id IN (SELECT id FROM (SELECT id, ROW_NUMBER() OVER (PARTITION BY email ORDER BY id) AS rn FROM Person) AS t WHERE rn > 1);` — handy when \"which one to keep\" depends on several columns."],"realworld":"Cleaning a table before adding a UNIQUE constraint: duplicate sign-ups, double-imported orders, repeated log lines. Always preview the rows with a SELECT first, and run the DELETE inside a transaction."},"mistakes":["Writing a SELECT that returns the unique rows — the problem checks the table contents, so you must DELETE.","Deleting with `WHERE id NOT IN (SELECT MAX(id) …)` — keeps the largest id, not the smallest.","`DELETE FROM Person WHERE email IN (SELECT email … HAVING COUNT(*) > 1)` — deletes **every** copy, including the one you must keep.","In the self-join version writing `p1.id < p2.id` — that deletes the smallest ids and keeps the largest.","Forgetting the WHERE clause entirely — `DELETE FROM Person` empties the table."],"built":{"id":46,"inputs":[{"name":"Person","columns":["id","email"],"types":["integer","character varying(255)"],"rows":[[1,"alice@mail.com"],[2,"bob@mail.com"],[3,"alice@mail.com"],[4,"carol@mail.com"],[5,"bob@mail.com"],[6,"alice@mail.com"],[7,"dan@mail.com"]]}],"visuals":[{"columns":["email","all_ids","copies","keep_id"],"types":["character varying(255)","text","bigint","integer"],"rows":[["alice@mail.com","1, 3, 6",3,1],["bob@mail.com","2, 5",2,2],["carol@mail.com","4",1,4],["dan@mail.com","7",1,7]]},{"columns":["id","email","in_keep_list","action"],"types":["integer","character varying(255)","boolean","text"],"rows":[[1,"alice@mail.com",true,"keep"],[2,"bob@mail.com",true,"keep"],[3,"alice@mail.com",false,"DELETE"],[4,"carol@mail.com",true,"keep"],[5,"bob@mail.com",false,"DELETE"],[6,"alice@mail.com",false,"DELETE"],[7,"dan@mail.com",true,"keep"]]}],"output":{"columns":["id","email"],"types":["integer","character varying(255)"],"rows":[[1,"alice@mail.com"],[2,"bob@mail.com"],[4,"carol@mail.com"],[7,"dan@mail.com"]]}}},{"id":47,"lc":176,"slug":"second-highest-salary","title":"Second Highest Salary","section":"Advanced String Functions / Regex / Clause","difficulty":"Medium","concepts":["DISTINCT","ORDER BY … DESC","LIMIT / OFFSET","scalar subquery","NULL when empty"],"pattern":"Nth highest distinct value = DISTINCT + ORDER BY DESC + LIMIT 1 OFFSET N-1, wrapped in a scalar subquery so that \"no such value\" becomes NULL.","statement":["The `Employee` table lists each employee's `salary`. Several employees can earn the same amount.","Find the **second highest distinct** salary. Equal salaries count once: if the top two people both earn 9000, the second highest is the next smaller amount. If there is no second distinct salary (for example everyone earns the same), the answer must be **NULL** — a single row containing NULL, not an empty result."],"returns":"Exactly **one row** with one column named `SecondHighestSalary`: the second highest distinct salary, or `NULL` if it does not exist.","setup":"CREATE TABLE Employee (\n  id     INT PRIMARY KEY,\n  salary INT\n);\n\nINSERT INTO Employee VALUES\n  (1, 7000),\n  (2, 9000),\n  (3, 5000),\n  (4, 9000),\n  (5, 7000),\n  (6, 3000);","tables":["Employee"],"table_notes":{"Employee":"The top salary 9000 appears twice (ids 2 and 4) and 7000 also appears twice — duplicates are the trap."},"solution":"SELECT (\n    SELECT DISTINCT salary\n    FROM Employee\n    ORDER BY salary DESC\n    LIMIT 1 OFFSET 1\n) AS \"SecondHighestSalary\";","output_notes":["**7000** — the distinct salaries in descending order are 9000, 7000, 5000, 3000. Skip one (9000), take one → 7000.","Without DISTINCT the second row would be the **second 9000**, which is wrong.","If the table had only one distinct salary, the same query would return one row with `NULL` (see Step 4)."],"breakdown":[{"code":"SELECT DISTINCT salary\nFROM Employee","text":"Remove duplicate amounts: 9000, 7000, 5000, 3000. \"Second highest **distinct**\" means equal salaries count once."},{"code":"ORDER BY salary DESC","text":"Largest first, so position 1 is the highest and position 2 is the second highest."},{"code":"LIMIT 1 OFFSET 1","text":"`OFFSET 1` skips the first row (9000); `LIMIT 1` takes the next one (7000). For the Nth highest use `OFFSET N-1`."},{"code":"SELECT ( … ) AS \"SecondHighestSalary\"","text":"The **wrapper**. A subquery used as a value (scalar subquery) returns NULL when it finds no row. Without it, a table with one salary would give **zero rows**, but LeetCode wants one row with NULL."},{"code":"\"SecondHighestSalary\"","text":"Double quotes keep the mixed-case column name. Without them PostgreSQL folds it to `secondhighestsalary`."}],"exec_order":[{"stage":"FROM","code":"subquery: Employee","text":"Read all 6 salaries."},{"stage":"SELECT","code":"subquery: salary","text":"Pick the salary column."},{"stage":"DISTINCT","code":"subquery: DISTINCT salary","text":"6 values → 4 distinct values."},{"stage":"ORDER BY","code":"subquery: salary DESC","text":"9000, 7000, 5000, 3000."},{"stage":"LIMIT","code":"subquery: LIMIT 1 OFFSET 1","text":"Skip 9000, keep 7000 (or keep nothing if there is no second row)."},{"stage":"SELECT","code":"SELECT (subquery) AS \"SecondHighestSalary\"","text":"The outer SELECT has no FROM, so it always produces exactly one row: 7000, or NULL when the subquery is empty."}],"visuals":[{"kind":"order","title":"Step 1 — Why DISTINCT is needed: all salaries sorted","diagram":"ORDER BY salary DESC (no DISTINCT)\n\n position 1 → 9000   (id 2)\n position 2 → 9000   (id 4)   ◀── OFFSET 1 would land here ✗\n position 3 → 7000\n …","sql":"SELECT id,\n       salary\nFROM Employee\nORDER BY salary DESC, id;","text":"Two employees share the top salary 9000. If we skipped one row without removing duplicates, we would get 9000 again — that is still the **highest** salary, not the second highest."},{"kind":"subquery","title":"Step 2 — DISTINCT + ORDER BY DESC","diagram":"9000, 7000, 5000, 9000, 7000, 3000\n              │  DISTINCT\n              ▼\n   9000, 7000, 5000, 3000\n              │  ORDER BY salary DESC\n              ▼\n   1st: 9000\n   2nd: 7000   ◀── what we want\n   3rd: 5000\n   4th: 3000","sql":"SELECT DISTINCT salary\nFROM Employee\nORDER BY salary DESC;","text":"After DISTINCT every amount appears once, so \"position 2\" really means the second highest distinct salary: **7000**."},{"kind":"subquery","title":"Step 3 — LIMIT 1 OFFSET 1: skip one, take one","diagram":"9000  ── OFFSET 1 skips it\n7000  ── LIMIT 1 takes it  ✓\n5000  ── ignored\n3000  ── ignored","sql":"SELECT DISTINCT salary\nFROM Employee\nORDER BY salary DESC\nLIMIT 1 OFFSET 1;","text":"This inner query alone returns one row, 7000. The outer wrapper then puts that value into the column `SecondHighestSalary`."},{"kind":"note","title":"Step 4 — Why the outer SELECT ( … ) wrapper matters","diagram":"Imagine everyone earns 9000:\n\n  inner query alone          wrapped: SELECT ( inner ) AS …\n  ┌──────────┐               ┌─────────────────────┐\n  │ salary   │               │ SecondHighestSalary │\n  ├──────────┤               ├─────────────────────┤\n  │ (0 rows) │   ───────▶    │ NULL                │\n  └──────────┘               └─────────────────────┘\n   ✗ empty result             ✓ one row with NULL","sql":"WITH only_top_earners AS (\n    SELECT * FROM Employee WHERE salary = 9000\n)\nSELECT (SELECT COUNT(*)\n        FROM (SELECT DISTINCT salary\n              FROM only_top_earners\n              ORDER BY salary DESC\n              LIMIT 1 OFFSET 1) AS inner_rows) AS rows_from_inner_query,\n       (SELECT DISTINCT salary\n        FROM only_top_earners\n        ORDER BY salary DESC\n        LIMIT 1 OFFSET 1)                       AS \"SecondHighestSalary\";","text":"Here we pretend the table contains only the two 9000 earners. The inner query finds **0 rows** (there is no second distinct salary). Used as a value inside `SELECT ( … )`, an empty subquery becomes **NULL**, and the outer SELECT without FROM always produces exactly one row — exactly what the problem requires."}],"flow":[{"label":"Input table","detail":"Employee (6 rows, duplicate 9000 and 7000)","ref":"input"},{"label":"Duplicates trap","detail":"sorted without DISTINCT, row 2 is 9000 again","ref":0},{"label":"DISTINCT + ORDER BY DESC","detail":"9000, 7000, 5000, 3000","ref":1},{"label":"LIMIT 1 OFFSET 1","detail":"skip one, take one → 7000","ref":2},{"label":"Scalar-subquery wrapper","detail":"no second salary → NULL instead of 0 rows","ref":3},{"label":"Final output","detail":"SecondHighestSalary = 7000","ref":"output"}],"takeaway":{"pattern":"\"Nth highest distinct value, or NULL\" → `SELECT (SELECT DISTINCT x FROM t ORDER BY x DESC LIMIT 1 OFFSET N-1) AS answer`.","asks":["What if the table has only one row? (The inner query returns nothing; the wrapper turns that into NULL.)","What about the 3rd or Nth highest? (Change OFFSET to N-1. LeetCode 177 asks exactly that as a function.)","Can you solve it without LIMIT/OFFSET? (Yes: `SELECT MAX(salary) FROM Employee WHERE salary < (SELECT MAX(salary) FROM Employee)`. MAX over zero rows is NULL, so it also returns NULL automatically.)","What if salary can be NULL? (DISTINCT keeps one NULL and `ORDER BY … DESC` puts NULLs **first** in PostgreSQL. Add `WHERE salary IS NOT NULL` or `ORDER BY salary DESC NULLS LAST` to be safe.)"],"alternatives":["`SELECT MAX(salary) AS \"SecondHighestSalary\" FROM Employee WHERE salary < (SELECT MAX(salary) FROM Employee);` — the largest salary that is smaller than the top one; an aggregate always returns one row.","`DENSE_RANK() OVER (ORDER BY salary DESC)` in a CTE, then `SELECT MAX(salary) … WHERE rnk = 2` — generalises well to \"Nth per department\" (see Department Top Three Salaries)."],"realworld":"Leaderboards and pricing: the runner-up score, the second cheapest offer, the next price tier. APIs often expect exactly one value (or NULL) rather than an empty result set."},"mistakes":["Forgetting DISTINCT — with two people at the top salary, you return the top salary again.","Returning the inner query without the wrapper — on a one-salary table you get **zero rows** instead of one row with NULL.","Writing the alias without double quotes — PostgreSQL turns `SecondHighestSalary` into `secondhighestsalary`.","Using `ORDER BY salary` (ascending) — OFFSET 1 then gives the second **lowest** salary.","Using `ROW_NUMBER()` instead of `DENSE_RANK()` in the window version — ties get different numbers, so rank 2 can be the duplicated top salary."],"built":{"id":47,"inputs":[{"name":"Employee","columns":["id","salary"],"types":["integer","integer"],"rows":[[1,7000],[2,9000],[3,5000],[4,9000],[5,7000],[6,3000]]}],"visuals":[{"columns":["id","salary"],"types":["integer","integer"],"rows":[[2,9000],[4,9000],[1,7000],[5,7000],[3,5000],[6,3000]]},{"columns":["salary"],"types":["integer"],"rows":[[9000],[7000],[5000],[3000]]},{"columns":["salary"],"types":["integer"],"rows":[[7000]]},{"columns":["rows_from_inner_query","SecondHighestSalary"],"types":["bigint","integer"],"rows":[[0,null]]}],"output":{"columns":["SecondHighestSalary"],"types":["integer"],"rows":[[7000]]}}},{"id":48,"lc":1484,"slug":"group-sold-products-by-the-date","title":"Group Sold Products By The Date","section":"Advanced String Functions / Regex / Clause","difficulty":"Easy","concepts":["GROUP BY","COUNT(DISTINCT)","STRING_AGG","DISTINCT inside aggregate","ORDER BY inside aggregate"],"pattern":"One row per group with a count and a sorted, comma-separated list: COUNT(DISTINCT x) + STRING_AGG(DISTINCT x, ',' ORDER BY x).","statement":["A market logs every sale in `Activities`: the `sell_date` and the `product` sold. The same product can be sold several times on the same day, so the table contains duplicate rows.","For each date, report **how many different products** were sold and **their names** as one comma-separated string, with the names sorted alphabetically and each name listed only once."],"returns":"One row per `sell_date` with `num_sold` (number of distinct products) and `products` (distinct names, sorted, joined by `,` with no spaces). Order the rows by `sell_date`.","setup":"CREATE TABLE Activities (\n  sell_date DATE,\n  product   VARCHAR(20)\n);\n\nINSERT INTO Activities VALUES\n  ('2024-03-01', 'Pen'),\n  ('2024-03-01', 'Notebook'),\n  ('2024-03-02', 'Mug'),\n  ('2024-03-01', 'Pen'),\n  ('2024-03-03', 'Tea'),\n  ('2024-03-01', 'Eraser'),\n  ('2024-03-03', 'Coffee'),\n  ('2024-03-03', 'Tea'),\n  ('2024-03-02', 'Mug');","tables":["Activities"],"table_notes":{"Activities":"No primary key: Pen is sold twice on 03-01, Mug twice on 03-02 and Tea twice on 03-03. Rows are not in date order."},"solution":"SELECT sell_date,\n       COUNT(DISTINCT product)                     AS num_sold,\n       STRING_AGG(DISTINCT product, ',' ORDER BY product) AS products\nFROM Activities\nGROUP BY sell_date\nORDER BY sell_date;","official_ordered":true,"output_notes":["**2024-03-01 → 3, Eraser,Notebook,Pen** — 4 sales but Pen twice, so 3 different products, listed alphabetically.","**2024-03-02 → 1, Mug** — two sales of the same product count as one.","**2024-03-03 → 2, Coffee,Tea** — Coffee comes before Tea alphabetically even though Tea was sold first."],"breakdown":[{"code":"FROM Activities","text":"All 9 sales, including duplicates."},{"code":"GROUP BY sell_date","text":"One group per day → 3 groups."},{"code":"COUNT(DISTINCT product) AS num_sold","text":"Count **different** products in the group. `COUNT(*)` would count sales (4 on 03-01), not products (3)."},{"code":"STRING_AGG(DISTINCT product, ',' ORDER BY product)","text":"Glue the group's product names into one string with `,` between them. `DISTINCT` removes repeated names, `ORDER BY product` (inside the parentheses) sorts the names **within** the string. With DISTINCT, the ORDER BY expression must be the aggregated column itself."},{"code":"AS products","text":"Name the column as LeetCode expects."},{"code":"ORDER BY sell_date","text":"Sorts the **rows** of the result. This is a different ORDER BY from the one inside STRING_AGG."}],"exec_order":[{"stage":"FROM","code":"Activities","text":"Read all 9 sales."},{"stage":"GROUP BY","code":"sell_date","text":"3 groups (03-01, 03-02, 03-03)."},{"stage":"SELECT","code":"COUNT(DISTINCT product), STRING_AGG(DISTINCT product, ',' ORDER BY product)","text":"Per group: number of different products and their sorted list."},{"stage":"ORDER BY","code":"sell_date","text":"Rows sorted by date."}],"visuals":[{"kind":"group","title":"Step 1 — GROUP BY sell_date: what each group contains","diagram":"2024-03-01\n ├─ Eraser\n ├─ Notebook\n ├─ Pen\n └─ Pen        (duplicate)\n2024-03-02\n ├─ Mug\n └─ Mug        (duplicate)\n2024-03-03\n ├─ Coffee\n ├─ Tea\n └─ Tea        (duplicate)","sql":"SELECT sell_date,\n       product,\n       COUNT(*) AS times_sold\nFROM Activities\nGROUP BY sell_date, product\nORDER BY sell_date, product;","text":"This helper view shows each day's products and how many times each was sold. Pen, Mug and Tea appear twice on their day — they must be counted and listed only **once**."},{"kind":"group","title":"Step 2 — Aggregate each day: with and without DISTINCT","diagram":"2024-03-01: Pen, Notebook, Pen, Eraser\n   │\n   ├─ COUNT(*)                       = 4          ✗ counts sales\n   ├─ COUNT(DISTINCT product)        = 3          ✓\n   ├─ STRING_AGG(product, …)         = Eraser,Notebook,Pen,Pen   ✗\n   └─ STRING_AGG(DISTINCT product, …)= Eraser,Notebook,Pen       ✓","sql":"SELECT sell_date,\n       COUNT(*)                                            AS sales_rows,\n       COUNT(DISTINCT product)                             AS num_sold,\n       STRING_AGG(product, ',' ORDER BY product)           AS without_distinct_WRONG,\n       STRING_AGG(DISTINCT product, ',' ORDER BY product)  AS products\nFROM Activities\nGROUP BY sell_date\nORDER BY sell_date;","text":"Compare the columns side by side. `sales_rows` counts every sale (4 on 03-01), while `num_sold` counts different products (3). Without DISTINCT, the list repeats `Pen` and `Mug`; with DISTINCT each name appears once, and `ORDER BY product` puts Coffee before Tea."}],"flow":[{"label":"Input table","detail":"Activities (9 sales, with duplicates)","ref":"input"},{"label":"Groups per day","detail":"products and how often each was sold","ref":0},{"label":"COUNT(DISTINCT) + STRING_AGG(DISTINCT … ORDER BY)","detail":"one row per day","ref":1},{"label":"Final output","detail":"ORDER BY sell_date","ref":"output"}],"takeaway":{"pattern":"\"List the items of each group in one cell\" → `STRING_AGG(DISTINCT col, ',' ORDER BY col)` next to `COUNT(DISTINCT col)`.","asks":["What is the MySQL equivalent? (`GROUP_CONCAT(DISTINCT product ORDER BY product SEPARATOR ',')`.)","Can STRING_AGG with DISTINCT order by another column? (No — PostgreSQL requires the ORDER BY expressions to appear in the argument list. Deduplicate in a subquery first if you need another sort key.)","How would you get an array instead of a string? (`ARRAY_AGG(DISTINCT product ORDER BY product)`.)","What if product can be NULL? (COUNT and STRING_AGG both skip NULLs, so it is neither counted nor listed.)"],"alternatives":["Deduplicate first: `WITH d AS (SELECT DISTINCT sell_date, product FROM Activities) SELECT sell_date, COUNT(*), STRING_AGG(product, ',' ORDER BY product) FROM d GROUP BY sell_date ORDER BY sell_date;` — no DISTINCT needed inside the aggregates.","`ARRAY_TO_STRING(ARRAY_AGG(DISTINCT product ORDER BY product), ',')` — same result via an array."],"realworld":"Daily summaries and reports: \"items in each order\", \"tags per article\", \"skills per candidate\" shown in one readable cell, often exported to CSV or shown in an admin table."},"mistakes":["`COUNT(*)` or `COUNT(product)` instead of `COUNT(DISTINCT product)` — counts sales, not different products.","Forgetting DISTINCT inside STRING_AGG — duplicates like `Pen,Pen` appear in the list.","Forgetting `ORDER BY product` inside STRING_AGG — the order of names inside the string is then arbitrary.","Using `', '` (comma + space) as separator — the expected output has no spaces.","Putting only the outer `ORDER BY sell_date` and expecting it to sort the names — it sorts rows, not the inside of the string."],"official_case_insensitive":true,"built":{"id":48,"inputs":[{"name":"Activities","columns":["sell_date","product"],"types":["date","character varying(20)"],"rows":[["2024-03-01","Pen"],["2024-03-01","Notebook"],["2024-03-02","Mug"],["2024-03-01","Pen"],["2024-03-03","Tea"],["2024-03-01","Eraser"],["2024-03-03","Coffee"],["2024-03-03","Tea"],["2024-03-02","Mug"]]}],"visuals":[{"columns":["sell_date","product","times_sold"],"types":["date","character varying(20)","bigint"],"rows":[["2024-03-01","Eraser",1],["2024-03-01","Notebook",1],["2024-03-01","Pen",2],["2024-03-02","Mug",2],["2024-03-03","Coffee",1],["2024-03-03","Tea",2]]},{"columns":["sell_date","sales_rows","num_sold","without_distinct_wrong","products"],"types":["date","bigint","bigint","text","text"],"rows":[["2024-03-01",4,3,"Eraser,Notebook,Pen,Pen","Eraser,Notebook,Pen"],["2024-03-02",2,1,"Mug,Mug","Mug"],["2024-03-03",3,2,"Coffee,Tea,Tea","Coffee,Tea"]]}],"output":{"columns":["sell_date","num_sold","products"],"types":["date","bigint","text"],"rows":[["2024-03-01",3,"Eraser,Notebook,Pen"],["2024-03-02",1,"Mug"],["2024-03-03",2,"Coffee,Tea"]]}}},{"id":49,"lc":1327,"slug":"list-the-products-ordered-in-a-period","title":"List the Products Ordered in a Period","section":"Advanced String Functions / Regex / Clause","difficulty":"Easy","concepts":["date range","INNER JOIN","GROUP BY","SUM","HAVING"],"pattern":"Filter rows to a period with a half-open date range (>= first day AND < first day of next month), then GROUP BY and keep groups with HAVING.","statement":["`Products` lists each product's name and category. `Orders` logs how many `unit`s of a product were ordered on an `order_date`; the same product can be ordered many times.","Find the products whose **total units ordered in February 2020** add up to **at least 100**, and report that total. Orders from any other month or year do not count."],"returns":"`product_name` and `unit` (the February 2020 total) for every product with a total of 100 or more, in any order.","setup":"CREATE TABLE Products (\n  product_id       INT PRIMARY KEY,\n  product_name     VARCHAR(40),\n  product_category VARCHAR(40)\n);\nCREATE TABLE Orders (\n  product_id INT,\n  order_date DATE,\n  unit       INT\n);\n\nINSERT INTO Products VALUES\n  (1, 'Desk Lamp',    'Home'),\n  (2, 'USB Cable',    'Electronics'),\n  (3, 'Office Chair', 'Furniture'),\n  (4, 'Notebook',     'Stationery'),\n  (5, 'Monitor',      'Electronics');\n\nINSERT INTO Orders VALUES\n  (1, '2020-02-01', 60),\n  (1, '2020-02-29', 40),\n  (2, '2020-01-31', 200),\n  (2, '2020-02-14', 50),\n  (3, '2020-02-10', 30),\n  (3, '2020-03-01', 90),\n  (4, '2020-02-05', 70),\n  (4, '2020-02-20', 80),\n  (5, '2021-02-10', 300);","tables":["Products","Orders"],"table_notes":{"Orders":"Boundary dates on purpose: 2020-02-01 and 2020-02-29 (leap day) are inside February; 2020-01-31 and 2020-03-01 are just outside; 2021-02-10 is February of the wrong year."},"solution":"SELECT p.product_name,\n       SUM(o.unit) AS unit\nFROM Orders AS o\nINNER JOIN Products AS p\n        ON p.product_id = o.product_id\nWHERE o.order_date >= DATE '2020-02-01'\n  AND o.order_date <  DATE '2020-03-01'\nGROUP BY p.product_id, p.product_name\nHAVING SUM(o.unit) >= 100;","output_notes":["**Desk Lamp = 100** — 60 (Feb 1) + 40 (Feb 29). Exactly 100 is kept because the rule is **at least** 100 (`>=`).","**Notebook = 150** — 70 + 80, both in February.","**USB Cable is missing** — its 200 units were ordered on Jan 31; only 50 count.","**Office Chair is missing** — the 90 units on Mar 1 are outside February; only 30 count.","**Monitor is missing** — its order is from February **2021**, so it never reaches the GROUP BY."],"breakdown":[{"code":"FROM Orders AS o","text":"Start from the order lines (9 rows)."},{"code":"INNER JOIN Products AS p\n        ON p.product_id = o.product_id","text":"Attach the product name to each order line. INNER JOIN is fine: a product with no orders can never reach 100 units."},{"code":"WHERE o.order_date >= DATE '2020-02-01'\n  AND o.order_date <  DATE '2020-03-01'","text":"Keep only February 2020. The **half-open** range (`>=` start, `<` next month's start) includes Feb 29 without having to know how many days February has, and it also works if the column were a TIMESTAMP."},{"code":"GROUP BY p.product_id, p.product_name","text":"One group per product. Grouping by the id too keeps two different products with the same name apart."},{"code":"SUM(o.unit) AS unit","text":"Total February units per product. The alias `unit` matches the expected column name."},{"code":"HAVING SUM(o.unit) >= 100","text":"Filter **groups** after summing. A condition on an aggregate cannot go in WHERE, because WHERE runs before the groups exist."}],"exec_order":[{"stage":"FROM","code":"Orders o","text":"9 order lines."},{"stage":"JOIN / ON","code":"INNER JOIN Products p ON p.product_id = o.product_id","text":"Add product names; every order has a product → still 9 rows."},{"stage":"WHERE","code":"order_date >= '2020-02-01' AND < '2020-03-01'","text":"Keep February 2020 → 6 rows."},{"stage":"GROUP BY","code":"p.product_id, p.product_name","text":"4 groups (Monitor has no February 2020 rows left)."},{"stage":"HAVING","code":"SUM(o.unit) >= 100","text":"Keep Desk Lamp (100) and Notebook (150)."},{"stage":"SELECT","code":"p.product_name, SUM(o.unit) AS unit","text":"Return name and total."}],"visuals":[{"kind":"filter","title":"Step 1 — Which orders fall inside February 2020?","diagram":"        2020-02-01                          2020-03-01\n            [ ─────────── February 2020 ─────────── )\n  Jan 31 ✗  Feb 1 ✓   …   Feb 29 ✓ (leap day)    Mar 1 ✗\n\n  order_date >= '2020-02-01'   → start included\n  order_date <  '2020-03-01'   → end excluded","sql":"SELECT product_id,\n       order_date,\n       unit,\n       order_date >= DATE '2020-02-01'  AS on_or_after_feb_1,\n       order_date <  DATE '2020-03-01'  AS before_mar_1,\n       (order_date >= DATE '2020-02-01'\n        AND order_date < DATE '2020-03-01') AS in_feb_2020\nFROM Orders\nORDER BY product_id, order_date;","text":"Both conditions must be TRUE. Jan 31 fails the first check; Mar 1 and Feb 2021 fail the second. Feb 1 and Feb 29 pass — the boundaries are handled correctly without hard-coding \"28 or 29 days\"."},{"kind":"join","title":"Step 2 — JOIN product names onto the February orders","diagram":"Orders o (February 2020 only)        Products p\n   o.product_id  ─────── = ───────▶  p.product_id\n                    │\n                    ▼\n   each order line now carries product_name","sql":"SELECT o.product_id,\n       p.product_name,\n       o.order_date,\n       o.unit\nFROM Orders AS o\nINNER JOIN Products AS p\n        ON p.product_id = o.product_id\nWHERE o.order_date >= DATE '2020-02-01'\n  AND o.order_date <  DATE '2020-03-01'\nORDER BY o.product_id, o.order_date;","text":"6 order lines survive the date filter. USB Cable keeps only its 50
