tion because we need the **values** of the neighbouring rows, not a position number. No PARTITION BY: the neighbours are simply the previous and next ids in the log."},{"kind":"filter","title":"Step 2 — WHERE num = prev_num AND num = next_num","diagram":"id 2:  5 = 5 ✓  5 = 5 ✓  → kept\nid 3:  5 = 5 ✓  5 = 5 ✓  → kept\nid 4:  5 = 5 ✓  5 = 7 ✗  → dropped\nid 6:  7 = 7 ✓  7 = 3 ✗  → dropped\nid 10: 9 = 9 ✓  9 = 9 ✓  → kept","sql":"WITH neighbours AS (\n    SELECT id,\n           num,\n           LAG(num)  OVER (ORDER BY id) AS prev_num,\n           LEAD(num) OVER (ORDER BY id) AS next_num\n    FROM Logs\n)\nSELECT id,\n       num,\n       prev_num,\n       next_num,\n       num = prev_num AS same_as_prev,\n       num = next_num AS same_as_next,\n       num = prev_num AND num = next_num AS kept\nFROM neighbours\nORDER BY id;","text":"Only rows that sit in the middle of three equal values pass: ids 2, 3 and 10. Id 6 (7) matches its previous row but not its next, so the 7s never form a run of three. Ids 1 and 12 have a NULL neighbour: id 1 evaluates to NULL and id 12 to FALSE — WHERE keeps only TRUE, so both are dropped."},{"kind":"group","title":"Step 3 — DISTINCT removes the repeated 5","diagram":"kept rows        DISTINCT num\nid 2  → 5  ─┐\nid 3  → 5  ─┴──▶  5\nid 10 → 9  ────▶  9","sql":"WITH neighbours AS (\n    SELECT id,\n           num,\n           LAG(num)  OVER (ORDER BY id) AS prev_num,\n           LEAD(num) OVER (ORDER BY id) AS next_num\n    FROM Logs\n)\nSELECT id,\n       num\nFROM neighbours\nWHERE num = prev_num\n  AND num = next_num\nORDER BY id;","text":"Because 5 runs four times, two of its rows are \"middle\" rows, so the filter returns 5 twice. `SELECT DISTINCT num` collapses them; the final answer is 5 and 9."}],"flow":[{"label":"Input table","detail":"Logs (12 rows)","ref":"input"},{"label":"LAG / LEAD","detail":"prev_num and next_num ordered by id","ref":0},{"label":"WHERE","detail":"num = prev_num AND num = next_num","ref":1},{"label":"Before DISTINCT","detail":"5 appears twice (run of four)","ref":2},{"label":"Final output","detail":"DISTINCT → 5, 9","ref":"output"}],"takeaway":{"pattern":"\"Same value N times in a row\" → LAG/LEAD (or LAG with offsets 1 and 2) over the ordering column, compare with the current row, then DISTINCT.","asks":["Why is DISTINCT required? (A run longer than 3 has several matching rows.)","What if ids have gaps (1, 2, 4)? (LAG/LEAD still compare neighbouring rows in id order. If gaps must break a run, also check `id = prev_id + 1`, or use the self-join version.)","How would you generalise to N in a row? (Gaps-and-islands: `id - ROW_NUMBER() OVER (PARTITION BY num ORDER BY id)` is constant within a run; GROUP BY num and that key, HAVING COUNT(*) >= N.)","Why not GROUP BY num HAVING COUNT(*) >= 3? (It counts all occurrences, not consecutive ones — 7 would be wrongly returned.)"],"alternatives":["Self join on ids: `FROM Logs AS l1 INNER JOIN Logs AS l2 ON l2.id = l1.id + 1 INNER JOIN Logs AS l3 ON l3.id = l1.id + 2 WHERE l1.num = l2.num AND l2.num = l3.num` with `SELECT DISTINCT l1.num`. Classic answer, but it relies on ids having no gaps.","`LAG(num, 1)` and `LAG(num, 2)` instead of LAG + LEAD — checks the current row against the two rows before it."],"realworld":"Streak detection: three failed logins in a row, a sensor reading above a limit for three consecutive minutes, a stock closing lower three days running."},"mistakes":["Forgetting DISTINCT — a run of 4 or more returns the number several times.","Counting occurrences with GROUP BY instead of checking neighbours — non-consecutive repeats would count.","Omitting `ORDER BY id` inside OVER — the order of rows is then undefined and \"previous row\" is meaningless.","Adding `PARTITION BY num` — then LAG returns the previous row **with the same number**, which skips over other values and finds false runs.","Writing `AS ConsecutiveNums` without quotes and expecting the capital letters — PostgreSQL folds unquoted names to lower case."],"built":{"id":33,"inputs":[{"name":"Logs","columns":["id","num"],"types":["integer","integer"],"rows":[[1,5],[2,5],[3,5],[4,5],[5,7],[6,7],[7,3],[8,7],[9,9],[10,9],[11,9],[12,7]]}],"visuals":[{"columns":["id","num","prev_num","next_num"],"types":["integer","integer","integer","integer"],"rows":[[1,5,null,5],[2,5,5,5],[3,5,5,5],[4,5,5,7],[5,7,5,7],[6,7,7,3],[7,3,7,7],[8,7,3,9],[9,9,7,9],[10,9,9,9],[11,9,9,7],[12,7,9,null]]},{"columns":["id","num","prev_num","next_num","same_as_prev","same_as_next","kept"],"types":["integer","integer","integer","integer","boolean","boolean","boolean"],"rows":[[1,5,null,5,null,true,null],[2,5,5,5,true,true,true],[3,5,5,5,true,true,true],[4,5,5,7,true,false,false],[5,7,5,7,false,true,false],[6,7,7,3,true,false,false],[7,3,7,7,false,false,false],[8,7,3,9,false,false,false],[9,9,7,9,false,true,false],[10,9,9,9,true,true,true],[11,9,9,7,true,false,false],[12,7,9,null,false,null,false]]},{"columns":["id","num"],"types":["integer","integer"],"rows":[[2,5],[3,5],[10,9]]}],"output":{"columns":["ConsecutiveNums"],"types":["integer"],"rows":[[5],[9]]}}},{"id":34,"lc":1164,"slug":"product-price-at-a-given-date","title":"Product Price at a Given Date","section":"Advanced Select and Joins","difficulty":"Medium","concepts":["CTE","MAX(date) per group","SELECT DISTINCT","LEFT JOIN","COALESCE default"],"pattern":"\"Value as of a date\" → find the latest change on or before that date per key, join back to read the value, and LEFT JOIN from the full key list so keys without history get a default.","statement":["The **Products** table is a price history: each row says that on `change_date` the price of `product_id` became `new_price`. Before its first change, every product costs **10**.","Find the price of **every** product on **2019-08-16**. A change made on that very day already counts; changes after it do not."],"returns":"One row per product that appears in the table: `product_id` and `price` on 2019-08-16. Any order.","setup":"CREATE TABLE Products (\n  product_id  INT,\n  new_price   INT,\n  change_date DATE,\n  PRIMARY KEY (product_id, change_date)\n);\n\nINSERT INTO Products VALUES\n  (1, 120, '2019-08-10'),\n  (1, 135, '2019-08-16'),\n  (1, 150, '2019-08-20'),\n  (2,  80, '2019-08-05'),\n  (2,  95, '2019-08-12'),\n  (3,  40, '2019-08-18'),\n  (4,  60, '2019-08-01');","tables":["Products"],"table_notes":{"Products":"Product 1 changes exactly on 2019-08-16 (counts) and again after it (ignored). Product 3 only changes **after** the date, so it still has the starting price 10."},"solution":"WITH last_change AS (\n    SELECT product_id,\n           MAX(change_date) AS last_date\n    FROM Products\n    WHERE change_date <= DATE '2019-08-16'\n    GROUP BY product_id\n),\nall_products AS (\n    SELECT DISTINCT product_id\n    FROM Products\n)\nSELECT ap.product_id,\n       COALESCE(p.new_price, 10) AS price\nFROM all_products AS ap\nLEFT JOIN last_change AS lc\n       ON lc.product_id = ap.product_id\nLEFT JOIN Products AS p\n       ON p.product_id  = lc.product_id\n      AND p.change_date = lc.last_date;","display_sql":"WITH last_change AS (\n    SELECT product_id,\n           MAX(change_date) AS last_date\n    FROM Products\n    WHERE change_date <= DATE '2019-08-16'\n    GROUP BY product_id\n),\nall_products AS (\n    SELECT DISTINCT product_id\n    FROM Products\n)\nSELECT ap.product_id,\n       COALESCE(p.new_price, 10) AS price\nFROM all_products AS ap\nLEFT JOIN last_change AS lc\n       ON lc.product_id = ap.product_id\nLEFT JOIN Products AS p\n       ON p.product_id  = lc.product_id\n      AND p.change_date = lc.last_date\nORDER BY ap.product_id;","output_notes":["**Product 1 → 135** — its changes up to the date are 08-10 and 08-16; the latest is 08-16 (the date itself counts), price 135. The 08-20 change to 150 is in the future.","**Product 2 → 95** — latest change on or before the date is 08-12.","**Product 3 → 10** — its only change (08-18) is after the date, so it is not in `last_change`; the LEFT JOIN gives NULL and COALESCE turns it into the starting price 10.","**Product 4 → 60** — a single early change on 08-01."],"breakdown":[{"code":"WITH last_change AS (\n    SELECT product_id,\n           MAX(change_date) AS last_date\n    FROM Products\n    WHERE change_date <= DATE '2019-08-16'\n    GROUP BY product_id\n)","text":"For each product, the date of its most recent change **on or before** 2019-08-16. WHERE runs before GROUP BY, so future changes are ignored. Products with only future changes produce no row here."},{"code":"all_products AS (\n    SELECT DISTINCT product_id\n    FROM Products\n)","text":"The complete list of products, one row each. We need it because `last_change` has lost product 3."},{"code":"FROM all_products AS ap\nLEFT JOIN last_change AS lc\n       ON lc.product_id = ap.product_id","text":"Start from every product and attach its last change date. LEFT JOIN keeps product 3 with `last_date = NULL`."},{"code":"LEFT JOIN Products AS p\n       ON p.product_id  = lc.product_id\n      AND p.change_date = lc.last_date","text":"Join back to the history to read the price **on that date**. `(product_id, change_date)` is the primary key, so at most one row matches. Again LEFT JOIN so product 3 survives."},{"code":"COALESCE(p.new_price, 10) AS price","text":"No change yet → NULL → replace it with the starting price 10."}],"exec_order":[{"stage":"FROM","code":"last_change: FROM Products","text":"Read the 7 history rows."},{"stage":"WHERE","code":"last_change: change_date <= DATE '2019-08-16'","text":"Drop the 2 future changes → 5 rows."},{"stage":"GROUP BY","code":"last_change: product_id → MAX(change_date)","text":"Latest date for products 1, 2 and 4."},{"stage":"FROM","code":"all_products: SELECT DISTINCT product_id","text":"Products 1, 2, 3, 4."},{"stage":"JOIN / ON","code":"all_products LEFT JOIN last_change LEFT JOIN Products","text":"Attach last date, then the price on that date; product 3 gets NULLs."},{"stage":"SELECT","code":"COALESCE(p.new_price, 10)","text":"Fill the default price."}],"visuals":[{"kind":"filter","title":"Step 1 — Which changes happened on or before 2019-08-16?","diagram":"change_date <= '2019-08-16' ?\nproduct 1: 08-10 ✓   08-16 ✓ (same day counts)   08-20 ✗\nproduct 2: 08-05 ✓   08-12 ✓\nproduct 3: 08-18 ✗   ← nothing left for product 3\nproduct 4: 08-01 ✓","sql":"SELECT product_id,\n       new_price,\n       change_date,\n       change_date <= DATE '2019-08-16' AS on_or_before\nFROM Products\nORDER BY product_id, change_date;","text":"This is the WHERE inside the first CTE. Two rows are in the future and are ignored: product 1's change to 150 and product 3's only change. `<=` matters — product 1's change on 08-16 itself must count."},{"kind":"cte","title":"Step 2 — CTE last_change: latest valid change date per product","diagram":"Products → last_change → (all_products) → LEFT JOINs → output\n\nproduct 1 ├─ 08-10 └─ 08-16   → MAX = 08-16\nproduct 2 ├─ 08-05 └─ 08-12   → MAX = 08-12\nproduct 4 └─ 08-01            → MAX = 08-01\nproduct 3   (no valid rows)   → no group at all","sql":"WITH last_change AS (\n    SELECT product_id,\n           MAX(change_date) AS last_date\n    FROM Products\n    WHERE change_date <= DATE '2019-08-16'\n    GROUP BY product_id\n)\nSELECT product_id,\n       last_date\nFROM last_change\nORDER BY product_id;","text":"GROUP BY product_id with MAX(change_date) gives the date of the price that is in force on 08-16. It only has the **date**, not the price — `MAX(new_price)` would be wrong because the newest price is not necessarily the highest. Product 3 is missing, which the next CTE fixes."},{"kind":"cte","title":"Step 3 — CTE all_products: every product once","diagram":"Products (7 rows) → SELECT DISTINCT product_id → 1, 2, 3, 4","sql":"SELECT DISTINCT product_id\nFROM Products\nORDER BY product_id;","text":"The answer needs a row for **every** product, including product 3 which has no change yet. This list is the left side of the final joins."},{"kind":"join","title":"Step 4 — all_products LEFT JOIN last_change","diagram":"all_products                 last_change\n  ap.product_id ─── = ───▶  lc.product_id\n\n1 → 08-16    2 → 08-12    4 → 08-01\n3 → no match → kept, last_date = NULL","sql":"WITH last_change AS (\n    SELECT product_id,\n           MAX(change_date) AS last_date\n    FROM Products\n    WHERE change_date <= DATE '2019-08-16'\n    GROUP BY product_id\n),\nall_products AS (\n    SELECT DISTINCT product_id\n    FROM Products\n)\nSELECT ap.product_id,\n       lc.product_id AS lc_product_id,\n       lc.last_date\nFROM all_products AS ap\nLEFT JOIN last_change AS lc\n       ON lc.product_id = ap.product_id\nORDER BY ap.product_id;","text":"Products 1, 2 and 4 find their last change date. Product 3 has no partner in `last_change`, but the LEFT JOIN keeps it with NULLs."},{"kind":"join","title":"Step 5 — LEFT JOIN Products to read the price, then COALESCE","diagram":"all_products\n └── LEFT JOIN last_change  (product_id)\n      └── LEFT JOIN Products (product_id AND change_date = last_date)\n           ▼\nnew_price  → COALESCE(new_price, 10) → price","sql":"WITH last_change AS (\n    SELECT product_id,\n           MAX(change_date) AS last_date\n    FROM Products\n    WHERE change_date <= DATE '2019-08-16'\n    GROUP BY product_id\n),\nall_products AS (\n    SELECT DISTINCT product_id\n    FROM Products\n)\nSELECT ap.product_id,\n       lc.last_date,\n       p.change_date,\n       p.new_price,\n       COALESCE(p.new_price, 10) AS price\nFROM all_products AS ap\nLEFT JOIN last_change AS lc\n       ON lc.product_id = ap.product_id\nLEFT JOIN Products AS p\n       ON p.product_id  = lc.product_id\n      AND p.change_date = lc.last_date\nORDER BY ap.product_id;","text":"Matching on both `product_id` and `change_date = last_date` picks exactly one history row: product 1 → 135, product 2 → 95, product 4 → 60. Product 3 still has NULL, so COALESCE supplies the starting price **10**."}],"flow":[{"label":"Input table","detail":"Products price history (7 rows)","ref":"input"},{"label":"Filter by date","detail":"change_date <= 2019-08-16","ref":0},{"label":"last_change","detail":"MAX(change_date) per product","ref":1},{"label":"all_products","detail":"every product id once","ref":2},{"label":"LEFT JOINs + COALESCE","detail":"price on the last date, default 10","ref":4},{"label":"Final output","detail":"one price per product","ref":"output"}],"takeaway":{"pattern":"Point-in-time lookup in a change log: latest change ≤ date per key (MAX + GROUP BY), join back for the value, LEFT JOIN from the full key list, COALESCE the default.","asks":["Why not MAX(new_price)? (The latest price is not necessarily the largest; you need the price at the latest date.)","Why the all_products CTE? (Products whose changes are all in the future disappear from last_change; they still need price 10.)","How else can you pick the latest row? (ROW_NUMBER() OVER (PARTITION BY product_id ORDER BY change_date DESC) in a CTE filtered to the date, then keep rn = 1.)","Is `<` enough? (No — a change on 2019-08-16 is already in effect that day.)"],"alternatives":["UNION version: rows whose (product_id, change_date) is IN (SELECT product_id, MAX(change_date) … WHERE change_date <= '2019-08-16' GROUP BY product_id), UNION products with HAVING MIN(change_date) > '2019-08-16' and price 10.","Window version: ROW_NUMBER() OVER (PARTITION BY product_id ORDER BY change_date DESC) on the filtered rows, keep rn = 1, then LEFT JOIN from the distinct product list with COALESCE(new_price, 10)."],"realworld":"\"As of\" queries on history tables: an employee's salary on a payroll date, an exchange rate on an invoice date, a customer's subscription plan on a given day (slowly changing dimensions)."},"mistakes":["Using `MAX(new_price)` instead of the price at `MAX(change_date)`.","Using `<` instead of `<=` — a change on the target date itself is missed.","Starting the final query FROM last_change — products with only future changes vanish instead of showing 10.","Joining back on `product_id` only — every historical price of the product matches and the row is duplicated.","Putting the date filter in the outer WHERE after the LEFT JOIN (e.g. `WHERE p.change_date <= …`) — it removes the NULL rows and turns the LEFT JOIN into an inner join."],"built":{"id":34,"inputs":[{"name":"Products","columns":["product_id","new_price","change_date"],"types":["integer","integer","date"],"rows":[[1,120,"2019-08-10"],[1,135,"2019-08-16"],[1,150,"2019-08-20"],[2,80,"2019-08-05"],[2,95,"2019-08-12"],[3,40,"2019-08-18"],[4,60,"2019-08-01"]]}],"visuals":[{"columns":["product_id","new_price","change_date","on_or_before"],"types":["integer","integer","date","boolean"],"rows":[[1,120,"2019-08-10",true],[1,135,"2019-08-16",true],[1,150,"2019-08-20",false],[2,80,"2019-08-05",true],[2,95,"2019-08-12",true],[3,40,"2019-08-18",false],[4,60,"2019-08-01",true]]},{"columns":["product_id","last_date"],"types":["integer","date"],"rows":[[1,"2019-08-16"],[2,"2019-08-12"],[4,"2019-08-01"]]},{"columns":["product_id"],"types":["integer"],"rows":[[1],[2],[3],[4]]},{"columns":["product_id","lc_product_id","last_date"],"types":["integer","integer","date"],"rows":[[1,1,"2019-08-16"],[2,2,"2019-08-12"],[3,null,null],[4,4,"2019-08-01"]]},{"columns":["product_id","last_date","change_date","new_price","price"],"types":["integer","date","date","integer","integer"],"rows":[[1,"2019-08-16","2019-08-16",135,135],[2,"2019-08-12","2019-08-12",95,95],[3,null,null,null,10],[4,"2019-08-01","2019-08-01",60,60]]}],"output":{"columns":["product_id","price"],"types":["integer","integer"],"rows":[[1,135],[2,95],[3,10],[4,60]]}}},{"id":35,"lc":1204,"slug":"last-person-to-fit-in-the-bus","title":"Last Person to Fit in the Bus","section":"Advanced Select and Joins","difficulty":"Medium","concepts":["Running total","SUM() OVER (ORDER BY)","CTE","ORDER BY … DESC","LIMIT 1"],"pattern":"Running total with SUM() OVER (ORDER BY …), keep rows where it is within the limit, then take the last one with ORDER BY … DESC LIMIT 1.","statement":["People in the **Queue** table board a bus one at a time in the order given by `turn` (1 first). The bus can carry at most **1000 kg** in total.","People board in turn order until the next person would push the total weight over 1000 kg. Nobody may skip ahead. Find the name of the **last person who gets on**. The first person always fits."],"returns":"A single row with one column, `person_name`, of the last person who boards without exceeding 1000 kg.","setup":"CREATE TABLE Queue (\n  person_id   INT PRIMARY KEY,\n  person_name VARCHAR(30),\n  weight      INT,\n  turn        INT\n);\n\nINSERT INTO Queue VALUES\n  (3, 'Ana',  300, 1),\n  (6, 'Ben',  250, 3),\n  (1, 'Chen', 200, 2),\n  (5, 'Dina', 250, 4),\n  (2, 'Eli',  100, 6),\n  (4, 'Femi', 180, 5);","tables":["Queue"],"table_notes":{"Queue":"Rows are stored out of turn order — only `turn` decides who boards first. Eli is light (100 kg) but stands behind Femi, so he cannot skip ahead."},"solution":"WITH boarding AS (\n    SELECT person_name,\n           weight,\n           turn,\n           SUM(weight) OVER (ORDER BY turn) AS total_weight\n    FROM Queue\n)\nSELECT person_name\nFROM boarding\nWHERE total_weight <= 1000\nORDER BY turn DESC\nLIMIT 1;","output_notes":["**Dina** — after her turn (4) the bus carries 300 + 200 + 250 + 250 = **1000 kg**, exactly the limit, which is allowed.","**Femi** (turn 5) would bring the total to 1180 kg, so she cannot board, and nobody after her boards either.","**Eli** (100 kg) would fit on his own weight, but his running total is 1280 kg because the queue cannot be reordered."],"breakdown":[{"code":"WITH boarding AS (","text":"A CTE that adds the running total to each person."},{"code":"SUM(weight) OVER (ORDER BY turn) AS total_weight","text":"A **running total**: for each row, the sum of the weights of everyone whose turn is less than or equal to this row's turn. Because there is an ORDER BY inside OVER, the window frame grows row by row from the first turn to the current one."},{"code":"WHERE total_weight <= 1000","text":"Keep everyone who is on the bus when they board. The running total only grows, so these are exactly the first people in the queue. `<=` because exactly 1000 kg is allowed."},{"code":"ORDER BY turn DESC\nLIMIT 1","text":"Of the people who fit, take the one with the highest turn — the last one to board."},{"code":"SELECT person_name","text":"Return only the name."}],"exec_order":[{"stage":"FROM","code":"boarding: FROM Queue","text":"Read the 6 people."},{"stage":"WINDOW","code":"boarding: SUM(weight) OVER (ORDER BY turn)","text":"Running total per person in turn order."},{"stage":"SELECT","code":"boarding: person_name, weight, turn, total_weight","text":"The CTE has 6 rows."},{"stage":"FROM","code":"boarding","text":"The main query reads the CTE."},{"stage":"WHERE","code":"total_weight <= 1000","text":"Keep Ana, Chen, Ben, Dina."},{"stage":"SELECT","code":"person_name","text":"Project the name."},{"stage":"ORDER BY","code":"turn DESC","text":"Dina (turn 4) comes first."},{"stage":"LIMIT","code":"LIMIT 1","text":"Return only Dina."}],"visuals":[{"kind":"window","title":"Step 1 — CTE boarding: running total with SUM() OVER (ORDER BY turn)","diagram":"Queue → boarding (running total) → WHERE ≤ 1000 → last by turn\n\nturn 1  Ana   300  →    0 + 300 =  300\nturn 2  Chen  200  →  300 + 200 =  500\nturn 3  Ben   250  →  500 + 250 =  750\nturn 4  Dina  250  →  750 + 250 = 1000\nturn 5  Femi  180  → 1000 + 180 = 1180\nturn 6  Eli   100  → 1180 + 100 = 1280","sql":"SELECT turn,\n       person_name,\n       weight,\n       SUM(weight) OVER (ORDER BY turn) AS total_weight\nFROM Queue\nORDER BY turn;","text":"The window is ordered by `turn`, not by `person_id` or storage order. Each row's `total_weight` includes its own weight plus everyone before it. A plain `SUM(weight)` without OVER would collapse everything into one number (1280); the window keeps every row and adds the cumulative column."},{"kind":"filter","title":"Step 2 — Keep people whose running total is at most 1000","diagram":"total_weight <= 1000 ?\n 300 ✓   500 ✓   750 ✓   1000 ✓ (exactly the limit)\n1180 ✗  1280 ✗","sql":"WITH boarding AS (\n    SELECT person_name,\n           weight,\n           turn,\n           SUM(weight) OVER (ORDER BY turn) AS total_weight\n    FROM Queue\n)\nSELECT turn,\n       person_name,\n       weight,\n       total_weight,\n       total_weight <= 1000 AS fits\nFROM boarding\nORDER BY turn;","text":"Ana, Chen, Ben and Dina fit. Femi's turn pushes the total to 1180 kg, so she — and everyone behind her, including light Eli — stays off the bus."},{"kind":"order","title":"Step 3 — ORDER BY turn DESC, LIMIT 1","diagram":"fits, sorted by turn DESC:\n  turn 4  Dina   ◀── LIMIT 1 takes this row\n  turn 3  Ben\n  turn 2  Chen\n  turn 1  Ana","sql":"WITH boarding AS (\n    SELECT person_name,\n           weight,\n           turn,\n           SUM(weight) OVER (ORDER BY turn) AS total_weight\n    FROM Queue\n)\nSELECT turn,\n       person_name,\n       total_weight\nFROM boarding\nWHERE total_weight <= 1000\nORDER BY turn DESC;","text":"Sorting the remaining people by turn from last to first puts Dina on top; `LIMIT 1` returns only her name."}],"flow":[{"label":"Input table","detail":"Queue (6 people, stored out of order)","ref":"input"},{"label":"Running total","detail":"SUM(weight) OVER (ORDER BY turn)","ref":0},{"label":"WHERE ≤ 1000","detail":"Ana, Chen, Ben, Dina fit","ref":1},{"label":"ORDER BY turn DESC","detail":"last person who fits on top","ref":2},{"label":"Final output","detail":"LIMIT 1 → Dina","ref":"output"}],"takeaway":{"pattern":"\"Last item before a cumulative limit\" → running total with SUM() OVER (ORDER BY …), filter ≤ limit, take the max by the ordering column.","asks":["Why does the frame stop at the current row? (With ORDER BY in OVER, the default frame is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW.)","What if two rows had the same turn? (The default RANGE frame would give both the same total including both weights; use ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW with a tie-breaker. Here turns are unique.)","How would you solve it without window functions? (Self join: for each q1, SUM(q2.weight) over q2.turn <= q1.turn, GROUP BY q1, HAVING sum <= 1000, ORDER BY q1.turn DESC LIMIT 1.)","Can you skip a heavy person and let a lighter one board? (Not in this problem — boarding stops at the first person who does not fit.)"],"alternatives":["Self join: `SELECT q1.person_name FROM Queue AS q1 INNER JOIN Queue AS q2 ON q2.turn <= q1.turn GROUP BY q1.turn, q1.person_name HAVING SUM(q2.weight) <= 1000 ORDER BY q1.turn DESC LIMIT 1;` — O(n²) but uses only joins and GROUP BY."],"realworld":"Capacity cut-offs: which orders fit into today's truck, how many support tickets fit into a shift's hours, the last transaction before a credit limit is reached."},"mistakes":["Ordering the window by `person_id` (or not at all) — the boarding order is `turn`.","Using `< 1000` — a total of exactly 1000 kg is allowed.","Filtering `weight <= …` per person instead of the running total.","Taking `ORDER BY total_weight DESC` — works here, but `turn DESC` states the intent (last to board) directly.","Trying to use the window alias in WHERE of the same query (`WHERE SUM(weight) OVER (…) <= 1000`) — window functions are evaluated after WHERE, so you need a CTE or subquery."],"built":{"id":35,"inputs":[{"name":"Queue","columns":["person_id","person_name","weight","turn"],"types":["integer","character varying(30)","integer","integer"],"rows":[[3,"Ana",300,1],[6,"Ben",250,3],[1,"Chen",200,2],[5,"Dina",250,4],[2,"Eli",100,6],[4,"Femi",180,5]]}],"visuals":[{"columns":["turn","person_name","weight","total_weight"],"types":["integer","character varying(30)","integer","bigint"],"rows":[[1,"Ana",300,300],[2,"Chen",200,500],[3,"Ben",250,750],[4,"Dina",250,1000],[5,"Femi",180,1180],[6,"Eli",100,1280]]},{"columns":["turn","person_name","weight","total_weight","fits"],"types":["integer","character varying(30)","integer","bigint","boolean"],"rows":[[1,"Ana",300,300,true],[2,"Chen",200,500,true],[3,"Ben",250,750,true],[4,"Dina",250,1000,true],[5,"Femi",180,1180,false],[6,"Eli",100,1280,false]]},{"columns":["turn","person_name","total_weight"],"types":["integer","character varying(30)","bigint"],"rows":[[4,"Dina",1000],[3,"Ben",750],[2,"Chen",500],[1,"Ana",300]]}],"output":{"columns":["person_name"],"types":["character varying(30)"],"rows":[["Dina"]]}}},{"id":36,"lc":1907,"slug":"count-salary-categories","title":"Count Salary Categories","section":"Advanced Select and Joins","difficulty":"Medium","concepts":["UNION ALL","COUNT(*) without GROUP BY","BETWEEN","Fixed category list"],"pattern":"When every category must appear even with 0 rows, write one aggregate SELECT per category (COUNT(*) without GROUP BY always returns a row) and stack them with UNION ALL.","statement":["The **Accounts** table stores the monthly income of each bank account.","Sort the accounts into three salary bands — **Low Salary** (income below 20000), **Average Salary** (20000 to 50000, both ends included) and **High Salary** (above 50000) — and count the accounts in each band. All three bands must be reported, with **0** if a band is empty."],"returns":"Exactly three rows, one per category, with `category` and `accounts_count`. Any order.","setup":"CREATE TABLE Accounts (\n  account_id INT PRIMARY KEY,\n  income     INT\n);\n\nINSERT INTO Accounts VALUES\n  (1,  20000),\n  (2,  35500),\n  (3,  50000),\n  (4,  50001),\n  (5, 120000),\n  (6,  72000);","tables":["Accounts"],"table_notes":{"Accounts":"Nobody earns below 20000, so Low Salary must still appear with 0. Accounts 1 and 3 sit exactly on the band edges (20000 and 50000) and belong to Average."},"solution":"SELECT 'Low Salary' AS category,\n       COUNT(*)     AS accounts_count\nFROM Accounts\nWHERE income < 20000\n\nUNION ALL\n\nSELECT 'Average Salary',\n       COUNT(*)\nFROM Accounts\nWHERE income BETWEEN 20000 AND 50000\n\nUNION ALL\n\nSELECT 'High Salary',\n       COUNT(*)\nFROM Accounts\nWHERE income > 50000;","output_notes":["**Low Salary = 0** — no income is below 20000. The row still appears because `COUNT(*)` without GROUP BY always returns one row.","**Average Salary = 3** — accounts 1 (20000), 2 (35500) and 3 (50000). Both edges are inclusive.","**High Salary = 3** — accounts 4 (50001), 5 (120000) and 6 (72000)."],"breakdown":[{"code":"SELECT 'Low Salary' AS category,\n       COUNT(*)     AS accounts_count\nFROM Accounts\nWHERE income < 20000","text":"Part 1. The category name is a constant string. An aggregate **without GROUP BY** treats the whole filtered set as one group and always returns exactly one row — even when the WHERE leaves no rows, COUNT(*) gives 0."},{"code":"UNION ALL","text":"Stack the next result under the previous one. UNION ALL keeps every row and skips duplicate removal (the three rows can never be duplicates anyway). Column names come from the first SELECT."},{"code":"SELECT 'Average Salary',\n       COUNT(*)\nFROM Accounts\nWHERE income BETWEEN 20000 AND 50000","text":"Part 2. `BETWEEN` includes both ends, matching the inclusive range [20000, 50000]."},{"code":"SELECT 'High Salary',\n       COUNT(*)\nFROM Accounts\nWHERE income > 50000","text":"Part 3. Strictly greater than 50000. Together the three conditions cover every income exactly once."}],"exec_order":[{"stage":"FROM","code":"each part: Accounts","text":"Each of the three SELECTs reads all 6 accounts."},{"stage":"WHERE","code":"income < 20000 / BETWEEN 20000 AND 50000 / > 50000","text":"Each part keeps its own band: 0, 3 and 3 rows."},{"stage":"SELECT","code":"'…' AS category, COUNT(*)","text":"Each part collapses to one row with its count."},{"stage":"SELECT","code":"UNION ALL","text":"The three one-row results are stacked → 3 rows."}],"visuals":[{"kind":"case","title":"Step 1 — Which band does each income fall into?","diagram":"   < 20000      20000 … 50000      > 50000\n─────────────┼──────────────────┼────────────▶ income\n  Low          Average            High\n             ▲ 20000 is Average    ▲ 50000 is Average, 50001 is High","sql":"SELECT account_id,\n       income,\n       income < 20000                 AS is_low,\n       income BETWEEN 20000 AND 50000 AS is_average,\n       income > 50000                 AS is_high\nFROM Accounts\nORDER BY income;","text":"Each account is TRUE in exactly one column. No account is low; the boundary values 20000 and 50000 are average, and 50001 is already high."},{"kind":"union","title":"Step 2 — Part 1: Low Salary (no matching rows, count 0)","diagram":"Accounts (6) ── WHERE income < 20000 ──▶ 0 rows\n                                          │\n                     COUNT(*) (no GROUP BY)\n                                          ▼\n                            ('Low Salary', 0)   ← one row anyway","sql":"SELECT 'Low Salary' AS category,\n       COUNT(*)     AS accounts_count\nFROM Accounts\nWHERE income < 20000\nORDER BY category;","text":"The WHERE removes every account, yet the query still returns one row with 0. That is the key property: without GROUP BY, an aggregate query always produces exactly one row."},{"kind":"union","title":"Step 3 — Part 2: Average Salary","diagram":"WHERE income BETWEEN 20000 AND 50000\n  account 1  20000 ✓\n  account 2  35500 ✓\n  account 3  50000 ✓    → ('Average Salary', 3)","sql":"SELECT 'Average Salary' AS category,\n       COUNT(*)         AS accounts_count\nFROM Accounts\nWHERE income BETWEEN 20000 AND 50000\nORDER BY category;","text":"BETWEEN is inclusive on both sides, so accounts 1 and 3 on the edges are counted: 3 accounts."},{"kind":"union","title":"Step 4 — Part 3: High Salary","diagram":"WHERE income > 50000\n  account 4   50001 ✓\n  account 6   72000 ✓\n  account 5  120000 ✓   → ('High Salary', 3)","sql":"SELECT 'High Salary' AS category,\n       COUNT(*)      AS accounts_count\nFROM Accounts\nWHERE income > 50000\nORDER BY category;","text":"Strictly above 50000: 3 accounts. UNION ALL then stacks the three one-row results into the final table."},{"kind":"group","title":"Step 5 — Why not GROUP BY a CASE? The empty band disappears","diagram":"CASE label per account → GROUP BY label\n  Average Salary ├─ 1 ├─ 2 └─ 3   → 3\n  High Salary    ├─ 4 ├─ 5 └─ 6   → 3\n  Low Salary     (no rows → no group → no output row ✗)","sql":"SELECT CASE\n           WHEN income < 20000  THEN 'Low Salary'\n           WHEN income <= 50000 THEN 'Average Salary'\n           ELSE 'High Salary'\n       END      AS category,\n       COUNT(*) AS accounts_count\nFROM Accounts\nGROUP BY category\nORDER BY category;","text":"GROUP BY only creates groups for values that actually occur. Since no account is low, 'Low Salary' is missing from this result — the exact edge case the problem tests. The UNION ALL solution avoids it because each category has its own SELECT."}],"flow":[{"label":"Input table","detail":"Accounts (6 rows)","ref":"input"},{"label":"Band per account","detail":"is_low / is_average / is_high","ref":0},{"label":"Part 1: Low","detail":"0 rows → COUNT(*) = 0","ref":1},{"label":"Part 2: Average","detail":"BETWEEN 20000 AND 50000 → 3","ref":2},{"label":"Part 3: High","detail":"> 50000 → 3","ref":3},{"label":"Final output","detail":"UNION ALL → 3 rows","ref":"output"}],"takeaway":{"pattern":"A fixed list of categories that must all appear → one aggregate SELECT per category glued with UNION ALL, or LEFT JOIN a category list to the data.","asks":["Why doesn't GROUP BY CASE work? (A category with no rows produces no group, so it is missing instead of 0.)","UNION vs UNION ALL? (UNION removes duplicates, which costs a sort/hash; the rows here are always distinct, so UNION ALL is the right choice.)","How would this scale to 20 categories? (Put the categories with their min/max in a table or VALUES list, LEFT JOIN Accounts on the range and COUNT(a.account_id).)","What happens when Accounts is empty? (Each part still returns one row with 0 — three zero rows, which is correct.)"],"alternatives":["Conditional sums in one pass: `SELECT SUM(CASE WHEN income < 20000 THEN 1 ELSE 0 END) …` gives the three counts as columns; turning them into rows still needs UNION ALL or a VALUES join.","Category list + LEFT JOIN: `WITH cats(category) AS (VALUES ('Low Salary'), ('Average Salary'), ('High Salary'))` LEFT JOIN a CTE that labels each account with CASE, then `COUNT(labeled.account_id)` grouped by category."],"realworld":"Reports with fixed buckets that must always show: age bands, order-size tiers, SLA buckets (on time / late / very late), score ranges — an empty bucket must read 0, not vanish."},"mistakes":["Using `GROUP BY` on a CASE label — empty categories disappear.","Wrong band edges: `income < 50000` for Average or `income >= 50000` for High puts 50000 in the wrong band.","Using `COUNT(income)` and expecting NULL incomes to be counted — it skips NULLs (not an issue here, but `COUNT(*)` states the intent).","Misspelling a category string — the output must match 'Low Salary', 'Average Salary', 'High Salary' exactly."],"built":{"id":36,"inputs":[{"name":"Accounts","columns":["account_id","income"],"types":["integer","integer"],"rows":[[1,20000],[2,35500],[3,50000],[4,50001],[5,120000],[6,72000]]}],"visuals":[{"columns":["account_id","income","is_low","is_average","is_high"],"types":["integer","integer","boolean","boolean","boolean"],"rows":[[1,20000,false,true,false],[2,35500,false,true,false],[3,50000,false,true,false],[4,50001,false,false,true],[6,72000,false,false,true],[5,120000,false,false,true]]},{"columns":["category","accounts_count"],"types":["text","bigint"],"rows":[["Low Salary",0]]},{"columns":["category","accounts_count"],"types":["text","bigint"],"rows":[["Average Salary",3]]},{"columns":["category","accounts_count"],"types":["text","bigint"],"rows":[["High Salary",3]]},{"columns":["category","accounts_count"],"types":["text","bigint"],"rows":[["Average Salary",3],["High Salary",3]]}],"output":{"columns":["category","accounts_count"],"types":["text","bigint"],"rows":[["Low Salary",0],["Average Salary",3],["High Salary",3]]}}},{"id":37,"lc":1978,"slug":"employees-whose-manager-left-the-company","title":"Employees Whose Manager Left the Company","section":"Subqueries","difficulty":"Easy","concepts":["Subquery","NOT IN","NULL logic","WHERE"],"pattern":"\"Points to something that no longer exists\" → keep rows whose foreign key is NOT IN the list of existing keys.","statement":["A company stores its staff in one `Employees` table. Each row has the employee's id, name, salary and the id of their manager (`manager_id`). Top bosses have no manager, so their `manager_id` is `NULL`.","When a manager quits, their row is deleted — but the people who reported to them still carry the old `manager_id`. Find the employees who earn **strictly less than 30000** and whose manager **no longer exists** in the table."],"returns":"A single column `employee_id`, sorted by `employee_id` ascending.","setup":"CREATE TABLE Employees (\n  employee_id INT PRIMARY KEY,\n  name        VARCHAR(20),\n  manager_id  INT,\n  salary      INT\n);\n\nINSERT INTO Employees VALUES\n  (1,  'Ava',  NULL, 95000),\n  (2,  'Ben',  1,    48000),\n  (3,  'Cleo', 2,    26000),\n  (4,  'Dan',  7,    24000),\n  (5,  'Eli',  7,    52000),\n  (6,  'Fay',  8,    30000),\n  (9,  'Gus',  8,    21000),\n  (10, 'Hana', NULL, 18000);","tables":["Employees"],"table_notes":{"Employees":"Managers 7 and 8 have left — no row has employee_id 7 or 8, but Dan, Eli, Fay and Gus still point to them. Fay earns exactly 30000, and Hana has no manager at all (NULL)."},"solution":"SELECT employee_id\nFROM Employees\nWHERE salary < 30000\n  AND manager_id NOT IN (\n        SELECT employee_id\n        FROM Employees\n      )\nORDER BY employee_id;","official_ordered":true,"output_notes":["**4 (Dan)** — earns 24000 and his manager 7 is not in the table any more.","**9 (Gus)** — earns 21000 and his manager 8 has left.","Not returned: **Cleo** (manager 2 still exists), **Eli** (manager left, but 52000 is not < 30000), **Fay** (exactly 30000 is not *strictly* less), **Hana** (`manager_id` is NULL — she never had a manager, and `NULL NOT IN (…)` is NULL, so the row is dropped)."],"breakdown":[{"code":"SELECT employee_id\nFROM Employees","text":"We only need the ids of the matching employees."},{"code":"WHERE salary < 30000","text":"First condition: **strictly** less, so 30000 itself does not qualify (Fay)."},{"code":"AND manager_id NOT IN (\n      SELECT employee_id\n      FROM Employees\n    )","text":"The subquery returns every id that **still exists** (1, 2, 3, 4, 5, 6, 9, 10). A manager \"left\" exactly when the `manager_id` is not in that list. The subquery does not depend on the outer row, so PostgreSQL can compute it once."},{"code":"ORDER BY employee_id","text":"The problem asks for ascending ids."}],"exec_order":[{"stage":"FROM","code":"(subquery) SELECT employee_id FROM Employees","text":"Build the list of ids that still exist — 8 ids."},{"stage":"FROM","code":"Employees","text":"Read all 8 employees for the outer query."},{"stage":"WHERE","code":"salary < 30000 AND manager_id NOT IN (…)","text":"Keep rows where both conditions are TRUE. FALSE and NULL rows are dropped → 2 rows."},{"stage":"SELECT","code":"employee_id","text":"Return only the id column."},{"stage":"ORDER BY","code":"employee_id","text":"Sort ascending."}],"visuals":[{"kind":"subquery","title":"Step 1 — What the subquery returns: ids that still exist","diagram":"SELECT employee_id FROM Employees\n        │\n        ▼\n{ 1, 2, 3, 4, 5, 6, 9, 10 }     ← 7 and 8 are missing:\n                                   those managers left","sql":"SELECT employee_id\nFROM Employees\nORDER BY employee_id;","text":"Run on its own, the subquery is just the list of current employee ids. Ids **7** and **8** do not appear — those are the managers who left. `employee_id` is the primary key, so this list never contains NULL (that matters, see Step 3)."},{"kind":"filter","title":"Step 2 — Test both conditions on every row","diagram":"row ──▶ salary < 30000 ?      ──┐\nrow ──▶ manager_id NOT IN       ├── AND ──▶ kept only if TRUE\n        {1,2,3,4,5,6,9,10} ?  ──┘\n\nDan : 24000 ✓   7 not in list ✓   → TRUE  ✓\nFay : 30000 ✗   8 not in list ✓   → FALSE ✗\nHana: 18000 ✓   NULL NOT IN … = NULL → NULL ✗","sql":"SELECT employee_id, name, manager_id, salary,\n       salary < 30000 AS low_salary,\n       manager_id NOT IN (SELECT employee_id FROM Employees) AS manager_left,\n       salary < 30000\n         AND manager_id NOT IN (SELECT employee_id FROM Employees) AS kept\nFROM Employees\nORDER BY employee_id;","text":"Only **Dan (4)** and **Gus (9)** are TRUE in both columns. **Cleo**'s manager 2 is in the list, so `manager_left` is FALSE. **Hana** shows the third value: her `manager_id` is NULL, and comparing NULL with anything gives NULL (unknown), so `kept` is NULL and WHERE drops her — which is what we want, because she never had a manager."},{"kind":"filter","title":"Step 3 — The NOT IN trap: one NULL in the list breaks everything","diagram":"x NOT IN (a, b, c)   means   x <> a AND x <> b AND x <> c\n\n7 NOT IN (1, 2, 3)     → TRUE AND TRUE AND TRUE  = TRUE\n7 NOT IN (1, 2, NULL)  → TRUE AND TRUE AND NULL  = NULL  ✗\nNULL NOT IN (1, 2, 3)  → NULL AND NULL AND NULL  = NULL  ✗","sql":"SELECT 1 AS n, '7 NOT IN (1, 2, 3)' AS expression, 7 NOT IN (1, 2, 3) AS result\nUNION ALL\nSELECT 2, '7 NOT IN (1, 2, NULL)', 7 NOT IN (1, 2, NULL)\nUNION ALL\nSELECT 3, 'NULL NOT IN (1, 2, 3)', NULL NOT IN (1, 2, 3)\nORDER BY n;","text":"If the subquery ever returned a NULL, **every** `NOT IN` test would become NULL and the query would return nothing. Here it is safe because the subquery selects `employee_id`, the primary key, which is never NULL. If you ever write `NOT IN (SELECT some_nullable_column …)`, add `WHERE some_nullable_column IS NOT NULL` inside the subquery or use `NOT EXISTS`."}],"flow":[{"label":"Input table","detail":"Employees (8 rows) — managers 7 and 8 are gone","ref":"input"},{"label":"Subquery","detail":"ids that still exist → 8 ids","ref":0},{"label":"WHERE","detail":"salary < 30000 AND manager_id NOT IN list","ref":1},{"label":"NULL trap","detail":"why NOT IN needs a NULL-free list","ref":2},{"label":"Final output","detail":"employee_id 4 and 9, sorted","ref":"output"}],"takeaway":{"pattern":"\"The referenced row was deleted\" (orphan foreign keys) → `fk NOT IN (SELECT pk FROM parent)` or `LEFT JOIN parent … WHERE parent.pk IS NULL`.","asks":["What happens to employees with manager_id = NULL? (NULL NOT IN (…) is NULL, so they are excluded — correct, they never had a manager.)","What if the subquery could return NULL? (Every NOT IN becomes NULL/FALSE and you get an empty result. Filter NULLs out or use NOT EXISTS.)","How would you write it with a join? (LEFT JOIN Employees AS m ON m.employee_id = e.manager_id WHERE m.employee_id IS NULL AND e.manager_id IS NOT NULL AND e.salary < 30000.)"],"alternatives":["NOT EXISTS: `WHERE e.salary < 30000 AND e.manager_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM Employees AS m WHERE m.employee_id = e.manager_id)` — NULL-safe by design, but you must exclude NULL managers yourself.","Anti-join: `LEFT JOIN Employees AS m ON m.employee_id = e.manager_id` and keep rows where `m.employee_id IS NULL` (plus `e.manager_id IS NOT NULL`)."],"realworld":"Data-quality checks for orphaned records: orders whose customer was deleted, tickets assigned to removed users, files pointing to a deleted folder."},"mistakes":["Writing `salary <= 30000` — the problem says *strictly* less, so 30000 must be excluded.","Using NOT IN with a subquery that can return NULL (e.g. `SELECT manager_id FROM Employees`) — one NULL makes every test NULL and the result is empty.","Switching to NOT EXISTS or a LEFT JOIN anti-join and forgetting `manager_id IS NOT NULL` — then employees without a manager (Hana) would wrongly be reported as \"manager left\".","Forgetting `ORDER BY employee_id` — the problem asks for sorted output."],"built":{"id":37,"inputs":[{"name":"Employees","columns":["employee_id","name","manager_id","salary"],"types":["integer","character varying(20)","integer","integer"],"rows":[[1,"Ava",null,95000],[2,"Ben",1,48000],[3,"Cleo",2,26000],[4,"Dan",7,24000],[5,"Eli",7,52000],[6,"Fay",8,30000],[9,"Gus",8,21000],[10,"Hana",null,18000]]}],"visuals":[{"columns":["employee_id"],"types":["integer"],"rows":[[1],[2],[3],[4],[5],[6],[9],[10]]},{"columns":["employee_id","name","manager_id","salary","low_salary","manager_left","kept"],"types":["integer","character varying(20)","integer","integer","boolean","boolean","boolean"],"rows":[[1,"Ava",null,95000,false,null,false],[2,"Ben",1,48000,false,false,false],[3,"Cleo",2,26000,true,false,false],[4,"Dan",7,24000,true,true,true],[5,"Eli",7,52000,false,true,false],[6,"Fay",8,30000,false,true,false],[9,"Gus",8,21000,true,true,true],[10,"Hana",null,18000,true,null,null]]},{"columns":["n","expression","result"],"types":["integer","text","boolean"],"rows":[[1,"7 NOT IN (1, 2, 3)",true],[2,"7 NOT IN (1, 2, NULL)",null],[3,"NULL NOT IN (1, 2, 3)",null]]}],"output":{"columns":["employee_id"],"types":["integer"],"rows":[[4],[9]]}}},{"id":38,"lc":626,"slug":"exchange-seats","title":"Exchange Seats","section":"Subqueries","difficulty":"Medium","concepts":["CASE WHEN","Modulo %","Scalar subquery","MAX()","ORDER BY"],"pattern":"Swap neighbours by computing a new id with CASE: odd → id + 1, even → id − 1, and use a subquery for the special last row.","statement":["A classroom table `Seat` lists students with their seat `id`. The ids start at 1 and have no gaps (1, 2, 3, …).","Swap every two neighbouring students: the student in seat 1 moves to seat 2 and vice versa, seat 3 swaps with seat 4, and so on. If the number of students is odd, the **last** student has no partner and stays where they are."],"returns":"Columns `id` and `student` after the swap, sorted by `id` ascending.","setup":"CREATE TABLE Seat (\n  id      INT PRIMARY KEY,\n  student VARCHAR(255)\n);\n\nINSERT INTO Seat VALUES\n  (1, 'Ana'),\n  (2, 'Ben'),\n  (3, 'Cara'),\n  (4, 'Dev'),\n  (5, 'Emma'),\n  (6, 'Finn'),\n  (7, 'Gia');","tables":["Seat"],"table_notes":{"Seat":"7 students — an odd number, so Gia (seat 7) has no partner and must not move."},"solution":"SELECT CASE\n           WHEN id % 2 = 1 AND id = (SELECT MAX(id) FROM Seat) THEN id\n           WHEN id % 2 = 1 THEN id + 1\n           ELSE id - 1\n       END AS id,\n       student\nFROM Seat\nORDER BY id;","official_ordered":true,"output_notes":["**Seats 1–6**: each pair swapped — Ben now sits in 1 and Ana in 2, Dev in 3 and Cara in 4, Finn in 5 and Emma in 6.","**Seat 7 — Gia** stays put: 7 is odd **and** equals `MAX(id)`, so the first CASE branch keeps the id unchanged. Without that branch she would get id 8, a seat that does not exist."],"breakdown":[{"code":"(SELECT MAX(id) FROM Seat)","text":"A **scalar subquery**: it returns exactly one value, the last seat number (7). It can be used anywhere a single value is allowed, here inside the CASE."},{"code":"WHEN id % 2 = 1 AND id = (SELECT MAX(id) FROM Seat) THEN id","text":"`%` is the remainder: odd ids give 1. An odd id that is also the last id has no partner, so it keeps its id. This branch must come **first** — CASE stops at the first TRUE branch."},{"code":"WHEN id % 2 = 1 THEN id + 1","text":"Any other odd seat moves one step forward (1 → 2, 3 → 4, 5 → 6)."},{"code":"ELSE id - 1","text":"Even seats move one step back (2 → 1, 4 → 3, 6 → 5). An even last id always has its partner just before it, so it needs no special case."},{"code":"END AS id,\nstudent","text":"The new value is returned under the name `id`; the student name is unchanged."},{"code":"ORDER BY id","text":"When a name in ORDER BY matches an output column, PostgreSQL sorts by the **output** column — the new id. So the swapped rows come out in seat order."}],"exec_order":[{"stage":"FROM","code":"Seat","text":"Read the 7 seats."},{"stage":"SELECT","code":"CASE … (SELECT MAX(id) FROM Seat) … END AS id","text":"The scalar subquery gives 7; each row gets its new id."},{"stage":"ORDER BY","code":"id (the new id)","text":"Sort by the computed id."}],"visuals":[{"kind":"subquery","title":"Step 1 — What the subquery returns: the last seat","diagram":"SELECT MAX(id) FROM Seat\n        │\n        ▼\n     max_id = 7   (one row, one column → a scalar)","sql":"SELECT MAX(id) AS max_id\nFROM Seat\nORDER BY max_id;","text":"The subquery returns a single number: **7**. Because 7 is odd, the class has an unpaired student at the end. If there were 6 students, `MAX(id)` would be 6 (even) and the first CASE branch would never fire."},{"kind":"case","title":"Step 2 — CASE computes the new id for every row","diagram":"id % 2 = 1 AND id = 7 ? ── yes ──▶ keep id      (7 → 7)\n        │ no\n        ▼\nid % 2 = 1 ?            ── yes ──▶ id + 1       (1→2, 3→4, 5→6)\n        │ no\n        ▼\nELSE                    ─────────▶ id - 1       (2→1, 4→3, 6→5)","sql":"SELECT id,\n       student,\n       id % 2 AS id_mod_2,\n       (SELECT MAX(id) FROM Seat) AS max_id,\n       CASE\n           WHEN id % 2 = 1 AND id = (SELECT MAX(id) FROM Seat) THEN id\n           WHEN id % 2 = 1 THEN id + 1\n           ELSE id - 1\n       END AS new_id\nFROM Seat\nORDER BY id;","text":"Each row shows the old `id` and the `new_id` side by side. Odd seats 1, 3, 5 move forward, even seats 2, 4, 6 move back, and seat **7** (odd and equal to `max_id`) keeps 7. The student names never change — only the seat number attached to them."},{"kind":"order","title":"Step 3 — Sort by the new id","diagram":"new_id │ student   (old id)\n───────┼──────────────────\n   1   │ Ben        2\n   2   │ Ana        1\n   3   │ Dev        4\n   …   │ …\n   7   │ Gia        7","sql":"SELECT CASE\n           WHEN id % 2 = 1 AND id = (SELECT MAX(id) FROM Seat) THEN id\n           WHEN id % 2 = 1 THEN id + 1\n           ELSE id - 1\n       END AS new_id,\n       student,\n       id AS old_id\nFROM Seat\nORDER BY new_id;","text":"Sorting by the computed id puts every pair in swapped order: Ben (old 2) is now first, Ana (old 1) second. The final query returns just the new id (named `id`) and the student."}],"flow":[{"label":"Input table","detail":"Seat (7 rows, odd count)","ref":"input"},{"label":"Scalar subquery","detail":"MAX(id) = 7 → the unpaired last seat","ref":0},{"label":"CASE","detail":"odd → +1, even → −1, last odd → same","ref":1},{"label":"ORDER BY new id","detail":"rows in swapped seat order","ref":2},{"label":"Final output","detail":"id, student","ref":"output"}],"takeaway":{"pattern":"Pairwise swaps on a gap-free sequence → compute a new key with CASE on `id % 2`, guard the edge row with a scalar subquery, then sort by the new key.","asks":["What if there is only one student? (MAX(id) = 1, odd → first branch keeps id 1.)","What if the count is even? (The first branch never matches; every pair swaps.)","Why must the \"last odd seat\" branch come first? (CASE returns the first TRUE branch; otherwise `id % 2 = 1` would catch seat 7 and send it to 8.)","Can you do it without a subquery? (Yes: `COUNT(*) OVER ()` gives the total, or use LEAD/LAG — see alternatives.)"],"alternatives":["Window functions: `CASE WHEN id % 2 = 1 THEN COALESCE(LEAD(student) OVER (ORDER BY id), student) ELSE LAG(student) OVER (ORDER BY id) END AS student` keeps the ids and swaps the names instead.","Replace the subquery with `COUNT(*) OVER ()` in a CTE and compare `id = total` — same idea, one table scan."],"realworld":"Re-pairing items in a fixed sequence: swapping adjacent slots in a schedule, pairing players for a round, flipping adjacent list positions."},"mistakes":["Forgetting the odd-count case — the last student gets an id that does not exist (8).","Putting `WHEN id % 2 = 1 THEN id + 1` before the last-seat check — CASE stops at the first match, so the guard never runs.","Ordering by the **old** id (e.g. `ORDER BY Seat.id`) — the swapped rows come out in the original order.","Assuming `MAX(id)` equals `COUNT(*)` on real data with gaps — this problem guarantees no gaps, but in general use MAX for \"last\"."],"built":{"id":38,"inputs":[{"name":"Seat","columns":["id","student"],"types":["integer","character varying(255)"],"rows":[[1,"Ana"],[2,"Ben"],[3,"Cara"],[4,"Dev"],[5,"Emma"],[6,"Finn"],[7,"Gia"]]}],"visuals":[{"columns":["max_id"],"types":["integer"],"rows":[[7]]},{"columns":["id","student","id_mod_2","max_id","new_id"],"types":["integer","character varying(255)","integer","integer","integer"],"rows":[[1,"Ana",1,7,2],[2,"Ben",0,7,1],[3,"Cara",1,7,4],[4,"Dev",0,7,3],[5,"Emma",1,7,6],[6,"Finn",0,7,5],[7,"Gia",1,7,7]]},{"columns":["new_id","student","old_id"],"types":["integer","character varying(255)","integer"],"rows":[[1,"Ben",2],[2,"Ana",1],[3,"Dev",4],[4,"Cara",3],[5,"Finn",6],[6,"Emma",5],[7,"Gia",7]]}],"output":{"columns":["id","student"],"types":["integer","character varying(255)"],"rows":[[1,"Ben"],[2,"Ana"],[3,"Dev"],[4,"Cara"],[5,"Finn"],[6,"Emma"],[7,"Gia"]]}}},{"id":39,"lc":1341,"slug":"movie-rating","title":"Movie Rating","section":"Subqueries","difficulty":"Medium","concepts":["UNION ALL","GROUP BY","ORDER BY … LIMIT 1","Date range","Tie-break"],"pattern":"Two independent \"top-1\" questions → answer each in its own parenthesised (ORDER BY … LIMIT 1) query, then stack them with UNION ALL.","statement":["A movie site has three tables: `Movies` (id and title), `Users` (id and name) and `MovieRating`, where each row is one user's rating (1–5) of one movie, with the date it was written (`created_at`). A user rates a given movie at most once.","Answer two questions: (1) Which **user** has rated the most movies? (2) Which **movie** has the highest **average rating in February 2020**? In both cases, if there is a tie, pick the alphabetically smaller name/title."],"returns":"One column `results` with exactly two rows: the user's name first, then the movie title.","setup":"CREATE TABLE Movies (\n  movie_id INT PRIMARY KEY,\n  title    VARCHAR(30)\n);\nCREATE TABLE Users (\n  user_id INT PRIMARY KEY,\n  name    VARCHAR(30)\n);\nCREATE TABLE MovieRating (\n  movie_id   INT,\n  user_id    INT,\n  rating     INT,\n  created_at DATE,\n  PRIMARY KEY (movie_id, user_id)\n);\n\nINSERT INTO Movies VALUES (1, 'Parasite'), (2, 'Dune'), (3, 'Coco'), (4, 'Up');\nINSERT INTO Users  VALUES (1, 'Liam'), (2, 'Emma'), (3, 'Noah'), (4, 'Olivia');\nINSERT INTO MovieRating VALUES\n  (1, 1, 5, '2020-01-31'),\n  (1, 2, 3, '2020-02-10'),\n  (2, 1, 4, '2020-02-01'),\n  (2, 2, 4, '2020-02-14'),\n  (3, 2, 3, '2020-02-20'),\n  (3, 3, 5, '2020-02-29'),\n  (4, 1, 5, '2020-03-01'),\n  (4, 3, 4, '2020-02-05'),\n  (4, 4, 4, '2020-02-18');","tables":["Movies","Users","MovieRating"],"table_notes":{"MovieRating":"Look at the edges of February: 2020-01-31 and 2020-03-01 must be ignored, while 2020-02-01 and 2020-02-29 (2020 is a leap year) must be counted."},"solution":"(\n    SELECT u.name AS results\n    FROM MovieRating AS mr\n    INNER JOIN Users AS u\n            ON u.user_id = mr.user_id\n    GROUP BY u.user_id, u.name\n    ORDER BY COUNT(*) DESC, u.name\n    LIMIT 1\n)\nUNION ALL\n(\n    SELECT m.title AS results\n    FROM MovieRating AS mr\n    INNER JOIN Movies AS m\n            ON m.movie_id = mr.movie_id\n    WHERE mr.created_at >= DATE '2020-02-01'\n      AND mr.created_at <  DATE '2020-03-01'\n    GROUP BY m.movie_id, m.title\n    ORDER BY AVG(mr.rating) DESC, m.title\n    LIMIT 1\n);","output_notes":["**Emma** — Emma and Liam both rated 3 movies; the tie is broken alphabetically and \"Emma\" < \"Liam\".","**Coco** — Coco, Dune and Up all average **4.00** in February 2020; \"Coco\" is alphabetically first. Coco's 5 on **2020-02-29** counts (without it Coco would average 3 and Dune would win). Up's 5 on **2020-03-01** does not count (with it Up would average 4.33 and win)."],"breakdown":[{"code":"(\n    SELECT u.name AS results\n    FROM MovieRating AS mr\n    INNER JOIN Users AS u\n            ON u.user_id = mr.user_id","text":"Part 1: attach the user's name to every rating."},{"code":"    GROUP BY u.user_id, u.name","text":"One group per user. `COUNT(*)` in a group = how many movies that user rated (each user rates a movie at most once)."},{"code":"    ORDER BY COUNT(*) DESC, u.name\n    LIMIT 1\n)","text":"Most ratings first; ties broken by name A → Z. `LIMIT 1` keeps the winner. The **parentheses are required**: without them, ORDER BY/LIMIT would apply to the whole UNION instead of this part."},{"code":"UNION ALL","text":"Stack the two one-row results. `UNION ALL` keeps both rows even if a user's name happened to equal a movie title — plain `UNION` would collapse them into one row."},{"code":"(\n    SELECT m.title AS results\n    FROM MovieRating AS mr\n    INNER JOIN Movies AS m\n            ON m.movie_id = mr.movie_id","text":"Part 2: attach the movie title to every rating."},{"code":"    WHERE mr.created_at >= DATE '2020-02-01'\n      AND mr.created_at <  DATE '2020-03-01'","text":"February 2020 as a **half-open range**: from Feb 1 inclusive up to (but not including) Mar 1. This automatically includes Feb 29 and never depends on how many days the month has."},{"code":"    GROUP BY m.movie_id, m.title\n    ORDER BY AVG(mr.rating) DESC, m.title\n    LIMIT 1\n)","text":"Average rating per movie, highest first, ties by title A → Z, keep one. `AVG` of an INT column returns NUMERIC in PostgreSQL, so 3.5 is not truncated to 3."}],"exec_order":[{"stage":"FROM","code":"part 1: MovieRating mr","text":"All 9 ratings."},{"stage":"JOIN / ON","code":"part 1: JOIN Users u","text":"Add the user name to each rating."},{"stage":"GROUP BY","code":"part 1: u.user_id, u.name","text":"4 groups, one per user."},{"stage":"ORDER BY","code":"part 1: COUNT(*) DESC, u.name","text":"Emma (3), Liam (3), Noah (2), Olivia (1)."},{"stage":"LIMIT","code":"part 1: LIMIT 1","text":"Keep Emma."},{"stage":"FROM","code":"part 2: MovieRating mr JOIN Movies m","text":"All 9 ratings with their titles."},{"stage":"WHERE","code":"part 2: created_at in [2020-02-01, 2020-03-01)","text":"7 ratings remain."},{"stage":"GROUP BY","code":"part 2: m.movie_id, m.title","text":"4 groups, one per movie."},{"stage":"ORDER BY","code":"part 2: AVG(rating) DESC, m.title","text":"Coco 4, Dune 4, Up 4, Parasite 3."},{"stage":"LIMIT","code":"part 2: LIMIT 1","text":"Keep Coco; UNION ALL then stacks Emma and Coco."}],"visuals":[{"kind":"subquery","title":"Step 1 — Part 1 on its own: movies rated per user","diagram":"MovieRating ──JOIN──▶ Users        (mr.user_id = u.user_id)\n      │\n      ▼  GROUP BY user\nEmma   ├─ Parasite ├─ Dune ├─ Coco   → 3\nLiam   ├─ Parasite ├─ Dune ├─ Up     → 3\nNoah   ├─ Coco     └─ Up             → 2\nOlivia └─ Up                         → 1\n      │\n      ▼  ORDER BY count DESC, name   → LIMIT 1 → Emma","sql":"SELECT u.name,\n       COUNT(*) AS movies_rated\nFROM MovieRating AS mr\nINNER JOIN Users AS u\n        ON u.user_id = mr.user_id\nGROUP BY u.user_id, u.name\nORDER BY movies_rated DESC, u.name;","text":"This is part 1 **without** `LIMIT 1`, so you can see the full ranking. Emma and Liam tie at 3 ratings; the second sort key `u.name` puts **Emma** first, and `LIMIT 1` keeps only her. Note that this part ignores dates — all ratings count."},{"kind":"filter","title":"Step 2 — Part 2: keep only ratings from February 2020","diagram":"created_at >= '2020-02-01'  AND  created_at < '2020-03-01'\n\n2020-01-31 ✗ │ 2020-02-01 ✓ … 2020-02-29 ✓ │ 2020-03-01 ✗\n─────────────┼──────────────────────────────┼─────────────\n   January   │         February             │   March","sql":"SELECT m.title,\n       mr.rating,\n       mr.created_at,\n       mr.created_at >= DATE '2020-02-01'\n         AND mr.created_at < DATE '2020-03-01' AS in_feb_2020\nFROM MovieRating AS mr\nINNER JOIN Movies AS m\n        ON m.movie_id = mr.movie_id\nORDER BY mr.created_at;","text":"The first and last rows sit just outside February and are dropped: Parasite's 5 from **Jan 31** and Up's 5 from **Mar 1**. Both boundary days inside the month — **Feb 1** and the leap day **Feb 29** — are kept. 7 of the 9 ratings remain."},{"kind":"group","title":"Step 3 — Part 2 on its own: February average per movie","diagram":"Coco     ├─ 3 └─ 5    → avg 4.00\nDune     ├─ 4 └─ 4    → avg 4.00\nUp       ├─ 4 └─ 4    → avg 4.00   (Mar 1 rating excluded)\nParasite └─ 3         → avg 3.00   (Jan 31 rating excluded)\n      │\n      ▼  ORDER BY avg DESC, title → LIMIT 1 → Coco","sql":"SELECT m.title,\n       COUNT(*) AS feb_ratings,\n       ROUND(AVG(mr.rating), 2) AS avg_rating\nFROM MovieRating AS mr\nINNER JOIN Movies AS m\n        ON m.movie_id = mr.movie_id\nWHERE mr.created_at >= DATE '2020-02-01'\n  AND mr.created_at <  DATE '2020-03-01'\nGROUP BY m.movie_id, m.title\nORDER BY avg_rating DESC, m.title;","text":"Three movies tie at **4.00**. The tie-break `m.title` puts **Coco** first. This shows why both date boundaries matter: dropping Feb 29 would lower Coco to 3.00, and including Mar 1 would lift Up to 4.33."},{"kind":"union","title":"Step 4 — UNION ALL stacks the two one-row answers","diagram":"( part 1 … LIMIT 1 )   →  Emma\n        │\n    UNION ALL\n        │\n( part 2 … LIMIT 1 )   →  Coco\n        ▼\nresults: Emma, Coco","sql":"(\n    SELECT 1 AS part, 'user with most ratings' AS question, u.name AS results\n    FROM MovieRating AS mr\n    INNER JOIN Users AS u\n            ON u.user_id = mr.user_id\n    GROUP BY u.user_id, u.name\n    ORDER BY COUNT(*) DESC, u.name\n    LIMIT 1\n)\nUNION ALL\n(\n    SELECT 2, 'best Feb 2020 average', m.title\n    FROM MovieRating AS mr\n    INNER JOIN Movies AS m\n            ON m.movie_id = mr.movie_id\n    WHERE mr.created_at >= DATE '2020-02-01'\n      AND mr.created_at <  DATE '2020-03-01'\n    GROUP BY m.movie_id, m.title\n    ORDER BY AVG(mr.rating) DESC, m.title\n    LIMIT 1\n)\nORDER BY part;","text":"Each parenthesised part is a complete query with its own ORDER BY and LIMIT. UNION ALL needs both parts to have the same number of columns with compatible types — here one text column, named by the first part (`results`). The helper columns `part` and `question` are only for this display."}],"flow":[{"label":"Input tables","detail":"Movies (4) · Users (4) · MovieRating (9)","ref":"input"},{"label":"Part 1: count per user","detail":"Emma 3, Liam 3 → tie → Emma","ref":0},{"label":"Part 2: February filter","detail":"half-open date range → 7 ratings","ref":1},{"label":"Part 2: average per movie","detail":"three-way tie at 4.00 → Coco","ref":2},{"label":"UNION ALL","detail":"stack the two winners","ref":3},{"label":"Final output","detail":"results: Emma, Coco","ref":"output"}],"takeaway":{"pattern":"Several unrelated single answers in one result → write each as its own `(SELECT … ORDER BY … LIMIT 1)` and combine with UNION ALL.","asks":["Why UNION ALL and not UNION? (UNION removes duplicates; if a user were named like a movie, you would get one row instead of two. UNION ALL also skips the extra de-duplication work.)","Why the parentheses? (Without them ORDER BY and LIMIT bind to the whole UNION, which is a syntax/logic error here.)","Why not `created_at BETWEEN '2020-02-01' AND '2020-02-29'`? (It works for a DATE column, but breaks if the column becomes a TIMESTAMP — Feb 29 at 10:00 is after '2020-02-29 00:00'. The half-open range is always safe.)","Are the two rows guaranteed to come out in that order? (In practice PostgreSQL appends the second part after the first; to be strict, add a sort key column as in Step 4.)"],"alternatives":["Write each part as a CTE (`top_user`, `top_movie`) and `SELECT results FROM top_user UNION ALL SELECT results FROM top_movie` — easier to read for some interviewers.","Use `EXTRACT(YEAR FROM created_at) = 2020 AND EXTRACT(MONTH FROM created_at) = 2` or `TO_CHAR(created_at, 'YYYY-MM') = '2020-02'` — correct, but it cannot use an index on `created_at`."],"realworld":"Summary dashboards that show a few headline facts side by side: \"top customer\" and \"best-selling product this month\" in one small result set."},"mistakes":["Applying the February filter to part 1 as well — the user count is over **all** ratings.","Using `created_at <= '2020-02-28'` or `< '2020-02-29'` — 2020 is a leap year, so Feb 29 is lost.","Using `created_at <= '2020-03-01'` / `BETWEEN '2020-02-01' AND '2020-03-01'` — March 1 is wrongly included.","Forgetting the tie-break (`u.name`, `m.title`) in ORDER BY — the winner of a tie becomes random.","Omitting the parentheses around each part — ORDER BY/LIMIT cannot be attached to an inner part of a UNION without them.","Using UNION instead of UNION ALL — if both answers are the same string, one row disappears."],"built":{"id":39,"inputs":[{"name":"Movies","columns":["movie_id","title"],"types":["integer","character varying(30)"],"rows":[[1,"Parasite"],[2,"Dune"],[3,"Coco"],[4,"Up"]]},{"name":"Users","columns":["user_id","name"],"types":["integer","character varying(30)"],"rows":[[1,"Liam"],[2,"Emma"],[3,"Noah"],[4,"Olivia"]]},{"name":"MovieRating","columns":["movie_id","user_id","rating","created_at"],"types":["integer","integer","integer","date"],"rows":[[1,1,5,"2020-01-31"],[1,2,3,"2020-02-10"],[2,1,4,"2020-02-01"],[2,2,4,"2020-02-14"],[3,2,3,"2020-02-20"],[3,3,5,"2020-02-29"],[4,1,5,"2020-03-01"],[4,3,4,"2020-02-05"],[4,4,4,"2020-02-18"]]}],"visuals":[{"columns":["name","movies_rated"],"types":["character varying(30)","bigint"],"rows":[["Emma",3],["Liam",3],["Noah",2],["Olivia",1]]},{"columns":["title","rating","created_at","in_feb_2020"],"types":["character varying(30)","integer","date","boolean"],"rows":[["Parasite",5,"2020-01-31",false],["Dune",4,"2020-02-01",true],["Up",4,"2020-02-05",true],["Parasite",3,"2020-02-10",true],["Dune",4,"2020-02-14",true],["Up",4,"2020-02-18",true],["Coco",3,"2020-02-20",true],["Coco",5,"2020-02-29",true],["Up",5,"2020-03-01",false]]},{"columns":["title","feb_ratings","avg_rating"],"types":["character varying(30)","bigint","numeric"],"rows":[["Coco",2,"4.00"],["Dune",2,"4.00"],["Up",2,"4.00"],["Parasite",1,"3.00"]]},{"columns":["part","question","results"],"types":["integer","text","character varying(30)"],"rows":[[1,"user with most ratings","Emma"],[2,"best Feb 2020 average","Coco"]]}],"output":{"columns":["results"],"types":["character varying(30)"],"rows":[["Emma"],["Coco"]]}}},{"id":40,"lc":1321,"slug":"restaurant-growth","title":"Restaurant Growth","section":"Subqueries","difficulty":"Medium","concepts":["CTE","SUM() OVER","ROWS BETWEEN 6 PRECEDING","Moving average","Scalar subquery","ROUND(numeric)"],"pattern":"Moving window over days → aggregate to one row per day first, then SUM() OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW), then drop days whose window is not full yet.","statement":["A restaurant logs every customer payment in `Customer`: who paid, on which day (`visited_on`) and how much (`amount`). Several customers can pay on the same day, and the restaurant has at least one customer every day.","For each day, report the **total** paid over a 7-day window (that day plus the 6 days before it) and the **average per day** over that window, rounded to 2 decimals. Only days that have a full 7-day window behind them should appear — so the first 6 days are skipped."],"returns":"Columns `visited_on`, `amount` (7-day total) and `average_amount` (7-day total / 7, rounded to 2 decimals), sorted by `visited_on` ascending.","setup":"CREATE TABLE Customer (\n  customer_id INT,\n  name        VARCHAR(20),\n  visited_on  DATE,\n  amount      INT,\n  PRIMARY KEY (customer_id, visited_on)\n);\n\nINSERT INTO Customer VALUES\n  (1, 'Ava',  '2024-03-01',  40),\n  (2, 'Ben',  '2024-03-01',  60),\n  (3, 'Cleo', '2024-03-02',  80),\n  (4, 'Dan',  '2024-03-03', 120),\n  (1, 'Ava',  '2024-03-04',  50),\n  (5, 'Eve',  '2024-03-04',  70),\n  (6, 'Finn', '2024-03-05',  90),\n  (2, 'Ben',  '2024-03-06', 110),\n  (7, 'Gia',  '2024-03-07', 100),\n  (3, 'Cleo', '2024-03-08',  60),\n  (8, 'Hal',  '2024-03-08',  80),\n  (4, 'Dan',  '2024-03-09', 130);","tables":["Customer"],"table_notes":{"Customer":"Three days (Mar 1, Mar 4, Mar 8) have two payments each — they must be added up into one daily total before the 7-day window runs."},"solution":"WITH daily AS (\n    SELECT visited_on,\n           SUM(amount) AS amount\n    FROM Customer\n    GROUP BY visited_on\n),\nmoving AS (\n    SELECT visited_on,\n           SUM(amount) OVER (\n               ORDER BY visited_on\n               ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\n           ) AS amount\n    FROM daily\n)\nSELECT visited_on,\n       amount,\n       ROUND(amount / 7.0, 2) AS average_amount\nFROM moving\nWHERE visited_on >= (SELECT MIN(visited_on) FROM Customer) + 6\nORDER BY visited_on;","official_ordered":true,"output_notes":["**2024-03-07** — window Mar 1 … Mar 7: 100 + 80 + 120 + 120 + 90 + 110 + 100 = **720**, 720 / 7 = **102.86**. This is the first day with 7 days behind it.","**2024-03-08** — the window slides by one day: Mar 1 (100) leaves, Mar 8 (140) enters → 760, average **108.57**.","**2024-03-09** — Mar 2 (80) leaves, Mar 9 (130) enters → 810, average **115.71**.","**Mar 1 – Mar 6** are not returned: their windows contain fewer than 7 days."],"breakdown":[{"code":"WITH daily AS (\n    SELECT visited_on,\n           SUM(amount) AS amount\n    FROM Customer\n    GROUP BY visited_on\n)","text":"One row per **day**. The window below counts rows, so each row must be a whole day — otherwise Mar 1's two payments would use up two of the seven window slots."},{"code":"moving AS (\n    SELECT visited_on,\n           SUM(amount) OVER (\n               ORDER BY visited_on\n               ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\n           ) AS amount\n    FROM daily\n)","text":"For every day, add up the current row and the 6 rows before it (in date order). Every day has a row (guaranteed by the problem), so 7 rows = 7 calendar days. Early days simply have a shorter window."},{"code":"SELECT visited_on,\n       amount,\n       ROUND(amount / 7.0, 2) AS average_amount","text":"Divide by `7.0`, not `7`: the sum is an integer, and `720 / 7` would be integer division (102). `7.0` makes the result NUMERIC, which is also what `ROUND(x, 2)` needs in PostgreSQL."},{"code":"FROM moving\nWHERE visited_on >= (SELECT MIN(visited_on) FROM Customer) + 6","text":"The scalar subquery returns the first day (Mar 1); `+ 6` on a DATE adds 6 days → Mar 7, the first day with a full window. This filter must run **after** the window is computed — that is why it sits in the outer query, not inside `moving`."},{"code":"ORDER BY visited_on","text":"The problem asks for ascending dates."}],"exec_order":[{"stage":"FROM","code":"daily: FROM Customer","text":"Read all 12 payments."},{"stage":"GROUP BY","code":"daily: GROUP BY visited_on","text":"9 days, one total each."},{"stage":"FROM","code":"moving: FROM daily","text":"9 daily rows."},{"stage":"WINDOW","code":"moving: SUM(amount) OVER (ORDER BY visited_on ROWS 6 PRECEDING)","text":"Rolling 7-row total for every day."},{"stage":"FROM","code":"FROM moving","text":"9 rows with rolling totals."},{"stage":"WHERE","code":"visited_on >= (SELECT MIN(visited_on) FROM Customer) + 6","text":"Subquery gives Mar 1 → keep Mar 7 onward → 3 rows."},{"stage":"SELECT","code":"ROUND(amount / 7.0, 2)","text":"Compute the average."},{"stage":"ORDER BY","code":"visited_on","text":"Sort by date."}],"visuals":[{"kind":"cte","title":"Step 1 — CTE daily: one total per day","diagram":"Customer (12 payments) ──▶ daily (9 days) ──▶ moving ──▶ final\n\n2024-03-01 ├─ 40\n           └─ 60   → 100\n2024-03-02 └─ 80   →  80\n2024-03-04 ├─ 50\n           └─ 70   → 120\n2024-03-08 ├─ 60\n           └─ 80   → 140\n…","sql":"SELECT visited_on,\n       SUM(amount) AS amount\nFROM Customer\nGROUP BY visited_on\nORDER BY visited_on;","text":"The 12 payments collapse into **9 daily totals**. This step matters because the next one uses `ROWS`, which counts rows: with the raw table, Mar 1 would take two of the seven slots and the window would cover fewer than 7 days."},{"kind":"window","title":"Step 2 — CTE moving: rolling 7-day total","diagram":"day:    01  02  03  04  05  06  07  08  09\ntotal: 100  80 120 120  90 110 100 140 130\n       └──────── window for 03-07 ───────┘          = 720\n           └──────── window for 03-08 ───────┘      = 760\n               └──────── window for 03-09 ───────┘  = 810\n\nROWS BETWEEN 6 PRECEDING AND CURRENT ROW = this row + 6 rows before","sql":"WITH daily AS (\n    SELECT visited_on,\n           SUM(amount) AS amount\n    FROM Customer\n    GROUP BY visited_on\n)\nSELECT visited_on,\n       amount AS day_total,\n       MIN(visited_on) OVER w AS window_start,\n       COUNT(*)        OVER w AS days_in_window,\n       SUM(amount)     OVER w AS window_sum\nFROM daily\nWINDOW w AS (ORDER BY visited_on\n             ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)\nORDER BY visited_on;","text":"The extra columns show each row's frame. On Mar 3 the window holds only 3 days (Mar 1–3, sum 300) because there is nothing earlier. From **Mar 7** on, `days_in_window` is 7 and the window slides: each new day enters and the oldest one leaves (Mar 8 = 720 − 100 + 140 = 760)."},{"kind":"subquery","title":"Step 3 — What the subquery returns: the first day","diagram":"SELECT MIN(visited_on) FROM Customer   →  2024-03-01\n                                  + 6  →  2024-03-07\n                                          (first full window)","sql":"SELECT MIN(visited_on)     AS first_day,\n       MIN(visited_on) + 6 AS first_full_window_day\nFROM Customer\nORDER BY first_day;","text":"The subquery returns one value, **2024-03-01**. In PostgreSQL `date + integer` adds whole days, so `+ 6` gives **2024-03-07**: the first day whose window covers Mar 1 … Mar 7."},{"kind":"filter","title":"Step 4 — Keep full windows and compute the average","diagram":"visited_on >= 2024-03-07 ?\n\n03-01 … 03-06  ✗  (window shorter than 7 days)\n03-07          ✓  720 / 7.0 = 102.857… → 102.86\n03-08          ✓  760 / 7.0 = 108.571… → 108.57\n03-09          ✓  810 / 7.0 = 115.714… → 115.71","sql":"WITH daily AS (\n    SELECT visited_on,\n           SUM(amount) AS amount\n    FROM Customer\n    GROUP BY visited_on\n),\nmoving AS (\n    SELECT visited_on,\n           SUM(amount) OVER (\n               ORDER BY visited_on\n               ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\n           ) AS amount\n    FROM daily\n)\nSELECT visited_on,\n       amount,\n       visited_on >= (SELECT MIN(visited_on) FROM Customer) + 6 AS kept,\n       ROUND(amount / 7.0, 2) AS average_amount\nFROM moving\nORDER BY visited_on;","text":"Only Mar 7, 8 and 9 have `kept = TRUE`. Their `amount` is the full 7-day total, and the average divides by 7.0. The early rows have partial sums (e.g. Mar 3 = 300) that must never be reported, so they are filtered out."}],"flow":[{"label":"Input table","detail":"Customer (12 payments, 9 days)","ref":"input"},{"label":"CTE daily","detail":"GROUP BY day → 9 daily totals","ref":0},{"label":"CTE moving","detail":"SUM() OVER 7-row frame","ref":1},{"label":"Subquery","detail":"first day + 6 = 2024-03-07","ref":2},{"label":"Filter + average","detail":"keep full windows, total / 7.0","ref":3},{"label":"Final output","detail":"3 days, sorted by date","ref":"output"}],"takeaway":{"pattern":"Rolling N-day metrics → one row per day, then `SUM/AVG() OVER (ORDER BY day ROWS BETWEEN N-1 PRECEDING AND CURRENT ROW)`, then filter out days without a full window in an outer query.","asks":["Why aggregate per day first? (ROWS counts rows, not days. Two payments on one day would take two slots.)","What if some days had no customers? (ROWS would span more than 7 calendar days. Use `RANGE BETWEEN INTERVAL '6 days' PRECEDING AND CURRENT ROW`, or join to a generated calendar.)","Why not filter with WHERE inside the `moving` CTE? (WHERE runs before window functions, so removing early days would also remove them from later windows.)","Could you use `AVG(amount) OVER (…)` instead of `amount / 7.0`? (Yes — on daily rows with a full 7-row window they are equal. Dividing the sum we already have by 7.0 is simpler and matches the definition.)"],"alternatives":["Self-join: join `daily` d1 to `daily` d2 ON d2.visited_on BETWEEN d1.visited_on - 6 AND d1.visited_on, GROUP BY d1.visited_on, and keep groups with COUNT(*) = 7 — works on any SQL dialect, but is slower.","Use `ROW_NUMBER() OVER (ORDER BY visited_on) >= 7` instead of the MIN subquery to skip the first 6 days — fine because every day is present."],"realworld":"7-day rolling revenue, weekly active users, smoothed daily sign-ups — any dashboard line that hides day-to-day noise."},"mistakes":["Running the window on the raw `Customer` table — days with several payments break the 7-row = 7-day assumption.","Dividing by `7` instead of `7.0` — integer division truncates 720 / 7 to 102.","Calling `ROUND(double precision, 2)` — that function does not exist in PostgreSQL; keep the value NUMERIC (as `7.0` does) or cast with `::NUMERIC`.","Filtering the first 6 days in the same SELECT/CTE as the window — WHERE is applied before the window, so later sums lose those days.","Forgetting to drop the first 6 days — their partial sums would be reported as if they were 7-day totals."],"built":{"id":40,"inputs":[{"name":"Customer","columns":["customer_id","name","visited_on","amount"],"types":["integer","character varying(20)","date","integer"],"rows":[[1,"Ava","2024-03-01",40],[2,"Ben","2024-03-01",60],[3,"Cleo","2024-03-02",80],[4,"Dan","2024-03-03",120],[1,"Ava","2024-03-04",50],[5,"Eve","2024-03-04",70],[6,"Finn","2024-03-05",90],[2,"Ben","2024-03-06",110],[7,"Gia","2024-03-07",100],[3,"Cleo","2024-03-08",60],[8,"Hal","2024-03-08",80],[4,"Dan","2024-03-09",130]]}],"visuals":[{"columns":["visited_on","amount"],"types":["date","bigint"],"rows":[["2024-03-01",100],["2024-03-02",80],["2024-03-03",120],["2024-03-04",120],["2024-03-05",90],["2024-03-06",110],["2024-03-07",100],["2024-03-08",140],["2024-03-09",130]]},{"columns":["visited_on","day_total","window_start","days_in_window","window_sum"],"types":["date","bigint","date","bigint","numeric"],"rows":[["2024-03-01",100,"2024-03-01",1,100],["2024-03-02",80,"2024-03-01",2,180],["2024-03-03",120,"2024-03-01",3,300],["2024-03-04",120,"2024-03-01",4,420],["2024-03-05",90,"2024-03-01",5,510],["2024-03-06",110,"2024-03-01",6,620],["2024-03-07",100,"2024-03-01",7,720],["2024-03-08",140,"2024-03-02",7,760],["2024-03-09",130,"2024-03-03",7,810]]},{"columns":["first_day","first_full_window_day"],"types":["date","date"],"rows":[["2024-03-01","2024-03-07"]]},{"columns":["visited_on","amount","kept","average_amount"],"types":["date","numeric","boolean","numeric"],"rows":[["2024-03-01",100,false,"14.29"],["2024-03-02",180,false,"25.71"],["2024-03-03",300,false,"42.86"],["2024-03-04",420,false,"60.00"],["2024-03-05",510,false,"72.86"],["2024-03-06",620,false,"88.57"],["2024-03-07",720,true,"102.86"],["2024-03-08",760,true,"108.57"],["2024-03-09",810,true,"115.71"]]}],"output":{"columns":["visited_on","amount","average_amount"],"types":["date","numeric","numeric"],"rows":[["2024-03-07",720,"102.86"],["2024-03-08",760,"108.57"],["2024-03-09",810,"115.71"]]}}},{"id":41,"lc":602,"slug":"friend-requests-ii-who-has-the-most-friends","title":"Friend Requests II: Who Has the Most Friends","section":"Subqueries","difficulty":"Medium","concepts":["UNION ALL","CTE","GROUP BY","COUNT(*)","Subquery with MAX()"],"pattern":"A relationship stored in two columns → UNION ALL both columns into one list of ids, then GROUP BY and COUNT.","statement":["A social network stores every **accepted** friend request in `RequestAccepted`: who sent it (`requester_id`), who accepted it (`accepter_id`) and when. Once accepted, the two people are friends — it does not matter who sent the request.","Find the person with the **most friends** and how man
