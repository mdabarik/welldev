uct appears here, including the ones that never sold."},{"code":"LEFT JOIN UnitsSold AS u\n  ON u.product_id = p.product_id\n AND u.purchase_date BETWEEN p.start_date AND p.end_date","text":"Attach each sale to the price period it belongs to. Both conditions live in **ON** so a period without sales is kept with NULLs. `BETWEEN` is inclusive on both ends, so a sale on `end_date` still matches."},{"code":"GROUP BY p.product_id","text":"Collapse all periods and sales of one product into one row."},{"code":"SUM(p.price * u.units)","text":"Total revenue of the product: each sale's units times the price of its period."},{"code":"* 1.0 / SUM(u.units)","text":"Divide by total units → weighted average. Both sums are integers, and **integer division truncates** in PostgreSQL (74 / 7 = 10). Multiplying by `1.0` first turns the value into NUMERIC, so we get 10.571…"},{"code":"ROUND(…, 2)","text":"Round to 2 decimals. PostgreSQL's `ROUND(x, 2)` exists only for NUMERIC — the `* 1.0` already made the value NUMERIC, so this works."},{"code":"COALESCE(…, 0) AS average_price","text":"For a product without sales both sums are NULL, so the whole expression is NULL. COALESCE replaces it with 0 as the problem requires."}],"exec_order":[{"stage":"FROM","code":"Prices p","text":"4 price periods."},{"stage":"JOIN / ON","code":"LEFT JOIN UnitsSold u ON product AND date in period","text":"Each period gets its sales; periods without sales keep NULLs → 5 rows."},{"stage":"GROUP BY","code":"p.product_id","text":"3 groups: products 1, 2, 3."},{"stage":"SELECT","code":"COALESCE(ROUND(SUM(price*units) * 1.0 / SUM(units), 2), 0)","text":"Weighted average per product, 0 when nothing sold."}],"visuals":[{"kind":"join","title":"Step 1 — Which price period does each sale fall in?","diagram":"\nUnitsSold row ──▶ same product_id in Prices?\n                    │\n                    ▼\n     purchase_date BETWEEN start_date AND end_date ?\n          TRUE  → this period's price applies\n          FALSE → wrong period, ignore this pairing\n\n  product 2, 2024-02-03 → FALSE for every period → no price at all\n","sql":"\nSELECT u.product_id,\n       u.purchase_date,\n       u.units,\n       p.start_date,\n       p.end_date,\n       p.price,\n       u.purchase_date BETWEEN p.start_date AND p.end_date AS in_period\nFROM UnitsSold AS u\nINNER JOIN Prices AS p\n        ON p.product_id = u.product_id\nORDER BY u.product_id, u.purchase_date, p.start_date;\n","text":"This helper view pairs each sale with **every** period of the same product and tests the date. Product 1's Jan 5 and Jan 15 sales land in the price-10 period, Jan 20 lands in the price-12 period. Product 2's Feb 3 sale is FALSE for its only period, so it will never be priced."},{"kind":"join","title":"Step 2 — LEFT JOIN with the date range inside ON","diagram":"\nPrices (4 periods)                       UnitsSold (5 sales)\n  p.product_id ───────── = ──────────▶  u.product_id\n  p.start_date ≤ u.purchase_date ≤ p.end_date\n\n  matched   → one row per sale inside the period\n  unmatched → period kept, u.* = NULL   (product 3)\n  sale outside every period → never attached (2024-02-03)\n","sql":"\nSELECT p.product_id,\n       p.start_date,\n       p.end_date,\n       p.price,\n       u.purchase_date,\n       u.units,\n       p.price * u.units AS revenue\nFROM Prices AS p\nLEFT JOIN UnitsSold AS u\n       ON u.product_id = p.product_id\n      AND u.purchase_date BETWEEN p.start_date AND p.end_date\nORDER BY p.product_id, p.start_date, u.purchase_date;\n","text":"Product 1's first period gets two sales, its second period one sale. Product 3 has no matching sale, so it stays with `NULL` units and revenue — that row is what lets us return 0 later. The Feb 3 sale does not appear anywhere."},{"kind":"group","title":"Step 3 — GROUP BY product: revenue ÷ units","diagram":"\nproduct 1\n ├─ 4 × 10 = 40\n ├─ 1 × 10 = 10\n └─ 2 × 12 = 24     → 74 / 7 = 10.571… → 10.57\nproduct 2\n └─ 3 × 8  = 24     → 24 / 3 = 8.00\nproduct 3\n └─ NULL            → NULL / NULL = NULL → COALESCE → 0\n","sql":"\nSELECT p.product_id,\n       SUM(p.price * u.units)                          AS total_revenue,\n       SUM(u.units)                                    AS total_units,\n       SUM(p.price * u.units) / SUM(u.units)           AS int_division_wrong,\n       SUM(p.price * u.units) * 1.0 / SUM(u.units)     AS exact_average,\n       COALESCE(\n           ROUND(SUM(p.price * u.units) * 1.0 / SUM(u.units), 2),\n           0\n       )                                               AS average_price\nFROM Prices AS p\nLEFT JOIN UnitsSold AS u\n       ON u.product_id = p.product_id\n      AND u.purchase_date BETWEEN p.start_date AND p.end_date\nGROUP BY p.product_id\nORDER BY p.product_id;\n","text":"The helper columns show each step. `int_division_wrong` gives 10 for product 1 because integer ÷ integer drops the fraction. With `* 1.0` we get 10.571…, which ROUND turns into 10.57. Product 3's sums are NULL, and only COALESCE makes its answer 0."}],"flow":[{"label":"Input tables","detail":"Prices (4 periods) · UnitsSold (5 sales)","ref":"input"},{"label":"Match sale → period","detail":"date BETWEEN start_date AND end_date","ref":0},{"label":"LEFT JOIN from Prices","detail":"keep unsold product 3, drop out-of-period sale → 5 rows","ref":1},{"label":"GROUP BY + weighted average","detail":"SUM(price × units) * 1.0 / SUM(units), ROUND, COALESCE","ref":2},{"label":"Final output","detail":"one row per product","ref":"output"}],"takeaway":{"pattern":"\"Price valid at the time of the event\" → join on the key AND `event_date BETWEEN start AND end`. \"Average weighted by quantity\" → SUM(value × qty) / SUM(qty), not AVG(value).","asks":["Why not `AVG(p.price)`? (It treats a 1-unit sale and a 100-unit sale the same. The average must be weighted by units.)","Why put the date condition in ON and not in WHERE? (In WHERE, `u.purchase_date BETWEEN …` is NULL for product 3's unmatched row, so the row would be removed and product 3 would disappear.)","Why start FROM Prices instead of UnitsSold? (A product with zero sales has no UnitsSold row; it only exists in Prices.)","What if UnitsSold had a product that is not in Prices? (It has no price, so it cannot be priced; starting from Prices correctly ignores it.)"],"alternatives":["Cast instead of multiplying: `ROUND(SUM(p.price * u.units)::NUMERIC / SUM(u.units), 2)` — same result, the cast is explicit.","Aggregate the joined sales in a CTE first, then LEFT JOIN a list of distinct product_ids and COALESCE — longer, but separates \"price the sales\" from \"keep every product\"."],"realworld":"Average realised price per SKU when list prices change, revenue with historical exchange rates or tax rates (join on the rate valid on the transaction date), cost of goods with time-dependent supplier prices."},"mistakes":["Dividing two integers: `SUM(price * units) / SUM(units)` returns 10 instead of 10.57 in PostgreSQL. Multiply by `1.0` or cast to NUMERIC first.","`ROUND(double precision, 2)` does not exist in PostgreSQL. Keep the value NUMERIC (e.g. `* 1.0` or `::NUMERIC`) before calling ROUND with 2 decimals.","Forgetting COALESCE — the unsold product comes back as NULL instead of 0.","Putting the date condition in WHERE — that turns the LEFT JOIN into an inner join and drops unsold products.","Using `AVG(price)` — an unweighted average ignores how many units were sold at each price.","Using `purchase_date > start_date AND purchase_date < end_date` — sales on the first or last day of a period are lost. BETWEEN is inclusive."],"built":{"id":16,"inputs":[{"name":"Prices","columns":["product_id","start_date","end_date","price"],"types":["integer","date","date","integer"],"rows":[[1,"2024-01-01","2024-01-15",10],[1,"2024-01-16","2024-01-31",12],[2,"2024-01-01","2024-01-31",8],[3,"2024-01-01","2024-01-31",50]]},{"name":"UnitsSold","columns":["product_id","purchase_date","units"],"types":["integer","date","integer"],"rows":[[1,"2024-01-05",4],[1,"2024-01-15",1],[1,"2024-01-20",2],[2,"2024-01-10",3],[2,"2024-02-03",5]]}],"visuals":[{"columns":["product_id","purchase_date","units","start_date","end_date","price","in_period"],"types":["integer","date","integer","date","date","integer","boolean"],"rows":[[1,"2024-01-05",4,"2024-01-01","2024-01-15",10,true],[1,"2024-01-05",4,"2024-01-16","2024-01-31",12,false],[1,"2024-01-15",1,"2024-01-01","2024-01-15",10,true],[1,"2024-01-15",1,"2024-01-16","2024-01-31",12,false],[1,"2024-01-20",2,"2024-01-01","2024-01-15",10,false],[1,"2024-01-20",2,"2024-01-16","2024-01-31",12,true],[2,"2024-01-10",3,"2024-01-01","2024-01-31",8,true],[2,"2024-02-03",5,"2024-01-01","2024-01-31",8,false]]},{"columns":["product_id","start_date","end_date","price","purchase_date","units","revenue"],"types":["integer","date","date","integer","date","integer","integer"],"rows":[[1,"2024-01-01","2024-01-15",10,"2024-01-05",4,40],[1,"2024-01-01","2024-01-15",10,"2024-01-15",1,10],[1,"2024-01-16","2024-01-31",12,"2024-01-20",2,24],[2,"2024-01-01","2024-01-31",8,"2024-01-10",3,24],[3,"2024-01-01","2024-01-31",50,null,null,null]]},{"columns":["product_id","total_revenue","total_units","int_division_wrong","exact_average","average_price"],"types":["integer","bigint","bigint","bigint","numeric","numeric"],"rows":[[1,74,7,10,"10.5714285714285714","10.57"],[2,24,3,8,"8.0000000000000000","8.00"],[3,null,null,null,null,0]]}],"output":{"columns":["product_id","average_price"],"types":["integer","numeric"],"rows":[[1,"10.57"],[2,"8.00"],[3,0]]}}},{"id":17,"lc":1075,"slug":"project-employees-i","title":"Project Employees I","section":"Basic Aggregate Functions","difficulty":"Easy","concepts":["INNER JOIN","GROUP BY","AVG","ROUND"],"pattern":"Join the fact table to the lookup table to fetch the number, then GROUP BY the entity and take AVG.","statement":["`Project` says which employee works on which project (one row per project–employee pair). `Employee` stores each employee's name and years of experience.","For every project, compute the **average experience** of the employees working on it."],"returns":"One row per project with `project_id` and `average_years` rounded to 2 decimals. Any order.","setup":"\nCREATE TABLE Project (\n  project_id  INT,\n  employee_id INT,\n  PRIMARY KEY (project_id, employee_id)\n);\nCREATE TABLE Employee (\n  employee_id      INT PRIMARY KEY,\n  name             VARCHAR(10),\n  experience_years INT\n);\n\nINSERT INTO Project VALUES\n  (10, 1), (10, 2), (10, 3),\n  (20, 1), (20, 4),\n  (30, 5);\n\nINSERT INTO Employee VALUES\n  (1, 'Nadia', 4),\n  (2, 'Omar',  1),\n  (3, 'Lena',  2),\n  (4, 'Ravi',  5),\n  (5, 'Sofia', 10),\n  (6, 'Tom',   7);\n","tables":["Project","Employee"],"table_notes":{"Project":"Nadia (employee 1) works on two projects, so her 4 years count in both averages.","Employee":"Tom is on no project — he must not affect any average."},"solution":"\nSELECT p.project_id,\n       ROUND(AVG(e.experience_years), 2) AS average_years\nFROM Project AS p\nINNER JOIN Employee AS e\n        ON e.employee_id = p.employee_id\nGROUP BY p.project_id;\n","display_sql":"\nSELECT p.project_id,\n       ROUND(AVG(e.experience_years), 2) AS average_years\nFROM Project AS p\nINNER JOIN Employee AS e\n        ON e.employee_id = p.employee_id\nGROUP BY p.project_id\nORDER BY p.project_id;\n","output_notes":["**Project 10 = 2.33** — Nadia 4 + Omar 1 + Lena 2 = 7 years over 3 people → 2.333… → 2.33.","**Project 20 = 4.50** — Nadia 4 + Ravi 5 = 9 over 2 people.","**Project 30 = 10.00** — only Sofia works on it.","Tom (7 years) appears in no project row, so the inner join never sees him."],"breakdown":[{"code":"FROM Project AS p","text":"Each row is one employee assigned to one project (6 rows)."},{"code":"INNER JOIN Employee AS e\n        ON e.employee_id = p.employee_id","text":"Look up each assigned employee's `experience_years`. An INNER JOIN is enough: every project row has a matching employee, and employees without a project are not needed."},{"code":"GROUP BY p.project_id","text":"One group per project."},{"code":"AVG(e.experience_years)","text":"Average of the group's years. In PostgreSQL `AVG` of an INT column returns **NUMERIC**, so there is no integer truncation here (7 / 3 becomes 2.333…, not 2)."},{"code":"ROUND(…, 2) AS average_years","text":"Round to 2 decimals. This works directly because AVG already returned NUMERIC; `ROUND(double precision, 2)` would not exist."}],"exec_order":[{"stage":"FROM","code":"Project p","text":"6 assignment rows."},{"stage":"JOIN / ON","code":"INNER JOIN Employee e ON e.employee_id = p.employee_id","text":"Attach experience_years → still 6 rows."},{"stage":"GROUP BY","code":"p.project_id","text":"3 groups."},{"stage":"SELECT","code":"ROUND(AVG(e.experience_years), 2)","text":"Average per project, rounded."}],"visuals":[{"kind":"join","title":"Step 1 — Attach each employee's experience to the project row","diagram":"\nProject (6 rows)                  Employee (6 rows)\n  p.employee_id ──── = ────▶  e.employee_id\n\n  matched   → experience_years filled in\n  Tom (6)   → no Project row, not in the result\n","sql":"\nSELECT p.project_id,\n       p.employee_id,\n       e.name,\n       e.experience_years\nFROM Project AS p\nINNER JOIN Employee AS e\n        ON e.employee_id = p.employee_id\nORDER BY p.project_id, p.employee_id;\n","text":"Every project row now carries a number we can average. Nadia appears twice (projects 10 and 20). Tom is not in the joined table, so he cannot distort any average."},{"kind":"group","title":"Step 2 — GROUP BY project_id and average","diagram":"\nproject 10\n ├─ Nadia  4\n ├─ Omar   1\n └─ Lena   2     → 7 / 3 = 2.333… → 2.33\nproject 20\n ├─ Nadia  4\n └─ Ravi   5     → 9 / 2 = 4.5    → 4.50\nproject 30\n └─ Sofia 10     → 10 / 1         → 10.00\n","sql":"\nSELECT p.project_id,\n       SUM(e.experience_years)           AS total_years,\n       COUNT(*)                          AS employees,\n       AVG(e.experience_years)           AS exact_avg,\n       ROUND(AVG(e.experience_years), 2) AS average_years\nFROM Project AS p\nINNER JOIN Employee AS e\n        ON e.employee_id = p.employee_id\nGROUP BY p.project_id\nORDER BY p.project_id;\n","text":"The helper columns show that AVG is just SUM ÷ COUNT per group: project 10 has 7 years over 3 employees. `exact_avg` is already NUMERIC (2.333…), and ROUND trims it to 2.33."}],"flow":[{"label":"Input tables","detail":"Project (6) · Employee (6)","ref":"input"},{"label":"INNER JOIN Employee","detail":"attach experience_years → 6 rows","ref":0},{"label":"GROUP BY + AVG","detail":"one row per project, rounded average","ref":1},{"label":"Final output","detail":"3 projects","ref":"output"}],"takeaway":{"pattern":"\"Average of an attribute per group, where the attribute lives in another table\" → JOIN to fetch it, GROUP BY the group key, `ROUND(AVG(col), 2)`.","asks":["Why does ROUND(AVG(int_col), 2) work without a cast in PostgreSQL? (AVG over integers returns NUMERIC.)","What if experience_years were a REAL / DOUBLE PRECISION column? (AVG would return double precision; you would need `ROUND(AVG(col)::NUMERIC, 2)`.)","What if a project had no employees, but should still show 0? (You would need a Projects table and a LEFT JOIN plus COALESCE — here every project row has an employee.)","Why not SUM / COUNT by hand? (It works, but `SUM(int) / COUNT(*)` is integer division and truncates. AVG avoids that.)"],"alternatives":["`ROUND(SUM(e.experience_years) * 1.0 / COUNT(*), 2)` — same result; the `* 1.0` avoids integer division.","`CAST(AVG(e.experience_years) AS NUMERIC(10, 2))` — casting to a 2-decimal NUMERIC also rounds, but `ROUND(…, 2)` states the intent more clearly."],"realworld":"Average tenure per team, average order value per customer segment, average rating per product category — any \"average of X per group\" where X sits in a dimension table."},"mistakes":["Writing `SUM(experience_years) / COUNT(*)` — integer division turns 7 / 3 into 2.","`ROUND(AVG(col), 2)` on a FLOAT / DOUBLE column fails in PostgreSQL (`function round(double precision, integer) does not exist`). Cast to NUMERIC first.","Grouping by `employee_id` or selecting `e.name` without grouping by it — PostgreSQL rejects non-aggregated columns that are not in GROUP BY.","Starting from Employee with a LEFT JOIN — Tom would form a NULL project group."],"built":{"id":17,"inputs":[{"name":"Project","columns":["project_id","employee_id"],"types":["integer","integer"],"rows":[[10,1],[10,2],[10,3],[20,1],[20,4],[30,5]]},{"name":"Employee","columns":["employee_id","name","experience_years"],"types":["integer","character varying(10)","integer"],"rows":[[1,"Nadia",4],[2,"Omar",1],[3,"Lena",2],[4,"Ravi",5],[5,"Sofia",10],[6,"Tom",7]]}],"visuals":[{"columns":["project_id","employee_id","name","experience_years"],"types":["integer","integer","character varying(10)","integer"],"rows":[[10,1,"Nadia",4],[10,2,"Omar",1],[10,3,"Lena",2],[20,1,"Nadia",4],[20,4,"Ravi",5],[30,5,"Sofia",10]]},{"columns":["project_id","total_years","employees","exact_avg","average_years"],"types":["integer","bigint","bigint","numeric","numeric"],"rows":[[10,7,3,"2.3333333333333333","2.33"],[20,9,2,"4.5000000000000000","4.50"],[30,10,1,"10.0000000000000000","10.00"]]}],"output":{"columns":["project_id","average_years"],"types":["integer","numeric"],"rows":[[10,"2.33"],[20,"4.50"],[30,"10.00"]]}}},{"id":18,"lc":1633,"slug":"percentage-of-users-attended-a-contest","title":"Percentage of Users Attended a Contest","section":"Basic Aggregate Functions","difficulty":"Easy","concepts":["Scalar subquery","GROUP BY","COUNT","100.0 (avoid integer division)","ORDER BY two keys"],"pattern":"Count per group, divide by a grand total computed in a scalar subquery, then sort by the percentage with a tie-breaker.","statement":["`Users` lists every user of the site. `Register` records which user signed up for which contest (each pair appears once).","For each contest, find what percentage of **all users** registered for it."],"returns":"`contest_id` and `percentage` (rounded to 2 decimals), sorted by `percentage` **descending**; ties sorted by `contest_id` **ascending**.","setup":"\nCREATE TABLE Users (\n  user_id   INT PRIMARY KEY,\n  user_name VARCHAR(20)\n);\nCREATE TABLE Register (\n  contest_id INT,\n  user_id    INT,\n  PRIMARY KEY (contest_id, user_id)\n);\n\nINSERT INTO Users VALUES\n  (1, 'Amina'), (2, 'Ben'), (3, 'Chen'),\n  (4, 'Dara'),  (5, 'Eli'), (6, 'Zara');\n\nINSERT INTO Register VALUES\n  (504, 2), (504, 3), (504, 4), (504, 5),\n  (501, 1), (501, 2), (501, 3),\n  (502, 1), (502, 2), (502, 4), (502, 5),\n  (503, 4);\n","tables":["Users","Register"],"table_notes":{"Users":"Zara (user 6) registered for nothing — but she still counts in the denominator: 6 users in total.","Register":"Contests 502 and 504 both have 4 registrations — a tie the ORDER BY must break."},"solution":"\nSELECT r.contest_id,\n       ROUND(\n           COUNT(r.user_id) * 100.0 / (SELECT COUNT(*) FROM Users),\n           2\n       ) AS percentage\nFROM Register AS r\nGROUP BY r.contest_id\nORDER BY percentage DESC, r.contest_id ASC;\n","official_ordered":true,"output_notes":["**502 = 66.67** and **504 = 66.67** — 4 of the 6 users each. They tie on percentage, so the smaller contest_id (502) comes first.","**501 = 50.00** — Amina, Ben and Chen: 3 / 6 × 100.","**503 = 16.67** — only Dara: 1 / 6 × 100 = 16.666… → 16.67.","The denominator is always 6 (all users), not the number of users who registered somewhere (5)."],"breakdown":[{"code":"(SELECT COUNT(*) FROM Users)","text":"A **scalar subquery**: it returns one single value, the total number of users (6). PostgreSQL runs it once and uses the value in every group."},{"code":"FROM Register AS r","text":"Each row is one registration."},{"code":"GROUP BY r.contest_id","text":"One group per contest."},{"code":"COUNT(r.user_id) * 100.0","text":"Registered users in the contest, times 100. Writing `100.0` (not `100`) makes the value NUMERIC, so the next division keeps decimals. With `100` the whole calculation is integer math and 400 / 6 becomes 66."},{"code":"/ (SELECT COUNT(*) FROM Users)","text":"Divide by the total number of users → percentage."},{"code":"ROUND(…, 2) AS percentage","text":"Round to 2 decimals. ROUND with a precision argument needs NUMERIC — the `100.0` already gave us that."},{"code":"ORDER BY percentage DESC, r.contest_id ASC","text":"Highest percentage first; for equal percentages, smaller contest_id first. PostgreSQL allows sorting by the output alias `percentage`."}],"exec_order":[{"stage":"FROM","code":"Register r","text":"12 registration rows."},{"stage":"GROUP BY","code":"r.contest_id","text":"4 contest groups."},{"stage":"SELECT","code":"ROUND(COUNT(r.user_id) * 100.0 / (SELECT COUNT(*) FROM Users), 2)","text":"The subquery gives 6; each group's count is turned into a percentage."},{"stage":"ORDER BY","code":"percentage DESC, contest_id ASC","text":"Sort, breaking the 66.67 tie by contest_id."}],"visuals":[{"kind":"subquery","title":"Step 1 — The subquery: how many users exist?","diagram":"\n(SELECT COUNT(*) FROM Users)\n          │\n          ▼\n   Amina, Ben, Chen, Dara, Eli, Zara  →  6\n          │\n          ▼\n   used as the denominator for EVERY contest\n","sql":"\nSELECT COUNT(*) AS total_users\nFROM Users;\n","text":"The subquery runs on its own and returns a single number: **6**. Zara never registered, but she is still a user, so she is part of the total. Counting distinct users in Register would wrongly give 5."},{"kind":"group","title":"Step 2 — GROUP BY contest, then registered / total × 100","diagram":"\ncontest 501\n ├─ Amina\n ├─ Ben\n └─ Chen          → 3 / 6 × 100 = 50.00\ncontest 502\n ├─ Amina ├─ Ben ├─ Dara └─ Eli\n                  → 4 / 6 × 100 = 66.67\ncontest 503\n └─ Dara          → 1 / 6 × 100 = 16.67\ncontest 504\n ├─ Ben ├─ Chen ├─ Dara └─ Eli\n                  → 4 / 6 × 100 = 66.67\n","sql":"\nSELECT r.contest_id,\n       COUNT(r.user_id)                                  AS registered,\n       (SELECT COUNT(*) FROM Users)                      AS total_users,\n       COUNT(r.user_id) * 100 / (SELECT COUNT(*) FROM Users)   AS int_math_wrong,\n       COUNT(r.user_id) * 100.0 / (SELECT COUNT(*) FROM Users) AS exact_pct,\n       ROUND(COUNT(r.user_id) * 100.0 / (SELECT COUNT(*) FROM Users), 2) AS percentage\nFROM Register AS r\nGROUP BY r.contest_id\nORDER BY r.contest_id;\n","text":"Each contest's count is divided by the same total, 6. The `int_math_wrong` column shows what happens with `* 100`: 400 / 6 is truncated to 66. With `* 100.0` we get 66.666…, which ROUND turns into 66.67."},{"kind":"order","title":"Step 3 — ORDER BY percentage DESC, contest_id ASC","diagram":"\npercentage DESC          tie? → contest_id ASC\n  66.67  (502, 504)  ──▶  502 before 504\n  50.00  (501)\n  16.67  (503)\n","sql":"\nSELECT r.contest_id,\n       ROUND(COUNT(r.user_id) * 100.0 / (SELECT COUNT(*) FROM Users), 2) AS percentage\nFROM Register AS r\nGROUP BY r.contest_id\nORDER BY percentage DESC, r.contest_id ASC;\n","text":"The first sort key puts 66.67 on top. Contests 502 and 504 are equal on that key, so the second key decides: 502 comes before 504. Without the second key their order would be arbitrary."}],"flow":[{"label":"Input tables","detail":"Users (6) · Register (12)","ref":"input"},{"label":"Subquery: total users","detail":"SELECT COUNT(*) FROM Users → 6","ref":0},{"label":"GROUP BY contest","detail":"registered × 100.0 / 6, ROUND 2","ref":1},{"label":"ORDER BY","detail":"percentage DESC, contest_id ASC","ref":2},{"label":"Final output","detail":"4 contests","ref":"output"}],"takeaway":{"pattern":"\"Percentage of the whole per group\" → `COUNT(*) * 100.0 / (SELECT COUNT(*) FROM whole_table)` with GROUP BY, then ROUND.","asks":["Why not divide by `COUNT(DISTINCT user_id)` from Register? (Users who registered for nothing would be missing from the total — 5 instead of 6.)","Is the subquery executed once per group? (No. It does not depend on the outer row, so PostgreSQL evaluates it once.)","Why `100.0` and not `100`? (Integer × integer / integer stays integer in PostgreSQL and truncates the decimals.)","What if Register could contain duplicate (contest, user) pairs? (Use `COUNT(DISTINCT r.user_id)` so a user counts once per contest.)"],"alternatives":["CTE version: `WITH total AS (SELECT COUNT(*) AS n FROM Users) SELECT r.contest_id, ROUND(COUNT(*) * 100.0 / t.n, 2) … FROM Register r CROSS JOIN total t GROUP BY r.contest_id, t.n` — the total becomes a named step."],"realworld":"Share of all customers who bought each product, adoption rate of each feature among all users, percentage of employees enrolled in each training."},"mistakes":["Using `* 100` instead of `* 100.0` — integer division makes 66.67 become 66.","Calling `ROUND(x, 2)` on a double precision value (e.g. after `::FLOAT`) — PostgreSQL has no ROUND(double precision, integer). Keep the value NUMERIC.","Dividing by the number of users found in Register instead of all users in Users.","Forgetting the tie-breaker `contest_id ASC` — 502 and 504 could come out in any order.","Multiplying by 100 **after** an integer division: `COUNT(*) / total * 100` gives 0 for every contest below 100%."],"built":{"id":18,"inputs":[{"name":"Users","columns":["user_id","user_name"],"types":["integer","character varying(20)"],"rows":[[1,"Amina"],[2,"Ben"],[3,"Chen"],[4,"Dara"],[5,"Eli"],[6,"Zara"]]},{"name":"Register","columns":["contest_id","user_id"],"types":["integer","integer"],"rows":[[504,2],[504,3],[504,4],[504,5],[501,1],[501,2],[501,3],[502,1],[502,2],[502,4],[502,5],[503,4]]}],"visuals":[{"columns":["total_users"],"types":["bigint"],"rows":[[6]]},{"columns":["contest_id","registered","total_users","int_math_wrong","exact_pct","percentage"],"types":["integer","bigint","bigint","bigint","numeric","numeric"],"rows":[[501,3,6,50,"50.0000000000000000","50.00"],[502,4,6,66,"66.6666666666666667","66.67"],[503,1,6,16,"16.6666666666666667","16.67"],[504,4,6,66,"66.6666666666666667","66.67"]]},{"columns":["contest_id","percentage"],"types":["integer","numeric"],"rows":[[502,"66.67"],[504,"66.67"],[501,"50.00"],[503,"16.67"]]}],"output":{"columns":["contest_id","percentage"],"types":["integer","numeric"],"rows":[[502,"66.67"],[504,"66.67"],[501,"50.00"],[503,"16.67"]]}}},{"id":19,"lc":1211,"slug":"queries-quality-and-percentage","title":"Queries Quality and Percentage","section":"Basic Aggregate Functions","difficulty":"Easy","concepts":["GROUP BY","AVG of an expression","CASE WHEN inside SUM","Integer division","ROUND"],"pattern":"Compute a per-row value (ratio, 0/1 flag) inside the aggregate, then AVG / SUM it per group.","statement":["A search log stores, for each search term (`query_name`), a result that was shown, the `position` where it was shown (1 = top), and a `rating` from 1 to 5. The table can contain duplicate rows, and each row counts.","For each search term compute two numbers: its **quality** = the average of `rating / position` over its rows, and its **poor query percentage** = the share of its rows with a rating below 3, as a percentage."],"returns":"`query_name`, `quality` and `poor_query_percentage`, both rounded to 2 decimals. One row per query name, any order.","setup":"\nCREATE TABLE Queries (\n  query_name VARCHAR(30),\n  result     VARCHAR(50),\n  position   INT,\n  rating     INT\n);\n\nINSERT INTO Queries VALUES\n  ('Weather', 'forecast.com', 1,  5),\n  ('Weather', 'radar.io',     4,  2),\n  ('Weather', 'almanac.org',  10, 1),\n  ('Pizza',   'Napoli',       2,  4),\n  ('Pizza',   'QuickSlice',   3,  3),\n  ('Pizza',   'Napoli',       2,  4),\n  (NULL,      'unknown.net',  5,  1);\n","tables":["Queries"],"table_notes":{"Queries":"Pizza / Napoli appears twice — duplicates are real rows and both count. The last row has no query_name, so it cannot be reported under any name."},"solution":"\nSELECT query_name,\n       ROUND(AVG(rating * 1.0 / position), 2) AS quality,\n       ROUND(\n           SUM(CASE WHEN rating < 3 THEN 1 ELSE 0 END) * 100.0 / COUNT(*),\n           2\n       ) AS poor_query_percentage\nFROM Queries\nWHERE query_name IS NOT NULL\nGROUP BY query_name;\n","display_sql":"\nSELECT query_name,\n       ROUND(AVG(rating * 1.0 / position), 2) AS quality,\n       ROUND(\n           SUM(CASE WHEN rating < 3 THEN 1 ELSE 0 END) * 100.0 / COUNT(*),\n           2\n       ) AS poor_query_percentage\nFROM Queries\nWHERE query_name IS NOT NULL\nGROUP BY query_name\nORDER BY query_name;\n","output_notes":["**Pizza: quality 1.67, poor 0.00** — ratios 4/2 = 2, 3/3 = 1 and the duplicate 4/2 = 2 → 5 / 3 = 1.666… → 1.67. No rating is below 3.","**Weather: quality 1.87, poor 66.67** — ratios 5/1 = 5, 2/4 = 0.5, 1/10 = 0.1 → 5.6 / 3 = 1.866… → 1.87. Ratings 2 and 1 are poor: 2 of 3 rows → 66.67.","The row with a NULL `query_name` is filtered out; otherwise it would produce an extra row with an empty name."],"breakdown":[{"code":"FROM Queries","text":"7 log rows, duplicates included."},{"code":"WHERE query_name IS NOT NULL","text":"A defensive filter: a row without a name cannot belong to any query. Without it, GROUP BY would put all NULL names into one extra group."},{"code":"GROUP BY query_name","text":"One group per search term."},{"code":"AVG(rating * 1.0 / position)","text":"Compute `rating / position` **per row**, then average. Both columns are INT, so `rating / position` alone is integer division (2 / 4 = 0). Multiplying by `1.0` first makes it NUMERIC (0.5)."},{"code":"ROUND(…, 2) AS quality","text":"Round to 2 decimals; works because the value is NUMERIC."},{"code":"SUM(CASE WHEN rating < 3 THEN 1 ELSE 0 END)","text":"Turn each row into a 1 (poor) or 0 (not poor) and add them up → number of poor rows in the group."},{"code":"* 100.0 / COUNT(*)","text":"Divide by the number of rows in the group and scale to a percentage. `100.0` again avoids integer division."},{"code":"ROUND(…, 2) AS poor_query_percentage","text":"Round the percentage to 2 decimals."}],"exec_order":[{"stage":"FROM","code":"Queries","text":"7 rows."},{"stage":"WHERE","code":"query_name IS NOT NULL","text":"Drop the nameless row → 6 rows."},{"stage":"GROUP BY","code":"query_name","text":"2 groups: Pizza, Weather."},{"stage":"SELECT","code":"ROUND(AVG(rating * 1.0 / position), 2), ROUND(SUM(CASE …) * 100.0 / COUNT(*), 2)","text":"Per group: average ratio and poor percentage."}],"visuals":[{"kind":"case","title":"Step 1 — Per-row values: the ratio and the poor flag","diagram":"\neach row\n ├─ ratio   = rating * 1.0 / position      (NUMERIC, keeps decimals)\n ├─ is_poor = CASE WHEN rating < 3 THEN 1 ELSE 0 END\n └─ query_name IS NULL ?  → ✗ removed by WHERE\n","sql":"\nSELECT query_name,\n       result,\n       rating,\n       position,\n       rating / position                    AS int_ratio_wrong,\n       rating * 1.0 / position              AS ratio,\n       CASE WHEN rating < 3 THEN 1 ELSE 0 END AS is_poor,\n       query_name IS NOT NULL               AS kept_by_where\nFROM Queries\nORDER BY query_name, position, result;\n","text":"Look at `radar.io`: 2 / 4 as integers is **0**, but the real ratio is 0.5. The `* 1.0` version keeps it. `is_poor` is 1 for ratings 2 and 1 (radar.io, almanac.org, unknown.net). The nameless row is FALSE in `kept_by_where` and is removed before grouping."},{"kind":"group","title":"Step 2 — GROUP BY query_name and aggregate both values","diagram":"\nPizza\n ├─ 4/2 = 2.0    poor 0\n ├─ 3/3 = 1.0    poor 0\n └─ 4/2 = 2.0    poor 0   → AVG 5.0/3 = 1.67 · 0 of 3 → 0.00\nWeather\n ├─ 5/1  = 5.0   poor 0\n ├─ 2/4  = 0.5   poor 1\n └─ 1/10 = 0.1   poor 1   → AVG 5.6/3 = 1.87 · 2 of 3 → 66.67\n","sql":"\nSELECT query_name,\n       SUM(rating * 1.0 / position)                    AS sum_ratio,\n       COUNT(*)                                        AS row_count,\n       ROUND(AVG(rating * 1.0 / position), 2)          AS quality,\n       ROUND(AVG(rating / position), 2)                AS quality_int_wrong,\n       SUM(CASE WHEN rating < 3 THEN 1 ELSE 0 END)     AS poor_count,\n       ROUND(SUM(CASE WHEN rating < 3 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS poor_query_percentage\nFROM Queries\nWHERE query_name IS NOT NULL\nGROUP BY query_name\nORDER BY query_name;\n","text":"Weather's ratios add up to 5.6 over 3 rows → 1.87. With integer ratios the sum would be 5 + 0 + 0 → 1.67, which is wrong (`quality_int_wrong`). Weather has 2 poor rows of 3 → 66.67; Pizza has none → 0.00. The duplicate Napoli row counts in both of Pizza's numbers."}],"flow":[{"label":"Input table","detail":"Queries (7 rows, incl. a duplicate and a NULL name)","ref":"input"},{"label":"Per-row ratio + CASE flag","detail":"rating * 1.0 / position, poor = 1/0; NULL name dropped","ref":0},{"label":"GROUP BY query_name","detail":"AVG(ratio), SUM(poor) * 100.0 / COUNT(*)","ref":1},{"label":"Final output","detail":"one row per query name","ref":"output"}],"takeaway":{"pattern":"\"Average of a per-row formula\" → `AVG(formula)`. \"Percentage of rows meeting a condition\" → `SUM(CASE WHEN cond THEN 1 ELSE 0 END) * 100.0 / COUNT(*)`.","asks":["Is `AVG(rating / position)` the same as `AVG(rating) / AVG(position)`? (No. The problem averages the per-row ratios; dividing two averages weights rows differently.)","Another way to write the poor percentage? (`AVG(CASE WHEN rating < 3 THEN 100.0 ELSE 0 END)` — the average of 100/0 values is the percentage.)","Why the WHERE query_name IS NOT NULL? (Rows without a name would form a NULL group; the expected output only lists named queries.)","What if position could be 0? (Division by zero error. Use `NULLIF(position, 0)` to turn it into NULL, which AVG then ignores.)"],"alternatives":["`ROUND(AVG(CASE WHEN rating < 3 THEN 1 ELSE 0 END) * 100, 2)` — AVG of the 0/1 flag is already a fraction (NUMERIC in PostgreSQL), times 100 is the percentage.","`ROUND(AVG(rating::NUMERIC / position), 2)` — an explicit cast instead of `* 1.0`."],"realworld":"Search relevance metrics (mean reciprocal rank style scores), share of support tickets rated unsatisfied per agent, error rate per API endpoint (errors / requests)."},"mistakes":["`rating / position` with two INT columns — integer division turns 2/4 into 0 and makes Weather's quality 1.67 instead of 1.87.","`COUNT(rating < 3)` — COUNT counts every non-NULL value, and FALSE is not NULL, so it counts all rows. Use SUM of a CASE.","Writing `* 100` instead of `* 100.0` — 2 * 100 / 3 becomes 66, not 66.67.","Removing duplicate rows with DISTINCT — the problem says duplicates are separate rows and must be counted.","`ROUND(x, 2)` on a double precision value fails in PostgreSQL; keep the expression NUMERIC."],"built":{"id":19,"inputs":[{"name":"Queries","columns":["query_name","result","position","rating"],"types":["character varying(30)","character varying(50)","integer","integer"],"rows":[["Weather","forecast.com",1,5],["Weather","radar.io",4,2],["Weather","almanac.org",10,1],["Pizza","Napoli",2,4],["Pizza","QuickSlice",3,3],["Pizza","Napoli",2,4],[null,"unknown.net",5,1]]}],"visuals":[{"columns":["query_name","result","rating","position","int_ratio_wrong","ratio","is_poor","kept_by_where"],"types":["character varying(30)","character varying(50)","integer","integer","integer","numeric","integer","boolean"],"rows":[["Pizza","Napoli",4,2,2,"2.0000000000000000",0,true],["Pizza","Napoli",4,2,2,"2.0000000000000000",0,true],["Pizza","QuickSlice",3,3,1,"1.00000000000000000000",0,true],["Weather","forecast.com",5,1,5,"5.0000000000000000",0,true],["Weather","radar.io",2,4,0,"0.50000000000000000000",1,true],["Weather","almanac.org",1,10,0,"0.10000000000000000000",1,true],[null,"unknown.net",1,5,0,"0.20000000000000000000",1,false]]},{"columns":["query_name","sum_ratio","row_count","quality","quality_int_wrong","poor_count","poor_query_percentage"],"types":["character varying(30)","numeric","bigint","numeric","numeric","bigint","numeric"],"rows":[["Pizza","5.00000000000000000000",3,"1.67","1.67",0,"0.00"],["Weather","5.60000000000000000000",3,"1.87","1.67",2,"66.67"]]}],"output":{"columns":["query_name","quality","poor_query_percentage"],"types":["character varying(30)","numeric","numeric"],"rows":[["Pizza","1.67","0.00"],["Weather","1.87","66.67"]]}}},{"id":20,"lc":1193,"slug":"monthly-transactions-i","title":"Monthly Transactions I","section":"Basic Aggregate Functions","difficulty":"Medium","concepts":["TO_CHAR(date, 'YYYY-MM')","GROUP BY two keys","Conditional SUM with CASE","COUNT(*)","NULL group"],"pattern":"GROUP BY a derived month plus a category, and compute \"all\" and \"only matching\" totals side by side with SUM(CASE WHEN … THEN … ELSE 0 END).","statement":["Each row of `Transactions` is one payment attempt: its `country`, its `state` (`approved` or `declined`), its `amount` and its `trans_date`.","For every **month** and **country**, report how many transactions there were and their total amount, and also how many were **approved** and the total amount of the approved ones."],"returns":"`month` (as `YYYY-MM`), `country`, `trans_count`, `approved_count`, `trans_total_amount`, `approved_total_amount` — one row per (month, country). Any order.","setup":"\nCREATE TABLE Transactions (\n  id         INT PRIMARY KEY,\n  country    VARCHAR(4),\n  state      VARCHAR(10),\n  amount     INT,\n  trans_date DATE\n);\n\nINSERT INTO Transactions VALUES\n  (1, 'US', 'approved', 500, '2024-03-02'),\n  (2, 'US', 'declined', 200, '2024-03-15'),\n  (3, 'US', 'approved', 300, '2024-03-28'),\n  (4, 'BD', 'declined', 150, '2024-03-10'),\n  (5, 'BD', 'approved', 400, '2024-04-01'),\n  (6, 'US', 'approved', 250, '2024-04-05'),\n  (7, NULL, 'approved', 100, '2024-04-09'),\n  (8, 'BD', 'approved', 350, '2024-04-30'),\n  (9, 'US', 'approved', 700, '2023-03-20');\n","tables":["Transactions"],"table_notes":{"Transactions":"Row 9 is March **2023**, not March 2024 — the month key must include the year. Row 7 has no country. BD in March 2024 has only a declined transaction."},"solution":"\nSELECT TO_CHAR(trans_date, 'YYYY-MM') AS month,\n       country,\n       COUNT(*) AS trans_count,\n       SUM(CASE WHEN state = 'approved' THEN 1 ELSE 0 END) AS approved_count,\n       SUM(amount) AS trans_total_amount,\n       SUM(CASE WHEN state = 'approved' THEN amount ELSE 0 END) AS approved_total_amount\nFROM Transactions\nGROUP BY TO_CHAR(trans_date, 'YYYY-MM'), country;\n","display_sql":"\nSELECT TO_CHAR(trans_date, 'YYYY-MM') AS month,\n       country,\n       COUNT(*) AS trans_count,\n       SUM(CASE WHEN state = 'approved' THEN 1 ELSE 0 END) AS approved_count,\n       SUM(amount) AS trans_total_amount,\n       SUM(CASE WHEN state = 'approved' THEN amount ELSE 0 END) AS approved_total_amount\nFROM Transactions\nGROUP BY TO_CHAR(trans_date, 'YYYY-MM'), country\nORDER BY month, country;\n","output_notes":["**2023-03 US** — the single 2023 transaction gets its own row; it is not mixed with March 2024.","**2024-03 BD: 1 / 0 / 150 / 0** — one declined transaction. The approved values are 0, not NULL, thanks to `ELSE 0`.","**2024-03 US: 3 / 2 / 1000 / 800** — rows 1, 2, 3; the declined 200 counts in the totals but not in the approved columns.","**2024-04 BD: 2 / 2 / 750 / 750** and **2024-04 US: 1 / 1 / 250 / 250** — every transaction approved.","**2024-04 NULL country** — row 7 has no country; GROUP BY puts NULLs together in their own group, so it is still reported."],"breakdown":[{"code":"TO_CHAR(trans_date, 'YYYY-MM') AS month","text":"Format the date as text like `2024-03`. This keeps **year and month** together, so March 2023 and March 2024 stay separate."},{"code":"country","text":"The second grouping key."},{"code":"COUNT(*) AS trans_count","text":"All transactions in the group, approved or not."},{"code":"SUM(CASE WHEN state = 'approved' THEN 1 ELSE 0 END) AS approved_count","text":"Each approved row contributes 1, others 0 → number of approved transactions."},{"code":"SUM(amount) AS trans_total_amount","text":"Total amount of all transactions in the group."},{"code":"SUM(CASE WHEN state = 'approved' THEN amount ELSE 0 END) AS approved_total_amount","text":"Approved rows contribute their amount, others 0. Without `ELSE 0`, a group with no approved row would return NULL instead of 0."},{"code":"FROM Transactions","text":"One table, 9 rows."},{"code":"GROUP BY TO_CHAR(trans_date, 'YYYY-MM'), country","text":"One group per (month, country). Repeating the expression is standard SQL; PostgreSQL would also accept `GROUP BY month, country`."}],"exec_order":[{"stage":"FROM","code":"Transactions","text":"9 rows."},{"stage":"GROUP BY","code":"TO_CHAR(trans_date, 'YYYY-MM'), country","text":"Compute the month for each row and form 6 (month, country) groups, including the NULL-country group."},{"stage":"SELECT","code":"COUNT(*), SUM(CASE …), SUM(amount), SUM(CASE …)","text":"Four aggregates per group."}],"visuals":[{"kind":"case","title":"Step 1 — Per row: the month key and the \"approved only\" values","diagram":"\ntrans_date ──TO_CHAR(…, 'YYYY-MM')──▶ month\nstate = 'approved' ?\n   yes → approved_flag = 1, approved_amount = amount\n   no  → approved_flag = 0, approved_amount = 0\n","sql":"\nSELECT id,\n       trans_date,\n       TO_CHAR(trans_date, 'YYYY-MM') AS month,\n       country,\n       state,\n       amount,\n       CASE WHEN state = 'approved' THEN 1 ELSE 0 END      AS approved_flag,\n       CASE WHEN state = 'approved' THEN amount ELSE 0 END AS approved_amount\nFROM Transactions\nORDER BY month, country, id;\n","text":"Each row now carries the values the SUMs will add up. Declined rows 2 and 4 get 0 in both helper columns but keep their full `amount`. Row 9 gets month `2023-03`, so it will not join the March 2024 rows."},{"kind":"group","title":"Step 2 — GROUP BY (month, country) and add everything up","diagram":"\n2023-03\n └─ US ── #9 700 ✓                    → 1 · 1 · 700  · 700\n2024-03\n ├─ BD ── #4 150 ✗                    → 1 · 0 · 150  · 0\n └─ US ─┬ #1 500 ✓\n        ├ #2 200 ✗\n        └ #3 300 ✓                    → 3 · 2 · 1000 · 800\n2024-04\n ├─ BD ─┬ #5 400 ✓\n │      └ #8 350 ✓                    → 2 · 2 · 750  · 750\n ├─ US ── #6 250 ✓                    → 1 · 1 · 250  · 250\n └─ NULL ─ #7 100 ✓                   → 1 · 1 · 100  · 100\n(count · approved_count · total · approved_total)\n","sql":"\nSELECT TO_CHAR(trans_date, 'YYYY-MM') AS month,\n       country,\n       COUNT(*)                                                  AS trans_count,\n       SUM(CASE WHEN state = 'approved' THEN 1 ELSE 0 END)       AS approved_count,\n       SUM(amount)                                               AS trans_total_amount,\n       SUM(CASE WHEN state = 'approved' THEN amount ELSE 0 END)  AS approved_total_amount,\n       SUM(CASE WHEN state = 'approved' THEN amount END)         AS no_else_wrong\nFROM Transactions\nGROUP BY TO_CHAR(trans_date, 'YYYY-MM'), country\nORDER BY month, country;\n","text":"Six groups. Look at **2024-03 BD**: its only row is declined, so the version without `ELSE 0` (`no_else_wrong`) sums nothing but NULLs and returns NULL. With `ELSE 0` we correctly get 0. The NULL-country row forms its own group instead of disappearing."}],"flow":[{"label":"Input table","detail":"Transactions (9 rows)","ref":"input"},{"label":"Month key + CASE helpers","detail":"TO_CHAR(…, 'YYYY-MM'), 1/0 and amount/0 per row","ref":0},{"label":"GROUP BY month, country","detail":"COUNT, SUM(CASE), SUM(amount), SUM(CASE) → 6 groups","ref":1},{"label":"Final output","detail":"one row per (month, country)","ref":"output"}],"takeaway":{"pattern":"\"Totals and filtered totals in the same row\" → one GROUP BY with plain aggregates next to `SUM(CASE WHEN condition THEN value ELSE 0 END)`.","asks":["Why not `EXTRACT(MONTH FROM trans_date)`? (It returns only 3 for every March, mixing different years; the output also needs the `YYYY-MM` text format.)","Why not filter `WHERE state = 'approved'`? (Declined rows would vanish from trans_count and trans_total_amount too.)","What happens to a NULL country? (GROUP BY treats all NULLs as one group, so it appears as a row with country NULL.)","Can you write the approved count another way? (`COUNT(CASE WHEN state = 'approved' THEN 1 END)` — COUNT skips the NULLs produced when there is no ELSE.)"],"alternatives":["`DATE_TRUNC('month', trans_date)` groups by month too, but returns a timestamp like `2024-03-01 00:00:00`; you would still need TO_CHAR for the `YYYY-MM` format.","PostgreSQL's `SUM(amount) FILTER (WHERE state = 'approved')` is shorter, but CASE WHEN works in every database and is what interviewers expect."],"realworld":"Monthly finance reports: payments vs successful payments per market, orders vs shipped orders per region, sign-ups vs verified sign-ups per channel."},"mistakes":["Grouping by month number only (`EXTRACT(MONTH …)`) — March 2023 and March 2024 get merged.","Leaving out `ELSE 0` — groups with no approved rows return NULL instead of 0.","Filtering approved rows in WHERE — the overall counts and totals become wrong.","Using MySQL's `DATE_FORMAT(trans_date, '%Y-%m')` — it does not exist in PostgreSQL; use `TO_CHAR(trans_date, 'YYYY-MM')`."],"built":{"id":20,"inputs":[{"name":"Transactions","columns":["id","country","state","amount","trans_date"],"types":["integer","character varying(4)","character varying(10)","integer","date"],"rows":[[1,"US","approved",500,"2024-03-02"],[2,"US","declined",200,"2024-03-15"],[3,"US","approved",300,"2024-03-28"],[4,"BD","declined",150,"2024-03-10"],[5,"BD","approved",400,"2024-04-01"],[6,"US","approved",250,"2024-04-05"],[7,null,"approved",100,"2024-04-09"],[8,"BD","approved",350,"2024-04-30"],[9,"US","approved",700,"2023-03-20"]]}],"visuals":[{"columns":["id","trans_date","month","country","state","amount","approved_flag","approved_amount"],"types":["integer","date","text","character varying(4)","character varying(10)","integer","integer","integer"],"rows":[[9,"2023-03-20","2023-03","US","approved",700,1,700],[4,"2024-03-10","2024-03","BD","declined",150,0,0],[1,"2024-03-02","2024-03","US","approved",500,1,500],[2,"2024-03-15","2024-03","US","declined",200,0,0],[3,"2024-03-28","2024-03","US","approved",300,1,300],[5,"2024-04-01","2024-04","BD","approved",400,1,400],[8,"2024-04-30","2024-04","BD","approved",350,1,350],[6,"2024-04-05","2024-04","US","approved",250,1,250],[7,"2024-04-09","2024-04",null,"approved",100,1,100]]},{"columns":["month","country","trans_count","approved_count","trans_total_amount","approved_total_amount","no_else_wrong"],"types":["text","character varying(4)","bigint","bigint","bigint","bigint","bigint"],"rows":[["2023-03","US",1,1,700,700,700],["2024-03","BD",1,0,150,0,null],["2024-03","US",3,2,1000,800,800],["2024-04","BD",2,2,750,750,750],["2024-04","US",1,1,250,250,250],["2024-04",null,1,1,100,100,100]]}],"output":{"columns":["month","country","trans_count","approved_count","trans_total_amount","approved_total_amount"],"types":["text","character varying(4)","bigint","bigint","bigint","bigint"],"rows":[["2023-03","US",1,1,700,700],["2024-03","BD",1,0,150,0],["2024-03","US",3,2,1000,800],["2024-04","BD",2,2,750,750],["2024-04","US",1,1,250,250],["2024-04",null,1,1,100,100]]}}},{"id":21,"lc":1174,"slug":"immediate-food-delivery-ii","title":"Immediate Food Delivery II","section":"Basic Aggregate Functions","difficulty":"Medium","concepts":["CTE","MIN per group","JOIN back to the detail rows","CASE WHEN","Percentage with 100.0"],"pattern":"Find each entity's first event (MIN per group in a CTE), join back to get that event's row, then compute a percentage over those rows.","statement":["Each row of `Delivery` is a food order: who ordered (`customer_id`), on which day (`order_date`), and on which day they want it delivered (`customer_pref_delivery_date`). An order is **immediate** when both dates are the same day, otherwise it is **scheduled**.","Look only at each customer's **first order** (their earliest `order_date`; every customer has exactly one). What percentage of these first orders are immediate?"],"returns":"A single row with one column, `immediate_percentage`, rounded to 2 decimals.","setup":"\nCREATE TABLE Delivery (\n  delivery_id                 INT PRIMARY KEY,\n  customer_id                 INT,\n  order_date                  DATE,\n  customer_pref_delivery_date DATE\n);\n\nINSERT INTO Delivery VALUES\n  (1,  101, '2024-05-01', '2024-05-04'),\n  (2,  102, '2024-05-02', '2024-05-02'),\n  (3,  101, '2024-05-03', '2024-05-03'),\n  (4,  103, '2024-05-07', '2024-05-09'),\n  (5,  104, '2024-05-06', '2024-05-08'),\n  (6,  103, '2024-05-05', '2024-05-05'),\n  (7,  105, '2024-05-04', '2024-05-06'),\n  (8,  102, '2024-05-09', '2024-05-11'),\n  (9,  105, '2024-05-08', '2024-05-10'),\n  (10, 106, '2024-05-10', '2024-05-12');\n","tables":["Delivery"],"table_notes":{"Delivery":"Customer 101's second order is immediate, but the first one is not. Customer 103's first order (May 5) has a **higher** delivery_id than its later order — \"first\" means earliest date, not smallest id."},"solution":"\nWITH first_dates AS (\n    SELECT customer_id,\n           MIN(order_date) AS first_order_date\n    FROM Delivery\n    GROUP BY customer_id\n),\nfirst_orders AS (\n    SELECT d.customer_id,\n           d.delivery_id,\n           d.order_date,\n           d.customer_pref_delivery_date,\n           CASE WHEN d.order_date = d.customer_pref_delivery_date THEN 1 ELSE 0 END AS is_immediate\n    FROM Delivery AS d\n    INNER JOIN first_dates AS f\n            ON f.customer_id      = d.customer_id\n           AND f.first_order_date = d.order_date\n)\nSELECT ROUND(SUM(is_immediate) * 100.0 / COUNT(*), 2) AS immediate_percentage\nFROM first_orders;\n","output_notes":["**33.33** — there are 6 customers, so 6 first orders. Only customer 102 (order 2) and customer 103 (order 6) ordered for the same day: 2 / 6 × 100 = 33.333… → 33.33.","Order 3 (customer 101) is immediate but is **not** a first order, so it does not count. Over all 10 orders the share of immediate orders would be 30%, a different (wrong) answer."],"breakdown":[{"code":"WITH first_dates AS (\n    SELECT customer_id, MIN(order_date) AS first_order_date\n    FROM Delivery\n    GROUP BY customer_id\n)","text":"For each customer, the date of their earliest order. One row per customer (6 rows)."},{"code":"first_orders AS (\n    SELECT d.customer_id, d.delivery_id, …\n    FROM Delivery AS d\n    INNER JOIN first_dates AS f\n            ON f.customer_id = d.customer_id\n           AND f.first_order_date = d.order_date\n)","text":"MIN only gave us a date; we need the whole order to compare its two dates. Joining back on **customer and date** picks exactly each customer's first order row."},{"code":"CASE WHEN d.order_date = d.customer_pref_delivery_date THEN 1 ELSE 0 END AS is_immediate","text":"Mark each first order with 1 if immediate, 0 if scheduled."},{"code":"SUM(is_immediate) * 100.0 / COUNT(*)","text":"Immediate first orders ÷ all first orders × 100. `100.0` makes the math NUMERIC — with `100`, 200 / 6 would be truncated to 33."},{"code":"ROUND(…, 2) AS immediate_percentage","text":"Round to 2 decimals (valid because the value is NUMERIC)."},{"code":"FROM first_orders","text":"The whole CTE is one group, so the result is a single row."}],"exec_order":[{"stage":"FROM","code":"first_dates: Delivery","text":"Read all 10 orders."},{"stage":"GROUP BY","code":"first_dates: customer_id","text":"6 customer groups."},{"stage":"SELECT","code":"first_dates: MIN(order_date)","text":"Earliest date per customer."},{"stage":"FROM","code":"first_orders: Delivery d","text":"All 10 orders again."},{"stage":"JOIN / ON","code":"first_orders: INNER JOIN first_dates f ON customer AND date","text":"Keep only the order made on each customer's first date → 6 rows."},{"stage":"SELECT","code":"first_orders: CASE WHEN … THEN 1 ELSE 0 END","text":"Flag immediate first orders."},{"stage":"FROM","code":"first_orders","text":"Final query reads the 6 first orders."},{"stage":"SELECT","code":"ROUND(SUM(is_immediate) * 100.0 / COUNT(*), 2)","text":"2 / 6 × 100 → 33.33."}],"visuals":[{"kind":"cte","title":"Step 1 — CTE first_dates: each customer's earliest order date","diagram":"\nDelivery ──▶ first_dates ──▶ first_orders ──▶ percentage\n\ncustomer 101 ├─ 05-01 ◀ MIN └─ 05-03\ncustomer 102 ├─ 05-02 ◀ MIN └─ 05-09\ncustomer 103 ├─ 05-07       └─ 05-05 ◀ MIN\ncustomer 104 └─ 05-06 ◀ MIN\ncustomer 105 ├─ 05-04 ◀ MIN └─ 05-08\ncustomer 106 └─ 05-10 ◀ MIN\n","sql":"\nSELECT customer_id,\n       MIN(order_date) AS first_order_date\nFROM Delivery\nGROUP BY customer_id\nORDER BY customer_id;\n","text":"GROUP BY customer collapses the 10 orders to 6 customers, and MIN picks the earliest date. For customer 103 that is May 5 (order 6), even though order 4 was inserted first. This CTE only knows **dates** — the next step needs the full order rows."},{"kind":"cte","title":"Step 2 — CTE first_orders: join back and flag immediate","diagram":"\nDelivery d                      first_dates f\n  d.customer_id ── = ──▶  f.customer_id\n  d.order_date  ── = ──▶  f.first_order_date\n\n  match    → this is the customer's first order ✓\n  no match → a later order, dropped ✗\n  then: order_date = customer_pref_delivery_date ? 1 : 0\n","sql":"\nWITH first_dates AS (\n    SELECT customer_id,\n           MIN(order_date) AS first_order_date\n    FROM Delivery\n    GROUP BY customer_id\n)\nSELECT d.customer_id,\n       d.delivery_id,\n       d.order_date,\n       d.customer_pref_delivery_date,\n       CASE WHEN d.order_date = d.customer_pref_delivery_date THEN 1 ELSE 0 END AS is_immediate\nFROM Delivery AS d\nINNER JOIN first_dates AS f\n        ON f.customer_id      = d.customer_id\n       AND f.first_order_date = d.order_date\nORDER BY d.customer_id;\n","text":"Only 6 of the 10 orders survive — one per customer. Order 3 (customer 101's immediate order) is gone because May 3 is not 101's first date. Customer 102's order 2 and customer 103's order 6 have the same order and delivery date, so `is_immediate = 1`."},{"kind":"group","title":"Step 3 — Final SELECT: immediate first orders ÷ all first orders","diagram":"\nfirst_orders (6 rows, one group)\n ├─ 101  0\n ├─ 102  1\n ├─ 103  1\n ├─ 104  0\n ├─ 105  0\n └─ 106  0     → SUM = 2, COUNT = 6 → 2 × 100.0 / 6 = 33.333… → 33.33\n","sql":"\nWITH first_dates AS (\n    SELECT customer_id,\n           MIN(order_date) AS first_order_date\n    FROM Delivery\n    GROUP BY customer_id\n),\nfirst_orders AS (\n    SELECT d.customer_id,\n           d.delivery_id,\n           d.order_date,\n           d.customer_pref_delivery_date,\n           CASE WHEN d.order_date = d.customer_pref_delivery_date THEN 1 ELSE 0 END AS is_immediate\n    FROM Delivery AS d\n    INNER JOIN first_dates AS f\n            ON f.customer_id      = d.customer_id\n           AND f.first_order_date = d.order_date\n)\nSELECT SUM(is_immediate)                              AS immediate_first_orders,\n       COUNT(*)                                       AS all_first_orders,\n       SUM(is_immediate) * 100 / COUNT(*)             AS int_math_wrong,\n       ROUND(SUM(is_immediate) * 100.0 / COUNT(*), 2) AS immediate_percentage\nFROM first_orders;\n","text":"With no GROUP BY, the whole CTE is a single group. 2 immediate out of 6 first orders. The `int_math_wrong` column shows the integer-division trap (200 / 6 = 33); with `100.0` we get 33.33."}],"flow":[{"label":"Input table","detail":"Delivery (10 orders, 6 customers)","ref":"input"},{"label":"CTE first_dates","detail":"MIN(order_date) per customer → 6 rows","ref":0},{"label":"CTE first_orders","detail":"join back on customer + date, CASE immediate → 6 rows","ref":1},{"label":"Percentage","detail":"SUM(is_immediate) * 100.0 / COUNT(*) → 33.33","ref":2},{"label":"Final output","detail":"one value","ref":"output"}],"takeaway":{"pattern":"\"First / latest event per entity\" → MIN / MAX per group in a CTE, then join back on (entity, date) to get the full row. Then aggregate over those rows.","asks":["Why not just `MIN(order_date)` and compare it to `MIN(customer_pref_delivery_date)`? (The two MINs can come from different orders. You must compare the dates of the same row.)","How would you do it with a window function? (`ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date)` in a CTE, keep `rn = 1`.)","What if a customer could have two orders on their first day? (The join would return both rows; you would need a tie-breaker such as ROW_NUMBER ordered by delivery_id. The problem guarantees exactly one first order.)","Shorter version of the percentage? (`ROUND(AVG(is_immediate) * 100, 2)` — AVG of 0/1 flags is the fraction; in PostgreSQL AVG of integers is NUMERIC.)"],"alternatives":["Tuple IN subquery: `WHERE (customer_id, order_date) IN (SELECT customer_id, MIN(order_date) FROM Delivery GROUP BY customer_id)` — compact and standard, same logic as the join.","Window function: `ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date) AS rn` in a CTE, then filter `rn = 1`."],"realworld":"First-purchase analysis: share of customers whose first order used a coupon, share of new users whose first session came from mobile, first-ticket resolution rate."},"mistakes":["Computing the percentage over **all** orders instead of first orders only (gives 30.00 here).","Taking `MIN(order_date)` and `MIN(customer_pref_delivery_date)` separately — they may belong to different orders.","Assuming the smallest `delivery_id` is the first order — customer 103 shows it is not.","Joining back on `customer_id` only — every order of the customer would match.","Using `* 100` instead of `* 100.0`, or calling ROUND(…, 2) on a double precision value — both break in PostgreSQL."],"built":{"id":21,"inputs":[{"name":"Delivery","columns":["delivery_id","customer_id","order_date","customer_pref_delivery_date"],"types":["integer","integer","date","date"],"rows":[[1,101,"2024-05-01","2024-05-04"],[2,102,"2024-05-02","2024-05-02"],[3,101,"2024-05-03","2024-05-03"],[4,103,"2024-05-07","2024-05-09"],[5,104,"2024-05-06","2024-05-08"],[6,103,"2024-05-05","2024-05-05"],[7,105,"2024-05-04","2024-05-06"],[8,102,"2024-05-09","2024-05-11"],[9,105,"2024-05-08","2024-05-10"],[10,106,"2024-05-10","2024-05-12"]]}],"visuals":[{"columns":["customer_id","first_order_date"],"types":["integer","date"],"rows":[[101,"2024-05-01"],[102,"2024-05-02"],[103,"2024-05-05"],[104,"2024-05-06"],[105,"2024-05-04"],[106,"2024-05-10"]]},{"columns":["customer_id","delivery_id","order_date","customer_pref_delivery_date","is_immediate"],"types":["integer","integer","date","date","integer"],"rows":[[101,1,"2024-05-01","2024-05-04",0],[102,2,"2024-05-02","2024-05-02",1],[103,6,"2024-05-05","2024-05-05",1],[104,5,"2024-05-06","2024-05-08",0],[105,7,"2024-05-04","2024-05-06",0],[106,10,"2024-05-10","2024-05-12",0]]},{"columns":["immediate_first_orders","all_first_orders","int_math_wrong","immediate_percentage"],"types":["bigint","bigint","bigint","numeric"],"rows":[[2,6,33,"33.33"]]}],"output":{"columns":["immediate_percentage"],"types":["numeric"],"rows":[["33.33"]]}}},{"id":22,"lc":550,"slug":"game-play-analysis-iv","title":"Game Play Analysis IV","section":"Basic Aggregate Functions","difficulty":"Medium","concepts":["CTE","MIN per group","LEFT JOIN on date + 1","COUNT(column) vs COUNT(*)","ROUND + NUMERIC"],"pattern":"Find each player's first day (MIN in a CTE), LEFT JOIN the activity on first day + 1, then divide matches by players.","statement":["`Activity` has one row per player per day they logged in (a player never has two rows on the same day): the player, the device, the date, and how many games they played.","What **fraction of all players** logged in again on the day **right after** their very first login?"],"returns":"A single row with one column, `fraction`, rounded to 2 decimals.","setup":"\nCREATE TABLE Activity (\n  player_id    INT,\n  device_id    INT,\n  event_date   DATE,\n  games_played INT,\n  PRIMARY KEY (player_id, event_date)\n);\n\nINSERT INTO Activity VALUES\n  (1, 11, '2024-02-27', 3),\n  (1, 11, '2024-02-28', 1),\n  (2, 12, '2024-03-01', 5),\n  (2, 12, '2024-03-03', 2),\n  (3, 13, '2024-03-05', 0),\n  (4, 14, '2024-03-01', 4),\n  (4, 14, '2024-02-29', 6),\n  (5, 15, '2024-03-01', 2),\n  (5, 16, '2024-03-06', 1),\n  (5, 15, '2024-03-07', 3),\n  (6, 17, '2024-03-10', 1);\n","tables":["Activity"],"table_notes":{"Activity":"Player 4 starts on Feb 29 (2024 is a leap year) and returns on Mar 1. Player 5 has two consecutive days, but not right after the first login. Player 2 came back after 2 days, not 1."},"solution":"\nWITH first_login AS (\n    SELECT player_id,\n           MIN(event_date) AS first_date\n    FROM Activity\n    GROUP BY player_id\n),\nnext_day AS (\n    SELECT f.player_id,\n           f.first_date,\n           a.event_date AS next_day_login\n    FROM first_login AS f\n    LEFT JOIN Activity AS a\n           ON a.player_id  = f.player_id\n          AND a.event_date = f.first_date + 1\n)\nSELECT ROUND(COUNT(next_day_login) * 1.0 / COUNT(*), 2) AS fraction\nFROM next_day;\n","output_notes":["**0.33** — 6 players in total. Only player 1 (Feb 27 → Feb 28) and player 4 (Feb 29 → Mar 1) logged in on the day after their first login: 2 / 6 = 0.333… → 0.33.","Player 5's Mar 6 → Mar 7 streak does not count: the first login was Mar 1, and there is no login on Mar 2.","Players 2, 3 and 6 never logged in on first day + 1."],"breakdown":[{"code":"WITH first_login AS (\n    SELECT player_id, MIN(event_date) AS first_date\n    FROM Activity\n    GROUP BY player_id\n)","text":"One row per player with the date of their very first login."},{"code":"next_day AS (\n    SELECT f.player_id, f.first_date, a.event_date AS next_day_login\n    FROM first_login AS f\n    LEFT JOIN Activity AS a …","text":"For every player, look for an activity row exactly one day after the first login. Starting from `first_login` with a LEFT JOIN keeps **every** player — the ones who did not return get NULL."},{"code":"ON a.player_id = f.player_id\nAND a.event_date = f.first_date + 1","text":"Same player **and** date = first date + 1. In PostgreSQL, `DATE + INTEGER` adds days and returns a DATE, and it handles month ends and leap days (Feb 29 + 1 = Mar 1)."},{"code":"COUNT(next_day_login)","text":"COUNT of a column skips NULLs → number of players who came back the next day."},{"code":"* 1.0 / COUNT(*)","text":"COUNT(*) counts all rows = all players. Both counts are integers (bigint), so `2 / 6` would be **0**; multiplying by `1.0` first switches to NUMERIC division."},{"code":"ROUND(…, 2) AS fraction","text":"Round to 2 decimals; valid because the value is already NUMERIC."}],"exec_order":[{"stage":"FROM","code":"first_login: Activity","text":"11 login rows."},{"stage":"GROUP BY","code":"first_login: player_id","text":"6 players."},{"stage":"SELECT","code":"first_login: MIN(event_date)","text":"First login date per player."},{"stage":"FROM","code":"next_day: first_login f","text":"6 players."},{"stage":"JOIN / ON","code":"next_day: LEFT JOIN Activity a ON player AND a.event_date = f.first_date + 1","text":"At most one match per player (one row per player per day) → still 6 rows."},{"stage":"FROM","code":"next_day","text":"Final query reads the 6 rows."},{"stage":"SELECT","code":"ROUND(COUNT(next_day_login) * 1.0 / COUNT(*), 2)","text":"2 / 6 → 0.33."}],"visuals":[{"kind":"cte","title":"Step 1 — CTE first_login: each player's first day","diagram":"\nActivity ──▶ first_login ──▶ next_day ──▶ fraction\n\nplayer 1 ├─ 02-27 ◀ MIN └─ 02-28\nplayer 2 ├─ 03-01 ◀ MIN └─ 03-03\nplayer 3 └─ 03-05 ◀ MIN\nplayer 4 ├─ 03-01       └─ 02-29 ◀ MIN\nplayer 5 ├─ 03-01 ◀ MIN ├─ 03-06 └─ 03-07\nplayer 6 └─ 03-10 ◀ MIN\n","sql":"\nSELECT player_id,\n       MIN(event_date) AS first_date\nFROM Activity\nGROUP BY player_id\nORDER BY player_id;\n","text":"GROUP BY player and MIN give each player's first login: player 4's is Feb 29 even though the Mar 1 row was inserted first. Now we know which date to add 1 to; the next CTE checks whether that following day exists."},{"kind":"cte","title":"Step 2 — CTE next_day: is there a login on first_date + 1?","diagram":"\nfirst_login f (6 players)            Activity a\n  f.player_id     ── = ──▶  a.player_id\n  f.first_date + 1 ─ = ──▶  a.event_date\n\n  player 1: 02-27 + 1 = 02-28  ✓ found\n  player 4: 02-29 + 1 = 03-01  ✓ found\n  player 5: 03-01 + 1 = 03-02  ✗ NULL (03-06 / 03-07 do not matter)\n  players 2, 3, 6              ✗ NULL\n","sql":"\nWITH first_login AS (\n    SELECT player_id,\n           MIN(event_date) AS first_date\n    FROM Activity\n    GROUP BY player_id\n)\nSELECT f.player_id,\n       f.first_date,\n       f.first_date + 1 AS day_after_first,\n       a.event_date     AS next_day_login\nFROM first_login AS f\nLEFT JOIN Activity AS a\n       ON a.player_id  = f.player_id\n      AND a.event_date = f.first_date + 1\nORDER BY f.player_id;\n","text":"The LEFT JOIN keeps all 6 players. Players 1 and 4 found a row on the day after their first login; everyone else has `NULL` in `next_day_login`. The extra `day_after_first` column shows the date each player was checked against — Feb 29 + 1 correctly becomes Mar 1."},{"kind":"group","title":"Step 3 — Final SELECT: returned players ÷ all players","diagram":"\nnext_day (6 rows, one group)\n ├─ 1  02-28  ✓\n ├─ 2  NULL\n ├─ 3  NULL\n ├─ 4  03-01  ✓\n ├─ 5  NULL\n └─ 6  NULL      → COUNT(next_day_login) = 2, COUNT(*) = 6\n                 → 2 * 1.0 / 6 = 0.333… → 0.33\n","sql":"\nWITH first_login AS (\n    SELECT player_id,\n           MIN(event_date) AS first_date\n    FROM Activity\n    GROUP BY player_id\n),\nnext_day AS (\n    SELECT f.player_id,\n           f.first_date,\n           a.event_date AS next_day_login\n    FROM first_login AS f\n    LEFT JOIN Activity AS a\n           ON a.player_id  = f.player_id\n          AND a.event_date = f.first_date + 1\n)\nSELECT COUNT(next_day_login)                            AS returned_players,\n       COUNT(*)                                         AS all_players,\n       COUNT(next_day_login) / COUNT(*)                 AS int_division_wrong,\n       ROUND(COUNT(next_day_login) * 1.0 / COUNT(*), 2) AS fraction\nFROM next_day;\n","text":"`COUNT(next_day_login)` ignores the NULLs → 2; `COUNT(*)` counts every player → 6. Plain integer division gives **0** (`int_division_wrong`); with `* 1.0` we get 0.333…, rounded to 0.33."}],"flow":[{"label":"Input table","detail":"Activity (11 logins, 6 players)","ref":"input"},{"label":"CTE first_login","detail":"MIN(event_date) per player → 6 rows","ref":0},{"label":"CTE next_day","detail":"LEFT JOIN on first_date + 1 → NULL if not back","ref":1},{"label":"Fraction","detail":"COUNT(next_day_login) * 1.0 / COUNT(*) → 0.33","ref":2},{"label":"Final output","detail":"one value","ref":"output"}],"takeaway":{"pattern":"\"Did X happen exactly N days after the first event?\" → MIN date per entity in a CTE, LEFT JOIN on (entity, first_date + N), COUNT(matched column) / COUNT(*).","asks":["Why LEFT JOIN instead of INNER JOIN? (INNER JOIN would drop the players who did not return, and COUNT(*) would no longer be the total number of players.)","Why compare to the **first** login and not any login? (The question is about the day after the first login; player 5's later streak must not count.)","Other ways to add a day? (`f.first_date + INTERVAL '1 day'` returns a timestamp, which still compares correctly with a DATE; `DATE + 1` keeps the DATE type.)","Window-function version? (`LEAD(event_date) OVER (PARTITION BY player_id ORDER BY event_date)` on the first row: the player returned if that next date = first date + 1.)"],"alternatives":["`SELECT ROUND(COUNT(*) * 1.0 / (SELECT COUNT(DISTINCT player_id) FROM Activity), 2) FROM Activity a INNER JOIN first_login f ON a.player_id = f.player_id AND a.event_date = f.first_date + 1` — inner join for the numerator, scalar subquery for the denominator.","`(player_id, event_date - 1) IN (SELECT player_id, MIN(event_date) FROM Activity GROUP BY player_id)` to count matching rows, divided by the distinct player count."],"realworld":"Day-1 retention: share of new users who come back the day after sign-up. The same shape gives day-7 / day-30 retention by changing `+ 1` to `+ 7` / `+ 30`."},"mistakes":["Checking for **any** two consecutive days — player 5 (Mar 6 → Mar 7) would be counted wrongly.","Integer division: `COUNT(…) / COUNT(*)` returns 0 for 2 / 6. Multiply by `1.0` (or cast to NUMERIC) first.","Using INNER JOIN and then COUNT(*) as the denominator — it counts only returning players, so the fraction is always 1.","Dividing by the number of Activity rows instead of the number of players.","Building the next day with string tricks or `EXTRACT(DAY …) + 1` — breaks at month ends (Feb 29 → Mar 1). Use date arithmetic."],"built":{"id":22,"inputs":[{"name":"Activity","columns":["player_id","device_id","event_date","games_played"],"types":["integer","integer","date","integer"],"rows":[[1,11,"2024-02-27",3],[1,11,"2024-02-28",1],[2,12,"2024-03-01",5],[2,12,"2024-03-03",2],[3,13,"2024-03-05",0],[4,14,"2024-03-01",4],[4,14,"2024-02-29",6],[5,15,"2024-03-01",2],[5,16,"2024-03-06",1],[5,15,"2024-03-07",3],[6,17,"2024-03-10",1]]}],"visuals":[{"columns":["player_id","first_date"],"types":["integer","date"],"rows":[[1,"2024-02-27"],[2,"2024-03-01"],[3,"2024-03-05"],[4,"2024-02-29"],[5,"2024-03-01"],[6,"2024-03-10"]]},{"columns":["player_id","first_date","day_after_first","next_day_login"],"types":["integer","date","date","date"],"rows":[[1,"2024-02-27","2024-02-28","2024-02-28"],[2,"2024-03-01","2024-03-02",null],[3,"2024-03-05","2024-03-06",null],[4,"2024-02-29","2024-03-01","2024-03-01"],[5,"2024-03-01","2024-03-02",null],[6,"2024-03-10","2024-03-11",null]]},{"columns":["returned_players","all_players","int_division_wrong","fraction"],"types":["bigint","bigint","bigint","numeric"],"rows":[[2,6,0,"0.33"]]}],"output":{"columns":["fraction"],"types":["numeric"],"rows":[["0.33"]]}}},{"id":23,"lc":2356,"slug":"number-of-unique-subjects-taught-by-each-teacher","title":"Number of Unique Subjects Taught by Each Teacher","section":"Sorting and Grouping","difficulty":"Easy","concepts":["GROUP BY","COUNT(DISTINCT)","COUNT(*) vs COUNT(DISTINCT)"],"pattern":"\"How many different X per Y\" → GROUP BY Y and COUNT(DISTINCT X).","statement":["A university stores one row per **(subject, department)** assignment in the `Teacher` table: the row says which teacher teaches that subject in that department. The same teacher can teach the **same subject in several departments**, so a subject can appear more than once for one teacher.","For every teacher, count how many **different** subjects they teach. A subject taught in two departments still counts only once."],"returns":"One row per teacher: `teacher_id` and `cnt` (the number of distinct subjects). Any order.","setup":"CREATE TABLE Teacher (\n  teacher_id INT,\n  subject_id INT,\n  dept_id    INT,\n  PRIMARY KEY (subject_id, dept_id)\n);\n\nINSERT INTO Teacher VALUES\n  (1, 1, 1),\n  (1, 1, 2),\n  (1, 2, 1),\n  (2, 3, 1),\n  (2, 4, 2),\n  (2, 2, 3),\n  (3, 5, 1),\n  (3, 5, 3),\n  (3, 5, 4);","tables":["Teacher"],"table_notes":{"Teacher":"Teacher 1 teaches subject 1 in departments 1 **and** 2. Teacher 3 teaches subject 5 in three departments. Teacher 2 has no repeats."},"solution":"SELECT teacher_id,\n       COUNT(DISTINCT subject_id) AS cnt\nFROM Teacher\nGROUP BY teacher_id;","display_sql":"SELECT teacher_id,\n       COUNT(DISTINCT subject_id) AS cnt\nFROM Teacher\nGROUP BY teacher_id\nORDER BY teacher_id;","output_notes":["**Teacher 1 → 2** — three rows, but subject 1 appears twice (departments 1 and 2). The distinct subjects are {1, 2}.","**Teacher 2 → 3** — three rows and three different subjects {2, 3, 4}, so both counts agree.","**Teacher 3 → 1** — three rows, all for subject 5. One distinct subject."],"breakdown":[{"code":"FROM Teacher","text":"Read all 9 assignment rows."},{"code":"GROUP BY teacher_id","text":"Make one group per teacher (3 groups, 3 rows each)."},{"code":"COUNT(DISTINCT subject_id) AS cnt","text":"Inside each group, remove duplicate `subject_id` values first, then count what is left. `COUNT(*)` or `COUNT(subject_id)` would count rows — a subject taught in two departments would be counted twice."},{"code":"SELECT teacher_id","text":"`teacher_id` is the grouping column, so it can be selected directly. The problem accepts any order, so no ORDER BY is required."}],"exec_order":[{"stage":"FROM","code":"Teacher","text":"9 rows."},{"stage":"GROUP BY","code":"teacher_id","text":"3 groups: teachers 1, 2 and 3."},{"stage":"SELECT","code":"teacher_id, COUNT(DISTINCT subject_id)","text":"One row per group with the number of different subjects."}],"visuals":[{"kind":"group","title":"Step 1 — Where do the duplicates come from?","diagram":"Teacher rows grouped by (teacher_id, subject_id)\n\n(1, subject 1)\n ├─ dept 1\n └─ dept 2          → 2 rows, but ONE subject\n(1, subject 2)\n └─ dept 1          → 1 row\n(3, subject 5)\n ├─ dept 1\n ├─ dept 3\n └─ dept 4          → 3 rows, but ONE subject","sql":"SELECT teacher_id,\n       subject_id,\n       COUNT(*) AS rows_in_table,\n       STRING_AGG(CAST(dept_id AS VARCHAR), ', ' ORDER BY dept_id) AS departments\nFROM Teacher\nGROUP BY teacher_id, subject_id\nORDER BY teacher_id, subject_id;","text":"The table's key is **(subject_id, dept_id)**, not (teacher_id, subject_id). So when a teacher teaches the same subject in several departments, the subject is repeated. Teacher 1 / subject 1 has 2 rows and teacher 3 / subject 5 has 3 rows. These repeats are exactly what we must not double-count."},{"kind":"group","title":"Step 2 — GROUP BY teacher_id: COUNT(*) vs COUNT(DISTINCT subject_id)","diagram":"teacher 1\n ├─ subject 1  (dept 1)\n ├─ subject 1  (dept 2)   ← repeat\n └─ subject 2  (dept 1)        → rows 3, distinct {1,2} = 2\nteacher 2\n ├─ subject 3  (dept 1)\n ├─ subject 4  (dept 2)\n └─ subject 2  (dept 3)        → rows 3, distinct {2,3,4} = 3\nteacher 3\n ├─ subject 5  (dept 1)\n ├─ subject 5  (dept 3)   ← repeat\n └─ subject 5  (dept 4)   ← repeat\n                              → rows 3, distinct {5} = 1","sql":"SELECT teacher_id,\n       STRING_AGG(CAST(subject_id AS VARCHAR), ', ' ORDER BY subject_id) AS subjects_in_group,\n       COUNT(*)                   AS count_star_WRONG,\n       COUNT(DISTINCT subject_id) AS cnt\nFROM Teacher\nGROUP BY teacher_id\nORDER BY teacher_id;","text":"Every teacher has 3 rows, so `COUNT(*)` says 3 for everyone — wrong for teachers 1 and 3. `COUNT(DISTINCT subject_id)` first collapses the repeated values (`1, 1, 2` → {1, 2}) and then counts, giving **2, 3, 1**."}],"flow":[{"label":"Input table","detail":"Teacher (9 rows, some subjects repeated across departments)","ref":"input"},{"label":"Spot the repeats","detail":"same (teacher, subject) in several departments","ref":0},{"label":"GROUP BY + COUNT(DISTINCT)","detail":"one row per teacher, repeats counted once","ref":1},{"label":"Final output","detail":"teacher_id, cnt","ref":"output"}],"takeaway":{"pattern":"\"Number of unique / different X for each Y\" → `GROUP BY Y` + `COUNT(DISTINCT X)`. Always ask: can X repeat inside a group? If yes, plain COUNT is wrong.","asks":["Why not `COUNT(subject_id)`? (It counts non-NULL rows, so a subject taught in two departments is counted twice.)","How would you do it without COUNT(DISTINCT)? (First `SELECT DISTINCT teacher_id, subject_id` in a subquery/CTE, then `COUNT(*)` per teacher.)","What does COUNT(DISTINCT) do with NULL subject_id? (Ignores it — NULLs are never counted by COUNT(column).)","How would you list the subjects too? (`STRING_AGG(DISTINCT CAST(subject_id AS VARCHAR), ',')` per teacher.)"],"alternatives":["Two-step version: `WITH pairs AS (SELECT DISTINCT teacher_id, subject_id FROM Teacher) SELECT teacher_id, COUNT(*) AS cnt FROM pairs GROUP BY teacher_id;` — same result, makes the de-duplication explicit."],"realworld":"Distinct customers per store, distinct products per order, distinct pages visited per user — any \"how many different\" metric over a table where the same value can repeat."},"mistakes":["Using `COUNT(*)` or `COUNT(subject_id)` — teacher 1 would get 3 instead of 2 because subject 1 is listed for two departments.","Grouping by `teacher_id, dept_id` — that counts subjects per department, not per teacher.","Writing `SELECT DISTINCT teacher_id, COUNT(subject_id) … GROUP BY teacher_id` — DISTINCT applies to the finished output rows, not inside the count, so the repeats are still counted."],"built":{"id":23,"inputs":[{"name":"Teacher","columns":["teacher_id","subject_id","dept_id"],"types":["integer","integer","integer"],"rows":[[1,1,1],[1,1,2],[1,2,1],[2,3,1],[2,4,2],[2,2,3],[3,5,1],[3,5,3],[3,5,4]]}],"visuals":[{"columns":["teacher_id","subject_id","rows_in_table","departments"],"types":["integer","integer","bigint","text"],"rows":[[1,1,2,"1, 2"],[1,2,1,"1"],[2,2,1,"3"],[2,3,1,"1"],[2,4,1,"2"],[3,5,3,"1, 3, 4"]]},{"columns":["teacher_id","subjects_in_group","count_star_wrong","cnt"],"types":["integer","text","bigint","bigint"],"rows":[[1,"1, 1, 2",3,2],[2,"2, 3, 4",3,3],[3,"5, 5, 5",3,1]]}],"output":{"columns":["teacher_id","cnt"],"types":["integer","bigint"],"rows":[[1,2],[2,3],[3,1]]}}},{"id":24,"lc":1141,"slug":"user-activity-for-the-past-30-days-i","title":"User Activity for the Past 30 Days I","section":"Sorting and Grouping","difficulty":"Easy","concepts":["WHERE date range","BETWEEN (inclusive)","date - INTEGER","GROUP BY","COUNT(DISTINCT)"],"pattern":"Filter to an inclusive date window, then GROUP BY day and COUNT(DISTINCT user).","statement":["The `Activity` table logs what users do on a social media site: each row is one action (open a session, scroll, send a message, end a session) by a user on a date. A user usually has several rows per day, and the table may even contain exact duplicate rows.","For the **30-day period that ends on 2019-07-27 (inclusive)**, report for each day how many **different** users were active. A user is active on a day if they have at least one row of any type on that day. Days with no activity simply do not appear."],"returns":"One row per day inside the window that has activity: `day` and `active_users` (number of distinct users). Any order.","setup":"CREATE TABLE Activity (\n  user_id       INT,\n  session_id    INT,\n  activity_date DATE,\n  activity_type VARCHAR(20)\n);\n\nINSERT INTO Activity VALUES\n  (1, 1, '2019-06-27', 'open_session'),\n  (1, 1, '2019-06-27', 'end_session'),\n  (2, 2, '2019-06-28', 'open_session'),\n  (2, 2, '2019-06-28', 'send_message'),\n  (3, 3, '2019-07-15', 'open_session'),\n  (3, 3, '2019-07-15', 'end_session'),\n  (4, 4, '2019-07-15', 'scroll_down'),\n  (4, 4, '2019-07-15', 'scroll_down'),\n  (1, 5, '2019-07-27', 'open_session'),\n  (4, 6, '2019-07-27', 'send_message'),\n  (2, 7, '2019-07-28', 'open_session');","tables":["Activity"],"table_notes":{"Activity":"Boundary rows on purpose: **06-27** is one day too early, **06-28** is the first day of the window, **07-27** is the last day, **07-28** is one day too late. User 4 has an exact duplicate row on 07-15."},"solution":"SELECT activity_date AS day,\n       COUNT(DISTINCT user_id) AS active_users\nFROM Activity\nWHERE activity_date BETWEEN DATE '2019-07-27' - 29 AND DATE '2019-07-27'\nGROUP BY activity_date;","display_sql":"SELECT activity_date AS day,\n       COUNT(DISTINCT user_id) AS active_users\nFROM Activity\nWHERE activity_date BETWEEN DATE '2019-07-27' - 29 AND DATE '2019-07-27'\nGROUP BY activity_date\nORDER BY day;","output_notes":["**2019-06-28 → 1** — the first day of the window (07-27 minus 29 days). Only user 2 was active, with 2 rows.","**2019-07-15 → 2** — users 3 and 4. There are 4 rows that day (user 4's row is even duplicated), but only 2 different users.","**2019-07-27 → 2** — the last day of the window is included because BETWEEN is inclusive. Users 1 and 4.","**2019-06-27 is missing** — it is 30 days before 07-27, which makes it the 31st day counting back. User 1's rows there are outside the windo
