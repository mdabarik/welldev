f visits with no transaction). Customers who bought something on every visit are not listed. Any order.","setup":"CREATE TABLE Visits (\n  visit_id    INT PRIMARY KEY,\n  customer_id INT\n);\nCREATE TABLE Transactions (\n  transaction_id INT PRIMARY KEY,\n  visit_id       INT,\n  amount         INT\n);\n\nINSERT INTO Visits VALUES\n  (1, 501), (2, 502), (3, 501), (4, 503),\n  (5, 501), (6, 504), (7, 502);\nINSERT INTO Transactions VALUES\n  (10, 1, 120), (11, 1, 35), (12, 2, 80), (13, 6, 200);","tables":["Visits","Transactions"],"table_notes":{"Visits":"Customer 501 visited three times (visits 1, 3, 5).","Transactions":"Visit 1 has **two** transactions; visits 3, 4, 5 and 7 have none."},"solution":"SELECT v.customer_id,\n       COUNT(v.visit_id) AS count_no_trans\nFROM Visits AS v\nLEFT JOIN Transactions AS t\n       ON t.visit_id = v.visit_id\nWHERE t.transaction_id IS NULL\nGROUP BY v.customer_id;","display_sql":"SELECT v.customer_id,\n       COUNT(v.visit_id) AS count_no_trans\nFROM Visits AS v\nLEFT JOIN Transactions AS t\n       ON t.visit_id = v.visit_id\nWHERE t.transaction_id IS NULL\nGROUP BY v.customer_id\nORDER BY v.customer_id;","output_notes":["**501 → 2** — visits 3 and 5 had no transaction (visit 1 had two, so it does not count).","**502 → 1** — visit 7 was empty; visit 2 had a purchase.","**503 → 1** — their only visit (4) was empty.","**504** is missing — their only visit (6) had a transaction, so they have zero empty visits and no row survives the WHERE."],"breakdown":[{"code":"FROM Visits AS v","text":"Start from all 7 visits — we are looking for visits that are missing something."},{"code":"LEFT JOIN Transactions AS t\n       ON t.visit_id = v.visit_id","text":"Attach the transactions of each visit. Visits with no transaction are kept with `t.*` = `NULL`. Visit 1 has two transactions, so it becomes two rows."},{"code":"WHERE t.transaction_id IS NULL","text":"Keep only the rows where **no** transaction matched — the empty visits. This LEFT JOIN + IS NULL combination is called an **anti-join**."},{"code":"GROUP BY v.customer_id","text":"Put the remaining empty visits into one group per customer."},{"code":"COUNT(v.visit_id) AS count_no_trans","text":"Count the empty visits in each group. After the filter each remaining row is exactly one visit, so this count is correct."}],"exec_order":[{"stage":"FROM","code":"Visits v","text":"Read the 7 visits."},{"stage":"JOIN / ON","code":"LEFT JOIN Transactions t ON t.visit_id = v.visit_id","text":"Attach transactions; visit 1 doubles, 4 visits get NULLs → 8 rows."},{"stage":"WHERE","code":"t.transaction_id IS NULL","text":"Keep the 4 empty-visit rows."},{"stage":"GROUP BY","code":"v.customer_id","text":"3 customer groups: 501, 502, 503."},{"stage":"SELECT","code":"COUNT(v.visit_id)","text":"Count empty visits per customer."}],"visuals":[{"kind":"join","title":"Step 1 — LEFT JOIN Transactions onto Visits","diagram":"Visits v (7 rows)                 Transactions t (4 rows)\n  v.visit_id ─────── = ─────────▶ t.visit_id\n\n  visit 1 (501) ✓ ──▶ tx 10, tx 11   (2 matches → 2 rows)\n  visit 2 (502) ✓ ──▶ tx 12\n  visit 3 (501) ✗ → kept, t.* = NULL\n  visit 4 (503) ✗ → kept, t.* = NULL\n  visit 5 (501) ✗ → kept, t.* = NULL\n  visit 6 (504) ✓ ──▶ tx 13\n  visit 7 (502) ✗ → kept, t.* = NULL\n          │\n          ▼\n  8 rows","sql":"SELECT v.visit_id,\n       v.customer_id,\n       t.visit_id       AS t_visit_id,\n       t.transaction_id,\n       t.amount\nFROM Visits AS v\nLEFT JOIN Transactions AS t\n       ON t.visit_id = v.visit_id\nORDER BY v.visit_id, t.transaction_id;","text":"Visits **3, 4, 5 and 7** found no transaction, so their transaction columns are `NULL`. Visit **1** matched two transactions and now appears twice — a LEFT JOIN can make rows multiply, not only add NULLs."},{"kind":"filter","title":"Step 2 — WHERE t.transaction_id IS NULL keeps only empty visits","diagram":"row                     t.transaction_id   IS NULL?\nvisit 1 / tx 10         10                 FALSE ✗\nvisit 1 / tx 11         11                 FALSE ✗\nvisit 2 / tx 12         12                 FALSE ✗\nvisit 3                 NULL               TRUE  ✓\nvisit 4                 NULL               TRUE  ✓\nvisit 5                 NULL               TRUE  ✓\nvisit 6 / tx 13         13                 FALSE ✗\nvisit 7                 NULL               TRUE  ✓\n          │\n          ▼\n4 rows kept","sql":"SELECT v.visit_id,\n       v.customer_id,\n       t.transaction_id,\n       (t.transaction_id IS NULL) AS no_transaction\nFROM Visits AS v\nLEFT JOIN Transactions AS t\n       ON t.visit_id = v.visit_id\nORDER BY v.visit_id, t.transaction_id;","text":"`IS NULL` is never NULL itself — it is always TRUE or FALSE, so every row gets a clear decision. Only visits 3, 4, 5 and 7 are TRUE. Note: `t.transaction_id = NULL` would be NULL for every row and keep nothing."},{"kind":"group","title":"Step 3 — GROUP BY customer_id and COUNT the empty visits","diagram":"501\n ├─ visit 3\n └─ visit 5        → COUNT = 2\n502\n └─ visit 7        → COUNT = 1\n503\n └─ visit 4        → COUNT = 1\n(504 has no empty visit → no group at all)","sql":"SELECT v.customer_id,\n       STRING_AGG(CAST(v.visit_id AS VARCHAR), ', ' ORDER BY v.visit_id) AS empty_visits,\n       COUNT(v.visit_id) AS count_no_trans\nFROM Visits AS v\nLEFT JOIN Transactions AS t\n       ON t.visit_id = v.visit_id\nWHERE t.transaction_id IS NULL\nGROUP BY v.customer_id\nORDER BY v.customer_id;","text":"The WHERE ran **before** GROUP BY, so each group only contains empty visits. Customer **501** has two of them (3 and 5). Customer **504** had no empty visit, so no row of theirs reached this step."}],"flow":[{"label":"Input tables","detail":"Visits (7) · Transactions (4)","ref":"input"},{"label":"LEFT JOIN","detail":"attach transactions, NULL for empty visits → 8 rows","ref":0},{"label":"WHERE IS NULL","detail":"keep only visits with no transaction → 4 rows","ref":1},{"label":"GROUP BY + COUNT","detail":"empty visits per customer","ref":2},{"label":"Final output","detail":"customer_id, count_no_trans","ref":"output"}],"takeaway":{"pattern":"\"Rows that have NO related row\" → anti-join: `LEFT JOIN … WHERE right.key IS NULL` (or `NOT EXISTS`).","asks":["Why must the IS NULL test be in WHERE, not in ON? (In ON it only changes which transactions match; the LEFT JOIN would still keep every visit.)","Which column do you test for NULL? (A right-table column that is never NULL in real matches — the key `t.visit_id` or the primary key `t.transaction_id`.)","Can visit 1's two transactions inflate the count? (No — those rows are removed by the WHERE before counting.)"],"alternatives":["`NOT EXISTS`: `SELECT customer_id, COUNT(*) AS count_no_trans FROM Visits v WHERE NOT EXISTS (SELECT 1 FROM Transactions t WHERE t.visit_id = v.visit_id) GROUP BY customer_id` — often the clearest and fastest anti-join.","`NOT IN (SELECT visit_id FROM Transactions)` works here, but is dangerous in general: if the subquery returns a NULL, NOT IN returns no rows at all."],"realworld":"Finding gaps: sign-ups that never placed an order, invoices with no payment, products never viewed, tickets with no reply."},"mistakes":["Using INNER JOIN — it removes exactly the empty visits you are looking for.","Writing `WHERE t.transaction_id = NULL` — comparisons with NULL are never TRUE; use `IS NULL`.","Putting the NULL test into the ON clause — the LEFT JOIN then keeps every visit and you count all of them.","Counting with `COUNT(t.transaction_id)` — after the filter that column is always NULL, so every count would be 0."],"built":{"id":8,"inputs":[{"name":"Visits","columns":["visit_id","customer_id"],"types":["integer","integer"],"rows":[[1,501],[2,502],[3,501],[4,503],[5,501],[6,504],[7,502]]},{"name":"Transactions","columns":["transaction_id","visit_id","amount"],"types":["integer","integer","integer"],"rows":[[10,1,120],[11,1,35],[12,2,80],[13,6,200]]}],"visuals":[{"columns":["visit_id","customer_id","t_visit_id","transaction_id","amount"],"types":["integer","integer","integer","integer","integer"],"rows":[[1,501,1,10,120],[1,501,1,11,35],[2,502,2,12,80],[3,501,null,null,null],[4,503,null,null,null],[5,501,null,null,null],[6,504,6,13,200],[7,502,null,null,null]]},{"columns":["visit_id","customer_id","transaction_id","no_transaction"],"types":["integer","integer","integer","boolean"],"rows":[[1,501,10,false],[1,501,11,false],[2,502,12,false],[3,501,null,true],[4,503,null,true],[5,501,null,true],[6,504,13,false],[7,502,null,true]]},{"columns":["customer_id","empty_visits","count_no_trans"],"types":["integer","text","bigint"],"rows":[[501,"3, 5",2],[502,"7",1],[503,"4",1]]}],"output":{"columns":["customer_id","count_no_trans"],"types":["integer","bigint"],"rows":[[501,2],[502,1],[503,1]]}}},{"id":9,"lc":197,"slug":"rising-temperature","title":"Rising Temperature","section":"Basic Joins","difficulty":"Easy","concepts":["Self-join","Date arithmetic","INNER JOIN","WHERE comparison"],"pattern":"Compare a row with \"the row for the previous day\" by self-joining the table on date = date + 1.","statement":["**Weather** has one row per day: an `id`, the `recordDate` and that day's `temperature`. Some days may be missing from the table, and the `id`s are not necessarily in date order.","Find the `id` of every day that was **warmer than the day before** (the calendar day immediately before it)."],"returns":"A single column `id`: the days whose temperature is strictly higher than the temperature on the previous calendar day. Days whose previous day is not recorded are not returned. Any order.","setup":"CREATE TABLE Weather (\n  id          INT PRIMARY KEY,\n  recordDate  DATE UNIQUE,\n  temperature INT\n);\n\nINSERT INTO Weather VALUES\n  (1, '2024-03-01',  8),\n  (2, '2024-03-02', 11),\n  (3, '2024-03-03',  9),\n  (4, '2024-03-05', 14),\n  (5, '2024-03-06', 13),\n  (6, '2024-03-07', 17),\n  (7, '2024-03-08', 17),\n  (8, '2024-02-29',  6);","tables":["Weather"],"table_notes":{"Weather":"**2024-03-04 is missing**, so 03-05 has no \"yesterday\". id 8 (Feb 29) was inserted last, and 2024 is a leap year: Feb 29 + 1 day = Mar 1."},"solution":"SELECT today.id\nFROM Weather AS today\nINNER JOIN Weather AS yesterday\n        ON today.recordDate = yesterday.recordDate + 1\nWHERE today.temperature > yesterday.temperature;","display_sql":"SELECT today.id\nFROM Weather AS today\nINNER JOIN Weather AS yesterday\n        ON today.recordDate = yesterday.recordDate + 1\nWHERE today.temperature > yesterday.temperature\nORDER BY today.id;","output_notes":["**id 1** (Mar 1, 8°) — yesterday is Feb 29 (6°). Date arithmetic crosses the month boundary correctly.","**id 2** (Mar 2, 11°) — warmer than Mar 1 (8°).","**id 6** (Mar 7, 17°) — warmer than Mar 6 (13°).","**id 4** (Mar 5, 14°) is missing even though it is warmer than the previous **row** (Mar 3, 9°): Mar 4 is not recorded, so there is no yesterday to compare with.","**id 7** (Mar 8, 17°) is missing — equal to yesterday is not \"higher\"."],"breakdown":[{"code":"FROM Weather AS today","text":"The first copy of the table plays the role of **today** — the day we might return."},{"code":"INNER JOIN Weather AS yesterday\n        ON today.recordDate = yesterday.recordDate + 1","text":"A second copy of the same table plays **yesterday**. A row of `yesterday` matches when its date plus one day equals today's date. In PostgreSQL `DATE + INTEGER` adds days and handles month ends and leap years. Days without a recorded yesterday find no match and are dropped by the INNER JOIN."},{"code":"WHERE today.temperature > yesterday.temperature","text":"Keep only the pairs where today is strictly warmer."},{"code":"SELECT today.id","text":"Return today's id (not yesterday's)."}],"exec_order":[{"stage":"FROM","code":"Weather today","text":"8 candidate days."},{"stage":"JOIN / ON","code":"INNER JOIN Weather yesterday ON today.recordDate = yesterday.recordDate + 1","text":"Pair each day with the previous calendar day; Feb 29 and Mar 5 have no partner → 6 pairs."},{"stage":"WHERE","code":"today.temperature > yesterday.temperature","text":"3 pairs are warmer."},{"stage":"SELECT","code":"today.id","text":"Return ids 1, 2, 6."}],"visuals":[{"kind":"join","title":"Step 1 — Self-join: pair each day (today) with the previous calendar day (yesterday)","diagram":"Weather AS today                     Weather AS yesterday\n  today.recordDate ── = ──▶ yesterday.recordDate + 1\n\n  02-29  ✗ (02-28 not recorded)  → yesterday.* = NULL\n  03-01  ✓ ◀── 02-29\n  03-02  ✓ ◀── 03-01\n  03-03  ✓ ◀── 03-02\n  03-05  ✗ (03-04 not recorded)  → yesterday.* = NULL\n  03-06  ✓ ◀── 03-05\n  03-07  ✓ ◀── 03-06\n  03-08  ✓ ◀── 03-07\n         │\n         ▼\nINNER JOIN keeps the 6 ✓ pairs","sql":"SELECT today.id,\n       today.recordDate,\n       today.temperature,\n       yesterday.id          AS yesterday_id,\n       yesterday.recordDate  AS yesterday_date,\n       yesterday.temperature AS yesterday_temp\nFROM Weather AS today\nLEFT JOIN Weather AS yesterday\n       ON today.recordDate = yesterday.recordDate + 1\nORDER BY today.recordDate;","text":"This view uses a LEFT JOIN only so you can **see** the unmatched days: **Feb 29** (first day) and **Mar 5** (Mar 4 is missing) have `NULL` yesterday columns. The real solution uses an INNER JOIN, which simply drops those two rows."},{"kind":"filter","title":"Step 2 — WHERE today.temperature > yesterday.temperature","diagram":"today   temp   yesterday temp   warmer?\n03-01     8         6           TRUE  ✓  id 1\n03-02    11         8           TRUE  ✓  id 2\n03-03     9        11           FALSE ✗\n03-06    13        14           FALSE ✗\n03-07    17        13           TRUE  ✓  id 6\n03-08    17        17           FALSE ✗  (equal is not higher)","sql":"SELECT today.id,\n       today.recordDate,\n       today.temperature,\n       yesterday.temperature AS yesterday_temp,\n       (today.temperature > yesterday.temperature) AS warmer\nFROM Weather AS today\nINNER JOIN Weather AS yesterday\n        ON today.recordDate = yesterday.recordDate + 1\nORDER BY today.recordDate;","text":"After the INNER JOIN, 6 pairs remain. Three of them are strictly warmer: **ids 1, 2 and 6**. Mar 8 ties with Mar 7 (17° = 17°), so it is FALSE."},{"kind":"window","title":"Step 3 — The trap: \"previous row\" is not \"previous day\"","diagram":"sorted by date:  ... 03-03 (9°) → 03-05 (14°) ...\n                         ▲ gap: 03-04 is missing\n\nprevious ROW of 03-05   = 03-03 → 14 > 9 → would wrongly return id 4\nprevious DAY  of 03-05  = 03-04 → not recorded → id 4 is not an answer","sql":"SELECT id,\n       recordDate,\n       temperature,\n       LAG(recordDate)  OVER (ORDER BY recordDate) AS prev_row_date,\n       LAG(temperature) OVER (ORDER BY recordDate) AS prev_row_temp,\n       recordDate - LAG(recordDate) OVER (ORDER BY recordDate) AS days_apart\nFROM Weather\nORDER BY recordDate;","text":"`LAG()` looks at the previous **row**, not the previous **day**. For Mar 5 the previous row is Mar 3 (`days_apart = 2`), so a naive LAG comparison would wrongly include **id 4**. The date-arithmetic join only pairs rows exactly one day apart. (Also note: ids are not in date order — id 8 is Feb 29 — so `id - 1` is wrong too.)"}],"flow":[{"label":"Input table","detail":"Weather (8 days, Mar 4 missing)","ref":"input"},{"label":"Self-join today ↔ yesterday","detail":"recordDate = yesterday.recordDate + 1 → 6 pairs","ref":0},{"label":"WHERE warmer","detail":"today.temperature > yesterday.temperature → 3 pairs","ref":1},{"label":"Why not LAG / previous row","detail":"the gap at Mar 4 would create a false answer","ref":2},{"label":"Final output","detail":"ids 1, 2, 6","ref":"output"}],"takeaway":{"pattern":"Comparing a row to a related row of the SAME table → self-join with two clearly named aliases; for \"previous day\" join on date arithmetic, never on row position or id.","asks":["Why not `today.id = yesterday.id + 1`? (Ids are not guaranteed to follow the dates — id 8 is Feb 29 here.)","Could you use LAG()? (Only if you also check that the previous row is exactly one day earlier: `recordDate - LAG(recordDate) OVER (ORDER BY recordDate) = 1`.)","What about month ends and leap years? (`DATE + 1` is calendar-aware: Feb 29 2024 + 1 = Mar 1 2024.)"],"alternatives":["`ON yesterday.recordDate = today.recordDate - INTERVAL '1 day'` — same idea; the interval version produces a timestamp, which PostgreSQL compares with the date correctly.","Window version: a CTE with `LAG(recordDate)` and `LAG(temperature)`, then `WHERE recordDate - prev_date = 1 AND temperature > prev_temp`."],"realworld":"Day-over-day comparisons: stock price up vs previous trading day, daily active users growth, error count spike vs the day before."},"mistakes":["Joining on `id + 1` — assumes ids are consecutive and in date order.","Comparing with the previous row (LAG without checking the gap) — returns days whose real yesterday is missing.","Using `>=` instead of `>` — equal temperature is not a rise.","Selecting `yesterday.id` — the answer is the warmer day, i.e. `today.id`.","Using MySQL functions such as `DATEDIFF(a, b)` or `SUBDATE()` — they do not exist in PostgreSQL. Use `date + 1`, `date - 1`, `a - b` (days between two dates) or `date - INTERVAL '1 day'`."],"built":{"id":9,"inputs":[{"name":"Weather","columns":["id","recorddate","temperature"],"types":["integer","date","integer"],"rows":[[1,"2024-03-01",8],[2,"2024-03-02",11],[3,"2024-03-03",9],[4,"2024-03-05",14],[5,"2024-03-06",13],[6,"2024-03-07",17],[7,"2024-03-08",17],[8,"2024-02-29",6]]}],"visuals":[{"columns":["id","recorddate","temperature","yesterday_id","yesterday_date","yesterday_temp"],"types":["integer","date","integer","integer","date","integer"],"rows":[[8,"2024-02-29",6,null,null,null],[1,"2024-03-01",8,8,"2024-02-29",6],[2,"2024-03-02",11,1,"2024-03-01",8],[3,"2024-03-03",9,2,"2024-03-02",11],[4,"2024-03-05",14,null,null,null],[5,"2024-03-06",13,4,"2024-03-05",14],[6,"2024-03-07",17,5,"2024-03-06",13],[7,"2024-03-08",17,6,"2024-03-07",17]]},{"columns":["id","recorddate","temperature","yesterday_temp","warmer"],"types":["integer","date","integer","integer","boolean"],"rows":[[1,"2024-03-01",8,6,true],[2,"2024-03-02",11,8,true],[3,"2024-03-03",9,11,false],[5,"2024-03-06",13,14,false],[6,"2024-03-07",17,13,true],[7,"2024-03-08",17,17,false]]},{"columns":["id","recorddate","temperature","prev_row_date","prev_row_temp","days_apart"],"types":["integer","date","integer","date","integer","integer"],"rows":[[8,"2024-02-29",6,null,null,null],[1,"2024-03-01",8,"2024-02-29",6,1],[2,"2024-03-02",11,"2024-03-01",8,1],[3,"2024-03-03",9,"2024-03-02",11,1],[4,"2024-03-05",14,"2024-03-03",9,2],[5,"2024-03-06",13,"2024-03-05",14,1],[6,"2024-03-07",17,"2024-03-06",13,1],[7,"2024-03-08",17,"2024-03-07",17,1]]}],"output":{"columns":["id"],"types":["integer"],"rows":[[1],[2],[6]]}}},{"id":10,"lc":1661,"slug":"average-time-of-process-per-machine","title":"Average Time of Process per Machine","section":"Basic Joins","difficulty":"Easy","concepts":["Self-join","Multi-column ON","AVG","GROUP BY","ROUND with NUMERIC"],"pattern":"Turn two event rows (start / end) into one row by self-joining on the shared key, then aggregate the difference.","statement":["A factory logs process events in **Activity**. Every process on a machine produces exactly two rows: one with `activity_type = 'start'` and one with `activity_type = 'end'`, each with a `timestamp` in seconds (a floating-point number).","A process takes `end − start` seconds. For each machine, compute the **average time** its processes took, rounded to **3 decimal places**."],"returns":"Columns `machine_id` and `processing_time` (average of end − start over that machine's processes, rounded to 3 decimals). Any order.","setup":"CREATE TABLE Activity (\n  machine_id    INT,\n  process_id    INT,\n  activity_type VARCHAR(10) CHECK (activity_type IN ('start', 'end')),\n  timestamp     FLOAT,\n  PRIMARY KEY (machine_id, process_id, activity_type)\n);\n\nINSERT INTO Activity VALUES\n  (0, 0, 'start', 1.200), (0, 0, 'end', 2.750),\n  (1, 0, 'start', 0.500), (1, 0, 'end', 2.000),\n  (0, 1, 'start', 3.000), (0, 1, 'end', 3.420),\n  (1, 1, 'start', 2.250), (1, 1, 'end', 2.900),\n  (0, 2, 'end',   6.000), (0, 2, 'start', 5.100),\n  (1, 2, 'start', 4.000), (1, 2, 'end', 4.333);","tables":["Activity"],"table_notes":{"Activity":"Two rows per (machine_id, process_id). Rows are not stored in a helpful order — for machine 0 / process 2 the 'end' row even comes first. `timestamp` is FLOAT (double precision)."},"solution":"SELECT s.machine_id,\n       ROUND(CAST(AVG(e.timestamp - s.timestamp) AS NUMERIC), 3) AS processing_time\nFROM Activity AS s\nINNER JOIN Activity AS e\n        ON e.machine_id = s.machine_id\n       AND e.process_id = s.process_id\nWHERE s.activity_type = 'start'\n  AND e.activity_type = 'end'\nGROUP BY s.machine_id;","display_sql":"SELECT s.machine_id,\n       ROUND(CAST(AVG(e.timestamp - s.timestamp) AS NUMERIC), 3) AS processing_time\nFROM Activity AS s\nINNER JOIN Activity AS e\n        ON e.machine_id = s.machine_id\n       AND e.process_id = s.process_id\nWHERE s.activity_type = 'start'\n  AND e.activity_type = 'end'\nGROUP BY s.machine_id\nORDER BY s.machine_id;","output_notes":["**Machine 0 → 0.957** — durations 1.55, 0.42 and 0.90; (1.55 + 0.42 + 0.90) / 3 = 2.87 / 3 = 0.95666… → 0.957.","**Machine 1 → 0.828** — durations 1.50, 0.65 and 0.333; 2.483 / 3 = 0.82766… → 0.828."],"breakdown":[{"code":"FROM Activity AS s","text":"First copy of the table, alias `s` — it will provide the **start** rows."},{"code":"INNER JOIN Activity AS e\n        ON e.machine_id = s.machine_id\n       AND e.process_id = s.process_id","text":"Second copy, alias `e` — it will provide the **end** rows. A process is identified by **both** `machine_id` and `process_id`, so both must match (process 0 exists on every machine)."},{"code":"WHERE s.activity_type = 'start'\n  AND e.activity_type = 'end'","text":"Each process has 2 rows on each side, so the join first creates 2 × 2 = 4 combinations per process. This filter keeps the one useful combination: start on the left, end on the right."},{"code":"GROUP BY s.machine_id","text":"One group per machine, containing one row per process."},{"code":"AVG(e.timestamp - s.timestamp)","text":"The duration of each process, averaged over the machine's processes."},{"code":"ROUND(CAST(… AS NUMERIC), 3) AS processing_time","text":"`timestamp` is FLOAT, so the average is `double precision`. PostgreSQL has no `ROUND(double precision, integer)` — you must cast to NUMERIC first, otherwise the query fails with \"function round(double precision, integer) does not exist\"."}],"exec_order":[{"stage":"FROM","code":"Activity s","text":"12 event rows (left copy)."},{"stage":"JOIN / ON","code":"INNER JOIN Activity e ON same machine_id AND process_id","text":"Every row meets both rows of its own process → 12 × 2 = 24 rows."},{"stage":"WHERE","code":"s.activity_type = 'start' AND e.activity_type = 'end'","text":"Keep one (start, end) pair per process → 6 rows."},{"stage":"GROUP BY","code":"s.machine_id","text":"2 groups, 3 processes each."},{"stage":"SELECT","code":"ROUND(CAST(AVG(e.timestamp - s.timestamp) AS NUMERIC), 3)","text":"Average duration per machine, rounded to 3 decimals."}],"visuals":[{"kind":"join","title":"Step 1 — Self-join: one copy for 'start' rows, one copy for 'end' rows","diagram":"Activity AS s (start copy)              Activity AS e (end copy)\n  s.machine_id ─────── = ─────────▶ e.machine_id\n  s.process_id ─────── = ─────────▶ e.process_id\n  WHERE s.activity_type = 'start'   AND   e.activity_type = 'end'\n\n  (0,0) start 1.200  ──▶  (0,0) end 2.750\n  (0,1) start 3.000  ──▶  (0,1) end 3.420\n  …\n  (start,start) (end,start) (end,end) combinations ✗ filtered out\n          │\n          ▼\n6 rows: one (start, end) pair per process","sql":"SELECT s.machine_id,\n       s.process_id,\n       s.activity_type AS s_type,\n       s.timestamp     AS start_time,\n       e.activity_type AS e_type,\n       e.timestamp     AS end_time\nFROM Activity AS s\nINNER JOIN Activity AS e\n        ON e.machine_id = s.machine_id\n       AND e.process_id = s.process_id\nWHERE s.activity_type = 'start'\n  AND e.activity_type = 'end'\nORDER BY s.machine_id, s.process_id;","text":"Without the WHERE, each process would produce 4 rows (start-start, start-end, end-start, end-end) — 24 in total. The filter keeps exactly **one row per process** with its start time and end time side by side. Row order in the table does not matter: machine 0 / process 2 was stored end-first, yet it pairs correctly."},{"kind":"case","title":"Step 2 — Compute each process's duration (end − start)","diagram":"machine 0:  2.750 − 1.200 = 1.55\n            3.420 − 3.000 = 0.42\n            6.000 − 5.100 = 0.90\nmachine 1:  2.000 − 0.500 = 1.50\n            2.900 − 2.250 = 0.65\n            4.333 − 4.000 = 0.333","sql":"SELECT s.machine_id,\n       s.process_id,\n       s.timestamp AS start_time,\n       e.timestamp AS end_time,\n       e.timestamp - s.timestamp AS duration\nFROM Activity AS s\nINNER JOIN Activity AS e\n        ON e.machine_id = s.machine_id\n       AND e.process_id = s.process_id\nWHERE s.activity_type = 'start'\n  AND e.activity_type = 'end'\nORDER BY s.machine_id, s.process_id;","text":"Look at the `duration` column: FLOAT arithmetic is not exact: 3.42 − 3.000 comes out as `0.41999999999999993` and 6.000 − 5.100 as `0.9000000000000004`. This is exactly why the final step rounds — and why it casts to NUMERIC to be allowed to round."},{"kind":"group","title":"Step 3 — GROUP BY machine_id, AVG, then ROUND to 3 decimals","diagram":"machine 0\n ├─ 1.55\n ├─ 0.42\n └─ 0.90     → AVG = 2.87 / 3  = 0.95666… → 0.957\nmachine 1\n ├─ 1.50\n ├─ 0.65\n └─ 0.333    → AVG = 2.483 / 3 = 0.82766… → 0.828","sql":"SELECT s.machine_id,\n       COUNT(*)                                     AS processes,\n       SUM(e.timestamp - s.timestamp)               AS total_time,\n       AVG(e.timestamp - s.timestamp)               AS avg_raw_double,\n       ROUND(CAST(AVG(e.timestamp - s.timestamp) AS NUMERIC), 3) AS processing_time\nFROM Activity AS s\nINNER JOIN Activity AS e\n        ON e.machine_id = s.machine_id\n       AND e.process_id = s.process_id\nWHERE s.activity_type = 'start'\n  AND e.activity_type = 'end'\nGROUP BY s.machine_id\nORDER BY s.machine_id;","text":"`avg_raw_double` is the unrounded double-precision average. Casting it to NUMERIC and rounding gives **0.957** for machine 0 and **0.828** for machine 1. `AVG` = total ÷ number of processes, which is exactly the definition in the problem."}],"flow":[{"label":"Input table","detail":"Activity (12 events = 6 processes)","ref":"input"},{"label":"Self-join start ↔ end","detail":"same machine + process, start on left, end on right → 6 rows","ref":0},{"label":"Duration per process","detail":"end − start","ref":1},{"label":"GROUP BY + AVG + ROUND","detail":"average per machine, cast to NUMERIC, 3 decimals","ref":2},{"label":"Final output","detail":"machine_id, processing_time","ref":"output"}],"takeaway":{"pattern":"Paired events stored as separate rows (start/end, login/logout, open/close) → self-join on the pair's key, filter each side to one event type, subtract.","asks":["Why join on process_id AND machine_id? (process 0 exists on every machine; joining only on process_id mixes machines.)","Why the CAST to NUMERIC? (ROUND(double precision, int) does not exist in PostgreSQL.)","Can you do it without a join? (Yes: `AVG(CASE WHEN activity_type = 'end' THEN timestamp ELSE -timestamp END) * 2` per machine — or SUM of that divided by COUNT(DISTINCT process_id). Clever, but harder to explain.)"],"alternatives":["Conditional aggregation: first a CTE with one row per process: `MAX(CASE WHEN activity_type = 'end' THEN timestamp END) - MAX(CASE WHEN activity_type = 'start' THEN timestamp END) AS duration` grouped by machine_id, process_id; then AVG(duration) per machine.","Use `::NUMERIC` instead of CAST: `ROUND(AVG(e.timestamp - s.timestamp)::NUMERIC, 3)`."],"realworld":"Session lengths from login/logout events, ticket resolution time from opened/closed events, job run time from started/finished log lines."},"mistakes":["`ROUND(AVG(...), 3)` on a FLOAT column — fails in PostgreSQL; cast to NUMERIC first.","Joining only on `process_id` — process 0 of machine 0 gets paired with process 0 of machine 1.","Forgetting to filter both sides by activity_type — start-start and end-end pairs (duration 0) and end-start pairs (negative duration) pollute the average.","Dividing by the number of rows of Activity per machine — that counts 2 rows per process and halves the average."],"built":{"id":10,"inputs":[{"name":"Activity","columns":["machine_id","process_id","activity_type","timestamp"],"types":["integer","integer","character varying(10)","double precision"],"rows":[[0,0,"start","1.2"],[0,0,"end","2.75"],[1,0,"start","0.5"],[1,0,"end",2],[0,1,"start",3],[0,1,"end","3.42"],[1,1,"start","2.25"],[1,1,"end","2.9"],[0,2,"end",6],[0,2,"start","5.1"],[1,2,"start",4],[1,2,"end","4.333"]]}],"visuals":[{"columns":["machine_id","process_id","s_type","start_time","e_type","end_time"],"types":["integer","integer","character varying(10)","double precision","character varying(10)","double precision"],"rows":[[0,0,"start","1.2","end","2.75"],[0,1,"start",3,"end","3.42"],[0,2,"start","5.1","end",6],[1,0,"start","0.5","end",2],[1,1,"start","2.25","end","2.9"],[1,2,"start",4,"end","4.333"]]},{"columns":["machine_id","process_id","start_time","end_time","duration"],"types":["integer","integer","double precision","double precision","double precision"],"rows":[[0,0,"1.2","2.75","1.55"],[0,1,3,"3.42","0.41999999999999993"],[0,2,"5.1",6,"0.9000000000000004"],[1,0,"0.5",2,"1.5"],[1,1,"2.25","2.9","0.6499999999999999"],[1,2,4,"4.333","0.3330000000000002"]]},{"columns":["machine_id","processes","total_time","avg_raw_double","processing_time"],"types":["integer","bigint","double precision","double precision","numeric"],"rows":[[0,3,"2.87","0.9566666666666667","0.957"],[1,3,"2.483","0.8276666666666667","0.828"]]}],"output":{"columns":["machine_id","processing_time"],"types":["integer","numeric"],"rows":[[0,"0.957"],[1,"0.828"]]}}},{"id":11,"lc":577,"slug":"employee-bonus","title":"Employee Bonus","section":"Basic Joins","difficulty":"Easy","concepts":["LEFT JOIN","IS NULL","OR in WHERE","Three-valued logic"],"pattern":"LEFT JOIN the optional data, then filter with \"condition OR column IS NULL\" so missing values are kept on purpose.","statement":["**Employee** lists every employee (`empId`, `name`, `supervisor`, `salary`). **Bonus** holds the bonus of the employees who received one (`empId`, `bonus`); employees without a bonus simply have no row there.","List the name and bonus of every employee whose bonus is **less than 1000**, plus every employee who got **no bonus at all**."],"returns":"Columns `name` and `bonus` (`NULL` for employees without a bonus). Any order.","setup":"CREATE TABLE Employee (\n  empId      INT PRIMARY KEY,\n  name       VARCHAR(255),\n  supervisor INT,\n  salary     INT\n);\nCREATE TABLE Bonus (\n  empId INT PRIMARY KEY REFERENCES Employee (empId),\n  bonus INT\n);\n\nINSERT INTO Employee VALUES\n  (1, 'Ava',  NULL, 5200),\n  (2, 'Ben',  1,    3100),\n  (3, 'Cleo', 1,    3400),\n  (4, 'Dev',  1,    2900),\n  (5, 'Eli',  2,    2500),\n  (6, 'Fay',  2,    2700);\nINSERT INTO Bonus VALUES\n  (2, 400), (3, 1000), (5, 1500), (6, 999);","tables":["Employee","Bonus"],"table_notes":{"Employee":"Ava (1) and Dev (4) have no row in Bonus.","Bonus":"Cleo's bonus is **exactly 1000** (not less than 1000); Fay's is 999 (just below)."},"solution":"SELECT e.name,\n       b.bonus\nFROM Employee AS e\nLEFT JOIN Bonus AS b\n       ON b.empId = e.empId\nWHERE b.bonus < 1000\n   OR b.bonus IS NULL;","display_sql":"SELECT e.name,\n       b.bonus\nFROM Employee AS e\nLEFT JOIN Bonus AS b\n       ON b.empId = e.empId\nWHERE b.bonus < 1000\n   OR b.bonus IS NULL\nORDER BY e.empId;","output_notes":["**Ava → NULL** and **Dev → NULL** — no bonus row; the LEFT JOIN gives them `NULL` and `IS NULL` keeps them.","**Ben → 400** and **Fay → 999** — both bonuses are below 1000.","**Cleo (1000)** is missing — 1000 is not *less than* 1000.","**Eli (1500)** is missing — bonus too high."],"breakdown":[{"code":"FROM Employee AS e","text":"Start from every employee — some of the answers (no bonus) exist only in this table."},{"code":"LEFT JOIN Bonus AS b\n       ON b.empId = e.empId","text":"Attach each employee's bonus. Employees without a Bonus row are kept with `b.bonus = NULL`."},{"code":"WHERE b.bonus < 1000","text":"First condition: a small bonus. For a NULL bonus this comparison is **NULL** (unknown), not TRUE — on its own it would drop Ava and Dev."},{"code":"   OR b.bonus IS NULL","text":"Second condition: no bonus. `NULL OR TRUE` is TRUE, so the no-bonus employees are rescued."},{"code":"SELECT e.name,\n       b.bonus","text":"Return the name and the bonus (NULL where there is none)."}],"exec_order":[{"stage":"FROM","code":"Employee e","text":"6 employees."},{"stage":"JOIN / ON","code":"LEFT JOIN Bonus b ON b.empId = e.empId","text":"4 employees match a bonus, 2 get NULL → 6 rows."},{"stage":"WHERE","code":"b.bonus < 1000 OR b.bonus IS NULL","text":"Keep 4 rows: Ava, Ben, Dev, Fay."},{"stage":"SELECT","code":"e.name, b.bonus","text":"Return the two columns."}],"visuals":[{"kind":"join","title":"Step 1 — LEFT JOIN Bonus onto Employee","diagram":"Employee e (6 rows)               Bonus b (4 rows)\n  e.empId ───────── = ──────────▶ b.empId\n\n  1 Ava   ✗ no bonus row → kept, b.* = NULL\n  2 Ben   ✓ 400\n  3 Cleo  ✓ 1000\n  4 Dev   ✗ no bonus row → kept, b.* = NULL\n  5 Eli   ✓ 1500\n  6 Fay   ✓ 999\n          │\n          ▼\n  6 rows (one per employee)","sql":"SELECT e.empId,\n       e.name,\n       b.empId AS b_empId,\n       b.bonus\nFROM Employee AS e\nLEFT JOIN Bonus AS b\n       ON b.empId = e.empId\nORDER BY e.empId;","text":"All 6 employees are present. **Ava** and **Dev** have no Bonus row, so `b_empid` and `bonus` are `NULL`. An INNER JOIN here would already lose them — and they are part of the answer."},{"kind":"filter","title":"Step 2 — Evaluate the WHERE condition (TRUE / FALSE / NULL)","diagram":"name   bonus   bonus < 1000   bonus IS NULL   OR     kept?\nAva    NULL    NULL           TRUE            TRUE   ✓\nBen    400     TRUE           FALSE           TRUE   ✓\nCleo   1000    FALSE          FALSE           FALSE  ✗\nDev    NULL    NULL           TRUE            TRUE   ✓\nEli    1500    FALSE          FALSE           FALSE  ✗\nFay    999     TRUE           FALSE           TRUE   ✓","sql":"SELECT e.name,\n       b.bonus,\n       (b.bonus < 1000)                      AS less_than_1000,\n       (b.bonus IS NULL)                     AS no_bonus,\n       (b.bonus < 1000 OR b.bonus IS NULL)   AS kept\nFROM Employee AS e\nLEFT JOIN Bonus AS b\n       ON b.empId = e.empId\nORDER BY e.empId;","text":"For Ava and Dev, `bonus < 1000` is **NULL** — comparing NULL with anything is unknown, and WHERE drops unknown rows. The `OR b.bonus IS NULL` part turns their result into TRUE. Cleo's 1000 is FALSE because the rule is strictly *less than*."}],"flow":[{"label":"Input tables","detail":"Employee (6) · Bonus (4)","ref":"input"},{"label":"LEFT JOIN on empId","detail":"keep every employee, NULL bonus when missing → 6 rows","ref":0},{"label":"WHERE < 1000 OR IS NULL","detail":"small bonus or no bonus → 4 rows","ref":1},{"label":"Final output","detail":"name, bonus","ref":"output"}],"takeaway":{"pattern":"When a filter must also accept \"no value\", write `col <condition> OR col IS NULL` — NULL never satisfies a comparison.","asks":["What does `WHERE b.bonus < 1000` alone return? (Only Ben and Fay — the NULL rows evaluate to unknown and are dropped.)","Could you use `COALESCE(b.bonus, 0) < 1000`? (Yes, it treats a missing bonus as 0. The output still shows NULL because you SELECT b.bonus, not the COALESCE.)","Why not put `b.bonus < 1000` in the ON clause? (Then Cleo and Eli would be kept with a NULL bonus — wrong rows.)"],"alternatives":["`WHERE COALESCE(b.bonus, 0) < 1000` — shorter, same result here.","UNION of two queries: employees with a bonus < 1000 (INNER JOIN) and employees with no bonus (NOT EXISTS). Longer, but makes the two cases explicit."],"realworld":"Filters that must include missing data: customers with a discount below 5% or no discount, tasks with a due date before Friday or no due date."},"mistakes":["Forgetting `OR b.bonus IS NULL` — employees without a bonus disappear.","Using INNER JOIN — same effect: no-bonus employees are gone before the WHERE runs.","Using `<= 1000` — Cleo (exactly 1000) would be included.","Moving the bonus condition into the ON clause of the LEFT JOIN — it no longer filters employees; it only blanks their bonus."],"built":{"id":11,"inputs":[{"name":"Employee","columns":["empid","name","supervisor","salary"],"types":["integer","character varying(255)","integer","integer"],"rows":[[1,"Ava",null,5200],[2,"Ben",1,3100],[3,"Cleo",1,3400],[4,"Dev",1,2900],[5,"Eli",2,2500],[6,"Fay",2,2700]]},{"name":"Bonus","columns":["empid","bonus"],"types":["integer","integer"],"rows":[[2,400],[3,1000],[5,1500],[6,999]]}],"visuals":[{"columns":["empid","name","b_empid","bonus"],"types":["integer","character varying(255)","integer","integer"],"rows":[[1,"Ava",null,null],[2,"Ben",2,400],[3,"Cleo",3,1000],[4,"Dev",null,null],[5,"Eli",5,1500],[6,"Fay",6,999]]},{"columns":["name","bonus","less_than_1000","no_bonus","kept"],"types":["character varying(255)","integer","boolean","boolean","boolean"],"rows":[["Ava",null,null,true,true],["Ben",400,true,false,true],["Cleo",1000,false,false,false],["Dev",null,null,true,true],["Eli",1500,false,false,false],["Fay",999,true,false,true]]}],"output":{"columns":["name","bonus"],"types":["character varying(255)","integer"],"rows":[["Ava",null],["Ben",400],["Dev",null],["Fay",999]]}}},{"id":12,"lc":1280,"slug":"students-and-examinations","title":"Students and Examinations","section":"Basic Joins","difficulty":"Easy","concepts":["CROSS JOIN","LEFT JOIN","GROUP BY","COUNT(column)","ORDER BY"],"pattern":"Build every possible combination first (CROSS JOIN), then LEFT JOIN the facts onto it and count.","statement":["A school keeps three tables: the list of **students**, the list of **subjects**, and an **exam log** where every row means \"this student sat an exam in this subject\". A student can sit the same subject many times, so the log can contain duplicate rows.","For **every student** and **every subject** — even pairs where the student never sat that exam — report how many times the student attended an exam in that subject."],"returns":"One row per (student, subject) combination with the number of exams attended, including combinations with **0** attempts. Sort by `student_id`, then `subject_name`.","setup":"CREATE TABLE Students (\n  student_id   INT PRIMARY KEY,\n  student_name VARCHAR(50)\n);\nCREATE TABLE Subjects (\n  subject_name VARCHAR(50) PRIMARY KEY\n);\nCREATE TABLE Examinations (\n  student_id   INT,\n  subject_name VARCHAR(50)\n);\n\nINSERT INTO Students VALUES (1, 'Alice'), (2, 'Bob');\nINSERT INTO Subjects VALUES ('Math'), ('Physics');\nINSERT INTO Examinations VALUES (1, 'Math'), (1, 'Math'), (2, 'Physics');","tables":["Students","Subjects","Examinations"],"table_notes":{"Examinations":"No primary key — Alice's two Math rows are two separate attempts, not a mistake."},"solution":"SELECT s.student_id,\n       s.student_name,\n       sub.subject_name,\n       COUNT(e.student_id) AS attended_exams\nFROM Students AS s\nCROSS JOIN Subjects AS sub\nLEFT JOIN Examinations AS e\n       ON e.student_id   = s.student_id\n      AND e.subject_name = sub.subject_name\nGROUP BY s.student_id, s.student_name, sub.subject_name\nORDER BY s.student_id, sub.subject_name;","output_notes":["**Alice / Math = 2** — the exam log has two `(1, 'Math')` rows.","**Alice / Physics = 0** — Alice never sat Physics, but the row must still appear. The CROSS JOIN creates it and the LEFT JOIN keeps it.","**Bob / Math = 0** — same reason: the combination exists even though there is no exam.","**Bob / Physics = 1** — one matching row in the exam log."],"breakdown":[{"code":"FROM Students AS s","text":"Start with every student (2 rows)."},{"code":"CROSS JOIN Subjects AS sub","text":"Pair each student with **every** subject. 2 students × 2 subjects = 4 rows. This is the \"skeleton\" of the answer — every row we must return already exists here."},{"code":"LEFT JOIN Examinations AS e\n  ON e.student_id = s.student_id\n AND e.subject_name = sub.subject_name","text":"Attach the matching exam rows. Both conditions are needed — the student **and** the subject must match. A LEFT JOIN keeps skeleton rows that have no exam (their `e.*` columns become `NULL`). If a pair has 2 exams, the row is duplicated twice."},{"code":"GROUP BY s.student_id, s.student_name, sub.subject_name","text":"Collapse the rows back to one row per (student, subject)."},{"code":"COUNT(e.student_id) AS attended_exams","text":"Count only the **non-NULL** exam values. Rows that came from \"no match\" have `NULL`, so they count as 0. `COUNT(*)` would wrongly give 1."},{"code":"ORDER BY s.student_id, sub.subject_name","text":"The problem asks for this order."}],"exec_order":[{"stage":"FROM","code":"Students s CROSS JOIN Subjects sub","text":"Build all 4 student × subject pairs."},{"stage":"JOIN / ON","code":"LEFT JOIN Examinations e ON …","text":"Attach exam rows; unmatched pairs get NULLs → 5 rows."},{"stage":"GROUP BY","code":"student_id, student_name, subject_name","text":"Back to 4 groups."},{"stage":"SELECT","code":"COUNT(e.student_id)","text":"Count non-NULL exams in each group."},{"stage":"ORDER BY","code":"student_id, subject_name","text":"Sort the final rows."}],"visuals":[{"kind":"join","title":"Step 1 — CROSS JOIN: every student × every subject","diagram":"Students (2 rows)          Subjects (2 rows)\n     │                           │\n     └──────── CROSS JOIN ───────┘\n                  │   (no ON condition:\n                  │    every left row × every right row)\n                  ▼\n           2 × 2 = 4 rows","sql":"SELECT s.student_id, s.student_name, sub.subject_name\nFROM Students AS s\nCROSS JOIN Subjects AS sub\nORDER BY s.student_id, sub.subject_name;","text":"A CROSS JOIN has no join condition. It simply produces every combination. This guarantees that **Alice / Physics** and **Bob / Math** exist as rows, even though nobody sat those exams."},{"kind":"join","title":"Step 2 — LEFT JOIN Examinations onto the skeleton","diagram":"(student, subject) skeleton           Examinations\n  s.student_id   ─────── = ───────▶  e.student_id\n  sub.subject_name ───── = ───────▶  e.subject_name\n\n  matched   → exam columns filled in (one row per exam)\n  unmatched → row kept, exam columns = NULL","sql":"SELECT s.student_id, s.student_name, sub.subject_name,\n       e.student_id   AS exam_student_id,\n       e.subject_name AS exam_subject\nFROM Students AS s\nCROSS JOIN Subjects AS sub\nLEFT JOIN Examinations AS e\n       ON e.student_id   = s.student_id\n      AND e.subject_name = sub.subject_name\nORDER BY s.student_id, sub.subject_name;","text":"**Alice / Math** matched two exam rows, so it now appears **twice**. **Alice / Physics** and **Bob / Math** found no match — they are kept by the LEFT JOIN with `NULL` exam columns. 4 skeleton rows became 5 rows."},{"kind":"group","title":"Step 3 — GROUP BY (student, subject) and COUNT","diagram":"(1, Alice, Math)\n ├─ exam_student_id = 1\n └─ exam_student_id = 1        → COUNT = 2\n(1, Alice, Physics)\n └─ exam_student_id = NULL     → COUNT = 0\n(2, Bob, Math)\n └─ exam_student_id = NULL     → COUNT = 0\n(2, Bob, Physics)\n └─ exam_student_id = 2        → COUNT = 1","sql":"SELECT s.student_id, s.student_name, sub.subject_name,\n       COUNT(e.student_id) AS count_exam_column,\n       COUNT(*)            AS count_star_WRONG\nFROM Students AS s\nCROSS JOIN Subjects AS sub\nLEFT JOIN Examinations AS e\n       ON e.student_id   = s.student_id\n      AND e.subject_name = sub.subject_name\nGROUP BY s.student_id, s.student_name, sub.subject_name\nORDER BY s.student_id, sub.subject_name;","text":"The comparison column shows why we count a column from the **right** table. `COUNT(*)` counts rows — and an unmatched row is still a row, so it reports **1** instead of **0**. `COUNT(e.student_id)` ignores `NULL`, which gives the correct 0."}],"flow":[{"label":"Input tables","detail":"Students (2) · Subjects (2) · Examinations (3)","ref":"input"},{"label":"CROSS JOIN","detail":"every student × every subject → 4 rows","ref":0},{"label":"LEFT JOIN Examinations","detail":"attach exams, keep unmatched → 5 rows","ref":1},{"label":"GROUP BY + COUNT","detail":"one row per pair, count non-NULL exams","ref":2},{"label":"Final output","detail":"ORDER BY student_id, subject_name","ref":"output"}],"takeaway":{"pattern":"\"Report every combination, even the empty ones\" → generate the combinations with CROSS JOIN, then LEFT JOIN the facts and COUNT a right-table column.","asks":["Why CROSS JOIN instead of joining Students and Examinations directly? (Pairs with zero exams would disappear.)","What changes if you use COUNT(*)? (Zero becomes one.)","What if Subjects were not given? (You could build the subject list with SELECT DISTINCT subject_name FROM Examinations — but subjects nobody sat would be lost.)"],"alternatives":["Aggregate first: count exams per (student_id, subject_name) in a CTE, then LEFT JOIN that CTE to the CROSS JOIN and use COALESCE(cnt, 0). Same result, and the join touches fewer rows on big tables."],"realworld":"Dashboards that must show zeros: sales per (store × day), attendance per (employee × meeting), activity per (user × feature). Missing combinations must appear as 0, not vanish."},"mistakes":["Using `COUNT(*)` after a LEFT JOIN — unmatched rows are counted as 1.","Joining only on `student_id` — every exam would match every subject.","Using INNER JOIN — the zero-attempt pairs disappear.","Selecting a column that is neither in GROUP BY nor inside an aggregate. PostgreSQL rejects it (the only exception is when you group by that table's primary key). The safe habit: GROUP BY every non-aggregated column you SELECT."],"built":{"id":12,"inputs":[{"name":"Students","columns":["student_id","student_name"],"types":["integer","character varying(50)"],"rows":[[1,"Alice"],[2,"Bob"]]},{"name":"Subjects","columns":["subject_name"],"types":["character varying(50)"],"rows":[["Math"],["Physics"]]},{"name":"Examinations","columns":["student_id","subject_name"],"types":["integer","character varying(50)"],"rows":[[1,"Math"],[1,"Math"],[2,"Physics"]]}],"visuals":[{"columns":["student_id","student_name","subject_name"],"types":["integer","character varying(50)","character varying(50)"],"rows":[[1,"Alice","Math"],[1,"Alice","Physics"],[2,"Bob","Math"],[2,"Bob","Physics"]]},{"columns":["student_id","student_name","subject_name","exam_student_id","exam_subject"],"types":["integer","character varying(50)","character varying(50)","integer","character varying(50)"],"rows":[[1,"Alice","Math",1,"Math"],[1,"Alice","Math",1,"Math"],[1,"Alice","Physics",null,null],[2,"Bob","Math",null,null],[2,"Bob","Physics",2,"Physics"]]},{"columns":["student_id","student_name","subject_name","count_exam_column","count_star_wrong"],"types":["integer","character varying(50)","character varying(50)","bigint","bigint"],"rows":[[1,"Alice","Math",2,2],[1,"Alice","Physics",0,1],[2,"Bob","Math",0,1],[2,"Bob","Physics",1,1]]}],"output":{"columns":["student_id","student_name","subject_name","attended_exams"],"types":["integer","character varying(50)","character varying(50)","bigint"],"rows":[[1,"Alice","Math",2],[1,"Alice","Physics",0],[2,"Bob","Math",0],[2,"Bob","Physics",1]]}}},{"id":13,"lc":570,"slug":"managers-with-at-least-5-direct-reports","title":"Managers with at Least 5 Direct Reports","section":"Basic Joins","difficulty":"Medium","concepts":["Self-join","GROUP BY","HAVING","COUNT"],"pattern":"Self-join a hierarchy table (manager ↔ report), group by the manager, and filter the groups with HAVING COUNT.","statement":["**Employee** stores every employee with an `id`, `name`, `department` and `managerId` — the `id` of their direct manager (`NULL` for the top boss). Managers are employees too, so they live in the same table.","Find the names of the managers who have **at least five** direct reports (employees whose `managerId` points to them)."],"returns":"A single column `name` with the managers that have 5 or more direct reports. Any order.","setup":"CREATE TABLE Employee (\n  id         INT PRIMARY KEY,\n  name       VARCHAR(255),\n  department VARCHAR(255),\n  managerId  INT\n);\n\nINSERT INTO Employee VALUES\n  (1,  'Grace', 'Exec',      NULL),\n  (2,  'Omar',  'Sales',     1),\n  (3,  'Lin',   'Support',   1),\n  (4,  'Ana',   'Sales',     2),\n  (5,  'Raj',   'Sales',     2),\n  (6,  'Tom',   'Sales',     2),\n  (7,  'Mia',   'Sales',     2),\n  (8,  'Kai',   'Marketing', 2),\n  (9,  'Zoe',   'Support',   3),\n  (10, 'Ivy',   'Support',   3),\n  (11, 'Leo',   'Support',   3),\n  (12, 'Nia',   'Support',   3);","tables":["Employee"],"table_notes":{"Employee":"Omar (2) manages **5** people, Lin (3) manages **4** (one short), Grace (1) manages 2. Kai reports to Omar from another department — department does not matter."},"solution":"SELECT manager.name\nFROM Employee AS manager\nINNER JOIN Employee AS report\n        ON report.managerId = manager.id\nGROUP BY manager.id, manager.name\nHAVING COUNT(report.id) >= 5;","output_notes":["**Omar** — 5 direct reports (Ana, Raj, Tom, Mia, Kai), and 5 ≥ 5.","**Lin** is missing — only 4 direct reports.","**Grace** is missing — 2 direct reports. Her indirect reports (people under Omar and Lin) do not count; only direct ones do.","Employees who manage nobody (Ana, Zoe, …) never form a group, because the INNER JOIN finds no report for them."],"breakdown":[{"code":"FROM Employee AS manager","text":"First copy of the table, named **manager**: each row is a possible manager."},{"code":"INNER JOIN Employee AS report\n        ON report.managerId = manager.id","text":"Second copy, named **report**: attach every employee whose `managerId` points to this manager. Each (manager, report) pair becomes one row. Employees with no reports find no match and disappear."},{"code":"GROUP BY manager.id, manager.name","text":"One group per manager. Grouping by `id` (not only `name`) keeps two different managers with the same name apart."},{"code":"HAVING COUNT(report.id) >= 5","text":"HAVING filters **groups** after counting — WHERE cannot do this because the count does not exist yet when WHERE runs."},{"code":"SELECT manager.name","text":"Return the name of each manager that passed the filter."}],"exec_order":[{"stage":"FROM","code":"Employee manager","text":"12 possible managers."},{"stage":"JOIN / ON","code":"INNER JOIN Employee report ON report.managerId = manager.id","text":"One row per (manager, direct report) pair → 11 rows."},{"stage":"GROUP BY","code":"manager.id, manager.name","text":"3 groups: Grace, Omar, Lin."},{"stage":"HAVING","code":"COUNT(report.id) >= 5","text":"Only Omar's group (5) survives."},{"stage":"SELECT","code":"manager.name","text":"Return Omar."}],"visuals":[{"kind":"join","title":"Step 1 — Self-join: match each employee (report) to their manager","diagram":"Employee AS manager                 Employee AS report\n  manager.id ◀────── = ─────────── report.managerId\n\n  1 Grace ◀── Omar, Lin                     (2 rows)\n  2 Omar  ◀── Ana, Raj, Tom, Mia, Kai       (5 rows)\n  3 Lin   ◀── Zoe, Ivy, Leo, Nia            (4 rows)\n  4 Ana … 12 Nia ✗ nobody reports to them → no rows\n  (Grace has managerId NULL → she is nobody's report)\n          │\n          ▼\n11 (manager, report) rows","sql":"SELECT manager.id   AS manager_id,\n       manager.name AS manager_name,\n       report.id    AS report_id,\n       report.name  AS report_name,\n       report.managerId\nFROM Employee AS manager\nINNER JOIN Employee AS report\n        ON report.managerId = manager.id\nORDER BY manager.id, report.id;","text":"The same table is used twice under two names. Each row says \"**report** works directly for **manager**\". The 9 employees who manage nobody do not appear on the manager side, and Grace's `NULL` managerId never equals anything, so she never appears on the report side."},{"kind":"group","title":"Step 2 — GROUP BY manager and COUNT the direct reports","diagram":"Grace (1)\n ├─ Omar\n └─ Lin                        → COUNT = 2\nOmar (2)\n ├─ Ana\n ├─ Raj\n ├─ Tom\n ├─ Mia\n └─ Kai                        → COUNT = 5\nLin (3)\n ├─ Zoe\n ├─ Ivy\n ├─ Leo\n └─ Nia                        → COUNT = 4","sql":"SELECT manager.id   AS manager_id,\n       manager.name AS manager_name,\n       STRING_AGG(report.name, ', ' ORDER BY report.id) AS direct_reports,\n       COUNT(report.id) AS report_count\nFROM Employee AS manager\nINNER JOIN Employee AS report\n        ON report.managerId = manager.id\nGROUP BY manager.id, manager.name\nORDER BY manager.id;","text":"Each group collects one manager's pairs. Grace has **2** direct reports — the people under Omar and Lin are not counted for her, because the join only follows one level of `managerId`."},{"kind":"having","title":"Step 3 — HAVING COUNT(report.id) >= 5: keep only big teams","diagram":"manager   report_count   >= 5 ?\nGrace          2         FALSE ✗ removed\nOmar           5         TRUE  ✓ kept\nLin            4         FALSE ✗ removed","sql":"SELECT manager.name     AS manager_name,\n       COUNT(report.id) AS report_count,\n       (COUNT(report.id) >= 5) AS kept\nFROM Employee AS manager\nINNER JOIN Employee AS report\n        ON report.managerId = manager.id\nGROUP BY manager.id, manager.name\nORDER BY manager.id;","text":"HAVING is evaluated per group. **Omar** (5) passes because the rule is *at least* five (`>=`). **Lin** (4) and **Grace** (2) are removed."}],"flow":[{"label":"Input table","detail":"Employee (12)","ref":"input"},{"label":"Self-join manager ↔ report","detail":"report.managerId = manager.id → 11 pairs","ref":0},{"label":"GROUP BY manager","detail":"count direct reports: Grace 2, Omar 5, Lin 4","ref":1},{"label":"HAVING COUNT >= 5","detail":"only Omar is kept","ref":2},{"label":"Final output","detail":"name","ref":"output"}],"takeaway":{"pattern":"\"Parents with at least N children\" in a self-referencing table → join child to parent, GROUP BY parent, HAVING COUNT(child) >= N.","asks":["Why not WHERE COUNT(...) >= 5? (Aggregates are not allowed in WHERE; WHERE runs before grouping. Use HAVING.)","Why group by id and not only name? (Two managers could share a name; grouping by name alone would merge their teams.)","What if a managerId points to an id that is not in the table? (The INNER JOIN drops those rows — there is no manager name to return anyway.)"],"alternatives":["Subquery: `SELECT name FROM Employee WHERE id IN (SELECT managerId FROM Employee GROUP BY managerId HAVING COUNT(*) >= 5)` — first find the manager ids, then look up their names.","CTE: count reports per managerId in a CTE, then INNER JOIN it back to Employee and filter `report_count >= 5`."],"realworld":"Org-chart analytics (span of control), categories with at least N products, customers with at least N orders, folders with at least N files."},"mistakes":["Swapping the join direction (`manager.managerId = report.id`) — you count each employee's managers (at most 1) instead of their reports.","Grouping by `name` only — two managers with the same name would be merged and could reach 5 together.","Using `> 5` instead of `>= 5` — a manager with exactly five reports is excluded.","Filtering with WHERE on the count — PostgreSQL error: aggregate functions are not allowed in WHERE."],"built":{"id":13,"inputs":[{"name":"Employee","columns":["id","name","department","managerid"],"types":["integer","character varying(255)","character varying(255)","integer"],"rows":[[1,"Grace","Exec",null],[2,"Omar","Sales",1],[3,"Lin","Support",1],[4,"Ana","Sales",2],[5,"Raj","Sales",2],[6,"Tom","Sales",2],[7,"Mia","Sales",2],[8,"Kai","Marketing",2],[9,"Zoe","Support",3],[10,"Ivy","Support",3],[11,"Leo","Support",3],[12,"Nia","Support",3]]}],"visuals":[{"columns":["manager_id","manager_name","report_id","report_name","managerid"],"types":["integer","character varying(255)","integer","character varying(255)","integer"],"rows":[[1,"Grace",2,"Omar",1],[1,"Grace",3,"Lin",1],[2,"Omar",4,"Ana",2],[2,"Omar",5,"Raj",2],[2,"Omar",6,"Tom",2],[2,"Omar",7,"Mia",2],[2,"Omar",8,"Kai",2],[3,"Lin",9,"Zoe",3],[3,"Lin",10,"Ivy",3],[3,"Lin",11,"Leo",3],[3,"Lin",12,"Nia",3]]},{"columns":["manager_id","manager_name","direct_reports","report_count"],"types":["integer","character varying(255)","text","bigint"],"rows":[[1,"Grace","Omar, Lin",2],[2,"Omar","Ana, Raj, Tom, Mia, Kai",5],[3,"Lin","Zoe, Ivy, Leo, Nia",4]]},{"columns":["manager_name","report_count","kept"],"types":["character varying(255)","bigint","boolean"],"rows":[["Grace",2,false],["Omar",5,true],["Lin",4,false]]}],"output":{"columns":["name"],"types":["character varying(255)"],"rows":[["Omar"]]}}},{"id":14,"lc":1934,"slug":"confirmation-rate","title":"Confirmation Rate","section":"Basic Joins","difficulty":"Medium","concepts":["LEFT JOIN","CASE WHEN","AVG of 1/0","GROUP BY","ROUND with NUMERIC"],"pattern":"A rate per entity = AVG of a 1/0 flag over a LEFT JOIN, so entities with no events still get a row (rate 0).","statement":["**Signups** has one row per user who signed up (`user_id`, `time_stamp`). Each time a user asks for a confirmation message, a row is added to **Confirmations** (`user_id`, `time_stamp`, `action`), where `action` is `'confirmed'` if they confirmed it or `'timeout'` if it expired.","A user's **confirmation rate** is (number of `'confirmed'` messages) ÷ (number of requested messages). A user who never requested a message has rate **0**. Compute the rate for **every** signed-up user, rounded to 2 decimal places."],"returns":"Columns `user_id` and `confirmation_rate` (rounded to 2 decimals), one row per user in Signups — including users with no confirmation requests (rate 0.00). Any order.","setup":"CREATE TABLE Signups (\n  user_id    INT PRIMARY KEY,\n  time_stamp TIMESTAMP\n);\nCREATE TABLE Confirmations (\n  user_id    INT REFERENCES Signups (user_id),\n  time_stamp TIMESTAMP,\n  action     VARCHAR(10) CHECK (action IN ('confirmed', 'timeout')),\n  PRIMARY KEY (user_id, time_stamp)\n);\n\nINSERT INTO Signups VALUES\n  (1, '2024-01-03 09:15:00'),\n  (2, '2024-01-07 18:40:00'),\n  (3, '2024-02-11 12:05:00'),\n  (4, '2024-02-20 08:30:00'),\n  (5, '2024-03-02 21:10:00');\nINSERT INTO Confirmations VALUES\n  (1, '2024-04-01 10:00:00', 'confirmed'),\n  (1, '2024-04-05 10:00:00', 'timeout'),\n  (1, '2024-04-09 10:00:00', 'confirmed'),\n  (2, '2024-04-02 14:00:00', 'timeout'),\n  (2, '2024-04-03 14:00:00', 'timeout'),\n  (3, '2024-04-04 16:30:00', 'confirmed'),\n  (5, '2024-04-06 07:00:00', 'confirmed'),\n  (5, '2024-04-07 07:00:00', 'timeout'),\n  (5, '2024-04-08 07:00:00', 'timeout'),\n  (5, '2024-04-10 07:00:00', 'timeout');","tables":["Signups","Confirmations"],"table_notes":{"Signups":"User 4 never requested a confirmation — they must still appear, with rate 0.00.","Confirmations":"User 1 confirmed 2 of 3 (0.666… → needs rounding); user 5 confirmed 1 of 4."},"solution":"SELECT s.user_id,\n       ROUND(AVG(CASE WHEN c.action = 'confirmed' THEN 1.0 ELSE 0.0 END), 2) AS confirmation_rate\nFROM Signups AS s\nLEFT JOIN Confirmations AS c\n       ON c.user_id = s.user_id\nGROUP BY s.user_id;","display_sql":"SELECT s.user_id,\n       ROUND(AVG(CASE WHEN c.action = 'confirmed' THEN 1.0 ELSE 0.0 END), 2) AS confirmation_rate\nFROM Signups AS s\nLEFT JOIN Confirmations AS c\n       ON c.user_id = s.user_id\nGROUP BY s.user_id\nORDER BY s.user_id;","output_notes":["**User 1 → 0.67** — 2 confirmed out of 3 requests: 0.666… rounded to 2 decimals.","**User 2 → 0.00** — 2 requests, both timed out.","**User 3 → 1.00** — 1 request, confirmed.","**User 4 → 0.00** — no requests at all. The LEFT JOIN keeps the user with one all-NULL row; the CASE turns it into 0.0, so the average is 0.","**User 5 → 0.25** — 1 confirmed out of 4 requests."],"breakdown":[{"code":"FROM Signups AS s","text":"Start from every signed-up user — each one must get a row, even without requests."},{"code":"LEFT JOIN Confirmations AS c\n       ON c.user_id = s.user_id","text":"Attach every confirmation request of the user (one row per request). User 4 has none and is kept with `c.*` = `NULL`."},{"code":"CASE WHEN c.action = 'confirmed' THEN 1.0 ELSE 0.0 END","text":"Turn each row into a flag: 1.0 for a confirmed message, 0.0 otherwise. For user 4's NULL row, `NULL = 'confirmed'` is not TRUE, so the ELSE branch gives 0.0."},{"code":"GROUP BY s.user_id","text":"One group per user."},{"code":"AVG(…)","text":"The average of 1/0 flags is exactly (confirmed ÷ requests). Writing `1.0` / `0.0` makes the values NUMERIC, so there is no integer division."},{"code":"ROUND(…, 2) AS confirmation_rate","text":"Round to 2 decimals. This works because the AVG of NUMERIC values is NUMERIC — `ROUND(double precision, 2)` would not exist in PostgreSQL."}],"exec_order":[{"stage":"FROM","code":"Signups s","text":"5 users."},{"stage":"JOIN / ON","code":"LEFT JOIN Confirmations c ON c.user_id = s.user_id","text":"One row per request; user 4 kept with NULLs → 11 rows."},{"stage":"GROUP BY","code":"s.user_id","text":"5 groups."},{"stage":"SELECT","code":"ROUND(AVG(CASE … THEN 1.0 ELSE 0.0 END), 2)","text":"Average the flags per user and round."}],"visuals":[{"kind":"join","title":"Step 1 — LEFT JOIN Confirmations onto Signups","diagram":"Signups s (5 rows)               Confirmations c (10 rows)\n  s.user_id ──────── = ────────▶ c.user_id\n\n  user 1 ✓ ──▶ 3 requests  (3 rows)\n  user 2 ✓ ──▶ 2 requests  (2 rows)\n  user 3 ✓ ──▶ 1 request   (1 row)\n  user 4 ✗ no requests → kept, c.* = NULL (1 row)\n  user 5 ✓ ──▶ 4 requests  (4 rows)\n          │\n          ▼\n11 rows","sql":"SELECT s.user_id,\n       c.user_id    AS c_user_id,\n       c.time_stamp AS requested_at,\n       c.action\nFROM Signups AS s\nLEFT JOIN Confirmations AS c\n       ON c.user_id = s.user_id\nORDER BY s.user_id, c.time_stamp;","text":"Each request becomes its own row. **User 4** has no request, so the LEFT JOIN keeps a single row with `c_user_id` and `action` = `NULL`. With an INNER JOIN, user 4 would vanish from the result."},{"kind":"case","title":"Step 2 — CASE turns each row into a 1.0 / 0.0 flag","diagram":"action        CASE WHEN action = 'confirmed' …   flag\nconfirmed     TRUE                               1.0\ntimeout       FALSE                              0.0\nNULL          NULL (not TRUE) → ELSE             0.0","sql":"SELECT s.user_id,\n       c.action,\n       CASE WHEN c.action = 'confirmed' THEN 1.0 ELSE 0.0 END AS is_confirmed\nFROM Signups AS s\nLEFT JOIN Confirmations AS c\n       ON c.user_id = s.user_id\nORDER BY s.user_id, c.time_stamp;","text":"Every confirmed request scores 1.0, every timeout 0.0. User 4's NULL row also scores 0.0 — the CASE only takes the THEN branch when the condition is TRUE, and `NULL = 'confirmed'` is NULL."},{"kind":"group","title":"Step 3 — GROUP BY user_id, AVG the flags, ROUND to 2 decimals","diagram":"user 1 ├─ 1.0 ├─ 0.0 └─ 1.0          → 2 / 3 = 0.666… → 0.67\nuser 2 ├─ 0.0 └─ 0.0                 → 0 / 2          → 0.00\nuser 3 └─ 1.0                        → 1 / 1          → 1.00\nuser 4 └─ 0.0 (from the NULL row)    → 0 / 1          → 0.00\nuser 5 ├─ 1.0 ├─ 0.0 ├─ 0.0 └─ 0.0   → 1 / 4          → 0.25","sql":"SELECT s.user_id,\n       SUM(CASE WHEN c.action = 'confirmed' THEN 1 ELSE 0 END) AS confirmed,\n       COUNT(c.user_id) AS requests,\n       SUM(CASE WHEN c.action = 'confirmed' THEN 1 ELSE 0 END)\n         / NULLIF(COUNT(c.user_id), 0) AS int_division_wrong,\n       ROUND(AVG(CASE WHEN c.action = 'confirmed' THEN 1.0 ELSE 0.0 END), 4) AS avg_4_decimals,\n       ROUND(AVG(CASE WHEN c.action = 'confirmed' THEN 1.0 ELSE 0.0 END), 2) AS confirmation_rate\nFROM Signups AS s\nLEFT JOIN Confirmations AS c\n       ON c.user_id = s.user_id\nGROUP BY s.user_id\nORDER BY s.user_id;","text":"`avg_4_decimals` (the average before the final rounding, shown to 4 places) equals confirmed ÷ requests for users 1, 2, 3 and 5, and 0 for user 4 (one 0.0 row). The `int_division_wrong` column shows two traps of the SUM ÷ COUNT approach: integer division turns user 1's 2/3 and user 5's 1/4 into **0**, and user 4 would divide by zero (here NULL via NULLIF) instead of 0."}],"flow":[{"label":"Input tables","detail":"Signups (5) · Confirmations (10)","ref":"input"},{"label":"LEFT JOIN","detail":"one row per request, user 4 kept with NULLs → 11 rows","ref":0},{"label":"CASE flag","detail":"confirmed → 1.0, timeout / NULL → 0.0","ref":1},{"label":"GROUP BY + AVG + ROUND","detail":"rate per user, 2 decimals","ref":2},{"label":"Final output","detail":"user_id, confirmation_rate","ref":"output"}],"takeaway":{"pattern":"\"Share of X among Y, per entity, including entities with no Y\" → LEFT JOIN + AVG(CASE WHEN X THEN 1.0 ELSE 0.0 END), then ROUND.","asks":["Why LEFT JOIN and not INNER JOIN? (Users without requests, like user 4, must appear with 0.00.)","Why 1.0 and not 1? (It makes the arithmetic NUMERIC. In PostgreSQL AVG of integers also returns NUMERIC, but the SUM/COUNT version with integers truncates 2/3 to 0 — writing 1.0 is the safe habit.)","How would you write it with SUM and COUNT? (`ROUND(SUM(CASE … THEN 1 ELSE 0 END)::NUMERIC / NULLIF(COUNT(c.user_id), 0), 2)`, wrapped in `COALESCE(…, 0)` for users with no requests.)"],"alternatives":["`COALESCE(ROUND(SUM(CASE WHEN c.action = 'confirmed' THEN 1 ELSE 0 END)::NUMERIC / NULLIF(COUNT(c.action), 0), 2), 0)` — explicit numerator and denominator.","Aggregate Confirmations first in a CTE (rate per user_id), then LEFT JOIN Signups to it with `COALESCE(rate, 0)`."],"realworld":"Conversion and success rates per entity: email open rate per campaign, payment success rate per merchant, on-time delivery rate per courier — entities with no activity must show 0, not disappear."},"mistakes":["Using INNER JOIN — users with no confirmation requests disappear instead of getting 0.00.","Integer division: `SUM(1/0 flags) / COUNT(*)` with integers turns 2/3 into 0.","Dividing by `COUNT(*)` after a LEFT JOIN without care — a user with no requests has 1 row, so the denominator is 1, not 0 (the AVG approach turns this into the required 0 rate).","`ROUND(x, 2)` on a double precision value — PostgreSQL has no such function; keep the value NUMERIC (`1.0` literals or `CAST(x AS NUMERIC)`)."],"built":{"id":14,"inputs":[{"name":"Signups","columns":["user_id","time_stamp"],"types":["integer","timestamp without time zone"],"rows":[[1,"2024-01-03T09:15:00"],[2,"2024-01-07T18:40:00"],[3,"2024-02-11T12:05:00"],[4,"2024-02-20T08:30:00"],[5,"2024-03-02T21:10:00"]]},{"name":"Confirmations","columns":["user_id","time_stamp","action"],"types":["integer","timestamp without time zone","character varying(10)"],"rows":[[1,"2024-04-01T10:00:00","confirmed"],[1,"2024-04-05T10:00:00","timeout"],[1,"2024-04-09T10:00:00","confirmed"],[2,"2024-04-02T14:00:00","timeout"],[2,"2024-04-03T14:00:00","timeout"],[3,"2024-04-04T16:30:00","confirmed"],[5,"2024-04-06T07:00:00","confirmed"],[5,"2024-04-07T07:00:00","timeout"],[5,"2024-04-08T07:00:00","timeout"],[5,"2024-04-10T07:00:00","timeout"]]}],"visuals":[{"columns":["user_id","c_user_id","requested_at","action"],"types":["integer","integer","timestamp without time zone","character varying(10)"],"rows":[[1,1,"2024-04-01T10:00:00","confirmed"],[1,1,"2024-04-05T10:00:00","timeout"],[1,1,"2024-04-09T10:00:00","confirmed"],[2,2,"2024-04-02T14:00:00","timeout"],[2,2,"2024-04-03T14:00:00","timeout"],[3,3,"2024-04-04T16:30:00","confirmed"],[4,null,null,null],[5,5,"2024-04-06T07:00:00","confirmed"],[5,5,"2024-04-07T07:00:00","timeout"],[5,5,"2024-04-08T07:00:00","timeout"],[5,5,"2024-04-10T07:00:00","timeout"]]},{"columns":["user_id","action","is_confirmed"],"types":["integer","character varying(10)","numeric"],"rows":[[1,"confirmed","1.0"],[1,"timeout","0.0"],[1,"confirmed","1.0"],[2,"timeout","0.0"],[2,"timeout","0.0"],[3,"confirmed","1.0"],[4,null,"0.0"],[5,"confirmed","1.0"],[5,"timeout","0.0"],[5,"timeout","0.0"],[5,"timeout","0.0"]]},{"columns":["user_id","confirmed","requests","int_division_wrong","avg_4_decimals","confirmation_rate"],"types":["integer","bigint","bigint","bigint","numeric","numeric"],"rows":[[1,2,3,0,"0.6667","0.67"],[2,0,2,0,"0.0000","0.00"],[3,1,1,1,"1.0000","1.00"],[4,0,0,null,"0.0000","0.00"],[5,1,4,0,"0.2500","0.25"]]}],"output":{"columns":["user_id","confirmation_rate"],"types":["integer","numeric"],"rows":[[1,"0.67"],[2,"0.00"],[3,"1.00"],[4,"0.00"],[5,"0.25"]]}}},{"id":15,"lc":620,"slug":"not-boring-movies","title":"Not Boring Movies","section":"Basic Aggregate Functions","difficulty":"Easy","concepts":["WHERE","Modulo %","<> (not equal)","AND","ORDER BY DESC"],"pattern":"Filter rows with two independent conditions joined by AND, then sort by the column the problem names.","statement":["A cinema keeps one row per movie: its `id`, its name, a short `description`, and a `rating` from 0 to 10.","We want the movies whose `id` is an **odd** number **and** whose description is anything other than the word `boring`."],"returns":"All columns of the matching movies (`id`, `movie`, `description`, `rating`), sorted by `rating` from **highest to lowest**.","setup":"\nCREATE TABLE Cinema (\n  id          INT PRIMARY KEY,\n  movie       VARCHAR(255),\n  description VARCHAR(255),\n  rating      NUMERIC(3, 1)\n);\n\nINSERT INTO Cinema VALUES\n  (1, 'Night Train',  'thriller',     7.4),\n  (2, 'Blue Harbor',  'drama',        9.0),\n  (3, 'Paper Moon',   'boring',       5.1),\n  (4, 'Old Roads',    'boring',       4.2),\n  (5, 'Iron Garden',  'sci-fi epic',  8.7),\n  (6, 'Quiet Lake',   'documentary',  6.3),\n  (7, 'Red Kite',     'comedy',       6.8);\n","tables":["Cinema"],"table_notes":{"Cinema":"Blue Harbor (id 2) has the best rating but an even id, so it will NOT appear. Paper Moon (id 3) is odd but boring."},"solution":"\nSELECT id,\n       movie,\n       description,\n       rating\nFROM Cinema\nWHERE id % 2 = 1\n  AND description <> 'boring'\nORDER BY rating DESC;\n","official_ordered":true,"output_notes":["**Iron Garden (8.7)** — id 5 is odd and the description is `sci-fi epic`, so it is kept; it has the highest rating among the kept rows, so it comes first.","**Night Train (7.4)** — id 1 is odd and not boring.","**Red Kite (6.8)** — id 7 is odd and not boring; lowest rating of the three, so it is last.","**Blue Harbor** (9.0) is missing even though it has the best rating: id 2 is even. **Paper Moon** (id 3) is odd but its description is `boring`."],"breakdown":[{"code":"SELECT id, movie, description, rating","text":"Return the four columns of the table in the order the problem shows them. Listing them is clearer than `SELECT *`."},{"code":"FROM Cinema","text":"One table, 7 movies."},{"code":"WHERE id % 2 = 1","text":"`%` is the modulo (remainder) operator. An odd number leaves remainder 1 when divided by 2, so `id % 2 = 1` keeps ids 1, 3, 5, 7."},{"code":"  AND description <> 'boring'","text":"`<>` means \"not equal\" (`!=` also works in PostgreSQL). String comparison in PostgreSQL is **case-sensitive**: `'Boring'` would not equal `'boring'`."},{"code":"ORDER BY rating DESC","text":"`DESC` sorts from the highest rating to the lowest, as the problem requires."}],"exec_order":[{"stage":"FROM","code":"Cinema","text":"Read all 7 movies."},{"stage":"WHERE","code":"id % 2 = 1 AND description <> 'boring'","text":"Keep only rows where both conditions are TRUE → 3 rows."},{"stage":"SELECT","code":"id, movie, description, rating","text":"Pick the output columns."},{"stage":"ORDER BY","code":"rating DESC","text":"Highest rating first."}],"visuals":[{"kind":"filter","title":"Step 1 — Evaluate both conditions on every row","diagram":"\nrow ──▶ id % 2 = 1 ? ──no──▶ ✗ dropped\n              │\n             yes\n              ▼\n        description <> 'boring' ? ──no──▶ ✗ dropped\n              │\n             yes\n              ▼\n           ✓ kept\n","sql":"\nSELECT id,\n       movie,\n       description,\n       id % 2                     AS remainder,\n       id % 2 = 1                 AS is_odd,\n       description <> 'boring'    AS not_boring,\n       (id % 2 = 1 AND description <> 'boring') AS kept\nFROM Cinema\nORDER BY id;\n","text":"Each row gets the two conditions as TRUE/FALSE columns. `AND` keeps a row only when **both** are TRUE. Blue Harbor fails `is_odd`, Paper Moon fails `not_boring`, Old Roads fails both. Only ids 1, 5 and 7 survive."},{"kind":"order","title":"Step 2 — Keep the survivors and sort by rating DESC","diagram":"\nkept rows (by id)        sorted by rating DESC\n  1  Night Train  7.4      5  Iron Garden  8.7\n  5  Iron Garden  8.7  ─▶  1  Night Train  7.4\n  7  Red Kite     6.8      7  Red Kite     6.8\n","sql":"\nSELECT id,\n       movie,\n       description,\n       rating\nFROM Cinema\nWHERE id % 2 = 1\n  AND description <> 'boring'\nORDER BY rating DESC;\n","text":"The WHERE clause leaves 3 rows in id order. `ORDER BY rating DESC` moves Iron Garden (8.7) to the top and Red Kite (6.8) to the bottom."}],"flow":[{"label":"Input table","detail":"Cinema (7 movies)","ref":"input"},{"label":"WHERE odd id AND not boring","detail":"evaluate both conditions → 3 rows kept","ref":0},{"label":"ORDER BY rating DESC","detail":"best rating first","ref":1},{"label":"Final output","detail":"3 movies","ref":"output"}],"takeaway":{"pattern":"\"Rows that satisfy A and B, sorted by X\" → one WHERE with AND, then ORDER BY X. Odd/even checks are `col % 2 = 1` / `col % 2 = 0`.","asks":["How else can you test for odd? (`MOD(id, 2) = 1` — same thing, standard SQL function form.)","What if `description` could be NULL? (`NULL <> 'boring'` is NULL, not TRUE, so the row is dropped. To keep it, add `OR description IS NULL`.)","What if the text could be `Boring` or `BORING`? (Compare case-insensitively: `LOWER(description) <> 'boring'`.)","Would `id % 2 <> 0` also work? (Yes for positive ids. For negative odd ids PostgreSQL returns -1, so `<> 0` is the safer odd test in general.)"],"alternatives":["`WHERE MOD(id, 2) = 1 AND description != 'boring'` — identical result, different spelling.","`WHERE id % 2 = 1 AND description NOT IN ('boring')` — handy when several descriptions must be excluded."],"realworld":"Simple filtered listings: active customers in a region sorted by revenue, open tickets that are not low priority sorted by age, every second shard / partition (`id % n = k`) for batching work."},"mistakes":["Writing `id % 2 = 0` — that keeps the **even** ids.","Forgetting `DESC` — `ORDER BY rating` alone sorts lowest first.","Using `description NOT LIKE '%boring%'` — it would also drop a description such as `not boring at all`. The problem compares the whole value.","Assuming case-insensitive comparison. MySQL often ignores case; PostgreSQL does not, so `'Boring' <> 'boring'` is TRUE."],"built":{"id":15,"inputs":[{"name":"Cinema","columns":["id","movie","description","rating"],"types":["integer","character varying(255)","character varying(255)","numeric(3,1)"],"rows":[[1,"Night Train","thriller","7.4"],[2,"Blue Harbor","drama","9.0"],[3,"Paper Moon","boring","5.1"],[4,"Old Roads","boring","4.2"],[5,"Iron Garden","sci-fi epic","8.7"],[6,"Quiet Lake","documentary","6.3"],[7,"Red Kite","comedy","6.8"]]}],"visuals":[{"columns":["id","movie","description","remainder","is_odd","not_boring","kept"],"types":["integer","character varying(255)","character varying(255)","integer","boolean","boolean","boolean"],"rows":[[1,"Night Train","thriller",1,true,true,true],[2,"Blue Harbor","drama",0,false,true,false],[3,"Paper Moon","boring",1,true,false,false],[4,"Old Roads","boring",0,false,false,false],[5,"Iron Garden","sci-fi epic",1,true,true,true],[6,"Quiet Lake","documentary",0,false,true,false],[7,"Red Kite","comedy",1,true,true,true]]},{"columns":["id","movie","description","rating"],"types":["integer","character varying(255)","character varying(255)","numeric(3,1)"],"rows":[[5,"Iron Garden","sci-fi epic","8.7"],[1,"Night Train","thriller","7.4"],[7,"Red Kite","comedy","6.8"]]}],"output":{"columns":["id","movie","description","rating"],"types":["integer","character varying(255)","character varying(255)","numeric(3,1)"],"rows":[[5,"Iron Garden","sci-fi epic","8.7"],[1,"Night Train","thriller","7.4"],[7,"Red Kite","comedy","6.8"]]}}},{"id":16,"lc":1251,"slug":"average-selling-price","title":"Average Selling Price","section":"Basic Aggregate Functions","difficulty":"Easy","concepts":["LEFT JOIN","BETWEEN in ON","Weighted average","COALESCE","ROUND + NUMERIC"],"pattern":"Join each sale to the price period it falls in, then compute a weighted average SUM(price × units) / SUM(units) per product, defaulting to 0.","statement":["A shop changes its prices over time. `Prices` stores, for each product, a date range (`start_date` to `end_date`) and the price during that range. The ranges of one product never overlap.","`UnitsSold` logs sales: which product, on which date, and how many units. For each product, find the **average selling price** = total money earned ÷ total units sold, where each sale uses the price valid on its purchase date. A product that sold nothing has an average of **0**."],"returns":"One row per product with `product_id` and `average_price` rounded to 2 decimals (0 for products with no sales). Any order.","setup":"\nCREATE TABLE Prices (\n  product_id INT,\n  start_date DATE,\n  end_date   DATE,\n  price      INT,\n  PRIMARY KEY (product_id, start_date, end_date)\n);\nCREATE TABLE UnitsSold (\n  product_id    INT,\n  purchase_date DATE,\n  units         INT\n);\n\nINSERT INTO Prices VALUES\n  (1, '2024-01-01', '2024-01-15', 10),\n  (1, '2024-01-16', '2024-01-31', 12),\n  (2, '2024-01-01', '2024-01-31',  8),\n  (3, '2024-01-01', '2024-01-31', 50);\n\nINSERT INTO UnitsSold VALUES\n  (1, '2024-01-05', 4),\n  (1, '2024-01-15', 1),\n  (1, '2024-01-20', 2),\n  (2, '2024-01-10', 3),\n  (2, '2024-02-03', 5);\n","tables":["Prices","UnitsSold"],"table_notes":{"Prices":"Product 1 changes price on Jan 16. Product 3 has a price but is never sold.","UnitsSold":"Product 2's sale on 2024-02-03 falls outside every price period of product 2. The sale on 2024-01-15 sits exactly on a boundary (last day of the 10-price)."},"solution":"\nSELECT p.product_id,\n       COALESCE(\n           ROUND(SUM(p.price * u.units) * 1.0 / SUM(u.units), 2),\n           0\n       ) AS average_price\nFROM Prices AS p\nLEFT JOIN UnitsSold AS u\n       ON u.product_id = p.product_id\n      AND u.purchase_date BETWEEN p.start_date AND p.end_date\nGROUP BY p.product_id;\n","display_sql":"\nSELECT p.product_id,\n       COALESCE(\n           ROUND(SUM(p.price * u.units) * 1.0 / SUM(u.units), 2),\n           0\n       ) AS average_price\nFROM Prices AS p\nLEFT JOIN UnitsSold AS u\n       ON u.product_id = p.product_id\n      AND u.purchase_date BETWEEN p.start_date AND p.end_date\nGROUP BY p.product_id\nORDER BY p.product_id;\n","output_notes":["**Product 1 = 10.57** — revenue 4×10 + 1×10 + 2×12 = 74 over 7 units → 74 / 7 = 10.571… → 10.57. The Jan 15 sale uses price 10 because BETWEEN includes both ends.","**Product 2 = 8.00** — only the Jan 10 sale (3 × 8 = 24, 3 units) is inside a price period. The Feb 3 sale has no valid price and is ignored.","**Product 3 = 0** — it has a price row but no sales. The LEFT JOIN keeps it, SUM gives NULL, and COALESCE turns that into 0."],"breakdown":[{"code":"FROM Prices AS p","text":"Start from **Prices**, not UnitsSold: every prod
