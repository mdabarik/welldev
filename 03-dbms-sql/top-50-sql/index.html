<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 50 Guide</title>
<meta name="description" content="LeetCode SQL 50 in PostgreSQL, with the intermediate table of every step.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* SQL 50 Guide — colorful theme. Tables keep data-table / data-r / data-c, steps keep data-kind. */
:root{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#f1f4fa; --text:#0f172a; --muted:#5b6478; --faint:#94a0b8; --line:#e4e8f1;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.14);
  --shadow-lg:0 2px 4px rgba(15,23,42,.05),0 24px 48px -20px rgba(30,41,99,.28);
  --easy:#059669; --medium:#d97706; --hard:#e11d48;
  --c:#6366f1;
  /* VS Code Light+ */
  --code-bg:#ffffff; --code-bar:#f3f4f8; --code-line:#e8ebf2; --code-gutter:#237893; --code-text:#1f1f1f;
  --k:#0000ff; --fn:#795e26; --s:#a31515; --nm:#098658; --cm:#008000; --op:#000000; --id:#001080;
  --sans:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --side-w:300px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a; --surface:#121827; --surface-2:#182033; --text:#e7ecf6; --muted:#9aa6bf; --faint:#66728c; --line:#232c42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -20px rgba(0,0,0,.7);
  --easy:#34d399; --medium:#fbbf24; --hard:#fb7185;
  --code-bg:#1e1e1e; --code-bar:#252526; --code-line:#2d2d30; --code-gutter:#858585; --code-text:#d4d4d4;
  --k:#569cd6; --fn:#dcdcaa; --s:#ce9178; --nm:#b5cea8; --cm:#6a9955; --op:#d4d4d4; --id:#9cdcfe;
}}
:root[data-theme="dark"]{
  --bg:#0b0f1a; --surface:#121827; --surface-2:#182033; --text:#e7ecf6; --muted:#9aa6bf; --faint:#66728c; --line:#232c42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -20px rgba(0,0,0,.7);
  --easy:#34d399; --medium:#fbbf24; --hard:#fb7185;
  --code-bg:#1e1e1e; --code-bar:#252526; --code-line:#2d2d30; --code-gutter:#858585; --code-text:#d4d4d4;
  --k:#569cd6; --fn:#dcdcaa; --s:#ce9178; --nm:#b5cea8; --cm:#6a9955; --op:#d4d4d4; --id:#9cdcfe;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:420px;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 260px at 20% -40px,color-mix(in srgb,#6366f1 16%,transparent),transparent 70%),
             radial-gradient(520px 240px at 85% -60px,color-mix(in srgb,#ec4899 12%,transparent),transparent 70%)}
a{color:var(--c);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
code,pre{font-family:var(--mono)}
:not(pre)>code{font-size:.84em;background:color-mix(in srgb,var(--c) 9%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--text));padding:.12em .45em;border-radius:6px;font-weight:500}
strong{font-weight:650}

/* ---------------- sidebar */
#side{position:fixed;top:0;left:0;bottom:0;width:var(--side-w);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s ease}
body.side-hidden #side{transform:translateX(-100%)}
.side-top{padding:18px 16px 12px}
.brand{display:flex;align-items:center;gap:11px}
.brand a{display:flex;align-items:center;gap:11px;color:var(--text)}
.brand a:hover{text-decoration:none}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font:800 13px var(--mono);letter-spacing:-.02em;
  background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899);box-shadow:0 6px 16px -6px #8b5cf6}
.brand b{display:block;font-size:16px;font-weight:750;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.icon-btn{margin-left:auto;border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{color:var(--text);border-color:var(--faint)}
.search{position:relative;margin-top:14px}
.search svg{position:absolute;left:11px;top:10px;color:var(--faint)}
#search{width:100%;padding:8px 12px 8px 34px;font:inherit;font-size:14px;color:var(--text);background:var(--surface-2);border:1px solid transparent;border-radius:10px;outline:none}
#search:focus{border-color:#8b5cf6;background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,#8b5cf6 15%,transparent)}
.progress{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.progress .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.progress .top b{color:var(--text)}
.bar{height:6px;background:var(--line);border-radius:99px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#10b981,#06b6d4,#6366f1);transition:width .4s}
#cats{flex:1;overflow-y:auto;padding:2px 10px 18px;scrollbar-width:thin}
.cat{margin-top:12px}
.cat-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:5px 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cat-head .dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.cat-head .cnt{margin-left:auto;font-weight:600;letter-spacing:0;font-size:11.5px;color:var(--faint);text-transform:none}
.cat-head .chev{transition:transform .2s;color:var(--faint)}
.cat.closed .chev{transform:rotate(-90deg)}
.cat.closed .row{display:none!important}
.row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;color:var(--text);font-size:13.5px;line-height:1.35;position:relative}
.row:hover{background:var(--surface-2);text-decoration:none}
.row .n{flex:none;width:24px;height:22px;border-radius:7px;display:grid;place-items:center;font:600 11px var(--mono);color:var(--muted);background:var(--surface-2)}
.row .t{flex:1}
.row .d{font-size:10.5px;font-weight:700;letter-spacing:.02em}
.row.current{background:color-mix(in srgb,var(--c) 12%,transparent);font-weight:600}
.row.current .n{background:var(--c);color:#fff}
.row.done .n{background:color-mix(in srgb,var(--easy) 18%,transparent);color:var(--easy)}
.row.done .n::after{content:"✓";position:absolute}
.row.done .n{font-size:0}
.row.done .n::after{font-size:11px}
.easy{color:var(--easy)} .medium{color:var(--medium)} .hard{color:var(--hard)}
.side-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint)}
.side-foot kbd{font:600 11px var(--mono);background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
.pill-btn:hover{color:var(--text);border-color:var(--faint)}
#openSide{position:fixed;top:14px;left:14px;z-index:15;display:none;box-shadow:var(--shadow)}
body.side-hidden #openSide{display:grid}
#scrim{display:none}

/* ---------------- layout */
main{margin-left:var(--side-w);padding:32px 36px 90px;transition:margin-left .25s ease}
body.side-hidden main{margin-left:0}
.page{max-width:940px;margin:0 auto}
p{margin:0 0 12px}
ul{margin:0 0 12px;padding-left:20px}
li{margin:5px 0}
li::marker{color:var(--c)}
.note{color:var(--muted);font-size:14px}

/* ---------------- home */
.hero{border-radius:24px;padding:38px 40px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);
  background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(30px,4.6vw,48px);line-height:1.08;letter-spacing:-.03em;margin:10px 0 12px;font-weight:800}
.hero p{max-width:640px;opacity:.92;font-size:16px}
.hero a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:14px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.stat span{font-size:12.5px;opacity:.85}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:28px}
.sec-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.sec-card header{padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--surface)),var(--surface));border-bottom:1px solid var(--line)}
.sec-card header .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.sec-card header h2{margin:2px 0 8px;font-size:17px;line-height:1.3}
.sec-card header .bar{background:color-mix(in srgb,var(--c) 15%,transparent);margin-top:0}
.sec-card header .bar i{background:var(--c)}
.sec-card .list{padding:6px 8px 10px}
.sec-card .row .t{font-size:13.5px}

/* ---------------- problem header */
.p-hero{border-radius:22px;padding:28px 30px 24px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);
  background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 70%,#0f172a) 100%)}
.p-hero::after{content:attr(data-num);position:absolute;right:18px;bottom:-34px;font:800 150px/1 var(--sans);letter-spacing:-.06em;opacity:.12}
.crumb{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.p-hero h1{font-size:clamp(24px,3.6vw,36px);line-height:1.15;letter-spacing:-.02em;margin:8px 0 14px;font-weight:800;max-width:720px}
.p-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff}
.chip.diff{background:#fff;border-color:#fff}
.chip.diff.easy{color:#047857} .chip.diff.medium{color:#b45309} .chip.diff.hard{color:#be123c}
.chip input{accent-color:#fff;margin:0}
label.chip{cursor:pointer}
a.chip:hover{text-decoration:none;background:rgba(255,255,255,.26)}
.concepts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative;z-index:1}
.concepts span{font:500 12px var(--mono);padding:3px 9px;border-radius:7px;background:rgba(0,0,0,.18);color:#fff}

/* ---------------- sections */
.sec{margin-top:34px;counter-increment:sec}
.page{counter-reset:sec}
.sec > h2{display:flex;align-items:center;gap:12px;font-size:21px;letter-spacing:-.015em;margin:0 0 14px;font-weight:750}
.sec > h2::before{content:counter(sec);flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--mono);color:#fff;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#ec4899))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.return{margin-top:14px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.return b{color:var(--c)}

/* ---------------- tables */
.tables{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:4px 0 12px}
.tbl{max-width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tbl-name{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
.tbl-name::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c)}
.tbl-name span{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);padding:1px 8px;border-radius:999px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:8px 14px;text-align:left;white-space:nowrap}
th{font:600 11.5px var(--mono);letter-spacing:.02em;color:color-mix(in srgb,var(--c) 75%,var(--text));background:color-mix(in srgb,var(--c) 8%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--c) 20%,var(--line))}
td{border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
td.num,th.num{text-align:right}
.null{display:inline-block;font:600 11px var(--mono);color:#7c3aed;background:color-mix(in srgb,#8b5cf6 13%,transparent);padding:1px 7px;border-radius:6px;font-style:normal}
.v-true,.v-false{display:inline-block;font:700 11px var(--mono);padding:1px 7px;border-radius:6px}
.v-true{color:#047857;background:color-mix(in srgb,#10b981 16%,transparent)}
.v-false{color:#be123c;background:color-mix(in srgb,#f43f5e 14%,transparent)}
:root[data-theme="dark"] .v-true{color:#6ee7b7} :root[data-theme="dark"] .v-false{color:#fda4af} :root[data-theme="dark"] .null{color:#c4b5fd}
.tbl-note{font-size:12.5px;color:var(--muted);padding:8px 14px;border-top:1px dashed var(--line);max-width:46ch;white-space:normal}
.tbl.out{border-color:color-mix(in srgb,var(--c) 40%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 10%,transparent),var(--shadow)}

/* ---------------- code (VS Code look) */
.code{border-radius:12px;overflow:hidden;border:1px solid var(--code-line);background:var(--code-bg);box-shadow:var(--shadow);margin:4px 0 12px}
.code-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--code-bar);border-bottom:1px solid var(--code-line);font:500 12px var(--mono);color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}
.dots i:nth-child(2){background:#febc2e} .dots i:nth-child(3){background:#28c840}
.code-bar .lang{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:6px;background:color-mix(in srgb,#336791 14%,transparent);color:#336791;font-weight:600}
:root[data-theme="dark"] .code-bar .lang{color:#93c5fd}
.copy{border:1px solid var(--code-line);background:var(--code-bg);border-radius:7px;padding:2px 10px;font:500 11.5px var(--sans);color:var(--muted);cursor:pointer}
.copy:hover{color:var(--text)}
.code pre{margin:0;padding:12px 0;overflow-x:auto;font-size:13.5px;line-height:1.7;color:var(--code-text);counter-reset:ln;scrollbar-width:thin}
.code .line{display:block;padding:0 18px 0 0;min-height:1.7em}
.code .line::before{counter-increment:ln;content:counter(ln);display:inline-block;width:46px;padding-right:16px;text-align:right;color:var(--code-gutter);opacity:.85;user-select:none}
.code .line:hover{background:color-mix(in srgb,var(--c) 5%,transparent)}
.k{color:var(--k)} .fn{color:var(--fn)} .s{color:var(--s)} .nm{color:var(--nm)} .c{color:var(--cm);font-style:italic} .op{color:var(--op)}
.mini{display:block;font:13px/1.65 var(--mono);background:var(--code-bg);border:1px solid var(--code-line);border-radius:10px;padding:9px 12px;margin:0;overflow-x:auto;color:var(--code-text)}

/* ---------------- breakdown */
.clauses{display:grid;gap:10px}
.clause{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.clause p{margin:4px 0 0;font-size:14.5px}

/* ---------------- steps */
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);border-top:4px solid var(--kc,var(--c))}
.step h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em}
.kind{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--kc,var(--c));padding:3px 9px;border-radius:7px}
.step p{font-size:15px}
pre.diagram{margin:10px 0 14px;padding:14px 16px;border-radius:12px;font-size:12.8px;line-height:1.55;overflow-x:auto;
  background:color-mix(in srgb,var(--kc,var(--c)) 6%,var(--surface));border:1px dashed color-mix(in srgb,var(--kc,var(--c)) 35%,var(--line));color:var(--text)}
[data-kind="join"]{--kc:#0ea5e9} [data-kind="cte"]{--kc:#8b5cf6} [data-kind="subquery"]{--kc:#f97316} [data-kind="group"]{--kc:#10b981}
[data-kind="having"]{--kc:#f59e0b} [data-kind="window"]{--kc:#ec4899} [data-kind="filter"]{--kc:#64748b} [data-kind="case"]{--kc:#06b6d4}
[data-kind="union"]{--kc:#a855f7} [data-kind="string"]{--kc:#22c55e} [data-kind="order"]{--kc:#475569} [data-kind="delete"]{--kc:#ef4444} [data-kind="note"]{--kc:#94a3b8}
details>summary{cursor:pointer;color:var(--c);font-size:13.5px;font-weight:600;margin:6px 0 8px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";transition:transform .2s}
details[open]>summary::before{transform:rotate(90deg)}

/* ---------------- flow & exec */
.flow-btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;color:#fff;font-weight:650;font-size:14px;padding:10px 18px;border-radius:12px;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#ec4899));box-shadow:0 8px 20px -10px var(--c)}
.flow{margin-top:16px;padding-left:22px;border-left:3px solid color-mix(in srgb,var(--c) 30%,transparent)}
.flow-item{position:relative;padding:0 0 18px 6px}
.flow-item::before{content:"";position:absolute;left:-33px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.flow-item b{font-size:15px}
.pipeline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.pipeline span{font:600 11.5px var(--mono);padding:4px 10px;border-radius:8px;background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.pipeline span.on{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.pipeline i{color:var(--faint);font-style:normal;font-size:12px}
.exec{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.exec li{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start;margin:0}
.exec b{font:700 12px var(--mono);text-align:center;padding:6px 8px;border-radius:9px;color:#fff;background:var(--c)}
.exec .what{font-size:14.5px}

/* ---------------- notes */
.pattern{padding:14px 18px;border-radius:14px;margin-bottom:14px;font-size:15.5px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.pattern b{color:var(--c)}
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.notes-grid h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mistakes{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.mistakes li{margin:0;padding:11px 14px 11px 44px;position:relative;border-radius:12px;background:color-mix(in srgb,#f43f5e 7%,var(--surface));border:1px solid color-mix(in srgb,#f43f5e 22%,transparent);font-size:14.5px}
.mistakes li::before{content:"!";position:absolute;left:13px;top:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--sans);color:#fff;background:#f43f5e}

/* ---------------- pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:44px}
.pager a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;color:var(--text);font-weight:650;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.pager a:hover{text-decoration:none;transform:translateY(-2px);border-color:var(--c)}
.pager a.next{text-align:right}
.pager small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.sec-links{margin-top:12px;font-size:13px;display:flex;justify-content:space-between;gap:16px}

@media (max-width:1000px){
  #side{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  body.side-open #side{transform:none}
  body.side-open #scrim{display:block;position:fixed;inset:0;z-index:19;background:rgba(15,23,42,.35)}
  #openSide,body.side-hidden #openSide{display:grid}
  main,body.side-hidden main{margin-left:0;padding:66px 16px 70px}
  #hideSide{display:none}
}
@media (max-width:720px){
  .hero,.p-hero{padding:24px 20px;border-radius:18px}
  .clause{grid-template-columns:1fr}
  .notes-grid,.pager{grid-template-columns:1fr}
  .exec li{grid-template-columns:96px 1fr}
  .card,.step{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{#side,#openSide,.pager,.sec-links,.copy{display:none!important}main{margin:0}}

<script id="sql50-data" type="application/json">{"pgVersion":"18.6","sections":[{"name":"Select","slug":"select","tab":"SELECT","blurb":"Filter rows with WHERE — and learn how NULL breaks ordinary comparisons.","intro":"The simplest queries: read one table, keep the rows that satisfy a condition, return some columns. The real lesson is **three-valued logic** — a comparison with `NULL` is neither TRUE nor FALSE, so it silently drops rows.","concepts":["SELECT","WHERE","AND / OR","IS NULL","DISTINCT","ORDER BY","LENGTH"]},{"name":"Basic Joins","slug":"basic-joins","tab":"BASIC JOINS","blurb":"INNER, LEFT, CROSS and self joins — what matches, what becomes NULL.","intro":"Combine rows from two tables on a key. Watch what happens to rows with **no match**: an INNER JOIN drops them, a LEFT JOIN keeps them with `NULL`s, a CROSS JOIN pairs everything with everything, and a self join compares a table with itself.","concepts":["INNER JOIN","LEFT JOIN","CROSS JOIN","Self join","IS NULL anti-join","COUNT(column)","ROUND"]},{"name":"Basic Aggregate Functions","slug":"aggregate","tab":"AGGREGATE","blurb":"COUNT, SUM, AVG with GROUP BY — and percentages that do not truncate.","intro":"Collapse many rows into one value per group. You will compute averages, ratios and percentages, so pay attention to **integer division**, `ROUND` on `NUMERIC`, and conditional aggregation with `CASE`.","concepts":["GROUP BY","COUNT / SUM / AVG","CASE inside aggregates","ROUND + NUMERIC","Subquery for totals","CTE"]},{"name":"Sorting and Grouping","slug":"sorting-grouping","tab":"SORT & GROUP","blurb":"GROUP BY + HAVING, COUNT(DISTINCT), date windows and relational division.","intro":"Group rows, filter **groups** with `HAVING`, count distinct values and sort the result. The last problem introduces a classic pattern: “customers who bought **all** products”.","concepts":["GROUP BY","HAVING","COUNT(DISTINCT)","Date ranges","MAX over a subquery","Relational division"]},{"name":"Advanced Select and Joins","slug":"advanced-joins","tab":"ADVANCED JOINS","blurb":"Self joins, UNION, CASE, running totals and LAG/LEAD.","intro":"Harder combinations: joining a table to itself, combining result sets with `UNION`, classifying rows with `CASE`, and window functions such as `LAG` and running `SUM() OVER` that look at neighbouring rows.","concepts":["Self join","UNION / UNION ALL","CASE","LAG / LEAD","SUM() OVER","CTE"]},{"name":"Subqueries","slug":"subqueries","tab":"SUBQUERIES","blurb":"Scalar, IN / NOT IN and derived-table subqueries; moving windows and ranking.","intro":"A subquery is a query inside a query. Each problem first shows **what the subquery returns on its own**, then how the outer query uses that result. Also covers moving averages and top-N per group with `DENSE_RANK`.","concepts":["Scalar subquery","IN / NOT IN","Derived tables","UNION ALL","Moving window","DENSE_RANK"]},{"name":"Advanced String Functions / Regex / Clause","slug":"string-regex","tab":"STRING / REGEX","blurb":"String functions, LIKE, regex, STRING_AGG, DELETE and OFFSET tricks.","intro":"Text manipulation (`UPPER`, `SUBSTRING`, `||`), pattern matching with `LIKE` and PostgreSQL regular expressions (`~`), aggregating strings with `STRING_AGG`, deleting duplicates, and returning `NULL` when a value does not exist.","concepts":["UPPER / LOWER / SUBSTRING","LIKE","Regex ~","STRING_AGG","DELETE","LIMIT / OFFSET"]}],"problems":[{"id":1,"lc":1757,"slug":"recyclable-and-low-fat-products","title":"Recyclable and Low Fat Products","section":"Select","difficulty":"Easy","concepts":["SELECT","WHERE","AND","String literals"],"pattern":"Keep only the rows where every condition is TRUE: combine the column checks with AND in the WHERE clause.","statement":["A shop stores one row per product. Two flag columns describe each product: `low_fats` is `'Y'` when the product is low fat and `'N'` otherwise, and `recyclable` is `'Y'` when its packaging is recyclable and `'N'` otherwise.","Find the products that are **both** low fat **and** recyclable."],"returns":"A single column `product_id` with the ids of products where both flags are `'Y'`. Any order is accepted.","setup":"CREATE TABLE Products (\n  product_id INT PRIMARY KEY,\n  low_fats   VARCHAR(1) CHECK (low_fats IN ('Y', 'N')),\n  recyclable VARCHAR(1) CHECK (recyclable IN ('Y', 'N'))\n);\n\nINSERT INTO Products VALUES\n  (1, 'Y', 'N'),\n  (2, 'Y', 'Y'),\n  (3, 'N', 'Y'),\n  (4, 'Y', 'Y'),\n  (5, 'N', 'N'),\n  (6, 'Y', 'Y'),\n  (7, 'N', 'Y');","tables":["Products"],"table_notes":{"Products":"Products 1, 3 and 7 pass exactly one of the two checks — they are the rows an accidental OR would wrongly keep."},"solution":"SELECT product_id\nFROM Products\nWHERE low_fats   = 'Y'\n  AND recyclable = 'Y';","output_notes":["**2, 4 and 6** — both `low_fats` and `recyclable` are `'Y'`, so both checks are TRUE.","**1** is missing — it is low fat but not recyclable (`recyclable = 'N'`).","**3 and 7** are missing — recyclable but not low fat.","**5** is missing — it fails both checks."],"breakdown":[{"code":"SELECT product_id","text":"We only need the id column in the result, not the flags."},{"code":"FROM Products","text":"Read all 7 product rows."},{"code":"WHERE low_fats = 'Y'","text":"First check: the product is low fat. Text values go in **single quotes**. In PostgreSQL, double quotes mean a column name, so `\"Y\"` would raise *column \"Y\" does not exist*."},{"code":"  AND recyclable = 'Y'","text":"Second check. `AND` is TRUE only when **both** sides are TRUE, which is exactly \"low fat **and** recyclable\"."}],"exec_order":[{"stage":"FROM","code":"Products","text":"Read all 7 rows."},{"stage":"WHERE","code":"low_fats = 'Y' AND recyclable = 'Y'","text":"Keep the 3 rows where both checks are TRUE."},{"stage":"SELECT","code":"product_id","text":"Return only the id column."}],"visuals":[{"kind":"filter","title":"Step 1 — Evaluate both checks on every row","diagram":"for each row:\n  low_fats   = 'Y'  → is_low_fat     (TRUE / FALSE)\n  recyclable = 'Y'  → is_recyclable  (TRUE / FALSE)\n\n  is_low_fat AND is_recyclable → keep_row\n\n  AND truth table:  TRUE  AND TRUE  = TRUE  ✓\n                    TRUE  AND FALSE = FALSE ✗\n                    FALSE AND TRUE  = FALSE ✗\n                    FALSE AND FALSE = FALSE ✗","sql":"SELECT product_id,\n       low_fats,\n       recyclable,\n       low_fats = 'Y'   AS is_low_fat,\n       recyclable = 'Y' AS is_recyclable,\n       (low_fats = 'Y' AND recyclable = 'Y') AS keep_row\nFROM Products\nORDER BY product_id;","text":"Each condition becomes a TRUE/FALSE value per row. Product **1** is low fat but not recyclable, and products **3** and **7** are the other way round, so `keep_row` is FALSE for them. Only **2, 4 and 6** have TRUE in both columns."},{"kind":"filter","title":"Step 2 — WHERE keeps only the TRUE rows","diagram":"7 rows ──▶ WHERE low_fats = 'Y' AND recyclable = 'Y' ──▶ 3 rows\n\n  1 ✗   2 ✓   3 ✗   4 ✓   5 ✗   6 ✓   7 ✗","sql":"SELECT product_id, low_fats, recyclable\nFROM Products\nWHERE low_fats   = 'Y'\n  AND recyclable = 'Y'\nORDER BY product_id;","text":"WHERE throws away every row whose condition is not TRUE. The 3 survivors all show `Y | Y`. The final SELECT then keeps just the `product_id` column."}],"flow":[{"label":"Input table","detail":"Products (7 rows)","ref":"input"},{"label":"Evaluate both checks","detail":"is_low_fat AND is_recyclable per row","ref":0},{"label":"WHERE filter","detail":"keep rows where both are TRUE → 3 rows","ref":1},{"label":"Final output","detail":"SELECT product_id","ref":"output"}],"takeaway":{"pattern":"\"Rows that satisfy X **and** Y\" → `WHERE x AND y`. Each condition is evaluated per row; only rows where the whole expression is TRUE survive.","asks":["What if you needed products that are low fat **or** recyclable? (Replace AND with OR — products 1, 3 and 7 would also appear.)","What if the flags could be NULL? (`NULL = 'Y'` is NULL, not TRUE, so those rows are dropped — which is correct here, because an unknown flag is not a confirmed 'Y'.)","How would you count them instead of listing them? (`SELECT COUNT(*) FROM Products WHERE …`.)","How could this be fast on millions of rows? (An index on `(low_fats, recyclable)`, or a partial index `WHERE low_fats = 'Y' AND recyclable = 'Y'` if this query is run often.)"],"alternatives":["Row comparison: `WHERE (low_fats, recyclable) = ('Y', 'Y')`. Standard SQL and compact, but the two-condition AND is easier to read in an interview."],"realworld":"Every product catalogue filter works this way: \"in stock AND on sale\", \"vegan AND gluten-free\". Each checkbox the user ticks becomes one more AND condition."},"mistakes":["Using `OR` instead of `AND` — products that pass only one check (1, 3, 7) would be returned.","Writing `\"Y\"` with double quotes. In PostgreSQL double quotes are for identifiers (column/table names), so the query fails with *column \"Y\" does not exist*. Use `'Y'`.","Comparing with lowercase `'y'` — string comparison in PostgreSQL is case-sensitive, so `'y' = 'Y'` is FALSE.","Selecting `*` or extra columns — the expected result has only `product_id`."],"built":{"id":1,"inputs":[{"name":"Products","columns":["product_id","low_fats","recyclable"],"types":["integer","character varying(1)","character varying(1)"],"rows":[[1,"Y","N"],[2,"Y","Y"],[3,"N","Y"],[4,"Y","Y"],[5,"N","N"],[6,"Y","Y"],[7,"N","Y"]]}],"visuals":[{"columns":["product_id","low_fats","recyclable","is_low_fat","is_recyclable","keep_row"],"types":["integer","character varying(1)","character varying(1)","boolean","boolean","boolean"],"rows":[[1,"Y","N",true,false,false],[2,"Y","Y",true,true,true],[3,"N","Y",false,true,false],[4,"Y","Y",true,true,true],[5,"N","N",false,false,false],[6,"Y","Y",true,true,true],[7,"N","Y",false,true,false]]},{"columns":["product_id","low_fats","recyclable"],"types":["integer","character varying(1)","character varying(1)"],"rows":[[2,"Y","Y"],[4,"Y","Y"],[6,"Y","Y"]]}],"output":{"columns":["product_id"],"types":["integer"],"rows":[[2],[4],[6]]}}},{"id":2,"lc":584,"slug":"find-customer-referee","title":"Find Customer Referee","section":"Select","difficulty":"Easy","concepts":["WHERE","NULL","Three-valued logic","IS NULL","OR"],"pattern":"When a filter column can be NULL, handle the NULL case explicitly: `col <> value OR col IS NULL`.","statement":["Each customer row may store the `id` of the customer who referred them in `referee_id`. If nobody referred the customer, `referee_id` is `NULL`.","Return the names of all customers who were **not** referred by the customer with id **2**. That includes customers referred by someone else **and** customers who were not referred by anyone."],"returns":"One column `name`, one row per qualifying customer. Any order is accepted.","setup":"CREATE TABLE Customer (\n  id         INT PRIMARY KEY,\n  name       VARCHAR(25),\n  referee_id INT\n);\n\nINSERT INTO Customer VALUES\n  (1, 'Asha',  NULL),\n  (2, 'Ben',   NULL),\n  (3, 'Chloe', 2),\n  (4, 'Dev',   1),\n  (5, 'Emma',  NULL),\n  (6, 'Farid', 2),\n  (7, 'Gina',  4),\n  (8, 'Hugo',  3);","tables":["Customer"],"table_notes":{"Customer":"Three customers (Asha, Ben, Emma) have referee_id = NULL — nobody referred them. They must appear in the answer."},"solution":"SELECT name\nFROM Customer\nWHERE referee_id <> 2\n   OR referee_id IS NULL;","output_notes":["**Asha, Ben, Emma** — `referee_id` is NULL (not referred by anyone). `referee_id <> 2` gives NULL for them, so they are kept only because of `OR referee_id IS NULL`.","**Dev, Gina, Hugo** — referred by customers 1, 4 and 3. `referee_id <> 2` is TRUE.","**Chloe and Farid** are missing — both were referred by customer 2, so both parts of the condition are FALSE."],"breakdown":[{"code":"SELECT name","text":"Only the customer's name is returned."},{"code":"FROM Customer","text":"Read all 8 customers."},{"code":"WHERE referee_id <> 2","text":"TRUE for customers referred by someone other than 2. But for a NULL `referee_id` the comparison `NULL <> 2` is **NULL** (\"unknown\"), not TRUE — and WHERE only keeps TRUE rows."},{"code":"   OR referee_id IS NULL","text":"Explicitly rescue the not-referred customers. `IS NULL` always returns TRUE or FALSE, never NULL. Because `NULL OR TRUE = TRUE`, these rows now pass the filter."}],"exec_order":[{"stage":"FROM","code":"Customer","text":"Read all 8 rows."},{"stage":"WHERE","code":"referee_id <> 2 OR referee_id IS NULL","text":"Keep 6 rows; drop Chloe and Farid (referred by 2)."},{"stage":"SELECT","code":"name","text":"Return the name column."}],"visuals":[{"kind":"filter","title":"Step 1 — The trap: `referee_id <> 2` on its own","diagram":"SQL uses three-valued logic: TRUE, FALSE and NULL (unknown).\n\n  referee_id │ referee_id <> 2\n  ───────────┼────────────────\n       1     │ TRUE   ✓ kept\n       2     │ FALSE  ✗ dropped\n     NULL    │ NULL   ✗ dropped  ← \"unknown\" is not TRUE\n\nWHERE keeps a row only when the condition is TRUE.","sql":"SELECT id,\n       name,\n       referee_id,\n       referee_id <> 2 AS not_referred_by_2\nFROM Customer\nORDER BY id;","text":"Look at **Asha, Ben and Emma**: their `not_referred_by_2` is **NULL**, not TRUE. Any comparison with NULL (`=`, `<>`, `<`, …) gives NULL, because the database cannot know whether an unknown value equals 2. With only this condition, WHERE would return Dev, Gina and Hugo — and silently lose the three not-referred customers."},{"kind":"filter","title":"Step 2 — Add `OR referee_id IS NULL`","diagram":"  part_a = referee_id <> 2\n  part_b = referee_id IS NULL      (never NULL: TRUE or FALSE)\n\n  referee_id │ part_a │ part_b │ part_a OR part_b\n  ───────────┼────────┼────────┼─────────────────\n     NULL    │ NULL   │ TRUE   │ TRUE   ✓\n       1     │ TRUE   │ FALSE  │ TRUE   ✓\n       2     │ FALSE  │ FALSE  │ FALSE  ✗\n\n  OR rule: if either side is TRUE, the result is TRUE\n           (even when the other side is NULL)","sql":"SELECT id,\n       name,\n       referee_id,\n       referee_id <> 2       AS part_a,\n       referee_id IS NULL    AS part_b,\n       (referee_id <> 2 OR referee_id IS NULL) AS keep_row\nFROM Customer\nORDER BY id;","text":"`IS NULL` is the only correct way to test for NULL, and it never returns NULL itself. For **Asha, Ben and Emma**, `NULL OR TRUE` = **TRUE**. For **Chloe and Farid** (referee 2), both parts are FALSE, so `keep_row` is FALSE. Every other customer has `part_a` = TRUE."},{"kind":"filter","title":"Step 3 — WHERE keeps the TRUE rows","diagram":"8 rows ──▶ WHERE referee_id <> 2 OR referee_id IS NULL ──▶ 6 rows\n\n  Asha ✓  Ben ✓  Chloe ✗  Dev ✓  Emma ✓  Farid ✗  Gina ✓  Hugo ✓","sql":"SELECT id, name, referee_id\nFROM Customer\nWHERE referee_id <> 2\n   OR referee_id IS NULL\nORDER BY id;","text":"Six customers remain: three with a NULL referee and three referred by customers 1, 4 and 3. Only Chloe and Farid — both referred by customer 2 — are removed. The final SELECT keeps just `name`."}],"flow":[{"label":"Input table","detail":"Customer (8 rows, 3 NULL referee_id)","ref":"input"},{"label":"The NULL trap","detail":"referee_id <> 2 is NULL for NULL rows","ref":0},{"label":"OR referee_id IS NULL","detail":"NULL OR TRUE = TRUE → NULL rows rescued","ref":1},{"label":"WHERE filter","detail":"keep 6 rows, drop the two referred by 2","ref":2},{"label":"Final output","detail":"SELECT name","ref":"output"}],"takeaway":{"pattern":"\"Not equal to X\" on a nullable column → `col <> X OR col IS NULL`. A plain `<>` silently drops every NULL row, because comparisons with NULL are unknown, not TRUE.","asks":["Why does `WHERE referee_id <> 2` alone return too few rows? (`NULL <> 2` is NULL, and WHERE keeps only TRUE.)","Why not `WHERE referee_id = NULL`? (It is NULL for every row, so it matches nothing. Always use `IS NULL` / `IS NOT NULL`.)","Is `NOT (referee_id = 2)` any better? (No. `NOT NULL` is still NULL, so the NULL rows are still lost.)","How would you find customers referred by 2? (`WHERE referee_id = 2` — here NULLs are correctly excluded, no extra check needed.)"],"alternatives":["`WHERE COALESCE(referee_id, 0) <> 2` — replaces NULL with 0 before comparing. Short, but relies on 0 never being a real id and hides the intent; the explicit `OR … IS NULL` is clearer.","`WHERE referee_id IS DISTINCT FROM 2` — PostgreSQL's NULL-safe \"not equal\". Correct and concise, but less portable and less familiar to interviewers than the explicit OR."],"realworld":"Any optional foreign key or optional attribute: \"orders not shipped by carrier X\", \"users not in plan 'free'\", \"tickets not assigned to Bob\". Forgetting the NULL case silently drops the unassigned / unknown rows from reports."},"mistakes":["Writing only `WHERE referee_id <> 2` (or `!= 2`) — the customers with no referee disappear.","Testing NULL with `= NULL` or `<> NULL` — these are always NULL, never TRUE. Use `IS NULL`.","Using `NOT (referee_id = 2)` or `referee_id NOT IN (2)` — same NULL trap: the result is NULL for NULL rows.","Mixing AND and OR without parentheses when adding more conditions later, e.g. `WHERE referee_id <> 2 OR referee_id IS NULL AND name LIKE 'A%'` — AND binds tighter than OR, so wrap the OR pair in parentheses."],"built":{"id":2,"inputs":[{"name":"Customer","columns":["id","name","referee_id"],"types":["integer","character varying(25)","integer"],"rows":[[1,"Asha",null],[2,"Ben",null],[3,"Chloe",2],[4,"Dev",1],[5,"Emma",null],[6,"Farid",2],[7,"Gina",4],[8,"Hugo",3]]}],"visuals":[{"columns":["id","name","referee_id","not_referred_by_2"],"types":["integer","character varying(25)","integer","boolean"],"rows":[[1,"Asha",null,null],[2,"Ben",null,null],[3,"Chloe",2,false],[4,"Dev",1,true],[5,"Emma",null,null],[6,"Farid",2,false],[7,"Gina",4,true],[8,"Hugo",3,true]]},{"columns":["id","name","referee_id","part_a","part_b","keep_row"],"types":["integer","character varying(25)","integer","boolean","boolean","boolean"],"rows":[[1,"Asha",null,null,true,true],[2,"Ben",null,null,true,true],[3,"Chloe",2,false,false,false],[4,"Dev",1,true,false,true],[5,"Emma",null,null,true,true],[6,"Farid",2,false,false,false],[7,"Gina",4,true,false,true],[8,"Hugo",3,true,false,true]]},{"columns":["id","name","referee_id"],"types":["integer","character varying(25)","integer"],"rows":[[1,"Asha",null],[2,"Ben",null],[4,"Dev",1],[5,"Emma",null],[7,"Gina",4],[8,"Hugo",3]]}],"output":{"columns":["name"],"types":["character varying(25)"],"rows":[["Asha"],["Ben"],["Dev"],["Emma"],["Gina"],["Hugo"]]}}},{"id":3,"lc":595,"slug":"big-countries","title":"Big Countries","section":"Select","difficulty":"Easy","concepts":["WHERE","OR",">= boundaries","Column selection"],"pattern":"\"Matches condition A or condition B\" → combine the two comparisons with OR in WHERE, and watch the inclusive boundaries (`>=`).","statement":["The `World` table has one row per country with its continent, area (km²), population and GDP.","A country counts as **big** if its area is **at least 3,000,000 km²**, or its population is **at least 25,000,000** — meeting either rule is enough. List the big countries."],"returns":"Three columns in this order: `name`, `population`, `area` — one row per big country. Any order is accepted.","setup":"CREATE TABLE World (\n  name       VARCHAR(255) PRIMARY KEY,\n  continent  VARCHAR(255),\n  area       INT,\n  population INT,\n  gdp        BIGINT\n);\n\nINSERT INTO World VALUES\n  ('Australia', 'Oceania',       7692024,  23800000, 1350000000000),\n  ('Brazil',    'South America', 8515767, 214000000, 1650000000000),\n  ('Kenya',     'Africa',         580367,  54000000,  110000000000),\n  ('Mongolia',  'Asia',          1564116,   3400000,   15000000000),\n  ('Portugal',  'Europe',          92212,  10300000,  250000000000),\n  ('Yemen',     'Asia',           527968,  25000000,   21000000000);","tables":["World"],"table_notes":{"World":"Figures are rounded and simplified for teaching. Australia is big only by area, Kenya only by population, and Yemen sits **exactly** on the 25,000,000 boundary."},"solution":"SELECT name,\n       population,\n       area\nFROM World\nWHERE area >= 3000000\n   OR population >= 25000000;","output_notes":["**Australia** — population is below 25 million, but the area (7,692,024) passes the area rule.","**Brazil** — passes both rules; it still appears only once, because WHERE checks each row once.","**Kenya** — small area, but 54 million people.","**Yemen** — population is exactly 25,000,000. \"At least\" means `>=`, so it is big.","**Mongolia and Portugal** are missing — they fail both rules."],"breakdown":[{"code":"SELECT name,\n       population,\n       area","text":"Return exactly these three columns, in the order the problem lists them (not the table's order)."},{"code":"FROM World","text":"Read all 6 countries."},{"code":"WHERE area >= 3000000","text":"Rule 1: area of **at least** 3 million. `>=` includes the boundary value itself."},{"code":"   OR population >= 25000000","text":"Rule 2: population of at least 25 million. `OR` keeps a row if **either** rule is TRUE (or both)."}],"exec_order":[{"stage":"FROM","code":"World","text":"Read all 6 rows."},{"stage":"WHERE","code":"area >= 3000000 OR population >= 25000000","text":"Keep the 4 rows that pass at least one rule."},{"stage":"SELECT","code":"name, population, area","text":"Pick and order the three output columns."}],"visuals":[{"kind":"filter","title":"Step 1 — Evaluate both rules on every country","diagram":"  big_by_area       = area       >= 3000000\n  big_by_population = population >= 25000000\n\n  is_big = big_by_area OR big_by_population\n\n  OR truth table:  TRUE  OR TRUE  = TRUE  ✓\n                   TRUE  OR FALSE = TRUE  ✓\n                   FALSE OR TRUE  = TRUE  ✓\n                   FALSE OR FALSE = FALSE ✗","sql":"SELECT name,\n       area,\n       population,\n       area >= 3000000        AS big_by_area,\n       population >= 25000000 AS big_by_population,\n       (area >= 3000000 OR population >= 25000000) AS is_big\nFROM World\nORDER BY name;","text":"**Australia** passes only the area rule and **Kenya** only the population rule — OR keeps both. **Yemen** has exactly 25,000,000 people, so `>=` gives TRUE (with `>` it would be FALSE). **Mongolia** is large (1.56 million km²) but still below 3 million, and **Portugal** fails both."},{"kind":"filter","title":"Step 2 — WHERE keeps the big countries, SELECT picks 3 columns","diagram":"6 rows ──▶ WHERE area >= 3000000 OR population >= 25000000 ──▶ 4 rows\n\n  Australia ✓ (area)     Brazil ✓ (both)     Kenya ✓ (population)\n  Mongolia  ✗            Portugal ✗          Yemen ✓ (population = boundary)\n\n  then SELECT name, population, area   (continent and gdp dropped)","sql":"SELECT name,\n       population,\n       area\nFROM World\nWHERE area >= 3000000\n   OR population >= 25000000\nORDER BY name;","text":"Four countries survive. Brazil passes both rules but appears once — a WHERE filter never duplicates rows. `continent` and `gdp` are not needed, and `population` comes before `area` as the problem asks."}],"flow":[{"label":"Input table","detail":"World (6 countries)","ref":"input"},{"label":"Evaluate the two rules","detail":"big_by_area OR big_by_population","ref":0},{"label":"WHERE + SELECT","detail":"keep 4 big countries, 3 columns","ref":1},{"label":"Final output","detail":"name, population, area","ref":"output"}],"takeaway":{"pattern":"\"X or Y qualifies\" → `WHERE x OR y`. Translate \"at least\" to `>=` and \"more than\" to `>`.","asks":["What would change with `>` instead of `>=`? (Yemen, with exactly 25,000,000 people, would be lost.)","Could you write it with UNION? (Yes: one SELECT per rule joined with `UNION`. Use `UNION`, not `UNION ALL`, or Brazil would appear twice.)","Why is UNION sometimes suggested for performance? (Each branch can use its own index — one on area, one on population. PostgreSQL can often do the same for OR with a BitmapOr of two indexes, so the plain OR is usually fine.)","What if `area` or `population` could be NULL? (`NULL >= 3000000` is NULL; the row is kept only if the other rule is TRUE — usually the desired behaviour.)"],"alternatives":["`SELECT name, population, area FROM World WHERE area >= 3000000\nUNION\nSELECT name, population, area FROM World WHERE population >= 25000000;` — same result; UNION removes the duplicate Brazil row."],"realworld":"Segmenting customers or accounts by thresholds: \"high value if revenue ≥ 1M OR employees ≥ 500\", \"flag a transaction if amount ≥ 10,000 OR country is on a watch list\"."},"mistakes":["Using `AND` instead of `OR` — only countries passing both rules (Brazil) would remain.","Using `>` instead of `>=` — boundary rows like Yemen are dropped.","Miscounting zeros: `3000000` is three million, `300000` is three hundred thousand. Numeric literals cannot contain commas in SQL.","Returning the columns in the wrong order or adding extra columns (`continent`, `gdp`) — the expected result is exactly `name, population, area`.","Using `UNION ALL` in the UNION version — a country passing both rules appears twice."],"built":{"id":3,"inputs":[{"name":"World","columns":["name","continent","area","population","gdp"],"types":["character varying(255)","character varying(255)","integer","integer","bigint"],"rows":[["Australia","Oceania",7692024,23800000,1350000000000],["Brazil","South America",8515767,214000000,1650000000000],["Kenya","Africa",580367,54000000,110000000000],["Mongolia","Asia",1564116,3400000,15000000000],["Portugal","Europe",92212,10300000,250000000000],["Yemen","Asia",527968,25000000,21000000000]]}],"visuals":[{"columns":["name","area","population","big_by_area","big_by_population","is_big"],"types":["character varying(255)","integer","integer","boolean","boolean","boolean"],"rows":[["Australia",7692024,23800000,true,false,true],["Brazil",8515767,214000000,true,true,true],["Kenya",580367,54000000,false,true,true],["Mongolia",1564116,3400000,false,false,false],["Portugal",92212,10300000,false,false,false],["Yemen",527968,25000000,false,true,true]]},{"columns":["name","population","area"],"types":["character varying(255)","integer","integer"],"rows":[["Australia",23800000,7692024],["Brazil",214000000,8515767],["Kenya",54000000,580367],["Yemen",25000000,527968]]}],"output":{"columns":["name","population","area"],"types":["character varying(255)","integer","integer"],"rows":[["Australia",23800000,7692024],["Brazil",214000000,8515767],["Kenya",54000000,580367],["Yemen",25000000,527968]]}}},{"id":4,"lc":1148,"slug":"article-views-i","title":"Article Views I","section":"Select","difficulty":"Easy","concepts":["WHERE col = col","DISTINCT","Column alias","ORDER BY"],"pattern":"Compare two columns of the same row in WHERE, then use DISTINCT to report each qualifying value once, sorted with ORDER BY.","statement":["The `Views` table logs article views: which article was viewed, who wrote it (`author_id`), who viewed it (`viewer_id`) and when. Authors and viewers share the same id space, so `author_id = viewer_id` means a person viewed their own article. The table has no primary key and may contain identical rows.","Find every author who viewed **at least one of their own articles**."],"returns":"One column named `id` with each such author **once**, sorted by `id` in ascending order.","setup":"CREATE TABLE Views (\n  article_id INT,\n  author_id  INT,\n  viewer_id  INT,\n  view_date  DATE\n);\n\nINSERT INTO Views VALUES\n  (14, 5, 5, '2024-03-01'),\n  (10, 1, 4, '2024-03-02'),\n  (10, 1, 1, '2024-03-02'),\n  (11, 2, 5, '2024-03-02'),\n  (12, 3, 3, '2024-03-03'),\n  (12, 3, 3, '2024-03-03'),\n  (10, 1, 1, '2024-03-05'),\n  (13, 4, 2, '2024-03-06');","tables":["Views"],"table_notes":{"Views":"No primary key: the two (12, 3, 3, 2024-03-03) rows are identical. Author 1 also viewed article 10 on two different days. Author 5 appears first in the table but must not be first in the answer."},"solution":"SELECT DISTINCT author_id AS id\nFROM Views\nWHERE author_id = viewer_id\nORDER BY id;","official_ordered":true,"output_notes":["**1** — viewed own article 10 twice (2024-03-02 and 2024-03-05). DISTINCT reports author 1 once.","**3** — two identical self-view rows; DISTINCT collapses them to one.","**5** — viewed own article 14 once. It was the first row in the table, but ORDER BY puts it last.","**2 and 4** are missing — author 2's article was viewed by user 5, author 4's by user 2; neither author viewed their own work."],"breakdown":[{"code":"SELECT DISTINCT author_id AS id","text":"Return the author id, renamed to `id` as the problem requires. `DISTINCT` removes duplicate result rows, so an author with several self-views is listed once."},{"code":"FROM Views","text":"Read all 8 view rows."},{"code":"WHERE author_id = viewer_id","text":"Compare two columns of the **same row**: the person who viewed is the person who wrote the article. 5 of the 8 rows pass."},{"code":"ORDER BY id","text":"Sort ascending (ASC is the default). Without ORDER BY, SQL guarantees **no** order — rows can come back in any order, e.g. 5 first. With `SELECT DISTINCT`, ORDER BY may only use columns that are in the SELECT list; the alias `id` is fine."}],"exec_order":[{"stage":"FROM","code":"Views","text":"Read all 8 rows."},{"stage":"WHERE","code":"author_id = viewer_id","text":"Keep the 5 self-view rows."},{"stage":"SELECT","code":"author_id AS id","text":"Project one column: 5, 1, 3, 3, 1 (with repeats)."},{"stage":"DISTINCT","code":"DISTINCT","text":"Remove repeats → 1, 3, 5."},{"stage":"ORDER BY","code":"id","text":"Sort ascending."}],"visuals":[{"kind":"filter","title":"Step 1 — Compare author_id with viewer_id on every row","diagram":"for each row:\n  author_id ─── = ───▶ viewer_id ?\n\n     same person → is_self_view = TRUE  ✓\n  different      → is_self_view = FALSE ✗","sql":"SELECT article_id,\n       author_id,\n       viewer_id,\n       view_date,\n       author_id = viewer_id AS is_self_view\nFROM Views\nORDER BY article_id, view_date, viewer_id;","text":"The comparison is between two columns of the **same row**, so no join is needed. Article 10 by author 1 was viewed by user 4 (FALSE) and twice by author 1 (TRUE). Author 2's article 11 and author 4's article 13 were only viewed by other people."},{"kind":"filter","title":"Step 2 — WHERE keeps the self-views (repeats included)","diagram":"8 rows ──▶ WHERE author_id = viewer_id ──▶ 5 rows\n\n  author 1 → 2 rows (different days)\n  author 3 → 2 rows (identical rows!)\n  author 5 → 1 row","sql":"SELECT article_id, author_id, viewer_id, view_date\nFROM Views\nWHERE author_id = viewer_id\nORDER BY author_id, view_date;","text":"Five rows remain, but only three different authors. If we stopped here and selected `author_id`, the answer would be `1, 1, 3, 3, 5` (in no guaranteed order) — authors 1 and 3 would be listed twice."},{"kind":"group","title":"Step 3 — DISTINCT collapses repeats, ORDER BY sorts","diagram":"SELECT author_id AS id  →  5, 1, 3, 3, 1   (table order, repeats)\n\nDISTINCT:\n  id 1 ├─ self-view 2024-03-02\n       └─ self-view 2024-03-05   → 1\n  id 3 ├─ self-view 2024-03-03\n       └─ self-view 2024-03-03   → 3\n  id 5 └─ self-view 2024-03-01   → 5\n\nORDER BY id  →  1, 3, 5","sql":"SELECT author_id AS id,\n       COUNT(*) AS self_view_rows_collapsed\nFROM Views\nWHERE author_id = viewer_id\nGROUP BY author_id\nORDER BY id;","text":"`DISTINCT` keeps one row per distinct value of the selected columns — it behaves like `GROUP BY id` with no aggregate. The helper column shows how many rows were merged into each id (2 for authors 1 and 3). Finally `ORDER BY id` puts author 5, the first row in the table, at the end."}],"flow":[{"label":"Input table","detail":"Views (8 rows, with duplicates)","ref":"input"},{"label":"Compare columns","detail":"author_id = viewer_id per row","ref":0},{"label":"WHERE filter","detail":"5 self-view rows, 3 authors","ref":1},{"label":"DISTINCT","detail":"one row per author","ref":2},{"label":"Final output","detail":"ORDER BY id → 1, 3, 5","ref":"output"}],"takeaway":{"pattern":"\"List each X that has at least one matching row\" → filter with WHERE, then `SELECT DISTINCT x` so each X appears once. Add ORDER BY whenever an order is required.","asks":["Why is DISTINCT needed? (An author can view their own articles many times, and the table can contain identical rows.)","DISTINCT or GROUP BY? (`SELECT author_id FROM … GROUP BY author_id` gives the same result. Use GROUP BY when you also need an aggregate like COUNT.)","Can you `ORDER BY view_date` here? (No. With SELECT DISTINCT, PostgreSQL requires ORDER BY expressions to appear in the select list — each id could have several dates, so the order would be ambiguous.)","How would you count how many authors viewed their own work? (`SELECT COUNT(DISTINCT author_id) FROM Views WHERE author_id = viewer_id`.)"],"alternatives":["`SELECT author_id AS id FROM Views WHERE author_id = viewer_id GROUP BY author_id ORDER BY id;` — GROUP BY instead of DISTINCT, same result."],"realworld":"Self-interaction detection: users who liked their own posts, sellers who bought their own listings, employees who approved their own expenses. DISTINCT turns an event log into a list of people."},"mistakes":["Forgetting `DISTINCT` — authors with multiple self-views appear several times.","Forgetting `ORDER BY` — the problem requires ascending order, and SQL never guarantees an order without it (here author 5 could come first).","Not renaming the column — the expected column name is `id`, so write `author_id AS id`.","Writing `DISTINCT(author_id)` and thinking it applies to only one column. `DISTINCT` applies to the whole selected row; the parentheses are just grouping the expression.","Ordering by a column that is not selected (e.g. `ORDER BY view_date`) — with SELECT DISTINCT PostgreSQL raises an error."],"built":{"id":4,"inputs":[{"name":"Views","columns":["article_id","author_id","viewer_id","view_date"],"types":["integer","integer","integer","date"],"rows":[[14,5,5,"2024-03-01"],[10,1,4,"2024-03-02"],[10,1,1,"2024-03-02"],[11,2,5,"2024-03-02"],[12,3,3,"2024-03-03"],[12,3,3,"2024-03-03"],[10,1,1,"2024-03-05"],[13,4,2,"2024-03-06"]]}],"visuals":[{"columns":["article_id","author_id","viewer_id","view_date","is_self_view"],"types":["integer","integer","integer","date","boolean"],"rows":[[10,1,1,"2024-03-02",true],[10,1,4,"2024-03-02",false],[10,1,1,"2024-03-05",true],[11,2,5,"2024-03-02",false],[12,3,3,"2024-03-03",true],[12,3,3,"2024-03-03",true],[13,4,2,"2024-03-06",false],[14,5,5,"2024-03-01",true]]},{"columns":["article_id","author_id","viewer_id","view_date"],"types":["integer","integer","integer","date"],"rows":[[10,1,1,"2024-03-02"],[10,1,1,"2024-03-05"],[12,3,3,"2024-03-03"],[12,3,3,"2024-03-03"],[14,5,5,"2024-03-01"]]},{"columns":["id","self_view_rows_collapsed"],"types":["integer","bigint"],"rows":[[1,2],[3,2],[5,1]]}],"output":{"columns":["id"],"types":["integer"],"rows":[[1],[3],[5]]}}},{"id":5,"lc":1683,"slug":"invalid-tweets","title":"Invalid Tweets","section":"Select","difficulty":"Easy","concepts":["WHERE","LENGTH","CHAR_LENGTH","Strict comparison"],"pattern":"Filter on a computed value: apply a string function (LENGTH) to the column inside WHERE and compare the result.","statement":["The `Tweets` table stores each tweet's id and its text `content`. The text contains only letters, digits, spaces and `!`.","A tweet is **invalid** when its content has **more than 15 characters** (16 or more). Find the invalid tweets."],"returns":"One column `tweet_id` with the ids of invalid tweets. Any order is accepted.","setup":"CREATE TABLE Tweets (\n  tweet_id INT PRIMARY KEY,\n  content  VARCHAR(50)\n);\n\nINSERT INTO Tweets VALUES\n  (1, 'Hello world'),\n  (2, 'Exactly fifteen'),\n  (3, 'Sixteen letters!'),\n  (4, 'SQL is fun'),\n  (5, 'I just shipped my first SQL query!');","tables":["Tweets"],"table_notes":{"Tweets":"Tweet 2 has exactly 15 characters and tweet 3 exactly 16 — the two boundary cases. Spaces and `!` count as characters."},"solution":"SELECT tweet_id\nFROM Tweets\nWHERE LENGTH(content) > 15;","output_notes":["**3** — `'Sixteen letters!'` is 16 characters (including the space and `!`). 16 > 15, so it is invalid.","**5** — 34 characters, clearly too long.","**2** is missing — exactly 15 characters is still valid, because the rule is **strictly** greater than 15.","**1 and 4** are missing — 11 and 10 characters."],"breakdown":[{"code":"SELECT tweet_id","text":"Only the ids are returned."},{"code":"FROM Tweets","text":"Read all 5 tweets."},{"code":"WHERE LENGTH(content) > 15","text":"Compute the number of characters of each tweet and keep it if it is **strictly** greater than 15. In PostgreSQL, `LENGTH(text)` counts **characters** (same as `CHAR_LENGTH`), and spaces and punctuation count too."}],"exec_order":[{"stage":"FROM","code":"Tweets","text":"Read all 5 rows."},{"stage":"WHERE","code":"LENGTH(content) > 15","text":"Compute the length per row; keep tweets 3 and 5."},{"stage":"SELECT","code":"tweet_id","text":"Return the id column."}],"visuals":[{"kind":"string","title":"Step 1 — Compute the length of every tweet","diagram":"content ──▶ LENGTH(content) ──▶ > 15 ?\n\n  'Exactly fifteen'   → 15 → FALSE  (boundary: still valid)\n  'Sixteen letters!'  → 16 → TRUE   (boundary: invalid)\n   └ 7 letters + 1 space + 8 chars incl. '!' = 16","sql":"SELECT tweet_id,\n       content,\n       LENGTH(content)      AS length,\n       CHAR_LENGTH(content) AS char_length,\n       LENGTH(content) > 15 AS is_invalid\nFROM Tweets\nORDER BY tweet_id;","text":"`LENGTH` and `CHAR_LENGTH` give the same numbers on every row — in PostgreSQL both count characters. **Tweet 2** has exactly 15, so `> 15` is FALSE; **tweet 3** has 16 and is the shortest invalid tweet. Spaces and `!` are characters too."},{"kind":"string","title":"Step 2 — Side note: characters vs bytes","diagram":"           PostgreSQL            MySQL\nLENGTH       characters            BYTES   ← different!\nCHAR_LENGTH  characters            characters\nOCTET_LENGTH bytes                 bytes\n\n'é' is 1 character but 2 bytes in UTF-8","sql":"SELECT word,\n       LENGTH(word)       AS length,\n       CHAR_LENGTH(word)  AS char_length,\n       OCTET_LENGTH(word) AS octet_length\nFROM (VALUES ('Code'), ('café'), ('naïve résumé')) AS t(word)\nORDER BY word;","text":"This small demo uses literal words, not the Tweets table. For plain ASCII like `'Code'` all three functions agree. For `'café'`, PostgreSQL's `LENGTH` still says 4 characters, while `OCTET_LENGTH` says 5 bytes. In **MySQL**, `LENGTH` means bytes, so `CHAR_LENGTH` is the portable choice; in PostgreSQL either `LENGTH` or `CHAR_LENGTH` is correct."},{"kind":"filter","title":"Step 3 — WHERE keeps the tweets longer than 15","diagram":"5 rows ──▶ WHERE LENGTH(content) > 15 ──▶ 2 rows\n\n  1 (11) ✗   2 (15) ✗   3 (16) ✓   4 (10) ✗   5 (34) ✓","sql":"SELECT tweet_id, content, LENGTH(content) AS length\nFROM Tweets\nWHERE LENGTH(content) > 15\nORDER BY tweet_id;","text":"Tweets **3** and **5** remain. The final SELECT returns only `tweet_id`."}],"flow":[{"label":"Input table","detail":"Tweets (5 rows)","ref":"input"},{"label":"Compute LENGTH","detail":"characters per tweet, compare with 15","ref":0},{"label":"Characters vs bytes","detail":"LENGTH = CHAR_LENGTH in PostgreSQL","ref":1},{"label":"WHERE filter","detail":"keep length > 15 → 2 rows","ref":2},{"label":"Final output","detail":"SELECT tweet_id","ref":"output"}],"takeaway":{"pattern":"\"Rows whose text is longer than N\" → `WHERE LENGTH(col) > N`. Read the boundary carefully: \"strictly greater\" is `>`, \"at least\" is `>=`.","asks":["Does LENGTH count bytes or characters? (In PostgreSQL, characters. In MySQL, bytes — there you would use CHAR_LENGTH.)","Do spaces count? (Yes, every character counts, including spaces and punctuation. Note: for the fixed-width type `CHAR(n)`, PostgreSQL ignores trailing padding spaces in LENGTH; for `VARCHAR`/`TEXT` they count.)","Can an index help? (A plain index on `content` cannot be used for `LENGTH(content) > 15`. An expression index `CREATE INDEX ON Tweets (LENGTH(content))` can.)","How would you return the length too? (`SELECT tweet_id, LENGTH(content) AS len FROM Tweets WHERE LENGTH(content) > 15`.)"],"alternatives":["`WHERE CHAR_LENGTH(content) > 15` — identical in PostgreSQL and the portable choice across databases."],"realworld":"Data validation and cleanup: usernames that are too long, SMS messages over 160 characters, product titles that will be truncated in the UI."},"mistakes":["Using `>= 15` — a tweet of exactly 15 characters (tweet 2) is valid and must not be returned.","Assuming `LENGTH` counts bytes. That is MySQL behaviour; in PostgreSQL `LENGTH` counts characters, and `OCTET_LENGTH` counts bytes.","Trying to filter on an alias defined in SELECT, e.g. `SELECT LENGTH(content) AS len … WHERE len > 15` — WHERE runs before SELECT, so the alias does not exist yet. Repeat the expression."],"built":{"id":5,"inputs":[{"name":"Tweets","columns":["tweet_id","content"],"types":["integer","character varying(50)"],"rows":[[1,"Hello world"],[2,"Exactly fifteen"],[3,"Sixteen letters!"],[4,"SQL is fun"],[5,"I just shipped my first SQL query!"]]}],"visuals":[{"columns":["tweet_id","content","length","char_length","is_invalid"],"types":["integer","character varying(50)","integer","integer","boolean"],"rows":[[1,"Hello world",11,11,false],[2,"Exactly fifteen",15,15,false],[3,"Sixteen letters!",16,16,true],[4,"SQL is fun",10,10,false],[5,"I just shipped my first SQL query!",34,34,true]]},{"columns":["word","length","char_length","octet_length"],"types":["text","integer","integer","integer"],"rows":[["Code",4,4,4],["café",4,4,5],["naïve résumé",12,12,15]]},{"columns":["tweet_id","content","length"],"types":["integer","character varying(50)","integer"],"rows":[[3,"Sixteen letters!",16],[5,"I just shipped my first SQL query!",34]]}],"output":{"columns":["tweet_id"],"types":["integer"],"rows":[[3],[5]]}}},{"id":6,"lc":1378,"slug":"replace-employee-id-with-the-unique-identifier","title":"Replace Employee ID With The Unique Identifier","section":"Basic Joins","difficulty":"Easy","concepts":["LEFT JOIN","NULL for missing matches","Join key","Column aliases"],"pattern":"Keep every row of the main table and look up an optional attribute from a second table with LEFT JOIN.","statement":["A company stores its staff in **Employees** (`id`, `name`). A second table, **EmployeeUNI**, maps some of those internal `id`s to a company-wide `unique_id`. Not every employee has been given a unique ID yet.","For **every employee**, show their `unique_id` next to their `name`. If an employee has no unique ID, they must still appear, with `NULL` as the unique ID."],"returns":"Two columns, `unique_id` and `name`, with one row per employee (`unique_id` is `NULL` when there is no mapping). Any order.","setup":"CREATE TABLE Employees (\n  id   INT PRIMARY KEY,\n  name VARCHAR(20)\n);\nCREATE TABLE EmployeeUNI (\n  id        INT,\n  unique_id INT,\n  PRIMARY KEY (id, unique_id)\n);\n\nINSERT INTO Employees VALUES\n  (1, 'Priya'), (2, 'Marco'), (5, 'Hana'), (8, 'Omar'), (12, 'Lena');\nINSERT INTO EmployeeUNI VALUES\n  (2, 101), (8, 102), (12, 103), (20, 104);","tables":["Employees","EmployeeUNI"],"table_notes":{"Employees":"Priya (1) and Hana (5) have no row in EmployeeUNI.","EmployeeUNI":"id 20 belongs to nobody in Employees — an orphan mapping that must not appear in the answer."},"solution":"SELECT u.unique_id,\n       e.name\nFROM Employees AS e\nLEFT JOIN EmployeeUNI AS u\n       ON u.id = e.id;","display_sql":"SELECT u.unique_id,\n       e.name\nFROM Employees AS e\nLEFT JOIN EmployeeUNI AS u\n       ON u.id = e.id\nORDER BY e.id;","output_notes":["**Priya → NULL** and **Hana → NULL** — they have no mapping, but the LEFT JOIN keeps them and fills `unique_id` with `NULL`.","**Marco → 101**, **Omar → 102**, **Lena → 103** — their `id` matches a row in EmployeeUNI.","The mapping `(20, 104)` is missing from the output — no employee has id 20, and a LEFT JOIN only keeps unmatched rows from the **left** table."],"breakdown":[{"code":"FROM Employees AS e","text":"Start from the table whose rows must **all** appear: every employee (5 rows)."},{"code":"LEFT JOIN EmployeeUNI AS u\n       ON u.id = e.id","text":"Look up each employee's mapping by `id`. Matched employees get the `u.*` columns filled in; employees without a mapping are kept with `u.*` = `NULL`."},{"code":"SELECT u.unique_id,\n       e.name","text":"Return the two requested columns, in the requested order: `unique_id` first, then `name`. The NULLs from the LEFT JOIN are exactly the \"show null\" rows the problem wants."}],"exec_order":[{"stage":"FROM","code":"Employees e","text":"Read all 5 employees."},{"stage":"JOIN / ON","code":"LEFT JOIN EmployeeUNI u ON u.id = e.id","text":"Attach mappings; 3 employees match, 2 are kept with NULLs → 5 rows."},{"stage":"SELECT","code":"u.unique_id, e.name","text":"Keep only the two output columns."}],"visuals":[{"kind":"join","title":"Step 1 — LEFT JOIN EmployeeUNI onto Employees","diagram":"Employees e (5 rows)            EmployeeUNI u (4 rows)\n   e.id ─────────── = ──────────▶ u.id\n\n   1  Priya   ✗ no match   → kept, u.* = NULL\n   2  Marco   ✓ 2 → 101\n   5  Hana    ✗ no match   → kept, u.* = NULL\n   8  Omar    ✓ 8 → 102\n  12  Lena    ✓ 12 → 103\n                  (20 → 104 has no employee → dropped)\n          │\n          ▼\n  5 rows (one per employee)","sql":"SELECT e.id,\n       e.name,\n       u.id        AS uni_id,\n       u.unique_id\nFROM Employees AS e\nLEFT JOIN EmployeeUNI AS u\n       ON u.id = e.id\nORDER BY e.id;","text":"Every employee survives. **Priya** and **Hana** found no row with their `id`, so both `uni_id` and `unique_id` are `NULL`. The orphan mapping for id **20** never shows up, because a LEFT JOIN keeps unmatched rows from the left side only."},{"kind":"join","title":"Step 2 — Why not INNER JOIN? Compare the two joins row by row","diagram":"employee   match in EmployeeUNI?   LEFT JOIN     INNER JOIN\nPriya      ✗                       kept (NULL)   dropped\nMarco      ✓                       kept          kept\nHana       ✗                       kept (NULL)   dropped\nOmar       ✓                       kept          kept\nLena       ✓                       kept          kept","sql":"SELECT e.id,\n       e.name,\n       u.unique_id,\n       CASE WHEN u.id IS NULL THEN 'kept, NULL' ELSE 'kept' END    AS left_join,\n       CASE WHEN u.id IS NULL THEN 'dropped'    ELSE 'kept' END    AS inner_join\nFROM Employees AS e\nLEFT JOIN EmployeeUNI AS u\n       ON u.id = e.id\nORDER BY e.id;","text":"An INNER JOIN would return only Marco, Omar and Lena — Priya and Hana would silently disappear. The problem explicitly wants them with `NULL`, which is the definition of a LEFT JOIN from Employees."}],"flow":[{"label":"Input tables","detail":"Employees (5) · EmployeeUNI (4)","ref":"input"},{"label":"LEFT JOIN on id","detail":"keep every employee, NULL when no mapping","ref":0},{"label":"LEFT vs INNER","detail":"INNER JOIN would drop Priya and Hana","ref":1},{"label":"Final output","detail":"unique_id, name","ref":"output"}],"takeaway":{"pattern":"\"Show X for every row, or NULL if it has none\" → `FROM main_table LEFT JOIN lookup_table ON key`.","asks":["Which table goes on the left? (The one whose rows must all appear — Employees.)","What if one employee had two unique IDs? (The (id, unique_id) key allows it; that employee would appear twice — one row per mapping.)","How would you write it as a RIGHT JOIN? (`FROM EmployeeUNI u RIGHT JOIN Employees e ON …` — same result, but LEFT JOIN is easier to read.)"],"alternatives":["Correlated subquery: `SELECT (SELECT u.unique_id FROM EmployeeUNI u WHERE u.id = e.id) AS unique_id, e.name FROM Employees e` — works only while each employee has at most one mapping (otherwise it errors)."],"realworld":"Enriching a master list with optional data: customers with their (maybe missing) loyalty card number, products with their (maybe missing) barcode, users with their (maybe missing) profile picture."},"mistakes":["Using INNER JOIN (or plain `JOIN`) — employees without a unique ID disappear.","Putting EmployeeUNI on the left of a LEFT JOIN — you keep orphan mappings instead of employees.","Returning the columns in the wrong order or with different names — the expected header is `unique_id, name`.","Writing `COALESCE(u.unique_id, 0)` — the problem wants `NULL`, not a placeholder value."],"built":{"id":6,"inputs":[{"name":"Employees","columns":["id","name"],"types":["integer","character varying(20)"],"rows":[[1,"Priya"],[2,"Marco"],[5,"Hana"],[8,"Omar"],[12,"Lena"]]},{"name":"EmployeeUNI","columns":["id","unique_id"],"types":["integer","integer"],"rows":[[2,101],[8,102],[12,103],[20,104]]}],"visuals":[{"columns":["id","name","uni_id","unique_id"],"types":["integer","character varying(20)","integer","integer"],"rows":[[1,"Priya",null,null],[2,"Marco",2,101],[5,"Hana",null,null],[8,"Omar",8,102],[12,"Lena",12,103]]},{"columns":["id","name","unique_id","left_join","inner_join"],"types":["integer","character varying(20)","integer","text","text"],"rows":[[1,"Priya",null,"kept, NULL","dropped"],[2,"Marco",101,"kept","kept"],[5,"Hana",null,"kept, NULL","dropped"],[8,"Omar",102,"kept","kept"],[12,"Lena",103,"kept","kept"]]}],"output":{"columns":["unique_id","name"],"types":["integer","character varying(20)"],"rows":[[null,"Priya"],[101,"Marco"],[null,"Hana"],[102,"Omar"],[103,"Lena"]]}}},{"id":7,"lc":1068,"slug":"product-sales-analysis-i","title":"Product Sales Analysis I","section":"Basic Joins","difficulty":"Easy","concepts":["INNER JOIN","Foreign key lookup","Table aliases","Many-to-one join"],"pattern":"Translate an ID in a fact table into a readable name by INNER JOINing the dimension table on its key.","statement":["A shop records every sale in **Sales** (`sale_id`, `product_id`, `year`, `quantity`, `price` per unit). The product names live in a separate table, **Product** (`product_id`, `product_name`).","For **every sale**, show the product's name together with the sale's year and unit price."],"returns":"One row per row of Sales with the columns `product_name`, `year`, `price`. Any order.","setup":"CREATE TABLE Product (\n  product_id   INT PRIMARY KEY,\n  product_name VARCHAR(10)\n);\nCREATE TABLE Sales (\n  sale_id    INT,\n  product_id INT REFERENCES Product (product_id),\n  year       INT,\n  quantity   INT,\n  price      INT,\n  PRIMARY KEY (sale_id, year)\n);\n\nINSERT INTO Product VALUES\n  (10, 'Kettle'), (20, 'Toaster'), (30, 'Blender'), (40, 'Mixer');\nINSERT INTO Sales VALUES\n  (1, 10, 2022, 3, 40),\n  (2, 10, 2023, 5, 45),\n  (3, 20, 2023, 2, 60),\n  (5, 30, 2023, 1, 120),\n  (6, 20, 2024, 4, 55);","tables":["Sales","Product"],"table_notes":{"Sales":"Kettle (10) and Toaster (20) were each sold twice — one product, many sales.","Product":"Mixer (40) was never sold."},"solution":"SELECT p.product_name,\n       s.year,\n       s.price\nFROM Sales AS s\nINNER JOIN Product AS p\n        ON p.product_id = s.product_id;","display_sql":"SELECT p.product_name,\n       s.year,\n       s.price\nFROM Sales AS s\nINNER JOIN Product AS p\n        ON p.product_id = s.product_id\nORDER BY s.sale_id;","output_notes":["Each of the 5 sales produces exactly one output row, because every `product_id` in Sales exists in Product (it is a foreign key).","**Kettle** appears twice (2022 at 40, 2023 at 45) and **Toaster** twice (2023 at 60, 2024 at 55) — the product name is repeated for every sale.","**Mixer** is not in the output — it has no sale, and the question is about sales, not products."],"breakdown":[{"code":"FROM Sales AS s","text":"Start from the table we report on: one output row per sale (5 rows)."},{"code":"INNER JOIN Product AS p\n        ON p.product_id = s.product_id","text":"For each sale, find the product with the same `product_id`. Each sale matches exactly **one** product (many-to-one), so the row count stays 5."},{"code":"SELECT p.product_name,\n       s.year,\n       s.price","text":"Pick the name from Product and the year/price from Sales. Prefixing each column with its alias makes the source table obvious."}],"exec_order":[{"stage":"FROM","code":"Sales s","text":"Read the 5 sales."},{"stage":"JOIN / ON","code":"INNER JOIN Product p ON p.product_id = s.product_id","text":"Attach the product row for each sale → still 5 rows. Mixer finds no sale and is not used."},{"stage":"SELECT","code":"p.product_name, s.year, s.price","text":"Keep the three requested columns."}],"visuals":[{"kind":"join","title":"Step 1 — INNER JOIN Sales with Product on product_id","diagram":"Sales s (5 rows)                     Product p (4 rows)\n  s.product_id ──────── = ────────▶ p.product_id\n\n  sale 1  (10) ─┐\n  sale 2  (10) ─┴──▶ 10 Kettle\n  sale 3  (20) ─┐\n  sale 6  (20) ─┴──▶ 20 Toaster\n  sale 5  (30) ────▶ 30 Blender\n                     40 Mixer   ✗ no sale → not in the result\n          │\n          ▼\n  5 joined rows (one per sale)","sql":"SELECT s.sale_id,\n       s.product_id,\n       p.product_id AS p_product_id,\n       p.product_name,\n       s.year,\n       s.price\nFROM Sales AS s\nINNER JOIN Product AS p\n        ON p.product_id = s.product_id\nORDER BY s.sale_id;","text":"Every sale found its product, so all 5 sales survive and both `product_id` columns agree. Kettle's name is copied onto sales 1 and 2 — this is a **many-to-one** join: many sales, one product."},{"kind":"join","title":"Step 2 — Look from the Product side: who matched, who did not","diagram":"Product p  LEFT JOIN  Sales s   (just to inspect)\n  10 Kettle   → 2 sales\n  20 Toaster  → 2 sales\n  30 Blender  → 1 sale\n  40 Mixer    → 0 sales → s.* = NULL\n                    │\n    INNER JOIN drops the NULL row ▼","sql":"SELECT p.product_id,\n       p.product_name,\n       s.sale_id,\n       s.year\nFROM Product AS p\nLEFT JOIN Sales AS s\n       ON s.product_id = p.product_id\nORDER BY p.product_id, s.sale_id;","text":"Viewed from Product, **Mixer** has no matching sale, so its sale columns are `NULL`. An INNER JOIN only keeps matched pairs, so Mixer is left out — which is correct, because we report sales, not products."}],"flow":[{"label":"Input tables","detail":"Sales (5) · Product (4)","ref":"input"},{"label":"INNER JOIN on product_id","detail":"each sale gets its product name → 5 rows","ref":0},{"label":"Unmatched product","detail":"Mixer has no sale and is dropped","ref":1},{"label":"Final output","detail":"product_name, year, price","ref":"output"}],"takeaway":{"pattern":"Fact table (Sales) + dimension table (Product): JOIN on the foreign key to swap IDs for names.","asks":["INNER or LEFT JOIN here? (INNER is fine because product_id is a foreign key, so every sale has a product. A LEFT JOIN from Sales returns the same rows and is the safe choice if the data might be dirty.)","Why does Kettle appear twice? (One output row per sale, and Kettle was sold twice.)","How would you get total quantity per product? (GROUP BY p.product_name with SUM(s.quantity).)"],"alternatives":["Write `FROM Product p INNER JOIN Sales s ON …` — an INNER JOIN is symmetric, so the table order does not change the result.","Correlated subquery: `SELECT (SELECT p.product_name FROM Product p WHERE p.product_id = s.product_id) AS product_name, s.year, s.price FROM Sales s`."],"realworld":"Every report that shows names instead of IDs: order lines with product names, invoices with customer names, log entries with user names."},"mistakes":["Starting from Product with a LEFT JOIN — never-sold products like Mixer appear with NULL year and price.","Forgetting the ON condition (or writing a comma join without WHERE) — every sale is paired with every product.","Selecting an unqualified `product_id` — it exists in both tables, so PostgreSQL raises \"column reference is ambiguous\".","Using `DISTINCT` — two different sales of the same product in the same year at the same price are separate rows and must both stay."],"built":{"id":7,"inputs":[{"name":"Sales","columns":["sale_id","product_id","year","quantity","price"],"types":["integer","integer","integer","integer","integer"],"rows":[[1,10,2022,3,40],[2,10,2023,5,45],[3,20,2023,2,60],[5,30,2023,1,120],[6,20,2024,4,55]]},{"name":"Product","columns":["product_id","product_name"],"types":["integer","character varying(10)"],"rows":[[10,"Kettle"],[20,"Toaster"],[30,"Blender"],[40,"Mixer"]]}],"visuals":[{"columns":["sale_id","product_id","p_product_id","product_name","year","price"],"types":["integer","integer","integer","character varying(10)","integer","integer"],"rows":[[1,10,10,"Kettle",2022,40],[2,10,10,"Kettle",2023,45],[3,20,20,"Toaster",2023,60],[5,30,30,"Blender",2023,120],[6,20,20,"Toaster",2024,55]]},{"columns":["product_id","product_name","sale_id","year"],"types":["integer","character varying(10)","integer","integer"],"rows":[[10,"Kettle",1,2022],[10,"Kettle",2,2023],[20,"Toaster",3,2023],[20,"Toaster",6,2024],[30,"Blender",5,2023],[40,"Mixer",null,null]]}],"output":{"columns":["product_name","year","price"],"types":["character varying(10)","integer","integer"],"rows":[["Kettle",2022,40],["Kettle",2023,45],["Toaster",2023,60],["Blender",2023,120],["Toaster",2024,55]]}}},{"id":8,"lc":1581,"slug":"customer-who-visited-but-did-not-make-any-transactions","title":"Customer Who Visited but Did Not Make Any Transactions","section":"Basic Joins","difficulty":"Easy","concepts":["LEFT JOIN","IS NULL (anti-join)","GROUP BY","COUNT"],"pattern":"Find rows WITHOUT a match: LEFT JOIN, keep only rows where the right side IS NULL, then count per group.","statement":["A mall logs every **visit** (`visit_id`, `customer_id`). During a visit a customer may buy things; each purchase is a row in **Transactions** (`transaction_id`, `visit_id`, `amount`). A visit can have zero, one or several transactions.","Find the customers who had visits **without any transaction**, and for each of them count how many such empty visits they had."],"returns":"Columns `customer_id` and `count_no_trans` (number o
