lass=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Refund<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Card Refunded\"<\/span>);\n    }\n\n    <span class=\"hljs-comment\">// ৪. গিফট কার্ড শুধু পেমেন্ট করতে পারে, রিফান্ড করতে পারে না!<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> GiftCardPayment : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Gift Card Processed\"<\/span>);\n    }\n\n    <span class=\"hljs-comment\">// ৫. রিফান্ড সার্ভিস (এটি এখন শুধু IRefundable গ্রহণ করে)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> RefundService\n    {\n        <span class=\"hljs-comment\">// ✅ এখন এটি শুধুমাত্র IRefundable ইন্টারফেস গ্রহণ করে<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ExecuteRefund<\/span>(IRefundable payment, <span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            payment.<span class=\"hljs-title function_\">Refund<\/span>(amount);\n        }\n    }\n\n    <span class=\"hljs-comment\">/// &lt;summary&gt;<\/span>\n    <span class=\"hljs-comment\">/// Usage / Example:<\/span>\n    <span class=\"hljs-comment\">/// &lt;/summary&gt;<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Program\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Run<\/span>()\n        {\n            RefundService refundService = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">RefundService<\/span>();\n\n            CreditCardPayment card = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CreditCardPayment<\/span>();\n            refundService.<span class=\"hljs-title function_\">ExecuteRefund<\/span>(card, <span class=\"hljs-number\">100<\/span>); <span class=\"hljs-comment\">// ✅ ঠিকঠাক কাজ করবে<\/span>\n\n            GiftCardPayment giftCard = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">GiftCardPayment<\/span>();\n            \n            <span class=\"hljs-comment\">// 🚫 Compiler Error! Safe!<\/span>\n            <span class=\"hljs-comment\">// refundService.ExecuteRefund(giftCard, 100); <\/span>\n            <span class=\"hljs-comment\">// ভুল করে GiftCardPayment পাস করার কোনো সুযোগই নেই, <\/span>\n            <span class=\"hljs-comment\">// কারণ এটি IRefundable ইমপ্লিমেন্ট করে না। সিস্টেম পুরোপুরি ক্র্যাশ-ফ্রি!<\/span>\n        }\n    }\n\n    <span class=\"hljs-comment\">/// &lt;summary&gt;<\/span>\n    <span class=\"hljs-comment\">/// PART 2: Explanation of \"Parent should be replaceable by child\"<\/span>\n    <span class=\"hljs-comment\">/// &lt;/summary&gt;<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> LspExplanation\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Explain<\/span>()\n        {\n            <span class=\"hljs-comment\">// একদম সহজ কথায়:<\/span>\n            <span class=\"hljs-comment\">// IPaymentMethod (Parent) হলো একটি 'ফাঁকা বাক্স' বা 'লেবেল'।<\/span>\n            <span class=\"hljs-comment\">// CreditCardPayment (Child) বা GiftCardPayment (Child) হলো আসল কাজ করার 'মেশিন'।<\/span>\n\n            <span class=\"hljs-comment\">// লাইন ১: আমরা বলছি, \"আমাকে IPaymentMethod নামের একটি বাক্স দাও, <\/span>\n            <span class=\"hljs-comment\">// আর সেই বাক্সের ভেতরে আসল CreditCardPayment মেশিনটি ঢুকিয়ে দাও।\"<\/span>\n            <span class=\"hljs-comment\">// অর্থাৎ, এখানে Parent (IPaymentMethod) এর জায়গাটি দখল করেছে Child (CreditCardPayment)।<\/span>\n            IPaymentMethod pay1 = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CreditCardPayment<\/span>(); \n            \n            <span class=\"hljs-comment\">// লাইন ২: একইভাবে, Parent এর জায়গা দখল করেছে আরেকটি Child (GiftCardPayment)।<\/span>\n            IPaymentMethod pay2 = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">GiftCardPayment<\/span>();\n\n            <span class=\"hljs-comment\">// LSP এর মূল নিয়ম হলো: <\/span>\n            <span class=\"hljs-comment\">// এই Parent (IPaymentMethod) এর বাক্সে আপনি যেই Child (মেশিন)-কেই রাখেন না কেন, <\/span>\n            <span class=\"hljs-comment\">// বাক্সের বাটন (যেমন ProcessPayment) চাপলে তা ঠিকঠাক কাজ করতে হবে। কোনোভাবেই সিস্টেম ক্র্যাশ করা যাবে না।<\/span>\n            pay1.<span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-number\">100<\/span>); <span class=\"hljs-comment\">// Works perfectly<\/span>\n            pay2.<span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-number\">100<\/span>); <span class=\"hljs-comment\">// Works perfectly<\/span>\n        }\n    }\n}<\/code><\/pre><\/div>","solid/03-liskov-substitution-principle/golpe-golpe-liskov.md":"<h1>গল্পে গল্পে Liskov Substitution Principle (LSP)<\/h1>\n<p>LSP শেখার সময় সবার মনেই একটি খুব লজিক্যাল প্রশ্ন আসে:<br><em>\"Parent এর জায়গায় Child কে বসালাম, কোড তো রান হলো এবং সে একটি Exception থ্রো করল। Exception থ্রো করাটাও তো কোডের একটি কাজ! তাহলে এটাকে আমরা Violation বা নিয়ম ভঙ্গ করা কেন বলছি?\"<\/em><\/p>\n<p>এই প্রশ্নের উত্তর লুকিয়ে আছে <strong>\"Contract\" বা \"চুক্তি\"<\/strong> নামক একটি কনসেপ্টের মধ্যে। চলুন একটি গল্পের মাধ্যমে বিষয়টা পরিষ্কার করি।<\/p>\n<hr>\n<h2>🤝 চুক্তি বা প্রমিস (The Contract)<\/h2>\n<p>যখন আমরা <code>IPaymentMethod<\/code> নামে একটি ইন্টারফেস বানাই এবং তার ভেতরে <code>Refund()<\/code> মেথড রাখি, তখন আমরা পুরো প্রোগ্রামিং সিস্টেমকে একটি <strong>চুক্তি (Promise)<\/strong> দিচ্ছি:<\/p>\n<blockquote><p><em>\"যেই ক্লাস এই <code>IPaymentMethod<\/code> নামের বাক্সটি ব্যবহার করবে, সে নিশ্চিন্ত থাকতে পারে যে— এই বাক্সের ভেতরে থাকা যেকোনো জিনিসই সফলভাবে রিফান্ড করতে পারবে।\"<\/em><\/p><\/blockquote>\n<p>আমাদের <code>RefundService<\/code> ক্লাসটি ওই চুক্তির ওপর ১০০% বিশ্বাস রাখে। সে জানে না বাক্সের ভেতরে ক্রেডিট কার্ড আছে নাকি গিফট কার্ড। সে চোখ বন্ধ করে বাক্সের <code>Refund()<\/code> বাটনে চাপ দেয়।<\/p>\n<hr>\n<h2>🚗 লাইসেন্স এবং দুর্ঘটনার গল্প<\/h2>\n<p>ধরে নিন, আপনার কাছে একটি <strong>\"গাড়ি চালানোর লাইসেন্স\"<\/strong> (এটি হলো আমাদের Parent বা <code>IPaymentMethod<\/code>) আছে। এই লাইসেন্স একটি চুক্তি বা প্রমিস যে— আপনি রাস্তায় নিরাপদে গাড়ি চালাতে পারেন।<\/p>\n<p>এখন আপনাকে রাস্তায় নামানো হলো:<\/p>\n<ol><li>আমি যদি আপনাকে একটি <strong>প্রাইভেট কার<\/strong> (<code>CreditCardPayment<\/code>) চালাতে দিই, আপনি সুন্দরভাবে চালিয়ে দিলেন। কোনো সমস্যা নেই! (LSP Followed)<\/li><li>কিন্তু আমি যদি আপনাকে একটি বিশাল <strong>ট্রাক<\/strong> (<code>GiftCardPayment<\/code>) চালাতে দিই, আর আপনি ট্রাক নিয়ে সোজাসুজি একটা দেয়ালে ধাক্কা মেরে অ্যাক্সিডেন্ট করে বসেন!<\/li><\/ol>\n<p>এখন পুলিশ এসে ধরলে আপনি কি বলবেন— <em>\"অ্যাক্সিডেন্ট হলেও তো গাড়ি চলেছে, তাহলে লাইসেন্সের ভায়োলেশন হবে কেন?\"<\/em><br><strong>অবশ্যই না!<\/strong><\/p>\n<p>কারণ লাইসেন্স (Parent) বলেছিল আপনি গাড়ি <strong>নিরাপদে<\/strong> চালাতে পারবেন। দেয়ালে ধাক্কা মেরে গাড়ি ভেঙে ফেলা (Exception Throw করা) আপনার চুক্তির অংশ ছিল না। অর্থাৎ, আপনি ওই লাইসেন্সটি ধারণ করার যোগ্য ছিলেন পরীক্ষিতভাবে!<\/p>\n<hr>\n<h2>💥 Exception থ্রো করলে আসল সমস্যা কী?<\/h2>\n<p>প্রোগ্রামিংয়ে <code>Exception<\/code> থ্রো করা মানে \"কাজ করা\" নয়, বরং এর মানে হলো— <strong>\"আমি কাজটা করতে পারছি না, প্রোগ্রাম এখনই বন্ধ করে দাও!\"<\/strong><\/p>\n<p>যখন <code>GiftCardPayment<\/code> রিফান্ড করতে না পেরে <code>NotSupportedException<\/code> থ্রো করে, তখন সফটওয়্যারটি (যেমন কোনো মোবাইল অ্যাপ বা ওয়েবসাইট) ইউজারকে এরর পেজ দেখিয়ে সাথে সাথে <strong>Crash বা বন্ধ হয়ে যায়<\/strong>! সফটওয়্যার ক্র্যাশ করা কোনো \"কাজ করা\" নয়, এটি একটি মারাত্মক বাগ (Bug), যা কোম্পানির আর্থিক ক্ষতির কারণ হতে পারে।<\/p>\n<p><strong>LSP (Liskov Substitution Principle) ঠিক এই জায়গাতেই বাধা দেয়।<\/strong><br>LSP বলে:<\/p>\n<blockquote><p><em>\"তুমি যদি রিফান্ড করতেই না পারো, তাহলে তুমি কেন এমন একটা বক্সে (<code>IPaymentMethod<\/code>) ঢুকে বসে আছো, যে বক্সটা দাবি করে যে সে রিফান্ড করতে পারে? তুমি মিথ্যা চুক্তি করেছো!\"<\/em><\/p><\/blockquote>\n<h3>🟢 সমাধান কী?<\/h3>\n<p>সমাধান হলো: যে রিফান্ড করতে পারে না, তাকে এমন একটি বক্সে (<code>IRefundable<\/code>) রাখাই যাবে না। তাহলে কেউ ভুল করেও তার রিফান্ড বাটনে চাপ দেবে না, আর সফটওয়্যারটিও কখনো ক্র্যাশ করবে প্রতিনিয়ত।<\/p>\n<p>এটাই হলো <strong>Liskov Substitution Principle<\/strong>-এর আসল সৌন্দর্য!<\/p>\n<hr>\n<h2>🎭 Major Behavior Change (আরেক ধরনের ভায়োলেশন)<\/h2>\n<p>আমরা এতক্ষণ দেখলাম Exception থ্রো করে কীভাবে কোড ক্র্যাশ করে। কিন্তু রিয়েল-ওয়ার্ল্ড প্রজেক্টে LSP-এর সবচেয়ে ভয়ানক ভায়োলেশন হলো— <strong>কোড ক্র্যাশ করে না, কিন্তু কোডের আসল উদ্দেশ্য বা আচরণ (Behavior) পুরোপুরি বদলে যায়!<\/strong><\/p>\n<p>চলুন ই-কমার্সের একটি <strong>রিয়েল-ওয়ার্ল্ড বিলিং সিস্টেম<\/strong> দিয়ে বুঝি। (বোরিং জ্যামিতির উদাহরণ বাদ!)<\/p>\n<p>ধরুন, আপনার একটি ইন্টারফেস আছে <code>IDiscountCalculator<\/code>, যার কাজ হলো কাস্টমার কত টাকা ডিসকাউন্ট পাবে তা হিসাব করা।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IDiscountCalculator\n{\n    <span class=\"hljs-comment\">// Parent এর চুক্তি (Contract): \"আমি সবসময় একটি পজিটিভ (Positive) ডিসকাউন্ট অ্যামাউন্ট দেব, <\/span>\n    <span class=\"hljs-comment\">// যা মোট বিল থেকে মাইনাস (Subtract) হবে।\"<\/span>\n    <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateDiscount<\/span>(<span class=\"hljs-built_in\">decimal<\/span> totalBill);\n}<\/code><\/pre><\/div>\n<p>এখন, রেগুলার কাস্টমারদের জন্য একটি ক্লাস বানানো হলো:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> RegularDiscount : IDiscountCalculator\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateDiscount<\/span>(<span class=\"hljs-built_in\">decimal<\/span> totalBill)\n    {\n        <span class=\"hljs-comment\">// ২০% ডিসকাউন্ট<\/span>\n        <span class=\"hljs-keyword\">return<\/span> totalBill * <span class=\"hljs-number\">0.20m<\/span>; \n    }\n}<\/code><\/pre><\/div>\n<p>কিন্তু আরেকজন জুনিয়র ডেভেলপার নতুন কাস্টমারদের জন্য একটি ডিসকাউন্ট ক্লাস বানাল। সে ভাবল, <em>\"ডিসকাউন্ট মানেই তো মাইনাস, তাই আমি মাইনাস ভ্যালু রিটার্ন করি!\"<\/em><\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> NewCustomerDiscount : IDiscountCalculator\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateDiscount<\/span>(<span class=\"hljs-built_in\">decimal<\/span> totalBill)\n    {\n        <span class=\"hljs-comment\">// ❌ LSP Violation: মাইনাস (-) রিটার্ন করছে!<\/span>\n        <span class=\"hljs-comment\">// Parent কথা দিয়েছিল সে ডিসকাউন্ট অ্যামাউন্ট দেবে, <\/span>\n        <span class=\"hljs-comment\">// কিন্তু এ দিয়ে দিচ্ছে নেগেটিভ ভ্যালু।<\/span>\n        <span class=\"hljs-keyword\">return<\/span> -<span class=\"hljs-number\">50m<\/span>; \n    }\n}<\/code><\/pre><\/div>\n<h3>💥 সমস্যাটা কোথায় হলো?<\/h3>\n<p>এখন আপনার <code>BillingService<\/code> ক্লাসে যখন বিল হিসাব করা হবে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> BillingService\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">PrintFinalBill<\/span>(IDiscountCalculator discountCalc, <span class=\"hljs-built_in\">decimal<\/span> totalBill)\n    {\n        <span class=\"hljs-comment\">// বিল থেকে ডিসকাউন্ট মাইনাস করা হচ্ছে<\/span>\n        <span class=\"hljs-built_in\">decimal<\/span> finalBill = totalBill - discountCalc.<span class=\"hljs-title function_\">CalculateDiscount<\/span>(totalBill);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Your final bill is: {finalBill}\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>যদি RegularDiscount পাস করা হয়:<\/strong><\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\">BillingService billing = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">BillingService<\/span>();\nbilling.<span class=\"hljs-title function_\">PrintFinalBill<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">RegularDiscount<\/span>(), <span class=\"hljs-number\">1000<\/span>); \n<span class=\"hljs-comment\">// 1000 - 200 = 800 টাকা। (একদম ঠিক কাজ করেছে!)<\/span><\/code><\/pre><\/div>\n<p><strong>কিন্তু যদি NewCustomerDiscount পাস করা হয়:<\/strong><\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\">billing.<span class=\"hljs-title function_\">PrintFinalBill<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NewCustomerDiscount<\/span>(), <span class=\"hljs-number\">1000<\/span>); \n<span class=\"hljs-comment\">// 1000 - (-50) = 1050 টাকা!<\/span><\/code><\/pre><\/div>\n<p><strong>কী মারাত্মক ভুল হলো খেয়াল করেছেন?<\/strong><br>নতুন কাস্টমার ডিসকাউন্ট পাওয়ার কথা, উল্টো তার বিল ৫০ টাকা <strong>বেড়ে গেল<\/strong>!<br>এখানে কিন্তু কোনো <code>Exception<\/code> থ্রো হয়নি, সিস্টেম ক্র্যাশও করেনি। কোড খুব সুন্দরভাবে রান হয়েছে। কিন্তু <strong>আউটপুট বা রেজাল্ট পুরোপুরি ভুল এসেছে!<\/strong><\/p>\n<p>Parent (<code>IDiscountCalculator<\/code>) চুক্তি করেছিল সে ডিসকাউন্ট দেবে। কিন্তু Child (<code>NewCustomerDiscount<\/code>) এসে সেই চুক্তি ভেঙে নেগেটিভ ভ্যালু রিটার্ন করে পুরো ব্যবসার হিসাব পাল্টে দিয়েছে।<\/p>\n<p>একেই বলে <strong>\"Major Behavior Change\"<\/strong>। Child ক্লাস কখনোই Parent ক্লাসের চুক্তির (Contract) বাইরের কোনো আচরণ করতে পারবে না। যদি করে, আর তার কারণে যদি সিস্টেমে লজিক্যাল ভুল হয়, তবে সেটিও মারাত্মক <strong>LSP Violation<\/strong>!<\/p>\n<hr>\n<h2>🏦 উদাহরণ ২: সাইলেন্ট চার্জ বা লুকানো ফি (Hidden Fees)<\/h2>\n<p>আর্থিক লেনদেনের আরও একটি খুব কমন রিয়েল-ওয়ার্ল্ড উদাহরণ দেখা যাক।<\/p>\n<p>ধরুন, আপনার একটি ব্যাংক অ্যাকাউন্ট ম্যানেজমেন্ট সিস্টেম আছে। সেখানে একটি বেস ইন্টারফেস বা চুক্তি আছে <code>IBankAccount<\/code>:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IBankAccount\n{\n    <span class=\"hljs-comment\">// Parent এর চুক্তি (Contract): \"আমি ব্যালেন্স থেকে ঠিক ততটুকুই কাটব, যতটুকু উইথড্র (Withdraw) করা হবে।\"<\/span>\n    <span class=\"hljs-comment\">// Postcondition: New Balance = Old Balance - amount<\/span>\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Withdraw<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n}<\/code><\/pre><\/div>\n<p>সাধারণ সেভিংস অ্যাকাউন্টের ক্ষেত্রে এটি একদম ঠিকঠাক কাজ করে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> SavingsAccount : IBankAccount\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> Balance { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; } = <span class=\"hljs-number\">5000<\/span>;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Withdraw<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        Balance -= amount; <span class=\"hljs-comment\">// চুক্তি অনুযায়ী ঠিক ততটুকুই কাটল<\/span>\n    }\n}<\/code><\/pre><\/div>\n<p>কিন্তু ব্যাংকের একজন ডেভেলপার <strong>\"Credit Card Account\"<\/strong> নামে একটি নতুন ক্লাস বানাল এবং সেটিকে <code>IBankAccount<\/code> এর Child হিসেবে ডিক্লেয়ার করল। কিন্তু ক্রেডিট কার্ডের নিয়ম অনুযায়ী, টাকা তুললে (Cash Advance) হিডেন চার্জ বা ফি কাটে!<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardAccount : IBankAccount\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> Balance { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; } = <span class=\"hljs-number\">5000<\/span>;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Withdraw<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        <span class=\"hljs-comment\">// ❌ LSP Violation: Child চুপিচুপি চুক্তির বাইরে গিয়ে এক্সট্রা ফি কাটছে!<\/span>\n        <span class=\"hljs-built_in\">decimal<\/span> hiddenFee = <span class=\"hljs-number\">50<\/span>; \n        Balance -= (amount + hiddenFee); \n    }\n}<\/code><\/pre><\/div>\n<h3>💥 সমস্যা কোথায়?<\/h3>\n<p>আপনার একটি <code>AtmMachine<\/code> ক্লাস আছে, যে শুধু Parent (<code>IBankAccount<\/code>) কে চেনে এবং ইউজারকে স্ক্রিনে মেসেজ দেখায়।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> AtmMachine\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessWithdrawal<\/span>(IBankAccount account, <span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        account.<span class=\"hljs-title function_\">Withdraw<\/span>(amount);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Successful! {amount} taka has been deducted from your account.\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>কী মারাত্মক ভুল হলো?<\/strong><br>ইউজার এটিএম থেকে <code>1000<\/code> টাকা তুলল। <code>AtmMachine<\/code> স্ক্রিনে দেখাল: <em>\"Successful! 1000 taka has been deducted from your account.\"<\/em><\/p>\n<p>কিন্তু যেহেতু এটি একটি <code>CreditCardAccount<\/code> (Child) ছিল, সে ব্যাকগ্রাউন্ডে ইউজারের অ্যাকাউন্ট থেকে <code>1000 + 50 = 1050<\/code> টাকা কেটে নিয়েছে! ইউজার জানতেই পারল না যে তার ৫০ টাকা বেশি কাটা গেছে, কারণ <code>AtmMachine<\/code> (যে Parent-এর চুক্তির ওপর বিশ্বাস করেছিল) জানতই না যে এই Child এক্সট্রা টাকা কাটতে পারে।<\/p>\n<p>এখানেও <strong>কোনো Exception থ্রো হয়নি, কোড ক্র্যাশ করেনি।<\/strong> কিন্তু Parent (<code>IBankAccount<\/code>) যে কথা দিয়েছিল (যতটুকু তুলবে ততটুকুই কাটবে), Child (<code>CreditCardAccount<\/code>) এসে সেই চুক্তির বাইরে কাজ করে ইউজারের ব্যালেন্সের হিসাব পাল্টে দিয়েছে।<\/p>\n<p><strong>মূল কথা:<\/strong> Parent-এর যে কাজ করার কথা (Behavior), Child-কে হুবহু সেই আচরণই ধরে রাখতে হবে। Child কখনোই Parent-এর চুক্তির বাইরে গিয়ে কোনো হিডেন বা সারপ্রাইজ কাজ করতে পারবে না। এটাই হলো LSP-এর \"Behavioral\" বা আচরণগত নিয়ম!<\/p>\n<hr>\n<h2>🎯 এক নজরে পুরো LSP (The Ultimate Summary)<\/h2>\n<p>LSP-এর একদম কোর (Core) বা মূল থিমটাকে আমরা ৩টি লাইনে সামারি করতে পারি:<\/p>\n<ol><li><strong>Parent should be replaceable by Child:<\/strong> প্যারেন্টের জায়গায় চাইল্ড বসালে কোডে কোনো এরর হবে না।<\/li><li><strong>Child can't throw unexpected exceptions:<\/strong> চাইল্ড এমন কোনো Exception থ্রো করতে পারবে না যা প্যারেন্টের চুক্তিতে (Contract) নেই।<\/li><li><strong>Child can't change the expected behavior:<\/strong> চাইল্ড চুপিচুপি রুলস ভেঙে রেজাল্ট বা আচরণ পাল্টে দিতে পারবে না।<\/li><\/ol>\n<p>বাস্তব দুনিয়ার সফটওয়্যার ডেভেলপমেন্টে এই ৩টি কথাই হলো LSP-এর <strong>৯৯%<\/strong>! এইটুকু বুঝলে আপনি যেকোনো প্রজেক্টে অনায়াসে LSP মেইনটেইন করতে পারবেন।<\/p>","solid/03-liskov-substitution-principle/another-example.md":"<h1>Liskov Substitution Principle (LSP) — C# Example<\/h1>\n<h2>LSP কী?<\/h2>\n<blockquote><p><strong>\"Child class কে যদি Parent class এর জায়গায় বসাও, তাহলে কোনো সমস্যা হওয়া উচিত না।\"<\/strong><\/p><\/blockquote>\n<p>সহজ কথায় — তোমার code যদি <code>Parent<\/code> বা <code>Interface<\/code> দিয়ে কাজ করে, তাহলে সেখানে যেকোনো <code>Child<\/code> বসালে সব আগের মতোই চলবে। Error আসবে না, ভুল result আসবে না।<\/p>\n<hr>\n<h2>Project Structure<\/h2>\n<div class=\"code\"><div class=\"code-bar\"><span>text<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\">LSP Example/\n│\n├── Interfaces/\n│   ├── IPayment.cs       ← Payment এর Parent (Interface)\n│   └── IOrder.cs         ← Order এর Parent (Interface)\n│\n├── Payments/\n│   ├── Bkash.cs          ← IPayment এর Child\n│   ├── Nagad.cs          ← IPayment এর Child\n│   └── Rocket.cs         ← IPayment এর Child\n│\n├── Orders/\n│   ├── RegularOrder.cs   ← IOrder এর Child\n│   ├── BulkOrder.cs      ← IOrder এর Child\n│   └── SubscriptionOrder.cs ← IOrder এর Child\n│\n└── Program.cs            ← Main entry point<\/code><\/pre><\/div>\n<hr>\n<h2>Interfaces (Parent)<\/h2>\n<h3>IPayment<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPayment\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Pay<\/span>(<span class=\"hljs-built_in\">int<\/span> amount);\n    <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">GetPaymentMethod<\/span>();\n}<\/code><\/pre><\/div>\n<h3>IOrder<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IOrder\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Checkout<\/span>(IPayment payment);\n    <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">GetOrderSummary<\/span>();\n}<\/code><\/pre><\/div>\n<p>এই দুইটা Interface হলো <strong>Parent<\/strong>। এরা শুধু বলে \"কী কী কাজ করতে হবে\" — কিন্তু কীভাবে করতে হবে সেটা বলে না।<\/p>\n<hr>\n<h2>Payment Classes (Child of IPayment)<\/h2>\n<h3>Bkash<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Bkash : IPayment\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">string<\/span> _phoneNumber;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Bkash<\/span>(<span class=\"hljs-built_in\">string<\/span> phoneNumber)\n    {\n        _phoneNumber = phoneNumber;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Pay<\/span>(<span class=\"hljs-built_in\">int<\/span> amount)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Bkash থেকে {_phoneNumber} নম্বরে {amount} টাকা পাঠানো হলো ✅\"<\/span>);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">GetPaymentMethod<\/span>() =&gt; <span class=\"hljs-string\">\"Bkash\"<\/span>;\n}<\/code><\/pre><\/div>\n<h3>Nagad<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Nagad : IPayment\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">string<\/span> _phoneNumber;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Nagad<\/span>(<span class=\"hljs-built_in\">string<\/span> phoneNumber)\n    {\n        _phoneNumber = phoneNumber;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Pay<\/span>(<span class=\"hljs-built_in\">int<\/span> amount)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Nagad থেকে {_phoneNumber} নম্বরে {amount} টাকা পাঠানো হলো ✅\"<\/span>);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">GetPaymentMethod<\/span>() =&gt; <span class=\"hljs-string\">\"Nagad\"<\/span>;\n}<\/code><\/pre><\/div>\n<h3>Rocket<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Rocket : IPayment\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">string<\/span> _phoneNumber;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Rocket<\/span>(<span class=\"hljs-built_in\">string<\/span> phoneNumber)\n    {\n        _phoneNumber = phoneNumber;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Pay<\/span>(<span class=\"hljs-built_in\">int<\/span> amount)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Rocket থেকে {_phoneNumber} নম্বরে {amount} টাকা পাঠানো হলো ✅\"<\/span>);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">GetPaymentMethod<\/span>() =&gt; <span class=\"hljs-string\">\"Rocket\"<\/span>;\n}<\/code><\/pre><\/div>\n<hr>\n<h2>Order Classes (Child of IOrder)<\/h2>\n<h3>RegularOrder — সাধারণ Order<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> RegularOrder : IOrder\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">string<\/span> _productName;\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">int<\/span> _price;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">RegularOrder<\/span>(<span class=\"hljs-built_in\">string<\/span> productName, <span class=\"hljs-built_in\">int<\/span> price)\n    {\n        _productName = productName;\n        _price = price;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Checkout<\/span>(IPayment payment)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"\\n----------------------------\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-title function_\">GetOrderSummary<\/span>());\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Payment  : {payment.GetPaymentMethod()}\"<\/span>);\n        payment.<span class=\"hljs-title function_\">Pay<\/span>(_price);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Order Confirmed! 🎉\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"----------------------------\"<\/span>);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">GetOrderSummary<\/span>()\n    {\n        <span class=\"hljs-keyword\">return<\/span> <span class=\"hljs-string\">$\"[Regular Order]\\nProduct: {_productName} | Price: {_price} টাকা\"<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<h3>BulkOrder — বেশি পরিমাণ Order, 10% Discount আছে<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> BulkOrder : IOrder\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">string<\/span> _productName;\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">int<\/span> _price;\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">int<\/span> _quantity;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">BulkOrder<\/span>(<span class=\"hljs-built_in\">string<\/span> productName, <span class=\"hljs-built_in\">int<\/span> price, <span class=\"hljs-built_in\">int<\/span> quantity)\n    {\n        _productName = productName;\n        _price = price;\n        _quantity = quantity;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Checkout<\/span>(IPayment payment)\n    {\n        <span class=\"hljs-built_in\">int<\/span> total = _price * _quantity;\n        <span class=\"hljs-built_in\">int<\/span> discount = total / <span class=\"hljs-number\">10<\/span>;\n        <span class=\"hljs-built_in\">int<\/span> finalPrice = total - discount;\n\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"\\n----------------------------\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-title function_\">GetOrderSummary<\/span>());\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Discount : {discount} টাকা বাদ\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Final    : {finalPrice} টাকা\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Payment  : {payment.GetPaymentMethod()}\"<\/span>);\n        payment.<span class=\"hljs-title function_\">Pay<\/span>(finalPrice);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Bulk Order Confirmed! 🎉\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"----------------------------\"<\/span>);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">GetOrderSummary<\/span>()\n    {\n        <span class=\"hljs-keyword\">return<\/span> <span class=\"hljs-string\">$\"[Bulk Order]\\nProduct: {_productName} | {_quantity}টি × {_price} টাকা\"<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<h3>SubscriptionOrder — মাসে মাসে payment কাটবে<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> SubscriptionOrder : IOrder\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">string<\/span> _planName;\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">int<\/span> _monthlyPrice;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">SubscriptionOrder<\/span>(<span class=\"hljs-built_in\">string<\/span> planName, <span class=\"hljs-built_in\">int<\/span> monthlyPrice)\n    {\n        _planName = planName;\n        _monthlyPrice = monthlyPrice;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Checkout<\/span>(IPayment payment)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"\\n----------------------------\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-title function_\">GetOrderSummary<\/span>());\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Payment  : {payment.GetPaymentMethod()}\"<\/span>);\n        payment.<span class=\"hljs-title function_\">Pay<\/span>(_monthlyPrice);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Subscription চালু হয়ে গেছে! 🎉\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"----------------------------\"<\/span>);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">GetOrderSummary<\/span>()\n    {\n        <span class=\"hljs-keyword\">return<\/span> <span class=\"hljs-string\">$\"[Subscription]\\nPlan: {_planName} | মাসিক: {_monthlyPrice} টাকা\"<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<hr>\n<h2>Program.cs — সব একসাথে চালাই<\/h2>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Program\n{\n    <span class=\"hljs-comment\">// ⭐ LSP এখানে —<\/span>\n    <span class=\"hljs-comment\">// IOrder এর জায়গায় যেকোনো Child বসাও<\/span>\n    <span class=\"hljs-comment\">// IPayment এর জায়গায় যেকোনো Child বসাও<\/span>\n    <span class=\"hljs-comment\">// কোনো সমস্যা নাই!<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessOrder<\/span>(IOrder order, IPayment payment)\n    {\n        order.<span class=\"hljs-title function_\">Checkout<\/span>(payment);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>()\n    {\n        <span class=\"hljs-comment\">// Payment methods<\/span>\n        IPayment bkash  = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Bkash<\/span>(<span class=\"hljs-string\">\"01711-111111\"<\/span>);\n        IPayment nagad  = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Nagad<\/span>(<span class=\"hljs-string\">\"01811-222222\"<\/span>);\n        IPayment rocket = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Rocket<\/span>(<span class=\"hljs-string\">\"01911-333333\"<\/span>);\n\n        <span class=\"hljs-comment\">// Orders<\/span>\n        IOrder regular      = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">RegularOrder<\/span>(<span class=\"hljs-string\">\"Nike Shoes\"<\/span>, <span class=\"hljs-number\">3500<\/span>);\n        IOrder bulk         = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">BulkOrder<\/span>(<span class=\"hljs-string\">\"Water Bottle\"<\/span>, <span class=\"hljs-number\">200<\/span>, <span class=\"hljs-number\">50<\/span>);\n        IOrder subscription = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">SubscriptionOrder<\/span>(<span class=\"hljs-string\">\"Netflix BD\"<\/span>, <span class=\"hljs-number\">450<\/span>);\n\n        <span class=\"hljs-comment\">// IOrder + IPayment — দুইটাই Replace হচ্ছে ✅<\/span>\n        <span class=\"hljs-title function_\">ProcessOrder<\/span>(regular, bkash);\n        <span class=\"hljs-title function_\">ProcessOrder<\/span>(bulk, nagad);\n        <span class=\"hljs-title function_\">ProcessOrder<\/span>(subscription, rocket);\n    }\n}<\/code><\/pre><\/div>\n<hr>\n<h2>Output<\/h2>\n<div class=\"code\"><div class=\"code-bar\"><span>text<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\">----------------------------\n[Regular Order]\nProduct: Nike Shoes | Price: 3500 টাকা\nPayment  : Bkash\nBkash থেকে 01711-111111 নম্বরে 3500 টাকা পাঠানো হলো ✅\nOrder Confirmed! 🎉\n----------------------------\n\n----------------------------\n[Bulk Order]\nProduct: Water Bottle | 50টি × 200 টাকা\nDiscount : 1000 টাকা বাদ\nFinal    : 9000 টাকা\nPayment  : Nagad\nNagad থেকে 01811-222222 নম্বরে 9000 টাকা পাঠানো হলো ✅\nBulk Order Confirmed! 🎉\n----------------------------\n\n----------------------------\n[Subscription]\nPlan: Netflix BD | মাসিক: 450 টাকা\nPayment  : Rocket\nRocket থেকে 01911-333333 নম্বরে 450 টাকা পাঠানো হলো ✅\nSubscription চালু হয়ে গেছে! 🎉\n----------------------------<\/code><\/pre><\/div>\n<hr>\n<h2>LSP কোথায় হলো? একনজরে দেখো<\/h2>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// এই একটা function — Interface ছাড়া কিছুই চেনে না<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessOrder<\/span>(IOrder order, IPayment payment)\n{\n    order.<span class=\"hljs-title function_\">Checkout<\/span>(payment);\n}\n\n<span class=\"hljs-comment\">// কিন্তু যেকোনো combination দাও — সব কাজ করে ✅<\/span>\n<span class=\"hljs-title function_\">ProcessOrder<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">RegularOrder<\/span>(...),      <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Bkash<\/span>(...));   <span class=\"hljs-comment\">// ✅<\/span>\n<span class=\"hljs-title function_\">ProcessOrder<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">BulkOrder<\/span>(...),         <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Nagad<\/span>(...));   <span class=\"hljs-comment\">// ✅<\/span>\n<span class=\"hljs-title function_\">ProcessOrder<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">SubscriptionOrder<\/span>(...), <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Rocket<\/span>(...));  <span class=\"hljs-comment\">// ✅<\/span>\n\n<span class=\"hljs-comment\">// কাল নতুন কিছু যোগ করলেও — ProcessOrder ছুঁতে হবে না! 🔥<\/span>\n<span class=\"hljs-title function_\">ProcessOrder<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">GiftOrder<\/span>(...),         <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CashOnDelivery<\/span>(...)); <span class=\"hljs-comment\">// ✅<\/span><\/code><\/pre><\/div>\n<hr>\n<h2>মনে রাখার নিয়ম<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\">বিষয়<\/th><th align=\"left\">কথা<\/th><\/tr><\/thead><tbody><tr><td align=\"left\">Interface<\/td><td align=\"left\">Parent — শুধু নিয়ম বলে<\/td><\/tr><tr><td align=\"left\">Implementing Class<\/td><td align=\"left\">Child — নিয়ম মেনে কাজ করে<\/td><\/tr><tr><td align=\"left\">কে replace হয়?<\/td><td align=\"left\">Child, Parent এর জায়গায় বসে<\/td><\/tr><tr><td align=\"left\">LSP মানা হলে<\/td><td align=\"left\">Child বসালে সব আগের মতো কাজ করে<\/td><\/tr><tr><td align=\"left\">LSP ভাঙলে<\/td><td align=\"left\">Child বসালে Error বা ভুল result আসে<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p><strong>সহজ test:<\/strong> নিজেকে জিজ্ঞেস করো — \"আমার Child class কি সব জায়গায় Parent এর মতো কাজ করতে পারবে?\" হ্যাঁ হলে LSP ঠিক আছে ✅, না হলে design বদলাও ❌<\/p><\/blockquote>","solid/04-interface-segregation-principle/README.md":"<h1>Interface Segregation Principle (ISP)<\/h1>\n<p>Clients should not be forced to depend upon interfaces that they do not use.<\/p>\n<p>সহজ কথায়: <strong>কোনো ক্লাসকে এমন কোনো ইন্টারফেস ইমপ্লিমেন্ট করতে বাধ্য করা উচিত নয়, যার সব মেথড তার দরকার নেই।<\/strong> একটি বড়, মোটা (Fat) ইন্টারফেস বানানোর চেয়ে, কাজের ধরন অনুযায়ী ছোট ছোট স্পেসিফিক (Specific) ইন্টারফেস বানানো অনেক ভালো।<\/p>\n<hr>\n<h2>🛑 The Violation — <a class=\"file-link\" data-rel=\"Violation.cs\">Violation.cs<\/a><\/h2>\n<p>ধরুন আমাদের অফিসে বিভিন্ন ধরনের প্রিন্টার আছে। আমরা একটি ইন্টারফেস বানালাম <code>IMultiFunctionPrinter<\/code>, যার ভেতরে প্রিন্ট, স্ক্যান এবং ফ্যাক্স করার মেথড আছে।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IMultiFunctionPrinter\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>();\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>();\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>();\n}<\/code><\/pre><\/div>\n<p>আধুনিক একটি প্রিন্টার (<code>AdvancedPrinter<\/code>) এই সবগুলো কাজ করতে পারে। তাই তার জন্য এই ইন্টারফেস ইমপ্লিমেন্ট করা কোনো সমস্যার কিছু নয়।<\/p>\n<p>কিন্তু সমস্যা হলো একটি পুরনো প্রিন্টারের (<code>OldBasicPrinter<\/code>) ক্ষেত্রে, যেটি শুধু প্রিন্ট করতে পারে। কিন্তু যেহেতু সে <code>IMultiFunctionPrinter<\/code> ইমপ্লিমেন্ট করেছে, তাকে বাধ্য হয়ে <code>Scan()<\/code> এবং <code>Fax()<\/code> মেথডও লিখতে হচ্ছে!<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OldBasicPrinter : IMultiFunctionPrinter\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Printing...\"<\/span>);\n\n    <span class=\"hljs-comment\">// ❌ ISP Violation: অকারণে এই মেথডগুলো লিখতে বাধ্য করা হচ্ছে!<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>() =&gt; <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NotSupportedException<\/span>(<span class=\"hljs-string\">\"Old printer cannot scan!\"<\/span>);\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>() =&gt; <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NotSupportedException<\/span>(<span class=\"hljs-string\">\"Old printer cannot fax!\"<\/span>);\n}<\/code><\/pre><\/div>\n<p><strong>সমস্যা কোথায় (ISP Violation)?<\/strong><br><code>OldBasicPrinter<\/code>-এর স্ক্যান বা ফ্যাক্স করার ক্ষমতাই নেই। তবুও তাকে এমন একটি ইন্টারফেসের ওপর নির্ভর করতে বাধ্য করা হয়েছে যা তার কোনো কাজেই লাগে না। এর ফলে কোডে অকারণে <code>NotSupportedException<\/code> লিখতে হচ্ছে এবং কোড নোংরা (Polluted) হচ্ছে।<\/p>\n<hr>\n<h2>🟢 The Solution — <a class=\"file-link\" data-rel=\"Solution.cs\">Solution.cs<\/a><\/h2>\n<p>বড় ইন্টারফেসটিকে ভেঙে ছোট ছোট কাজের ভিত্তিতে ভাগ (Segregate) করে ফেলতে হবে।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPrinter { <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>(); }\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IScanner { <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>(); }\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IFax { <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>(); }<\/code><\/pre><\/div>\n<p>এখন যে মেশিনের যা যা ক্ষমতা আছে, সে শুধু সেই ইন্টারফেসগুলোই ব্যবহার করবে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// আধুনিক প্রিন্টার ৩টি ইন্টারফেসই ব্যবহার করবে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> AdvancedPrinter : IPrinter, IScanner, IFax\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Printing...\"<\/span>);\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Scanning...\"<\/span>);\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Faxing...\"<\/span>);\n}\n\n<span class=\"hljs-comment\">// পুরনো প্রিন্টার এখন শুধু IPrinter ব্যবহার করবে!<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OldBasicPrinter : IPrinter\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Printing...\"<\/span>);\n}<\/code><\/pre><\/div>\n<p><strong>লাভ কী হলো?<\/strong><br><code>OldBasicPrinter<\/code>-কে আর জোর করে এমন কোনো মেথড ইমপ্লিমেন্ট করতে হলো না যা সে ব্যবহার করবে না। ক্লাসগুলো ক্লিন রইল এবং \"বড় ও অপ্রয়োজনীয় ইন্টারফেস\"-এর হাত থেকে মুক্তি মিলল। এটিই হলো <strong>Interface Segregation Principle<\/strong>!<\/p>","solid/04-interface-segregation-principle/Violation.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Violation.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.ISP.Violation\n{\n    <span class=\"hljs-comment\">// ❌ ISP Violation: একটি বড় (Fat) ইন্টারফেসে সব মেথড রাখা হয়েছে।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IMultiFunctionPrinter\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>();\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>();\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>();\n    }\n\n    <span class=\"hljs-comment\">// আধুনিক প্রিন্টার সব করতে পারে, তাই এর কোনো সমস্যা নেই।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> AdvancedPrinter : IMultiFunctionPrinter\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Printing document...\"<\/span>);\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Scanning document...\"<\/span>);\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Faxing document...\"<\/span>);\n    }\n\n    <span class=\"hljs-comment\">// কিন্তু পুরনো প্রিন্টার শুধু প্রিন্ট করতে পারে। <\/span>\n    <span class=\"hljs-comment\">// তবুও তাকে Scan এবং Fax ইমপ্লিমেন্ট করতে বাধ্য করা হচ্ছে!<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OldBasicPrinter : IMultiFunctionPrinter\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Printing document...\"<\/span>);\n\n        <span class=\"hljs-comment\">// ❌ ক্লায়েন্টকে এমন মেথড ইমপ্লিমেন্ট করতে বাধ্য করা হচ্ছে যা সে ব্যবহার করে না!<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>() =&gt; <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NotSupportedException<\/span>(<span class=\"hljs-string\">\"Old printer cannot scan!\"<\/span>);\n        \n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>() =&gt; <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NotSupportedException<\/span>(<span class=\"hljs-string\">\"Old printer cannot fax!\"<\/span>);\n    }\n}<\/code><\/pre><\/div>","solid/04-interface-segregation-principle/Solution.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Solution.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.ISP.Solution\n{\n    <span class=\"hljs-comment\">// ✅ ISP Solution: বড় ইন্টারফেসকে ভেঙে ছোট ও নির্দিষ্ট (Specific) ইন্টারফেস বানানো হয়েছে।<\/span>\n    \n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPrinter\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>();\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IScanner\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>();\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IFax\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>();\n    }\n\n    <span class=\"hljs-comment\">// আধুনিক প্রিন্টার যা যা পারে, শুধু সেই ইন্টারফেসগুলোই ইমপ্লিমেন্ট করবে।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> AdvancedPrinter : IPrinter, IScanner, IFax\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Printing document...\"<\/span>);\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Scan<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Scanning document...\"<\/span>);\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fax<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Faxing document...\"<\/span>);\n    }\n\n    <span class=\"hljs-comment\">// পুরনো প্রিন্টার শুধু প্রিন্ট করতে পারে, তাই সে শুধুমাত্র IPrinter ইমপ্লিমেন্ট করবে।<\/span>\n    <span class=\"hljs-comment\">// তাকে অকারণে Scan বা Fax ইমপ্লিমেন্ট করতে বাধ্য করা হচ্ছে না।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OldBasicPrinter : IPrinter\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Print<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Printing document...\"<\/span>);\n    }\n}<\/code><\/pre><\/div>","solid/05-dependency-inversion-principle/README.md":"<h1>Dependency Inversion Principle (DIP)<\/h1>\n<p>High-level modules should not depend on low-level modules. Both should depend on abstractions.<br>Abstractions should not depend on details. Details should depend on abstractions.<\/p>\n<p>সহজ কথায়: <strong>বড় বা মেইন ক্লাসগুলো (High-Level) কখনো ছোট বা সাপোর্টিং ক্লাসগুলোর (Low-Level) উপর সরাসরি নির্ভর করবে না। তারা দুজনেই একটি ইন্টারফেস বা অ্যাবস্ট্রাকশনের (Abstraction) উপর নির্ভর করবে।<\/strong> এতে কোড \"Loose Coupled\" বা স্বাধীন হয়।<\/p>\n<hr>\n<h2>🛑 The Violation — <a class=\"file-link\" data-rel=\"Violation.cs\">Violation.cs<\/a><\/h2>\n<p>ধরুন আমাদের ই-কমার্স সিস্টেমে একটি মেইন ক্লাস আছে <code>OrderProcessor<\/code> (High-Level)। এর কাজ হলো অর্ডার প্রসেস শেষে কাস্টমারকে ইমেইল পাঠানো। ইমেইল পাঠানোর কাজ করে <code>EmailSender<\/code> (Low-Level)।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> EmailSender\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendEmail<\/span>(<span class=\"hljs-built_in\">string<\/span> message) { Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Sending Email...\"<\/span>); }\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OrderProcessor\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> EmailSender _emailSender;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>()\n    {\n        <span class=\"hljs-comment\">// ❌ DIP Violation: হাই-লেভেল ক্লাস সরাসরি একটি লো-লেভেল ক্লাসের অবজেক্ট তৈরি করছে!<\/span>\n        _emailSender = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">EmailSender<\/span>();\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessOrder<\/span>()\n    {\n        _emailSender.<span class=\"hljs-title function_\">SendEmail<\/span>(<span class=\"hljs-string\">\"Your order has been confirmed.\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>সমস্যা কোথায় (DIP Violation)?<\/strong><br><code>OrderProcessor<\/code> সরাসরি <code>EmailSender<\/code>-এর সাথে আঠার মতো লেগে আছে (Tightly Coupled)। কালকে যদি ক্লায়েন্ট বলে, <em>\"ইমেইলের বদলে SMS পাঠাতে হবে\"<\/em>, তখন আপনাকে বাধ্য হয়ে পুরো <code>OrderProcessor<\/code> ক্লাসের ভেতরের কোড পরিবর্তন করতে হবে। এটি OCP (Open-Closed Principle)-কেও ভঙ্গ করে।<\/p>\n<hr>\n<h2>🟢 The Solution — <a class=\"file-link\" data-rel=\"Solution.cs\">Solution.cs<\/a><\/h2>\n<p>হাই-লেভেল ক্লাসকে লো-লেভেল ক্লাস থেকে মুক্ত (Decoupled) করতে হবে। এর জন্য আমরা একটি ইন্টারফেস (Abstraction) তৈরি করব।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ১. Abstraction (ইন্টারফেস)<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> INotificationService\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendMessage<\/span>(<span class=\"hljs-built_in\">string<\/span> message);\n}\n\n<span class=\"hljs-comment\">// ২. Low-Level Module (ইন্টারফেস মেনে চলছে)<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> EmailSender : INotificationService\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendMessage<\/span>(<span class=\"hljs-built_in\">string<\/span> message) { Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Sending Email...\"<\/span>); }\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> SmsSender : INotificationService\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendMessage<\/span>(<span class=\"hljs-built_in\">string<\/span> message) { Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Sending SMS...\"<\/span>); }\n}<\/code><\/pre><\/div>\n<p>এখন আমাদের <code>OrderProcessor<\/code> (High-Level) আর <code>EmailSender<\/code>-কে চিনবে না, সে শুধু <code>INotificationService<\/code>-কে চিনবে। এবং এই সার্ভিসটি সে বাইরে থেকে (Constructor-এর মাধ্যমে) গ্রহণ করবে। একেই বলে <strong>Dependency Injection<\/strong>:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OrderProcessor\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> INotificationService _notificationService;\n\n    <span class=\"hljs-comment\">// ✅ Constructor Injection: Dependency বাইরে থেকে পাস করা হচ্ছে।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>(INotificationService notificationService)\n    {\n        _notificationService = notificationService;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessOrder<\/span>()\n    {\n        _notificationService.<span class=\"hljs-title function_\">SendMessage<\/span>(<span class=\"hljs-string\">\"Your order has been confirmed.\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>লাভ কী হলো?<\/strong><br>এখন আপনি <code>OrderProcessor<\/code>-কে একটুও পরিবর্তন না করে যেকোনো মাধ্যম দিয়ে মেসেজ পাঠাতে পারবেন!<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ইমেইল পাঠাতে চাইলে:<\/span>\nOrderProcessor emailProcessor = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">EmailSender<\/span>());\n\n<span class=\"hljs-comment\">// SMS পাঠাতে চাইলে (OrderProcessor এ কোনো কোড চেঞ্জ করা লাগেনি!):<\/span>\nOrderProcessor smsProcessor = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">SmsSender<\/span>());<\/code><\/pre><\/div>\n<p>এটাই হলো <strong>Dependency Inversion Principle<\/strong>-এর জাদুকরী ক্ষমতা! এটি আপনার কোডকে ফ্লেক্সিবল, টেস্টেবল এবং দীর্ঘস্থায়ী করে তোলে।<\/p>\n<hr>\n<h2>🔗 DIP এবং Coupling-এর সম্পর্ক (Tight vs Loose Coupling)<\/h2>\n<p>DIP (Dependency Inversion Principle)-এর সাথে <strong>Coupling<\/strong>-এর সম্পর্ক একেবারে জন্মগত! বলতে গেলে, কোডকে \"Coupling\" এর অভিশাপ থেকে বাঁচাতেই DIP এর জন্ম।<\/p>\n<h3>১. Tight Coupling (আঠার মতো লেগে থাকা)<\/h3>\n<p>যখন একটি ক্লাস সরাসরি <code>new<\/code> কিওয়ার্ড ব্যবহার করে অন্য একটি ক্লাসের অবজেক্ট তৈরি করে, তখন তারা একে অপরের সাথে আঠার মতো লেগে যায়। একেই বলে <strong>Tight Coupling<\/strong> (বা কড়া নির্ভরতা)।<\/p>\n<p>যেমন আমাদের <code>Violation.cs<\/code> ফাইলে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OrderProcessor\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> EmailSender _emailSender = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">EmailSender<\/span>(); <span class=\"hljs-comment\">// ❌ Tight Coupling<\/span>\n}<\/code><\/pre><\/div>\n<p>এখানে <code>OrderProcessor<\/code> ক্লাসটি <code>EmailSender<\/code>-এর সাথে টাইট কাপলড। সমস্যাটা কী?<br>যদি কালকে ইমেইলের বদলে SMS পাঠাতে হয়, তখন আপনাকে বাধ্য হয়ে <code>OrderProcessor<\/code> ক্লাসের ভেতরের কোড কাটাকাটি করতে হবে। এক ক্লাসের পরিবর্তনের কারণে অন্য ক্লাসকেও পাল্টাতে হচ্ছে—এটাই টাইট কাপলিংয়ের প্রধান সমস্যা।<\/p>\n<h3>২. Loose Coupling (স্বাধীন করে দেওয়া)<\/h3>\n<p>সফটওয়্যার ইঞ্জিনিয়ারিংয়ের সবচেয়ে বড় রুলস হলো: <strong>কোডকে সবসময় Loose Coupled হতে হবে।<\/strong> অর্থাৎ, এক ক্লাসের সাথে আরেক ক্লাসের সম্পর্ক থাকবে ঠিকই, কিন্তু তারা একে অপরের উপর অন্ধভাবে নির্ভরশীল হবে না।<\/p>\n<p>আর এই <strong>Loose Coupling<\/strong> অর্জন করার সবচেয়ে বড় হাতিয়ারই হলো <strong>DIP<\/strong>!<br>DIP বলে, সরাসরি একে অপরের উপর নির্ভর না করে, মাঝখানে একটি \"চুক্তি\" বা \"ইন্টারফেস\" (Abstraction) বসিয়ে দাও।<\/p>\n<p>যেমন আমাদের <code>Solution.cs<\/code> ফাইলে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OrderProcessor\n{\n    <span class=\"hljs-comment\">// ✅ Loose Coupling<\/span>\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> INotificationService _notificationService; \n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>(INotificationService notificationService)\n    {\n        _notificationService = notificationService;\n    }\n}<\/code><\/pre><\/div>\n<p>এখানে <code>OrderProcessor<\/code> আর কোনো নির্দিষ্ট ক্লাসকে চেনে না। সে শুধু <code>INotificationService<\/code> ইন্টারফেসকে চেনে।<\/p>\n<p>এখন আপনি বাইরে থেকে তাকে <code>EmailSender<\/code> দেন, আর <code>SmsSender<\/code> দেন—তার কিছুই যায় আসে না। তার ভেতরে কোনো কোডই চেঞ্জ করতে হবে না! <code>OrderProcessor<\/code> এখন পুরোপুরি স্বাধীন বা <strong>Loose Coupled<\/strong>।<\/p>\n<p><strong>সারসংক্ষেপ:<\/strong><br><strong>Tight Coupling<\/strong> হলো একটি রোগের নাম, আর <strong>DIP<\/strong> হলো সেই রোগের ঔষধ, যা খাইয়ে কোডকে <strong>Loose Coupled<\/strong> (সুস্থ) করা হয়!<\/p>","solid/05-dependency-inversion-principle/Violation.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Violation.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.DIP.Violation\n{\n    <span class=\"hljs-comment\">// Low-Level Module (Specific Detail)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> EmailSender\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendEmail<\/span>(<span class=\"hljs-built_in\">string<\/span> message)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Sending Email: {message}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// High-Level Module (Core Business Logic)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OrderProcessor\n    {\n        <span class=\"hljs-comment\">// ❌ DIP Violation: হাই-লেভেল মডিউল সরাসরি লো-লেভেল মডিউলের (EmailSender) উপর নির্ভর করছে।<\/span>\n        <span class=\"hljs-comment\">// যদি ভবিষ্যতে ইমেইলের বদলে SMS পাঠাতে চাই, তবে পুরো ক্লাস চেঞ্জ করতে হবে!<\/span>\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> EmailSender _emailSender;\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>()\n        {\n            <span class=\"hljs-comment\">// সরাসরি Concrete Class এর ইনস্ট্যান্স তৈরি করা হচ্ছে (Tight Coupling)<\/span>\n            _emailSender = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">EmailSender<\/span>();\n        }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessOrder<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Order Processed Successfully.\"<\/span>);\n            \n            <span class=\"hljs-comment\">// নোটিফিকেশন পাঠানোর জন্য সরাসরি EmailSender ব্যবহার করা হচ্ছে<\/span>\n            _emailSender.<span class=\"hljs-title function_\">SendEmail<\/span>(<span class=\"hljs-string\">\"Your order has been confirmed.\"<\/span>);\n        }\n    }\n}<\/code><\/pre><\/div>","solid/05-dependency-inversion-principle/Solution.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Solution.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.DIP.Solution\n{\n    <span class=\"hljs-comment\">// ✅ Abstraction (ইন্টারফেস) - হাই-লেভেল এবং লো-লেভেল উভয়েই এখন এর উপর নির্ভর করবে।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> INotificationService\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendMessage<\/span>(<span class=\"hljs-built_in\">string<\/span> message);\n    }\n\n    <span class=\"hljs-comment\">// Low-Level Module 1 (Email)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> EmailSender : INotificationService\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendMessage<\/span>(<span class=\"hljs-built_in\">string<\/span> message)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Sending Email: {message}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// Low-Level Module 2 (SMS) - নতুন যোগ করা হলো<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> SmsSender : INotificationService\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendMessage<\/span>(<span class=\"hljs-built_in\">string<\/span> message)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Sending SMS: {message}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// High-Level Module<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OrderProcessor\n    {\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> INotificationService _notificationService;\n\n        <span class=\"hljs-comment\">// ✅ Constructor Injection: হাই-লেভেল মডিউল এখন আর কোনো নির্দিষ্ট লো-লেভেল ক্লাসের উপর নির্ভর করে না।<\/span>\n        <span class=\"hljs-comment\">// সে শুধু Abstraction (INotificationService) এর উপর নির্ভর করে। একেই বলে Loose Coupling!<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>(INotificationService notificationService)\n        {\n            _notificationService = notificationService;\n        }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessOrder<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Order Processed Successfully.\"<\/span>);\n            _notificationService.<span class=\"hljs-title function_\">SendMessage<\/span>(<span class=\"hljs-string\">\"Your order has been confirmed.\"<\/span>);\n        }\n    }\n    \n    <span class=\"hljs-comment\">/// &lt;summary&gt;<\/span>\n    <span class=\"hljs-comment\">/// Usage / Example:<\/span>\n    <span class=\"hljs-comment\">/// &lt;/summary&gt;<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Program\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Run<\/span>()\n        {\n            <span class=\"hljs-comment\">// Email দিয়ে পাঠাতে চাইলে<\/span>\n            OrderProcessor emailProcessor = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">EmailSender<\/span>());\n            emailProcessor.<span class=\"hljs-title function_\">ProcessOrder<\/span>();\n\n            <span class=\"hljs-comment\">// SMS দিয়ে পাঠাতে চাইলে (OrderProcessor-এ কোনো চেঞ্জই করা লাগল না!)<\/span>\n            OrderProcessor smsProcessor = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>(<span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">SmsSender<\/span>());\n            smsProcessor.<span class=\"hljs-title function_\">ProcessOrder<\/span>();\n        }\n    }\n}<\/code><\/pre><\/div>","solid/CHEAT_SHEET.md":"<h1>SOLID — এক নজরে<\/h1>\n<p>SOLID হলো Object-Oriented ডিজাইনের ৫টি নীতি। লক্ষ্য একটাই: কোড যেন <strong>বদলানো সহজ<\/strong>, <strong>টেস্ট করা সহজ<\/strong> আর <strong>একটা পরিবর্তনে অন্য জায়গা না ভাঙে<\/strong>। এই গাইডের সব উদাহরণ একই ধরনের ই-কমার্স / পেমেন্ট সিস্টেম দিয়ে, তাই একটার সাথে আরেকটা মিলিয়ে পড়া যায়।<\/p>\n<hr>\n<h2>৫টি নীতি — এক টেবিলে<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\">নীতি<\/th><th align=\"left\">এক লাইনে<\/th><th align=\"left\">উদাহরণে ভুলটা কী<\/th><th align=\"left\">সমাধান<\/th><\/tr><\/thead><tbody><tr><td align=\"left\"><strong>S<\/strong> — Single Responsibility<\/td><td align=\"left\">একটি ক্লাস বদলানোর কারণ থাকবে <strong>একটাই<\/strong><\/td><td align=\"left\"><code>OrderProcessor<\/code> একাই ট্যাক্স হিসাব করে, ফাইলে সেভ করে, ইমেইল পাঠায়<\/td><td align=\"left\"><code>ITaxCalculator<\/code>, <code>IOrderRepository<\/code>, <code>INotificationService<\/code>-এ ভাগ; <code>OrderProcessor<\/code> শুধু কাজ করিয়ে নেয়<\/td><\/tr><tr><td align=\"left\"><strong>O<\/strong> — Open-Closed<\/td><td align=\"left\">নতুন ফিচার = <strong>নতুন কোড<\/strong>, পুরনো কোড অপরিবর্তিত<\/td><td align=\"left\"><code>PaymentProcessor<\/code>-এ <code>is<\/code> দিয়ে <code>if/else<\/code> করে ফি হিসাব<\/td><td align=\"left\"><code>CalculateFee()<\/code> ইন্টারফেসে; নতুন <code>BkashPayment<\/code> মানে শুধু একটা নতুন ক্লাস<\/td><\/tr><tr><td align=\"left\"><strong>L<\/strong> — Liskov Substitution<\/td><td align=\"left\">Parent-এর জায়গায় Child বসালে <strong>কিছু ভাঙবে না<\/strong><\/td><td align=\"left\"><code>GiftCardPayment.Refund()<\/code> exception থ্রো করে<\/td><td align=\"left\"><code>IRefundable<\/code> আলাদা; <code>RefundService<\/code> শুধু <code>IRefundable<\/code> নেয়<\/td><\/tr><tr><td align=\"left\"><strong>I<\/strong> — Interface Segregation<\/td><td align=\"left\">যা লাগে না, এমন মেথড <strong>implement করতে বাধ্য করা যাবে না<\/strong><\/td><td align=\"left\"><code>OldBasicPrinter<\/code>-কে <code>Scan()<\/code> আর <code>Fax()<\/code> লিখতে হচ্ছে<\/td><td align=\"left\"><code>IPrinter<\/code>, <code>IScanner<\/code>, <code>IFax<\/code> — ছোট ছোট ইন্টারফেস<\/td><\/tr><tr><td align=\"left\"><strong>D<\/strong> — Dependency Inversion<\/td><td align=\"left\">High-level আর low-level দুজনেই <strong>abstraction<\/strong>-এর ওপর নির্ভর করবে<\/td><td align=\"left\"><code>OrderProcessor<\/code> নিজেই <code>new EmailSender()<\/code> বানায়<\/td><td align=\"left\"><code>INotificationService<\/code> constructor দিয়ে inject করা<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>কোড দেখে কীভাবে চিনবেন? (Code smell)<\/h2>\n<ul><li><strong>একটা ক্লাস অনেক অসম্পর্কিত কাজ করে<\/strong>, অনেক কারণে বারবার এডিট হয় → <strong>SRP<\/strong> ভাঙছে।<\/li><li><code>if (x is TypeA) … else if (x is TypeB)<\/code> বা type দেখে <code>switch<\/code> → নতুন type এলেই এডিট লাগবে, <strong>OCP<\/strong> ভাঙছে।<\/li><li>Implement করা মেথডে <code>throw new NotSupportedException()<\/code>, অথবা চুপচাপ ভিন্ন আচরণ (নেগেটিভ ডিসকাউন্ট, লুকানো ফি) → <strong>LSP<\/strong> ভাঙছে।<\/li><li>ইন্টারফেসের অর্ধেক মেথড ক্লাসের দরকারই নেই → <strong>ISP<\/strong> ভাঙছে।<\/li><li>Business ক্লাসের ভেতরে <code>new ConcreteService()<\/code> → <strong>DIP<\/strong> ভাঙছে।<\/li><\/ul>\n<hr>\n<h2>নীতিগুলো একে অপরের সাথে কীভাবে জড়িত<\/h2>\n<ul><li><strong>SRP → High Cohesion<\/strong>, <strong>DIP → Loose Coupling।<\/strong> দুটো মিলেই সেই গোল্ডেন রুল: <em>\"High Cohesion, Loose Coupling\"<\/em>।<\/li><li><strong>DIP না মানলে সাধারণত OCP-ও ভাঙে।<\/strong> ইমেইলের বদলে SMS পাঠাতে হলে <code>OrderProcessor<\/code>-এর ভেতরে এডিট করতে হয়।<\/li><li><strong>LSP আর ISP-র সমাধান দেখতে একই রকম<\/strong> — বড় ইন্টারফেস ভেঙে ছোট করা। পার্থক্য হলো প্রশ্নে:<ul><li><strong>LSP:<\/strong> Child বসালে প্রোগ্রাম কি ভাঙে বা ভুল ফল দেয়?<\/li><li><strong>ISP:<\/strong> Client কি এমন মেথডের ওপর নির্ভর করছে যা সে ব্যবহারই করে না?<\/li><\/ul><\/li><li><strong>OCP-র অস্ত্র হলো polymorphism।<\/strong> ইন্টারফেস ঠিকমতো থাকলে (DIP) নতুন behavior শুধু নতুন ক্লাস দিয়েই যোগ করা যায়।<\/li><\/ul>\n<hr>\n<h2>ইন্টারভিউর জন্য এক লাইনের উত্তর<\/h2>\n<blockquote><p><strong>S:<\/strong> One class, one reason to change.<br><strong>O:<\/strong> Open for extension, closed for modification — নতুন ফিচারে পুরনো কোড এডিট নয়।<br><strong>L:<\/strong> Subtype যেন base type-এর চুক্তি (contract) ভাঙে না — exception বা ভিন্ন আচরণ নয়।<br><strong>I:<\/strong> Fat interface নয়, ছোট ও নির্দিষ্ট interface।<br><strong>D:<\/strong> Concrete class নয়, abstraction-এর ওপর নির্ভর করো; dependency বাইরে থেকে inject করো।<\/p><\/blockquote>\n<p><strong>মনে রাখবেন:<\/strong> বাগ ফিক্স করতে পুরনো ক্লাস এডিট করা OCP ভাঙা নয়। আর ইন্টারফেস যদি শুধু একটা ক্লাসই implement করে (<code>IUserService<\/code> → <code>UserService<\/code>), সেখানে সরাসরি মেথড যোগ করা বাস্তবে ঠিক আছে।<\/p>\n<hr>\n<h2>C# থেকে Java<\/h2>\n<p>উদাহরণগুলো C#-এ, কিন্তু ধারণা হুবহু Java-তেও খাটে:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\">C#<\/th><th align=\"left\">Java<\/th><\/tr><\/thead><tbody><tr><td align=\"left\"><code>class A : IPayment<\/code><\/td><td align=\"left\"><code>class A implements Payment<\/code><\/td><\/tr><tr><td align=\"left\"><code>class B : Base<\/code><\/td><td align=\"left\"><code>class B extends Base<\/code><\/td><\/tr><tr><td align=\"left\"><code>decimal<\/code><\/td><td align=\"left\"><code>BigDecimal<\/code><\/td><\/tr><tr><td align=\"left\"><code>throw new NotSupportedException()<\/code><\/td><td align=\"left\"><code>throw new UnsupportedOperationException()<\/code><\/td><\/tr><tr><td align=\"left\"><code>Console.WriteLine(...)<\/code><\/td><td align=\"left\"><code>System.out.println(...)<\/code><\/td><\/tr><tr><td align=\"left\">Extension method (<code>this IPaymentMethod p<\/code>)<\/td><td align=\"left\">নেই — static helper বা <code>default<\/code> interface method<\/td><\/tr><\/tbody><\/table><\/div>"},"readme":""};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

const allPatterns = [];
DATA.tree.forEach(c => c.patterns.forEach(p => allPatterns.push({ ...p, cat: c })));
const catById = Object.fromEntries(DATA.tree.map(c => [c.id, c]));
const totalFiles = Object.keys(DATA.pages).length;

/* ---------- theme ---------- */
const savedTheme = store.get('solid-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('solid-theme', next);
};

/* ---------- sidebar ---------- */
const closedCats = new Set(JSON.parse(store.get('solid-closed') || '[]'));
function buildNav(filter = '') {
  const f = filter.trim().toLowerCase();
  let html = '';
  DATA.tree.forEach(c => {
    const pats = c.patterns.filter(p => !f || (p.name + ' ' + p.h1 + ' ' + p.files.map(x => x.name).join(' ')).toLowerCase().includes(f));
    if (f && !pats.length) return;
    const closed = !f && closedCats.has(c.id);
    html += `<div class="cat ${closed ? 'closed' : ''}" style="--cat:var(--${c.accent})">
      <button class="cat-head" data-cat="${c.id}"><span class="dot" style="background:var(--${c.accent})"></span>${esc(c.name)}
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="cat-body">`;
    if (c.sheet && !f) html += `<button class="item sheet" data-go="#/s/${c.id}"><span class="num">≡</span>এক নজরে (Cheat Sheet)</button>`;
    if (!c.patterns.length && !f) c.files.forEach(x => html += `<button class="item" data-go="#/f/${c.id}/${x.name}"><span class="num">·</span>${esc(x.name.replace(/\.md$/, ''))}</button>`);
    pats.forEach(p => {
      html += `<button class="item" data-go="#/p/${p.id}" data-pid="${p.id}"><span class="num">${p.num}</span>${esc(p.name)}<span class="count">${p.files.length}</span></button>
        <div class="sub hidden" data-sub="${p.id}">${p.files.map(x => `<button class="item" data-go="#/p/${p.id}/${x.name}">${esc(x.name)}</button>`).join('')}</div>`;
    });
    html += `</div></div>`;
  });
  $('#nav').innerHTML = html || '<div class="empty">কিছু পাওয়া যায়নি</div>';
  markActive();
}
function markActive() {
  let h = decodeURIComponent(location.hash || '#/');
