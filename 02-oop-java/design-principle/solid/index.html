<script>
const DATA = {"tree":[{"id":"solid","name":"SOLID","blurb":"ভালো OOP ডিজাইনের ৫টি নীতি","accent":"c1","sheet":"solid/CHEAT_SHEET.md","files":[],"patterns":[{"id":"solid/01-single-responsibility-principle","num":"S","name":"Single Responsibility","h1":"Single Responsibility Principle (SRP)","para":"A class should have one, and only one, reason to change.","files":[{"name":"README.md","kind":"md"},{"name":"Violation.cs","kind":"code","lines":52},{"name":"Solution.cs","kind":"code","lines":108}]},{"id":"solid/02-open-closed-principle","num":"O","name":"Open-Closed","h1":"Open-Closed Principle (OCP)","para":"Software entities (classes, modules, functions, etc.) should be open for extension, but closed for modification.","files":[{"name":"README.md","kind":"md"},{"name":"Violation.cs","kind":"code","lines":63},{"name":"Solution.cs","kind":"code","lines":63},{"name":"OCPInterfaceDilemma.cs","kind":"code","lines":155}]},{"id":"solid/03-liskov-substitution-principle","num":"L","name":"Liskov Substitution","h1":"Liskov Substitution Principle (LSP)","para":"Objects of a superclass should be replaceable with objects of its subclasses without affecting the correctness of the program.","files":[{"name":"README.md","kind":"md"},{"name":"Violation.cs","kind":"code","lines":62},{"name":"Solution.cs","kind":"code","lines":88},{"name":"golpe-golpe-liskov.md","kind":"md"},{"name":"another-example.md","kind":"md"}]},{"id":"solid/04-interface-segregation-principle","num":"I","name":"Interface Segregation","h1":"Interface Segregation Principle (ISP)","para":"Clients should not be forced to depend upon interfaces that they do not use.","files":[{"name":"README.md","kind":"md"},{"name":"Violation.cs","kind":"code","lines":33},{"name":"Solution.cs","kind":"code","lines":37}]},{"id":"solid/05-dependency-inversion-principle","num":"D","name":"Dependency Inversion","h1":"Dependency Inversion Principle (DIP)","para":"High-level modules should not depend on low-level modules. Both should depend on abstractions. Abstractions should not depend on details. Details should depend on abst…","files":[{"name":"README.md","kind":"md"},{"name":"Violation.cs","kind":"code","lines":36},{"name":"Solution.cs","kind":"code","lines":65}]}]}],"pages":{"solid/01-single-responsibility-principle/README.md":"<h1>Single Responsibility Principle (SRP)<\/h1>\n<p>A class should have one, and only one, reason to change.<\/p>\n<p>In other words, every module, class, or function in a program should have responsibility over a single part of that program's functionality, and it should encapsulate that functionality.<\/p>\n<hr>\n<h2>🛑 The Violation (English)<\/h2>\n<p>Take a look at the code in <a class=\"file-link\" data-rel=\"Violation.cs\">Violation.cs<\/a>.<\/p>\n<p>In this example, the class <code>OrderProcessor<\/code> has <strong>three reasons to change<\/strong>:<\/p>\n<ol><li><strong>Tax Calculation &amp; Pricing Logic<\/strong>: If the tax calculation formula changes (e.g., adding dynamic state taxes or discounts), we have to modify <code>OrderProcessor<\/code>.<\/li><li><strong>Persistence Logic<\/strong>: Currently, the order is saved as a JSON file using <code>System.IO<\/code>. If we decide to use a database (e.g., SQL Server or MongoDB), we have to modify <code>OrderProcessor<\/code>.<\/li><li><strong>Notification Logic<\/strong>: Currently, it sends confirmation emails using a direct <code>SmtpClient<\/code>. If we switch to a transactional email API provider (like SendGrid or AWS SES) or want to change the email template, we have to modify <code>OrderProcessor<\/code>.<\/li><\/ol>\n<hr>\n<h2>🟢 The Solution (English)<\/h2>\n<p>Take a look at the code in <a class=\"file-link\" data-rel=\"Solution.cs\">Solution.cs<\/a>.<\/p>\n<p>We refactored the code by breaking down the concerns:<\/p>\n<ol><li><strong><code>ITaxCalculator<\/code><\/strong>: Handles business rules for calculating order tax.<\/li><li><strong><code>IOrderRepository<\/code><\/strong>: Handles how the order is persisted (JSON file, database, memory, etc.).<\/li><li><strong><code>INotificationService<\/code><\/strong>: Handles how notifications are sent (SMTP, SendGrid, SMS, etc.).<\/li><li><strong><code>OrderProcessor<\/code><\/strong>: Now acts purely as an orchestrator. It orchestrates the process of completing an order without knowing <em>how<\/em> the tax is computed, <em>where<\/em> the order is saved, or <em>how<\/em> the customer is notified.<\/li><\/ol>\n<p>Now, <code>OrderProcessor<\/code> has <strong>only one reason to change<\/strong>: if the high-level workflow of processing an order changes (e.g., if we decide that we should only send emails <em>after<\/em> a payment is verified).<\/p>\n<hr>\n<h2>🇧🇩 সহজ বাংলায় ব্যাখ্যা (Single Responsibility Principle)<\/h2>\n<p>সহজ বাস্তব জীবনের উদাহরণ দিয়ে নিচে বুঝিয়ে দেওয়া হলো:<\/p>\n<h3>১. বাস্তব জীবনের উদাহরণ (Real-life Analogy)<\/h3>\n<p>মনে করুন, আপনার একটা রেস্টুরেন্ট আছে। সেখানে আপনি একজন মাত্র কর্মচারী রেখেছেন—তার নাম <strong>করিম<\/strong>।<\/p>\n<p>করিমের কাজ হলো:<\/p>\n<ol><li>কাস্টমারের কাছ থেকে <strong>অর্ডার নেওয়া<\/strong>।<\/li><li>কিচেনে গিয়ে <strong>রান্না করা<\/strong>।<\/li><li>কাস্টমারের টেবিল <strong>পরিষ্কার করা<\/strong>।<\/li><li>দিন শেষে দোকানের <strong>হিসাব-নিকাশ মেলানো<\/strong>।<\/li><\/ol>\n<p><strong>সমস্যা:<\/strong><br>যদি অনেক কাস্টমার একসঙ্গে চলে আসে, করিম একা সবকিছু সামলাতে গিয়ে হিমশিম খাবে। রান্নার রেসিপি পরিবর্তন হলে করিমকে নতুন করে রান্না শিখতে হবে, তখন টেবিল পরিষ্কার বা হিসাব বন্ধ হয়ে যাবে। যেকোনো একটি কাজের পরিবর্তনের জন্য করিমের ওপর চাপ পড়বে।<\/p>\n<p><strong>সমাধান (SRP):<\/strong><br>আপনি করিমের লোড কমিয়ে চারজন আলাদা লোক নিয়োগ করলেন:<\/p>\n<ol><li><strong>শেফ (Chef):<\/strong> কাজ শুধু রান্না করা।<\/li><li><strong>ওয়েটার (Waiter):<\/strong> কাজ অর্ডার নেওয়া ও খাবার পরিবেশন করা।<\/li><li><strong>ক্লিনার (Cleaner):<\/strong> কাজ টেবিল পরিষ্কার করা।<\/li><li><strong>ক্যাশিয়ার (Cashier):<\/strong> কাজ হিসাব-নিকাশ করা।<\/li><\/ol>\n<p>এখানে প্রত্যেকে <strong>একটি মাত্র কাজের জন্য দায়ী (Single Responsibility)<\/strong>। যদি রান্নার রেসিপি পরিবর্তন হয়, ক্যাশিয়ারের এতে কিছুই যায় আসে না। তার কাজ সে করতেই থাকবে।<\/p>\n<h3>২. কোডের সাথে মিল<\/h3>\n<p><a class=\"file-link\" data-rel=\"Violation.cs\">Violation.cs<\/a>-এ <code>OrderProcessor<\/code> ক্লাসটি হলো ওই একা কাজ করা <strong>করিম<\/strong>-এর মতো। সে একাই ট্যাক্স হিসাব করে, ফাইলে ডাটা সেভ করে এবং ইমেইল পাঠায়। এর ফলে যেকোনো একটি পরিবর্তন পুরো ফাইলটিকে বারবার এডিট করতে বাধ্য করে।<\/p>\n<p><a class=\"file-link\" data-rel=\"Solution.cs\">Solution.cs<\/a>-এ আমরা কাজের দায়িত্বগুলো ভাগ করে দিয়েছি:<\/p>\n<ol><li>ট্যাক্স হিসাবের দায়িত্ব দিয়েছি <code>StandardTaxCalculator<\/code> কে।<\/li><li>ডাটা সেভ করার দায়িত্ব দিয়েছি <code>JsonFileOrderRepository<\/code> কে।<\/li><li>ইমেইল পাঠানোর দায়িত্ব দিয়েছি <code>SmtpNotificationService<\/code> কে।<\/li><\/ol>\n<p><code>OrderProcessor<\/code> এখন শুধু একজন ম্যানেজারের মতো কাজগুলো করিয়ে নেয়। ফলে ভবিষ্যৎ পরিবর্তন অনেক সহজ ও বাগ-মুক্ত (Bug-free) হয়।<\/p>\n<hr>\n<h2>🔗 SRP এবং Cohesion-এর সম্পর্ক (Low vs High Cohesion)<\/h2>\n<p>সফটওয়্যার ইঞ্জিনিয়ারিংয়ের একটি অত্যন্ত জনপ্রিয় এবং গোল্ডেন রুল (Golden Rule) আছে:<\/p>\n<blockquote><p><strong>\"High Cohesion, Loose Coupling\"<\/strong> (কোডকে সবসময় High Cohesion এবং Loose Coupling হতে হবে)।<\/p><\/blockquote>\n<p>Loose Coupling আমরা অর্জন করি <strong>DIP (Dependency Inversion Principle)<\/strong> দিয়ে। আর <strong>High Cohesion<\/strong> অর্জন করি এই <strong>SRP (Single Responsibility Principle)<\/strong> দিয়ে!<\/p>\n<h3>১. Low Cohesion (এলোমেলো জগাখিচুড়ি)<\/h3>\n<p>Cohesion মানে হলো \"মিল\" বা \"একতা\"। একটি ক্লাসের ভেতরের মেথডগুলোর মধ্যে যদি কোনো মিল না থাকে, তখন তাকে বলে <strong>Low Cohesion<\/strong>।<br>যেমন আমাদের <code>Violation.cs<\/code>-এর <code>OrderProcessor<\/code> ক্লাসটি ট্যাক্স হিসাব করে, ফাইলে সেভ করে এবং ইমেইল পাঠায়। এই তিনটি কাজের মধ্যে কোনো মিল বা একতা নেই। ট্যাক্স হিসাবের সাথে ইমেইল পাঠানোর কোনো সম্পর্ক নেই।<br>অর্থাৎ এখানে Cohesion খুবই <strong>Low<\/strong>। আর এটিই হলো <strong>SRP Violation<\/strong>!<\/p>\n<h3>২. High Cohesion (নিখুঁত একতা)<\/h3>\n<p>SRP বলে, একটি ক্লাসের একটাই দায়িত্ব থাকবে।<br>যখন আপনি জগাখিচুড়ি ক্লাসটি ভেঙে আলাদা ক্লাস বানালেন (যেমন <code>SmtpNotificationService<\/code>), তখন ওই ক্লাসের ভেতরে যা যা মেথড বা প্রপার্টি থাকবে, তার সবকিছুই শুধুমাত্র \"নোটিফিকেশন বা ইমেইল\" রিলেটেড হবে। অর্থাৎ মেথডগুলোর মধ্যে স্ট্রং মিল বা একতা আছে। একেই বলে <strong>High Cohesion<\/strong>!<\/p>\n<p><strong>সারসংক্ষেপ:<\/strong><\/p>\n<ul><li><strong>SRP মানলে:<\/strong> কোডের <strong>Cohesion বাড়ে (High Cohesion)<\/strong>। ক্লাসগুলো ফোকাসড এবং গোছানো হয়।<\/li><li><strong>DIP মানলে:<\/strong> কোডের <strong>Coupling কমে (Loose Coupling)<\/strong>। ক্লাসগুলো স্বাধীন হয়।<\/li><\/ul>","solid/01-single-responsibility-principle/Violation.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Violation.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n<span class=\"hljs-keyword\">using<\/span> System.IO;\n<span class=\"hljs-keyword\">using<\/span> System.Net.Mail;\n<span class=\"hljs-keyword\">using<\/span> System.Text.Json;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.SRP.Violation\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Order\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">int<\/span> Id { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> CustomerEmail { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> Amount { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> TaxRate { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n    }\n\n    <span class=\"hljs-comment\">/// &lt;summary&gt;<\/span>\n    <span class=\"hljs-comment\">/// VIOLATION OF SRP:<\/span>\n    <span class=\"hljs-comment\">/// This class has multiple reasons to change:<\/span>\n    <span class=\"hljs-comment\">/// 1. Business rules for calculating total price/tax change.<\/span>\n    <span class=\"hljs-comment\">/// 2. Database schema, storage format (JSON file in this case), or persistence mechanism changes.<\/span>\n    <span class=\"hljs-comment\">/// 3. Email sending configuration, provider, or message template changes.<\/span>\n    <span class=\"hljs-comment\">/// &lt;/summary&gt;<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OrderProcessor\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(Order order)\n        {\n            <span class=\"hljs-comment\">// 1. Calculate Total Amount (Tax calculation business logic)<\/span>\n            <span class=\"hljs-built_in\">decimal<\/span> total = order.Amount + (order.Amount * order.TaxRate);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Calculated total: {total}\"<\/span>);\n\n            <span class=\"hljs-comment\">// 2. Persist the Order to Database/Storage (Persistence logic)<\/span>\n            <span class=\"hljs-keyword\">var<\/span> orderJson = JsonSerializer.<span class=\"hljs-title function_\">Serialize<\/span>(order);\n            File.<span class=\"hljs-title function_\">WriteAllText<\/span>(<span class=\"hljs-string\">$\"order_{order.Id}.json\"<\/span>, orderJson);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Saved order {order.Id} to file database.\"<\/span>);\n\n            <span class=\"hljs-comment\">// 3. Send Confirmation Email (Notification logic)<\/span>\n            <span class=\"hljs-keyword\">using<\/span> (<span class=\"hljs-keyword\">var<\/span> message = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">MailMessage<\/span>(<span class=\"hljs-string\">\"no-reply@mycompany.com\"<\/span>, order.CustomerEmail))\n            {\n                message.Subject = <span class=\"hljs-string\">\"Order Processed Successfully\"<\/span>;\n                message.Body = <span class=\"hljs-string\">$\"Hi! Your order of {total:C} has been successfully processed.\"<\/span>;\n                \n                <span class=\"hljs-keyword\">using<\/span> (<span class=\"hljs-keyword\">var<\/span> client = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">SmtpClient<\/span>(<span class=\"hljs-string\">\"smtp.mycompany.com\"<\/span>))\n                {\n                    <span class=\"hljs-comment\">// Simulated sending<\/span>\n                    Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Sending SMTP email to {order.CustomerEmail} via smtp.mycompany.com...\"<\/span>);\n                    <span class=\"hljs-comment\">// client.Send(message); <\/span>\n                }\n            }\n        }\n    }\n}<\/code><\/pre><\/div>","solid/01-single-responsibility-principle/Solution.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Solution.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n<span class=\"hljs-keyword\">using<\/span> System.IO;\n<span class=\"hljs-keyword\">using<\/span> System.Net.Mail;\n<span class=\"hljs-keyword\">using<\/span> System.Text.Json;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.SRP.Solution\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Order\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">int<\/span> Id { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> CustomerEmail { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> Amount { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> TaxRate { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n    }\n\n    <span class=\"hljs-comment\">// --- 1. TAX CALCULATION (Business Logic) ---<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> ITaxCalculator\n    {\n        <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateTotal<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount, <span class=\"hljs-built_in\">decimal<\/span> taxRate);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> StandardTaxCalculator : ITaxCalculator\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateTotal<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount, <span class=\"hljs-built_in\">decimal<\/span> taxRate)\n        {\n            <span class=\"hljs-keyword\">return<\/span> amount + (amount * taxRate);\n        }\n    }\n\n    <span class=\"hljs-comment\">// --- 2. PERSISTENCE (Data Access Logic) ---<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IOrderRepository\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Save<\/span>(Order order);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> JsonFileOrderRepository : IOrderRepository\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Save<\/span>(Order order)\n        {\n            <span class=\"hljs-keyword\">var<\/span> orderJson = JsonSerializer.<span class=\"hljs-title function_\">Serialize<\/span>(order);\n            File.<span class=\"hljs-title function_\">WriteAllText<\/span>(<span class=\"hljs-string\">$\"order_{order.Id}.json\"<\/span>, orderJson);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Saved order {order.Id} to file database.\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// --- 3. NOTIFICATION (Communication Logic) ---<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> INotificationService\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendOrderConfirmation<\/span>(<span class=\"hljs-built_in\">string<\/span> email, <span class=\"hljs-built_in\">decimal<\/span> totalAmount);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> SmtpNotificationService : INotificationService\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendOrderConfirmation<\/span>(<span class=\"hljs-built_in\">string<\/span> email, <span class=\"hljs-built_in\">decimal<\/span> totalAmount)\n        {\n            <span class=\"hljs-keyword\">using<\/span> (<span class=\"hljs-keyword\">var<\/span> message = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">MailMessage<\/span>(<span class=\"hljs-string\">\"no-reply@mycompany.com\"<\/span>, email))\n            {\n                message.Subject = <span class=\"hljs-string\">\"Order Processed Successfully\"<\/span>;\n                message.Body = <span class=\"hljs-string\">$\"Hi! Your order of {totalAmount:C} has been successfully processed.\"<\/span>;\n                \n                <span class=\"hljs-keyword\">using<\/span> (<span class=\"hljs-keyword\">var<\/span> client = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">SmtpClient<\/span>(<span class=\"hljs-string\">\"smtp.mycompany.com\"<\/span>))\n                {\n                    <span class=\"hljs-comment\">// Simulated sending<\/span>\n                    Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Sending SMTP email to {email} via smtp.mycompany.com...\"<\/span>);\n                    <span class=\"hljs-comment\">// client.Send(message);<\/span>\n                }\n            }\n        }\n    }\n\n    <span class=\"hljs-comment\">// --- 4. ORCHESTRATOR (Order Service) ---<\/span>\n    <span class=\"hljs-comment\">/// &lt;summary&gt;<\/span>\n    <span class=\"hljs-comment\">/// SOLUTION OF SRP:<\/span>\n    <span class=\"hljs-comment\">/// This class has only ONE reason to change: <\/span>\n    <span class=\"hljs-comment\">/// If the high-level orchestration workflow of processing an order changes.<\/span>\n    <span class=\"hljs-comment\">/// It delegates details (Tax logic, DB writes, Email templates) to specialized components.<\/span>\n    <span class=\"hljs-comment\">/// &lt;/summary&gt;<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> OrderProcessor\n    {\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> ITaxCalculator _taxCalculator;\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> IOrderRepository _orderRepository;\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> INotificationService _notificationService;\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">OrderProcessor<\/span>(\n            ITaxCalculator taxCalculator, \n            IOrderRepository orderRepository, \n            INotificationService notificationService)\n        {\n            _taxCalculator = taxCalculator;\n            _orderRepository = orderRepository;\n            _notificationService = notificationService;\n        }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(Order order)\n        {\n            <span class=\"hljs-comment\">// Calculate total using tax calculator<\/span>\n            <span class=\"hljs-built_in\">decimal<\/span> total = _taxCalculator.<span class=\"hljs-title function_\">CalculateTotal<\/span>(order.Amount, order.TaxRate);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Calculated total: {total}\"<\/span>);\n\n            <span class=\"hljs-comment\">// Save order using database repository<\/span>\n            _orderRepository.<span class=\"hljs-title function_\">Save<\/span>(order);\n\n            <span class=\"hljs-comment\">// Send confirmation email using notification service<\/span>\n            _notificationService.<span class=\"hljs-title function_\">SendOrderConfirmation<\/span>(order.CustomerEmail, total);\n        }\n    }\n}<\/code><\/pre><\/div>","solid/02-open-closed-principle/README.md":"<h1>Open-Closed Principle (OCP)<\/h1>\n<p>Software entities (classes, modules, functions, etc.) should be <strong>open for extension, but closed for modification<\/strong>.<\/p>\n<p>সহজ কথায়: নতুন ফিচার যোগ করার সময় পুরাতন কোডে হাত দিতে হবে না। নতুন কোড লিখে পুরাতন কোডকে extend করব।<\/p>\n<hr>\n<h2>🛑 The Violation — <a class=\"file-link\" data-rel=\"Violation.cs\">Violation.cs<\/a><\/h2>\n<p>এখানে একটি <code>IPaymentMethod<\/code> ইন্টারফেস আছে, এবং সেটি ঠিকমতো ইমপ্লিমেন্টও করা হয়েছে। কিন্তু সমস্যা হলো <strong>\"Processing Fee\"<\/strong> বা প্রসেসিং ফি হিসাব করার ক্ষেত্রে।<\/p>\n<p><code>PaymentProcessor<\/code> ক্লাস ফি হিসাব করার জন্য ইন্টারফেসের সাহায্য না নিয়ে, <code>is<\/code> কিওয়ার্ড দিয়ে হার্ডকোড লজিক লিখেছে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ১. একটি পারফেক্ট ইন্টারফেস আছে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n}\n\n<span class=\"hljs-comment\">// ২. ক্লাসগুলো ইন্টারফেস ইমপ্লিমেন্ট করেছে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) { Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing...\"<\/span>); }\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PayPalPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) { Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing...\"<\/span>); }\n}\n\n<span class=\"hljs-comment\">// ৩. কিন্তু PaymentProcessor ক্লাসে ফি বের করার জন্য if-else ব্যবহার করা হচ্ছে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PaymentProcessor\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(IPaymentMethod payment, <span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        <span class=\"hljs-built_in\">decimal<\/span> fee = <span class=\"hljs-number\">0<\/span>;\n\n        <span class=\"hljs-comment\">// ❌ OCP Violation: নতুন পেমেন্ট মেথড আসলে এখানে কোড এডিট করতে হবে!<\/span>\n        <span class=\"hljs-keyword\">if<\/span> (payment <span class=\"hljs-keyword\">is<\/span> CreditCardPayment)\n        {\n            fee = amount * <span class=\"hljs-number\">0.02m<\/span>; <span class=\"hljs-comment\">// ২% ফি<\/span>\n        }\n        <span class=\"hljs-keyword\">else<\/span> <span class=\"hljs-keyword\">if<\/span> (payment <span class=\"hljs-keyword\">is<\/span> PayPalPayment)\n        {\n            fee = amount * <span class=\"hljs-number\">0.05m<\/span>; <span class=\"hljs-comment\">// ৫% ফি<\/span>\n        }\n\n        <span class=\"hljs-comment\">// পলিমরফিজম ঠিকই কাজ করছে, কিন্তু ফি এর লজিকটি OCP লঙ্ঘন করেছে<\/span>\n        payment.<span class=\"hljs-title function_\">ProcessPayment<\/span>(amount + fee);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>সমস্যা কোথায়?<\/strong> ইন্টারফেস থাকার পরও নতুন পেমেন্ট মেথড (যেমন <code>BkashPayment<\/code>) যোগ করতে গেলে বাধ্য হয়ে <code>PaymentProcessor<\/code> ক্লাসের <code>if/else<\/code> ব্লক এডিট করে নতুন ফি-এর লজিক যোগ করতে হবে। এটি OCP লঙ্ঘন, কারণ ক্লাসটি modification-এর জন্য বন্ধ (closed) নয়।<\/p>\n<hr>\n<h2>🟢 The Solution — <a class=\"file-link\" data-rel=\"Solution.cs\">Solution.cs<\/a><\/h2>\n<p>আমরা <code>IPaymentMethod<\/code> ইন্টারফেসে ফি হিসাব করার দায়িত্বটিও দিয়ে দেব (<code>CalculateFee<\/code>)। এর ফলে <code>PaymentProcessor<\/code> কে কোন ক্লাস এসেছে তা জানতে হবে না:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ১. ফি (Fee) হিসাব করার দায়িত্বটাও ইন্টারফেসকে দিয়ে দেওয়া হলো<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n{\n    <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateFee<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n}\n\n<span class=\"hljs-comment\">// ২. এখন প্রতিটি ক্লাস নিজের ফি নিজেই হিসাব করতে পারে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateFee<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; amount * <span class=\"hljs-number\">0.02m<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) { Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing...\"<\/span>); }\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PayPalPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateFee<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; amount * <span class=\"hljs-number\">0.05m<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) { Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing...\"<\/span>); }\n}\n\n<span class=\"hljs-comment\">// নতুন Bkash যোগ করলে শুধু ক্লাস বানাতে হবে, আর কিচ্ছু করতে হবে না!<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> BkashPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateFee<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; amount * <span class=\"hljs-number\">0.01m<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) { Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing Bkash...\"<\/span>); }\n}\n\n<span class=\"hljs-comment\">// ৩. PaymentProcessor এখন পুরোপুরি ইন্টারফেসের উপর নির্ভরশীল<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PaymentProcessor\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(IPaymentMethod payment, <span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        <span class=\"hljs-comment\">// পলিমরফিজম ব্যবহার করে ফি হিসাব করা হচ্ছে<\/span>\n        <span class=\"hljs-built_in\">decimal<\/span> fee = payment.<span class=\"hljs-title function_\">CalculateFee<\/span>(amount);\n        \n        payment.<span class=\"hljs-title function_\">ProcessPayment<\/span>(amount + fee); <span class=\"hljs-comment\">// ব্যস! কোনো if/else নেই!<\/span>\n    }\n}<\/code><\/pre><\/div>\n<p><strong>লাভ কী হলো?<\/strong> নতুন <code>BkashPayment<\/code> যোগ করতে শুধু একটি নতুন ক্লাস তৈরি করলেই হলো। <code>PaymentProcessor<\/code> ক্লাসে কোনো <code>if/else<\/code> নেই, তাই এর একটি লাইনও এডিট করতে হলো না। এটিই হলো OCP — <strong>Open for Extension, Closed for Modification<\/strong>।<\/p>\n<hr>\n<h2>💡 প্রশ্ন ও উত্তর (FAQ)<\/h2>\n<h3>১. কোডে বাগ (Bug) থাকলে কি ক্লাস পরিবর্তন করা যাবে?<\/h3>\n<p><strong>হ্যাঁ, অবশ্যই পরিবর্তন করা যাবে।<\/strong><\/p>\n<p>OCP মানে এই নয় যে একবার কোড লেখা হলে সেটা আর কখনো ছোঁয়া যাবে না। OCP শুধুমাত্র বলে: <strong>নতুন ফিচার বা নতুন আচরণ (Behavior)<\/strong> যোগ করার সময় পুরাতন কোড এডিট করো না।<\/p>\n<p>কিন্তু <strong>বাগ ফিক্সিং<\/strong> এবং <strong>নতুন ফিচার যোগ করা<\/strong> দুটি সম্পূর্ণ আলাদা জিনিস:<\/p>\n<ul><li><strong>বাগ ফিক্সিং<\/strong> = পুরাতন কোড যেভাবে কাজ করার কথা ছিল সেভাবে কাজ করছে না, সেটা ঠিক করা। যেমন:<ul><li><code>Process()<\/code> মেথডে ট্যাক্স হিসাব ভুল হচ্ছিল (১০% এর জায়গায় ১০০% চার্জ হচ্ছিল), সেটা ঠিক করা।<\/li><li>কোনো মেথডে <code>NullReferenceException<\/code> আসছিল, সেটা ফিক্স করা।<\/li><li>একটি <code>if<\/code> কন্ডিশনে ভুল লজিক ছিল, সেটা সংশোধন করা।<\/li><\/ul><\/li><li><strong>নতুন ফিচার যোগ করা<\/strong> = আগে যা ছিল না এমন কিছু নতুন যুক্ত করা। যেমন:<ul><li>পেমেন্ট সিস্টেমে নতুন বিকাশ (Bkash) পেমেন্ট মেথড যোগ করা।<\/li><li>পেমেন্টের পর SMS নোটিফিকেশন পাঠানোর ফিচার যোগ করা।<\/li><li>OTP ভেরিফিকেশন ফিচার যোগ করা।<\/li><\/ul><\/li><\/ul>\n<p><strong>সারকথা:<\/strong> বাগ ফিক্সিং এর জন্য মূল ক্লাসের কোড পরিবর্তন করা OCP লঙ্ঘন নয়। কিন্তু নতুন ফিচার (যেমন নতুন পেমেন্ট মেথড, নতুন নোটিফিকেশন সিস্টেম) যোগ করতে গিয়ে যদি পুরাতন ক্লাসের কোড এডিট করতে হয়, তাহলে সেটা OCP লঙ্ঘন।<\/p>\n<hr>\n<h3>২. বিদ্যমান ইন্টারফেসে সরাসরি নতুন মেথড সিগনেচার যোগ করা কি OCP লঙ্ঘন?<\/h3>\n<p><strong>হ্যাঁ, এটি OCP লঙ্ঘন।<\/strong> ধরুন আমরা <code>IPaymentMethod<\/code> ইন্টারফেসে সরাসরি <code>VerifyOtp()<\/code> মেথড যোগ করলাম:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ সমস্যা: সরাসরি মূল ইন্টারফেস এডিট করা হচ্ছে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">VerifyOtp<\/span>(); <span class=\"hljs-comment\">// &lt;-- নতুন মেথড সরাসরি যোগ করা হলো<\/span>\n}\n\n<span class=\"hljs-comment\">// এখন PayPalPayment ক্লাসে কম্পাইলার এরর আসবে!<\/span>\n<span class=\"hljs-comment\">// কারণ PayPalPayment এ VerifyOtp() ইমপ্লিমেন্ট করা নেই।<\/span>\n<span class=\"hljs-comment\">// আমাদের বাধ্য হয়ে PayPalPayment এর কোডও এডিট করতে হবে:<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PayPalPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) { ... }\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">VerifyOtp<\/span>() { <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NotImplementedException<\/span>(); } <span class=\"hljs-comment\">// জোর করে লিখতে হচ্ছে!<\/span>\n}<\/code><\/pre><\/div>\n<p><strong>কেন সমস্যা?<\/strong> পেপ্যালের ওটিপি ভেরিফিকেশন দরকার নেই, কিন্তু ইন্টারফেসে মেথড যোগ করায় পেপ্যাল ক্লাসের কোডও জোর করে মডিফাই করতে হচ্ছে।<\/p>\n<hr>\n<h3>৩. তাহলে মূল ইন্টারফেস এডিট না করে নতুন মেথড কীভাবে যোগ করব?<\/h3>\n<p>৩টি উপায় আছে:<\/p>\n<h4>উপায় ১: ইন্টারফেস ইনহেরিটেন্স (Recommended ✅)<\/h4>\n<p>মূল ইন্টারফেসে হাত না দিয়ে নতুন একটি ইন্টারফেস বানাব যা পুরাতনটিকে ইনহেরিট করে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// মূল ইন্টারফেস — একদম অপরিবর্তিত থাকবে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n}\n\n<span class=\"hljs-comment\">// নতুন ইন্টারফেস — মূল ইন্টারফেসকে ইনহেরিট করে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> ISecurePaymentMethod : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">VerifyOtp<\/span>();\n}\n\n<span class=\"hljs-comment\">// PayPalPayment — আগের মতোই আছে, কোনো পরিবর্তন নেই<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PayPalPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing PayPal payment of {amount}\"<\/span>);\n    }\n}\n\n<span class=\"hljs-comment\">// CreditCardPayment — নতুন ইন্টারফেস ব্যবহার করছে কারণ এর OTP দরকার<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : ISecurePaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing credit card payment of {amount}\"<\/span>);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">VerifyOtp<\/span>()\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"OTP verified for Credit Card.\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>লাভ:<\/strong> মূল <code>IPaymentMethod<\/code> এডিট হয়নি। <code>PayPalPayment<\/code> এডিট হয়নি। শুধু যার ওটিপি দরকার সেই <code>CreditCardPayment<\/code> নতুন ইন্টারফেস ব্যবহার করছে।<\/p>\n<hr>\n<h4>উপায় ২: এক্সটেনশন মেথড (Extension Methods)<\/h4>\n<p>কোনো ইন্টারফেস বা ক্লাস এডিট না করে, সম্পূর্ণ আলাদা ফাইলে নতুন মেথড যোগ করা:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// IPaymentMethod এবং এর সব ক্লাস — সব অপরিবর্তিত থাকবে<\/span>\n\n<span class=\"hljs-comment\">// সম্পূর্ণ আলাদা একটি ফাইলে এটি লিখব:<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">class<\/span> PaymentExtensions\n{\n    <span class=\"hljs-comment\">// 'this' কিওয়ার্ড ব্যবহারে এটি IPaymentMethod এর নিজস্ব মেথডের মতো কাজ করবে<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">PrintReceipt<\/span>(<span class=\"hljs-keyword\">this<\/span> IPaymentMethod paymentMethod, <span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"--- RECEIPT ---\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Amount: {amount:C}\"<\/span>);\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"---------------\"<\/span>);\n    }\n}\n\n<span class=\"hljs-comment\">// ব্যবহার:<\/span>\n<span class=\"hljs-comment\">// PayPalPayment paypal = new PayPalPayment();<\/span>\n<span class=\"hljs-comment\">// paypal.Process(500);<\/span>\n<span class=\"hljs-comment\">// paypal.PrintReceipt(500);  &lt;-- ইন্টারফেসে না থাকলেও সরাসরি কল করা যাচ্ছে!<\/span><\/code><\/pre><\/div>\n<p><strong>লাভ:<\/strong> <code>IPaymentMethod<\/code> বা কোনো পেমেন্ট ক্লাসের এক লাইনও এডিট হয়নি, অথচ নতুন মেথড পেয়ে গেলাম!<\/p>\n<hr>\n<h4>উপায় ৩: ডেকোরেটর প্যাটার্ন (Decorator Pattern)<\/h4>\n<p>বিদ্যমান ক্লাসের বাইরে একটি \"র‍্যাপার\" ক্লাস তৈরি করে নতুন কাজ যুক্ত করা:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// PayPalPayment — আগের মতোই, কোনো পরিবর্তন নেই<\/span>\n\n<span class=\"hljs-comment\">// নতুন র‍্যাপার ক্লাস — পেমেন্টের পর SMS পাঠাবে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PaymentWithSmsDecorator : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> IPaymentMethod _innerPayment; <span class=\"hljs-comment\">// ভেতরে আসল পেমেন্ট মেথড রাখা হবে<\/span>\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">PaymentWithSmsDecorator<\/span>(IPaymentMethod innerPayment)\n    {\n        _innerPayment = innerPayment;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        _innerPayment.<span class=\"hljs-title function_\">Process<\/span>(amount);  <span class=\"hljs-comment\">// ১. আগে আসল পেমেন্ট হবে<\/span>\n        <span class=\"hljs-title function_\">SendSms<\/span>(amount);                <span class=\"hljs-comment\">// ২. তারপর SMS পাঠাবে<\/span>\n    }\n\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendSms<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"[SMS] Payment of {amount:C} successful!\"<\/span>);\n    }\n}\n\n<span class=\"hljs-comment\">// ব্যবহার:<\/span>\n<span class=\"hljs-comment\">// IPaymentMethod paypal = new PayPalPayment();<\/span>\n<span class=\"hljs-comment\">// IPaymentMethod paypalWithSms = new PaymentWithSmsDecorator(paypal);<\/span>\n<span class=\"hljs-comment\">// paypalWithSms.Process(500);<\/span>\n<span class=\"hljs-comment\">// Output:<\/span>\n<span class=\"hljs-comment\">//   Processing PayPal payment of 500<\/span>\n<span class=\"hljs-comment\">//   [SMS] Payment of ৳500.00 successful!<\/span><\/code><\/pre><\/div>\n<p><strong>লাভ:<\/strong> <code>PayPalPayment<\/code> ক্লাসে হাত না দিয়েই পেমেন্টের পর SMS পাঠানোর ফিচার যোগ করা হলো!<\/p>\n<hr>\n<h3>৪. যদি কোনো ইন্টারফেস কেবল একটি ক্লাসেই ইমপ্লিমেন্ট করা থাকে (1-to-1), তবে কি সরাসরি ইন্টারফেসে মেথড যোগ করা যাবে?<\/h3>\n<p><strong>উত্তর:<\/strong><\/p>\n<ul><li><strong>তাত্ত্বিক দৃষ্টিকোণ থেকে:<\/strong> হ্যাঁ, ওল্ড ফাইল এডিট করার কারণে এটি তাত্ত্বিকভাবে মডিফিকেশন।<\/li><li><strong>বাস্তব প্র্যাক্টিক্যাল দৃষ্টিকোণ থেকে:<\/strong> এটি করা সম্পূর্ণ ঠিক আছে। যেহেতু ইন্টারফেসটি কেবল একটি ক্লাসই ইমপ্লিমেন্ট করেছে (যেমন <code>IUserService<\/code> ও <code>UserService<\/code>), সেহেতু অন্য কোনো ক্লাস ব্রেক হওয়ার সম্ভাবনা নেই। তাই বাস্তব প্রজেক্টে ১-টু-১ সম্পর্কের ক্ষেত্রে সরাসরি মেথড যোগ করা একটি সাধারণ ও সঠিক প্র্যাকটিস।<\/li><\/ul>","solid/02-open-closed-principle/Violation.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Violation.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.OCP.Violation\n{\n    <span class=\"hljs-comment\">// ১. একটি পারফেক্ট ইন্টারফেস আছে, যার নিজস্ব মেথডও আছে।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    }\n\n    <span class=\"hljs-comment\">// ২. ক্লাসগুলো ইন্টারফেস ইমপ্লিমেন্ট করেছে।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing credit card payment of {amount}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PayPalPayment : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing PayPal payment of {amount}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">/// &lt;summary&gt;<\/span>\n    <span class=\"hljs-comment\">/// VIOLATION OF OCP:<\/span>\n    <span class=\"hljs-comment\">/// <\/span>\n    <span class=\"hljs-comment\">/// বাস্তব প্রজেক্টে ডেভেলপাররা ঠিক এই ভুলটাই করে। <\/span>\n    <span class=\"hljs-comment\">/// ইন্টারফেস আছে, পলিমরফিজমও কল হচ্ছে (নিচে payment.ProcessPayment)।<\/span>\n    <span class=\"hljs-comment\">/// <\/span>\n    <span class=\"hljs-comment\">/// কিন্তু \"Processing Fee\" বের করার জন্য তারা ইন্টারফেসের সাহায্য না নিয়ে, <\/span>\n    <span class=\"hljs-comment\">/// 'is' কিওয়ার্ড দিয়ে টাইপ চেক করে হার্ডকোড লজিক লিখে দেয়।<\/span>\n    <span class=\"hljs-comment\">/// <\/span>\n    <span class=\"hljs-comment\">/// ভবিষ্যতে BkashPayment যোগ করতে হলে, বাধ্য হয়ে এই PaymentProcessor <\/span>\n    <span class=\"hljs-comment\">/// ক্লাসের if-else এডিট করে নতুন ফি (Fee) লজিক যোগ করতে হবে (Modification)।<\/span>\n    <span class=\"hljs-comment\">/// &lt;/summary&gt;<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PaymentProcessor\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(IPaymentMethod payment, <span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            <span class=\"hljs-built_in\">decimal<\/span> fee = <span class=\"hljs-number\">0<\/span>;\n\n            <span class=\"hljs-comment\">// ❌ OCP Violation: নতুন পেমেন্ট মেথড আসলে এখানে কোড এডিট করতে হবে!<\/span>\n            <span class=\"hljs-keyword\">if<\/span> (payment <span class=\"hljs-keyword\">is<\/span> CreditCardPayment)\n            {\n                fee = amount * <span class=\"hljs-number\">0.02m<\/span>; <span class=\"hljs-comment\">// ২% ফি<\/span>\n            }\n            <span class=\"hljs-keyword\">else<\/span> <span class=\"hljs-keyword\">if<\/span> (payment <span class=\"hljs-keyword\">is<\/span> PayPalPayment)\n            {\n                fee = amount * <span class=\"hljs-number\">0.05m<\/span>; <span class=\"hljs-comment\">// ৫% ফি<\/span>\n            }\n\n            <span class=\"hljs-built_in\">decimal<\/span> totalAmount = amount + fee;\n            \n            <span class=\"hljs-comment\">// পলিমরফিজম ঠিকই কাজ করছে, কিন্তু উপরের if/else ব্লকটি OCP লঙ্ঘন করেছে।<\/span>\n            payment.<span class=\"hljs-title function_\">ProcessPayment<\/span>(totalAmount);\n        }\n    }\n}<\/code><\/pre><\/div>","solid/02-open-closed-principle/Solution.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Solution.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.OCP.Solution\n{\n    <span class=\"hljs-comment\">// ১. ফি (Fee) হিসাব করার দায়িত্বটাও ইন্টারফেসকে দিয়ে দেওয়া হলো<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n    {\n        <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateFee<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    }\n\n    <span class=\"hljs-comment\">// ২. এখন প্রতিটি ক্লাস নিজের ফি নিজেই হিসাব করতে পারে<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateFee<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; amount * <span class=\"hljs-number\">0.02m<\/span>; <span class=\"hljs-comment\">// ২% ফি<\/span>\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing credit card payment of {amount}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PayPalPayment : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateFee<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; amount * <span class=\"hljs-number\">0.05m<\/span>; <span class=\"hljs-comment\">// ৫% ফি<\/span>\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing PayPal payment of {amount}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// ৩. নতুন বিকাশ যোগ করলে শুধু ক্লাস বানাতে হবে, আর কিচ্ছু করতে হবে না!<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> BkashPayment : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title function_\">CalculateFee<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; amount * <span class=\"hljs-number\">0.01m<\/span>; <span class=\"hljs-comment\">// ১% ফি<\/span>\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing Bkash payment of {amount}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">/// &lt;summary&gt;<\/span>\n    <span class=\"hljs-comment\">/// SOLUTION OF OCP:<\/span>\n    <span class=\"hljs-comment\">/// <\/span>\n    <span class=\"hljs-comment\">/// এখন PaymentProcessor ক্লাসে কোনো if/else নেই। <\/span>\n    <span class=\"hljs-comment\">/// নতুন যত পেমেন্ট মেথডই আসুক না কেন, এই ক্লাসের একটি লাইনও পরিবর্তন করতে হবে না।<\/span>\n    <span class=\"hljs-comment\">/// (Open for Extension, Closed for Modification)<\/span>\n    <span class=\"hljs-comment\">/// &lt;/summary&gt;<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PaymentProcessor\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(IPaymentMethod payment, <span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            <span class=\"hljs-comment\">// পলিমরফিজম ব্যবহার করে ফি হিসাব করা হচ্ছে<\/span>\n            <span class=\"hljs-built_in\">decimal<\/span> fee = payment.<span class=\"hljs-title function_\">CalculateFee<\/span>(amount);\n            <span class=\"hljs-built_in\">decimal<\/span> totalAmount = amount + fee;\n\n            payment.<span class=\"hljs-title function_\">ProcessPayment<\/span>(totalAmount);\n        }\n    }\n}<\/code><\/pre><\/div>","solid/02-open-closed-principle/OCPInterfaceDilemma.cs":"<div class=\"code\"><div class=\"code-bar\"><span>OCPInterfaceDilemma.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.OCP.InterfaceDilemma\n{\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    <span class=\"hljs-comment\">// ❌ THE PROBLEM SCENARIO: DIRECT MODIFICATION<\/span>\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    \n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IOriginalPaymentMethod\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n        \n        <span class=\"hljs-comment\">// If we add this here directly:<\/span>\n        <span class=\"hljs-comment\">// void VerifyOtp(); <\/span>\n        <span class=\"hljs-comment\">// <\/span>\n        <span class=\"hljs-comment\">// It will immediately break PayPalPayment below because PayPalPayment does NOT <\/span>\n        <span class=\"hljs-comment\">// implement VerifyOtp(). We would be forced to modify PayPalPayment.<\/span>\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PayPalPaymentOriginal : IOriginalPaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing PayPal payment of {amount}\"<\/span>);\n        }\n        \n        <span class=\"hljs-comment\">// FORCED TO ADD THIS:<\/span>\n        <span class=\"hljs-comment\">// public void VerifyOtp() { throw new NotImplementedException(); }<\/span>\n    }\n\n\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    <span class=\"hljs-comment\">// 🟢 SOLUTION 1: INTERFACE INHERITENCE (ইন্টারফেস ইনহেরিটেন্স)<\/span>\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    \n    <span class=\"hljs-comment\">// Step 1: Keep the base interface untouched<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    }\n\n    <span class=\"hljs-comment\">// Step 2: Create a NEW interface for the new behavior that inherits the base<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> ISecurePaymentMethod : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">VerifyOtp<\/span>(); <span class=\"hljs-comment\">// Only secure methods will have this<\/span>\n    }\n\n    <span class=\"hljs-comment\">// PayPal only needs the base interface. We don't touch PayPal at all!<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PayPalPayment : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing PayPal payment of {amount}\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// Credit Card needs BOTH process and OTP verification<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : ISecurePaymentMethod\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Processing Credit Card payment of {amount}\"<\/span>);\n        }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">VerifyOtp<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"OTP Verification successful for Credit Card.\"<\/span>);\n        }\n    }\n\n\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    <span class=\"hljs-comment\">// 🟢 SOLUTION 2: EXTENSION METHOD (এক্সটেনশন মেথড)<\/span>\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    <span class=\"hljs-comment\">// We want to add a \"PrintReceipt\" feature to all payment methods,<\/span>\n    <span class=\"hljs-comment\">// without changing the IPaymentMethod interface or any of the classes.<\/span>\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">class<\/span> PaymentExtensions\n    {\n        <span class=\"hljs-comment\">// Notice the 'this' keyword before IPaymentMethod.<\/span>\n        <span class=\"hljs-comment\">// This makes PrintReceipt behave like a method of IPaymentMethod.<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">PrintReceipt<\/span>(<span class=\"hljs-keyword\">this<\/span> IPaymentMethod paymentMethod, <span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"--- RECEIPT ---\"<\/span>);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Payment Method Type: {paymentMethod.GetType().Name}\"<\/span>);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Amount Processed: {amount:C}\"<\/span>);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"----------------\"<\/span>);\n        }\n    }\n\n\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    <span class=\"hljs-comment\">// 🟢 SOLUTION 3: DECORATOR PATTERN (ডেকোরেটর প্যাটার্ন)<\/span>\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    <span class=\"hljs-comment\">// We want to add SMS Notification behavior after a payment processes,<\/span>\n    <span class=\"hljs-comment\">// without modifying the PayPalPayment or CreditCardPayment class.<\/span>\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> PaymentWithSmsDecorator : IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> IPaymentMethod _innerPaymentMethod;\n\n        <span class=\"hljs-comment\">// We wrap/decorate any existing payment method<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">PaymentWithSmsDecorator<\/span>(IPaymentMethod innerPaymentMethod)\n        {\n            _innerPaymentMethod = innerPaymentMethod;\n        }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            <span class=\"hljs-comment\">// 1. Run the original payment method<\/span>\n            _innerPaymentMethod.<span class=\"hljs-title function_\">Process<\/span>(amount);\n\n            <span class=\"hljs-comment\">// 2. Add the new SMS behavior<\/span>\n            <span class=\"hljs-title function_\">SendSmsNotification<\/span>(amount);\n        }\n\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendSmsNotification<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"[SMS NOTIFICATION] A payment of {amount:C} was successfully processed!\"<\/span>);\n        }\n    }\n\n\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    <span class=\"hljs-comment\">// 🖥️ EXECUTION DEMO<\/span>\n    <span class=\"hljs-comment\">// =================================================================<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Program\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">RunDemo<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"=== OCP SOLUTIONS DEMO ===\"<\/span>);\n\n            <span class=\"hljs-comment\">// --- Solution 1 Demo (Interface Inheritance) ---<\/span>\n            IPaymentMethod paypal = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">PayPalPayment<\/span>();\n            paypal.<span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-number\">100<\/span>); <span class=\"hljs-comment\">// Only processes payment, no OTP needed<\/span>\n\n            ISecurePaymentMethod creditCard = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CreditCardPayment<\/span>();\n            creditCard.<span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-number\">250<\/span>);\n            creditCard.<span class=\"hljs-title function_\">VerifyOtp<\/span>(); <span class=\"hljs-comment\">// Verifies OTP securely<\/span>\n\n            <span class=\"hljs-comment\">// --- Solution 2 Demo (Extension Method) ---<\/span>\n            <span class=\"hljs-comment\">// Even though IPaymentMethod doesn't have PrintReceipt inside it, <\/span>\n            <span class=\"hljs-comment\">// we can call it directly thanks to Extension Methods!<\/span>\n            paypal.<span class=\"hljs-title function_\">PrintReceipt<\/span>(<span class=\"hljs-number\">100<\/span>);\n            creditCard.<span class=\"hljs-title function_\">PrintReceipt<\/span>(<span class=\"hljs-number\">250<\/span>);\n\n            <span class=\"hljs-comment\">// --- Solution 3 Demo (Decorator Pattern) ---<\/span>\n            <span class=\"hljs-comment\">// We wrap PayPalPayment with our SMS Decorator to add SMS notifications.<\/span>\n            <span class=\"hljs-comment\">// Notice how PayPalPayment code itself remains 100% unchanged!<\/span>\n            IPaymentMethod decoratedPaypal = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">PaymentWithSmsDecorator<\/span>(paypal);\n            decoratedPaypal.<span class=\"hljs-title function_\">Process<\/span>(<span class=\"hljs-number\">100<\/span>); \n        }\n    }\n}<\/code><\/pre><\/div>","solid/03-liskov-substitution-principle/README.md":"<h1>Liskov Substitution Principle (LSP)<\/h1>\n<p>Objects of a superclass should be replaceable with objects of its subclasses without affecting the correctness of the program.<\/p>\n<p>সহজ কথায়: <strong>চাইল্ড ক্লাসকে (Child Class) এমনভাবে তৈরি করতে হবে যেন সে তার বেস ইন্টারফেস বা প্যারেন্ট ক্লাসের (Parent Class) জায়গা পুরোপুরি নিতে পারে, কিন্তু সিস্টেম ক্র্যাশ বা কোনো এরর (Error) না হয়।<\/strong> বেস ইন্টারফেস যা যা করার প্রতিশ্রুতি দেয়, চাইল্ড ক্লাসকেও হুবহু তা পূরণ করতে হবে।<\/p>\n<hr>\n<h2>🛑 The Violation — <a class=\"file-link\" data-rel=\"Violation.cs\">Violation.cs<\/a><\/h2>\n<p>ধরুন আমাদের একটি বেস ইন্টারফেস আছে <code>IPaymentMethod<\/code>, যার দুটি কাজ আছে: পেমেন্ট প্রসেস করা (<code>ProcessPayment<\/code>) এবং রিফান্ড করা (<code>Refund<\/code>)।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Refund<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n}\n\n<span class=\"hljs-comment\">// ১. ক্রেডিট কার্ড রিফান্ড করতে পারে, তাই সমস্যা নেই।<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Card Processed\"<\/span>);\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Refund<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Card Refunded\"<\/span>);\n}\n\n<span class=\"hljs-comment\">// ২. ❌ কিন্তু গিফট কার্ড তো রিফান্ড করা যায় না!<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> GiftCardPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Gift Card Processed\"<\/span>);\n    \n    <span class=\"hljs-comment\">// গিফট কার্ড রিফান্ড হয় না, তাই জোর করে Exception থ্রো করা হলো।<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Refund<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NotSupportedException<\/span>(<span class=\"hljs-string\">\"Gift Card cannot be refunded!\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<h3>💥 সমস্যা কোথায় (LSP Violation)?<\/h3>\n<p>লুপ ব্যবহার না করে সরাসরি মেথড কলের মাধ্যমে সমস্যাটি দেখি। আমাদের একটি <code>RefundService<\/code> আছে যা যেকোনো <code>IPaymentMethod<\/code> গ্রহণ করে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> RefundService\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ExecuteRefund<\/span>(IPaymentMethod payment, <span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        <span class=\"hljs-comment\">// যদি GiftCardPayment পাস করা হয়, তাহলে এখানে অ্যাপ্লিকেশন ক্র্যাশ করবে!<\/span>\n        payment.<span class=\"hljs-title function_\">Refund<\/span>(amount);\n    }\n}\n\n<span class=\"hljs-comment\">// Usage:<\/span>\nRefundService refundService = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">RefundService<\/span>();\n\nIPaymentMethod card = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CreditCardPayment<\/span>();\nrefundService.<span class=\"hljs-title function_\">ExecuteRefund<\/span>(card, <span class=\"hljs-number\">100<\/span>); <span class=\"hljs-comment\">// ✅ ঠিকঠাক কাজ করবে<\/span>\n\nIPaymentMethod giftCard = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">GiftCardPayment<\/span>();\nrefundService.<span class=\"hljs-title function_\">ExecuteRefund<\/span>(giftCard, <span class=\"hljs-number\">100<\/span>); <span class=\"hljs-comment\">// 💥 Crash! NotSupportedException<\/span><\/code><\/pre><\/div>\n<p><strong>LSP Violation কেন?<\/strong> <code>ExecuteRefund<\/code> মেথডটি আশা করেছিল যেকোনো <code>IPaymentMethod<\/code>-ই রিফান্ড করতে পারবে। কিন্তু <code>GiftCardPayment<\/code> তার বেস ইন্টারফেসের (<code>IPaymentMethod<\/code>) আচরণ পালন করতে না পারায় সিস্টেম ক্র্যাশ করেছে। এটিই <strong>Liskov Substitution Principle (LSP)<\/strong> এর স্পষ্ট লঙ্ঘন।<\/p>\n<hr>\n<h2>🟢 The Solution — <a class=\"file-link\" data-rel=\"Solution.cs\">Solution.cs<\/a><\/h2>\n<p>ইন্টারফেসকে এমন কিছু করতে বাধ্য করা যাবে না যা তার সব ইমপ্লিমেন্টিং ক্লাস করতে পারে না। তাই আমরা কাজগুলোকে আলাদা করে দেব:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ১. সাধারণ পেমেন্ট (যা সবাই করতে পারে)<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n}\n\n<span class=\"hljs-comment\">// ২. রিফান্ড (যা শুধু রিফান্ডেবল মেথডগুলো করবে)<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IRefundable\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Refund<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n}\n\n<span class=\"hljs-comment\">// ৩. ক্রেডিট কার্ড দুটোই পারে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : IPaymentMethod, IRefundable\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Card Processed\"<\/span>);\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Refund<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Card Refunded\"<\/span>);\n}\n\n<span class=\"hljs-comment\">// ৪. গিফট কার্ড শুধু পেমেন্ট পারে, রিফান্ড নয়! তাই সে IRefundable ব্যবহার করবে না।<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> GiftCardPayment : IPaymentMethod\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Gift Card Processed\"<\/span>);\n}<\/code><\/pre><\/div>\n<p>এখন <code>RefundService<\/code> ক্লাস শুধুমাত্র <code>IRefundable<\/code> ইন্টারফেস গ্রহণ করবে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> RefundService\n{\n    <span class=\"hljs-comment\">// ✅ এখন এটি শুধুমাত্র IRefundable ইন্টারফেস গ্রহণ করে<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ExecuteRefund<\/span>(IRefundable payment, <span class=\"hljs-built_in\">decimal<\/span> amount)\n    {\n        payment.<span class=\"hljs-title function_\">Refund<\/span>(amount);\n    }\n}\n\n<span class=\"hljs-comment\">// Usage:<\/span>\nRefundService refundService = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">RefundService<\/span>();\n\nCreditCardPayment card = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CreditCardPayment<\/span>();\nrefundService.<span class=\"hljs-title function_\">ExecuteRefund<\/span>(card, <span class=\"hljs-number\">100<\/span>); <span class=\"hljs-comment\">// ✅ ঠিকঠাক কাজ করবে<\/span>\n\nGiftCardPayment giftCard = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">GiftCardPayment<\/span>();\n<span class=\"hljs-comment\">// refundService.ExecuteRefund(giftCard, 100); // 🚫 Compiler Error! Safe!<\/span><\/code><\/pre><\/div>\n<p><strong>লাভ কী হলো?<\/strong><br>এখন <code>RefundService<\/code> শুধুমাত্র <code>IRefundable<\/code> ইন্টারফেস গ্রহণ করে। তাই <code>GiftCardPayment<\/code> এখানে ভুল করেও পাস করা যাবে না (কম্পাইল-টাইম এরর)। ফলে লুপ হোক বা সরাসরি কল, সিস্টেম ক্র্যাশ করার কোনো সুযোগ নেই। ইমপ্লিমেন্টিং ক্লাসগুলো এখন তাদের নিজস্ব আচরণ অনুযায়ী সঠিক ইন্টারফেস ব্যবহার করছে।<\/p>\n<hr>\n<h2>💡 প্রশ্ন ও উত্তর (FAQ)<\/h2>\n<h3>\"Parent should be replaceable by child\" — এর মানে কী?<\/h3>\n<p>খুব সহজ কথায় বললে:<\/p>\n<ul><li><strong>Parent (Parent Type):<\/strong> ইন্টারফেস বা বেস ক্লাস (যেমন <code>IPaymentMethod<\/code>) হলো একটি <strong>\"ফাঁকা বাক্স\"<\/strong> বা <strong>\"লেবেল\"<\/strong>।<\/li><li><strong>Child (Child Type):<\/strong> যে ক্লাসটি ঐ ইন্টারফেস ইমপ্লিমেন্ট করে (যেমন <code>CreditCardPayment<\/code> বা <code>GiftCardPayment<\/code>), সেটি হলো আসল কাজ করার <strong>\"মেশিন\"<\/strong>।<\/li><\/ul>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"> parent          child\n   |               |\n  IPay p1 = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">BkashPay<\/span>();\n  IPay p2 = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CreditCardPay<\/span>();\n  IPay p3 = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NagadPay<\/span>();<\/code><\/pre><\/div>\n<p>যখন আমরা লিখি:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\">IPaymentMethod pay = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CreditCardPayment<\/span>();<\/code><\/pre><\/div>\n<p>এর মানে হলো: <strong>\"আমাকে IPaymentMethod নামের একটি ফাঁকা বাক্স দাও, আর সেই বাক্সের ভেতরে আসল CreditCardPayment মেশিনটি ঢুকিয়ে দাও।\"<\/strong><\/p>\n<p>এখানে <strong>Parent (<code>IPaymentMethod<\/code>) এর জায়গাটি দখল করেছে বা রিপ্লেস (Replace) করেছে Child (<code>CreditCardPayment<\/code>)।<\/strong><\/p>\n<p><strong>LSP এর মূল নিয়ম হলো:<\/strong><br>এই <code>IPaymentMethod<\/code> বাক্সে আপনি যেই Child মেশিনকেই রাখেন না কেন, বাক্সের বাটন (যেমন <code>ProcessPayment<\/code>) চাপলে তা ঠিকঠাক কাজ করতে হবে। কোনোভাবেই যেন সিস্টেম ক্র্যাশ না করে। যদি <code>GiftCardPayment<\/code> কে ঐ বাক্সে রাখলে সিস্টেম ক্র্যাশ করে (যেমনটা আমাদের Violation ফাইলে <code>Refund<\/code> কল করলে হয়েছিল), তার মানে ওই Child তার Parent-এর জায়গা নেওয়ার যোগ্য নয়! এটাই হলো LSP Violation।<\/p>","solid/03-liskov-substitution-principle/Violation.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Violation.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.LSP.Violation\n{\n    <span class=\"hljs-comment\">// ১. বেস ইন্টারফেস<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Refund<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    }\n\n    <span class=\"hljs-comment\">// ২. ক্রেডিট কার্ড (সব মেথড সাপোর্ট করে)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : IPaymentM ;\n            refundService.<span class=\"hljs-title function_\">ExecuteRefund<\/span>(giftCard, <span class=\"hljs-number\">100<\/span>); <span class=\"hljs-comment\">// 💥 Crash! NotSupportedException<\/span>\n        }\n    }\n}<\/code><\/pre><\/div>","solid/03-liskov-substitution-principle/Solution.cs":"<div class=\"code\"><div class=\"code-bar\"><span>Solution.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> SOLID.LSP.Solution\n{\n    <span class=\"hljs-comment\">// ১. সাধারণ পেমেন্ট ইন্টারফেস (যেটা সবাই করতে পারে)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IPaymentMethod\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    }\n\n    <span class=\"hljs-comment\">// ২. রিফান্ডেবল পেমেন্ট ইন্টারফেস (যেটা শুধু রিফান্ড করা যায় এমন মেথডগুলো করবে)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IRefundable\n    {\n        <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Refund<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount);\n    }\n\n    <span class=\"hljs-comment\">// ৩. ক্রেডিট কার্ড দুটোই করতে পারে<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CreditCardPayment : IPaymentMethod, IRefundable\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">ProcessPayment<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Card Processed\"<\/span>);\n        <span class=\"hljs-keyword\">public<\/span> <span c
