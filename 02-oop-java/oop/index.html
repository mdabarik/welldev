<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OOP in C#</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== WellDev theme — shared tokens (same look as the SQL 50 guide and the hub page) ===== */
:root{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#f1f4fa; --side:rgba(255,255,255,.86);
  --ink:#0f172a; --ink-2:#4b5565; --ink-3:#8a95ab; --line:#e4e8f1;
  --text:var(--ink); --muted:var(--ink-2); --faint:var(--ink-3); --soft:var(--surface-2);
  --accent:#6366f1; --accent-soft:color-mix(in srgb,#6366f1 12%,transparent);
  --c1:#6366f1; --c2:#10b981; --c3:#ec4899; --c4:#f59e0b; --c5:#0ea5e9; --c6:#8b5cf6;
  --good:#059669; --bad:#e11d48;
  --hero:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.14);
  --shadow-lg:0 2px 4px rgba(15,23,42,.05),0 24px 48px -20px rgba(30,41,99,.3);
  /* VS Code Light+ */
  --code-bg:#ffffff; --code-bar:#f3f4f8; --code-line:#e6e9f1; --code-gutter:#237893; --code-ink:#1f1f1f;
  --t-kw:#0000ff; --t-str:#a31515; --t-com:#008000; --t-num:#098658; --t-type:#267f99; --t-fn:#795e26; --t-attr:#001080;
  --sans:"Inter","Hind Siliguri",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  --bn:"Hind Siliguri","Inter",ui-sans-serif,sans-serif;
  --serif:"Inter","Hind Siliguri",sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a; --surface:#121827; --surface-2:#182033; --side:rgba(18,24,39,.88);
  --ink:#e7ecf6; --ink-2:#a3aec6; --ink-3:#6b7791; --line:#232c42;
  --accent:#818cf8; --c1:#818cf8; --c2:#34d399; --c3:#f472b6; --c4:#fbbf24; --c5:#38bdf8; --c6:#a78bfa;
  --good:#34d399; --bad:#fb7185;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -20px rgba(0,0,0,.75);
  --code-bg:#1e1e1e; --code-bar:#252526; --code-line:#2d2d30; --code-gutter:#858585; --code-ink:#d4d4d4;
  --t-kw:#569cd6; --t-str:#ce9178; --t-com:#6a9955; --t-num:#b5cea8; --t-type:#4ec9b0; --t-fn:#dcdcaa; --t-attr:#9cdcfe;
}}
:root[data-theme="dark"]{
  --bg:#0b0f1a; --surface:#121827; --surface-2:#182033; --side:rgba(18,24,39,.88);
  --ink:#e7ecf6; --ink-2:#a3aec6; --ink-3:#6b7791; --line:#232c42;
  --accent:#818cf8; --c1:#818cf8; --c2:#34d399; --c3:#f472b6; --c4:#fbbf24; --c5:#38bdf8; --c6:#a78bfa;
  --good:#34d399; --bad:#fb7185;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -20px rgba(0,0,0,.75);
  --code-bg:#1e1e1e; --code-bar:#252526; --code-line:#2d2d30; --code-gutter:#858585; --code-ink:#d4d4d4;
  --t-kw:#569cd6; --t-str:#ce9178; --t-com:#6a9955; --t-num:#b5cea8; --t-type:#4ec9b0; --t-fn:#dcdcaa; --t-attr:#9cdcfe;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:460px;z-index:-1;pointer-events:none;
  background:radial-gradient(620px 260px at 25% -40px,color-mix(in srgb,#6366f1 15%,transparent),transparent 70%),
             radial-gradient(540px 240px at 90% -60px,color-mix(in srgb,#ec4899 12%,transparent),transparent 70%)}
a{color:var(--accent)}
button{font:inherit;color:inherit}

/* ----- code: VS Code look ----- */
.code{margin:16px 0 22px;border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line);box-shadow:var(--shadow)}
.code-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--code-bar);border-bottom:1px solid var(--code-line);font:500 12px var(--mono);color:var(--ink-2)}
.code-bar::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;background:#ff5f57;box-shadow:17px 0 0 #febc2e,34px 0 0 #28c840;margin-right:36px}
.code-bar > span:first-of-type{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{margin-left:auto;border:1px solid var(--code-line);background:var(--code-bg);color:var(--ink-2);border-radius:7px;padding:2px 10px;font:500 11.5px var(--sans);cursor:pointer}
.copy:hover{color:var(--ink);border-color:var(--ink-3)}
.code pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--code-ink);tab-size:4;counter-reset:ln;scrollbar-width:thin}
.code pre:not(.numbered){padding:12px 18px}
.code .ln-row{display:block;padding-right:18px;min-height:1.7em}
.code .ln-row::before{counter-increment:ln;content:counter(ln);display:inline-block;width:46px;padding-right:16px;text-align:right;color:var(--code-gutter);opacity:.85;user-select:none;-webkit-user-select:none}
.code .ln-row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.hljs-keyword,.hljs-meta .hljs-keyword,.t-kw{color:var(--t-kw)}
.hljs-built_in{color:var(--t-type)}
.hljs-string,.hljs-regexp,.t-str{color:var(--t-str)}
.hljs-comment,.hljs-quote,.t-com{color:var(--t-com);font-style:italic}
.hljs-number,.hljs-literal,.t-num{color:var(--t-num)}
.hljs-title,.hljs-title.class_,.hljs-type,.t-type{color:var(--t-type)}
.hljs-title.function_,.hljs-function .hljs-title,.t-fn{color:var(--t-fn)}
.hljs-attr,.hljs-variable,.hljs-property,.hljs-meta{color:var(--t-attr)}
.hljs-params{color:var(--code-ink)}

/* ----- tables ----- */
.table-wrap{overflow-x:auto;margin:18px 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:color-mix(in srgb,var(--accent) 70%,var(--ink));font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;border-bottom-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
tr:last-child td{border-bottom:0}

:not(pre)>code{font-family:var(--mono);font-size:.84em;font-weight:500;background:color-mix(in srgb,var(--accent) 9%,var(--surface));color:color-mix(in srgb,var(--accent) 72%,var(--ink));border:0;padding:.12em .45em;border-radius:6px}
::selection{background:color-mix(in srgb,#8b5cf6 25%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
code,pre,kbd{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}

/* ===== sidebar + tabs pages (Design Patterns, SOLID, OOP) ===== */
html,body{margin:0;height:100%}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:20px 14px 40px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px;text-decoration:none;color:var(--ink);cursor:pointer}
.brand-mark{width:38px;height:38px;border-radius:11px;color:#fff;display:grid;place-items:center;font:800 16px var(--sans);background:var(--hero);box-shadow:0 6px 16px -6px #8b5cf6}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.02em;display:block;line-height:1.15}
.brand small{color:var(--ink-3);font-size:12px;font-family:var(--bn)}
.search{position:relative;margin:0 2px 14px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid transparent;border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:14px;outline:none}
.search input:focus{border-color:#8b5cf6;background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,#8b5cf6 15%,transparent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.nav-home{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;text-align:left}
.nav-home:hover{background:var(--surface-2)}
.nav-home.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.cat{margin-top:16px}
.cat-head{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border:0;background:none;cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.cat-head .dot{width:9px;height:9px;border-radius:3px}
.cat-head .chev{margin-left:auto;transition:transform .2s;color:var(--ink-3)}
.cat.closed .chev{transform:rotate(-90deg)}
.cat.closed .cat-body{display:none}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;background:none;border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink);text-align:left;position:relative}
.item:hover{background:var(--surface-2)}
.item.active{background:color-mix(in srgb,var(--cat,var(--accent)) 13%,transparent);font-weight:600}
.item .num{flex:none;width:24px;height:22px;border-radius:7px;display:grid;place-items:center;font:600 11px var(--mono);color:var(--ink-2);background:var(--surface-2)}
.item.active .num{background:var(--cat,var(--accent));color:#fff}
.item .count{margin-left:auto;font:600 11px var(--mono);color:var(--ink-3)}
.item.sheet{color:var(--ink-2);font-size:13.5px}
.sub{margin:2px 0 6px 22px;border-left:2px solid var(--line);padding-left:8px}
.sub .item{font-size:12.5px;padding:4px 8px;font-family:var(--mono);color:var(--ink-2)}
.sub .item.active{background:var(--surface-2);color:var(--ink)}
.side-foot{margin:26px 6px 0;display:flex;gap:8px;flex-wrap:wrap}
.theme-btn,.home-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink-2);text-decoration:none}
.theme-btn:hover,.home-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.hidden{display:none!important}

.main{min-width:0}
.topbar{display:none}
.wrap{max-width:940px;margin:0 auto;padding:36px 40px 110px}
.crumbs{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;text-transform:uppercase}
.crumbs span.sep{opacity:.5}

/* home */
.hero{border-radius:24px;padding:38px 40px;margin-bottom:34px;color:#fff;position:relative;overflow:hidden;background:var(--hero);box-shadow:var(--shadow-lg)}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
.eyebrow{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85}
.hero h1{font-weight:800;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.035em;margin:10px 0 14px}
.hero h1 em{font-style:normal;color:#fde68a}
.hero p{font-family:var(--bn);font-size:16.5px;opacity:.93;max-width:640px;margin:0;line-height:1.75}
.hero a{color:#fff}
.stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(6px);border-radius:14px;padding:10px 16px;min-width:108px}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;opacity:.88;text-transform:uppercase;letter-spacing:.06em}
.section{margin-bottom:40px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-head h2{font-size:23px;font-weight:800;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.section-head h2::before{content:"";width:12px;height:28px;border-radius:4px;background:linear-gradient(180deg,var(--cat),color-mix(in srgb,var(--cat) 55%,#ec4899))}
.section-head .bn{font-family:var(--bn);color:var(--ink-2);font-size:14.5px}
.section-head button{margin-left:auto;border:0;color:#fff;background:var(--cat);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 14px -8px var(--cat)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cat);border-radius:16px;padding:16px 18px;cursor:pointer;text-align:left;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--cat) 45%,var(--line))}
.card .top{display:flex;align-items:center;gap:8px}
.card .n{font:700 11px var(--mono);color:#fff;background:var(--cat);padding:2px 8px;border-radius:7px}
.card .files{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--cat);background:color-mix(in srgb,var(--cat) 11%,transparent);padding:1px 8px;border-radius:999px}
.card h3{margin:6px 0 0;font-size:17px;font-weight:750;letter-spacing:-.015em}
.card p{margin:0;font-family:var(--bn);font-size:13.5px;color:var(--ink-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* detail page */
.page-head{margin-bottom:6px;border-radius:22px;padding:26px 28px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);
  background:linear-gradient(135deg,var(--cat,var(--accent)) 0%,color-mix(in srgb,var(--cat,var(--accent)) 62%,#0f172a) 100%)}
.page-head::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%)}
.page-head h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:0}
.page-head .bn{font-family:var(--bn);opacity:.9;font-size:16px;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:18px 0 28px;box-shadow:var(--shadow)}
.tab{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font:500 13px var(--mono);color:var(--ink-2);display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.active{background:var(--cat,var(--accent));color:#fff;box-shadow:0 6px 14px -8px var(--cat,var(--accent))}
.tab .ic{width:8px;height:8px;border-radius:2px;background:var(--ink-3)}
.tab .ic.md{background:var(--cat)}
.tab.active .ic{background:#fff}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:52px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 18px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.pager button:hover{border-color:var(--accent);transform:translateY(-2px)}
.pager button.next{text-align:right;grid-column:2}
.pager small{display:block;color:var(--ink-3);font-size:12px}
.pager b{font-weight:700}

/* interview hack accordion + tabs */
.ih{margin:12px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.ih>summary{cursor:pointer;list-style:none;padding:14px 18px;font:700 16px var(--sans);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ih>summary::-webkit-details-marker{display:none}
.ih>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.ih[open]>summary::after{transform:rotate(-135deg)}
.ih[open]>summary{border-bottom:1px solid var(--line);background:var(--surface-2)}
.ih-body{padding:14px 18px 4px}
.ih-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ih-tab{cursor:pointer;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font:600 13.5px var(--sans);color:var(--ink-2)}
.ih-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.ih-langs{display:inline-flex;margin:4px 0 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.ih-lang{cursor:pointer;border:0;background:var(--surface-2);padding:5px 16px;font:600 12.5px var(--mono);color:var(--ink-2)}
.ih-lang.active{background:var(--ink);color:var(--surface)}
.ih-code{display:none}.ih-code.active{display:block}
.ih-pane{display:none}.ih-pane.active{display:block}
/* prose */
.prose{font-family:var(--bn);font-size:16.5px;line-height:1.85;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 32px;box-shadow:var(--shadow)}
.prose:has(> .code:only-child){background:none;border:0;padding:0;box-shadow:none}
.prose h1{font-family:var(--sans);font-size:26px;line-height:1.3;margin:0 0 16px;font-weight:800;letter-spacing:-.02em}
.prose h2{font-family:var(--sans);font-size:21px;line-height:1.35;margin:40px 0 12px;font-weight:750;letter-spacing:-.015em;padding-left:14px;border-left:4px solid var(--cat,var(--accent))}
.prose h3{font-family:var(--sans);font-size:17.5px;margin:28px 0 8px;font-weight:700;color:color-mix(in srgb,var(--cat,var(--accent)) 70%,var(--ink))}
.prose h4{font-size:16px;margin:22px 0 6px}
.prose p{margin:0 0 14px}
.prose strong{font-weight:650;color:var(--ink)}
.prose hr{border:0;height:2px;background:linear-gradient(90deg,var(--line),transparent);margin:34px 0}
.prose ul,.prose ol{padding-left:22px;margin:0 0 16px}
.prose li{margin:5px 0}
.prose li::marker{color:var(--cat,var(--accent))}
.prose blockquote{margin:18px 0;padding:12px 18px;border-left:4px solid var(--cat,var(--accent));border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--cat,var(--accent)) 7%,var(--surface));color:var(--ink)}
.prose blockquote p:last-child{margin:0}
.prose img{max-width:100%;border-radius:12px}
.prose figure.diagram svg{color:var(--ink)}
.file-link{cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}
.callout{margin:20px 0;padding:14px 18px;border-radius:14px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.callout p:last-child{margin-bottom:0}
.callout-title{font:700 11.5px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.callout.tip,.callout.important{--accent:var(--c2)}
.callout.warning,.callout.caution{--accent:var(--c4)}

.empty{color:var(--ink-3);padding:40px 0;text-align:center}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:30;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg);background:var(--surface)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:20}

 class কেন কাজে লাগে।","files":[{"name":"PrivateClass.md","kind":"md"}]},{"id":"class-access/private-constructor","num":"07","name":"Private & Default Constructor","h1":"Private Constructor and Default Constructor in OOP","para":"Default constructor কখন আসে, আর private constructor দিয়ে Singleton, utility ও factory কীভাবে বানায়।","files":[{"name":"PrivateConstructor.md","kind":"md"}]},{"id":"class-access/default-internal","num":"08","name":"Default vs Internal","h1":"Default vs Internal Class (Package/Assembly Level Access)","para":"Java-র package-private আর C#-এর internal — assembly / package লেভেলে অ্যাক্সেস সীমিত করা।","files":[{"name":"DefaultAndInternal.md","kind":"md"}]}]},{"id":"inheritance-deep","name":"Inheritance গভীরে","blurb":"Casting আর Diamond Problem","accent":"c3","files":[],"patterns":[{"id":"inheritance-deep/upcasting-downcasting","num":"09","name":"Upcasting & Downcasting","h1":"Upcasting and Downcasting in C#","para":"Child → Parent সবসময় সেফ, Parent → Child নয় — কেন, আর InvalidCastException এড়াবেন কীভাবে।","files":[{"name":"UpcastingDowncasting.md","kind":"md"}]},{"id":"inheritance-deep/diamond-problem","num":"10","name":"Diamond Problem","h1":"The Diamond Problem in OOP","para":"দুই parent একই মেথড override করলে child কোনটা নেবে? C# ও Java কীভাবে সমাধান করে।","files":[{"name":"DiamondProblem.md","kind":"md"}]}]},{"id":"design-quality","name":"ডিজাইন কোয়ালিটি","blurb":"ভালো ডিজাইনের মাপকাঠি","accent":"c4","files":[],"patterns":[{"id":"design-quality/coupling-cohesion-di","num":"11","name":"Coupling, Cohesion & DI","h1":"Coupling, Cohesion, and Dependency Injection (DI)","para":"High Cohesion, Loose Coupling — আর Dependency Injection কীভাবে সেটা অর্জন করে।","files":[{"name":"CouplingCohesionDI.md","kind":"md"}]}]}],"pages":{"pillars/encapsulation/README.md":"<h1>Pillar 1: Encapsulation (এনক্যাপসুলেশন)<\/h1>\n<h2>এনক্যাপসুলেশন কী?<\/h2>\n<p>এনক্যাপসুলেশন হলো অবজেক্টের ইন্টারনাল স্টেট (ডেটা বা ভ্যারিয়েবল) লুকিয়ে রাখা এবং সেই ডেটার সাথে ইন্টারঅ্যাক্ট করার জন্য কিছু নির্দিষ্ট মেথড (যেমন- getter/setter) তৈরি করে দেওয়া। এটি অনেকটা একটি ক্যাপসুলের মতো, যার ভেতরে ঔষধ সুরক্ষিত থাকে এবং বাইরের কেউ সরাসরি ঔষধটি স্পর্শ করতে পারে না।<\/p>\n<p>C# এ আমরা সাধারণত যেভাবে এনক্যাপসুলেশন অর্জন করি:<\/p>\n<ol><li><strong>Access Modifiers<\/strong>: যেমন- <code>private<\/code>, <code>public<\/code>, <code>protected<\/code> ইত্যাদির ব্যবহার।<\/li><li><strong>Properties<\/strong>: <code>get<\/code> এবং <code>set<\/code> অ্যাক্সেসরের মাধ্যমে ভ্যারিয়েবল কীভাবে পড়া বা পরিবর্তন করা হবে তা নিয়ন্ত্রণ করা।<\/li><\/ol>\n<h2>কেন এটি দরকার?<\/h2>\n<ul><li><strong>ডেটা হাইডিং (Data Hiding)<\/strong>: ক্লাসের ভেতরে কীভাবে ডেটা স্টোর হচ্ছে, তা বাইরের কেউ জানতে পারে না।<\/li><li><strong>সিকিউরিটি বৃদ্ধি<\/strong>: আপনি চাইলে কোনো ভ্যারিয়েবলকে শুধুমাত্র রিড-অনলি (read-only) বা রাইট-অনলি (write-only) করে দিতে পারেন।<\/li><li><strong>ফ্লেক্সিবিলিটি<\/strong>: এনক্যাপসুলেটেড ক্লাসের ভেতরের কোড পরিবর্তন করলেও অন্য কোনো ক্লাসে এর প্রভাব পড়ে না।<\/li><\/ul>\n<h2>উদাহরণ<\/h2>\n<p><code>EncapsulationExample.cs<\/code> ফাইলে একটি ব্যাংক অ্যাকাউন্টের উদাহরণ দেওয়া আছে। খেয়াল করলে দেখবেন, অ্যাকাউন্টের ব্যালেন্স (<code>_balance<\/code>) সরাসরি বাইরে থেকে পরিবর্তন করা যায় না, শুধুমাত্র <code>Deposit<\/code> বা <code>Withdraw<\/code> মেথডের মাধ্যমেই পরিবর্তন করা সম্ভব।<\/p>\n<hr>\n<h2>FAQ (সাধারণ জিজ্ঞাসা)<\/h2>\n<p><strong>প্রশ্ন: Abstraction এবং Encapsulation এর মধ্যে পার্থক্য কী?<\/strong><br>উত্তর: এনক্যাপসুলেশন হলো <strong>ইন্টারনাল ডেটা এবং কাজ করার পদ্ধতিকে লুকিয়ে রাখা<\/strong> (ডেটা হাইডিং)। আর অ্যাবস্ট্রাকশন হলো <strong>জটিল ইমপ্লিমেন্টেশন লুকিয়ে রেখে শুধুমাত্র দরকারি ফিচারগুলো বাইরের দুনিয়াকে দেখানো<\/strong>। এনক্যাপসুলেশন মূলত অ্যাবস্ট্রাকশন অর্জনে সাহায্য করে।<\/p>\n<p><strong>প্রশ্ন: Private ছাড়া কি এনক্যাপসুলেশন সম্ভব?<\/strong><br>উত্তর: হ্যাঁ, সম্ভব! এনক্যাপসুলেশনের মূল উদ্দেশ্য হলো ডেটা অ্যাক্সেস কন্ট্রোল করা। আপনি যদি <code>protected<\/code> বা <code>internal<\/code> ব্যবহার করেন, তাহলেও কিন্তু বাইরের যে কেউ সরাসরি ডেটা অ্যাক্সেস করতে পারছে না, বরং একটি নির্দিষ্ট বাউন্ডারির মধ্যে ডেটা আবদ্ধ থাকছে (যেমন- <code>protected<\/code> দিলে শুধু চাইল্ড ক্লাস অ্যাক্সেস পায়)। তাই <code>private<\/code> ছাড়াও এনক্যাপসুলেশন সম্ভব, তবে <code>private<\/code> হলো ডেটা হাইডিংয়ের সবচেয়ে কড়া (strict) এবং সাধারণ উপায়।<\/p>\n<p><strong>প্রশ্ন: C# এ Properties কী?<\/strong><br>উত্তর: প্রোপার্টি হলো বিশেষ ধরনের মেথড (<code>get<\/code> এবং <code>set<\/code>)। এগুলো ব্যবহার করে আমরা প্রাইভেট ভ্যারিয়েবলের মান পড়তে বা পরিবর্তন করতে পারি, এবং মান পরিবর্তন করার সময় চাইলে এক্সট্রা ভ্যালিডেশন (যেমন- ব্যালেন্স নেগেটিভ হওয়া যাবে না) যুক্ত করতে পারি।<\/p>","pillars/encapsulation/EncapsulationExample.cs":"<div class=\"code\"><div class=\"code-bar\"><span>EncapsulationExample.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> OOP.Encapsulation\n{\n    <span class=\"hljs-comment\">// The class encapsulates the data (balance) and methods that operate on it.<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> BankAccount\n    {\n        <span class=\"hljs-comment\">// Private field - data is hidden from outside the class<\/span>\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">decimal<\/span> _balance;\n\n        <span class=\"hljs-comment\">// Constructor<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">BankAccount<\/span>(<span class=\"hljs-built_in\">decimal<\/span> initialBalance)\n        {\n            _balance = initialBalance;\n        }\n\n        <span class=\"hljs-comment\">// Public Property - provides controlled access to the private field<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> Balance\n        {\n            <span class=\"hljs-keyword\">get<\/span> { <span class=\"hljs-keyword\">return<\/span> _balance; } <span class=\"hljs-comment\">// Read-only from outside (if no set is provided)<\/span>\n            <span class=\"hljs-comment\">// We omit the 'set' to prevent direct modification of balance.<\/span>\n        }\n\n        <span class=\"hljs-comment\">// Public method to deposit money safely<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Deposit<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            <span class=\"hljs-keyword\">if<\/span> (amount &lt;= <span class=\"hljs-number\">0<\/span>)\n            {\n                Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Deposit amount must be positive.\"<\/span>);\n                <span class=\"hljs-keyword\">return<\/span>;\n            }\n            \n            _balance += amount;\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Deposited {amount:C}. New balance is {_balance:C}.\"<\/span>);\n        }\n\n        <span class=\"hljs-comment\">// Public method to withdraw money safely<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Withdraw<\/span>(<span class=\"hljs-built_in\">decimal<\/span> amount)\n        {\n            <span class=\"hljs-keyword\">if<\/span> (amount &lt;= <span class=\"hljs-number\">0<\/span>)\n            {\n                Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Withdrawal amount must be positive.\"<\/span>);\n                <span class=\"hljs-keyword\">return<\/span>;\n            }\n\n            <span class=\"hljs-keyword\">if<\/span> (amount &gt; _balance)\n            {\n                Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Insufficient funds!\"<\/span>);\n                <span class=\"hljs-keyword\">return<\/span>;\n            }\n\n            _balance -= amount;\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Withdrew {amount:C}. New balance is {_balance:C}.\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-keyword\">class<\/span> Program\n    {\n        <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>()\n        {\n            <span class=\"hljs-comment\">// Create a new bank account with initial balance<\/span>\n            BankAccount account = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">BankAccount<\/span>(<span class=\"hljs-number\">1000m<\/span>);\n\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Initial Balance: {account.Balance:C}\"<\/span>);\n\n            <span class=\"hljs-comment\">// We cannot do this: account._balance = 50000; (Error: _balance is inaccessible due to its protection level)<\/span>\n            <span class=\"hljs-comment\">// We cannot do this either: account.Balance = 50000; (Error: Property cannot be assigned to -- it is read only)<\/span>\n\n            <span class=\"hljs-comment\">// We MUST interact through the provided public methods<\/span>\n            account.<span class=\"hljs-title function_\">Deposit<\/span>(<span class=\"hljs-number\">500m<\/span>);\n            account.<span class=\"hljs-title function_\">Withdraw<\/span>(<span class=\"hljs-number\">200m<\/span>);\n            account.<span class=\"hljs-title function_\">Withdraw<\/span>(<span class=\"hljs-number\">2000m<\/span>); <span class=\"hljs-comment\">// This will show an error message<\/span>\n        }\n    }\n}<\/code><\/pre><\/div>","pillars/encapsulation/Encapsulation_QA.md":"<h1>এনক্যাপসুলেশন (Encapsulation) — প্রশ্নোত্তর<\/h1>\n<h2>প্রশ্ন<\/h2>\n<p>এনক্যাপসুলেশন বুঝতেছি না। কতরকম এনক্যাপসুলেশন আছে? খাঁটি বাংলায় বুঝিয়ে দাও।<\/p>\n<h2>উত্তর<\/h2>\n<p>এনক্যাপসুলেশন নিয়ে কনফিউশনটা খুব কমন, চলুন একদম শুরু থেকে সহজ বাংলায় বুঝি।<\/p>\n<h3>এনক্যাপসুলেশন আসলে কী?<\/h3>\n<p>এনক্যাপসুলেশনের মূল কথা হলো — <strong>ডেটা আর সেই ডেটা নিয়ে কাজ করা লজিককে একসাথে একটা \"বেষ্টনী\" বা boundary-র ভেতর আটকে রাখা, এবং বাইরের জগত থেকে সেটাকে যতটা সম্ভব আড়াল বা সুরক্ষিত রাখা।<\/strong><\/p>\n<p>এখন প্রশ্ন হলো, প্রোগ্রামিংয়ে এই \"বেষ্টনী\" বানানো যায় কয়েকভাবে। সেই অনুযায়ী এনক্যাপসুলেশনকে কয়েকটা লেভেলে ভাগ করা যায়।<\/p>\n<h3>১. Functional / Procedural Encapsulation<\/h3>\n<p>এটা সবচেয়ে বেসিক লেভেল। একটা ফাংশনের ভেতরে আপনি যা কিছু লজিক আর লোকাল ভ্যারিয়েবল লেখেন, সেগুলো ওই ফাংশনের বাইরে থেকে কেউ দেখতে বা টাচ করতে পারে না। ফাংশনটাকে শুধু কল করা যায়, ভেতরে কী হচ্ছে সেটা গোপন থাকে। এটাকে বলা হয় <strong>local scope এর মাধ্যমে এনক্যাপসুলেশন<\/strong>।<\/p>\n<p><strong>উদাহরণ:<\/strong> একটা ফাংশনের ভেতরে যদি আপনি কোনো টেম্পোরারি ভ্যারিয়েবল ব্যবহার করেন, সেটা ফাংশনের বাইরে অস্তিত্বই থাকে না। এটাই একধরনের প্রোটেকশন বা এনক্যাপসুলেশন।<\/p>\n<h3>২. Class-level Encapsulation (Structural)<\/h3>\n<p>এটা হলো OOP-এর সবচেয়ে বেসিক রূপ। একটা ক্লাসের ভেতরে ভ্যারিয়েবল (attributes/fields) আর মেথডগুলোকে একসাথে গুছিয়ে রাখা হয়। মানে ডেটা আর সেই ডেটার উপর কাজ করা ফাংশনগুলো একই ইউনিটে (ক্লাসে) বান্ডিল করে রাখা।<\/p>\n<p>এই লেভেলে অ্যাক্সেস মডিফায়ার (public/private) না থাকলেও, শুধু ক্লাসের ভেতরে সব জিনিস গুছিয়ে রাখাটাই এনক্যাপসুলেশনের একটা রূপ হিসেবে গণ্য হয় — কারণ এটা related data আর behavior-কে এক জায়গায় \"প্যাক\" করে।<\/p>\n<h3>৩. Access-Control Encapsulation (সবচেয়ে পরিচিত রূপ)<\/h3>\n<p>এটাই সাধারণত বইতে সবচেয়ে বেশি শেখানো হয়, তাই মাথায় এটাই প্রথমে আসে। এখানে:<\/p>\n<ul><li>ভ্যারিয়েবলগুলোকে <strong>private<\/strong> করে রাখা হয়, যাতে ক্লাসের বাইরে থেকে সরাসরি অ্যাক্সেস করা না যায়।<\/li><li>ওই ভ্যারিয়েবলে অ্যাক্সেস দেওয়ার জন্য <strong>getter/setter<\/strong> মেথড বানানো হয়, যাতে কন্ট্রোলড উপায়ে ডেটা পড়া বা বদলানো যায়।<\/li><\/ul>\n<p>এটাকে বলা যায় <strong>information hiding সহ এনক্যাপসুলেশন<\/strong> — মানে শুধু বান্ডিল করাই না, সাথে সুরক্ষাও দেওয়া।<\/p>\n<h3>৪. Module/Namespace-level Encapsulation<\/h3>\n<p>বড় প্রোগ্রামে একটা মডিউল বা নেমস্পেসের ভেতরে অনেক ক্লাস, ফাংশন, ভ্যারিয়েবল একসাথে রাখা হয়, আর বাইরের মডিউল থেকে শুধু নির্দিষ্ট কিছু জিনিস export/expose করা হয় (বাকিটা internal থেকে যায়)। এটাও এনক্যাপসুলেশনের একটা বড় পরিসরের রূপ।<\/p>\n<h3>সারকথা<\/h3>\n<p>এনক্যাপসুলেশনের ডিগ্রি ভিন্ন হতে পারে — কোথাও শুধু \"একসাথে বান্ডিল করা\" (weak encapsulation), আর কোথাও \"বান্ডিল করে সাথে সুরক্ষাও দেওয়া\" (strong encapsulation, private + getter/setter)। কিন্তু মূল কনসেপ্ট সবসময় একই: <strong>ডেটা আর লজিককে একসাথে রেখে, বাইরের জগত থেকে যতটা সম্ভব আলাদা/সুরক্ষিত করা।<\/strong><\/p>\n<hr>\n<h2>পরিশিষ্ট: আগের কোডের প্রসঙ্গে<\/h2>\n<p>আগের প্রশ্নের কোডে (<code>class X<\/code> এবং <code>class Y : X<\/code> সংক্রান্ত) যেটা ছিল, সেটা <strong>লেভেল ২<\/strong> এর এনক্যাপসুলেশন — শুধু ক্লাসের ভেতর কনস্ট্রাক্টর গুছিয়ে রাখা হয়েছিল, কোনো private/getter-setter ছিল না। তাই সেটা \"full-fledged\" এনক্যাপসুলেশন না হলেও, বেসিক আইডিয়া অনুযায়ী এনক্যাপসুলেশনের মধ্যেই পড়ে।<\/p>\n<p>সেই কোডে <strong>Inheritance<\/strong> ছিল (<code>class Y : X<\/code>), <strong>Encapsulation<\/strong> ছিল (ক্লাসের ভেতর কোড বান্ডিল করা), কিন্তু <strong>Polymorphism<\/strong> ছিল না (কোনো method overriding/overloading ব্যবহার হয়নি)।<\/p>\n<hr>\n<h2>কোড উদাহরণ<\/h2>\n<p>নিচের কোডটি লক্ষ্য করুন:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">class<\/span> X \n{\n    <span class=\"hljs-comment\">// X ক্লাসের একমাত্র কনস্ট্রাক্টর<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">X<\/span>() \n    {\n        Console.<span class=\"hljs-title function_\">Write<\/span>(<span class=\"hljs-string\">\"Constructor of X, \"<\/span>);\n    }\n}\n\n<span class=\"hljs-keyword\">class<\/span> Y : X \n{\n    <span class=\"hljs-comment\">// Y ক্লাসের একমাত্র কনস্ট্রাক্টর (যা X-কে ইনহেরিট করছে)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Y<\/span>() \n    {\n        Console.<span class=\"hljs-title function_\">Write<\/span>(<span class=\"hljs-string\">\"Constructor of Y, \"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>এই কোডটি কিভাবে এনক্যাপসুলেশন মেনে চলছে?<\/strong><\/p>\n<p>এই কোডটি এনক্যাপসুলেশনের <strong>লেভেল ২ (Class-level Encapsulation)<\/strong> অনুসরণ করছে। এখানে যদিও কোনো ডেটা হাইডিং (private ভ্যারিয়েবল বা getter/setter) নেই, তবুও <code>X<\/code> এবং <code>Y<\/code> ক্লাসগুলো তাদের নিজস্ব লজিক ও বিহেভিয়ার (constructor) নিজেদের ভেতরেই আবদ্ধ করে রেখেছে।<\/p>\n<ul><li><code>X<\/code> ক্লাসের কনস্ট্রাক্টর লজিক <code>X<\/code> এর ভেতরেই এনক্যাপসুলেটেড।<\/li><li><code>Y<\/code> ক্লাসের কনস্ট্রাক্টর লজিক <code>Y<\/code> এর ভেতরেই এনক্যাপসুলেটেড।<\/li><\/ul>\n<p>অর্থাৎ, কোডের ফাংশনালিটিগুলো ক্লাস নামের একটি সুনির্দিষ্ট বাউন্ডারি বা বেষ্টনীর মধ্যে প্যাক করা হয়েছে। তাই strict ডেটা হাইডিং বা access control না থাকলেও, structural বা গাঠনিক দিক থেকে এই কোডে এনক্যাপসুলেশন বিদ্যমান।<\/p>","pillars/abstraction/README.md":"<h1>Pillar 2: Abstraction (অ্যাবস্ট্রাকশন)<\/h1>\n<h2>অ্যাবস্ট্রাকশন কী?<\/h2>\n<p>অ্যাবস্ট্রাকশন হলো একটি ক্লাসের জটিল ইমপ্লিমেন্টেশন বা ভেতরের কাজগুলো লুকিয়ে রেখে শুধুমাত্র প্রয়োজনীয় ফিচারগুলো ইউজারকে দেখানো। এর মাধ্যমে একটি অবজেক্ট \"কী করে\" (What it does) তার ওপর জোর দেওয়া হয়, \"কীভাবে করে\" (How it does) তার ওপর নয়।<\/p>\n<p>যেমন: আপনি যখন গাড়ি চালান, তখন আপনি শুধু জানেন কীভাবে স্টিয়ারিং ঘুরাতে হয় বা ব্রেক চাপতে হয়। ব্রেক চাপলে ইঞ্জিনের ভেতরে কী কী মেকানিকাল কাজ হচ্ছে তা আপনার জানার প্রয়োজন নেই। এটিই হলো অ্যাবস্ট্রাকশন।<\/p>\n<p>C# এ অ্যাবস্ট্রাকশন অর্জন করা যায় দুটি উপায়ে:<\/p>\n<ol><li><strong>Abstract Classes (অ্যাবস্ট্রাক্ট ক্লাস)<\/strong>: এই ধরনের ক্লাসের কোনো অবজেক্ট সরাসরি তৈরি করা যায় না। এর ভেতরে অ্যাবস্ট্রাক্ট মেথড (যার কোনো বডি থাকে না) থাকতে পারে, যা চাইল্ড ক্লাসকে অবশ্যই ইমপ্লিমেন্ট করতে হয়।<\/li><li><strong>Interfaces (ইন্টারফেস)<\/strong>: এটি পুরোপুরি একটি ব্লুপ্রিন্ট। এর ভেতরে শুধুমাত্র মেথড বা প্রোপার্টির সিগনেচার থাকে। যে ক্লাস এই ইন্টারফেস ইমপ্লিমেন্ট করবে, তাকে এর ভেতরের সব মেথড তৈরি করতে হবে।<\/li><\/ol>\n<h2>কেন এটি দরকার?<\/h2>\n<ul><li><strong>জটিলতা কমানো<\/strong>: ভেতরের জটিল কোড লুকিয়ে রাখার ফলে সিস্টেম বোঝা ও ব্যবহার করা সহজ হয়।<\/li><li><strong>কোড রিইউজেবিলিটি<\/strong>: একটি টেমপ্লেট (ইন্টারফেস বা অ্যাবস্ট্রাক্ট ক্লাস) তৈরি করে বিভিন্ন ক্লাসে তা ব্যবহার করা যায়।<\/li><li><strong>মেইনটেইনিবিলিটি<\/strong>: ভেতরের লজিক পরিবর্তন করলেও বাইরের যেসব ক্লাস اسے ব্যবহার করছে, তাদের কোনো ক্ষতি হয় না।<\/li><\/ul>\n<h2>উদাহরণ<\/h2>\n<p><code>AbstractionExample.cs<\/code> ফাইলে দেখুন, আমরা একটি অ্যাবস্ট্রাক্ট <code>Shape<\/code> ক্লাস তৈরি করেছি। শেপ (Shape) এর ক্ষেত্রফল (Area) কীভাবে বের করতে হবে তা <code>Shape<\/code> ক্লাসে বলা নেই। সেটি <code>Circle<\/code> এবং <code>Rectangle<\/code> ক্লাস নিজেদের মতো করে হিসাব করে নিয়েছে।<\/p>\n<hr>\n<h2>FAQ (সাধারণ জিজ্ঞাসা)<\/h2>\n<p><strong>প্রশ্ন: অ্যাবস্ট্রাক্ট ক্লাসের কি অবজেক্ট তৈরি করা যায়?<\/strong><br>উত্তর: না, <code>new<\/code> কিওয়ার্ড ব্যবহার করে অ্যাবস্ট্রাক্ট ক্লাসের সরাসরি কোনো অবজেক্ট তৈরি করা যায় না। একে ইনহেরিট করে চাইল্ড ক্লাসের অবজেক্ট তৈরি করতে হয়।<\/p>\n<p><strong>প্রশ্ন: Interface এবং Abstract Class এর মধ্যে মূল পার্থক্য কী?<\/strong><br>উত্তর:<\/p>\n<ul><li>একটি ক্লাস একসাথে একাধিক ইন্টারফেস ইমপ্লিমেন্ট করতে পারে, কিন্তু ক্লাস ইনহেরিট করতে পারে মাত্র একটি (অ্যাবস্ট্রাক্ট ক্লাস)।<\/li><li>অ্যাবস্ট্রাক্ট ক্লাসের ভেতরে সাধারণ মেথড (যাদের বডি আছে) এবং অ্যাবস্ট্রাক্ট মেথড উভয়ই থাকতে পারে। কিন্তু ইন্টারফেসের ভেতরে (C# 8.0 এর আগে) শুধুমাত্র সিগনেচার থাকে।<\/li><li>যখন কয়েকটি ক্লাসের মধ্যে কোর বা মূল সম্পর্ক থাকে তখন অ্যাবস্ট্রাক্ট ক্লাস ব্যবহার হয়, আর সম্পর্কহীন ক্লাসের মধ্যে একই রকম আচরণ নিশ্চিত করতে ইন্টারফেস ব্যবহার হয়।<\/li><\/ul>\n<p><strong>প্রশ্ন: অ্যাবস্ট্রাক্ট মেথডের কি কোনো বডি থাকতে পারে?<\/strong><br>উত্তর: না, অ্যাবস্ট্রাক্ট মেথডের কোনো বডি থাকে না। ইনহেরিট করা চাইল্ড ক্লাসকে অবশ্যই মেথড ওভাররাইড করে এর বডি দিতে হয়।<\/p>","pillars/abstraction/AbstractionExample.cs":"<div class=\"code\"><div class=\"code-bar\"><span>AbstractionExample.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> OOP.Abstraction\n{\n    <span class=\"hljs-comment\">// Abstract Class - cannot be instantiated<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">abstract<\/span> <span class=\"hljs-keyword\">class<\/span> Shape\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> Color { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Shape<\/span>(<span class=\"hljs-built_in\">string<\/span> color)\n        {\n            Color = color;\n        }\n\n        <span class=\"hljs-comment\">// Abstract method - no implementation here, must be overridden<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">abstract<\/span> <span class=\"hljs-built_in\">double<\/span> <span class=\"hljs-title function_\">CalculateArea<\/span>();\n\n        <span class=\"hljs-comment\">// Non-abstract method - has implementation<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">DisplayColor<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"The shape color is {Color}.\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// Concrete Class - inherits from Shape and provides implementation<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Circle : Shape\n    {\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">double<\/span> _radius;\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Circle<\/span>(<span class=\"hljs-built_in\">string<\/span> color, <span class=\"hljs-built_in\">double<\/span> radius) : <span class=\"hljs-keyword\">base<\/span>(color)\n        {\n            _radius = radius;\n        }\n\n        <span class=\"hljs-comment\">// Overriding the abstract method<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-built_in\">double<\/span> <span class=\"hljs-title function_\">CalculateArea<\/span>()\n        {\n            <span class=\"hljs-keyword\">return<\/span> Math.PI * _radius * _radius;\n        }\n    }\n\n    <span class=\"hljs-comment\">// Concrete Class<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Rectangle : Shape\n    {\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">double<\/span> _width;\n        <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">double<\/span> _height;\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Rectangle<\/span>(<span class=\"hljs-built_in\">string<\/span> color, <span class=\"hljs-built_in\">double<\/span> width, <span class=\"hljs-built_in\">double<\/span> height) : <span class=\"hljs-keyword\">base<\/span>(color)\n        {\n            _width = width;\n            _height = height;\n        }\n\n        <span class=\"hljs-comment\">// Overriding the abstract method<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-built_in\">double<\/span> <span class=\"hljs-title function_\">CalculateArea<\/span>()\n        {\n            <span class=\"hljs-keyword\">return<\/span> _width * _height;\n        }\n    }\n\n    <span class=\"hljs-keyword\">class<\/span> Program\n    {\n        <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>()\n        {\n            <span class=\"hljs-comment\">// Shape myShape = new Shape(\"Red\"); // Error: Cannot create an instance of the abstract type 'Shape'<\/span>\n\n            <span class=\"hljs-comment\">// We interact with the abstract concept of a 'Shape'<\/span>\n            Shape myCircle = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Circle<\/span>(<span class=\"hljs-string\">\"Red\"<\/span>, <span class=\"hljs-number\">5.0<\/span>);\n            Shape myRectangle = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Rectangle<\/span>(<span class=\"hljs-string\">\"Blue\"<\/span>, <span class=\"hljs-number\">4.0<\/span>, <span class=\"hljs-number\">6.0<\/span>);\n\n            myCircle.<span class=\"hljs-title function_\">DisplayColor<\/span>();\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Circle Area: {myCircle.CalculateArea():F2}\"<\/span>);\n\n            myRectangle.<span class=\"hljs-title function_\">DisplayColor<\/span>();\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Rectangle Area: {myRectangle.CalculateArea():F2}\"<\/span>);\n        }\n    }\n}<\/code><\/pre><\/div>","pillars/inheritance/README.md":"<h1>Pillar 3: Inheritance (ইনহেরিটেন্স)<\/h1>\n<h2>ইনহেরিটেন্স কী?<\/h2>\n<p>ইনহেরিটেন্স হলো এমন একটি মেকানিজম যার মাধ্যমে একটি নতুন ক্লাস (Derived Class বা Child Class) অন্য একটি বিদ্যমান ক্লাসের (Base Class বা Parent Class) প্রোপার্টি এবং মেথডগুলো অর্জন করতে পারে। এটি মূলত \"IS-A\" সম্পর্ক তৈরি করে (যেমন- Dog is an Animal)।<\/p>\n<p>C# এ একটি ক্লাস অন্য ক্লাসকে ইনহেরিট করার জন্য কোলন (<code>:<\/code>) চিহ্ন ব্যবহার করা হয়।<\/p>\n<h2>কেন এটি দরকার?<\/h2>\n<ul><li><strong>কোড রিইউজেবিলিটি (Code Reusability)<\/strong>: একই কোড বারবার লিখতে হয় না। প্যারেন্ট ক্লাসে একবার মেথড লিখে দিলে সব চাইল্ড ক্লাস তা ব্যবহার করতে পারে।<\/li><li><strong>মেথড ওভাররাইডিং (Method Overriding)<\/strong>: রান-টাইম পলিমরফিজম অর্জন করতে হলে ইনহেরিটেন্স আবশ্যক।<\/li><li><strong>লজিক্যাল স্ট্রাকচার<\/strong>: বিভিন্ন ক্লাসকে সুন্দরভাবে সাজিয়ে একটি হায়ারার্কি (Hierarchy) তৈরি করা সহজ হয়।<\/li><\/ul>\n<h2>উদাহরণ<\/h2>\n<p><code>InheritanceExample.cs<\/code> ফাইলে খেয়াল করুন, <code>Animal<\/code> নামে একটি প্যারেন্ট ক্লাস আছে। <code>Dog<\/code> এবং <code>Cat<\/code> ক্লাস দুটি <code>Animal<\/code> ক্লাসকে ইনহেরিট করেছে, যার ফলে এদের উভয়ের মধ্যেই <code>Name<\/code> এবং <code>Eat()<\/code> মেথড চলে এসেছে, যা আমাদের নতুন করে লিখতে হয়নি।<\/p>\n<hr>\n<h2>FAQ (সাধারণ জিজ্ঞাসা)<\/h2>\n<p><strong>প্রশ্ন: C# এ কি একাধিক ক্লাস থেকে একসাথে ইনহেরিট (Multiple Inheritance) করা যায়?<\/strong><br>উত্তর: না, C# এ একটি ক্লাস একসাথে একাধিক ক্লাস থেকে ইনহেরিট হতে পারে না। তবে একটি ক্লাস চাইলে একসাথে একাধিক ইন্টারফেস (Interface) ইমপ্লিমেন্ট করতে পারে, যা দিয়ে মূলত মাল্টিপল ইনহেরিটেন্সের অভাব পূরণ করা হয়।<\/p>\n<p><strong>প্রশ্ন: <code>base<\/code> কিওয়ার্ড এর কাজ কী?<\/strong><br>উত্তর: চাইল্ড ক্লাসের ভেতর থেকে প্যারেন্ট ক্লাসের কোনো কিছু (যেমন- কনস্ট্রাক্টর, মেথড বা প্রোপার্টি) অ্যাক্সেস করতে <code>base<\/code> কিওয়ার্ড ব্যবহার করা হয়। যেমন <code>base(name)<\/code> লিখে আমরা প্যারেন্ট ক্লাসের কনস্ট্রাক্টরকে কল করেছি।<\/p>\n<p><strong>প্রশ্ন: <code>sealed<\/code> কিওয়ার্ড কী কাজ করে?<\/strong><br>উত্তর: কোনো ক্লাসের আগে <code>sealed<\/code> লিখে দিলে সেই ক্লাসকে আর কেউ ইনহেরিট করতে পারে না। অর্থাৎ, এটি ইনহেরিটেন্স বন্ধ করে দেয়।<\/p>\n<p><strong>প্রশ্ন: চাইল্ড ক্লাস কি প্যারেন্ট ক্লাসের <code>private<\/code> মেম্বার ইনহেরিট করে?<\/strong><br>উত্তর: না, চাইল্ড ক্লাস প্যারেন্ট ক্লাসের <code>private<\/code> মেম্বারগুলোতে সরাসরি অ্যাক্সেস পায় না। তবে প্যারেন্ট ক্লাস যদি ওই প্রাইভেট মেম্বারগুলোকে অ্যাক্সেস করার জন্য কোনো <code>public<\/code> বা <code>protected<\/code> মেথড/প্রোপার্টি দেয়, তখন চাইল্ড ক্লাস সেগুলোর মাধ্যমে তা ব্যবহার করতে পারে।<\/p>","pillars/inheritance/InheritanceExample.cs":"<div class=\"code\"><div class=\"code-bar\"><span>InheritanceExample.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> OOP.Inheritance\n{\n    <span class=\"hljs-comment\">// Base Class (Parent Class)<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Animal\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> Name { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Animal<\/span>(<span class=\"hljs-built_in\">string<\/span> name)\n        {\n            Name = name;\n        }\n\n        <span class=\"hljs-comment\">// Virtual method allows derived classes to override it<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">virtual<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Speak<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"{Name} makes a generic animal sound.\"<\/span>);\n        }\n\n        <span class=\"hljs-comment\">// Standard method inherited by all derived classes<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Eat<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"{Name} is eating.\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// Derived Class (Child Class) inheriting from Animal<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Dog : Animal\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> Breed { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n\n        <span class=\"hljs-comment\">// Using 'base' to call the constructor of the parent class<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Dog<\/span>(<span class=\"hljs-built_in\">string<\/span> name, <span class=\"hljs-built_in\">string<\/span> breed) : <span class=\"hljs-keyword\">base<\/span>(name)\n        {\n            Breed = breed;\n        }\n\n        <span class=\"hljs-comment\">// Overriding the virtual method from the parent class<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Speak<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"{Name} the {Breed} barks: Woof! Woof!\"<\/span>);\n        }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Fetch<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"{Name} is fetching the ball.\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-comment\">// Another Derived Class<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Cat : Animal\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Cat<\/span>(<span class=\"hljs-built_in\">string<\/span> name) : <span class=\"hljs-keyword\">base<\/span>(name)\n        {\n        }\n\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Speak<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"{Name} meows: Meow~\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-keyword\">class<\/span> Program\n    {\n        <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>()\n        {\n            <span class=\"hljs-comment\">// Creating an object of the derived class 'Dog'<\/span>\n            Dog myDog = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Dog<\/span>(<span class=\"hljs-string\">\"Buddy\"<\/span>, <span class=\"hljs-string\">\"Golden Retriever\"<\/span>);\n            \n            <span class=\"hljs-comment\">// Inherited property<\/span>\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"My dog's name is {myDog.Name}.\"<\/span>);\n            \n            <span class=\"hljs-comment\">// Inherited method<\/span>\n            myDog.<span class=\"hljs-title function_\">Eat<\/span>();\n\n            <span class=\"hljs-comment\">// Overridden method specific to Dog<\/span>\n            myDog.<span class=\"hljs-title function_\">Speak<\/span>();\n\n            <span class=\"hljs-comment\">// Method specific to Dog only<\/span>\n            myDog.<span class=\"hljs-title function_\">Fetch<\/span>();\n\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"-------------------\"<\/span>);\n\n            Cat myCat = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Cat<\/span>(<span class=\"hljs-string\">\"Whiskers\"<\/span>);\n            myCat.<span class=\"hljs-title function_\">Eat<\/span>();\n            myCat.<span class=\"hljs-title function_\">Speak<\/span>();\n        }\n    }\n}<\/code><\/pre><\/div>","pillars/polymorphism/README.md":"<h1>Pillar 4: Polymorphism (পলিমরফিজম)<\/h1>\n<h2>পলিমরফিজম কী?<\/h2>\n<p>গ্রিক শব্দ পলিমরফিজম (Polymorphism) এর অর্থ হলো \"বহুরূপতা\" (Many forms)। অবজেক্ট-অরিয়েন্টেড প্রোগ্রামিংয়ে এর মানে হলো, একই মেথড বা ফাংশন ভিন্ন ভিন্ন ক্লাসে ভিন্ন ভিন্ন ভাবে কাজ করতে পারে।<\/p>\n<p>C# এ পলিমরফিজম প্রধানত দুই প্রকার:<\/p>\n<ol><li><strong>Compile-time Polymorphism (Static Binding / Early Binding)<\/strong>: <ul><li>এটি <strong>Method Overloading<\/strong> এর মাধ্যমে অর্জন করা হয়।<\/li><li>একই ক্লাসের মধ্যে একই নামের একাধিক মেথড থাকতে পারে, তবে তাদের প্যারামিটার (টাইপ বা সংখ্যা) আলাদা হতে হবে।<\/li><\/ul><\/li><li><strong>Run-time Polymorphism (Dynamic Binding / Late Binding)<\/strong>:<ul><li>এটি <strong>Method Overriding<\/strong> এর মাধ্যমে অর্জন করা হয়।<\/li><li>এক্ষেত্রে প্যারেন্ট ক্লাস এবং চাইল্ড ক্লাসে একই নামের এবং একই প্যারামিটারের মেথড থাকে। চাইল্ড ক্লাস তার প্যারেন্ট ক্লাসের মেথডকে নিজের মতো করে মডিফাই (override) করে নেয়। এর জন্য প্যারেন্ট ক্লাসে <code>virtual<\/code> এবং চাইল্ড ক্লাসে <code>override<\/code> কিওয়ার্ড ব্যবহার করতে হয়।<\/li><\/ul><\/li><\/ol>\n<h2>কেন এটি দরকার?<\/h2>\n<ul><li><strong>ফ্লেক্সিবিলিটি<\/strong>: আপনি চাইলে একটি জেনেরিক লিস্টে সব চাইল্ড ক্লাসের অবজেক্ট রেখে একই মেথড কল করতে পারেন, এবং প্রতিটি অবজেক্ট তার নিজস্ব নিয়মে কাজ করবে।<\/li><li><strong>সহজ ব্যবহার<\/strong>: একই কাজের জন্য ভিন্ন ভিন্ন নাম (যেমন- <code>AddInts()<\/code>, <code>AddDoubles()<\/code>) মনে রাখার দরকার নেই। একই নাম (<code>Add()<\/code>) দিয়ে ভিন্ন টাইপের কাজ করা যায়।<\/li><li><strong>এক্সটেনসিবিলিটি<\/strong>: বিদ্যমান কোড নষ্ট না করেই খুব সহজে নতুন ক্লাস যুক্ত করা যায়।<\/li><\/ul>\n<h2>উদাহরণ<\/h2>\n<p><code>PolymorphismExample.cs<\/code> ফাইলে মেথড ওভারলোডিং (একই <code>Add<\/code> মেথড ভিন্ন প্যারামিটারে) এবং মেথড ওভাররাইডিং (একই <code>Move<\/code> মেথড ভিন্ন পশু/পাখির ক্ষেত্রে ভিন্ন আউটপুট দিচ্ছে) এর সুন্দর উদাহরণ দেওয়া আছে।<\/p>\n<hr>\n<h2>FAQ (সাধারণ জিজ্ঞাসা)<\/h2>\n<p><strong>প্রশ্ন: মেথড ওভারলোডিং (Method Overloading) কী?<\/strong><br>উত্তর: যখন একটি ক্লাসে একই নামের একাধিক মেথড থাকে কিন্তু তাদের প্যারামিটার লিস্ট (সংখ্যা, টাইপ বা ক্রম) ভিন্ন হয়, তখন তাকে মেথড ওভারলোডিং বলে। মনে রাখবেন, শুধু রিটার্ন টাইপ পরিবর্তন করে ওভারলোডিং করা যায় না।<\/p>\n<p><strong>প্রশ্ন: মেথড ওভাররাইডিং (Method Overriding) কী?<\/strong><br>উত্তর: যখন ইনহেরিট করা কোনো চাইল্ড ক্লাস তার প্যারেন্ট ক্লাসের কোনো মেথডকে নিজের প্রয়োজনমতো নতুন করে ডিফাইন করে, তখন তাকে মেথড ওভাররাইডিং বলে। এক্ষেত্রে দুটি মেথডের সিগনেচার (নাম ও প্যারামিটার) হুবহু এক হতে হয়।<\/p>\n<p><strong>প্রশ্ন: আমরা কি সাধারণ (non-virtual) মেথড ওভাররাইড করতে পারি?<\/strong><br>উত্তর: না। C# এ ওভাররাইড করতে হলে প্যারেন্ট ক্লাসের মেথডটির আগে অবশ্যই <code>virtual<\/code> অথবা <code>abstract<\/code> লেখা থাকতে হবে।<\/p>\n<p><strong>প্রশ্ন: মেথড হাইডিংয়ে <code>new<\/code> কিওয়ার্ডের কাজ কী?<\/strong><br>উত্তর: যদি প্যারেন্ট ক্লাসে কোনো <code>virtual<\/code> মেথড না থাকে, কিন্তু চাইল্ড ক্লাসে আপনি একই নামের একটি মেথড তৈরি করতে চান, তখন <code>new<\/code> কিওয়ার্ড ব্যবহার করে প্যারেন্ট ক্লাসের মেথডটিকে \"হাইড\" (hide) করা যায়। এটি ওভাররাইডিং থেকে ভিন্ন।<\/p>","pillars/polymorphism/PolymorphismExample.cs":"<div class=\"code\"><div class=\"code-bar\"><span>PolymorphismExample.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-keyword\">namespace<\/span> OOP.Polymorphism\n{\n    <span class=\"hljs-comment\">// --- 1. COMPILE-TIME POLYMORPHISM (Method Overloading) ---<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> MathOperations\n    {\n        <span class=\"hljs-comment\">// Add two integers<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">int<\/span> <span class=\"hljs-title function_\">Add<\/span>(<span class=\"hljs-built_in\">int<\/span> a, <span class=\"hljs-built_in\">int<\/span> b)\n        {\n            <span class=\"hljs-keyword\">return<\/span> a + b;\n        }\n\n        <span class=\"hljs-comment\">// Add three integers (Overloaded by number of parameters)<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">int<\/span> <span class=\"hljs-title function_\">Add<\/span>(<span class=\"hljs-built_in\">int<\/span> a, <span class=\"hljs-built_in\">int<\/span> b, <span class=\"hljs-built_in\">int<\/span> c)\n        {\n            <span class=\"hljs-keyword\">return<\/span> a + b + c;\n        }\n\n        <span class=\"hljs-comment\">// Add two doubles (Overloaded by parameter type)<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">double<\/span> <span class=\"hljs-title function_\">Add<\/span>(<span class=\"hljs-built_in\">double<\/span> a, <span class=\"hljs-built_in\">double<\/span> b)\n        {\n            <span class=\"hljs-keyword\">return<\/span> a + b;\n        }\n    }\n\n    <span class=\"hljs-comment\">// --- 2. RUN-TIME POLYMORPHISM (Method Overriding) ---<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Animal\n    {\n        <span class=\"hljs-comment\">// Virtual method allows it to be overridden in derived classes<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">virtual<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Move<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"The animal moves.\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Bird : Animal\n    {\n        <span class=\"hljs-comment\">// Overriding the base class method<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Move<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"The bird flies in the sky.\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Fish : Animal\n    {\n        <span class=\"hljs-comment\">// Overriding the base class method<\/span>\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Move<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"The fish swims in the water.\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-keyword\">class<\/span> Program\n    {\n        <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>()\n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"--- Compile-time Polymorphism (Overloading) ---\"<\/span>);\n            MathOperations math = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">MathOperations<\/span>();\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"2 + 3 = {math.Add(2, 3)}\"<\/span>);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"2 + 3 + 4 = {math.Add(2, 3, 4)}\"<\/span>);\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"2.5 + 3.2 = {math.Add(2.5, 3.2)}\"<\/span>);\n\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"\\n--- Run-time Polymorphism (Overriding) ---\"<\/span>);\n            \n            <span class=\"hljs-comment\">// Polymorphism in action: Reference type is 'Animal', but object type varies<\/span>\n            Animal myAnimal = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Animal<\/span>();\n            Animal myBird = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Bird<\/span>();\n            Animal myFish = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Fish<\/span>();\n\n            <span class=\"hljs-comment\">// The correct 'Move' method is called based on the ACTUAL object type at runtime<\/span>\n            myAnimal.<span class=\"hljs-title function_\">Move<\/span>(); <span class=\"hljs-comment\">// Output: The animal moves.<\/span>\n            myBird.<span class=\"hljs-title function_\">Move<\/span>();   <span class=\"hljs-comment\">// Output: The bird flies in the sky.<\/span>\n            myFish.<span class=\"hljs-title function_\">Move<\/span>();   <span class=\"hljs-comment\">// Output: The fish swims in the water.<\/span>\n        }\n    }\n}<\/code><\/pre><\/div>","pillars/CHEAT_SHEET.md":"<h1>OOP — এক নজরে<\/h1>\n<p>Object-Oriented Programming দাঁড়িয়ে আছে ৪টি পিলারের ওপর। এগুলো আলাদা আলাদা জিনিস না — একটা আরেকটাকে সাহায্য করে। নিচে চারটা এক টেবিলে, তারপর ইন্টারভিউতে সবচেয়ে বেশি জিজ্ঞেস করা তুলনাগুলো।<\/p>\n<hr>\n<h2>৪টি পিলার — এক টেবিলে<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\">পিলার<\/th><th align=\"left\">এক লাইনে<\/th><th align=\"left\">C#-এ কীভাবে<\/th><th align=\"left\">এই গাইডের উদাহরণ<\/th><\/tr><\/thead><tbody><tr><td align=\"left\"><strong>Encapsulation<\/strong><\/td><td align=\"left\">ডেটা লুকিয়ে রাখো, শুধু নিয়ন্ত্রিত মেথড দিয়ে বদলাতে দাও<\/td><td align=\"left\"><code>private<\/code> field + property / মেথড<\/td><td align=\"left\"><code>BankAccount<\/code> — <code>_balance<\/code> শুধু <code>Deposit()<\/code> / <code>Withdraw()<\/code> দিয়ে বদলায়<\/td><\/tr><tr><td align=\"left\"><strong>Abstraction<\/strong><\/td><td align=\"left\"><em>কী করে<\/em> দেখাও, <em>কীভাবে করে<\/em> লুকাও<\/td><td align=\"left\"><code>abstract class<\/code>, <code>interface<\/code><\/td><td align=\"left\"><code>Shape<\/code> শুধু বলে <code>CalculateArea()<\/code> লাগবে; <code>Circle<\/code>, <code>Rectangle<\/code> নিজেরা হিসাব করে<\/td><\/tr><tr><td align=\"left\"><strong>Inheritance<\/strong><\/td><td align=\"left\">Child, Parent-এর প্রোপার্টি ও মেথড পেয়ে যায় (\"IS-A\")<\/td><td align=\"left\"><code>class Dog : Animal<\/code><\/td><td align=\"left\"><code>Dog<\/code> আর <code>Cat<\/code> — দুজনেই <code>Animal<\/code> থেকে <code>Name<\/code> আর <code>Eat()<\/code> পায়<\/td><\/tr><tr><td align=\"left\"><strong>Polymorphism<\/strong><\/td><td align=\"left\">একই নাম, ভিন্ন ভিন্ন আচরণ<\/td><td align=\"left\">Overloading; <code>virtual<\/code> + <code>override<\/code><\/td><td align=\"left\"><code>Add()<\/code> ভিন্ন প্যারামিটারে; <code>Move()<\/code> প্রতিটা প্রাণীর জন্য আলাদা<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>ইন্টারভিউর প্রিয় তুলনাগুলো<\/h2>\n<h3>Encapsulation বনাম Abstraction<\/h3>\n<ul><li><strong>Encapsulation<\/strong> — ভেতরের <strong>ডেটা<\/strong> লুকানো আর অ্যাক্সেস নিয়ন্ত্রণ করা (data hiding)।<\/li><li><strong>Abstraction<\/strong> — ভেতরের <strong>জটিলতা<\/strong> লুকিয়ে শুধু দরকারি ফিচার দেখানো।<\/li><li>Encapsulation হলো Abstraction অর্জনের একটা উপায়।<\/li><\/ul>\n<h3>Abstract class বনাম Interface<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\"><\/th><th align=\"left\">Abstract class<\/th><th align=\"left\">Interface<\/th><\/tr><\/thead><tbody><tr><td align=\"left\">একটা ক্লাস কয়টা নিতে পারে<\/td><td align=\"left\">মাত্র ১টা<\/td><td align=\"left\">একাধিক<\/td><\/tr><tr><td align=\"left\">বডিসহ মেথড<\/td><td align=\"left\">থাকতে পারে<\/td><td align=\"left\">C# 8.0-এর আগে না (এখন default method আছে)<\/td><\/tr><tr><td align=\"left\">কখন<\/td><td align=\"left\">ক্লাসগুলোর মধ্যে মূল সম্পর্ক আছে<\/td><td align=\"left\">সম্পর্কহীন ক্লাসে একই আচরণ চাই<\/td><\/tr><tr><td align=\"left\">সরাসরি <code>new<\/code><\/td><td align=\"left\">যায় না<\/td><td align=\"left\">যায় না<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Overloading বনাম Overriding<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\"><\/th><th align=\"left\">Overloading<\/th><th align=\"left\">Overriding<\/th><\/tr><\/thead><tbody><tr><td align=\"left\">কোথায়<\/td><td align=\"left\">একই ক্লাসে<\/td><td align=\"left\">Parent আর Child-এ<\/td><\/tr><tr><td align=\"left\">সিগনেচার<\/td><td align=\"left\">নাম এক, প্যারামিটার আলাদা<\/td><td align=\"left\">নাম ও প্যারামিটার হুবহু এক<\/td><\/tr><tr><td align=\"left\">কখন ঠিক হয়<\/td><td align=\"left\">Compile-time (static binding)<\/td><td align=\"left\">Run-time (dynamic binding)<\/td><\/tr><tr><td align=\"left\">C# keyword<\/td><td align=\"left\">লাগে না<\/td><td align=\"left\">Parent-এ <code>virtual<\/code>/<code>abstract<\/code>, Child-এ <code>override<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>শুধু return type বদলে overloading হয় না। আর <code>new<\/code> দিয়ে মেথড <strong>hide<\/strong> করা overriding না।<\/p>\n<hr>\n<h2>দ্রুত মনে রাখার নিয়ম<\/h2>\n<ul><li>C#/Java-তে ক্লাস থেকে <strong>multiple inheritance নেই<\/strong> (Diamond Problem এড়াতে) — কিন্তু একাধিক <strong>interface<\/strong> নেওয়া যায়।<\/li><li>Child, Parent-এর <code>private<\/code> মেম্বার সরাসরি পায় না — <code>public<\/code>/<code>protected<\/code> মেথড দিয়ে পায়।<\/li><li><code>base<\/code> দিয়ে Parent-এর constructor/মেথড ডাকা হয়; <code>sealed<\/code> (Java-তে <code>final<\/code>) দিলে আর ইনহেরিট করা যায় না।<\/li><li><strong>Upcasting<\/strong> (Child → Parent) সবসময় সেফ; <strong>Downcasting<\/strong> (Parent → Child) যাচাই করে করতে হয় — <code>is<\/code> / <code>as<\/code> দিয়ে।<\/li><li>ভালো ডিজাইন = <strong>High Cohesion, Loose Coupling<\/strong> — আর Loose Coupling-এর হাতিয়ার Dependency Injection।<\/li><\/ul>\n<hr>\n<h2>Interview Hack 🎯<\/h2>\n<p>ইন্টারভিউতে \"OOP-এর ৪টি পিলার বলুন\" — শুধু definition নয়, <strong>real-world example<\/strong> আর কোড চায়। প্রতিটির জন্য ৩টা করে ready example মনে রাখুন। প্রতিটি কার্ড খুলে tab বদলান, আর Java/C# দুটোই দেখুন।<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\">পিলার<\/th><th align=\"left\">Quick recall (এই ৩টা বলুন)<\/th><th align=\"left\">এক লাইনে<\/th><\/tr><\/thead><tbody><tr><td align=\"left\"><strong>Encapsulation<\/strong><\/td><td align=\"left\">Bank Account, User Password, Payment Card<\/td><td align=\"left\">Data + মেথড একসাথে, ভেতরটা <code>private<\/code><\/td><\/tr><tr><td align=\"left\"><strong>Abstraction<\/strong><\/td><td align=\"left\">Payment Gateway, Notification, Car<\/td><td align=\"left\">'কী' দেখাও, 'কীভাবে' লুকাও<\/td><\/tr><tr><td align=\"left\"><strong>Inheritance<\/strong><\/td><td align=\"left\">Employee, Vehicle, User Roles<\/td><td align=\"left\">Parent-এর কোড Child-এ reuse (is-a)<\/td><\/tr><tr><td align=\"left\"><strong>Polymorphism<\/strong><\/td><td align=\"left\">Payment, Overloading, Notification List<\/td><td align=\"left\">একই মেথড, ভিন্ন আচরণ<\/td><\/tr><\/tbody><\/table><\/div>\n<details class=\"ih\"><summary>Encapsulation — data আর মেথড একসাথে, ভেতরের অংশ লুকানো<\/summary><div class=\"ih-body\"><div class=\"ih-tabs\"><button type=\"button\" class=\"ih-tab active\">Bank Account<\/button><button type=\"button\" class=\"ih-tab\">User Password<\/button><button type=\"button\" class=\"ih-tab\">Payment Card<\/button><\/div><div class=\"ih-pane active\"><p><code>balance<\/code> <code>private<\/code>; বাইরে থেকে শুধু <code>deposit()<\/code>/<code>withdraw()<\/code> দিয়ে বদলানো যায়, তাই ব্যালেন্স কখনো নেগেটিভ হতে পারে না।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: যে কেউ balance যা খুশি করতে পারে<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Account<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">double<\/span> balance;\n}\n<span class=\"hljs-comment\">// acc.balance = -5000;   💥<\/span>\n\n<span class=\"hljs-comment\">// ✅ With: field private, নিয়ম মেথডের ভেতরে<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Account<\/span> {\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">double<\/span> balance;\n\n    <span class=\"hljs-keyword\">void<\/span> deposit(<span class=\"hljs-built_in\">double<\/span> amt) {\n        <span class=\"hljs-keyword\">if<\/span> (amt &lt;= <span class=\"hljs-number\">0<\/span>) <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> IllegalArgumentException(<span class=\"hljs-string\">\"Invalid amount\"<\/span>);\n        balance += amt;\n    }\n    <span class=\"hljs-keyword\">void<\/span> withdraw(<span class=\"hljs-built_in\">double<\/span> amt) {\n        <span class=\"hljs-keyword\">if<\/span> (amt &gt; balance) <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> IllegalStateException(<span class=\"hljs-string\">\"Insufficient funds\"<\/span>);\n        balance -= amt;\n    }\n    <span class=\"hljs-built_in\">double<\/span> getBalance() { <span class=\"hljs-keyword\">return<\/span> balance; }\n}<\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: যে কেউ balance যা খুশি করতে পারে<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Account<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title class_\">Balance<\/span>;\n}\n<span class=\"hljs-comment\">// acc.Balance = -5000;   💥<\/span>\n\n<span class=\"hljs-comment\">// ✅ With: field private, নিয়ম মেথডের ভেতরে<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Account<\/span> {\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">decimal<\/span> _balance;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title class_\">Balance<\/span> =&gt; _balance;      <span class=\"hljs-comment\">// শুধু পড়া যায়<\/span>\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Deposit(<span class=\"hljs-built_in\">decimal<\/span> amt) {\n        <span class=\"hljs-keyword\">if<\/span> (amt &lt;= <span class=\"hljs-number\">0<\/span>) <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> ArgumentException(<span class=\"hljs-string\">\"Invalid amount\"<\/span>);\n        _balance += amt;\n    }\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Withdraw(<span class=\"hljs-built_in\">decimal<\/span> amt) {\n        <span class=\"hljs-keyword\">if<\/span> (amt &gt; _balance) <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> InvalidOperationException(<span class=\"hljs-string\">\"Insufficient funds\"<\/span>);\n        _balance -= amt;\n    }\n}<\/code><\/pre><\/div><\/div><div class=\"ih-pane\"><p>পাসওয়ার্ড কখনো সরাসরি পড়া যায় না; শুধু hash করে রাখা হয় আর <code>verify()<\/code> দিয়ে মেলানো যায়।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: plain password বাইরে খোলা<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">String<\/span> password;\n}\n\n<span class=\"hljs-comment\">// ✅ With: hash লুকানো, শুধু setPassword / verify<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">String<\/span> passwordHash;\n\n    <span class=\"hljs-keyword\">void<\/span> setPassword(<span class=\"hljs-built_in\">String<\/span> raw) {\n        <span class=\"hljs-keyword\">if<\/span> (raw.length() &lt; <span class=\"hljs-number\">8<\/span>) <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> IllegalArgumentException(<span class=\"hljs-string\">\"Too short\"<\/span>);\n        <span class=\"hljs-keyword\">this<\/span>.passwordHash = hash(raw);\n    }\n    <span class=\"hljs-built_in\">boolean<\/span> verify(<span class=\"hljs-built_in\">String<\/span> raw) {\n        <span class=\"hljs-keyword\">return<\/span> passwordHash.equals(hash(raw));\n    }\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">String<\/span> hash(<span class=\"hljs-built_in\">String<\/span> s) { /* <span class=\"hljs-title class_\">BCrypt<\/span> */ <span class=\"hljs-keyword\">return<\/span> s; }\n}<\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: plain password বাইরে খোলা<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title class_\">Password<\/span>;\n}\n\n<span class=\"hljs-comment\">// ✅ With: hash লুকানো, শুধু SetPassword / Verify<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">string<\/span> _passwordHash;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> SetPassword(<span class=\"hljs-built_in\">string<\/span> raw) {\n        <span class=\"hljs-keyword\">if<\/span> (raw.<span class=\"hljs-title class_\">Length<\/span> &lt; <span class=\"hljs-number\">8<\/span>) <span class=\"hljs-keyword\">throw<\/span> <span class=\"hljs-keyword\">new<\/span> ArgumentException(<span class=\"hljs-string\">\"Too short\"<\/span>);\n        _passwordHash = Hash(raw);\n    }\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">bool<\/span> Verify(<span class=\"hljs-built_in\">string<\/span> raw) =&gt; _passwordHash == Hash(raw);\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-built_in\">string<\/span> Hash(<span class=\"hljs-built_in\">string<\/span> s) { /* <span class=\"hljs-title class_\">BCrypt<\/span> */ <span class=\"hljs-keyword\">return<\/span> s; }\n}<\/code><\/pre><\/div><\/div><div class=\"ih-pane\"><p>কার্ড নম্বর আর CVV ভেতরে থাকে; বাইরে শুধু শেষ ৪ ডিজিট (masked) দেখা যায়।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: পুরো card নম্বর + CVV খোলা<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Card<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">String<\/span> number;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">String<\/span> cvv;\n}\n\n<span class=\"hljs-comment\">// ✅ With: ভেতরে সুরক্ষিত, বাইরে masked<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Card<\/span> {\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">final<\/span> <span class=\"hljs-built_in\">String<\/span> number;\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">final<\/span> <span class=\"hljs-built_in\">String<\/span> cvv;\n\n    Card(<span class=\"hljs-built_in\">String<\/span> number, <span class=\"hljs-built_in\">String<\/span> cvv) {\n        <span class=\"hljs-keyword\">this<\/span>.number = number;\n        <span class=\"hljs-keyword\">this<\/span>.cvv = cvv;\n    }\n    <span class=\"hljs-built_in\">String<\/span> getMasked() {\n        <span class=\"hljs-keyword\">return<\/span> <span class=\"hljs-string\">\"**** **** **** \"<\/span> + number.substring(number.length() - <span class=\"hljs-number\">4<\/span>);\n    }\n    <span class=\"hljs-built_in\">boolean<\/span> authorize(<span class=\"hljs-built_in\">String<\/span> enteredCvv) { <span class=\"hljs-keyword\">return<\/span> cvv.equals(enteredCvv); }\n}<\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: পুরো card নম্বর + CVV খোলা<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Card<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title class_\">Number<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title class_\">Cvv<\/span>;\n}\n\n<span class=\"hljs-comment\">// ✅ With: ভেতরে সুরক্ষিত, বাইরে masked<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Card<\/span> {\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> <span class=\"hljs-built_in\">string<\/span> _number;\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> <span class=\"hljs-built_in\">string<\/span> _cvv;\n\n    <span class=\"hljs-keyword\">public<\/span> Card(<span class=\"hljs-built_in\">string<\/span> number, <span class=\"hljs-built_in\">string<\/span> cvv) {\n        _number = number;\n        _cvv = cvv;\n    }\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title class_\">Masked<\/span> =&gt; <span class=\"hljs-string\">\"**** **** **** \"<\/span> + _number[^<span class=\"hljs-number\">4<\/span>..];\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">bool<\/span> Authorize(<span class=\"hljs-built_in\">string<\/span> enteredCvv) =&gt; _cvv == enteredCvv;\n}<\/code><\/pre><\/div><\/div><div class=\"callout tip\"><div class=\"callout-title\">Short note<\/div><p>Encapsulation = <strong>private field + public method/property<\/strong>। সুবিধা: validation এক জায়গায়, ভেতরের কাজ পরে বদলালেও বাইরের কোড ভাঙে না। <em>Getter/setter দিলেই encapsulation হয় না<\/em> — নিয়ম (validation) থাকতে হবে।<\/p><\/div><\/div><\/details><details class=\"ih\"><summary>Abstraction — 'কী করে' দেখাও, 'কীভাবে করে' লুকাও<\/summary><div class=\"ih-body\"><div class=\"ih-tabs\"><button type=\"button\" class=\"ih-tab active\">Payment Gateway<\/button><button type=\"button\" class=\"ih-tab\">Notification<\/button><button type=\"button\" class=\"ih-tab\">Car<\/button><\/div><div class=\"ih-pane active\"><p>ক্লায়েন্ট শুধু <code>pay()<\/code> চেনে; Stripe না bKash, ভেতরে কী হচ্ছে তা জানার দরকার নেই।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div clas
