া তো Dog এর স্ট্রাকচার [ Eat() | Bark() ] না, \n           এটা তো Cat এর স্ট্রাকচার [ Eat() | Meow() ]!\n        ৫. একটি ভাই (Cat) কে আরেক ভাই (Dog) এ রূপান্তর করা সম্ভব নয় কারণ তাদের নিজস্ব মেথড আলাদা। \n           তাই এটি InvalidCastException থ্রো করবে।\n        */<\/span>\n    }\n}<\/code><\/pre><\/div>","inheritance-deep/diamond-problem/DiamondProblem.md":"<h1>The Diamond Problem in OOP<\/h1>\n<p>অবজেক্ট-ওরিয়েন্টিড প্রোগ্রামিংয়ে (OOP) মাল্টিপল ইনহেরিটেন্স (Multiple Inheritance) ব্যবহারের সময় যে জটিলতা বা দ্ব্যর্থতা (Ambiguity) তৈরি হয়, তাকে <strong>Diamond Problem<\/strong> বা ডায়মন্ড সমস্যা বলা হয়।<\/p>\n<p>নিচে ডায়মন্ড প্রবলেম কী, কেন এটি ঘটে এবং Java ও C# এ এর সমাধান কীভাবে করা হয় তা বিস্তারিত আলোচনা করা হলো:<\/p>\n<hr>\n<h2>১. ডায়মন্ড প্রবলেম কী? (The Problem)<\/h2>\n<p>ধরা যাক, আমাদের চারটি ক্লাস আছে: <code>A<\/code>, <code>B<\/code>, <code>C<\/code>, এবং <code>D<\/code>।<\/p>\n<ul><li>ক্লাস <code>B<\/code> এবং <code>C<\/code> উভয়ই ক্লাস <code>A<\/code> কে ইনহেরিট করে।<\/li><li>ক্লাস <code>D<\/code> একই সাথে ক্লাস <code>B<\/code> এবং <code>C<\/code> উভয়কেই ইনহেরিট করে (মাল্টিপল ইনহেরিটেন্স)।<\/li><\/ul>\n<p>তাদের সম্পর্কটি দেখতে একটি ডায়মন্ড বা হিরকের মতো দেখায়:<\/p>\n<figure class=\"diagram\"><svg viewBox=\"0 0 320 250\" width=\"320\" role=\"img\" aria-label=\"Class A থেকে B ও C, আর B ও C থেকে D\">\n<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs>\n<g stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#ah)\" opacity=\".55\">\n<path d=\"M140 52 L82 104\"/><path d=\"M180 52 L238 104\"/><path d=\"M82 146 L140 198\"/><path d=\"M238 146 L180 198\"/><\/g>\n<g font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">\n<rect x=\"110\" y=\"14\" width=\"100\" height=\"38\" rx=\"10\" fill=\"var(--surface)\" stroke=\"var(--line)\"/><text x=\"160\" y=\"38\" fill=\"currentColor\">Class A<\/text>\n<rect x=\"20\" y=\"106\" width=\"100\" height=\"38\" rx=\"10\" fill=\"var(--surface)\" stroke=\"var(--line)\"/><text x=\"70\" y=\"130\" fill=\"currentColor\">Class B<\/text>\n<rect x=\"200\" y=\"106\" width=\"100\" height=\"38\" rx=\"10\" fill=\"var(--surface)\" stroke=\"var(--line)\"/><text x=\"250\" y=\"130\" fill=\"currentColor\">Class C<\/text>\n<rect x=\"110\" y=\"198\" width=\"100\" height=\"38\" rx=\"10\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/><text x=\"160\" y=\"222\" fill=\"currentColor\">Class D<\/text><\/g>\n<\/svg><figcaption>B আর C দুজনেই A থেকে আসে; D দুজনের থেকেই — ডায়মন্ড আকৃতি<\/figcaption><\/figure>\n<h3>সমস্যাটি কোথায়?<\/h3>\n<p>ধরা যাক, ক্লাস <code>A<\/code> তে একটি মেথড আছে—<code>Show()<\/code>। ক্লাস <code>B<\/code> এবং <code>C<\/code> উভয়ই এই <code>Show()<\/code> মেথডটিকে ওভাররাইড (Override) করে নিজস্ব লজিক লিখেছে।<\/p>\n<p>এখন, ক্লাস <code>D<\/code> যখন <code>Show()<\/code> মেথডটি কল করতে যাবে, তখন কম্পাইলার বিভ্রান্ত হয়ে যায়: <strong>সে কি ক্লাস B এর Show() রান করবে, নাকি ক্লাস C এর Show() রান করবে?<\/strong><\/p>\n<p>এই সিদ্ধান্তের দ্ব্যর্থতা বা অস্পষ্টতাকেই ডায়মন্ড প্রবলেম বলা হয়।<\/p>\n<hr>\n<h2>২. Java এবং C# এ ডায়মন্ড প্রবলেমের সমাধান<\/h2>\n<p>ডায়মন্ড প্রবলেম এড়ানোর জন্য Java এবং C# এ ক্লাস লেভেলে <strong>মাল্টিপল ইনহেরিটেন্স সরাসরি নিষিদ্ধ<\/strong> করা হয়েছে।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// Java বা C# এ এটি অবৈধ (Compile Error):<\/span>\n<span class=\"hljs-keyword\">class<\/span> D <span class=\"hljs-keyword\">extends<\/span> B, C { } <span class=\"hljs-comment\">// Java<\/span>\n<span class=\"hljs-keyword\">class<\/span> D : B, C { }       <span class=\"hljs-comment\">// C#<\/span><\/code><\/pre><\/div>\n<p>তবে, জাভা ও সি# এ <strong>Interface<\/strong> ব্যবহারের মাধ্যমে মাল্টিপল ইনহেরিটেন্সের সুবিধা দেওয়া হয়। ইন্টারফেসে মেথডের বডি বা ইমপ্লিমেন্টেশন থাকে না, তাই ডায়মন্ড প্রবলেম হওয়ার সুযোগ থাকে না। কিন্তু আধুনিক সংস্করণে ইন্টারফেসেও মেথডের বডি (Default Methods) লেখার সুবিধা আসায় কিছু নতুন নিয়ম তৈরি হয়েছে।<\/p>\n<hr>\n<h3>৩. Java-তে সমাধান (Java 8+)<\/h3>\n<p>Java 8 থেকে ইন্টারফেসে <code>default<\/code> মেথড লেখার সুবিধা যোগ করা হয়েছে। এর ফলে ইন্টারফেস দিয়েও ডায়মন্ড প্রবলেম হতে পারে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">interface<\/span> InterfaceB {\n    <span class=\"hljs-keyword\">default<\/span> <span class=\"hljs-keyword\">void<\/span> show() {\n        System.<span class=\"hljs-keyword\">out<\/span>.println(<span class=\"hljs-string\">\"InterfaceB\"<\/span>);\n    }\n}\n\n<span class=\"hljs-keyword\">interface<\/span> InterfaceC {\n    <span class=\"hljs-keyword\">default<\/span> <span class=\"hljs-keyword\">void<\/span> show() {\n        System.<span class=\"hljs-keyword\">out<\/span>.println(<span class=\"hljs-string\">\"InterfaceC\"<\/span>);\n    }\n}\n\n<span class=\"hljs-comment\">// ক্লাসটি দুটি ইন্টারফেস ইমপ্লিমেন্ট করছে<\/span>\n<span class=\"hljs-keyword\">class<\/span> MyClass <span class=\"hljs-keyword\">implements<\/span> InterfaceB, InterfaceC {\n    <span class=\"hljs-comment\">// কম্পাইলার এখানে এরর দেবে এবং আপনাকে বাধ্য করবে মেথডটি ওভাররাইড করে দ্বন্দ্ব সমাধান করতে।<\/span>\n    @Override\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> show() {\n        <span class=\"hljs-comment\">// আমরা চাইলে যেকোনো একটি ইন্টারফেসের মেথডকে নির্দিষ্ট করে দিতে পারি:<\/span>\n        InterfaceB.<span class=\"hljs-keyword\">super<\/span>.show(); \n    }\n}<\/code><\/pre><\/div>\n<hr>\n<h3>৪. C#-এ সমাধান (C# 8.0+)<\/h3>\n<p>C# 8.0 থেকে ইন্টারফেসে <strong>Default Interface Implementation<\/strong> যুক্ত হয়েছে। C#-এ যদি দুটি ইন্টারফেসে একই নামের ডিফল্ট মেথড থাকে, তবে কম্পাইলার সরাসরি ক্লাস অবজেক্ট দিয়ে ওই মেথড কল করতে দেয় না। একে <strong>Explicit Interface Implementation<\/strong> এর মাধ্যমে সমাধান করতে হয়:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">interface<\/span> IInterfaceB\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Show<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"InterfaceB\"<\/span>);\n}\n\n<span class=\"hljs-keyword\">interface<\/span> IInterfaceC\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Show<\/span>() =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"InterfaceC\"<\/span>);\n}\n\n<span class=\"hljs-keyword\">class<\/span> MyClass : IInterfaceB, IInterfaceC\n{\n    <span class=\"hljs-comment\">// ক্লাস নিজে কোনো মেথড ওভাররাইড না করলেও চলে<\/span>\n}\n\n<span class=\"hljs-comment\">// কিন্তু ব্যবহারের সময় সরাসরি কল করা যাবে না:<\/span>\nMyClass obj = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">MyClass<\/span>();\n<span class=\"hljs-comment\">// obj.Show(); // Compile Error!<\/span>\n\n<span class=\"hljs-comment\">// সমাধান: নির্দিষ্ট ইন্টারফেসে কাস্ট (Cast) করে কল করতে হবে:<\/span>\n((IInterfaceB)obj).<span class=\"hljs-title function_\">Show<\/span>(); <span class=\"hljs-comment\">// আউটপুট: InterfaceB<\/span>\n((IInterfaceC)obj).<span class=\"hljs-title function_\">Show<\/span>(); <span class=\"hljs-comment\">// আউটপুট: InterfaceC<\/span><\/code><\/pre><\/div>\n<hr>\n<h2>সারসংক্ষেপ (Summary)<\/h2>\n<ul><li><strong>ডায়মন্ড প্রবলেম:<\/strong> মাল্টিপল ইনহেরিটেন্সে একই নামের মেথড দুই দিক থেকে আসার কারণে কম্পাইলারের সিদ্ধান্তহীনতা।<\/li><li><strong>ক্লাস লেভেলে সমাধান:<\/strong> Java এবং C# এ একাধিক ক্লাস ইনহেরিট করা নিষিদ্ধ।<\/li><li><strong>ইন্টারফেস লেভেলে সমাধান:<\/strong> ইন্টারফেস ব্যবহার করা হয়। ইন্টারফেসে ডিফল্ট মেথড থাকলে জাভাতে চাইল্ড ক্লাসে ওভাররাইড করে এবং সি#-এ এক্সপ্লিসিটলি কাস্ট করে ডায়মন্ড প্রবলেম সমাধান করতে হয়।<\/li><\/ul>","design-quality/coupling-cohesion-di/CouplingCohesionDI.md":"<h1>Coupling, Cohesion, and Dependency Injection (DI)<\/h1>\n<p>অবজেক্ট-ওরিয়েন্টিড প্রোগ্রামিং (OOP) এবং সফটওয়্যার আর্কিটেকচারে কোডকে মেইনটেইনেবল, টেস্টেবল এবং স্কেলেবল করার জন্য <strong>Coupling<\/strong>, <strong>Cohesion<\/strong> এবং <strong>Dependency Injection<\/strong> অত্যন্ত গুরুত্বপূর্ণ ধারণা।<\/p>\n<p>নিচে বাস্তব উদাহরণসহ এই বিষয়গুলো বিস্তারিত আলোচনা করা হলো:<\/p>\n<hr>\n<h2>১. Cohesion (কোইশন) কী?<\/h2>\n<p><strong>Cohesion<\/strong> নির্দেশ করে একটি সিঙ্গেল ক্লাস বা মডিউলের ভেতরের মেথড ও ভেরিয়েবলগুলো একে অপরের সাথে কতটা সম্পর্কিত বা নিবিড়ভাবে কাজ করে।<\/p>\n<blockquote><p><strong>সফটওয়্যার ডিজাইনের গোল:<\/strong> <strong>High Cohesion (উচ্চ কোইশন)<\/strong><br>অর্থাৎ, একটি ক্লাসের শুধুমাত্র একটি নির্দিষ্ট দায়িত্ব থাকা উচিত (Single Responsibility Principle)।<\/p><\/blockquote>\n<h3>ক. Low Cohesion (খারাপ ডিজাইন):<\/h3>\n<p>একটি ক্লাসের ভেতর যখন একাধিক অসম্পর্কিত দায়িত্ব দেওয়া হয়।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// এখানে একটি ক্লাসই ডাটাবেজ সেভ করছে, ইমেইল পাঠাচ্ছে এবং ট্যাক্স হিসাব করছে।<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> EmployeeManager\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SaveEmployee<\/span>(Employee emp) { <span class=\"hljs-comment\">/* ডাটাবেজ কোড */<\/span> }\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">CalculateTax<\/span>(Employee emp) { <span class=\"hljs-comment\">/* ট্যাক্স হিসাবের লজিক */<\/span> }\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendEmail<\/span>(<span class=\"hljs-built_in\">string<\/span> message) { <span class=\"hljs-comment\">/* ইমেইল পাঠানোর কোড */<\/span> }\n}<\/code><\/pre><\/div>\n<p><strong>সমস্যা:<\/strong> এখানে কোনো পরিবর্তন করতে গেলে পুরো ক্লাসটি রিস্কের মুখে পড়বে এবং কোড মেইনটেইন করা কঠিন হবে।<\/p>\n<h3>খ. High Cohesion (ভালো ডিজাইন):<\/h3>\n<p>প্রতিটি ক্লাসের দায়িত্ব আলাদা এবং সুনির্দিষ্ট।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> EmployeeRepository\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SaveEmployee<\/span>(Employee emp) { <span class=\"hljs-comment\">/* শুধুমাত্র ডাটাবেজ লজিক */<\/span> }\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> TaxCalculator\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">double<\/span> <span class=\"hljs-title function_\">CalculateTax<\/span>(Employee emp) { <span class=\"hljs-comment\">/* শুধুমাত্র ট্যাক্স লজিক */<\/span> }\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> EmailService\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">SendEmail<\/span>(<span class=\"hljs-built_in\">string<\/span> message) { <span class=\"hljs-comment\">/* শুধুমাত্র ইমেইল লজিক */<\/span> }\n}<\/code><\/pre><\/div>\n<p><strong>সুবিধা:<\/strong> প্রতিটি ক্লাস ছোট, পরিষ্কার এবং সহজে রি-ইউজেবল (Reusable)।<\/p>\n<hr>\n<h2>২. Coupling (কপলিং) কী?<\/h2>\n<p><strong>Coupling<\/strong> নির্দেশ করে দুটি ভিন্ন ক্লাস বা মডিউল একে অপরের ওপর কতটা নির্ভরশীল।<\/p>\n<blockquote><p><strong>সফটওয়্যার ডিজাইনের গোল:<\/strong> <strong>Loose Coupling (শিথিল কপলিং)<\/strong><br>ক্লাসগুলোর মধ্যে নির্ভরশীলতা যত কম হবে, কোড তত সহজে পরিবর্তন ও টেস্ট করা যাবে।<\/p><\/blockquote>\n<h3>ক. Tight Coupling (খারাপ ডিজাইন):<\/h3>\n<p>যখন একটি ক্লাস সরাসরি অন্য ক্লাসের অবজেক্ট তৈরি করে এবং তার ওপর শক্তভাবে নির্ভরশীল হয়ে পড়ে।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Car\n{\n    <span class=\"hljs-keyword\">private<\/span> Engine _engine;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Car<\/span>()\n    {\n        <span class=\"hljs-comment\">// Car সরাসরি Engine ক্লাসের কংক্রিট ইমপ্লিমেন্টেশনের ওপর নির্ভরশীল<\/span>\n        _engine = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Engine<\/span>(); \n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">StartCar<\/span>()\n    {\n        _engine.<span class=\"hljs-title function_\">Start<\/span>();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>সমস্যা:<\/strong> আপনি যদি ভবিষ্যতে <code>ElectricEngine<\/code> ব্যবহার করতে চান, তবে আপনাকে <code>Car<\/code> ক্লাসের ভেতর ঢুকে কোড পরিবর্তন করতে হবে। এছাড়া, <code>Car<\/code> ক্লাসকে একা ইউনিট টেস্ট করা অসম্ভব (কারণ এটি <code>Engine<\/code> এর ওপর সরাসরি নির্ভরশীল)।<\/p>\n<h3>খ. Loose Coupling (ভালো ডিজাইন):<\/h3>\n<p>ইন্টারফেস (Interface) ব্যবহারের মাধ্যমে ক্লাসগুলোর মধ্যকার শক্ত বাঁধন শিথিল করা হয়।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IEngine\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Start<\/span>();\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Car\n{\n    <span class=\"hljs-keyword\">private<\/span> IEngine _engine;\n\n    <span class=\"hljs-comment\">// Car এখন সরাসরি কোনো নির্দিষ্ট Engine এর ওপর নির্ভর করছে না, বরং IEngine ইন্টারফেসের ওপর নির্ভর করছে<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Car<\/span>(IEngine engine)\n    {\n        _engine = engine;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">StartCar<\/span>()\n    {\n        _engine.<span class=\"hljs-title function_\">Start<\/span>();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>সুবিধা:<\/strong> এখন আপনি <code>Car<\/code> ক্লাসের কোনো পরিবর্তন না করেই <code>V8Engine<\/code> বা <code>ElectricEngine<\/code> পাস করতে পারবেন।<\/p>\n<hr>\n<h2>৩. Dependency Injection (DI) কী?<\/h2>\n<p><strong>Dependency Injection (DI)<\/strong> হলো একটি ডিজাইন প্যাটার্ন যা <strong>Loose Coupling<\/strong> অর্জনে সরাসরি সাহায্য করে।<\/p>\n<p>ডিপেন্ডেন্সি (Dependency) মানে হলো কোনো কাজ করার জন্য একটি ক্লাসের যখন অন্য কোনো ক্লাসের অবজেক্টের প্রয়োজন হয় (যেমন: <code>Car<\/code> এর জন্য <code>Engine<\/code> একটি ডিপেন্ডেন্সি)।<br>আর ইনজেকশন (Injection) মানে হলো সেই প্রয়োজনীয় অবজেক্টটি নিজের ভেতরে <code>new<\/code> দিয়ে তৈরি না করে, <strong>বাইর থেকে সরবরাহ করা বা পাস করে দেওয়া<\/strong>।<\/p>\n<h3>DI এর প্রকারভেদ:<\/h3>\n<ol><li><strong>Constructor Injection:<\/strong> সবচেয়ে বেশি ব্যবহৃত হয়। কন্সট্রাকটরের মাধ্যমে ডিপেন্ডেন্সি পাস করা হয়।<\/li><li><strong>Property/Setter Injection:<\/strong> প্রোপার্টি বা সেট মেথডের মাধ্যমে ডিপেন্ডেন্সি পাস করা হয়।<\/li><li><strong>Method Injection:<\/strong> সরাসরি কোনো নির্দিষ্ট মেথডের প্যারামিটার হিসেবে ডিপেন্ডেন্সি পাস করা হয়।<\/li><\/ol>\n<h3>DI এর কোড উদাহরণ (Constructor Injection):<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ১. ডিপেন্ডেন্সি ইন্টারফেস<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">interface<\/span> IMessageService\n{\n    <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Send<\/span>(<span class=\"hljs-built_in\">string<\/span> message);\n}\n\n<span class=\"hljs-comment\">// ২. কংক্রিট ইমপ্লিমেন্টেশন<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> SmsService : IMessageService\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Send<\/span>(<span class=\"hljs-built_in\">string<\/span> message) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"SMS Sent: {message}\"<\/span>);\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> EmailService : IMessageService\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Send<\/span>(<span class=\"hljs-built_in\">string<\/span> message) =&gt; Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">$\"Email Sent: {message}\"<\/span>);\n}\n\n<span class=\"hljs-comment\">// ৩. ডিপেন্ডেন্ট ক্লাস (যেখানে ইনজেকশন হবে)<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> NotificationManager\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">readonly<\/span> IMessageService _messageService;\n\n    <span class=\"hljs-comment\">// Constructor Injection: বাইর থেকে IMessageService ইনজেক্ট করা হচ্ছে<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">NotificationManager<\/span>(IMessageService messageService)\n    {\n        _messageService = messageService;\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Notify<\/span>(<span class=\"hljs-built_in\">string<\/span> msg)\n    {\n        _messageService.<span class=\"hljs-title function_\">Send<\/span>(msg);\n    }\n}\n\n<span class=\"hljs-comment\">// ৪. ব্যবহার (Usage):<\/span>\n<span class=\"hljs-keyword\">class<\/span> Program\n{\n    <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>()\n    {\n        <span class=\"hljs-comment\">// আমরা চাইলে SMS দিয়ে নোটিফাই করতে পারি:<\/span>\n        IMessageService sms = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">SmsService<\/span>();\n        NotificationManager notification1 = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NotificationManager<\/span>(sms);\n        notification1.<span class=\"hljs-title function_\">Notify<\/span>(<span class=\"hljs-string\">\"Hello User!\"<\/span>);\n\n        <span class=\"hljs-comment\">// কোড পরিবর্তন না করে সহজেই Email এ পরিবর্তন করা সম্ভব:<\/span>\n        IMessageService email = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">EmailService<\/span>();\n        NotificationManager notification2 = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">NotificationManager<\/span>(email);\n        notification2.<span class=\"hljs-title function_\">Notify<\/span>(<span class=\"hljs-string\">\"Hello User!\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<hr>\n<h2>সংক্ষেপে সারমর্ম (Summary)<\/h2>\n<ul><li><strong>Cohesion:<\/strong> একটি ক্লাসের অভ্যন্তরীণ কাজের একাগ্রতা। (আমাদের লক্ষ্য: <strong>High Cohesion<\/strong> বা এক ক্লাসে এক দায়িত্ব)।<\/li><li><strong>Coupling:<\/strong> একাধিক ক্লাসের পারস্পরিক নির্ভরশীলতা। (আমাদের লক্ষ্য: <strong>Loose Coupling<\/strong> বা ক্লাসগুলোর মধ্যকার ন্যূনতম বাঁধন)।<\/li><li><strong>Dependency Injection:<\/strong> নিজের ডিপেন্ডেন্সি নিজে <code>new<\/code> দিয়ে তৈরি না করে বাইর থেকে ইনজেক্ট করা, যা Loose Coupling নিশ্চিত করে।<\/li><\/ul>"},"readme":""};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

const allPatterns = [];
DATA.tree.forEach(c => c.patterns.forEach(p => allPatterns.push({ ...p, cat: c })));
const catById = Object.fromEntries(DATA.tree.map(c => [c.id, c]));
const totalFiles = Object.keys(DATA.pages).length;

/* ---------- theme ---------- */
const savedTheme = store.get('oop-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('oop-theme', next);
};

/* ---------- sidebar ---------- */
const closedCats = new Set(JSON.parse(store.get('oop-closed') || '[]'));
function buildNav(filter = '') {
  const f = filter.trim().toLowerCase();
  let html = '';
  DATA.tree.forEach(c => {
    const pats = c.patterns.filter(p => !f || (p.name + ' ' + p.h1 + ' ' + p.files.map(x => x.name).join(' ')).toLowerCase().includes(f));
    if (f && !pats.length) return;
    const closed = !f && closedCats.has(c.id);
    html += `<div class="cat ${closed ? 'closed' : ''}" style="--cat:var(--${c.accent})">
      <button class="cat-head" data-cat="${c.id}"><span class="dot" style="background:var(--${c.accent})"></span>${esc(c.name)}
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="cat-body">`;
    if (c.sheet && !f) html += `<button class="item sheet" data-go="#/s/${c.id}"><span class="num">≡</span>এক নজরে (Cheat Sheet)</button>`;
    if (!c.patterns.length && !f) c.files.forEach(x => html += `<button class="item" data-go="#/f/${c.id}/${x.name}"><span class="num">·</span>${esc(x.name.replace(/\.md$/, ''))}</button>`);
    pats.forEach(p => {
      html += `<button class="item" data-go="#/p/${p.id}" data-pid="${p.id}"><span class="num">${p.num}</span>${esc(p.name)}<span class="count">${p.files.length}</span></button>
        <div class="sub hidden" data-sub="${p.id}">${p.files.map(x => `<button class="item" data-go="#/p/${p.id}/${x.name}">${esc(x.name)}</button>`).join('')}</div>`;
    });
    html += `</div></div>`;
  });
  $('#nav').innerHTML = html || '<div class="empty">কিছু পাওয়া যায়নি</div>';
  markActive();
}
function markActive() {
  let h = decodeURIComponent(location.hash || '#/');
  const pm = h.match(/^#\/p\/([^/]+\/[^/]+)$/);
  if (pm) { const p = allPatterns.find(x => x.id === pm[1]); if (p && p.files[0]) h += '/' + p.files[0].name; }
  document.querySelectorAll('.sidebar [data-go]').forEach(el => el.classList.toggle('active', el.dataset.go === h));
  document.querySelectorAll('[data-sub]').forEach(el => {
    const open = h.startsWith(`#/p/${el.dataset.sub}`);
    el.classList.toggle('hidden', !open);
    if (open) el.previousElementSibling.classList.add('active');
  });
  const nh = document.querySelector('.nav-home'); nh.classList.toggle('active', h === '#/' || h === '');
}
function codeText(box) {
  const rows = box.querySelectorAll('.ln-row');
  return rows.length ? [...rows].map(r => r.textContent).join('\n') : box.querySelector('code').innerText;
}
document.addEventListener('copy', e => {
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const rg = sel.getRangeAt(0);
  const start = rg.startContainer.nodeType === 1 ? rg.startContainer : rg.startContainer.parentElement;
  const box = start && start.closest('.code');
  if (!box || !box.contains(rg.endContainer)) return;
  const lines = [...box.querySelectorAll('.ln-row')].filter(r => rg.intersectsNode(r)).map(r => {
    const x = document.createRange();
    x.selectNodeContents(r);
    if (x.compareBoundaryPoints(Range.START_TO_START, rg) < 0) x.setStart(rg.startContainer, rg.startOffset);
    if (x.compareBoundaryPoints(Range.END_TO_END, rg) > 0) x.setEnd(rg.endContainer, rg.endOffset);
    return x.toString();
  });
  if (lines.length < 2) return;
  e.clipboardData.setData('text/plain', lines.join('\n'));
  e.preventDefault();
});
document.addEventListener('click', e => {
  const head = e.target.closest('.cat-head');
  if (head) {
    const id = head.dataset.cat, cat = head.parentElement;
    cat.classList.toggle('closed');
    cat.classList.contains('closed') ? closedCats.add(id) : closedCats.delete(id);
    store.set('oop-closed', JSON.stringify([...closedCats]));
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); location.hash = go.dataset.go; document.body.classList.remove('nav-open'); return; }
  const copy = e.target.closest('.copy');
  if (copy) {
    const text = codeText(copy.closest('.code'));
    navigator.clipboard?.writeText(text).then(() => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy', 1400); });
    return;
  }
  const fl = e.target.closest('.file-link');
  if (fl) {
    const base = (location.hash.match(/^#\/p\/([^/]+\/[^/]+)/) || [])[1];
    const name = fl.dataset.rel.replace(/^\.\//, '').split('/').pop();
    if (base && DATA.pages[`${base}/${name}`]) location.hash = `#/p/${base}/${name}`;
  }
});
document.addEventListener('click', e => {
  const l = e.target.closest('.ih-lang');
  if (!l) return;
  const pane = l.closest('.ih-pane'), i = [...l.parentElement.children].indexOf(l);
  pane.querySelectorAll('.ih-lang').forEach((x, j) => x.classList.toggle('active', j === i));
  pane.querySelectorAll('.ih-code').forEach((x, j) => x.classList.toggle('active', j === i));
});
document.addEventListener('click', e => {
  const t = e.target.closest('.ih-tab');
  if (!t) return;
  const body = t.closest('.ih-body'), i = [...t.parentElement.children].indexOf(t);
  body.querySelectorAll('.ih-tab').forEach((x, j) => x.classList.toggle('active', j === i));
  body.querySelectorAll('.ih-pane').forEach((x, j) => x.classList.toggle('active', j === i));
});
$('#q').addEventListener('input', e => buildNav(e.target.value));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); document.body.classList.add('nav-open'); $('#q').focus(); }
  if (e.key === 'Escape') { $('#q').value = ''; buildNav(); $('#q').blur(); document.body.classList.remove('nav-open'); }
});
$('#menu').onclick = () => document.body.classList.add('nav-open');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');

/* ---------- views ---------- */
function card(p) {
  const desc = p.para || p.h1 || '';
  return `<button class="card" data-go="#/p/${p.id}" style="--cat:var(--${p.cat.accent})">
    <div class="top"><span class="n">${p.num}</span><span class="files">${p.files.length} files</span></div>
    <h3>${esc(p.name)}</h3><p>${esc(desc)}</p></button>`;
}
function home() {
  let html = `<section class="hero">
    <div class="eyebrow">Object-Oriented Programming · C# · বাংলা</div>
    <h1>OOP in C#,<br><em>simply explained.</em></h1>
    <p>OOP-এর ৪টি পিলার আর তার আশেপাশের গুরুত্বপূর্ণ প্রশ্ন — sealed, private constructor, casting, diamond problem, coupling ও cohesion — সহজ বাংলায়, C# (আর দরকারে Java) কোড সহ। শুরু করতে চাইলে আগে <a href="#/s/pillars">৪টি পিলার এক নজরে</a> পড়ে নিন।</p>
    <div class="stats">
      <div class="stat"><b>${allPatterns.length}</b><span>Topics</span></div>
      <div class="stat"><b>${allPatterns.reduce((n, p) => n + p.files.filter(f => f.kind === 'code').length, 0)}</b><span>C# files</span></div>
      <div class="stat"><b>${totalFiles}</b><span>Pages</span></div>
    </div></section>`;
  DATA.tree.forEach(c => {
    html += `<section class="section" style="--cat:var(--${c.accent})">
      <div class="section-head"><h2>${esc(c.name)}</h2><span class="bn">${esc(c.blurb)}</span>
      ${c.sheet ? `<button data-go="#/s/${c.id}">এক নজরে →</button>` : ''}
      ${!c.patterns.length && c.files.length ? `<button data-go="#/f/${c.id}/${c.files[0].name}">Open →</button>` : ''}</div>
      ${c.patterns.length ? `<div class="grid">${c.patterns.map(p => card({ ...p, cat: c })).join('')}</div>` : ''}
    </section>`;
  });
  return html;
}
function crumbs(parts) {
  return `<div class="crumbs">${parts.map(p => `<span>${esc(p)}</span>`).join('<span class="sep">/</span>')}</div>`;
}
function patternView(pid, file) {
  const idx = allPatterns.findIndex(p => p.id === pid);
  const p = allPatterns[idx];
  if (!p) return notFound();
  file = file || p.files[0]?.name;
  const content = DATA.pages[`${pid}/${file}`];
  const prev = allPatterns[idx - 1], next = allPatterns[idx + 1];
  return `<div style="--cat:var(--${p.cat.accent})">
    ${crumbs([p.cat.name, p.name])}
    <div class="page-head"><h1>${esc(p.name)}</h1>${p.h1 ? `<div class="bn">${esc(p.h1)}</div>` : ''}</div>
    <div class="tabs">${p.files.map(f => `<button class="tab ${f.name === file ? 'active' : ''}" data-go="#/p/${pid}/${f.name}"><span class="ic ${f.kind}"></span>${esc(f.name)}</button>`).join('')}</div>
    <article class="prose">${content || '<div class="empty">ফাইলটি পাওয়া যায়নি</div>'}</article>
    <div class="pager">
      ${prev ? `<button data-go="#/p/${prev.id}"><small>← Previous</small><b>${esc(prev.name)}</b></button>` : '<span></span>'}
      ${next ? `<button class="next" data-go="#/p/${next.id}"><small>Next →</small><b>${esc(next.name)}</b></button>` : ''}
    </div></div>`;
}
function docView(catId, key, title) {
  const c = catById[catId];
  if (!c || !DATA.pages[key]) return notFound();
  return `<div style="--cat:var(--${c.accent})">${crumbs([c.name, title])}<article class="prose">${DATA.pages[key]}</article></div>`;
}
const notFound = () => `<div class="empty">পেজটি পাওয়া যায়নি · <a href="#/">Home</a></div>`;

function route() {
  const h = decodeURIComponent(location.hash || '#/');
  let m, html;
  if ((m = h.match(/^#\/p\/([^/]+\/[^/]+)(?:\/(.+))?$/))) html = patternView(m[1], m[2]);
  else if ((m = h.match(/^#\/s\/([^/]+)$/))) html = docView(m[1], `${m[1]}/CHEAT_SHEET.md`, 'এক নজরে');
  else if ((m = h.match(/^#\/f\/([^/]+)\/(.+)$/))) html = docView(m[1], `${m[1]}/${m[2]}`, m[2]);
  else html = home();
  $('#view').innerHTML = html;
  window.scrollTo(0, 0);
  markActive();
  const a = document.querySelector('.sidebar .item.active'); if (a) a.scrollIntoView({ block: 'nearest' });
}
window.addEventListener('hashchange', route);
buildNav();
route();
</script>
<script>
/* WellDev theme: VS Code style line numbers for every .code block, including ones rendered later. */
(function () {
  function number(pre) {
    if (pre.classList.contains("numbered")) return;
    const code = pre.querySelector("code") || pre;
    const stack = [], out = [];
    code.innerHTML.replace(/\n$/, "").split("\n").forEach(line => {
      const reopen = stack.join("");
      const re = /<(\/?)span([^>]*)>/g; let m;
      while ((m = re.exec(line))) { if (m[1]) stack.pop(); else stack.push("<span" + m[2] + ">"); }
      out.push('<span class="ln-row">' + reopen + (line || " ") + "</span>".repeat(stack.length) + "</span>");
    });
    pre.classList.add("numbered");
    code.innerHTML = out.join("");
  }
  function scan(node) {
    if (node.nodeType !== 1) return;
    if (node.matches(".code pre")) number(node);
    node.querySelectorAll(".code pre").forEach(number);
  }
  scan(document.body);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(scan))).observe(document.body, { childList: true, subtree: true });
})();
</script>
