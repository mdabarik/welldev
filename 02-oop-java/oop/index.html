s=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: ক্লায়েন্ট প্রতিটা gateway-র ভেতরের কাজ জানে<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Checkout<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-built_in\">double<\/span> amt) {\n        <span class=\"hljs-title class_\">StripeApi<\/span> api = <span class=\"hljs-keyword\">new<\/span> StripeApi();\n        api.setKey(<span class=\"hljs-string\">\"...\"<\/span>);\n        api.createCharge(amt);\n    }\n}\n\n<span class=\"hljs-comment\">// ✅ With: শুধু 'কী' (pay) দেখানো হয়<\/span>\n<span class=\"hljs-keyword\">interface<\/span> <span class=\"hljs-title class_\">PaymentGateway<\/span> { <span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-built_in\">double<\/span> amt); }\n\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">StripeGateway<\/span> <span class=\"hljs-keyword\">implements<\/span> <span class=\"hljs-title class_\">PaymentGateway<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-built_in\">double<\/span> amt) { /* <span class=\"hljs-title class_\">Stripe<\/span>-এর জটিল কাজ */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">BkashGateway<\/span> <span class=\"hljs-keyword\">implements<\/span> <span class=\"hljs-title class_\">PaymentGateway<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-built_in\">double<\/span> amt) { /* bKash-এর জটিল কাজ */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Checkout<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-title class_\">PaymentGateway<\/span> g, <span class=\"hljs-built_in\">double<\/span> amt) { g.pay(amt); }\n}<\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: ক্লায়েন্ট প্রতিটা gateway-র ভেতরের কাজ জানে<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Checkout<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-built_in\">decimal<\/span> amt) {\n        <span class=\"hljs-built_in\">var<\/span> api = <span class=\"hljs-keyword\">new<\/span> StripeApi();\n        api.SetKey(<span class=\"hljs-string\">\"...\"<\/span>);\n        api.CreateCharge(amt);\n    }\n}\n\n<span class=\"hljs-comment\">// ✅ With: শুধু 'কী' (Pay) দেখানো হয়<\/span>\n<span class=\"hljs-keyword\">interface<\/span> <span class=\"hljs-title class_\">IPaymentGateway<\/span> { <span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-built_in\">decimal<\/span> amt); }\n\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">StripeGateway<\/span> : <span class=\"hljs-title class_\">IPaymentGateway<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-built_in\">decimal<\/span> amt) { /* <span class=\"hljs-title class_\">Stripe<\/span>-এর জটিল কাজ */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">BkashGateway<\/span> : <span class=\"hljs-title class_\">IPaymentGateway<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-built_in\">decimal<\/span> amt) { /* bKash-এর জটিল কাজ */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Checkout<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-title class_\">IPaymentGateway<\/span> g, <span class=\"hljs-built_in\">decimal<\/span> amt) =&gt; g.Pay(amt);\n}<\/code><\/pre><\/div><\/div><div class=\"ih-pane\"><p><code>send()<\/code> ডাকলেই হলো; SMTP নাকি SMS API — সেটা ভেতরের ব্যাপার।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ✅ abstract class: কিছু কাজ ভাগ করা, কিছু সাব-ক্লাস ঠিক করবে<\/span>\nabstract <span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> notifyUser(<span class=\"hljs-built_in\">String<\/span> msg) {       <span class=\"hljs-comment\">// সবার জন্য এক<\/span>\n        <span class=\"hljs-built_in\">String<\/span> formatted = <span class=\"hljs-string\">\"[App] \"<\/span> + msg;\n        send(formatted);\n    }\n    abstract <span class=\"hljs-keyword\">void<\/span> send(<span class=\"hljs-built_in\">String<\/span> msg);     <span class=\"hljs-comment\">// কীভাবে — সাব-ক্লাস জানে<\/span>\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">EmailNotifier<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> send(<span class=\"hljs-built_in\">String<\/span> msg) { /* <span class=\"hljs-title class_\">SMTP<\/span> */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">SmsNotifier<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> send(<span class=\"hljs-built_in\">String<\/span> msg) { /* <span class=\"hljs-title class_\">SMS<\/span> <span class=\"hljs-title class_\">API<\/span> */ }\n}\n\n<span class=\"hljs-comment\">// Notifier n = new EmailNotifier();<\/span>\n<span class=\"hljs-comment\">// n.notifyUser(\"Order placed\");    // ভেতরের খবর জানা লাগে না<\/span><\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ✅ abstract class: কিছু কাজ ভাগ করা, কিছু সাব-ক্লাস ঠিক করবে<\/span>\nabstract <span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> NotifyUser(<span class=\"hljs-built_in\">string<\/span> msg) {   <span class=\"hljs-comment\">// সবার জন্য এক<\/span>\n        <span class=\"hljs-built_in\">var<\/span> formatted = <span class=\"hljs-string\">\"[App] \"<\/span> + msg;\n        Send(formatted);\n    }\n    <span class=\"hljs-keyword\">protected<\/span> abstract <span class=\"hljs-keyword\">void<\/span> Send(<span class=\"hljs-built_in\">string<\/span> msg);  <span class=\"hljs-comment\">// কীভাবে — সাব-ক্লাস জানে<\/span>\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">EmailNotifier<\/span> : <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">protected<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-keyword\">void<\/span> Send(<span class=\"hljs-built_in\">string<\/span> msg) { /* <span class=\"hljs-title class_\">SMTP<\/span> */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">SmsNotifier<\/span> : <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">protected<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-keyword\">void<\/span> Send(<span class=\"hljs-built_in\">string<\/span> msg) { /* <span class=\"hljs-title class_\">SMS<\/span> <span class=\"hljs-title class_\">API<\/span> */ }\n}\n\n<span class=\"hljs-comment\">// Notifier n = new EmailNotifier();<\/span>\n<span class=\"hljs-comment\">// n.NotifyUser(\"Order placed\");    // ভেতরের খবর জানা লাগে না<\/span><\/code><\/pre><\/div><\/div><div class=\"ih-pane\"><p>ড্রাইভার শুধু <code>start()<\/code> চাপে; ইঞ্জিন, ফুয়েল ইনজেকশন, স্পার্ক — সব লুকানো।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: ব্যবহারকারীকেই সব ধাপ জানতে হচ্ছে<\/span>\ncar.injectFuel();\ncar.sparkPlug();\ncar.crankEngine();\n\n<span class=\"hljs-comment\">// ✅ With: একটাই সহজ মেথড<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Car<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> start() {\n        injectFuel();\n        spark();\n        crankEngine();\n    }\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">void<\/span> injectFuel() {}\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">void<\/span> spark() {}\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">void<\/span> crankEngine() {}\n}\n<span class=\"hljs-comment\">// new Car().start();<\/span><\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: ব্যবহারকারীকেই সব ধাপ জানতে হচ্ছে<\/span>\ncar.InjectFuel();\ncar.Spark();\ncar.CrankEngine();\n\n<span class=\"hljs-comment\">// ✅ With: একটাই সহজ মেথড<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Car<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Start() {\n        InjectFuel();\n        Spark();\n        CrankEngine();\n    }\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">void<\/span> InjectFuel() {}\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">void<\/span> Spark() {}\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">void<\/span> CrankEngine() {}\n}\n<span class=\"hljs-comment\">// new Car().Start();<\/span><\/code><\/pre><\/div><\/div><div class=\"callout tip\"><div class=\"callout-title\">Short note<\/div><p>Abstraction = <strong>abstract class / interface<\/strong> দিয়ে 'কী' দেখানো। <strong>Encapsulation vs Abstraction:<\/strong> Encapsulation = data সুরক্ষিত (কীভাবে লুকাই), Abstraction = জটিলতা লুকিয়ে সহজ রূপ দেখানো (design level)। Abstract class = কিছু implementation থাকে; Interface = শুধু চুক্তি।<\/p><\/div><\/div><\/details><details class=\"ih\"><summary>Inheritance — Parent-এর কোড Child আবার ব্যবহার করে (is-a)<\/summary><div class=\"ih-body\"><div class=\"ih-tabs\"><button type=\"button\" class=\"ih-tab active\">Employee<\/button><button type=\"button\" class=\"ih-tab\">Vehicle<\/button><button type=\"button\" class=\"ih-tab\">User Roles<\/button><\/div><div class=\"ih-pane active\"><p><code>name<\/code>, <code>salary<\/code>, <code>work()<\/code> একবার <code>Employee<\/code>-এ; <code>Manager<\/code> আর <code>Developer<\/code> শুধু নিজেদের বিশেষ কাজ যোগ করে।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: একই field বারবার কপি<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Manager<\/span>   { <span class=\"hljs-built_in\">String<\/span> name; <span class=\"hljs-built_in\">double<\/span> salary; <span class=\"hljs-keyword\">void<\/span> manage() {} }\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Developer<\/span> { <span class=\"hljs-built_in\">String<\/span> name; <span class=\"hljs-built_in\">double<\/span> salary; <span class=\"hljs-keyword\">void<\/span> code() {} }\n\n<span class=\"hljs-comment\">// ✅ With: কমন অংশ Parent-এ<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Employee<\/span> {\n    <span class=\"hljs-built_in\">String<\/span> name;\n    <span class=\"hljs-built_in\">double<\/span> salary;\n    <span class=\"hljs-keyword\">void<\/span> work() { System.out.println(name + <span class=\"hljs-string\">\" is working\"<\/span>); }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Manager<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">Employee<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> manage() { /* team চালানো */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Developer<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">Employee<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> code() { /* কোড লেখা */ }\n}<\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: একই property বারবার কপি<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Manager<\/span>   { <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title class_\">Name<\/span>; <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title class_\">Salary<\/span>; <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Manage() {} }\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Developer<\/span> { <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title class_\">Name<\/span>; <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title class_\">Salary<\/span>; <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Code() {} }\n\n<span class=\"hljs-comment\">// ✅ With: কমন অংশ Parent-এ<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Employee<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title class_\">Name<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">decimal<\/span> <span class=\"hljs-title class_\">Salary<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Work() =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">$\"{Name} is working\"<\/span>);\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Manager<\/span> : <span class=\"hljs-title class_\">Employee<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Manage() { /* team চালানো */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Developer<\/span> : <span class=\"hljs-title class_\">Employee<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Code() { /* কোড লেখা */ }\n}<\/code><\/pre><\/div><\/div><div class=\"ih-pane\"><p><code>Vehicle<\/code>-এ <code>speed<\/code>, <code>start()<\/code>; <code>Car<\/code> আর <code>Bike<\/code> সেটা পায় এবং নিজের মতো বাড়ায়। <code>super<\/code>/<code>base<\/code> দিয়ে Parent constructor ডাকা হয়।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Vehicle<\/span> {\n    <span class=\"hljs-keyword\">protected<\/span> <span class=\"hljs-built_in\">int<\/span> speed;\n    Vehicle(<span class=\"hljs-built_in\">int<\/span> speed) { <span class=\"hljs-keyword\">this<\/span>.speed = speed; }\n    <span class=\"hljs-keyword\">void<\/span> start() { System.out.println(<span class=\"hljs-string\">\"Vehicle started\"<\/span>); }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Car<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">Vehicle<\/span> {\n    <span class=\"hljs-built_in\">int<\/span> doors;\n    Car(<span class=\"hljs-built_in\">int<\/span> speed, <span class=\"hljs-built_in\">int<\/span> doors) {\n        super(speed);              <span class=\"hljs-comment\">// Parent constructor<\/span>\n        <span class=\"hljs-keyword\">this<\/span>.doors = doors;\n    }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Bike<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">Vehicle<\/span> {\n    Bike(<span class=\"hljs-built_in\">int<\/span> speed) { super(speed); }\n    <span class=\"hljs-keyword\">void<\/span> wheelie() {}              <span class=\"hljs-comment\">// শুধু Bike-এর<\/span>\n}\n<span class=\"hljs-comment\">// new Car(120, 4).start();       // Parent-এর মেথড<\/span><\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Vehicle<\/span> {\n    <span class=\"hljs-keyword\">protected<\/span> <span class=\"hljs-built_in\">int<\/span> <span class=\"hljs-title class_\">Speed<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> Vehicle(<span class=\"hljs-built_in\">int<\/span> speed) { <span class=\"hljs-title class_\">Speed<\/span> = speed; }\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Start() =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">\"Vehicle started\"<\/span>);\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Car<\/span> : <span class=\"hljs-title class_\">Vehicle<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">int<\/span> <span class=\"hljs-title class_\">Doors<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> Car(<span class=\"hljs-built_in\">int<\/span> speed, <span class=\"hljs-built_in\">int<\/span> doors) : <span class=\"hljs-keyword\">base<\/span>(speed) {   <span class=\"hljs-comment\">// Parent constructor<\/span>\n        <span class=\"hljs-title class_\">Doors<\/span> = doors;\n    }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Bike<\/span> : <span class=\"hljs-title class_\">Vehicle<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> Bike(<span class=\"hljs-built_in\">int<\/span> speed) : <span class=\"hljs-keyword\">base<\/span>(speed) {}\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Wheelie() {}       <span class=\"hljs-comment\">// শুধু Bike-এর<\/span>\n}\n<span class=\"hljs-comment\">// new Car(120, 4).Start();       // Parent-এর মেথড<\/span><\/code><\/pre><\/div><\/div><div class=\"ih-pane\"><p><code>User<\/code> → <code>Admin<\/code>, <code>Customer<\/code>। লগইন/প্রোফাইল সবার এক; Admin-এ বাড়তি ক্ষমতা।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-built_in\">String<\/span> email;\n    <span class=\"hljs-keyword\">void<\/span> login() { System.out.println(email + <span class=\"hljs-string\">\" logged in\"<\/span>); }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Admin<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> banUser(<span class=\"hljs-title class_\">User<\/span> u) { /* শুধু <span class=\"hljs-title class_\">Admin<\/span> পারে */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Customer<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> placeOrder() { /* শুধু <span class=\"hljs-title class_\">Customer<\/span> পারে */ }\n}\n\n<span class=\"hljs-comment\">// Java-তে একটাই parent (single inheritance)।<\/span>\n<span class=\"hljs-comment\">// একাধিক ক্ষমতা লাগলে interface ব্যবহার করুন।<\/span><\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title class_\">Email<\/span>;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Login() =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">$\"{Email} logged in\"<\/span>);\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Admin<\/span> : <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> BanUser(<span class=\"hljs-title class_\">User<\/span> u) { /* শুধু <span class=\"hljs-title class_\">Admin<\/span> পারে */ }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Customer<\/span> : <span class=\"hljs-title class_\">User<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> PlaceOrder() { /* শুধু <span class=\"hljs-title class_\">Customer<\/span> পারে */ }\n}\n\n<span class=\"hljs-comment\">// C#-এও একটাই parent (single inheritance)।<\/span>\n<span class=\"hljs-comment\">// একাধিক ক্ষমতা লাগলে interface ব্যবহার করুন।<\/span><\/code><\/pre><\/div><\/div><div class=\"callout tip\"><div class=\"callout-title\">Short note<\/div><p>Inheritance = <strong>is-a<\/strong> সম্পর্ক (Dog <em>is an<\/em> Animal)। সুবিধা: code reuse। সাবধান: <em>has-a<\/em> হলে inheritance নয়, <strong>composition<\/strong> ব্যবহার করুন; আর Java/C# দুটোতেই একাধিক class inherit করা যায় না (Diamond Problem এড়াতে)।<\/p><\/div><\/div><\/details><details class=\"ih\"><summary>Polymorphism — একই মেথড, ভিন্ন আচরণ<\/summary><div class=\"ih-body\"><div class=\"ih-tabs\"><button type=\"button\" class=\"ih-tab active\">Payment (Overriding)<\/button><button type=\"button\" class=\"ih-tab\">Overloading<\/button><button type=\"button\" class=\"ih-tab\">Notification List<\/button><\/div><div class=\"ih-pane active\"><p><code>pay()<\/code> একই নাম, কিন্তু Card, bKash, Cash-এর আচরণ আলাদা। কোনটা চলবে তা <strong>runtime<\/strong>-এ ঠিক হয়। <code>if/else<\/code> লাগে না।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: type দেখে if/else<\/span>\n<span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-built_in\">String<\/span> type, <span class=\"hljs-built_in\">double<\/span> amt) {\n    <span class=\"hljs-keyword\">if<\/span> (type.equals(<span class=\"hljs-string\">\"card\"<\/span>)) { /* ... */ }\n    <span class=\"hljs-keyword\">else<\/span> <span class=\"hljs-keyword\">if<\/span> (type.equals(<span class=\"hljs-string\">\"bkash\"<\/span>)) { /* ... */ }\n}\n\n<span class=\"hljs-comment\">// ✅ With: method overriding<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Payment<\/span> {\n    <span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-built_in\">double<\/span> amt) { System.out.println(<span class=\"hljs-string\">\"Paying \"<\/span> + amt); }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">CardPayment<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">Payment<\/span> {\n    @<span class=\"hljs-title class_\">Override<\/span> <span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-built_in\">double<\/span> amt) { System.out.println(<span class=\"hljs-string\">\"Card: \"<\/span> + amt); }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">BkashPayment<\/span> <span class=\"hljs-keyword\">extends<\/span> <span class=\"hljs-title class_\">Payment<\/span> {\n    @<span class=\"hljs-title class_\">Override<\/span> <span class=\"hljs-keyword\">void<\/span> pay(<span class=\"hljs-built_in\">double<\/span> amt) { System.out.println(<span class=\"hljs-string\">\"bKash: \"<\/span> + amt); }\n}\n\n<span class=\"hljs-title class_\">Payment<\/span> p = <span class=\"hljs-keyword\">new<\/span> BkashPayment();\np.pay(<span class=\"hljs-number\">500<\/span>);          <span class=\"hljs-comment\">// \"bKash: 500\" — runtime-এ ঠিক হলো<\/span><\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: type দেখে if/else<\/span>\n<span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-built_in\">string<\/span> type, <span class=\"hljs-built_in\">decimal<\/span> amt) {\n    <span class=\"hljs-keyword\">if<\/span> (type == <span class=\"hljs-string\">\"card\"<\/span>) { /* ... */ }\n    <span class=\"hljs-keyword\">else<\/span> <span class=\"hljs-keyword\">if<\/span> (type == <span class=\"hljs-string\">\"bkash\"<\/span>) { /* ... */ }\n}\n\n<span class=\"hljs-comment\">// ✅ With: method overriding<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Payment<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">virtual<\/span> <span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-built_in\">decimal<\/span> amt) =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">$\"Paying {amt}\"<\/span>);\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">CardPayment<\/span> : <span class=\"hljs-title class_\">Payment<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-built_in\">decimal<\/span> amt) =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">$\"Card: {amt}\"<\/span>);\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">BkashPayment<\/span> : <span class=\"hljs-title class_\">Payment<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">override<\/span> <span class=\"hljs-keyword\">void<\/span> Pay(<span class=\"hljs-built_in\">decimal<\/span> amt) =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">$\"bKash: {amt}\"<\/span>);\n}\n\n<span class=\"hljs-title class_\">Payment<\/span> p = <span class=\"hljs-keyword\">new<\/span> BkashPayment();\np.Pay(<span class=\"hljs-number\">500<\/span>);          <span class=\"hljs-comment\">// \"bKash: 500\" — runtime-এ ঠিক হলো<\/span><\/code><\/pre><\/div><\/div><div class=\"ih-pane\"><p>একই নামের মেথড, ভিন্ন parameter। কোনটা চলবে তা <strong>compile time<\/strong>-এই ঠিক হয়। যেমন <code>log(String)<\/code>, <code>log(String, int)<\/code>।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: প্রতিটার আলাদা নাম<\/span>\n<span class=\"hljs-built_in\">double<\/span> addInts(<span class=\"hljs-built_in\">int<\/span> a, <span class=\"hljs-built_in\">int<\/span> b)       { <span class=\"hljs-keyword\">return<\/span> a + b; }\n<span class=\"hljs-built_in\">double<\/span> addDoubles(<span class=\"hljs-built_in\">double<\/span> a, <span class=\"hljs-built_in\">double<\/span> b) { <span class=\"hljs-keyword\">return<\/span> a + b; }\n\n<span class=\"hljs-comment\">// ✅ With: method overloading<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Calculator<\/span> {\n    <span class=\"hljs-built_in\">int<\/span> add(<span class=\"hljs-built_in\">int<\/span> a, <span class=\"hljs-built_in\">int<\/span> b)             { <span class=\"hljs-keyword\">return<\/span> a + b; }\n    <span class=\"hljs-built_in\">double<\/span> add(<span class=\"hljs-built_in\">double<\/span> a, <span class=\"hljs-built_in\">double<\/span> b)    { <span class=\"hljs-keyword\">return<\/span> a + b; }\n    <span class=\"hljs-built_in\">int<\/span> add(<span class=\"hljs-built_in\">int<\/span> a, <span class=\"hljs-built_in\">int<\/span> b, <span class=\"hljs-built_in\">int<\/span> c)      { <span class=\"hljs-keyword\">return<\/span> a + b + c; }\n}\n\n<span class=\"hljs-title class_\">Calculator<\/span> c = <span class=\"hljs-keyword\">new<\/span> Calculator();\nc.add(<span class=\"hljs-number\">2<\/span>, <span class=\"hljs-number\">3<\/span>);        <span class=\"hljs-comment\">// int version<\/span>\nc.add(<span class=\"hljs-number\">2.5<\/span>, <span class=\"hljs-number\">3.5<\/span>);    <span class=\"hljs-comment\">// double version<\/span>\nc.add(<span class=\"hljs-number\">1<\/span>, <span class=\"hljs-number\">2<\/span>, <span class=\"hljs-number\">3<\/span>);     <span class=\"hljs-comment\">// তিন parameter<\/span><\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// ❌ Without: প্রতিটার আলাদা নাম<\/span>\n<span class=\"hljs-built_in\">decimal<\/span> AddInts(<span class=\"hljs-built_in\">int<\/span> a, <span class=\"hljs-built_in\">int<\/span> b)        =&gt; a + b;\n<span class=\"hljs-built_in\">decimal<\/span> AddDoubles(<span class=\"hljs-built_in\">double<\/span> a, <span class=\"hljs-built_in\">double<\/span> b) =&gt; (<span class=\"hljs-built_in\">decimal<\/span>)(a + b);\n\n<span class=\"hljs-comment\">// ✅ With: method overloading<\/span>\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">Calculator<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">int<\/span>    Add(<span class=\"hljs-built_in\">int<\/span> a, <span class=\"hljs-built_in\">int<\/span> b)           =&gt; a + b;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">double<\/span> Add(<span class=\"hljs-built_in\">double<\/span> a, <span class=\"hljs-built_in\">double<\/span> b)     =&gt; a + b;\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">int<\/span>    Add(<span class=\"hljs-built_in\">int<\/span> a, <span class=\"hljs-built_in\">int<\/span> b, <span class=\"hljs-built_in\">int<\/span> c)    =&gt; a + b + c;\n}\n\n<span class=\"hljs-built_in\">var<\/span> c = <span class=\"hljs-keyword\">new<\/span> Calculator();\nc.Add(<span class=\"hljs-number\">2<\/span>, <span class=\"hljs-number\">3<\/span>);        <span class=\"hljs-comment\">// int version<\/span>\nc.Add(<span class=\"hljs-number\">2.5<\/span>, <span class=\"hljs-number\">3.5<\/span>);    <span class=\"hljs-comment\">// double version<\/span>\nc.Add(<span class=\"hljs-number\">1<\/span>, <span class=\"hljs-number\">2<\/span>, <span class=\"hljs-number\">3<\/span>);     <span class=\"hljs-comment\">// তিন parameter<\/span><\/code><\/pre><\/div><\/div><div class=\"ih-pane\"><p><code>Notifier<\/code> type-এর list-এ Email, SMS, Push মিলিয়ে রেখে এক লুপে সবাইকে <code>send()<\/code> — নতুন type এলে লুপ বদলাতে হয় না।<\/p><div class=\"ih-langs\"><button type=\"button\" class=\"ih-lang active\">Java<\/button><button type=\"button\" class=\"ih-lang\">C#<\/button><\/div><div class=\"code ih-code active\"><div class=\"code-bar\"><span>Example.java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">interface<\/span> <span class=\"hljs-title class_\">Notifier<\/span> { <span class=\"hljs-keyword\">void<\/span> send(<span class=\"hljs-built_in\">String<\/span> msg); }\n\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">EmailNotifier<\/span> <span class=\"hljs-keyword\">implements<\/span> <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> send(<span class=\"hljs-built_in\">String<\/span> msg) { System.out.println(<span class=\"hljs-string\">\"Email: \"<\/span> + msg); }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">SmsNotifier<\/span> <span class=\"hljs-keyword\">implements<\/span> <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> send(<span class=\"hljs-built_in\">String<\/span> msg) { System.out.println(<span class=\"hljs-string\">\"SMS: \"<\/span> + msg); }\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">PushNotifier<\/span> <span class=\"hljs-keyword\">implements<\/span> <span class=\"hljs-title class_\">Notifier<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> send(<span class=\"hljs-built_in\">String<\/span> msg) { System.out.println(<span class=\"hljs-string\">\"Push: \"<\/span> + msg); }\n}\n\n<span class=\"hljs-title class_\">List<\/span>&lt;<span class=\"hljs-title class_\">Notifier<\/span>&gt; all = <span class=\"hljs-title class_\">List<\/span>.of(<span class=\"hljs-keyword\">new<\/span> EmailNotifier(), <span class=\"hljs-keyword\">new<\/span> SmsNotifier(), <span class=\"hljs-keyword\">new<\/span> PushNotifier());\nfor (<span class=\"hljs-title class_\">Notifier<\/span> n : all) {\n    n.send(<span class=\"hljs-string\">\"Order shipped\"<\/span>);   <span class=\"hljs-comment\">// প্রতিটা নিজের মতো কাজ করে<\/span>\n}<\/code><\/pre><\/div><div class=\"code ih-code\"><div class=\"code-bar\"><span>Example.cs<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">interface<\/span> <span class=\"hljs-title class_\">INotifier<\/span> { <span class=\"hljs-keyword\">void<\/span> Send(<span class=\"hljs-built_in\">string<\/span> msg); }\n\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">EmailNotifier<\/span> : <span class=\"hljs-title class_\">INotifier<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Send(<span class=\"hljs-built_in\">string<\/span> msg) =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">$\"Email: {msg}\"<\/span>);\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">SmsNotifier<\/span> : <span class=\"hljs-title class_\">INotifier<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Send(<span class=\"hljs-built_in\">string<\/span> msg) =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">$\"SMS: {msg}\"<\/span>);\n}\n<span class=\"hljs-keyword\">class<\/span> <span class=\"hljs-title class_\">PushNotifier<\/span> : <span class=\"hljs-title class_\">INotifier<\/span> {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> Send(<span class=\"hljs-built_in\">string<\/span> msg) =&gt; <span class=\"hljs-title class_\">Console<\/span>.WriteLine(<span class=\"hljs-string\">$\"Push: {msg}\"<\/span>);\n}\n\n<span class=\"hljs-built_in\">var<\/span> all = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title class_\">List<\/span>&lt;<span class=\"hljs-title class_\">INotifier<\/span>&gt; { <span class=\"hljs-keyword\">new<\/span> EmailNotifier(), <span class=\"hljs-keyword\">new<\/span> SmsNotifier(), <span class=\"hljs-keyword\">new<\/span> PushNotifier() };\nforeach (<span class=\"hljs-built_in\">var<\/span> n in all) {\n    n.Send(<span class=\"hljs-string\">\"Order shipped\"<\/span>);   <span class=\"hljs-comment\">// প্রতিটা নিজের মতো কাজ করে<\/span>\n}<\/code><\/pre><\/div><\/div><div class=\"callout tip\"><div class=\"callout-title\">Short note<\/div><p>Polymorphism দুই রকম: <strong>Compile-time<\/strong> = Overloading (একই ক্লাসে, ভিন্ন parameter); <strong>Runtime<\/strong> = Overriding (Parent reference, Child object)। C#-এ <code>virtual<\/code> + <code>override<\/code> লাগে, Java-তে সব মেথড ডিফল্টে overridable।<\/p><\/div><\/div><\/details><h3>উত্তর দেওয়ার ৩-ধাপ ফর্মুলা<\/h3><ol><li><strong>Definition<\/strong> — এক লাইনে।<\/li><li><strong>Real-world example<\/strong> — Bank Account / Payment / Notification-এর মতো চেনা উদাহরণ।<\/li><li><strong>Code বা সুবিধা<\/strong> — ছোট কোড দেখান বা বলুন কী লাভ (security, reuse, flexibility)।<\/li><\/ol>\n<hr>\n<h2>C# থেকে Java<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\">C#<\/th><th align=\"left\">Java<\/th><\/tr><\/thead><tbody><tr><td align=\"left\"><code>class Dog : Animal<\/code><\/td><td align=\"left\"><code>class Dog extends Animal<\/code><\/td><\/tr><tr><td align=\"left\"><code>class A : IShape<\/code><\/td><td align=\"left\"><code>class A implements Shape<\/code><\/td><\/tr><tr><td align=\"left\"><code>base(name)<\/code><\/td><td align=\"left\"><code>super(name)<\/code><\/td><\/tr><tr><td align=\"left\"><code>virtual<\/code> / <code>override<\/code><\/td><td align=\"left\">সব মেথড ডিফল্টে virtual; <code>@Override<\/code><\/td><\/tr><tr><td align=\"left\"><code>sealed class<\/code><\/td><td align=\"left\"><code>final class<\/code><\/td><\/tr><tr><td align=\"left\"><code>internal<\/code><\/td><td align=\"left\">package-private (কোনো keyword না)<\/td><\/tr><tr><td align=\"left\">Property (<code>get; set;<\/code>)<\/td><td align=\"left\">getter / setter মেথড<\/td><\/tr><\/tbody><\/table><\/div>","class-access/sealed-class/SealedClass.md":"<h1>Sealed Class vs Final Class in OOP<\/h1>\n<p>অবজেক্ট-ওরিয়েন্টিড প্রোগ্রামিংয়ে (OOP) ইনহেরিটেন্স বা উত্তরাধিকার নিয়ন্ত্রণ করার জন্য <strong>Sealed Class<\/strong> এবং <strong>Final Class<\/strong> ব্যবহার করা হয়। এই কী-ওয়ার্ডগুলো মূলত কোনো ক্লাসের ইনহেরিট করার ক্ষমতা সীমিত বা বন্ধ করে দেয়।<\/p>\n<p>ল্যাঙ্গুয়েজ ভেদে (যেমন C# এবং Java) এগুলোর নামের পার্থক্য রয়েছে, এবং আধুনিক সংস্করণে এদের ধারণায় কিছুটা ভিন্নতা এসেছে। নিচে বিস্তারিত আলোচনা করা হলো:<\/p>\n<hr>\n<h2>১. Java-তে <code>final<\/code> ক্লাস এবং C#-এ <code>sealed<\/code> ক্লাস<\/h2>\n<p>এই দুটি কী-ওয়ার্ডের মূল কাজ একই—<strong>ইনহেরিটেন্স সম্পূর্ণ বন্ধ করা<\/strong>। যদি কোনো ক্লাসকে <code>final<\/code> (Java) বা <code>sealed<\/code> (C#) হিসেবে ঘোষণা করা হয়, তবে অন্য কোনো ক্লাস সেটিকে ইনহেরিট বা এক্সটেন্ড (Extend) করতে পারবে না।<\/p>\n<h3>C# Example (<code>sealed<\/code>):<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">sealed<\/span> <span class=\"hljs-keyword\">class<\/span> DatabaseConfig\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> ConnectionString { <span class=\"hljs-keyword\">get<\/span>; <span class=\"hljs-keyword\">set<\/span>; }\n}\n\n<span class=\"hljs-comment\">// এটি কম্পাইল এরর দেবে!<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CustomConfig : DatabaseConfig \n{\n    <span class=\"hljs-comment\">// Error: 'CustomConfig': cannot derive from sealed type 'DatabaseConfig'<\/span>\n}<\/code><\/pre><\/div>\n<h3>Java Example (<code>final<\/code>):<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">final<\/span> <span class=\"hljs-keyword\">class<\/span> StringHelper {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> String reverse(String input) {\n        <span class=\"hljs-keyword\">return<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">StringBuilder<\/span>(input).reverse().toString();\n    }\n}\n\n<span class=\"hljs-comment\">// এটি কম্পাইল এরর দেবে!<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> CustomStringHelper <span class=\"hljs-keyword\">extends<\/span> StringHelper {\n    <span class=\"hljs-comment\">// Error: cannot inherit from final StringHelper<\/span>\n}<\/code><\/pre><\/div>\n<hr>\n<h2>২. Java 17+ এবং Kotlin-এ <code>sealed<\/code> ক্লাস (সীমিত উত্তরাধিকার)<\/h2>\n<p>আধুনিক Java (Java 17+) এবং Kotlin-এ <code>sealed<\/code> ক্লাস একটি নতুন ধারণা নিয়ে এসেছে। এখানে ইনহেরিটেন্স সম্পূর্ণ বন্ধ করা হয় না, বরং <strong>নিয়ন্ত্রিত<\/strong> করা হয়।<\/p>\n<p>একটি <code>sealed<\/code> ক্লাস অনুমতি দেয় যে, শুধুমাত্র নির্দিষ্ট কয়েকটি ক্লাসই তাকে ইনহেরিট করতে পারবে এবং অন্য কোনো ক্লাস তা পারবে না।<\/p>\n<h3>Java 17+ Example:<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// শুধুমাত্র Car এবং Truck ক্লাসই Vehicle-কে ইনহেরিট করতে পারবে<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">sealed<\/span> <span class=\"hljs-keyword\">class<\/span> Vehicle <span class=\"hljs-keyword\">permits<\/span> Car, Truck {\n    <span class=\"hljs-comment\">// ...<\/span>\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">final<\/span> <span class=\"hljs-keyword\">class<\/span> Car <span class=\"hljs-keyword\">extends<\/span> Vehicle {\n    <span class=\"hljs-comment\">// সফলভাবে ইনহেরিট করবে<\/span>\n}\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">final<\/span> <span class=\"hljs-keyword\">class<\/span> Truck <span class=\"hljs-keyword\">extends<\/span> Vehicle {\n    <span class=\"hljs-comment\">// সফলভাবে ইনহেরিট করবে<\/span>\n}\n\n<span class=\"hljs-comment\">// এটি কম্পাইল এরর দেবে!<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Bicycle <span class=\"hljs-keyword\">extends<\/span> Vehicle {\n    <span class=\"hljs-comment\">// Error: class is not allowed in the permits list<\/span>\n}<\/code><\/pre><\/div>\n<hr>\n<h2>কেন এবং কখন এগুলো ব্যবহার করবেন? (Use Cases &amp; Benefits)<\/h2>\n<ol><li><strong>নিরাপত্তা নিশ্চিত করা (Security):<\/strong> সিস্টেমের কিছু গুরুত্বপূর্ণ মেকানিজম বা ডাটা ক্লাসকে আমরা চাই না কেউ ইনহেরিট করে তার মেথডগুলোকে ওভাররাইড (Override) করুক। <em>যেমন: Java ও C# এর বিল্ট-ইন <code>String<\/code> ক্লাসটি <code>final/sealed<\/code> করা থাকে, যাতে কেউ কাস্টম স্ট্রিং ক্লাস বানিয়ে মেমরিতে ডেঞ্জারাস কোনো আচরণ তৈরি করতে না পারে।<\/em><\/li><li><strong>পারফরম্যান্স অপ্টিমাইজেশন (Performance):<\/strong> কম্পাইলার যখন দেখে কোনো ক্লাস <code>final<\/code> বা <code>sealed<\/code>, তখন সে নিশ্চিত হয় যে এই ক্লাসের কোনো চাইল্ড ক্লাস নেই। ফলে কম্পাইলার রানটাইমে মেথড রেজোলিউশন দ্রুত করতে পারে (যাকে <em>devirtualization<\/em> বলা হয়)।<\/li><li><strong>এপিআই ডিজাইন এবং ডোমেইন কন্ট্রোল:<\/strong> আপনি যদি কোনো লাইব্রেরি তৈরি করেন, এবং চান ব্যবহারকারীরা আপনার নির্দিষ্ট করা ফ্রেমওয়ার্কের বাইরে ক্লাসগুলোকে ইনহেরিট না করুক, তখন এটি দরকারি।<\/li><\/ol>\n<hr>\n<h2>সংক্ষেপে তুলনা (At a Glance)<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th align=\"left\">ল্যাঙ্গুয়েজ<\/th><th align=\"left\">কী-ওয়ার্ড<\/th><th align=\"left\">ইনহেরিটেন্সের নিয়ম<\/th><\/tr><\/thead><tbody><tr><td align=\"left\"><strong>Java<\/strong><\/td><td align=\"left\"><code>final<\/code><\/td><td align=\"left\">কোনোভাবেই ইনহেরিট করা যাবে না।<\/td><\/tr><tr><td align=\"left\"><strong>Java 17+<\/strong><\/td><td align=\"left\"><code>sealed<\/code><\/td><td align=\"left\">শুধুমাত্র <code>permits<\/code> তালিকায় থাকা ক্লাসগুলোই ইনহেরিট করতে পারবে।<\/td><\/tr><tr><td align=\"left\"><strong>C#<\/strong><\/td><td align=\"left\"><code>sealed<\/code><\/td><td align=\"left\">কোনোভাবেই ইনহেরিট করা যাবে না।<\/td><\/tr><tr><td align=\"left\"><strong>Kotlin<\/strong><\/td><td align=\"left\"><code>sealed<\/code><\/td><td align=\"left\">একই ফাইলের/মডিউলের নির্দিষ্ট সাবক্লাস ছাড়া অন্য কেউ ইনহেরিট করতে পারবে না।<\/td><\/tr><\/tbody><\/table><\/div>","class-access/private-class/PrivateClass.md":"<h1>Private Class<\/h1>\n<p>অবজেক্ট-ওরিয়েন্টিড প্রোগ্রামিং (OOP) এ <strong>Private Class<\/strong> হলো এমন একটি ক্লাস যার অ্যাক্সেসিবিলিটি শুধুমাত্র তার প্যারেন্ট বা আউটার (Outer) ক্লাসের ভেতরেই সীমাবদ্ধ থাকে।<\/p>\n<p>সাধারণত Java বা C# এর মতো প্রোগ্রামিং ল্যাঙ্গুয়েজে সরাসরি কোনো ফাইলের ভেতরে বা টপ-লেভেলে (Top-level) কোনো ক্লাসকে <code>private<\/code> করা যায় না। তবে একটি ক্লাসের ভেতরে অন্য আরেকটি ক্লাস ডিক্লেয়ার করলে (যাকে <strong>Nested Class<\/strong> বা <strong>Inner Class<\/strong> বলা হয়), সেটিকে <code>private<\/code> করা সম্ভব।<\/p>\n<h3>কেন ডিক্লেয়ার করা যায় বা যায় না? (Why it can/cannot be declared)<\/h3>\n<h4>১. টপ-লেভেল ক্লাস (Top-level Class) কেন <code>private<\/code> করা যায় না?<\/h4>\n<p>একটি সাধারণ ক্লাস যা সরাসরি ফাইলে বা নেমস্পেস/প্যাকেজের অধীনে থাকে, তাকে টপ-লেভেল ক্লাস বলে। এটিকে <code>private<\/code> করা যায় না, কারণ:<\/p>\n<ul><li><strong>ক্লাসটি সম্পূর্ণ অব্যবহারযোগ্য (Useless) হয়ে পড়বে:<\/strong> প্রোগ্রামিং ল্যাঙ্গুয়েজের নিয়মানুযায়ী, <code>private<\/code> মেম্বার শুধুমাত্র তার নিজস্ব ডিক্লেয়ার্ড স্কোপের (Scope) ভেতর অ্যাক্সেস করা যায়। একটি টপ-লেভেল ক্লাসের প্যারেন্ট স্কোপ হলো তার ফাইল বা প্যাকেজ। যদি কোনো টপ-লেভেল ক্লাসকে <code>private<\/code> করা হতো, তবে সেই ক্লাসের বাইরে অন্য কোনো কোড বা ক্লাস তার অস্তিত্বই জানতে পারতো না। ফলে সেই ক্লাসের কোনো অবজেক্ট তৈরি করা বা তাকে ব্যবহার করা অসম্ভব হয়ে যেত।<\/li><li><strong>কম্পাইলার ও আর্কিটেকচারাল ডিজাইন:<\/strong> অবজেক্ট-ওরিয়েন্টেড ডিজাইনে ক্লাস তৈরি করা হয় অন্য কোডের সাথে ইন্টারঅ্যাক্ট করার জন্য। যেহেতু বাইরের কোনো ক্লাস থেকে এটিকে ব্যবহার করার সুযোগ থাকত না, তাই কম্পাইলার ডিজাইনাররা টপ-লেভেল ক্লাসকে <code>private<\/code> করার অনুমতি দেননি।<\/li><\/ul>\n<p><em>(টপ-লেভেল ক্লাসের জন্য তাই শুধুমাত্র <code>public<\/code> অথবা প্যাকেজ/প্রজেক্ট লেভেলের অ্যাক্সেস মডিফায়ার যেমন Java-তে <code>default<\/code> (package-private) এবং C#-এ <code>internal<\/code> ব্যবহারের অনুমতি দেওয়া হয়)।<\/em><\/p>\n<h4>২. নেস্টেড ক্লাস (Nested Class) কেন <code>private<\/code> করা যায়?<\/h4>\n<p>যখন কোনো ক্লাস অন্য একটি ক্লাসের ভেতরে ডিক্লেয়ার করা হয়, তাকে নেস্টেড বা ইনার ক্লাস বলে। এটিকে <code>private<\/code> করা যায়, কারণ:<\/p>\n<ul><li><strong>আউটার ক্লাসের ভেতরে ব্যবহারের সুযোগ থাকে:<\/strong> যেহেতু এটি অন্য একটি ক্লাসের ভেতরে রয়েছে, তাই <code>private<\/code> করা হলেও আউটার ক্লাসটি (Outer Class) তার ভেতরের মেথডে এই প্রাইভেট ক্লাসের অবজেক্ট তৈরি করতে পারে এবং এর কাজ ব্যবহার করতে পারে।<\/li><li><strong>ইনফরমেশন হাইডিং বা এনক্যাপসুলেশন (Encapsulation):<\/strong> অনেক সময় এমন ক্লাসের প্রয়োজন হয় যা শুধুমাত্র একটি নির্দিষ্ট ক্লাসের লজিক সম্পন্ন করতে সাহায্য করবে এবং বাইরের কোনো ক্লাসের তার সম্পর্কে জানার প্রয়োজন নেই। যেমন: <code>LinkedList<\/code> ক্লাসের ভেতরে <code>Node<\/code> ক্লাস। <code>LinkedList<\/code> নিজেই <code>Node<\/code> তৈরি ও ব্যবহার করে, কিন্তু বাইরের কোনো কোড থেকে সরাসরি <code>Node<\/code> অবজেক্ট অ্যাক্সেস করতে দেওয়ার প্রয়োজন নেই।<\/li><\/ul>\n<p><strong>সংক্ষেপে:<\/strong><\/p>\n<ul><li><strong>টপ-লেভেল ক্লাস:<\/strong> <code>private<\/code> করা যায় না, কারণ তাহলে সেটিকে কোথাও থেকেই অ্যাক্সেস বা ব্যবহার করা যাবে না।<\/li><li><strong>নেস্টেড ক্লাস:<\/strong> <code>private<\/code> করা যায়, কারণ বাইরের সবার জন্য বন্ধ থাকলেও আউটার ক্লাসটি নিজে সেটিকে ভেতরে ব্যবহার করতে পারে।<\/li><\/ul>\n<hr>\n<h2>কিভাবে ডিক্লেয়ার করা হয়? (Syntax &amp; Examples)<\/h2>\n<h3>C# Example:<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Car \n{\n    <span class=\"hljs-comment\">// Private Nested Class<\/span>\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">class<\/span> Engine \n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Start<\/span>() \n        {\n            Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Engine started...\"<\/span>);\n        }\n    }\n\n    <span class=\"hljs-keyword\">private<\/span> Engine _engine;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-title function_\">Car<\/span>() \n    {\n        _engine = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Engine<\/span>(); <span class=\"hljs-comment\">// শুধুমাত্র Car ক্লাসই Engine ক্লাসটি ব্যবহার করতে পারবে<\/span>\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Drive<\/span>() \n    {\n        _engine.<span class=\"hljs-title function_\">Start<\/span>();\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Car is moving...\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<h3>Java Example:<\/h3>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> LinkedList {\n    <span class=\"hljs-comment\">// Private Nested Class<\/span>\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">class<\/span> Node {\n        <span class=\"hljs-built_in\">int<\/span> data;\n        Node next;\n\n        <span class=\"hljs-title function_\">Node<\/span>(<span class=\"hljs-built_in\">int<\/span> data) {\n            <span class=\"hljs-keyword\">this<\/span>.data = data;\n            <span class=\"hljs-keyword\">this<\/span>.next = <span class=\"hljs-keyword\">null<\/span>;\n        }\n    }\n\n    <span class=\"hljs-keyword\">private<\/span> Node head;\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> add(<span class=\"hljs-built_in\">int<\/span> value) {\n        Node newNode = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Node<\/span>(value);\n        <span class=\"hljs-keyword\">if<\/span> (head == <span class=\"hljs-keyword\">null<\/span>) {\n            head = newNode;\n        } <span class=\"hljs-keyword\">else<\/span> {\n            Node temp = head;\n            <span class=\"hljs-keyword\">while<\/span> (temp.next != <span class=\"hljs-keyword\">null<\/span>) {\n                temp = temp.next;\n            }\n            temp.next = newNode;\n        }\n    }\n}<\/code><\/pre><\/div>\n<hr>\n<h2>Private Class এর সুবিধাসমূহ (Advantages)<\/h2>\n<ol><li><strong>উন্নত এনক্যাপসুলেশন (Enhanced Encapsulation):<\/strong> যে ক্লাস বা লজিকটি বাইরের অন্যান্য ক্লাসের জানার প্রয়োজন নেই, সেটিকে সম্পূর্ণরূপে লুকিয়ে ফেলা যায় (Information Hiding)।<\/li><li><strong>কোড মেইনটেইনেবিলিটি (Better Maintainability):<\/strong> যেহেতু ক্লাসটি নির্দিষ্ট একটি ক্লাসের বাইরে ব্যবহার করা যায় না, তাই এই ক্লাসে কোনো পরিবর্তন আনলে বাইরের অন্যান্য কোডে কোনো প্রভাব পড়ে না।<\/li><li><strong>লজিক্যাল গ্রুপিং (Logical Grouping):<\/strong> যদি কোনো ক্লাস শুধুমাত্র অন্য একটি ক্লাসের কাজের সহায়তার জন্য প্রয়োজন হয়, তবে সেটিকে আলাদা ফাইলে না লিখে একই ফাইলের ভেতরে Nested Private Class হিসেবে রাখা পরিষ্কার কোড স্ট্রাকচার তৈরি করে।<\/li><\/ol>\n<hr>\n<h2>বাস্তবমুখী ব্যবহার (Real-world Use Cases)<\/h2>\n<ul><li><strong>ডাটা স্ট্রাকচারের নোড (Data Structure Nodes):<\/strong> <code>LinkedList<\/code>, <code>Tree<\/code> বা <code>Graph<\/code> ডিক্লেয়ার করার সময় তাদের ভেতরের <code>Node<\/code> বা <code>Vertex<\/code> ক্লাসকে <code>private<\/code> রাখা হয়, কারণ বাইরের ক্লাসের সরাসরি নোড অ্যাক্সেস করার প্রয়োজন নেই।<\/li><li><strong>হেল্পার ক্লাস (Helper / Utility Classes):<\/strong> ধরা যাক, একটি ক্লাসের কাজ সম্পন্ন করার জন্য একটি নির্দিষ্ট ফরম্যাটার বা ডাটা কনভার্টার ক্লাসের প্রয়োজন যা অন্য কোথাও লাগবে না। সেক্ষেত্রে Private Class বেশ উপযোগী।<\/li><li><strong>স্টেট প্যাটার্ন বা ইন্টারনাল ওয়ার্কার (Internal Worker / States):<\/strong> কোনো অ্যাপ্লিকেশনের অভ্যন্তরীণ ব্যাকগ্রাউন্ড প্রসেস বা কোনো অবজেক্টের স্টেট পরিবর্তনের লজিক বাইরের অ্যাপ থেকে আড়াল রাখতে এটি ব্যবহার করা হয়।<\/li><\/ul>","class-access/private-constructor/PrivateConstructor.md":"<h1>Private Constructor and Default Constructor in OOP<\/h1>\n<p>অবজেক্ট-ওরিয়েন্টিড প্রোগ্রামিংয়ে (OOP) অবজেক্ট তৈরির প্রক্রিয়া এবং তার অ্যাক্সেস নিয়ন্ত্রণ করার জন্য কন্সট্রাকটর (Constructor) অত্যন্ত গুরুত্বপূর্ণ ভূমিকা পালন করে। নিচে <strong>Default Constructor<\/strong> এবং <strong>Private Constructor<\/strong> সম্পর্কে বিস্তারিত আলোচনা করা হলো:<\/p>\n<hr>\n<h2>১. Default Constructor কী? (কন্সট্রাকটর ডিফাইন না করলে কী হয়?)<\/h2>\n<p>যদি কোনো ক্লাসের ভেতর আমরা নিজেরা কোনো কন্সট্রাকটর ডিক্লেয়ার বা ডিফাইন না করি, তবে কম্পাইলার স্বয়ংক্রিয়ভাবে ক্লাসটির জন্য একটি প্যারামিটারহীন (Parameterless) এবং পাবলিক কন্সট্রাকটর তৈরি করে দেয়। একেই <strong>Default Constructor<\/strong> বলে।<\/p>\n<h3>বৈশিষ্ট্য:<\/h3>\n<ul><li>এটি ক্লাসের অবজেক্ট তৈরি করতে সাহায্য করে।<\/li><li>এটি সাধারণত মেম্বার ভেরিয়েবলগুলোকে তাদের ডিফল্ট মান (যেমন: সংখ্যার জন্য <code>0<\/code>, অবজেক্টের জন্য <code>null<\/code>) দিয়ে ইনিশিয়ালাইজ করে।<\/li><\/ul>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-comment\">// আমরা কোনো কন্সট্রাকটর লিখিনি<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Student {\n    <span class=\"hljs-keyword\">public<\/span> String name;\n}\n\n<span class=\"hljs-comment\">// কিন্তু কম্পাইলার ব্যাকগ্রাউন্ডে এটি তৈরি করে নিয়েছে:<\/span>\n<span class=\"hljs-comment\">// public Student() { }<\/span>\n\n<span class=\"hljs-comment\">// তাই আমরা সরাসরি অবজেক্ট তৈরি করতে পারি:<\/span>\nStudent s = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Student<\/span>(); <\/code><\/pre><\/div>\n<p>⚠️ <strong>মনে রাখবেন:<\/strong> যদি আপনি নিজে যেকোনো একটি কন্সট্রাকটর (যেমন: প্যারামিটারসহ কন্সট্রাকটর) তৈরি করেন, তবে কম্পাইলার আর কোনো default কন্সট্রাকটর নিজে থেকে তৈরি করবে না। সেক্ষেত্রে আপনাকে ম্যানুয়ালি প্যারামিটারহীন কন্সট্রাকটর লিখতে হবে যদি আপনি <code>new Student()<\/code> ব্যবহার করতে চান।<\/p>\n<hr>\n<h2>২. Private Constructor কী এবং কীভাবে কাজ করে?<\/h2>\n<p>যখন কোনো কন্সট্রাকটরের আগে <code>private<\/code> অ্যাক্সেস মডিফায়ার ব্যবহার করা হয়, তখন তাকে <strong>Private Constructor<\/strong> বলে।<\/p>\n<ul><li><strong>কীভাবে কাজ করে:<\/strong> কন্সট্রাকটরটি <code>private<\/code> হওয়ার কারণে ক্লাসের বাইরে থেকে সরাসরি <code>new MyClass()<\/code> লিখে ওই ক্লাসের অবজেক্ট তৈরি করা যায় না। অবজেক্ট তৈরির অ্যাক্সেস শুধুমাত্র ওই ক্লাসের ভেতরের মেম্বার বা মেথডগুলোর কাছেই থাকে।<\/li><\/ul>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Utility\n{\n    <span class=\"hljs-comment\">// Private Constructor<\/span>\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-title function_\">Utility<\/span>() \n    {\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">PrintMessage<\/span>()\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Hello World!\"<\/span>);\n    }\n}\n\n<span class=\"hljs-comment\">// বাইরের ক্লাস থেকে অবজেক্ট তৈরি করতে গেলে এরর আসবে:<\/span>\n<span class=\"hljs-comment\">// Utility util = new Utility(); // Compile Error: 'Utility.Utility()' is inaccessible due to its protection level<\/span><\/code><\/pre><\/div>\n<hr>\n<h2>৩. কেন এবং কখন Private Constructor ব্যবহার করতে হয়?<\/h2>\n<p>বাস্তব ক্ষেত্রে মূলত তিনটি কারণে Private Constructor ব্যবহার করা হয়:<\/p>\n<h3>ক. সিঙ্গেলটন প্যাটার্ন (Singleton Pattern)<\/h3>\n<p>যখন আমরা নিশ্চিত করতে চাই যে পুরো অ্যাপ্লিকেশনে একটি ক্লাসের <strong>শুধুমাত্র একটিই অবজেক্ট<\/strong> থাকবে (যেমন: ডাটাবেজ কানেকশন বা গ্লোবাল কনফিগারেশন ম্যানেজার)।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> DatabaseConnection\n{\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-keyword\">static<\/span> DatabaseConnection _instance;\n\n    <span class=\"hljs-comment\">// ১. কন্সট্রাকটর প্রাইভেট করা হয়েছে যাতে বাইরে থেকে কেউ new করতে না পারে<\/span>\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-title function_\">DatabaseConnection<\/span>() \n    {\n        <span class=\"hljs-comment\">// কানেকশন ইনিশিয়ালাইজেশন লজিক<\/span>\n    }\n\n    <span class=\"hljs-comment\">// ২. একটি স্ট্যাটিক মেথডের মাধ্যমে অবজেক্ট অ্যাক্সেস করা হয়<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> DatabaseConnection <span class=\"hljs-title function_\">GetInstance<\/span>()\n    {\n        <span class=\"hljs-keyword\">if<\/span> (_instance == <span class=\"hljs-keyword\">null<\/span>)\n        {\n            _instance = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">DatabaseConnection<\/span>(); <span class=\"hljs-comment\">// ক্লাসের ভেতর থেকে অবজেক্ট তৈরি সম্ভব<\/span>\n        }\n        <span class=\"hljs-keyword\">return<\/span> _instance;\n    }\n}<\/code><\/pre><\/div>\n<h3>খ. ইউটিলিটি বা হেল্পার ক্লাস (Utility/Helper Class)<\/h3>\n<p>যে ক্লাসগুলোতে শুধুমাত্র <code>static<\/code> মেথড এবং প্রোপার্টি থাকে (যেমন: গাণিতিক হিসাবনিকাশের ক্লাস বা স্ট্রিং ফরম্যাটিং ক্লাস)। এই ক্লাসগুলোর অবজেক্ট তৈরি করার কোনো প্রয়োজন নেই।<br><em>যেমন: Java-এর <code>Math<\/code> ক্লাস। আপনি কখনো <code>new Math()<\/code> তৈরি করতে পারবেন না, কারণ এর কন্সট্রাকটর প্রাইভেট করা।<\/em><\/p>\n<h3>গ. ফ্যাক্টরি মেথড (Factory Method Pattern)<\/h3>\n<p>অবজেক্ট তৈরির লজিককে সরাসরি <code>new<\/code> কী-ওয়ার্ড দিয়ে প্রকাশ না করে নির্দিষ্ট মেথডের মাধ্যমে নিয়ন্ত্রণ করতে চাইলে।<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> User {\n    <span class=\"hljs-keyword\">private<\/span> String role;\n\n    <span class=\"hljs-comment\">// প্রাইভেট কন্সট্রাকটর<\/span>\n    <span class=\"hljs-keyword\">private<\/span> <span class=\"hljs-title function_\">User<\/span>(String role) {\n        <span class=\"hljs-keyword\">this<\/span>.role = role;\n    }\n\n    <span class=\"hljs-comment\">// ফ্যাক্টরি মেথড<\/span>\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> User createAdmin() {\n        <span class=\"hljs-keyword\">return<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">User<\/span>(<span class=\"hljs-string\">\"Admin\"<\/span>);\n    }\n\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">static<\/span> User createGuest() {\n        <span class=\"hljs-keyword\">return<\/span> <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">User<\/span>(<span class=\"hljs-string\">\"Guest\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<hr>\n<h2>সংক্ষেপে সারমর্ম (Summary)<\/h2>\n<ul><li><strong>Default Constructor:<\/strong> আপনি কন্সট্রাকটর না লিখলে কম্পাইলার নিজে থেকে একটি পাবলিক কন্সট্রাকটর তৈরি করে দেয় যাতে অবজেক্ট বানানো যায়।<\/li><li><strong>Private Constructor:<\/strong> এটি ব্যবহার করে ক্লাসের বাইরে থেকে সরাসরি <code>new<\/code> কী-ওয়ার্ড দিয়ে অবজেক্ট তৈরি করা বন্ধ করা হয়। এটি প্রধানত <strong>Singleton Pattern<\/strong>, <strong>Utility Class<\/strong>, এবং <strong>Factory Method<\/strong> এ ব্যবহৃত হয়।<\/li><\/ul>","class-access/default-internal/DefaultAndInternal.md":"<h1>Default vs Internal Class (Package/Assembly Level Access)<\/h1>\n<p>অবজেক্ট-ওরিয়েন্টিড প্রোগ্রামিংয়ে কোডের নিরাপত্তা ও মডুলারিটি বজায় রাখার জন্য অ্যাক্সেস মডিফায়ার (Access Modifier) ব্যবহার করা হয়। Java-তে <strong>Default<\/strong> (Package-Private) এবং C#-এ <strong>Internal<\/strong> প্রায় একই ধরণের ভূমিকা পালন করে, তবে তাদের কাজের স্কোপ বা পরিধি ভিন্ন।<\/p>\n<hr>\n<h2>১. Java-তে <code>default<\/code> (Package-Private) ক্লাস কী?<\/h2>\n<p>Java-তে কোনো ক্লাসের আগে যদি কোনো অ্যাক্সেস মডিফায়ার (<code>public<\/code>, <code>private<\/code>, <code>protected<\/code>) না লেখা হয়, তবে কম্পাইলার স্বয়ংক্রিয়ভাবে সেটিকে <strong>Default<\/strong> বা <strong>Package-Private<\/strong> হিসেবে ধরে নেয়।<\/p>\n<h3>অ্যাক্সেস লিমিট (Who can use it?):<\/h3>\n<ul><li>শুধুমাত্র <strong>একই প্যাকেজের (Package)<\/strong> অধীনে থাকা অন্যান্য ক্লাসগুলো এই ক্লাসটিকে দেখতে পাবে এবং ব্যবহার করতে পারবে।<\/li><li>প্যাকেজের বাইরের কোনো ক্লাস একে দেখতে বা ব্যবহার করতে পারবে না।<\/li><\/ul>\n<h3>Java Example:<\/h3>\n<p>ধরা যাক আমাদের <code>com.study.shapes<\/code> প্যাকেজে একটি ক্লাস আছে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">package<\/span> com.study.shapes;\n\n<span class=\"hljs-comment\">// কোনো public/private নেই, তাই এটি default class<\/span>\n<span class=\"hljs-keyword\">class<\/span> CircleHelper {\n    <span class=\"hljs-keyword\">void<\/span> drawCircle() {\n        System.<span class=\"hljs-keyword\">out<\/span>.println(<span class=\"hljs-string\">\"Drawing circle...\"<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p>একই প্যাকেজের আরেকটি ক্লাস <code>Circle<\/code> এটি ব্যবহার করতে পারবে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">package<\/span> com.study.shapes;\n\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Circle {\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> render() {\n        CircleHelper helper = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">CircleHelper<\/span>(); <span class=\"hljs-comment\">// সফলভাবে কাজ করবে<\/span>\n        helper.drawCircle();\n    }\n}<\/code><\/pre><\/div>\n<p>কিন্তু যদি প্যাকেজটি ভিন্ন হয় (যেমন: <code>com.study.main<\/code>), তবে সেখানে <code>CircleHelper<\/code> ব্যবহার করা যাবে না:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>java<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">package<\/span> com.study.main;\n\n<span class=\"hljs-keyword\">import<\/span> com.study.shapes.CircleHelper; <span class=\"hljs-comment\">// Compile Error! CircleHelper ইম্পোর্ট করা যাবে না।<\/span><\/code><\/pre><\/div>\n<hr>\n<h2>২. C#-এ <code>internal<\/code> ক্লাস কী?<\/h2>\n<p>C#-এ <code>internal<\/code> একটি অ্যাক্সেস মডিফায়ার। যখন কোনো ক্লাসকে <code>internal class MyClass<\/code> হিসেবে ঘোষণা করা হয়, তখন এর অ্যাক্সেস একই <strong>Assembly<\/strong>-র ভেতরে সীমাবদ্ধ থাকে।<\/p>\n<blockquote><p><strong>Assembly কী?<\/strong><br>C#-এ অ্যাসেম্বলি হলো একটি কম্পাইলড প্রজেক্ট ফাইল (যেমন: <code>.dll<\/code> বা <code>.exe<\/code> ফাইল)। একটি সল্যুশনে (Solution) একাধিক প্রজেক্ট থাকতে পারে, যার প্রতিটি আলাদা অ্যাসেম্বলি।<\/p><\/blockquote>\n<h3>অ্যাক্সেস লিমিট (Who can use it?):<\/h3>\n<ul><li>শুধুমাত্র <strong>একই প্রজেক্ট বা অ্যাসেম্বলির<\/strong> ভেতরের যেকোনো কোড এই ক্লাসটিকে ব্যবহার করতে পারবে।<\/li><li>অন্য কোনো প্রজেক্ট যদি এই প্রজেক্টের রেফারেন্সও নেয়, তবুও সে এই <code>internal<\/code> ক্লাসটি দেখতে পাবে না।<\/li><\/ul>\n<h3>C# Example:<\/h3>\n<p>ধরা যাক একটি ডাটাবেজ লাইব্রেরি প্রজেক্টে (<code>DatabaseConnector.csproj<\/code>) একটি ক্লাস আছে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">namespace<\/span> DatabaseConnector\n{\n    <span class=\"hljs-comment\">// Internal Class<\/span>\n    <span class=\"hljs-keyword\">internal<\/span> <span class=\"hljs-keyword\">class<\/span> ConnectionDecryptor\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-built_in\">string<\/span> <span class=\"hljs-title function_\">Decrypt<\/span>(<span class=\"hljs-built_in\">string<\/span> encryptedString)\n        {\n            <span class=\"hljs-keyword\">return<\/span> <span class=\"hljs-string\">\"decrypted_connection_string\"<\/span>;\n        }\n    }\n}<\/code><\/pre><\/div>\n<p>এই প্রজেক্টের ভেতরে থাকা অন্য যেকোনো ক্লাস (যেমন: <code>DbConnection<\/code>) এই <code>ConnectionDecryptor<\/code> ব্যবহার করতে পারবে:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">namespace<\/span> DatabaseConnector\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> DbConnection\n    {\n        <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Connect<\/span>()\n        {\n            <span class=\"hljs-keyword\">var<\/span> decryptor = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">ConnectionDecryptor<\/span>(); <span class=\"hljs-comment\">// সফলভাবে কাজ করবে<\/span>\n            <span class=\"hljs-built_in\">string<\/span> connectionString = decryptor.<span class=\"hljs-title function_\">Decrypt<\/span>(<span class=\"hljs-string\">\"secret\"<\/span>);\n        }\n    }\n}<\/code><\/pre><\/div>\n<p>কিন্তু যদি বাইরের কোনো প্রজেক্ট (যেমন: <code>MyConsoleApp.csproj<\/code>) এই <code>DatabaseConnector<\/code> প্রজেক্টটি রেফারেন্স হিসেবে ব্যবহার করে, তবুও তারা সরাসরি <code>ConnectionDecryptor<\/code> অ্যাক্সেস করতে পারবে না:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> DatabaseConnector;\n\n<span class=\"hljs-keyword\">namespace<\/span> MyConsoleApp\n{\n    <span class=\"hljs-keyword\">class<\/span> Program\n    {\n        <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>(<span class=\"hljs-built_in\">string<\/span>[] args)\n        {\n            <span class=\"hljs-comment\">// compile error: ConnectionDecryptor is inaccessible due to its protection level<\/span>\n            <span class=\"hljs-keyword\">var<\/span> decryptor = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">ConnectionDecryptor<\/span>(); \n        }\n    }\n}<\/code><\/pre><\/div>\n<hr>\n<h2>কেন এবং কখন এগুলো ব্যবহার করবেন? (Use Cases &amp; Advantages)<\/h2>\n<ol><li><strong>অভ্যন্তরীণ কাজের লজিক লুকিয়ে রাখা (Implementation Hiding):<\/strong> ধরা যাক আপনি একটি লাইব্রেরি বা মডিউল বানাচ্ছেন যা অন্য ডেভেলপাররা ব্যবহার করবেন। আপনি চান ব্যবহারকারীরা শুধুমাত্র নির্দিষ্ট কিছু <code>public<\/code> ক্লাস ব্যবহার করুক এবং ভেতরের জটিল বা সিকিউর মেকানিজমগুলো (<code>default<\/code> বা <code>internal<\/code> ক্লাস দিয়ে তৈরি) তাদের আড়ালে থাকুক।<\/li><li><strong>নিরাপত্তা ও কনফিডেন্সিয়ালিটি:<\/strong> যেমন ডাটাবেজ পাসওয়ার্ড ডিক্রিপ্ট করা বা কোনো জটিল অ্যালগরিদম যা বাইরের কারো অ্যাক্সেস করার দরকার নেই, সেগুলো <code>internal<\/code> বা <code>default<\/code> ক্লাসে রাখা নিরাপদ।<\/li><li><strong>মডুলার আর্কিটেকচার:<\/strong> কোডকে ছোট ছোট মডিউলে ভাগ করতে সাহায্য করে এবং নিশ্চিত করে যে একটি মডিউলের অভ্যন্তরীণ কোড অন্য মডিউলের সাথে শক্তভাবে লেগে থাকবে না (Low Coupling)।<\/li><\/ol>","inheritance-deep/upcasting-downcasting/UpcastingDowncasting.md":"<h1>Upcasting and Downcasting in C#<\/h1>\n<div class=\"callout important\"><div class=\"callout-title\">Important<\/div><p><strong>🌟 GOLDEN RULE: \"A child is a parent, but parent is not a child\"<\/strong><br>এর মানে হলো, একটা Dog বা Cat সবসময়ই একটা Animal (Child is a parent)।<br>তাই Child-এর অবজেক্টকে Parent-এর রেফারেন্সে রাখা সম্পূর্ণ সেইফ এবং লজিক্যাল।<br>কিন্তু সব Animal তো Dog না (যেমন Cat, Cow হতে পারে), তাই Parent is not a child।<br>Parent-কে সরাসরি Child-এ কাস্ট করা যায় না।<\/p><\/div>\n<p>আপনার রিকোয়ারমেন্ট অনুযায়ী C# এ সম্পূর্ণ কোড এবং বিস্তারিত ব্যাখ্যা (কমেন্টস সহ) নিচে দেওয়া হলো:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-comment\">// ১. Parent Class<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Animal\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Eat<\/span>()\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Animal is eating.\"<\/span>);\n    }\n}\n\n<span class=\"hljs-comment\">// ২. Child Class 1<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Dog : Animal\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Bark<\/span>()\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Dog is barking.\"<\/span>);\n    }\n}\n\n<span class=\"hljs-keyword\">class<\/span> Program\n{\n    <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>(<span class=\"hljs-built_in\">string<\/span>[] args)\n    {\n        <span class=\"hljs-comment\">// ==========================================<\/span>\n        <span class=\"hljs-comment\">// UPCASTING<\/span>\n        <span class=\"hljs-comment\">// ==========================================<\/span>\n        Animal animRef1 = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Dog<\/span>(); <span class=\"hljs-comment\">// Upcasting (Implicit)<\/span>\n        \n        <span class=\"hljs-comment\">// ---------------------------------------------------------<\/span>\n        <span class=\"hljs-comment\">// Memory Level &amp; Visibility (Upcasting):<\/span>\n        <span class=\"hljs-comment\">// ---------------------------------------------------------<\/span>\n        <span class=\"hljs-comment\">// Heap Memory: [ Eat() | Bark() ] -&gt; মেমোরিতে পুরো Dog অবজেক্ট তৈরি হয়েছে।<\/span>\n        <span class=\"hljs-comment\">// Stack Reference: animRef1 (Type: Animal)<\/span>\n        <span class=\"hljs-comment\">// <\/span>\n        <span class=\"hljs-comment\">// Visibility: <\/span>\n        <span class=\"hljs-comment\">// animRef1 রেফারেন্সটি Animal টাইপের। <\/span>\n        <span class=\"hljs-comment\">// তাই মেমোরিতে পুরো Dog অবজেক্ট থাকলেও, animRef1 শুধুমাত্র Animal এর অংশটুকুই (Eat) দেখতে পাবে। <\/span>\n        <span class=\"hljs-comment\">// Bark() মেমোরিতে আছে ঠিকই, কিন্তু animRef1 এর কাছে তা Invisible (অদৃশ্য)।<\/span>\n        <span class=\"hljs-comment\">// ---------------------------------------------------------<\/span>\n        animRef1.<span class=\"hljs-title function_\">Eat<\/span>(); <span class=\"hljs-comment\">// Valid<\/span>\n        <span class=\"hljs-comment\">// animRef1.Bark(); // Invalid! Compile time error. animRef1 Bark() কে চিনে না।<\/span>\n\n\n        <span class=\"hljs-comment\">// ==========================================<\/span>\n        <span class=\"hljs-comment\">// DOWNCASTING<\/span>\n        <span class=\"hljs-comment\">// ==========================================<\/span>\n        Dog realDog = (Dog)animRef1; <span class=\"hljs-comment\">// Downcasting (Explicit)<\/span>\n        \n        <span class=\"hljs-comment\">// ---------------------------------------------------------<\/span>\n        <span class=\"hljs-comment\">// Memory Level &amp; Visibility (Downcasting):<\/span>\n        <span class=\"hljs-comment\">// ---------------------------------------------------------<\/span>\n        <span class=\"hljs-comment\">// Heap Memory: [ Eat() | Bark() ] -&gt; মেমোরিতে সেই একই Dog অবজেক্টটিই আছে।<\/span>\n        <span class=\"hljs-comment\">// Stack Reference: realDog (Type: Dog)<\/span>\n        <span class=\"hljs-comment\">// <\/span>\n        <span class=\"hljs-comment\">// Visibility: <\/span>\n        <span class=\"hljs-comment\">// এখন realDog রেফারেন্সটি Dog টাইপের, তাই তার লেন্স বড় হয়ে গেছে! <\/span>\n        <span class=\"hljs-comment\">// সে এখন মেমোরির পুরো অবজেক্টটাই দেখতে পাবে। Eat() এবং Bark() দুটোই তার কাছে Visible।<\/span>\n        <span class=\"hljs-comment\">// ---------------------------------------------------------<\/span>\n        realDog.<span class=\"hljs-title function_\">Eat<\/span>();  <span class=\"hljs-comment\">// Valid<\/span>\n        realDog.<span class=\"hljs-title function_\">Bark<\/span>(); <span class=\"hljs-comment\">// Valid<\/span>\n\n\n        <span class=\"hljs-comment\">// ==========================================<\/span>\n        <span class=\"hljs-comment\">// (Obj) Casting vs 'as' Keyword (Difference)<\/span>\n        <span class=\"hljs-comment\">// ==========================================<\/span>\n        \n        <span class=\"hljs-comment\">// ১. Direct Casting `(Dog)animRef1`:<\/span>\n        <span class=\"hljs-comment\">// - এটা জোর করে টাইপ কাস্ট করে।<\/span>\n        <span class=\"hljs-comment\">// - যদি কাস্টিং ফেইল করে (ধরেন animRef1 এর ভেতর আসলে Cat এর অবজেক্ট আছে), <\/span>\n        <span class=\"hljs-comment\">//   তাহলে সাথে সাথে Runtime Error (InvalidCastException) থ্রো করবে এবং প্রোগ্রাম ক্র্যাশ করবে।<\/span>\n\n        <span class=\"hljs-comment\">// ২. 'as' Keyword `animRef1 as Dog`:<\/span>\n        <span class=\"hljs-comment\">// - এটা সাবধানে কাস্ট করার চেষ্টা করে (Safe Casting)। <\/span>\n        <span class=\"hljs-comment\">// - যদি কাস্টিং ফেইল করে, তাহলে এক্সেপশন থ্রো না করে null রিটার্ন করে। <\/span>\n        <span class=\"hljs-comment\">// - এতে প্রোগ্রাম ক্র্যাশ করে পশ্চাতে না, আমরা null চেক করে সেফলি কাজ করতে পারি।<\/span>\n\n\n        <span class=\"hljs-comment\">// ==========================================<\/span>\n        <span class=\"hljs-comment\">// EXCEPTION CASE (Why this throws error?)<\/span>\n        <span class=\"hljs-comment\">// ==========================================<\/span>\n        <span class=\"hljs-comment\">/*\n        Animal a = new Animal();\n        Dog d = (Dog) a; // InvalidCastException (Runtime Error)\n        \n        ---------------------------------------------------------\n        Memory Level Explanation (কেন এক্সেপশন দেয়?):\n        ---------------------------------------------------------\n        ১. \"new Animal()\" মেমোরিতে শুধুমাত্র [ Eat() ] তৈরি করে। এখানে Bark() এর কোনো অস্তিত্বই নেই।\n        ২. \"a\" রেফারেন্স এই [ Eat() ] কে পয়েন্ট করে আছে।\n        ৩. এখন আমরা যখন \"Dog d = (Dog) a;\" করছি, আমরা কম্পাইলারকে জোর করে বলছি, \n           \"তুমি a কে Dog হিসেবে কাস্ট করো।\" \n        ৪. কম্পাইলার আমাদের কথা শুনে Compile time এ কোনো error দেয় না। \n        ৫. কিন্তু রানটাইমে যখন \"d\" রেফারেন্স মেমোরির কাছে গিয়ে Bark() কে খুঁজতে যায়, \n           তখন সে দেখে সেখানে Bark() নেই! কারণ মেমোরিতে তো শুধুমাত্র Animal তৈরি হয়েছিল। \n           \n        যেহেতু মেমোরিতে Dog এর বৈশিষ্ট্যগুলো নেই, তাই একটা Animal কে জোর করে Dog বানানো সম্ভব না। \n        এজন্যই প্রোগ্রাম রানটাইমে InvalidCastException থ্রো করে। \n        এটাই প্রমান করে যে: \"Parent is not a child\" (Animal কে Dog বানানো যায় না)।\n        */<\/span>\n    }\n}<\/code><\/pre><\/div>\n<hr>\n<h2>Sibling Casting (Why it's Invalid)<\/h2>\n<p>একটি চাইল্ড ক্লাসকে (যেমন Dog) কখনোই আরেকটি চাইল্ড ক্লাসে (যেমন Cat) কাস্ট করা যায় না। এটিকে <strong>Sibling Casting<\/strong> বলা যায়, যা সম্পূর্ণ অবৈধ।<\/p>\n<p>আগের কোডকে স্পর্শ না করে এখানে আলাদাভাবে একটি <code>Cat<\/code> ক্লাস এবং Sibling Casting-এর উদাহরণ দেওয়া হলো:<\/p>\n<div class=\"code\"><div class=\"code-bar\"><span>csharp<\/span><button class=\"copy\" type=\"button\">Copy<\/button><\/div><pre><code class=\"hljs\"><span class=\"hljs-keyword\">using<\/span> System;\n\n<span class=\"hljs-comment\">// ৩. Child Class 2 (Created separately)<\/span>\n<span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">class<\/span> Cat : Animal\n{\n    <span class=\"hljs-keyword\">public<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Meow<\/span>()\n    {\n        Console.<span class=\"hljs-title function_\">WriteLine<\/span>(<span class=\"hljs-string\">\"Cat is meowing.\"<\/span>);\n    }\n}\n\n<span class=\"hljs-keyword\">class<\/span> SiblingCastingExample \n{\n    <span class=\"hljs-keyword\">static<\/span> <span class=\"hljs-keyword\">void<\/span> <span class=\"hljs-title function_\">Main<\/span>() \n    {\n        Animal myCat = <span class=\"hljs-keyword\">new<\/span> <span class=\"hljs-title function_\">Cat<\/span>(); <span class=\"hljs-comment\">// Upcasting Cat<\/span>\n        \n        <span class=\"hljs-comment\">// SIBLING CASTING (Invalid!)<\/span>\n        Dog fakeDog = (Dog)myCat; <span class=\"hljs-comment\">// InvalidCastException!<\/span>\n        Dog fakeDog1 = myCat <span class=\"hljs-keyword\">as<\/span> Dog; <span class=\"hljs-comment\">// null (as return null for exceptions)<\/span>\n        \n        <span class=\"hljs-comment\">/*\n        ---------------------------------------------------------\n        Memory Level Explanation (কেন এক্সেপশন দেয়?):\n        ---------------------------------------------------------\n        ১. \"new Cat()\" মেমোরিতে [ Eat() | Meow() ] তৈরি করেছে।\n        ২. \"myCat\" রেফারেন্সটি (Animal টাইপ) এই মেমোরিকে পয়েন্ট করে আছে।\n        ৩. এখন আমরা যখন \"(Dog)myCat\" করছি, কম্পাইলার ভাবছে আমরা Parent থেকে Child এ কাস্ট করছি। \n        ৪. কিন্তু রানটাইমে মেমোরিতে গিয়ে দেখে এট
