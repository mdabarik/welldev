*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:460px;z-index:-1;pointer-events:none;

             radial-gradient(540px 240px at 90% -60px,color-mix(in srgb,#ec4899 12%,transparent),transparent 70%)}
a{color:var(--accent)}
button{font:inherit;color:inherit}

/* ----- code: VS Code look ----- */
.code{margin:16px 0 22px;border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line);box-shadow:var(--shadow)}
.code-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--code-bar);border-bottom:1px solid var(--code-line);font:500 12px var(--mono);color:var(--ink-2)}
.code-bar::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;background:#ff5f57;box-shadow:17px 0 0 #febc2e,34px 0 0 #28c840;margin-right:36px}
.code-bar > span:first-of-type{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{margin-left:auto;border:1px solid var(--code-line);background:var(--code-bg);color:var(--ink-2);border-radius:7px;padding:2px 10px;font:500 11.5px var(--sans);cursor:pointer}
.copy:hover{color:var(--ink);border-color:var(--ink-3)}
.code pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--code-ink);tab-size:4;counter-reset:ln;scrollbar-width:thin}
.code pre:not(.numbered){padding:12px 18px}
.code .ln-row{display:block;padding-right:18px;min-height:1.7em}
.code .ln-row::before{counter-increment:ln;content:counter(ln);display:inline-block;width:46px;padding-right:16px;text-align:right;color:var(--code-gutter);opacity:.85;user-select:none;-webkit-user-select:none}
.code .ln-row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.hljs-keyword,.hljs-meta .hljs-keyword,.t-kw{color:var(--t-kw)}
.hljs-built_in{color:var(--t-type)}
.hljs-string,.hljs-regexp,.t-str{color:var(--t-str)}
.hljs-comment,.hljs-quote,.t-com{color:var(--t-com);font-style:italic}
.hljs-number,.hljs-literal,.t-num{color:var(--t-num)}
.hljs-title,.hljs-title.class_,.hljs-type,.t-type{color:var(--t-type)}
.hljs-title.function_,.hljs-function .hljs-title,.t-fn{color:var(--t-fn)}
.hljs-attr,.hljs-variable,.hljs-property,.hljs-meta{color:var(--t-attr)}
.hljs-params{color:var(--code-ink)}

/* ----- tables ----- */
.table-wrap{overflow-x:auto;margin:18px 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:color-mix(in srgb,var(--accent) 70%,var(--ink));font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;border-bottom-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
tr:last-child td{border-bottom:0}

:not(pre)>code{font-family:var(--mono);font-size:.84em;font-weight:500;background:color-mix(in srgb,var(--accent) 9%,var(--surface));color:color-mix(in srgb,var(--accent) 72%,var(--ink));border:0;padding:.12em .45em;border-radius:6px}
::selection{background:color-mix(in srgb,#8b5cf6 25%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
code,pre,kbd{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}


  
  
  

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 20px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.75 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82em; background: var(--soft); padding: .1em .4em; border-radius: 5px; }
  button { font: inherit; color: inherit; }

  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 50; }

  /* ---------- hero */
  .hero { max-width: 1140px; margin: 0 auto; padding: 56px 24px 8px; }
  .eyebrow { font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
  .hero h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.2; margin: 6px 0 12px; font-weight: 700; letter-spacing: -.01em; }
  .hero p { color: var(--muted); max-width: 720px; margin: 0; font-size: 18px; }
  .hero-meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; color: var(--muted); font-size: 15px; }
  .hero-meta b { color: var(--text); }
  .roadmap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 26px; }
  .roadmap a {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); color: var(--text); font-size: 15px; box-shadow: var(--shadow);
  }
  .roadmap a:hover { text-decoration: none; border-color: var(--hue); }
  .roadmap .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; background: var(--hue); }
  .roadmap .arrow { color: var(--faint); }
  #themeBtn {
    position: fixed; top: 14px; right: 14px; z-index: 40; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; box-shadow: var(--shadow);
  }

  /* ---------- layout */
  .layout { max-width: 1140px; margin: 0 auto; padding: 32px 24px 80px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; }
  .toc { position: sticky; top: 20px; align-self: start; max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 4px; scrollbar-width: thin; }
  .toc-title { font-size: 13px; font-weight: 700; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
  .toc-part { margin-bottom: 10px; }
  .toc-part > a { display: flex; gap: 8px; align-items: baseline; font-weight: 600; font-size: 15px; color: var(--text); padding: 4px 8px; border-radius: 8px; }
  .toc-part > a .num { color: var(--hue); font-size: 13px; min-width: 18px; }
  .toc-part ul { list-style: none; margin: 2px 0 0; padding: 0 0 0 26px; border-left: 2px solid var(--line); margin-left: 16px; }
  .toc-part li a { display: block; font-size: 14px; line-height: 1.45; color: var(--muted); padding: 4px 8px; border-radius: 6px; margin-left: -2px; border-left: 2px solid transparent; }
  .toc a:hover { background: var(--soft); text-decoration: none; }
  .toc li a.active { color: var(--text); border-left-color: var(--hue); background: var(--soft); font-weight: 500; }
  #tocBtn { display: none; }
  #scrim { display: none; }

  /* ---------- part */
  .part { margin-bottom: 64px; }
  .part-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 22px; }
  .part-num { font-size: 44px; font-weight: 700; line-height: 1; color: var(--hue); min-width: 64px; padding-top: 6px; }
  .part-label { font-size: 14px; font-weight: 600; color: var(--hue); }
  .part-head h2 { margin: 0 0 6px; font-size: clamp(24px, 3vw, 30px); line-height: 1.25; }
  .part-head p { margin: 0; color: var(--muted); }

  /* ---------- lesson */
  .lesson { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 26px 28px; margin-bottom: 22px; }
  .lesson-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .pill { font-size: 13px; font-weight: 600; color: var(--hue); background: color-mix(in srgb, var(--hue) 12%, transparent); padding: 2px 10px; border-radius: 999px; }
  .lesson h3 { margin: 0 0 8px; font-size: 22px; line-height: 1.35; }
  .lesson .intro { margin: 0 0 18px; color: var(--muted); }
  .frame { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; cursor: zoom-in; position: relative; }
  .frame img { display: block; width: 100%; height: auto; transition: transform .25s ease; }
  .frame:hover img { transform: scale(1.01); }
  .frame .hint { position: absolute; right: 10px; bottom: 10px; background: rgba(17, 20, 28, .72); color: #fff; font-size: 13px; padding: 3px 10px; border-radius: 999px; opacity: 0; transition: opacity .2s; }
  .frame:hover .hint, .frame:focus-visible .hint { opacity: 1; }
  .points-title { margin: 20px 0 6px; font-size: 15px; font-weight: 700; }
  .points { margin: 0; padding: 0; list-style: none; }
  .points li { position: relative; padding-left: 22px; margin: 6px 0; }
  .points li::before { content: ""; position: absolute; left: 4px; top: .72em; width: 7px; height: 7px; border-radius: 50%; background: var(--hue); }
  .remember { margin-top: 18px; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--hue) 9%, transparent); border-left: 3px solid var(--hue); }
  .remember b { color: var(--hue); }
  .lesson-foot { margin-top: 14px; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--faint); }

  /* ---------- summary */
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 26px 28px; }
  .summary h2 { margin: 0 0 14px; font-size: 26px; }
  .summary ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .summary li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .summary li:first-child { border-top: 0; }
  .summary .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; background: var(--hue); margin-top: 2px; }
  .summary li b { display: block; }
  .summary li span { color: var(--muted); }

  footer { text-align: center; color: var(--faint); font-size: 14px; padding: 0 0 40px; }

  /* ---------- lightbox */
  .lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(8, 10, 15, .9); display: none; overflow: auto; padding: 52px 12px 16px; }
  .lightbox.show { display: block; }
  .lightbox img { display: block; margin: 0 auto; width: min(100%, 1600px); border-radius: 8px; cursor: zoom-out; }
  .lightbox.full img { width: auto; max-width: none; }
  .lb-bar { position: fixed; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #fff; font-size: 15px; }
  .lb-bar button { background: rgba(255, 255, 255, .14); color: #fff; border: 0; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .toc {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 86vw); height: 100vh; height: 100dvh; max-height: none; z-index: 45;
      background: var(--card); border-right: 1px solid var(--line); padding: 20px 16px; transform: translateX(-102%); transition: transform .25s ease;
    }
    body.toc-open .toc { transform: none; }
    body.toc-open #scrim { display: block; position: fixed; inset: 0; z-index: 44; background: rgba(0, 0, 0, .35); }
    #tocBtn {
      display: block; position: fixed; left: 14px; bottom: 16px; z-index: 40; border: 1px solid var(--line); background: var(--card);
      border-radius: 999px; padding: 7px 16px; font-size: 15px; box-shadow: var(--shadow); cursor: pointer;
    }
  }
  @media (max-width: 640px) {
    body { font-size: 16px; }
    .hero { padding: 48px 16px 4px; }
    .layout { padding: 24px 14px 70px; }
    .lesson, .summary { padding: 18px 16px; border-radius: 14px; }
    .part-num { font-size: 34px; min-width: 48px; }
    .lesson h3 { font-size: 19px; }
    .roadmap .arrow { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

/* ===== WellDev theme overrides — picture guides (Security, Encoding, OS) ===== */
:root{--border:var(--line);--card:var(--surface);--soft:var(--surface-2);--font:var(--sans);--radius:18px;
  --xss:#f97316;--sql:#e11d48;--csrf:#8b5cf6;--jwt:#10b981}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--xss:#fb923c;--sql:#fb7185;--csrf:#a78bfa;--jwt:#34d399}}
:root[data-theme="dark"]{--xss:#fb923c;--sql:#fb7185;--csrf:#a78bfa;--jwt:#34d399}
body{font-family:var(--sans)}
p,li,figcaption,.lead,.intro,.sec-note{font-family:var(--bn)}

/* top bar (security pages) */
.topbar{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;backdrop-filter:blur(14px)}
.brand{font-weight:800;letter-spacing:-.02em}
.nav a{border-radius:999px}
.nav a.active,.nav a:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)!important;color:var(--accent)!important;border-color:transparent!important}
.theme-btn,#themeBtn{border:1px solid var(--line)!important;background:var(--surface)!important;border-radius:999px!important;box-shadow:var(--shadow)}

/* hero → gradient card */
.hero{border-radius:24px;padding:38px 40px!important;margin-top:24px;color:#fff;background:var(--hero);box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
.hero .eyebrow{color:#fff!important;background:rgba(255,255,255,.16)!important;border:1px solid rgba(255,255,255,.25);opacity:1}
.hero h1{font-weight:800!important;letter-spacing:-.03em!important;color:#fff}
.hero p,.hero .hero-meta,.hero .hero-meta b{color:#fff!important;opacity:.93}
.hero .cards,.hero .roadmap{position:relative;z-index:1}
.hero .card{color:var(--ink)}
.roadmap a{background:rgba(255,255,255,.16)!important;border-color:rgba(255,255,255,.28)!important;color:#fff!important;box-shadow:none!important;backdrop-filter:blur(6px)}
.roadmap .dot{background:#fff!important;color:var(--hue)!important}
.roadmap .arrow{color:rgba(255,255,255,.7)!important}

/* cards & sections */
.card{border-radius:16px!important;border-top:4px solid var(--c)!important;box-shadow:var(--shadow)!important}
.card:hover{box-shadow:var(--shadow-lg)!important}
.card h3{font-weight:750;letter-spacing:-.015em}
section.topic{border-top:0!important}
.topic-head h2,.part-head h2,.summary h2{font-weight:800;letter-spacing:-.025em}
.badge{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#ec4899))!important;border-radius:13px!important;box-shadow:0 8px 18px -10px var(--c)}
.figure,.lesson,.summary{border-radius:20px!important;box-shadow:var(--shadow)!important;border:1px solid var(--line)!important;background:var(--surface)!important}
.figure img,.frame img{background:#fff}
.figure figcaption{background:var(--surface-2)}
.point{border-radius:16px!important;border-top:4px solid var(--c,var(--accent))!important;box-shadow:var(--shadow);background:var(--surface)!important}
.point h4{font-weight:750}
.subhead{font-weight:800;letter-spacing:-.02em}
th{font-family:var(--sans)}

/* OS page */
.part-num{background:linear-gradient(135deg,var(--hue),color-mix(in srgb,var(--hue) 55%,#ec4899));-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800!important}
.lesson{border-top:4px solid var(--hue)!important}
.lesson h3{font-weight:750;letter-spacing:-.015em}
.pill{color:#fff!important;background:var(--hue)!important}
.frame{border-radius:14px!important}
.remember{border-radius:0 14px 14px 0!important}
.toc-part > a .num{font-family:var(--mono)}
.toc li a.active{background:color-mix(in srgb,var(--hue) 12%,transparent)!important}
.summary .dot{box-shadow:0 6px 14px -8px var(--hue)}
#progress{background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899)!important}
#tocBtn{box-shadow:var(--shadow-lg)}
.home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;box-shadow:var(--shadow)}
.home-link:hover{color:var(--ink)}
.hero .card p{color:var(--ink-2)!important;opacity:1!important}
.hero .card .num{color:var(--c)}
.hero .eyebrow{display:inline-block!important;padding:3px 11px;border-radius:999px;font-size:12px!important;letter-spacing:.06em}
</style>

/* ---------- render */
const bn = n => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const pad = n => bn(String(n).padStart(2, "0"));
const total = PARTS.reduce((a, p) => a + p.lessons.length, 0);
let n = 0;
PARTS.forEach(p => p.lessons.forEach(l => { l.n = ++n; l.id = "l-" + l.src; }));

document.getElementById("heroMeta").innerHTML =
  `<span><b>${bn(PARTS.length)}</b>টি অধ্যায়</span><span><b>${bn(total)}</b>টি diagram</span><span>উপর থেকে নিচে পড়লেই পুরো পথ</span>`;
document.getElementById("roadmap").innerHTML = PARTS.map((p, i) =>
  `<a href="#${p.id}" style="--hue:${p.hue}"><span class="dot">${bn(i + 1)}</span>${p.short}</a>${i < PARTS.length - 1 ? '<span class="arrow">→</span>' : ""}`).join("");

document.getElementById("toc").innerHTML = `<div class="toc-title">সূচিপত্র</div>` + PARTS.map((p, i) => `
  <div class="toc-part" style="--hue:${p.hue}">
    <a href="#${p.id}"><span class="num">${pad(i + 1)}</span>${p.short}</a>
    <ul>${p.lessons.map(l => `<li><a href="#${l.id}" data-lesson="${l.id}">${l.title}</a></li>`).join("")}</ul>
  </div>`).join("") + `<div class="toc-part"><a href="#summary"><span class="num">✓</span>এক নজরে</a></div>`;

const flat = PARTS.flatMap(p => p.lessons);
document.getElementById("content").innerHTML = PARTS.map((p, i) => `
  <section class="part" id="${p.id}" style="--hue:${p.hue}">
    <div class="part-head">
      <div class="part-num">${pad(i + 1)}</div>
      <div><div class="part-label">অধ্যায় ${bn(i + 1)} · ${bn(p.lessons.length)}টি diagram</div><h2>${p.title}</h2><p>${p.intro}</p></div>
    </div>
    ${p.lessons.map(l => {
      const path = `src/${l.src}.webp`, next = flat[l.n];
      return `<article class="lesson" id="${l.id}">
        <div class="lesson-top"><span class="pill">পাঠ ${bn(l.n)} / ${bn(total)}</span></div>
        <h3>${l.title}</h3>
        <p class="intro">${l.intro}</p>
        <button class="frame" type="button" data-zoom="${path}" data-title="${l.title}">
          <img src="${path}" alt="${l.title}" loading="lazy"><span class="hint">বড় করে দেখুন</span>
        </button>
        <div class="points-title">মূল কথা</div>
        <ul class="points">${l.points.map(x => `<li>${x}</li>`).join("")}</ul>
        <div class="remember"><b>মনে রাখো:</b> ${l.remember}</div>
        <div class="lesson-foot"><a href="${path}" target="_blank" rel="noopener">ছবি নতুন tab-এ খুলুন ↗</a>${next ? `<a href="#${next.id}">পরের পাঠ: ${next.title} ↓</a>` : `<a href="#summary">এক নজরে পুরো পথ ↓</a>`}</div>
      </article>`;
    }).join("")}
  </section>`).join("") + `
  <section class="summary" id="summary">
    <h2>এক নজরে পুরো পথ</h2>
    <ol>${PARTS.map((p, i) => `<li style="--hue:${p.hue}"><span class="dot">${bn(i + 1)}</span><div><b>${p.title}</b><span>${p.remember}</span></div></li>`).join("")}</ol>
  </section>`;

/* ---------- lightbox */
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbFull = document.getElementById("lbFull");
const closeLb = () => { lb.classList.remove("show"); document.body.style.overflow = ""; };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-zoom]");
  if (b) {
    lbImg.src = b.dataset.zoom; lbImg.alt = b.dataset.title;
    document.getElementById("lbTitle").textContent = b.dataset.title;
    lb.classList.remove("full"); lbFull.textContent = "Actual size";
    lb.classList.add("show"); document.body.style.overflow = "hidden";
    return;
  }
  if (e.target.closest(".toc a")) document.body.classList.remove("toc-open");
});
lbFull.addEventListener("click", () => { lbFull.textContent = lb.classList.toggle("full") ? "Fit to screen" : "Actual size"; });
document.getElementById("lbClose").addEventListener("click", closeLb);
lbImg.addEventListener("click", closeLb);
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeLb(); document.body.classList.remove("toc-open"); } });

/* ---------- table of contents: mobile drawer + current lesson */
document.getElementById("tocBtn").addEventListener("click", () => document.body.classList.toggle("toc-open"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("toc-open"));
const tocLinks = new Map([...document.querySelectorAll("[data-lesson]")].map(a => [a.dataset.lesson, a]));
const spy = new IntersectionObserver(entries => entries.forEach(en => {
  if (!en.isIntersecting) return;
  tocLinks.forEach(a => a.classList.remove("active"));
  const a = tocLinks.get(en.target.id);
  if (a) { a.classList.add("active"); a.scrollIntoView({ block: "nearest" }); }
}), { rootMargin: "-35% 0px -60% 0px" });
document.querySelectorAll(".lesson").forEach(el => spy.observe(el));

/* ---------- reading progress */
const bar = document.getElementById("progress");
addEventListener("scroll", () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + "%";
}, { passive: true });

/* ---------- theme */
const root = document.documentElement;
try { const t = localStorage.getItem("os-notes-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("os-notes-theme", root.dataset.theme); } catch (e) {}
});
</script>
