    S('শুরুতে process বাড়ালে CPU utilization <b>বাড়ে</b>: একজন I/O-র জন্য থামলে আরেকজন CPU পায়।',{add:[P('rise','M60,196 C150,120 260,62 360,52','g')]}),
    S('এই <b>সর্বোচ্চ বিন্দুতে</b> RAM-এ সবার working set এঁটে যায়।',{add:[C('peak',360,52,7,'','g'),T('pk',372,36,'সর্বোচ্চ',{c:'g',s:'sm b'})]}),
    S('এরপর আরও process ঢোকালে RAM-এ আর কারো working set এঁটে না। Page fault বাড়ে, CPU অপেক্ষায় থাকে, utilization <b>পড়ে যায়</b>। এই এলাকাই <b>thrashing</b>।',{add:[P('fall','M360,52 C450,56 520,110 570,160 S660,196 700,198','r'),B('tz',440,30,270,176,'','r',{dash:1}),T('tzl',460,48,'Thrashing এলাকা',{c:'r',s:'b'})]}),
    S('বিপদ: OS দেখে "CPU তো বসে আছে!" ভেবে <b>আরও process ঢোকায়</b>, ফলে আরও খারাপ। তাই OS-কে process সংখ্যা <b>কমাতে</b> হয়।',{add:[T('adv',575,100,'ভুল সিদ্ধান্ত:\nআরও process ঢোকানো ✗',{a:'middle',c:'r',s:'sm b'})]})
  ]}
 ]},

{p:6,sub:'27b',q:'How is thrashing solved?',
 ans:'মূল কথা: process-গুলোর working set যেন RAM-এ এঁটে যায়। উপায়: <b>Working Set Model</b>, <b>Page Fault Frequency</b>, একসাথে কম process চালানো, RAM বাড়ানো।',
 pts:['<b>Working Set:</b> process-এর সক্রিয় page-গুলো RAM-এ রাখো। সবার working set-এর যোগফল RAM-এর বেশি হলে একটা process suspend করো।','<b>Page Fault Frequency:</b> fault-এর হার মেপে frame কম-বেশি করো।','সবচেয়ে সোজা: RAM বাড়ানো।'],
 tabs:[
  {n:'Working Set + process কমানো',steps:[
    S('<b>Working set</b> = একটা process যে page-গুলো এখন সক্রিয়ভাবে ব্যবহার করছে। RAM-এ মোট ৮টা frame। তিন process-এর working set: 3 + 3 + 3 = ৯।',{add:[T('rl',20,14,'RAM (৮টা frame)',{c:'g',s:'sm b'}),B('ram',20,28,8*40,36,'','g',{dash:1}),B('wa',20,84,3*40,38,'A: working set 3','a',{s:'sm'}),B('wb',20+3*40,84,3*40,38,'B: working set 3','b',{s:'sm'}),B('wc',20+6*40,84,3*40,38,'C: working set 3','o',{s:'sm'})]}),
    S('মোট চাহিদা ৯ > ৮ frame। কারো না কারো working set এঁটে না → <b>বারবার page fault → thrashing</b>।',{add:[A('lim',340,70,340,130,'r',{dash:1}),T('over',380,160,'RAM-এর সীমা পেরিয়ে গেছে ✗',{a:'middle',c:'r',s:'b'})],mod:{wc:{c:'r'}}}),
    S('<b>প্রতিকার ১: process কমানো।</b> C-কে পুরো swap out (disk-এ) করা হল। এখন চাহিদা 3 + 3 = ৬ ≤ ৮ ✓।',{del:['lim','over'],mod:{wc:{y:190,c:'n',dash:1,label:'C: suspend (disk-এ)'},}})]},
  {n:'Page Fault Frequency',steps:[
    S('<b>PFF:</b> OS প্রতি process-এর page fault-এর <b>হার</b> মাপে। দুটো সীমা ঠিক করা: <b>upper</b> (খুব বেশি) আর <b>lower</b> (খুব কম)।',{add:[B('band',60,70,420,70,'','g',{dash:1}),T('bl',72,84,'ঠিক আছে এলাকা',{c:'g',s:'sm b'}),A('up',50,70,490,70,'r',{dash:1}),T('upl',496,70,'upper',{c:'r',s:'sm b'}),A('lo',50,140,490,140,'o',{dash:1}),T('lol',496,140,'lower',{c:'o',s:'sm b'}),T('yl',20,18,'fault rate ↑',{c:'n',s:'sm b'}),C('mk',270,105,10,'','a'),B('pa',580,60,150,90,'Process A\nframes = 4','a')]}),
    S('Rate <b>upper-এর উপরে</b>: process-এর frame কম পড়ছে, তাই বেশি fault। OS তাকে <b>আরও frame</b> দেয়।',{mod:{mk:{y:40,c:'r'},pa:{label:'Process A\nframes = 4 → 6',c:'g',hl:1}}}),
    S('Frame বাড়ায় fault কমে এসে <b>সীমার ভেতরে</b>। ঠিক আছে।',{mod:{mk:{y:105,c:'g'},pa:{label:'Process A\nframes = 6',c:'a',hl:0}}}),
    S('Rate <b>lower-এর নিচে</b>: process-এর বাড়তি frame আছে। কিছু frame কেড়ে অন্য process-কে দেওয়া হয়।',{mod:{mk:{y:175,c:'o'},pa:{label:'Process A\nframes = 6 → 4',c:'o'}}}),
    S('ফাঁকা frame না থাকলে আর rate বেশি হলে: একটা process <b>suspend</b> করে তার frame বাকিদের দেওয়া হয়।',{add:[T('sp',280,215,'ফাঁকা frame নেই + rate বেশি → একটা process suspend',{a:'middle',c:'r',s:'b'})],mod:{mk:{y:40,c:'r'},pa:{label:'Process A\nframes = 4',c:'a'}}})
  ]}
 ]},

{p:7,q:'Process states and the state transition diagram.',
 ans:'<b>New → Ready → Running → Terminated</b> - এই state আসলে প্রতিটি <b>thread</b>-এর (TCB-তে থাকে; Linux-এ প্রতি task-এর)। Running থেকে I/O চাইলে <b>Waiting</b>; I/O শেষে আবার Ready। Timer শেষ হলে Running → Ready (preempt)।',
 pts:['Ready → Running: scheduler/dispatcher। Running → Ready: preemption। Running → Waiting: I/O বা event-এর অপেক্ষা।'],
 steps:[
  S('<b>New</b>: process-এর PCB আর main thread-এর TCB তৈরি হচ্ছে।',{add:[
    B('new',20,70,110,44,'New','n'),B('rdy',200,70,110,44,'Ready','a'),B('run',420,70,110,44,'Running','g'),B('trm',610,70,110,44,'Terminated','n'),B('wt',310,180,110,44,'Waiting','o'),
    A('a1',130,92,198,92,'n'),T('a1l',164,80,'admit',{a:'middle',c:'n',s:'sm'}),
    A('a2',310,82,418,82,'a'),T('a2l',364,66,'dispatch',{a:'middle',c:'a',s:'sm'}),
    A('a3',418,104,312,104,'b'),T('a3l',364,122,'preempt',{a:'middle',c:'b',s:'sm'}),
    A('a4',530,92,608,92,'n'),T('a4l',570,80,'exit',{a:'middle',c:'n',s:'sm'}),
    A('a5',470,114,400,178,'o'),T('a5l',468,152,'I/O wait',{a:'end',c:'o',s:'sm'}),
    A('a6',330,178,260,116,'o'),T('a6l',262,152,'I/O done',{c:'o',s:'sm'}),
    C('tok',75,92,13,'T','f')]}),
  S('Admit হয়ে <b>Ready</b> - CPU-র অপেক্ষা।',{mod:{tok:{x:255,y:92},new:{c:'n'},rdy:{hl:1}}}),
  S('Scheduler বেছে নিল → <b>Running</b>।',{mod:{tok:{x:475,y:92},rdy:{hl:0},run:{hl:1}}}),
  S('Disk read চাইল → <b>Waiting</b>।',{mod:{tok:{x:365,y:202},run:{hl:0},wt:{hl:1}}}),
  S('I/O শেষ → আবার <b>Ready</b>।',{mod:{tok:{x:255,y:92},wt:{hl:0},rdy:{hl:1}}}),
  S('আবার Running → কাজ শেষে <b>Terminated</b>।',{mod:{tok:{x:665,y:92},rdy:{hl:0},trm:{hl:1}}})
 ]},

{p:7,q:'System calls. How do fork() and exec() work? What are zombie and orphan processes?',
 ans:'<b>System call</b> = program kernel-এর কাছে কাজ চাওয়ার একমাত্র দরজা। <code>fork()</code> process-এর <b>copy</b> বানায়, <code>exec()</code> সেই process-এর ভেতরের <b>program বদলে</b> দেয়, <code>wait()</code> child শেষ হওয়ার <b>অপেক্ষা</b> করে। Tab চেপে একটা একটা করে দেখো।',
 pts:['<b>fork:</b> parent-এর হুবহু copy (child)। Parent-এ ফেরে child-এর PID, child-এ ফেরে 0।','<b>exec:</b> process একই থাকে (PID একই), শুধু ভেতরের program বদলে নতুন program চলে।','<b>Zombie:</b> child শেষ, কিন্তু parent এখনো <code>wait()</code> করেনি, তাই kernel-এ তার entry রয়ে গেছে।','<b>Orphan:</b> parent আগে মরে গেছে, child চলছে। <code>init</code> (PID 1) তাকে দত্তক নেয়।'],
 tabs:[
  {n:'1. System call কী',steps:[
    S('<b>System call</b> = program-এর kernel-কে অনুরোধ জানানোর একমাত্র দরজা। কারণ program (ring 3) নিজে disk বা hardware ছুঁতে পারে না।',{add:[B('pg',20,70,180,80,'Program\n(user mode, ring 3)','a'),B('kn',330,50,200,120,'Kernel\n(ring 0)\nhardware-এর মালিক','o'),B('hw',600,70,140,80,'Disk\n(hardware)','n'),T('ex',380,205,'উদাহরণ: file পড়তে চাই',{a:'middle',c:'f',s:'sm b'})]}),
    S('Program <code>read()</code> syscall করে: "kernel, এই file থেকে ১০০ byte দাও"।',{add:[A('s1',202,100,328,100,'a'),T('s1l',265,86,'read()',{a:'middle',c:'a',s:'sm b'})]}),
    S('CPU user mode থেকে kernel mode-এ যায়। Kernel disk-এর সাথে কথা বলে, data আনে।',{add:[A('s2',532,110,598,110,'o')],mod:{kn:{hl:1}}}),
    S('Kernel data program-কে ফেরত দেয়, CPU আবার user mode-এ ফেরে। Program শুধু ফলটা পায়।',{add:[A('s3',328,135,202,135,'g'),T('s3l',265,152,'data',{a:'middle',c:'g',s:'sm b'})],mod:{kn:{hl:0}}}),
    S('<code>fork, exec, wait</code> সবই syscall। এগুলো দিয়ে program নতুন process বানায়, নতুন program চালায়, আর child-এর জন্য অপেক্ষা করে। পরের tab-এ দেখো।',{})
  ]},
  {n:'2. fork() কী করে',steps:[
    S('ধরো Parent (PID 100) চলছে। কোডের লাইন: <code>pid = fork();</code>',{add:[B('par',40,40,180,70,'Parent\nPID 100','g'),T('code',20,200,'pid = fork();',{c:'f',s:'m b'})]}),
    S('<code>fork()</code> syscall: kernel Parent-এর <b>হুবহু copy</b> বানায়। নতুন process = <b>Child (PID 101)</b>। দুজনেই এখন <code>fork()</code>-এর পরের লাইন থেকে চলে।',{add:[B('chi',320,40,180,70,'Child\nPID 101\n(Parent-এর copy)','s'),A('f',222,75,318,75,'g'),T('fl',270,60,'fork()',{a:'middle',c:'g',s:'sm b'})]}),
    S('কে কোনটা বোঝার উপায়: <code>fork()</code>-এর <b>return মান</b> আলাদা। Parent-এ ফেরে <b>101</b> (child-এর PID), Child-এ ফেরে <b>0</b>।',{add:[T('r1',130,140,'fork() ফেরত দিল: 101',{a:'middle',c:'g',s:'m b'}),T('r2',410,140,'fork() ফেরত দিল: 0',{a:'middle',c:'s',s:'m b'})]}),
    S('কোড তাই ভাগ হয়: <code>if (pid == 0)</code> হলে child-এর কাজ, নইলে parent-এর কাজ। এখন দুটো আলাদা process: আলাদা PID, আলাদা memory।',{mod:{code:{label:'if (pid == 0) { child-এর কাজ } else { parent-এর কাজ }'}}}),
    S('<b>Copy-on-write:</b> copy আসলে সাথে সাথে হয় না। দুজন একই memory ভাগ করে, কেউ <b>লিখতে গেলে</b> তখন শুধু সেই page copy হয়। তাই fork সস্তা।',{})
  ]},
  {n:'3. fork + exec + wait (ls চালানো)',steps:[
    S('Shell-এ তুমি <code>ls</code> লিখলে। Shell (PID 100) এর কাজ তিন ধাপে: <b>fork → exec → wait</b>।',{add:[B('par',40,40,180,70,'Shell\nPID 100','g'),T('code',20,200,'১) fork()   ২) exec("ls")   ৩) wait()',{c:'f',s:'m b'})]}),
    S('<b>১) fork():</b> shell নিজের copy বানায়: Child (PID 101)। এখনো Child-ও আসলে shell-ই।',{add:[B('chi',320,40,180,70,'Child\nPID 101\n(এখনো shell-এর copy)','s'),A('f',222,75,318,75,'g')]}),
    S('<b>২) exec("ls"):</b> Child নিজের ভেতরের program <b>বদলে ফেলে</b>, <code>ls</code> বসায়। PID একই (101), কিন্তু এখন সে <code>ls</code> চালাচ্ছে।',{mod:{chi:{label:'Child\nPID 101\nএখন ls চালাচ্ছে',c:'a'}}}),
    S('<b>৩) wait():</b> Parent (shell) <code>wait()</code> করে অপেক্ষা করে, Child শেষ না হওয়া পর্যন্ত।',{mod:{par:{label:'Shell\nPID 100\nwait()-এ অপেক্ষা',c:'o'}}}),
    S('<code>ls</code> ফল ছেপে শেষ হয় (exit)। Kernel Parent-কে জানায় ও exit status দেয়।',{mod:{chi:{label:'Child\nPID 101\nশেষ (exit)',c:'n',dash:1},par:{label:'Shell\nPID 100\nজাগল, status পেল',c:'g'}}}),
    S('Shell Child-এর entry মুছে (<b>reap</b>) আবার prompt দেখায়। <b>fork = copy বানানো, exec = program বদলানো, wait = শেষ হওয়ার অপেক্ষা।</b>',{del:['chi','f'],mod:{par:{label:'Shell\nPID 100\nprompt আবার',c:'g'}}})
  ]},
  {n:'4. Zombie',steps:[
    S('Parent (PID 100) আর তার Child (PID 101) চলছে। Parent এখন অন্য কাজে ব্যস্ত, <code>wait()</code> ডাকেনি।',{add:[B('par',40,60,180,70,'Parent\nPID 100\n(অন্য কাজে ব্যস্ত)','g'),B('chi',320,60,200,70,'Child\nPID 101\nচলছে','s')]}),
    S('Child কাজ শেষ করে <b>exit</b> করল। তার memory মুক্ত হয়ে গেল।',{mod:{chi:{label:'Child\nPID 101\nexit করল',c:'n'}}}),
    S('কিন্তু Parent তার শেষ খবর (exit status) এখনো নেয়নি। তাই kernel একটা ছোট entry রেখে দেয়: PID + exit status। এই "মরা কিন্তু entry আছে" অবস্থাই <b>Zombie</b>।',{mod:{chi:{label:'Zombie (Z)\nশুধু entry: PID 101, status 0',c:'r',dash:1,h:56}}}),
    S('<b>উপমা:</b> ছাত্র পরীক্ষা শেষ করে চলে গেছে, কিন্তু রেজাল্ট শিট কেউ নেয়নি, তাই খাতায় তার নাম রয়ে গেছে। <code>ps</code>-এ এই process-এর state <b>Z</b> দেখায়।',{add:[T('an',380,200,'CPU বা memory নেয় না, কিন্তু PID table-এ জায়গা নেয়',{a:'middle',c:'r',s:'sm b'})]}),
    S('Parent <code>wait()</code> করলে exit status পায়, kernel entry মুছে ফেলে (<b>reap</b>)। Zombie শেষ।',{del:['an'],add:[A('wt',222,95,318,95,'g'),T('wtl',270,80,'wait()',{a:'middle',c:'g',s:'sm b'})],mod:{chi:{o:0.15}}}),
    S('সমস্যা: parent যদি কখনো <code>wait()</code> না করে আর অনেক zombie জমে, PID ফুরিয়ে নতুন process বানানো আটকে যেতে পারে।',{})
  ]},
  {n:'5. Orphan',steps:[
    S('Parent (PID 200) আর তার Child (PID 201) চলছে।',{add:[B('par',40,60,180,70,'Parent\nPID 200','g'),B('chi',320,60,200,70,'Child\nPID 201\nচলছে','s')]}),
    S('Parent <b>আগে মরে গেল</b> (exit বা crash)। Child এখনো চলছে।',{mod:{par:{label:'Parent\nPID 200\nমরে গেছে',c:'n',dash:1}}}),
    S('Child এখন <b>Orphan</b> (অনাথ): তার parent নেই।',{mod:{chi:{label:'Child (Orphan)\nPID 201\nparent নেই, তবু চলছে',c:'o'}}}),
    S('Kernel তাকে <b>init (PID 1)</b> process-এর কাছে দিয়ে দেয়, মানে দত্তক। init এখন তার নতুন parent।',{add:[B('ini',600,60,140,70,'init\nPID 1','g'),A('ad',582,95,524,95,'g',{dash:0}),T('adl',552,80,'দত্তক',{a:'middle',c:'g',s:'sm b'})]}),
    S('Child শেষ হলে init <code>wait()</code> করে তাকে reap করে। তাই orphan নিজে সমস্যা না, zombie-ও হয় না।',{mod:{chi:{label:'Child (শেষ)\nPID 201',c:'n',dash:1}}}),
    S('<b>তফাত:</b> Zombie = child আগে শেষ, parent wait করেনি। Orphan = parent আগে শেষ, child চলছে।',{})
  ]}
 ]},

{p:7,q:'What is an interrupt, and how is it different from a system call?',
 ans:'<b>Interrupt:</b> বাইরের hardware (keyboard, timer, disk) CPU-কে জানায় "আমাকে দেখো!"। CPU চলতি কাজ থামিয়ে তার handler (<b>ISR</b>) চালায়, তারপর আগের কাজে ফেরে। <b>System call:</b> program <b>নিজে</b> kernel-কে কাজ চায়। মূল তফাত: <b>কে শুরু করে</b>, hardware নাকি program।',
 pts:['<b>Timer interrupt</b> প্রতি কয়েক ms-এ আসে। এভাবেই OS CPU কেড়ে নিয়ে অন্য thread চালায় (preemptive scheduling)।','Interrupt আর syscall দুটোতেই CPU ring 3 → 0-তে যায় (mode switch)।','নিচের table-এ তিনটা পাশাপাশি: interrupt, syscall, আর exception।'],
 extra:'<table class="cmp"><tr><th></th><th>Interrupt</th><th>System call</th><th>Exception</th></tr>'
  +'<tr><td>কে শুরু করে</td><td>বাইরের hardware</td><td>program নিজে</td><td>instruction-এর ভুল</td></tr>'
  +'<tr><td>কখন</td><td>যেকোনো সময়, আগে থেকে জানা নেই (asynchronous)</td><td>program যখন চায় (synchronous)</td><td>ভুল করা instruction-এই (synchronous)</td></tr>'
  +'<tr><td>উদাহরণ</td><td>key চাপা, timer, disk শেষ</td><td><code>read()</code>, <code>fork()</code></td><td>০ দিয়ে ভাগ, page fault</td></tr>'
  +'<tr><td>উপমা</td><td>পড়ার সময় হঠাৎ ফোন বাজল</td><td>তুমি নিজে গিয়ে লাইব্রেরিয়ানকে বই চাইলে</td><td>অঙ্কে ভুল করলে শিক্ষক থামালেন</td></tr></table>',
 tabs:[
  {n:'1. Interrupt কীভাবে কাজ করে',steps:[
    S('CPU একটা একটা করে instruction চালাচ্ছে। <code>PC</code> (তীর) দেখায় এখন কোনটা চলছে।',{add:[
      T('pcl',30,24,'চলমান program',{c:'n',s:'sm'}),B('i1',30,40,190,28,'mov rax, [x]','n',{m:1}),B('i2',30,72,190,28,'add rax, 1','a',{m:1}),B('i3',30,104,190,28,'cmp rax, 10','n',{m:1}),B('i4',30,136,190,28,'jl loop','n',{m:1}),A('pc',6,86,28,86,'g'),
      B('dev',560,20,180,56,'Keyboard / Timer\n(hardware)','o'),B('idt',300,100,190,48,'IDT (তালিকা)\nIRQ1 → kbd_isr','n',{m:1}),B('isr',300,172,190,48,'ISR (kernel handler)','o')]}),
    S('হঠাৎ keyboard-এ key চাপা হল। Hardware CPU-কে <b>interrupt</b> সংকেত পাঠায়: "জরুরি, আমাকে দেখো!" এটা program চায়নি, বাইরে থেকে এসেছে।',{add:[A('irq',558,52,224,76,'o'),T('irql',400,52,'interrupt',{a:'middle',c:'o',s:'sm b'})],mod:{dev:{hl:1}}}),
    S('CPU চলতি instruction শেষ করে নিজের অবস্থা (<code>PC</code>, register) <b>save</b> করে রাখে, যাতে পরে ঠিক ওখান থেকে ফিরতে পারে।',{del:['irq','irql'],add:[B('sv',30,172,190,48,'Saved: PC, registers\n(ফেরার জন্য)','g')],mod:{dev:{hl:0}}}),
    S('CPU <b>IDT</b> দেখে। এটা একটা তালিকা: "কোন সংকেত এলে কোন handler চলবে"। IRQ1 = keyboard, handler = <code>kbd_isr</code>।',{add:[A('a1',222,100,298,120,'o')],mod:{idt:{c:'o',hl:1}}}),
    S('<b>ISR</b> (handler, kernel code) চলে: key কোনটা চাপা হল পড়ে, buffer-এ রেখে দেয়।',{add:[A('a2',395,150,395,170,'o')],mod:{isr:{hl:1},idt:{hl:0}}}),
    S('কাজ শেষে <code>iret</code>: save করা অবস্থা ফেরত আসে, program ঠিক আগের জায়গা থেকে আবার চলে। Program টেরই পায়নি।',{del:['a1','a2'],add:[A('a3',298,196,222,196,'g')],mod:{isr:{hl:0},sv:{hl:1}}})
  ]},
  {n:'2. Interrupt বনাম System call',steps:[
    S('দুটোতেই CPU চলতি কাজ ছেড়ে kernel-এর কোড চালায়। তফাত একটাই: <b>কে শুরু করল</b>।',{add:[T('h',380,12,'দুটোই kernel-এ ঢোকায়, শুরু করে আলাদা কেউ',{a:'middle',c:'f',s:'sm b'}),B('cpu1',330,34,140,56,'CPU','g'),B('cpu2',330,140,140,56,'CPU','g')]}),
    S('<b>Interrupt:</b> শুরু করে <b>hardware</b>, যেকোনো সময়। Program জানত না। <b>উপমা:</b> তুমি পড়ছ, হঠাৎ ফোন বাজল।',{add:[B('hw',20,34,170,56,'Hardware\n(keyboard, timer)','o'),A('l1',192,62,328,62,'o'),T('l1l',260,48,'হঠাৎ',{a:'middle',c:'o',s:'sm b'}),T('n1',600,62,'কে: hardware\nকখন: অপ্রত্যাশিত',{a:'middle',c:'o',s:'sm'})]}),
    S('<b>System call:</b> শুরু করে <b>program নিজে</b>, যখন কাজ দরকার। <b>উপমা:</b> তুমি নিজে লাইব্রেরিয়ানের কাছে গিয়ে বই চাইলে।',{add:[B('pg',20,140,170,56,'Program\n(read() ডাকল)','a'),A('l2',192,168,328,168,'a'),T('l2l',260,154,'নিজে চাইল',{a:'middle',c:'a',s:'sm b'}),T('n2',600,168,'কে: program\nকখন: পরিকল্পিত',{a:'middle',c:'a',s:'sm'})]}),
    S('<b>তৃতীয় জিনিস, Exception:</b> instruction-ই ভুল (০ দিয়ে ভাগ, page fault)। CPU নিজেই kernel-কে ডাকে। <b>উপমা:</b> অঙ্কে ভুল করলে শিক্ষক থামালেন।',{add:[T('ex',380,222,'Exception: ভুল instruction থেকে, CPU নিজেই ডাকে',{a:'middle',c:'r',s:'sm b'})]}),
    S('<b>সারকথা:</b> Interrupt = hardware ডাকে (async)। Syscall = program ডাকে (sync)। Exception = ভুল instruction ডাকে (sync)। তিনটাতেই শেষে kernel handler চলে আর CPU ফেরে।',{})
  ]}
 ]},

{p:7,q:'What are the multithreading models (user-level, kernel-level, one-to-one, many-to-many)?',
 ans:'<b>Many-to-one (M:1)</b>: অনেক user thread → ১ kernel thread; দ্রুত, কিন্তু multicore নেই, একটা block করলে সব block। <b>One-to-one (1:1)</b>: প্রতিটির নিজস্ব kernel thread (Linux, Java) - সত্যিকারের parallel। <b>Many-to-many (M:N)</b>: হাইব্রিড (Go)।',
 pts:['Tab চাপো আর "block" ধাপে পার্থক্য দেখো।'],
 tabs:[{n:'Many-to-one (M:1)',steps:()=>modelSteps('m1')},{n:'One-to-one (1:1)',steps:()=>modelSteps('11')},{n:'Many-to-many (M:N)',steps:()=>modelSteps('mn')}]},

{p:7,q:'What is IPC (Inter-Process Communication)?',opt:1,
 ans:'Process-এর memory আলাদা, তাই কথা বলতে <b>kernel-এর মাধ্যমে</b>: <b>Pipe</b> (এক-মুখী byte stream, <code>ls | grep</code>), <b>Message queue</b>, <b>Shared memory</b> (সবচেয়ে দ্রুত), <b>Socket</b> (network/local), <b>Signal</b> (ছোট notification, <code>SIGKILL</code>)।',
 pts:['Shared memory-তে synchronization নিজেকে করতে হয় (mutex/semaphore)।','Pipe/queue-তে kernel buffer ও copy আছে - ধীর কিন্তু নিরাপদ।'],
 tabs:[
  {n:'Pipe',steps:[
    S('A আর B আলাদা memory-র process। মাঝে kernel-এর <b>pipe buffer</b>।',{add:[B('pa',30,60,150,70,'Process A\nwrite()','a'),B('kz',260,20,240,150,'','o',{dash:1}),T('kzl',274,36,'Kernel',{c:'o',s:'b'}),B('buf',280,80,200,50,'pipe buffer','o'),B('pb',580,60,150,70,'Process B\nread()','b')]}),
    S('A <code>write("hi")</code> → data kernel buffer-এ কপি হল।',{add:[A('w',180,95,278,105,'a'),B('d',330,92,90,26,'hi','a')]}),
    S('B <code>read()</code> → kernel buffer থেকে B-তে কপি। দুই syscall, দুই কপি - ধীর কিন্তু নিরাপদ।',{add:[A('r',482,105,578,95,'b')],mod:{d:{x:380,c:'b'}}})
  ]},
  {n:'Shared memory',steps:[
    S('A আর B আলাদা।',{add:[B('pa',30,40,150,70,'Process A','a'),B('pb',580,40,150,70,'Process B','b')]}),
    S('Kernel একটা RAM page দুই process-এরই address space-এ <b>map</b> করে।',{add:[B('sh',280,150,200,56,'Shared RAM page','g'),A('m1',120,112,300,148,'a'),A('m2',640,112,460,148,'b')]}),
    S('A লেখে, B <b>সরাসরি</b> পড়ে - মাঝে kernel নেই, তাই সবচেয়ে দ্রুত। কিন্তু race condition ঠেকাতে mutex/semaphore লাগে।',{add:[T('x',380,126,'A লেখে → B পড়ে',{a:'middle',c:'g',s:'b'})],mod:{sh:{hl:1}}})
  ]}
 ]},

{p:8,q:'How do drivers (keyboard, mouse, monitor) work - in user space or kernel space?',
 ans:'Driver = hardware-এর সাথে কথা বলার software। বেশির ভাগ driver <b>kernel space</b>-এ (loadable module), কারণ hardware register ও interrupt লাগে। Keyboard/mouse: interrupt → kernel driver → input event → user-space (display server, app)। Monitor: GPU driver-এর kernel অংশ (DRM/KMS) + user অংশ (Mesa)।',
 pts:['Driver bug → পুরো system crash (kernel panic/BSOD)। তাই কিছু driver user space-এ (FUSE, libusb) আর microkernel-এ প্রায় সবই।'],
 steps:[
  S('তিন স্তর: user space, kernel space, hardware।',{add:[
    B('uz',20,4,720,74,'','a',{dash:1}),T('uzl',32,16,'User space (ring 3)',{c:'a',s:'b'}),B('app',40,32,150,38,'App (editor)','a'),B('ds',230,32,170,38,'Display server','a'),
    B('kz',20,86,720,78,'','o',{dash:1}),T('kzl',32,98,'Kernel space (ring 0)',{c:'o',s:'b'}),B('kd',40,114,150,40,'Keyboard driver','o'),B('inp',230,114,150,40,'Input subsystem','o'),B('gd',420,114,150,40,'GPU driver (DRM)','o'),
    B('hz',20,172,720,62,'','n',{dash:1}),B('kb',40,188,150,38,'Keyboard','n'),B('mon',420,188,150,38,'Monitor / GPU','n')]}),
  S('Key চাপলে hardware <b>IRQ</b> পাঠায়; kernel-এর keyboard driver ধরে।',{add:[A('a1',115,188,115,156,'o'),T('a1l',125,172,'IRQ',{c:'o',s:'sm'})],mod:{kb:{hl:1}}}),
  S('Driver → input subsystem → display server → app। Event পৌঁছল user space-এ।',{add:[A('a2',190,134,228,134,'o'),A('a3',315,112,315,72,'a'),A('a4',230,51,192,51,'a')],mod:{kb:{hl:0}}}),
  S('App-এর আঁকা ছবি display server → GPU driver (kernel) → monitor।',{add:[A('b1',360,72,450,112,'g'),A('b2',495,156,495,186,'g')],mod:{mon:{hl:1}}})
 ]},

{p:8,q:'Monolithic kernel vs microkernel.',
 ans:'<b>Monolithic</b> (Linux): সব service kernel space-এ - দ্রুত, কিন্তু একটা bug পুরো kernel ফেলে। <b>Microkernel</b> (Minix, QNX): kernel ছোট; বাকি service user-space server - স্থিতিশীল, কিন্তু IPC-র কারণে একটু ধীর। <b>Hybrid</b>: Windows NT, macOS।',
 pts:[],
 tabs:[{n:'Monolithic',steps:()=>kernelSteps('mono')},{n:'Microkernel',steps:()=>kernelSteps('micro')}]},

{p:8,q:'File system basics: inode and file descriptor.',
 ans:'File disk-এ থাকে তিন ভাগে: <b>directory</b> (নাম → inode নম্বর), <b>inode</b> (file-এর পরিচয়পত্র: মাপ, মালিক, permission, data কোথায়), আর <b>data block</b> (আসল লেখা)। <b>File descriptor</b> = <code>open()</code> করার পর kernel-এর দেওয়া ছোট সংখ্যা (টোকেন), যা দিয়ে process ওই file-এ কাজ করে।',
 pts:['<b>নাম inode-এ থাকে না</b>, থাকে directory-তে। তাই নাম বদলালে file-এর data বা inode বদলায় না।','<b>fd:</b> 0 = stdin (keyboard), 1 = stdout (screen), 2 = stderr (error)। <code>open()</code> প্রথম ফাঁকা সংখ্যা দেয়, সাধারণত 3।','<b>Hard link:</b> একই inode-এ একাধিক নাম।'],
 tabs:[
  {n:'1. File disk-এ কীভাবে থাকে',steps:[
    S('File সংরক্ষণে <b>তিনটা জিনিস</b>। <b>উপমা (লাইব্রেরি):</b> directory = সূচিপত্র (নাম → নম্বর), inode = বইয়ের catalog card (মাপ, লেখক, কোথায় আছে), data block = বইয়ের আসল পাতা।',{add:[B('dir',20,20,200,80,'Directory\n(সূচিপত্র)\nনাম → inode নম্বর','a'),B('ino',290,20,230,80,'inode\n(পরিচয়পত্র)\nমাপ, মালিক, permission,\nআসল data কোথায়','o'),B('dat',590,20,150,80,'Data block\n(আসল লেখা)','g'),A('x1',222,60,288,60,'n',{dash:1}),A('x2',522,60,588,60,'n',{dash:1})]}),
    S('তুমি <code>a.txt</code> খুলতে চাইলে প্রথমে <b>directory</b>-তে নাম খোঁজা হয়। পাওয়া যায়: <b>a.txt → inode 12</b>।',{add:[T('s1',120,150,'a.txt  →  inode 12',{a:'middle',c:'a',s:'m b'})],mod:{dir:{hl:1}}}),
    S('এবার <b>inode 12</b> খোলা হয়। সেখানে লেখা: file কত বড়, কার, কে পড়তে পারবে, আর আসল data আছে <b>block 7, 9, 15</b>-এ।',{add:[T('s2',405,150,'size 3 KB · owner · permission · blocks: 7, 9, 15',{a:'middle',c:'o',s:'sm b'})],mod:{dir:{hl:0},ino:{hl:1}}}),
    S('Kernel <b>block 7, 9, 15</b> থেকে আসল লেখা পড়ে নিয়ে আসে। এভাবেই file খোলা যায়।',{add:[B('b7',590,110,150,28,'Block 7','g',{s:'sm'}),B('b9',590,142,150,28,'Block 9','g',{s:'sm'}),B('b15',590,174,150,28,'Block 15','g',{s:'sm'})],mod:{ino:{hl:0},dat:{hl:1}}}),
    S('<b>মনে রাখো:</b> নাম থাকে directory-তে, inode-এ না। তাই file-এর নাম বদলালে শুধু directory-র লেখা বদলায়, inode আর data একই থাকে।',{mod:{dat:{hl:0}}})
  ]},
  {n:'2. File descriptor',steps:[
    S('File-এ কাজ করতে process আগে <code>open("a.txt")</code> ডাকে। Kernel file খোলে, আর process-কে একটা <b>ছোট সংখ্যা</b> ফেরত দেয়। এই সংখ্যাই <b>file descriptor (fd)</b>।',{add:[B('pr',20,50,150,70,'Process\nopen("a.txt")','a'),B('kn',260,50,160,70,'Kernel\nfile খোলে','o'),A('a1',172,85,258,85,'a'),A('a2',258,100,172,100,'g'),T('a2l',215,118,'fd = 3',{a:'middle',c:'g',s:'sm b'})]}),
    S('প্রতিটা process-এর নিজের <b>fd table</b> আছে। শুরুতেই তিনটা নেওয়া: <b>0 = stdin</b> (keyboard), <b>1 = stdout</b> (screen), <b>2 = stderr</b> (error বার্তা)।',{del:['kn','a1','a2','a2l'],add:[B('fd',230,20,170,100,'fd table\n0  stdin\n1  stdout\n2  stderr','b',{m:1})],mod:{pr:{y:50}}}),
    S('<code>open("a.txt")</code> প্রথম ফাঁকা জায়গা নেয়: <b>fd 3</b>। সে যায় একটা <b>open file entry</b>-তে (এখন file-এর কোথায় আছি, offset), সেখান থেকে <b>inode</b>-এ।',{mod:{fd:{label:'fd table\n0  stdin\n1  stdout\n2  stderr\n3  → a.txt'}},add:[B('of',450,30,160,60,'open file entry\nঅবস্থান (offset) = 0','n',{m:1,s:'sm'}),B('in',650,30,100,60,'inode 12\n(a.txt)','o'),A('a3',402,70,448,60,'b'),A('a4',612,60,648,60,'n')]}),
    S('এরপর <code>read(3, ...)</code> লিখলেই kernel বোঝে "fd 3 মানে a.txt"। নাম বারবার লিখতে হয় না। <b>উপমা:</b> reception থেকে টোকেন নম্বর পেলে পরের বার শুধু নম্বর বললেই চলে।',{add:[T('rd',300,160,'read(3, buf, 100)   →   a.txt থেকে পড়ো',{a:'middle',c:'g',s:'m b'})],mod:{fd:{hl:1}}}),
    S('কাজ শেষে <code>close(3)</code>। fd 3 আবার ফাঁকা হয়, পরের <code>open()</code> এই সংখ্যাটা আবার পেতে পারে।',{del:['rd'],mod:{fd:{label:'fd table\n0  stdin\n1  stdout\n2  stderr\n3  (ফাঁকা)',hl:0},of:{o:0.2},in:{o:0.5}}})
  ]},
  {n:'3. Hard link',steps:[
    S('একটা file-এর <b>একাধিক নাম</b> থাকতে পারে। <code>a.txt</code> আর <code>b.txt</code> দুটো নামই <b>একই inode 12</b>-কে দেখায়।',{add:[B('dir',20,30,230,90,'Directory\na.txt → inode 12\nb.txt → inode 12','a',{m:1}),B('ino',350,30,200,90,'inode 12\nlinks: 2\n(data একটাই)','o',{m:1}),B('dat',640,50,100,50,'Data','g'),A('x1',252,75,348,75,'a'),A('x2',552,75,638,75,'o')]}),
    S('একে বলে <b>hard link</b>। Data কপি হয়নি, একটাই আছে। শুধু দুটো নাম একই জায়গা দেখায়। <code>links: 2</code> মানে "দুটো নাম আছে"।',{mod:{ino:{hl:1}}}),
    S('<code>rm a.txt</code> করলে একটা নাম মুছল, <code>links: 1</code>। কিন্তু <b>data থাকে</b>, কারণ <code>b.txt</code> এখনো আছে।',{mod:{dir:{label:'Directory\nb.txt → inode 12'},ino:{label:'inode 12\nlinks: 1\n(data আছে)',hl:0}}}),
    S('শেষ নামটাও মুছলে <code>links: 0</code>। তখন inode আর data block সত্যিই মুছে যায়।',{mod:{dir:{label:'Directory\n(কোনো নাম নেই)'},ino:{label:'inode 12\nlinks: 0\n(মুছে গেল)',c:'r'},dat:{c:'r',dash:1}}})
  ]}
 ]},

{p:9,q:'What is the difference between a system call and a library call (printf vs write)?',
 ans:'<b>Library call</b> (<code>printf</code>) user space-এর libc ফাংশন - format করে, buffer রাখে; অনেক ক্ষেত্রে kernel-ই লাগে না। <b>System call</b> (<code>write</code>) kernel-এ ঢোকার দরজা - mode switch হয়, ধীর। <code>printf</code> শেষে (buffer flush করার সময়) <code>write</code> syscall করে।',
 pts:['<code>strace</code> দিয়ে আসল syscall দেখা যায়।','<code>strlen</code>, <code>sqrt</code> - library call, syscall নেই।'],
 steps:[
  S('App <code>printf("hi\\n")</code> call করল - এটা libc-র function।',{add:[B('app',20,90,130,60,'App\nprintf("hi")','a'),B('lib',190,90,160,60,'libc (user space)\nformat + buffer','s'),B('wr',390,90,150,60,'write() wrapper\nsyscall instruction','o'),B('ker',580,90,160,60,'Kernel (ring 0)\nsys_write → driver','r'),A('a1',152,120,188,120,'a')]}),
  S('libc string format করে, <b>buffer</b>-এ রাখে। এখনো kernel জানে না।',{mod:{lib:{hl:1}}}),
  S('Buffer flush (যেমন <code>\\n</code> বা ভরলে) → libc <code>write(1, "hi\\n", 3)</code> ডাকে।',{add:[A('a2',352,120,388,120,'s')],mod:{lib:{hl:0},wr:{hl:1}}}),
  S('<b>syscall</b> instruction → mode switch ring 3 → 0 → kernel terminal-এ লেখে।',{add:[A('a3',542,120,578,120,'o')],mod:{wr:{hl:0},ker:{hl:1}}}),
  S('<code>strlen</code>-এর মতো library call kernel-এ যায়ই না।',{add:[T('nt',380,200,'printf = library call (user space)   |   write = system call (kernel-এ ঢোকে)',{a:'middle',c:'f',s:'sm b'})]})
 ]},

{p:9,q:'What is the difference between an interrupt, a trap and an exception?',
 ans:'তিনটাই CPU-কে চলতি কাজ থামিয়ে kernel-এর handler চালাতে বাধ্য করে। তফাত <b>কে ডাকল</b>: <b>Interrupt</b> = বাইরের hardware। <b>Trap</b> = program নিজে ইচ্ছা করে (syscall)। <b>Exception</b> = instruction-এর ভুল (০ দিয়ে ভাগ, page fault)।',
 pts:['<b>Timer interrupt</b> ছাড়া OS CPU কেড়ে নিতে পারত না। প্রতি কয়েক ms-এ সে-ই context switch চালু করে (preemptive scheduling)।','<b>Maskable</b> interrupt OS সাময়িক বন্ধ রাখতে পারে। <b>NMI</b> কখনো বন্ধ হয় না (জরুরি hardware ত্রুটি)।','<b>ফেরা:</b> interrupt আর trap-এ পরের instruction-এ। Fault-এ (যেমন page fault) ওই instruction-ই আবার।'],
 tabs:[
  {n:'1. তিনটার পার্থক্য',steps:[
    S('<b>Interrupt</b>: বাইরের hardware ডাকে, <b>যেকোনো সময়</b> (program আগে জানত না)। উপমা: পড়ার সময় হঠাৎ ফোন বাজল।',{add:[B('i',20,10,230,150,'Interrupt\nউৎস: hardware\nকখন: যেকোনো সময়\n(asynchronous)\nউদা: key চাপা, timer\nফেরা: পরের instruction','o'),T('ia',135,180,'উপমা: ফোন বাজল',{a:'middle',c:'o',s:'sm b'})]}),
    S('<b>Trap</b>: program <b>নিজে ইচ্ছা করে</b> ডাকে। উপমা: তুমি নিজে লাইব্রেরিয়ানের কাছে গিয়ে বই চাইলে।',{add:[B('t',270,10,230,150,'Trap\nউৎস: program নিজে\nকখন: যখন চায়\n(synchronous)\nউদা: syscall, breakpoint\nফেরা: পরের instruction','a'),T('ta',385,180,'উপমা: নিজে বই চাইলে',{a:'middle',c:'a',s:'sm b'})]}),
    S('<b>Exception / fault</b>: instruction-ই <b>ভুল</b>। CPU নিজেই kernel-কে ডাকে। উপমা: অঙ্কে ভুল করলে শিক্ষক থামালেন।',{add:[B('e',520,10,230,150,'Exception / fault\nউৎস: ভুল instruction\nকখন: ভুল ঘটলে\n(synchronous)\nউদা: ০ দিয়ে ভাগ, page fault\nফেরা: ওই instruction আবার','r'),T('ea',635,180,'উপমা: শিক্ষক থামালেন',{a:'middle',c:'r',s:'sm b'})]}),
    S('তিনটাই <b>IDT</b> দেখে kernel-এর handler চালায়, শেষে <code>iret</code> দিয়ে ফেরে।',{add:[B('idt',150,200,460,34,'সবই: IDT → kernel handler → iret','n')]})
  ]},
  {n:'2. Interrupt-এর ধরন',steps:[
    S('<b>Hardware interrupt</b> অনেক রকম। সাধারণগুলো: <b>Timer</b> (প্রতি কয়েক ms), <b>Keyboard/Mouse</b> (key বা click), <b>Disk/SSD</b> (I/O শেষ), <b>Network card</b> (packet এল)।',{add:[T('h1',20,12,'সাধারণ hardware interrupt',{c:'f',s:'sm b'}),B('hi0',20,30,170,56,'Timer\nপ্রতি কয়েক ms','o'),B('hi1',200,30,170,56,'Keyboard / Mouse\nkey, click','o'),B('hi2',380,30,170,56,'Disk / SSD\nI/O শেষ হল','o'),B('hi3',560,30,180,56,'Network card\npacket এল','o')]}),
    S('এগুলোকে <b>maskable</b> বলে: OS জরুরি কাজের সময় সাময়িক <b>বন্ধ রাখতে</b> পারে, পরে খোলে।',{add:[B('mk',20,96,720,30,'Maskable: OS সাময়িক বন্ধ রাখতে পারে','g',{s:'sm'})]}),
    S('<b>NMI</b> (Non-Maskable Interrupt): <b>কখনো বন্ধ করা যায় না</b>। জরুরি hardware ত্রুটির জন্য, যেমন memory error, watchdog।',{add:[T('h2',20,148,'বিশেষ interrupt',{c:'f',s:'sm b'}),B('nmi',20,166,350,56,'NMI (বন্ধ করা যায় না)\nজরুরি hardware ত্রুটি, watchdog','r')]}),
    S('<b>IPI</b> (Inter-Processor Interrupt): এক CPU core আরেক core-কে ডাকে। যেমন একটা core page table বদলালে অন্য core-দের TLB পরিষ্কার করতে বলে।',{add:[B('ipi',390,166,350,56,'IPI (core থেকে core)\nএক core অন্যকে ডাকে, যেমন TLB flush','b')]}),
    S('<b>সারকথা:</b> বাইরের জন্য hardware interrupt (timer, keyboard, disk, network)। জরুরি হলে NMI। Core-দের নিজেদের মধ্যে IPI। আর trap ও exception interrupt না, কিন্তু একই handler-পথে যায়।',{})
  ]},
  {n:'3. Timer interrupt → context switch',steps:[
    S('Thread A চলছে। <b>Timer</b> (hardware ঘড়ি) প্রতি কয়েক ms-এ CPU-কে interrupt পাঠায়। এটা না থাকলে A নিজে না ছাড়লে CPU আর কেউ পেত না।',{add:[B('tm',200,10,200,40,'Timer (hardware ঘড়ি)','o'),B('ta',20,90,170,56,'Thread A\nচলছে','a'),T('tl',380,200,'প্রতি ~১-১০ ms-এ ঘড়ি বাজে',{a:'middle',c:'n',s:'sm'})]}),
    S('ঘড়ি বাজল: <b>timer interrupt</b>। CPU A-কে থামিয়ে kernel-এ ঢোকে, A-র অবস্থা save করে।',{add:[A('a1',300,52,300,88,'o'),B('kn',230,90,170,56,'Kernel\n(interrupt handler)','o')],mod:{ta:{c:'n',dash:1}}}),
    S('<b>Scheduler</b> দেখে: A-র time slice শেষ। Ready queue থেকে পরের thread <b>B</b> বাছে।',{add:[T('sc',315,162,'A-র slice শেষ, পরেরটা B',{a:'middle',c:'o',s:'sm b'})]}),
    S('<b>Context switch:</b> A-র register <b>TCB-তে save</b>, B-র register <b>load</b>।',{add:[B('sv',230,176,170,40,'save A → load B','g',{s:'sm'})]}),
    S('<code>iret</code>: CPU ফেরে, এবার <b>B চলে</b>। A আবার তার পালায় ফিরবে।',{add:[A('a2',402,118,438,118,'b'),B('tb',440,90,170,56,'Thread B\nচলছে','b')]}),
    S('<b>সারকথা:</b> timer interrupt = ঘড়ি। ঘড়ি বাজলেই OS CPU কেড়ে নিয়ে অন্য thread-কে দেয়। এটাই <b>preemptive scheduling ও context switch</b>-এর ভিত্তি।',{})
  ]}
 ]},

{p:9,q:'What is the difference between multiprogramming, multitasking, multiprocessing and multithreading?',
 ans:'<b>Multiprogramming:</b> একাধিক job RAM-এ, একটা I/O-তে গেলে CPU অন্যটায়। <b>Multitasking:</b> তার উপর time-slice, সবাই ঘুরে ঘুরে চলে। <b>Multiprocessing:</b> একাধিক CPU/core, সত্যিই একই মুহূর্তে। <b>Multithreading:</b> এক process-এ একাধিক thread। Tab চেপে একটা একটা করে দেখো।',
 pts:['<b>Concurrency:</b> অনেক কাজ একসাথে <b>এগোচ্ছে</b>, ঘুরে ঘুরে হলেও। এক core-তেই সম্ভব। <b>Parallelism:</b> অনেক কাজ <b>ঠিক একই মুহূর্তে</b> চলছে। একাধিক core লাগে।','<b>উপমা:</b> একজন বাবুর্চি দুই চুলায় পালা করে রাঁধছে = concurrency। দুজন বাবুর্চি দুই চুলায় একসাথে রাঁধছে = parallelism।','প্রতিটা tab-এর শেষে দেখো সেটা concurrency, parallelism, নাকি দুটোই।'],
 extra:'<table class="cmp"><tr><th></th><th>মানে</th><th>লক্ষ্য</th><th>Concurrency</th><th>Parallelism</th></tr>'
  +'<tr><td>Multiprogramming</td><td>একাধিক job RAM-এ, I/O-তে গেলে CPU অন্যটায়</td><td>CPU utilization</td><td>✓</td><td>✗</td></tr>'
  +'<tr><td>Multitasking</td><td>Multiprogramming + time-slice</td><td>সাড়া দেওয়া (responsiveness)</td><td>✓</td><td>✗ (এক core-এ)</td></tr>'
  +'<tr><td>Multiprocessing</td><td>একাধিক CPU/core</td><td>গতি, throughput</td><td>✓</td><td>✓</td></tr>'
  +'<tr><td>Multithreading</td><td>এক process-এ একাধিক thread</td><td>একই process-এ কাজ ভাগ</td><td>✓ সবসময়</td><td>✓ শুধু একাধিক core-এ</td></tr></table>',
 tabs:[
  {n:'1. Multiprogramming',steps:[
    S('<b>Multiprogramming:</b> RAM-এ একসাথে একাধিক job রাখা হয়। এখানে A, B, C। CPU মাত্র <b>১টা</b>।',{add:[B('ram',20,10,330,64,'RAM-এ ৩টা job: A, B, C','g',{dash:1}),T('cl',20,125,'CPU (১টা)',{c:'f',s:'b'})]}),
    S('A CPU-তে চলছে।',{add:[B('a1',140,100,150,50,'A চলে','a')]}),
    S('A disk থেকে data চাইল, <b>I/O-র জন্য অপেক্ষা</b> করছে। CPU বসে থাকলে নষ্ট। তাই OS CPU <b>B-কে</b> দেয়।',{add:[B('aw',140,160,150,34,'A: disk-এর অপেক্ষা','n',{dash:1,s:'sm'}),B('b1',290,100,200,50,'B চলে (A-র I/O চলছে)','b')],mod:{a1:{label:'A: I/O শুরু',c:'n',dash:1}}}),
    S('A-র I/O শেষ, A আবার CPU পায়। <b>CPU পুরো সময় ব্যস্ত</b>, তাই utilization বেশি। এটাই multiprogramming-এর লক্ষ্য।',{add:[B('a2',490,100,150,50,'A আবার চলে','a')],mod:{aw:{o:0}}}),
    S('<b>Concurrency ✓</b> (এক CPU-তে পালা করে অনেক job এগোয়)। <b>Parallelism ✗</b> (একই মুহূর্তে একটাই চলে)।',{add:[B('cc',140,196,200,30,'Concurrency ✓','g'),B('pp',360,196,200,30,'Parallelism ✗','r')]})
  ]},
  {n:'2. Multitasking',steps:[
    S('<b>Multitasking (time-sharing):</b> multiprogramming-এর উপর <b>timer</b>। প্রতিটা job ছোট time-slice (যেমন ১০ ms) পায়, I/O না থাকলেও।',{add:[T('cl',20,125,'CPU (১টা)',{c:'f',s:'b'}),T('tl',140,80,'সময় →',{c:'n',s:'sm'})]}),
    S('A এক slice চলে, timer বাজে, OS কেড়ে নিয়ে B-কে দেয়, তারপর C।',{add:[B('s0',140,100,52,50,'A','a'),B('s1',194,100,52,50,'B','b'),B('s2',248,100,52,50,'C','g')]}),
    S('আবার A, B, C... এভাবে ঘুরতে থাকে। প্রতিবার timer interrupt আসে।',{add:[B('s3',302,100,52,50,'A','a'),B('s4',356,100,52,50,'B','b'),B('s5',410,100,52,50,'C','g'),B('s6',464,100,52,50,'A','a'),B('s7',518,100,52,50,'B','b'),B('s8',572,100,52,50,'C','g')]}),
    S('Slice এত ছোট যে ব্যবহারকারীর মনে হয় গান, browser, editor <b>একসাথে</b> চলছে। আসলে ঘুরে ঘুরে। লক্ষ্য: <b>সাড়া দেওয়া</b> (responsiveness)।',{add:[T('note',380,185,'টাইপ করছ, গান বাজছে, browser খোলা: সবাই সাড়া দেয়',{a:'middle',c:'f',s:'sm b'})]}),
    S('<b>Concurrency ✓</b> (সবাই এগোয়)। <b>Parallelism ✗</b> (এক core-এ একই মুহূর্তে একটাই)।',{del:['note'],add:[B('cc',140,196,200,30,'Concurrency ✓','g'),B('pp',360,196,200,30,'Parallelism ✗','r')]})
  ]},
  {n:'3. Multiprocessing',steps:[
    S('<b>Multiprocessing:</b> একাধিক CPU বা core। এখানে ৩টা core। প্রতিটা নিজের কাজ নিজে চালায়।',{add:[T('c1',20,48,'Core 1',{c:'f',s:'b'}),T('c2',20,108,'Core 2',{c:'f',s:'b'}),T('c3',20,168,'Core 3',{c:'f',s:'b'}),T('tl',140,10,'সময় →',{c:'n',s:'sm'})]}),
    S('Core 1-এ A চলছে।',{add:[B('a',140,26,420,44,'A','a')]}),
    S('<b>ঠিক একই সময়ে</b> Core 2-এ B-ও চলছে। কেউ কারো জন্য অপেক্ষা করছে না।',{add:[B('b',140,86,420,44,'B','b'),A('vl',350,16,350,194,'o',{dash:1}),T('vll',350,206,'একই মুহূর্ত',{a:'middle',c:'o',s:'sm b'})]}),
    S('Core 3-এ C। তিনটা কাজ একই মুহূর্তে চলছে: <b>সত্যিকারের parallel</b>। লক্ষ্য: গতি বাড়ানো।',{add:[B('c',140,146,420,44,'C','g')]}),
    S('<b>Parallelism ✓</b> (একই মুহূর্তে অনেক কাজ)। <b>Concurrency ✓</b>-ও (সব কাজ এগোচ্ছে)। শর্ত: একাধিক core থাকতে হবে।',{del:['vl','vll'],add:[B('cc',140,200,200,30,'Concurrency ✓','g'),B('pp',360,200,200,30,'Parallelism ✓','g')]})
  ]},
  {n:'4. Multithreading',steps:[
    S('<b>Multithreading:</b> একটা <b>process</b>-এর ভেতরে একাধিক <b>thread</b>। তারা code, data, heap ভাগ করে, প্রত্যেকের নিজের stack।',{add:[B('pr',20,10,330,120,'','a',{dash:1}),T('prl',34,26,'একটা process (যেমন browser)',{c:'a',s:'sm b'}),B('t1',36,44,90,44,'Thread 1\nUI','g'),B('t2',134,44,90,44,'Thread 2\nnetwork','s'),B('t3',232,44,90,44,'Thread 3\nrender','b'),B('sh',36,96,286,26,'shared: code, data, heap','n',{s:'sm'})]}),
    S('<b>এক core হলে:</b> thread-রা ঘুরে ঘুরে চলে। এটা <b>concurrency</b>, parallelism না।',{add:[T('l1',380,14,'এক core',{c:'f',s:'sm b'}),...[0,1,2,3,4,5].map(i=>B('x'+i,380+i*58,28,54,36,'T'+(i%3+1),['g','s','b'][i%3]))]}),
    S('<b>দুই core হলে:</b> Thread 1 আর Thread 2 <b>একই মুহূর্তে</b> আলাদা core-এ চলে। এটা <b>parallelism</b>।',{add:[T('l2',380,84,'দুই core',{c:'f',s:'sm b'}),B('y1',380,100,340,34,'Core 1: Thread 1','g'),B('y2',380,140,340,34,'Core 2: Thread 2','s')]}),
    S('<b>Concurrency ✓ সবসময়</b> (thread থাকলেই)। <b>Parallelism ✓ শুধু একাধিক core-এ</b>। লক্ষ্য: এক process-এর কাজ ভাগ করা (UI আটকায় না, network আলাদা চলে)।',{add:[B('cc',20,196,330,30,'Concurrency ✓ সবসময়','g'),B('pp',380,196,340,30,'Parallelism ✓ শুধু একাধিক core-এ','o')]})
  ]}
 ]},

{p:9,q:'What happens inside the OS when a process crashes (core dump, resource cleanup)?',
 ans:'Process এমন কিছু করল যা CPU অনুমতি দেয় না (যেমন অবৈধ memory access)। তখন: <b>১)</b> CPU exception দেয়, <b>২)</b> kernel process-কে <b>signal</b> (যেমন <code>SIGSEGV</code>) পাঠায়, <b>৩)</b> default action: process <b>terminate</b> (সাথে <b>core dump</b>), <b>৪)</b> kernel সব resource <b>cleanup</b> করে, <b>৫)</b> parent-কে জানায়। OS আর অন্য process ঠিক থাকে।',
 pts:['<b>কেন crash:</b> NULL pointer, অবৈধ address, stack overflow (<code>SIGSEGV</code>), ০ দিয়ে ভাগ (<code>SIGFPE</code>), ভুল instruction (<code>SIGILL</code>)।','<b>Core dump:</b> crash-এর মুহূর্তে process-এর memory ও register-এর ছবি, ফাইলে সেভ, পরে debugger (<code>gdb</code>) দিয়ে দেখার জন্য।','<b>Cleanup:</b> kernel ফাইল, memory, socket ছেড়ে দেয়। শুধু ছোট entry থাকে (<b>zombie</b>), parent <code>wait()</code> করলে মুছে যায়।','OS ঠিক থাকে, কারণ process-গুলো <b>isolated</b> (প্রত্যেকের নিজস্ব address space)।'],
 tabs:[
  {n:'1. Crash থেকে terminate',steps:[

/* ---------- build page ---------- */
const app=document.getElementById('app'),jump=document.getElementById('jump'),partsNav=document.getElementById('parts');
PARTS.forEach((pt,pi)=>{
  const a=document.createElement('a');a.href='#part'+pi;a.innerHTML=`<b>${pt[0]}</b>${pt[1]}`;partsNav.appendChild(a);
  const sec=document.createElement('section');sec.className='part';sec.id='part'+pi;
  sec.innerHTML=`<h2><span>${pt[0]}</span>${pt[1]}</h2>`;app.appendChild(sec);
});
let mainNo=0;
TOPICS.forEach((t,i)=>{
  const n=t.sub||String(++mainNo);
  const j=document.createElement('a');j.href='#q'+n;j.textContent=n;j.title=t.q;jump.appendChild(j);
  const card=document.createElement('article');card.className='q';card.id='q'+n;
  card.innerHTML=`<h3><span class="num">${n}</span><span>${t.q}${t.opt?' <em class="skip">Optional - skip করা যায়</em>':''}</span></h3><p class="ans">${t.ans}</p>${t.pts&&t.pts.length?'<ul>'+t.pts.map(x=>`<li>${x}</li>`).join('')+'</ul>':''}${t.extra?`<div class="extra">${t.extra}</div>`:''}<div class="viz"></div>`;
  document.getElementById('part'+t.p).appendChild(card);
  mount(card.querySelector('.viz'),t);
});
</script>
