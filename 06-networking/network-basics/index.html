<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Basics - Interview Cheat Sheet</title>
<meta name="description" content="Trainee Software Engineer interview-এর জন্য Networking-এর ১৮টি প্রশ্ন: উত্তর, ছবি ও ধাপে ধাপে D3 animation সহ।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* One card per interview question: short answer, 2-3 bullets, and a step-by-step D3 scene.
   Scenes are plain data (see TOPICS at the bottom): each step adds / modifies / deletes nodes by id
   and the tiny engine animates the difference. */
:root{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#f1f4fa; --fg:#0f172a; --muted:#5b6478; --faint:#94a0b8; --line:#e4e8f1;
  --accent:#6366f1;
  --a:#4f46e5; --b:#db2777; --g:#059669; --o:#d97706; --r:#e11d48; --s:#0284c7;
  --hero:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.14);
  --sans:"Inter","Hind Siliguri",system-ui,sans-serif; --bn:"Hind Siliguri","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a; --surface:#121827; --surface-2:#182033; --fg:#e7ecf6; --muted:#9aa6bf; --faint:#66728c; --line:#232c42;
  --accent:#818cf8; --a:#818cf8; --b:#f472b6; --g:#34d399; --o:#fbbf24; --r:#fb7185; --s:#38bdf8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0b0f1a; --surface:#121827; --surface-2:#182033; --fg:#e7ecf6; --muted:#9aa6bf; --faint:#66728c; --line:#232c42;
  --accent:#818cf8; --a:#818cf8; --b:#f472b6; --g:#34d399; --o:#fbbf24; --r:#fb7185; --s:#38bdf8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 var(--bn);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.86em;font-weight:500;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:color-mix(in srgb,var(--accent) 72%,var(--fg));padding:.1em .4em;border-radius:6px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 18px 70px}

.topnav{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font:800 16px var(--sans);letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 13px var(--mono);background:var(--hero)}
.topnav .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font:600 13px var(--sans);cursor:pointer;text-decoration:none}
.pill:hover{color:var(--fg)}

.hero{margin-top:20px;border-radius:22px;padding:26px 30px;color:#fff;background:var(--hero)}
.hero .eyebrow{font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h1{margin:6px 0 8px;font:800 clamp(26px,4.2vw,38px)/1.15 var(--sans);letter-spacing:-.03em}
.hero p{margin:0;max-width:680px;opacity:.94}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.jump a{min-width:32px;padding:0 6px;height:32px;display:grid;place-items:center;border-radius:9px;text-decoration:none;font:700 13px var(--sans);color:#fff;background:rgba(255,255,255,.18)}
.jump a:hover{background:rgba(255,255,255,.34)}

.parts{position:sticky;top:0;z-index:5;margin:14px -18px 0;padding:10px 18px;display:flex;gap:8px;overflow-x:auto;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none}
.parts a{flex:none;text-decoration:none;font:600 13px var(--sans);color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px}
.parts a:hover{color:var(--fg)}
.parts a b{color:var(--accent);margin-right:4px}

.part{margin-top:44px;scroll-margin-top:60px}
.part>h2{margin:0;font:800 clamp(20px,2.6vw,25px)/1.25 var(--sans);letter-spacing:-.02em}
.part>h2 span{color:var(--accent);margin-right:8px}

.q{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);scroll-margin-top:64px}
.q h3{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px;font:700 18px/1.4 var(--sans);letter-spacing:-.01em}
.skip{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:999px;font:600 12px var(--sans);font-style:normal;white-space:nowrap;color:var(--muted);background:var(--surface-2);border:1px dashed var(--faint);vertical-align:middle}
.num{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 14px var(--sans);background:var(--hero)}
.ans{margin:0 0 10px;padding:10px 14px;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.q ul{margin:0 0 12px;padding-left:20px;color:var(--muted)}
.q li{margin:2px 0}
.q li b,.ans b{color:var(--fg)}
.extra{margin:0 0 12px;overflow-x:auto}
.extra table{border-collapse:collapse;font:500 13px var(--mono)}
.extra th,.extra td{border:1px solid var(--line);padding:3px 10px;text-align:center}
.extra th{background:var(--surface-2)}
.extra .cmp td,.extra .cmp th{text-align:left;vertical-align:top;font:500 13.5px/1.55 var(--bn);min-width:150px}
.extra .cmp td:first-child{font-weight:700;white-space:nowrap;min-width:0}

.viz{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);overflow:hidden}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font:600 12.5px var(--sans);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{overflow-x:auto;padding-top:8px}
.stage svg{display:block;width:100%;min-width:680px;height:auto;cursor:pointer;user-select:none}
.cap{padding:10px 16px;min-height:3.4em;border-top:1px dashed var(--line);font-size:15px}
.ctl{display:flex;align-items:center;gap:8px;padding:0 12px 12px}
.b{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 14px;font:600 13px var(--sans);cursor:pointer}
.b:hover:not(:disabled){border-color:var(--accent)}
.b:disabled{opacity:.4;cursor:default}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.cnt{margin-left:auto;font:500 12px var(--mono);color:var(--faint)}

/* svg scene */
svg text,svg tspan{white-space:pre}
svg text{font-family:var(--sans);font-size:13px;fill:var(--fg);dominant-baseline:central}
.c-n{--cc:var(--muted)} .c-a{--cc:var(--a)} .c-b{--cc:var(--b)} .c-g{--cc:var(--g)}
.c-o{--cc:var(--o)} .c-r{--cc:var(--r)} .c-s{--cc:var(--s)} .c-f{--cc:var(--fg)}
.box rect,.circ circle{fill:color-mix(in srgb,var(--cc) 14%,var(--surface));stroke:var(--cc);stroke-width:1.6;transition:fill .45s,stroke .45s}
.dash rect,.dash circle{stroke-dasharray:6 4;fill:color-mix(in srgb,var(--cc) 4%,transparent)}
.hl rect,.hl circle{stroke-width:3.4;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--cc) 65%,transparent))}
.text text{fill:var(--cc);transition:fill .45s}
.text.b text,.text.lg text{font-weight:700}
.text.lg text{font-size:15px}
.sm text{font-size:11.5px}
.box.hd rect{fill:color-mix(in srgb,var(--cc) 28%,var(--surface))}
.hd text{font-weight:700}
.box.on rect{fill:color-mix(in srgb,var(--cc) 30%,var(--surface));stroke-width:2.2}
.m text{font-family:var(--mono);font-size:12px}
.path path{fill:none;stroke:var(--cc);stroke-width:3.4;stroke-linecap:round}
.arrow line{stroke:var(--cc);stroke-width:2.2;transition:stroke .4s}
.arrow.dash line{stroke-dasharray:6 4}
.arrow.hl line{stroke-width:3.4}
footer{margin-top:50px;text-align:center;color:var(--faint);font:500 13px var(--sans)}

.q .ans code,.q li code{white-space:nowrap}
.hero{background:linear-gradient(135deg,#0d9488,#0284c7 55%,#6366f1)}
.path.thin path{stroke-width:2.2}
.part{margin-top:44px;scroll-margin-top:60px}
.extra .cmp td code,.extra .cmp td{font-size:13px}
.extra pre{margin:10px 0 0;padding:10px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font:500 12.5px/1.6 var(--mono);overflow-x:auto;white-space:pre-wrap}
/* bn-type: Bengali glyphs/digits need normal tracking */
h1,h2,h3,h4,h5{letter-spacing:0!important}
.hero h1,.page-head h1,.p-hero h1,.prose h1,header.top h1{line-height:1.32!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div class="wrap">
  <nav class="topnav">
    <a class="brand" href="../../index.html"><span class="logo">W</span>WellDev</a>
    <span class="sp"></span>
    <button class="pill" id="theme" type="button">Theme</button>
  </nav>
  <header class="hero">
    <div class="eyebrow">Networking · Basics</div>
    <h1>Network Basics: ১৮টি প্রশ্ন + ৫টি Subnet Math</h1>
    <p>Network থেকে addressing, তারপর transport, শেষে web ও security, শেখার ক্রমে। প্রতিটা ধাপে animation, scene-এ ক্লিক করো বা <b>Next</b> চাপো।</p>
  </header>
  <nav class="parts" id="parts"></nav>
  <main id="app"></main>
  <footer>Networking · Basics</footer>
</div>
<script>
/* ---------- theme ---------- */
(function(){
  const root=document.documentElement,btn=document.getElementById('theme');
  try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t;}catch(e){}
  const dark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const label=()=>btn.textContent=dark()?'Light':'Dark';
  btn.onclick=()=>{root.dataset.theme=dark()?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme);}catch(e){}label();};
  label();
})();

/* ---------- scene engine ---------- */
const COLORS=['n','a','b','g','o','r','s','f'];
document.getElementById('defs').innerHTML=COLORS.map(c=>
  `<marker id="ah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--${c==='n'?'muted':c==='f'?'fg':c})"/></marker>`).join('');

const B=(id,x,y,w,h,label,c='n',o={})=>({id,k:'box',x,y,w,h,label,c,...o});
const T=(id,x,y,label,o={})=>({id,k:'text',x,y,label,c:'n',...o});
const A=(id,x1,y1,x2,y2,c='n',o={})=>({id,k:'arrow',x:0,y:0,x1,y1,x2,y2,c,...o});
const C=(id,x,y,r,label,c='n',o={})=>({id,k:'circ',x,y,r,label,c,...o});
const S=(cap,o={})=>({cap,...o});
const F=(x1,y1,x2,y2,c='a',o={})=>({x1,y1,x2,y2,c,...o});
const P=(id,d,c='n',o={})=>({id,k:'path',x:0,y:0,d,c,...o});

function stateAt(steps,i){
  const m=new Map();
  for(let k=0;k<=i;k++){
    const s=steps[k];
    (s.del||[]).forEach(id=>m.delete(id));
    (s.add||[]).forEach(n=>m.set(n.id,{...n}));
    Object.entries(s.mod||{}).forEach(([id,p])=>{if(m.has(id))Object.assign(m.get(id),p);});
  }
  return [...m.values()];
}

function setText(g,cls,str,x,y,anchor,lh=15.5){
  let tx=g.select('text.'+cls);
  if(tx.empty())tx=g.append('text').attr('class',cls);
  const ls=String(str??'').split('\n');
  tx.attr('text-anchor',anchor);
  tx.selectAll('tspan').data(ls).join('tspan').attr('x',x).attr('y',(d,i)=>y-(ls.length-1)*lh/2+i*lh).text(d=>d);
}

function upd(g,d,t){
  g.attr('class',`n ${d.k} c-${d.c||'n'}${d.dash?' dash':''}${d.hl?' hl':''}${d.s?' '+d.s:''}${d.m?' m':''}`);
  if(d.k==='box'){
    let r=g.select('rect');
    if(r.empty())r=g.insert('rect',':first-child').attr('rx',d.rx??9).attr('width',d.w).attr('height',d.h);
    r.transition(t).attr('width',d.w).attr('height',d.h);
    setText(g,'lb',d.label,d.w/2,d.h/2,'middle');
  }else if(d.k==='circ'){
    let r=g.select('circle');
    if(r.empty())r=g.insert('circle',':first-child').attr('r',d.r);
    r.transition(t).attr('r',d.r);
    setText(g,'lb',d.label,0,0,'middle');
  }else if(d.k==='text'){
    setText(g,'lb',d.label,0,0,d.a||'start');
  }else if(d.k==='path'){
    let p=g.select('path');
    if(p.empty()){p=g.append('path').attr('d',d.d);const L=p.node().getTotalLength();p.attr('stroke-dasharray',L).attr('stroke-dashoffset',L).transition(t).attr('stroke-dashoffset',0);}
  }else if(d.k==='arrow'){
    let l=g.select('line');
    if(l.empty())l=g.append('line').attr('x1',d.x1).attr('y1',d.y1).attr('x2',d.x2).attr('y2',d.y2);
    l.attr('marker-end',`url(#ah-${d.c||'n'})`).transition(t).attr('x1',d.x1).attr('y1',d.y1).attr('x2',d.x2).attr('y2',d.y2);
  }
}

function draw(svg,nodes,dur){
  const t=d3.transition().duration(dur).ease(d3.easeCubicInOut);
  svg.select('.layer').selectAll('g.n').data(nodes,d=>d.id).join(
    en=>en.append('g').attr('opacity',0).attr('transform',d=>`translate(${d.x},${d.y})`),
    up=>up,
    ex=>ex.transition(t).attr('opacity',0).remove()
  ).each(function(d){upd(d3.select(this),d,t);})
   .transition(t).attr('transform',d=>`translate(${d.x},${d.y})`).attr('opacity',d=>d.o??1);
}

/* moving dots: step.fly = [F(x1,y1,x2,y2,colour,{n,gap,dur,r,d0,per,once})], they loop until the step changes */
let flyGen=0;
function flyRun(svg,list){
  const my=++flyGen,fx=svg.select('.fx');
  fx.selectAll('circle').interrupt().remove();
  (list||[]).forEach(f=>{
    const n=f.n??3,gap=f.gap??380,dur=f.dur??1200,per=f.per??Math.max(n*gap+300,dur+300),r=f.r??6;
    const col=f.c==='n'?'muted':f.c==='f'?'fg':(f.c||'a');
    for(let i=0;i<n;i++){
      const dot=fx.append('circle').attr('r',r).attr('cx',f.x1).attr('cy',f.y1).attr('opacity',0)
        .style('fill',`var(--${col})`).style('stroke','var(--surface)').style('stroke-width',1.5);
      const go=delay=>{
        if(my!==flyGen)return;
        dot.attr('cx',f.x1).attr('cy',f.y1).attr('opacity',0)
          .transition().delay(delay).duration(0).attr('opacity',1)
          .transition().duration(dur).ease(d3.easeLinear).attr('cx',f.x2).attr('cy',f.y2)
          .transition().duration(0).attr('opacity',0)
          .on('end',()=>{if(!f.once)go(per-dur);});
      };
      go((f.d0??500)+i*gap);
    }
  });
}

function mount(host,topic){
  const tabs=topic.tabs||[{n:'',steps:topic.steps}];
  host.innerHTML='<div class="tabs"></div><div class="stage"><svg viewBox="0 0 760 240" role="img"><g class="layer"></g><g class="fx"></g></svg></div><div class="cap"></div><div class="ctl"><button class="b prev" type="button">◀</button><button class="b pri next" type="button">Next ▶</button><span class="cnt"></span></div>';
  const svg=d3.select(host).select('svg'),cap=host.querySelector('.cap'),cnt=host.querySelector('.cnt');
  const prev=host.querySelector('.prev'),next=host.querySelector('.next'),tabBox=host.querySelector('.tabs');
  let ti=0,si=0,steps;
  function show(dur){
    draw(svg,stateAt(steps,si),dur);
    flyRun(svg,steps[si].fly);
    cap.innerHTML=steps[si].cap;
    svg.attr('viewBox','0 0 760 '+(steps.vh||240));
    cnt.textContent=`${si+1} / ${steps.length}`;
    prev.disabled=si===0;
    next.textContent=si===steps.length-1?'↻ আবার':'Next ▶';
  }
  function load(i){
    ti=i;si=0;
    const tb=tabs[ti];steps=typeof tb.steps==='function'?tb.steps():tb.steps;
    tabBox.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===ti));
    svg.select('.layer').selectAll('*').interrupt().remove(); /* fresh canvas: old tab's lines (same ids) must not leak into the new one */
    show(0);
  }
  if(tabs.length>1){
    tabs.forEach((tb,i)=>{const b=document.createElement('button');b.type='button';b.textContent=tb.n;b.onclick=()=>load(i);tabBox.appendChild(b);});
  }else tabBox.remove();
  const go=()=>{si=si===steps.length-1?0:si+1;show(600);};
  next.onclick=go;svg.on('click',go);
  prev.onclick=()=>{if(si>0){si--;show(600);}};
  load(0);
}


/* ---------- helpers ---------- */
const N=(id,cx,cy,label,c='a',o={})=>B(id,cx-26,cy-15,52,30,label,c,{s:'sm',...o});
const L=(id,x1,y1,x2,y2,c='n')=>P(id,`M${x1} ${y1}L${x2} ${y2}`,c,{s:'thin'});
const PK=(id,x,y,label,c='o')=>B(id,x,y,Math.max(38,[...label].length*7+12),20,label,c,{s:'sm',rx:5});
const VH=(arr,h)=>{arr.vh=h;return arr;};

/* ===== 1. Network কী ===== */
const WHATNET=VH([
  S('একটা computer একা: ফাইল বা message অন্য computer-এ পাঠানোর কোনো উপায় নেই।',{add:[B('a',60,95,110,50,'Computer A','a'),B('b',590,95,110,50,'Computer B','b')]}),
  S('<b>Network</b> = দুই বা বেশি device (<b>node</b>) যখন একটা <b>link</b> (তার, fibre বা Wi-Fi) দিয়ে জোড়া লেগে data আদান-প্রদান করে।',{add:[L('l',170,120,590,120,'g'),T('t1',380,150,'link (তার / Wi-Fi)',{a:'middle',c:'g'})]}),
  S('Data যায় ছোট ছোট টুকরো <b>packet</b> হয়ে। শুরুতে packet A-তে।',{add:[PK('pk',190,110,'hi')]}),
  S('Packet link ধরে B-তে পৌঁছাল। <b>Protocol</b> (নিয়মের সেট, যেমন TCP/IP, HTTP) ঠিক করে কে কীভাবে কথা বলবে, না হলে দু-পক্ষ একে অপরকে বুঝত না।',{mod:{pk:{x:532},b:{hl:1}}}),
  S('<b>Internet</b> হল আলাদা আলাদা অসংখ্য network-এর জোড়া লাগা রূপ: <b>network of networks</b>। বাড়ির network, office network, ISP network সব router দিয়ে জোড়া।',{del:['a','b','l','t1','pk'],add:[C('n1',150,120,52,'Home\nLAN','a'),C('n2',380,120,52,'ISP','g'),C('n3',610,120,52,'Office\nLAN','b'),L('i1',202,120,328,120,'n'),L('i2',432,120,558,120,'n'),T('t2',380,205,'Internet = network of networks',{a:'middle',c:'f',s:'b'})]})
],250);

/* ===== 2. Types & Topology ===== */
const NETTYPES=VH([

function topoScene(cfg){
  const pos=e=>Array.isArray(e)?e:[cfg.nodes[e][0],cfg.nodes[e][1]];
  const adds=[];
  cfg.links.forEach(([a,b,id],i)=>{const [x1,y1]=pos(a),[x2,y2]=pos(b);adds.push(L(id||'l'+i,x1,y1,x2,y2,'n'));});
  Object.entries(cfg.nodes).forEach(([id,q])=>adds.push(N(id,q[0],q[1],q[2],q[3]||'a')));
  const steps=[S(cfg.c1,{add:adds})];
  const [sx,sy]=pos(cfg.msg[0]);
  steps.push(S(cfg.c2,{add:[PK('pk',sx-19,sy-10,'data')],mod:{[cfg.msg[0]]:{hl:1}}}));
  cfg.msg.slice(1).forEach((e,i)=>{
    const [x,y]=pos(e),prev=cfg.msg[i],m={pk:{x:x-19,y:y-10}};
    if(typeof e==='string')m[e]={hl:1};
    if(typeof prev==='string')m[prev]={hl:0};
    steps.push(S(cfg.hop[i]||'Packet পরের ধাপে যায়।',{mod:m}));
  });
  steps.push(S(cfg.fail,{mod:cfg.failMod}));
  (cfg.extra||[]).forEach(x=>steps.push(x));
  steps.push(S(cfg.pc,{}));
  return VH(steps,250);
}

 ans:'<b>Hub</b> সবাইকে বার্তা ছড়িয়ে দেয় (মাইকে চিৎকারের মতো)। <b>Switch</b> দেখে বার্তা কার জন্য, তারপর শুধু তাকেই দেয়। <b>Router</b> আলাদা আলাদা network জোড়ে, যেমন তোমার বাড়ির network ↔ Internet।',
 pts:['Hub = বোকা, সবাইকে পাঠায়। Switch = বুদ্ধিমান, MAC address দেখে। Router = আরও বুদ্ধিমান, IP address দেখে।','Switch একই network-এর ভেতরে কাজ করে। Router এক network থেকে আরেক network-এ নিয়ে যায়।','তোমার বাড়ির WiFi box আসলে switch আর router একসাথে।'],
 extra:NETDEV_CMP,
 tabs:[{n:'Hub',steps:HUB},{n:'Switch',steps:SWI},{n:'Router',steps:ROU}]},
{part:1,q:'MAC address কী, data কীভাবে send ও receive হয়',
 ans:'<b>MAC address</b> হলো প্রতিটা network card-এর নিজস্ব স্থায়ী <b>ID নম্বর</b> (কারখানায় বসানো)। একই network-এর ভেতরে বার্তা এই MAC দেখে যায়। কারো IP জানা থাকলে তার MAC খুঁজে দেয় <b>ARP</b>।',
 pts:['MAC = নাম (বদলায় না)। IP = বাসার ঠিকানা (জায়গা বদলালে বদলায়)।','ARP মানে সবাইকে জিজ্ঞেস করা: "এই IP কার? তোমার MAC বলো।"','Data যায় ছোট ছোট খামে (frame)। খামের উপরে প্রাপক আর প্রেরকের MAC লেখা থাকে।'],
 tabs:[{n:'MAC address',steps:MACS},{n:'ARP: MAC খোঁজা',steps:ARPS},{n:'খাম পাঠানো ও নেওয়া',steps:FRAME}]},
{part:1,q:'IP address কী; Public, Private, Static ও Dynamic IP',
 ans:'<b>IP address</b> হলো network-এ প্রতিটা device-এর <b>ঠিকানা</b>, বাসার ঠিকানার মতো। <b>Public</b> IP পুরো Internet-এ একমাত্র। <b>Private</b> IP শুধু বাড়ি বা office-এর ভেতরে চলে। <b>Static</b> = স্থির, <b>Dynamic</b> = ধার করা, বদলাতে পারে।',
 pts:['IP-র দুই অংশ: আগের অংশ = কোন পাড়া (network), পরের অংশ = কোন বাড়ি (device)।','Private IP সাধারণত 192.168.x.x বা 10.x.x.x দিয়ে শুরু হয়।','Server বা printer-এ static, ফোন বা laptop-এ dynamic।'],
 extra:PRIV_TBL,
 tabs:[{n:'IP কী',steps:IPWHAT},{n:'Public বনাম Private',steps:PUBPRIV},{n:'Static বনাম Dynamic',steps:STATDYN}]},
{part:1,q:'IPv4 বনাম IPv6',
 ans:'<b>IPv4</b> হলো পুরনো ঠিকানা-পদ্ধতি (প্রায় ৪৩০ কোটি ঠিকানা), যা প্রায় শেষ। <b>IPv6</b> নতুন পদ্ধতি, ঠিকানা এত বেশি যে কখনো ফুরোবে না।',
 pts:['IPv4 দেখতে 192.168.1.10 (৩২ bit)। IPv6 দেখতে 2001:db8::1 (১২৮ bit)।','ঠিকানা কম পড়ায় আমরা NAT দিয়ে জোড়াতালি দিচ্ছি। IPv6-এ তা লাগে না।','আজ দুটোই একসাথে চলে।'],
 extra:V46_TBL,
 tabs:[{n:'দেখতে কেমন',steps:V4V6},{n:'IPv6 কেন এল',steps:V6WHY}]},
{part:1,q:'Subnet mask; Class A, B, C; Classful বনাম Classless (CIDR)',
 ans:'<b>Subnet mask</b> বলে দেয় IP ঠিকানার কতটুকু "পাড়ার নাম" (network) আর কতটুকু "বাড়ির নম্বর" (host)। আগে ঠিকানা A/B/C তিন মাপে কাটা থাকত (<b>classful</b>)। এখন যেকোনো মাপে কাটা যায় (<b>CIDR</b>, যেমন /24)।',
 pts:['/24 মানে প্রথম ২৪ bit network, শেষ ৮ bit host। বসানো যায় 254টা device।','সূত্র: device সংখ্যা = 2^(32−n) − 2।','Subnetting মানে একটা বড় network ভেঙে ছোট ছোট ভাগ করা।'],
 extra:CLASSES_TBL,
 tabs:[{n:'Subnet mask',steps:SUBNET},{n:'Classful (পুরনো)',steps:CLASSFUL},{n:'CIDR (/24, /26)',steps:CIDR}]},
{part:1,sub:'8b',q:'CIDR-এ কোন /n বেশি ব্যবহার হয়',
 ans:'<code>/n</code>-এ ০ থেকে ৩২-এর <b>যেকোনো</b> সংখ্যা বসে (/12, /17, /19 সবই চলে)। বাস্তবে কিছু মাপ বেশি দেখা যায়, সেগুলো মুখস্থ রাখা ভালো। <b>নিয়ম:</b> ছোট সংখ্যা = বড় network (বেশি host), বড় সংখ্যা = ছোট network।',
 pts:['<b>/8, /12, /16, /24</b> interview-তে সবচেয়ে বেশি আসে। /8, /16, /24 পুরনো Class A, B, C-র মাপ।','মাঝের মাপ (/20, /22, /23) cloud (AWS VPC) ও ISP ব্যবহার করে, ঠিক প্রয়োজন অনুযায়ী মাপ নিতে।'],
 extra:'<table class="cmp"><tr><th>/n</th><th>কোথায় দেখা যায়</th></tr>'
  +'<tr><td>/8</td><td>Class A-র মাপ, <code>10.0.0.0/8</code> (বিশাল private network)</td></tr>'
  +'<tr><td>/12</td><td><code>172.16.0.0/12</code> (private range, 172.16–31.x.x)</td></tr>'
  +'<tr><td>/16</td><td>Class B-র মাপ, <code>192.168.0.0/16</code> (private range), VPC/cloud network</td></tr>'
  +'<tr><td>/24</td><td>Class C-র মাপ, বাসা ও office-এর সবচেয়ে সাধারণ LAN, 254 host</td></tr>'
  +'<tr><td>/25, /26, /27</td><td>/24 ভেঙে ছোট subnet বানাতে</td></tr>'
  +'<tr><td>/30</td><td>দুই router-এর link, 2 host</td></tr>'
  +'<tr><td>/32</td><td>একটা মাত্র device</td></tr></table>'},
{part:1,q:'DHCP কী ও কীভাবে কাজ করে',
 ans:'<b>DHCP</b> হলো network-এর স্বয়ংক্রিয় ঠিকানা-বিলিকারী। নতুন device এলে সে নিজে নিজেই IP ঠিকানা (আর দরকারি সেটিং) দিয়ে দেয়। কাজ হয় চার ধাপে: <b>DORA</b>।',
 pts:['<b>D</b>iscover (কেউ আছো?), <b>O</b>ffer (এই IP নাও), <b>R</b>equest (হ্যাঁ, এটা চাই), <b>A</b>cknowledge (ঠিক আছে)।','IP পাওয়া যায় নির্দিষ্ট সময়ের জন্য ধার হিসেবে (lease)।','WiFi-তে connect করলেই যে IP পাও, সেটা DHCP-র কাজ।'],
 tabs:[{n:'DORA',steps:DHCP}]},
{part:1,q:'DNS কীভাবে domain name থেকে IP address resolve করে',
 ans:'<b>DNS</b> হলো Internet-এর ফোনবই। মানুষ নাম মনে রাখে (google.com), computer চেনে নম্বর (IP)। DNS নাম বললে নম্বর বের করে দেয়।',
 pts:['আগে নিজের cache দেখা হয়। না পেলে resolver → Root → TLD (.com) → আসল server, এই পথে খোঁজা হয়।','উত্তর কিছুক্ষণ মনে রাখা হয় (cache + TTL), তাই পরেরবার দ্রুত।','DNS port 53 ব্যবহার করে।'],
 extra:DNS_TBL,
 tabs:[{n:'ধাপে ধাপে খোঁজা',steps:DNSRES},{n:'Recursive, Iterative, TTL',steps:DNSTYPES}]},
{part:1,q:'NAT ও NAT table',
 ans:'<b>NAT</b> হলো router-এর রিসেপশনিস্টের কাজ। বাড়ির সব device-এর private IP, কিন্তু বাইরে একটাই public IP। বাইরে যাওয়ার সময় router ঠিকানা বদলে নেয় আর একটা খাতায় (<b>NAT table</b>) লিখে রাখে কে কী চেয়েছিল, যাতে উত্তর ঠিক জনকে দিতে পারে।',
 pts:['একই public IP, আলাদা port নম্বর দিয়ে router বোঝে কোন উত্তর কার (একে PAT বলে)।','<b>লাভ:</b> IPv4 ঠিকানা বাঁচে, ভেতরের device বাইরে থেকে দেখা যায় না।','<b>লোকসান:</b> বাইরে থেকে ভেতরের device-কে সরাসরি ডাকা কঠিন।'],
 tabs:[{n:'NAT ধাপে ধাপে',steps:NAT}]},
{part:1,q:'DSCP (QoS marking)',
 ans:'<b>DSCP</b> হলো packet-এ লাগানো একটা <b>অগ্রাধিকার স্টিকার</b>। ভিড় হলে router স্টিকার দেখে জরুরি packet (যেমন voice call) আগে ছাড়ে, কম জরুরি (যেমন file download) পরে।',
 pts:['জরুরি = দেরি সহ্য হয় না এমন (voice, video call)। কম জরুরি = বড় download বা backup।','DSCP শুধু একটা অনুরোধ। Router-এর নিয়ম মানলে তবেই কাজ হয়।','Internet-এ প্রায়ই মানা হয় না। নিজের কোম্পানির network-এ বেশি কাজে লাগে।'],
 extra:DSCP_TBL,
 tabs:[{n:'স্টিকার ও লাইন',steps:DSCP}]},
{part:2,q:'Default port: HTTP 80, HTTPS 443, FTP 20/21, DNS 53, SMTP 25',
 ans:'IP বলে কোন machine, <b>port</b> বলে সেই machine-এর কোন service। যেন বাড়ির ঠিকানা (IP) আর ঘরের নম্বর (port)। যেমন HTTPS-এর ঘর 443, তাই browser সেখানেই কড়া নাড়ে।',
 pts:['মুখস্থ রাখো: HTTP 80, HTTPS 443, FTP 20/21, SSH 22, SMTP 25, DNS 53, DHCP 67/68।','Browser নিজের জন্য একটা অস্থায়ী port নেয়, তাই একসাথে অনেক tab কাজ করে।','Socket = IP + port, যেমন 93.184.216.34:443।'],
 extra:PORT_TBL,
 tabs:[{n:'Port ও Socket',steps:PORTS}]},
{part:2,q:'TCP বনাম UDP',
 ans:'<b>TCP</b> হলো রেজিস্ট্রি ডাক: সংযোগ খোলে, হারালে আবার পাঠায়, ক্রম ঠিক রাখে। নির্ভরযোগ্য কিন্তু একটু ধীর। <b>UDP</b> হলো সাধারণ postcard: ছুড়ে দেয়, হারালে কেউ দেখে না। দ্রুত ও হালকা।',
 pts:['<b>TCP:</b> website, email, file পাঠানো, SSH।','<b>UDP:</b> video/voice call, game, live stream, DNS।','মূল পার্থক্য: নির্ভরযোগ্যতা বনাম গতি।'],
 extra:TCPUDP_TBL,
 tabs:[{n:'TCP',steps:TCP},{n:'UDP',steps:UDP},{n:'কখন কোনটা',steps:TCPUDP}]},
{part:2,q:'TCP 3-way handshake',
 ans:'ফোনে আমরা বলি, "হ্যালো, শুনতে পাচ্ছো?" / "হ্যাঁ, তুমি শুনছো?" / "হ্যাঁ, বলো।" TCP-ও data পাঠানোর আগে এই <b>তিন ধাপে</b> সংযোগ খোলে: <b>SYN</b>, <b>SYN-ACK</b>, <b>ACK</b>।',
 pts:['SYN = "আমি কথা বলতে চাই"। SYN-ACK = "ঠিক আছে, তুমিও কি শুনছো?"। ACK = "হ্যাঁ, শুরু করো।"','তিন ধাপে দুজনেই নিশ্চিত হয় যে দুই দিকেই বার্তা পৌঁছায়।','সংযোগ বন্ধ করতেও আলাদা ধাপ আছে (FIN)।'],
 tabs:[{n:'সংযোগ খোলা (3-way)',steps:HAND},{n:'সংযোগ বন্ধ (FIN)',steps:FIN}]},
{part:3,q:'HTTP বনাম HTTPS',
 ans:'<b>HTTP</b> হলো browser আর web server-এর কথা বলার নিয়ম, কিন্তু সব কিছু খোলা postcard-এর মতো পড়া যায়। <b>HTTPS</b> = HTTP + <b>TLS</b>, মানে তালা-দেওয়া খাম: কেউ পড়তে পারে না, বদলালে ধরা পড়ে, আর server আসল কিনা যাচাই হয়।',
 pts:['HTTP-তে browser চায় (request), server দেয় (response)। Request-এর ধরন: GET (পড়া), POST (নতুন পাঠানো), PUT/PATCH (বদলানো), DELETE (মোছা)।','HTTP প্রতিটা request আলাদা ধরে, আগেরটা মনে রাখে না (stateless)।','আজকের সব site-এ HTTPS ব্যবহার করা উচিত (তালার চিহ্ন)।'],
 extra:HTTP_TBL+HTTPS_TBL,
 tabs:[{n:'Request ও Response',steps:HTTPRR},{n:'HTTP বনাম HTTPS',steps:HTTPSATK}]},
{part:3,q:'SSL বনাম TLS',
 ans:'<b>SSL</b> ছিল প্রথম সুরক্ষা-পদ্ধতি, কিন্তু তাতে ফাঁক পাওয়া যায়, তাই বাতিল। <b>TLS</b> তারই নতুন, উন্নত সংস্করণ। লোকে এখনো "SSL certificate" বললেও আসলে TLS চলছে।',
 pts:['SSL 2.0/3.0 আর TLS 1.0/1.1 আজ বাতিল।','ব্যবহার করো <b>TLS 1.2 বা 1.3</b>।','TLS 1.3 সবচেয়ে দ্রুত ও নিরাপদ।'],
 extra:SSLTLS_TBL,
 tabs:[{n:'ইতিহাস',steps:SSLTLS}]},
{part:3,q:'TLS handshake',
 ans:'HTTPS-এর শুরুতে client আর server <b>নিজেদের মধ্যে একটা গোপন চাবি ঠিক করে</b> আর server নিজের <b>পরিচয়পত্র (certificate)</b> দেখায়। এরপর সব data ওই চাবিতে তালা-বন্ধ হয়ে যায়।',
 pts:['ধাপ: ClientHello → ServerHello + certificate → যাচাই → গোপন চাবি তৈরি → তালা-বন্ধ কথা।','চাবি কখনো network দিয়ে পাঠানো হয় না, তাই আড়ি-পাতা জানতে পারে না।','Certificate-এ থাকে বিশ্বাসযোগ্য সংস্থার (CA) সই। browser সেটা মিলিয়ে দেখে।'],
 tabs:[{n:'Handshake (TLS 1.3)',steps:TLSH},{n:'চাবি বানানোর উপমা',steps:TLSKEY},{n:'Certificate ও বিশ্বাসের শিকল',steps:CERT}]},
{part:4,sub:'19a',q:'IP আর subnet mask থেকে Network ID ও Host ID বের করো',
 ans:'<b>নিয়ম:</b> IP আর mask-কে bit ধরে <b>AND</b> করলে <b>Network ID</b> পাওয়া যায়। Host ID হল বাকি (host) অংশ। উদাহরণ: <code>192.168.10.77</code> আর mask <code>255.255.255.192</code> (/26)।',
 pts:['AND: দুটোই 1 হলে 1, নাহলে 0। Mask-এ 255 থাকা octet একই থাকে, 0 থাকা octet 0 হয়ে যায়।','শুধু যে octet-এ mask 255 বা 0 নয় (এখানে ৪র্থ), সেটাতেই হিসাব লাগে।'],
 extra:'<table class="cmp"><tr><th>ধাপ</th><th>কী করব</th><th>হিসাব</th><th>ফল</th></tr><tr><td>1</td><td>/26 থেকে mask</td><td>২৬টা 1 → 255.255.255.<b>192</b></td><td>255.255.255.192</td></tr><tr><td>2</td><td>প্রথম ৩ octet</td><td>mask-এ 255 মানে "যেমন আছে"</td><td>192.168.10</td></tr><tr><td>3</td><td>৪র্থ octet binary</td><td>77 = <code>01001101</code>, 192 = <code>11000000</code></td><td>–</td></tr><tr><td>4</td><td>AND (দুটোই 1 হলে 1)</td><td><code>01001101</code> AND <code>11000000</code> = <code>01000000</code></td><td>64</td></tr><tr><td>5</td><td><b>Network ID</b></td><td>192.168.10 + 64</td><td><b>192.168.10.64</b></td></tr><tr><td>6</td><td><b>Host ID</b> (host অংশ)</td><td><code>01001101</code> AND <code>00111111</code> = <code>001101</code>, বা 77 − 64</td><td><b>13</b></td></tr></table><p style="margin:8px 0 0;font-size:13.5px;color:var(--muted)"><b>শর্টকাট:</b> block size = 256 − 192 = <b>64</b>। 77 কোন গুণিতকের মধ্যে? 64 ≤ 77 &lt; 128, তাই network = .64, host = 77 − 64 = 13। /24 হলে আরও সহজ: <code>192.168.10.77/24</code> → network <code>192.168.10.0</code>, host <code>77</code>।</p>'},
{part:4,sub:'19b',q:'Subnet mask থেকে CIDR (/n) আর CIDR থেকে mask বের করো',
 ans:'<b>Mask → CIDR:</b> mask-এর সব 1 গোনো। <b>CIDR → mask:</b> n টা 1 বসাও, বাকি 0, আর ৮টা করে octet-এ ভাগ করো। প্রতিটা octet-এর মান নিচের ৯টা সংখ্যার একটা।',
 pts:['255 = ৮টা 1, 0 = একটাও 1 নেই। মাঝেরটা আংশিক: 128, 192, 224, 240, 248, 252, 254।','Interview-তে প্রায়ই আসে: <code>255.255.240.0</code> কত CIDR?'],
 extra:'<table class="cmp"><tr><th>দেওয়া</th><th>octet-গুলোর bit গোনা</th><th>যোগ</th><th>ফল</th></tr><tr><td><code>255.255.240.0</code> → CIDR</td><td>255 = 8, 255 = 8, 240 = <code>11110000</code> = 4, 0 = 0</td><td>8 + 8 + 4 + 0</td><td><b>/20</b></td></tr><tr><td><code>/27</code> → mask</td><td>27 = 8 + 8 + 8 + <b>3</b>; ৪র্থ octet-এ ৩টা 1 = <code>11100000</code></td><td>128 + 64 + 32</td><td><b>255.255.255.224</b></td></tr><tr><td><code>/19</code> → mask</td><td>19 = 8 + 8 + <b>3</b>; ৩য় octet = <code>11100000</code></td><td>128 + 64 + 32</td><td><b>255.255.224.0</b></td></tr></table><table class="cmp"><tr><th>এক octet-এ 1-এর সংখ্যা</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><td>মান</td><td>128</td><td>192</td><td>224</td><td>240</td><td>248</td><td>252</td><td>254</td><td>255</td></tr></table><p style="margin:8px 0 0;font-size:13.5px;color:var(--muted)">এই ৯টা সংখ্যাই mask-এর octet-এ আসতে পারে (128 থেকে ডানে যোগ: 128, 128+64, 128+64+32 …)।</p>'},
{part:4,sub:'19c',q:'Network ID, Broadcast, First ও Last usable host আর host সংখ্যা বের করো',
 ans:'<b>ফর্মুলা:</b> block size = 256 − mask-এর আংশিক octet। IP কোন block-এ পড়ে সেটা দেখো। Block-এর <b>প্রথম = Network ID</b>, <b>শেষ = Broadcast</b>। এর মাঝের সব <b>usable host</b>: first = network + 1, last = broadcast − 1, সংখ্যা = 2^(host bit) − 2।',
 pts:['<code>192.168.10.77/26</code> আর Cisco forum-এর পরিচিত প্রশ্ন <code>182.44.82.16/26</code> দেখো।','/27 হলে block size 32, ঠিক একই পদ্ধতি।'],
 extra:'<table class="cmp"><tr><th></th><th><code>192.168.10.77/26</code></th><th><code>182.44.82.16/26</code></th><th><code>192.168.20.100/27</code></th></tr><tr><td>Block size (256 − mask)</td><td>256 − 192 = <b>64</b></td><td><b>64</b></td><td>256 − 224 = <b>32</b></td></tr><tr><td>কোন block-এ</td><td>64 ≤ 77 &lt; 128 → <b>.64–.127</b></td><td>0 ≤ 16 &lt; 64 → <b>.0–.63</b></td><td>96 ≤ 100 &lt; 128 → <b>.96–.127</b></td></tr><tr><td>Network ID (block-এর শুরু)</td><td>192.168.10.<b>64</b></td><td>182.44.82.<b>0</b></td><td>192.168.20.<b>96</b></td></tr><tr><td>Broadcast (পরের block − 1)</td><td>128 − 1 = <b>.127</b></td><td>64 − 1 = <b>.63</b></td><td>128 − 1 = <b>.127</b></td></tr><tr><td>First usable (network + 1)</td><td><b>.65</b></td><td><b>.1</b></td><td><b>.97</b></td></tr><tr><td>Last usable (broadcast − 1)</td><td><b>.126</b></td><td><b>.62</b></td><td><b>.126</b></td></tr><tr><td>Usable host = 2^(host bit) − 2</td><td>2⁶ − 2 = <b>62</b></td><td>2⁶ − 2 = <b>62</b></td><td>2⁵ − 2 = <b>30</b></td></tr></table><p style="margin:8px 0 0;font-size:13.5px;color:var(--muted)"><b>প্রশ্নের চালাকি:</b> "192.168.1.0 বা 192.168.1.255 কি /24-এ কোনো device-কে দেওয়া যায়?" না। প্রথমটা network ID, শেষটা broadcast, দুটোই সংরক্ষিত।</p>'},
{part:4,sub:'19d',q:'N টা host লাগলে কোন subnet mask নেব',
 ans:'<b>পদ্ধতি:</b> host সংখ্যার সাথে ২ যোগ করো (network ID আর broadcast-এর জন্য)। তারপর সেই সংখ্যার <b>সমান বা বড়</b> সবচেয়ে ছোট ২-এর ঘাত খোঁজো। সেই ঘাতই host bit। <b>prefix = 32 − host bit</b>।',
 pts:['উদাহরণ ৫০০ host: 500 + 2 = 502 → 512 = 2⁹ → host bit 9 → /23 → 255.255.254.0।','দুই router-এর point-to-point link-এ /30 (২টা host)।'],
 extra:'<table class="cmp"><tr><th>কত host লাগবে</th><th>+২ (network, broadcast)</th><th>২-এর ঘাত (≥)</th><th>host bit</th><th>prefix = 32 − host bit</th><th>mask</th></tr><tr><td>500</td><td>502</td><td>512 = 2⁹</td><td>9</td><td><b>/23</b></td><td>255.255.254.0</td></tr><tr><td>1000</td><td>1002</td><td>1024 = 2¹⁰</td><td>10</td><td><b>/22</b></td><td>255.255.252.0</td></tr><tr><td>100</td><td>102</td><td>128 = 2⁷</td><td>7</td><td><b>/25</b></td><td>255.255.255.128</td></tr><tr><td>50</td><td>52</td><td>64 = 2⁶</td><td>6</td><td><b>/26</b></td><td>255.255.255.192</td></tr><tr><td>30</td><td>32</td><td>32 = 2⁵</td><td>5</td><td><b>/27</b></td><td>255.255.255.224</td></tr><tr><td>2 (দুই router-এর link)</td><td>4</td><td>4 = 2²</td><td>2</td><td><b>/30</b></td><td>255.255.255.252</td></tr></table><p style="margin:8px 0 0;font-size:13.5px;color:var(--muted)"><b>সাবধান:</b> 30 host লাগলে /27 ঠিক (32 − 2 = 30)। 31 host লাগলে /27 যথেষ্ট নয়, /26 নিতে হবে।</p>'},
{part:4,sub:'19e',q:'একটা network-কে N টা subnet-এ ভাঙো (Subnetting)',
 ans:'<b>পদ্ধতি:</b> N টা subnet-এর জন্য 2^b ≥ N হয় এমন <b>b bit host অংশ থেকে ধার</b> নাও। নতুন prefix = পুরনো prefix + b। এরপর block size ধরে প্রতিটা subnet-এর network, first, last, broadcast লেখো। উদাহরণ: <code>192.168.1.0/24</code> → ৪টা subnet।',
 pts:['প্রতিটা subnet-এ host কমে, কিন্তু broadcast domain আলাদা হয়: traffic ও security ভালো।','একই subnet কিনা বোঝার সহজ উপায়: দুই IP একই block-এ পড়ে কিনা দেখো।'],
 extra:'<table class="cmp"><tr><th>Subnet</th><th>Network ID</th><th>First usable</th><th>Last usable</th><th>Broadcast</th><th>Usable</th></tr><tr><td>1</td><td>192.168.1.<b>0</b></td><td>.1</td><td>.62</td><td>.63</td><td>62</td></tr><tr><td>2</td><td>192.168.1.<b>64</b></td><td>.65</td><td>.126</td><td>.127</td><td>62</td></tr><tr><td>3</td><td>192.168.1.<b>128</b></td><td>.129</td><td>.190</td><td>.191</td><td>62</td></tr><tr><td>4</td><td>192.168.1.<b>192</b></td><td>.193</td><td>.254</td><td>.255</td><td>62</td></tr></table><p style="margin:10px 0 4px"><b>হিসাব:</b> ৪টা subnet → 2² = 4 → <b>২ bit ধার</b> (borrow) → নতুন prefix = 24 + 2 = <b>/26</b> → mask 255.255.255.192 → block size 64। একইভাবে /16 থেকে 1024 subnet → 2¹⁰ → ১০ bit → <b>/26</b>।</p><table class="cmp"><tr><th>দুই IP একই subnet-এ?</th><th>হিসাব</th><th>ফল</th></tr><tr><td><code>192.168.1.50</code> ও <code>192.168.1.70</code> (/26)</td><td>50 → block .0–.63, 70 → block .64–.127</td><td><b>আলাদা subnet</b>, কথা বলতে router লাগবে</td></tr><tr><td><code>192.168.1.10</code> ও <code>192.168.1.60</code> (/26)</td><td>দুটোই .0–.63 এর মধ্যে</td><td><b>একই subnet</b>, সরাসরি switch দিয়ে</td></tr></table>'}
];

/* ---------- build page ---------- */
const app=document.getElementById('app'),partsNav=document.getElementById('parts');
PARTS.forEach((pt,i)=>{const a=document.createElement('a');a.href='#p'+i;a.innerHTML=`<b>${pt[0]}</b>${pt[1]}`;partsNav.appendChild(a);
  const sec=document.createElement('section');sec.className='part';sec.id='p'+i;sec.innerHTML=`<h2><span>${pt[0]}</span>${pt[1]}</h2>`;app.appendChild(sec);});
let qn=0;
TOPICS.forEach((t,i)=>{
  const lab=t.sub||++qn;
  const card=document.createElement('article');card.className='q';card.id='q'+lab;
  card.innerHTML=`<h3><span class="num">${lab}</span><span>${t.q}</span></h3><p class="ans">${t.ans}</p>${t.pts&&t.pts.length?'<ul>'+t.pts.map(x=>`<li>${x}</li>`).join('')+'</ul>':''}${t.extra?`<div class="extra">${t.extra}</div>`:''}<div class="viz"></div>`;
  document.getElementById('p'+t.part).appendChild(card);
  if(t.tabs)mount(card.querySelector('.viz'),t);else card.querySelector('.viz').remove();
});
</script>
