const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KW=new Set('if else for while do return break continue switch case default goto try catch throw'.split(' '));
const KW2=new Set('const auto struct class operator template typename using namespace new delete static public private protected inline constexpr true false nullptr this decltype define virtual override'.split(' '));
const TY=new Set('int long double float char bool void unsigned signed short size_t string vector stack queue deque map set unordered_map unordered_set multiset multimap priority_queue pair tuple bitset list array greater less function stringstream TreeNode ListNode Node ll'.split(' '));
function hl(code){
  const re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(#include)([ \t]*)(<[^>\n]+>|"[^"\n]+")|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(#\s*\w+)|(\b\d[\w.]*)|([A-Za-z_]\w*)|([\s\S])/g;
  let out='',m;
  while((m=re.exec(code))){
    if(m[1]) out+=`<span class="tc">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="tk2">${m[2]}</span>${m[3]}<span class="ts">${esc(m[4])}</span>`;
    else if(m[5]) out+=`<span class="ts">${esc(m[5])}</span>`;
    else if(m[6]) out+=`<span class="tk2">${esc(m[6])}</span>`;
    else if(m[7]) out+=`<span class="tn">${esc(m[7])}</span>`;
    else if(m[8]){const w=m[8];
      let c='';
      if(KW.has(w)) c='tk2';
      else if(KW2.has(w)) c='tk';
      else if(TY.has(w)||w=='std') c='tt';
      else if(/^[A-Z][A-Z0-9_]{2,}$/.test(w)) c='tconst';
      else if(code[re.lastIndex]=='(') c='tf';
      else c='tv';
      out+=`<span class="${c}">${w}</span>`;}
    else out+=esc(m[9]);
  }
  return out;
}

ms.count(5);                 // 2
ms.erase(ms.find(5));        // একটা 5 মোছে
ms.erase(5);                 // সব 5 মোছে`}]},

{id:'stack',t:'5. stack, queue, deque',cards:[
{h:'stack (LIFO)',f:'hot',s:'pop() কিছু return করে না, আগে top() নাও।',c:`stack<int> st;
st.push(x);   st.emplace(x);
st.top();                       // দেখো
st.pop();                       // ফেলো (return করে না)
st.empty();  st.size();

while(!st.empty()){ int t = st.top(); st.pop(); }`},
{h:'queue (FIFO)',f:'hot',c:`queue<int> q;
q.push(x);   q.emplace(x);
q.front();   q.back();
q.pop();                        // front ফেলে, return করে না
q.empty();  q.size();

// BFS level order
queue<TreeNode*> q;  q.push(root);
while(!q.empty()){
    int sz = q.size();          // এই level-এ কয়টা node
    for(int i = 0; i < sz; i++){
        auto n = q.front(); q.pop();
        if(n->left)  q.push(n->left);
        if(n->right) q.push(n->right);
    }
}`},
{h:'deque (দুই মাথা থেকে push/pop)',f:'hot',c:`deque<int> dq;
dq.push_back(x);   dq.push_front(x);
dq.pop_back();     dq.pop_front();
dq.front();        dq.back();
dq[i];             dq.size();   dq.empty();   dq.clear();

// sliding window maximum (index-এর monotonic deque)
deque<int> d; vector<int> res;
for(int i = 0; i < n; i++){
    if(!d.empty() && d.front() <= i - k) d.pop_front();
    while(!d.empty() && nums[d.back()] <= nums[i]) d.pop_back();
    d.push_back(i);
    if(i >= k - 1) res.push_back(nums[d.front()]);
}`}]},

{id:'pq',t:'6. priority_queue',cards:[
{h:'max heap, min heap',f:'hot',s:'default max heap (top = সবচেয়ে বড়)। min heap-এর জন্য greater<> দাও। push/pop O(log n), top O(1)। iterate করা যায় না।',c:`priority_queue<int> maxH;                                  // max heap
priority_queue<int, vector<int>, greater<int>> minH;       // min heap

maxH.push(5);   maxH.emplace(9);
maxH.top();     maxH.pop();
maxH.size();    maxH.empty();

// pair: first দিয়ে compare, সমান হলে second
priority_queue<pair<int,int>> pm;                          // max
priority_queue<pair<int,int>, vector<pair<int,int>>, greater<pair<int,int>>> pn;   // min
pn.push({dist, node});                                     // Dijkstra

// vector থেকে heap
priority_queue<int> h1(v.begin(), v.end());
priority_queue<int, vector<int>, greater<int>> h2(v.begin(), v.end());

maxH.push(-x);  int val = -maxH.top();                     // min heap-এর shortcut
pq = priority_queue<int>();                                // clear`},
{h:'vector (3 element) heap: 1st / 2nd / 3rd value ধরে',f:'hot',s:'priority_queue-তে comparator sort-এর উল্টো: cmp(x,y) true মানে x নিচে যায়। তাই x[i] > y[i] দিলে min heap, x[i] < y[i] দিলে max heap।',c:`struct cmpMin1{  bool operator()(const vector<int>& x, const vector<int>& y) const { return x[0] > y[0]; } };  // 1st min
struct cmpMax1{  bool operator()(const vector<int>& x, const vector<int>& y) const { return x[0] < y[0]; } };  // 1st max
struct cmpMin2{  bool operator()(const vector<int>& x, const vector<int>& y) const { return x[1] > y[1]; } };  // 2nd min
struct cmpMax2{  bool operator()(const vector<int>& x, const vector<int>& y) const { return x[1] < y[1]; } };  // 2nd max
struct cmpMin3{  bool operator()(const vector<int>& x, const vector<int>& y) const { return x[2] > y[2]; } };  // 3rd min
struct cmpMax3{  bool operator()(const vector<int>& x, const vector<int>& y) const { return x[2] < y[2]; } };  // 3rd max

priority_queue<vector<int>, vector<vector<int>>, cmpMin2> pq;
pq.push({1, 5, 3});  pq.push({2, 2, 9});
pq.top();                          // {2, 2, 9}  (2nd value সবচেয়ে ছোট)

// multi-key: 1st min, সমান হলে 2nd max, সমান হলে 3rd min
struct cmpMulti{
    bool operator()(const vector<int>& x, const vector<int>& y) const {
        if(x[0] != y[0]) return x[0] > y[0];
        if(x[1] != y[1]) return x[1] < y[1];
        return x[2] > y[2];
    }
};

// lambda version
auto cmp = [](const vector<int>& x, const vector<int>& y){ return x[0] > y[0]; };
priority_queue<vector<int>, vector<vector<int>>, decltype(cmp)> pq2(cmp);`},
{h:'struct + operator< দিয়ে heap',f:'hot',s:'struct-এর ভিতরে operator< লিখলে comparator আলাদা দিতে হয় না। এখানেও উল্টো: a < o.a দিলে max heap, a > o.a দিলে min heap।',c:`struct Node{
    int a, b, c;
    bool operator<(const Node& o) const { return a < o.a; }   // a বড় আগে (max heap)
};
priority_queue<Node> pq;
pq.push({1, 2, 3});

struct Node2{
    int a, b, c;
    bool operator<(const Node2& o) const { return a > o.a; }  // a ছোট আগে (min heap)
};

// multi-key: a min, সমান হলে b max, সমান হলে c min
struct Node3{
    int a, b, c;
    bool operator<(const Node3& o) const {
        if(a != o.a) return a > o.a;
        if(b != o.b) return b < o.b;
        return c > o.c;
    }
};`},
{h:'Top-K pattern',f:'rare',c:`// K-th largest  -> size k-এর MIN heap
priority_queue<int, vector<int>, greater<int>> h;
for(int x : nums){ h.push(x); if(h.size() > k) h.pop(); }
int kth = h.top();

// K-th smallest -> size k-এর MAX heap
// Merge K sorted lists   -> min heap of {val, listIdx}
// Task scheduler         -> max heap of {count, char}
// Median of stream       -> maxHeap (নিচের অর্ধেক) + minHeap (উপরের অর্ধেক)`}]},
