function hl(code){
  const re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(#include)([ \t]*)(<[^>\n]+>|"[^"\n]+")|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(#\s*\w+)|(\b\d[\w.]*)|([A-Za-z_]\w*)|([\s\S])/g;
  let out='',m;
  while((m=re.exec(code))){
    if(m[1]) out+=`<span class="tc">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="tk2">${m[2]}</span>${m[3]}<span class="ts">${esc(m[4])}</span>`;
    else if(m[5]) out+=`<span class="ts">${esc(m[5])}</span>`;
    else if(m[6]) out+=`<span class="tk2">${esc(m[6])}</span>`;
    else if(m[7]) out+=`<span class="tn">${esc(m[7])}</span>`;
    else if(m[8]){const w=m[8];
      let c='';
      if(KW.has(w)) c='tk2';
      else if(KW2.has(w)) c='tk';
      else if(TY.has(w)||w=='std') c='tt';
      else if(/^[A-Z][A-Z0-9_]{2,}$/.test(w)) c='tconst';
      else if(code[re.lastIndex]=='(') c='tf';
      else c='tv';
      out+=`<span class="${c}">${w}</span>`;}
    else out+=esc(m[9]);
  }
  return out;
}

{h:'vector (3 element) heap: 1st / 2nd / 3rd value ধরে',f:'hot',s:'priority_queue-তে comparator sort-এর উল্টো: cmp(x,y) true মানে x নিচে যায়। তাই x[i] > y[i] দিলে min heap, x[i] < y[i] দিলে max heap।',c:`struct cmpMin1{  bool operator()(const vector<int>& x, const vector<int>& y) const { return x[0] > y[0]; } };

        if(x[1] != y[1]) return x[1] < y[1];
        return x[2] > y[2];
    }
};

auto cmp = [](const vector<int>& x, const vector<int>& y){ return x[0] > y[0]; };

        if(a != o.a) return a > o.a;
        if(b != o.b) return b < o.b;
        return c > o.c;
    }
};`},
